<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Questions d'architecture des ordinateurs : mémoires, processeur, voyages des données, programmes et culture numérique. Choisissez une question pour afficher sa réponse.">
<title>Questions pour aller plus loin · Gymnase — Frédéric Jaccard</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2320241F'/%3E%3Ctext x='32' y='43' font-family='Arial,sans-serif' font-size='28' font-weight='bold' fill='%23FFFFFF' text-anchor='middle'%3EFJ%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Quattrocento+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBFAF6; --card:#F7F6F2; --primary:#155E4C; --primaryLight:#E3F0EA;
  --accent:#D96A08; --accentLight:#FDEBD8; --line:#D8D5CB; --ink:#20241F; --muted:#6E726B;
  --error:#C84B31;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:"Quattrocento Sans",sans-serif;padding:20px;max-width:900px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px;margin-bottom:16px}
.kicker{font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
h1{font-size:26px;color:var(--primary)}
.hdrBtns{display:flex;gap:8px}
button{font-family:inherit;font-size:14px;font-weight:700;padding:8px 16px;border-radius:10px;
  border:2px solid var(--primary);background:var(--card);color:var(--primary);cursor:pointer}
button:hover{background:var(--primaryLight)}
button:disabled{opacity:.4;cursor:default}
button:disabled:hover{background:var(--card)}
.instruction{background:var(--primaryLight);border-radius:12px;padding:12px 16px;margin-bottom:16px;font-size:15px}
footer{margin-top:20px;text-align:center;color:var(--muted);font-size:13px}
footer a{color:var(--muted);font-weight:400;text-decoration:none}
footer a:hover{text-decoration:underline}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}
.chip{font-size:13px;font-weight:700;padding:6px 12px;border-radius:999px;
  border:2px solid var(--primary);background:var(--card);color:var(--primary)}
.chip:hover{background:var(--primaryLight)}
.chip.active{background:var(--primary);color:#fff}
.counter{font-size:13px;color:var(--muted);margin-bottom:14px}

.themeName{color:var(--primary);font-weight:700;font-size:17px;margin:16px 0 8px}
.qitem{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;
  text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:10px;
  padding:12px 16px;margin-bottom:8px;font-size:15px;font-weight:400;color:var(--ink);
  min-height:44px;line-height:1.4}
.qitem:hover{background:var(--primaryLight)}
.dot{width:11px;height:11px;border-radius:50%;border:1.5px solid var(--line);flex:none}
.dot.on{background:var(--primary);border-color:var(--primary)}

.dTheme{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
.dTitle{font-size:23px;font-weight:700;color:var(--primary);margin-bottom:16px;line-height:1.3}
.para{font-size:15px;line-height:1.55;margin-bottom:12px}
.rows{margin-bottom:14px}
.row{display:flex;gap:16px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.rlab{min-width:180px;max-width:180px;font-weight:700;color:var(--primary)}
.rtxt{flex:1;font-size:15px;line-height:1.5}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.dcard{background:var(--card);border-radius:12px;padding:14px 16px}
.dcard.green{background:var(--primaryLight);border:1px solid var(--primary)}
.dh{font-weight:700;color:var(--primary);margin-bottom:8px}
.dcard p{font-size:15px;line-height:1.5;margin-bottom:8px}
.dcard p:last-child{margin-bottom:0}
.callout{background:var(--accentLight);border:1.5px solid var(--accent);border-radius:12px;
  padding:14px 18px;font-size:16px;line-height:1.5;margin-top:4px}
.detailNav{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
.detailNav .spacer{flex:1}
#backListBtn{margin-bottom:14px}

@media(max-width:640px){
  body{padding:14px}
  h1{font-size:22px}
  .hdrBtns{width:100%}
  button{min-height:44px}
  .cards{grid-template-columns:1fr}
  .row{flex-direction:column;gap:2px}
  .rlab{max-width:none;min-width:0}
  .dTitle{font-size:20px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>

<script>
const $ = id => document.getElementById(id);
const DATA = {"themes":{"mem":{"fr":"Mémoires et stockage","en":"Memory and storage"},"cpu":{"fr":"Le processeur","en":"The processor"},"voy":{"fr":"Voyages et liaisons","en":"Data journeys and connections"},"vie":{"fr":"La vie quotidienne","en":"Everyday life"},"prog":{"fr":"Programmes et système","en":"Programs and the system"},"cult":{"fr":"Énergie, histoire et culture","en":"Energy, history and culture"},"ref":{"fr":"Repères","en":"Key reference points"}},"order":["mem","cpu","voy","vie","prog","cult","ref"],"slides":[{"id":"03_ssd_hdd","theme":"mem","fr":{"q":"Comment SSD et disque dur gardent-ils les données sans courant ?","blocks":[{"t":"cards","cards":[["Le disque dur (HDD)",["Des <strong>plateaux magnétiques</strong> qui tournent sous une tête de lecture. Chaque zone est aimantée dans un sens (0) ou dans l’autre (1) — comme des mini-boussoles qui gardent leur direction.","Mécanique : plus lent, sensible aux chocs… mais très bon marché au téraoctet."]],["Le SSD",["De la <strong>mémoire flash</strong> : des électrons emprisonnés dans de minuscules « cages » entourées d’isolant. Piégés, ils restent là des années sans courant.","Aucune pièce en mouvement : rapide, silencieux, robuste — mais plus cher au gigaoctet."]]],"green":["2"]},{"t":"callout","h":"<strong>À retenir :</strong> les deux conservent les données ordinateur éteint, par des moyens différents. On vend plus de SSD que de disques durs… mais l’essentiel des données reste sur disques."}]},"en":{"q":"How do SSDs and hard drives keep data without power?","blocks":[{"t":"cards","cards":[["The hard drive (HDD)",["Spinning <strong>magnetic platters</strong> under a read head. Each area is magnetised one way (0) or the other (1) — like tiny compass needles that keep their direction.","Mechanical: slower, sensitive to shocks… but very cheap per terabyte."]],["The SSD",["<strong>Flash memory</strong>: electrons trapped in microscopic “cages” surrounded by insulator. Trapped, they stay there for years without power.","No moving parts: fast, silent, sturdy — but more expensive per gigabyte."]]],"green":["2"]},{"t":"callout","h":"<strong>Remember:</strong> both keep data when the computer is off, by different means. More SSDs than hard drives are sold… but most of the world’s data still sits on disks."}]}},{"id":"04_ram_oublie","theme":"mem","fr":{"q":"Pourquoi la RAM oublie-t-elle tout, et pas le SSD ?","blocks":[{"t":"cards","cards":[["La RAM (mémoire de travail)",["Chaque bit est une minuscule charge électrique dans un condensateur… <strong>qui fuit</strong> en quelques millisecondes. Il faut la recharger sans arrêt, des milliers de fois par seconde.","Courant coupé → tout s’évapore instantanément."]],["Le SSD (mémoire flash)",["Chaque bit est un paquet d’<strong>électrons enfermés dans une cage</strong> entourée d’isolant. Rien ne fuit : les électrons restent piégés des années, sans courant.","Ordinateur éteint → les données restent."]]],"green":["2"]},{"t":"callout","h":"<strong>À retenir :</strong> volatile ou permanent n’est pas une question de volonté, mais de physique : une charge qui fuit contre des électrons en cage."}]},"en":{"q":"Why does RAM forget everything — and the SSD doesn’t?","blocks":[{"t":"cards","cards":[["RAM (working memory)",["Each bit is a tiny electric charge in a capacitor… <strong>which leaks away</strong> within milliseconds. It must be recharged constantly, thousands of times per second.","Power cut → everything evaporates instantly."]],["The SSD (flash memory)",["Each bit is a packet of <strong>electrons locked in a cage</strong> surrounded by insulator. Nothing leaks: the electrons stay trapped for years, without power.","Computer off → the data stays."]]],"green":["2"]},{"t":"callout","h":"<strong>Remember:</strong> volatile or permanent is not a matter of choice but of physics: a leaking charge versus caged electrons."}]}},{"id":"05_memoire_ou_stockage","theme":"mem","fr":{"q":"« Mon téléphone a 128 Go de mémoire » — vrai ou faux ?","blocks":[{"t":"cards","cards":[["Ce que dit la publicité",["« 128 Go de mémoire » : en réalité, c’est le <strong>stockage</strong> — le placard où dorment photos, applications et système, même éteint.","Grand, permanent, mais relativement lent."]],["La vraie mémoire vive",["La RAM de votre téléphone fait plutôt <strong>4 à 16 Go</strong> : c’est le plan de travail, vidé à l’extinction.","Beaucoup plus petite, mais des centaines de fois plus rapide d’accès."]]],"green":["2"]},{"t":"callout","h":"<strong>À retenir :</strong> dans les publicités, « mémoire » désigne presque toujours le stockage. Pour comparer deux appareils, cherchez la ligne « RAM »."}]},"en":{"q":"“My phone has 128 GB of memory” — true or false?","blocks":[{"t":"cards","cards":[["What the advert says",["“128 GB of memory”: in reality, that’s the <strong>storage</strong> — the cupboard where photos, apps and the system sleep, even when off.","Large, permanent, but relatively slow."]],["The real working memory",["Your phone’s RAM is more like <strong>4 to 16 GB</strong>: the worktop, wiped clean at shutdown.","Much smaller, but hundreds of times faster to access."]]],"green":["2"]},{"t":"callout","h":"<strong>Remember:</strong> in adverts, “memory” almost always means storage. To compare two devices, look for the “RAM” line."}]}},{"id":"06_ram_pleine","theme":"mem","fr":{"q":"Que se passe-t-il quand la RAM est pleine ?","blocks":[{"t":"p","h":"Chaque application et chaque onglet ouvert occupe une part de la RAM. Quand le plan de travail est plein, le système dépanne en posant provisoirement une partie du travail… <strong>sur le stockage</strong>."},{"t":"p","h":"Mais le stockage est des centaines de fois plus lent que la RAM : d’où les saccades. <strong>Fermer des applications libère le plan de travail</strong> et rend la machine fluide."},{"t":"callout","h":"<strong>À retenir :</strong> « l’ordinateur rame » veut souvent dire « le plan de travail est plein ». La RAM se libère en fermant des programmes, pas en supprimant des fichiers."}]},"en":{"q":"What happens when the RAM is full?","blocks":[{"t":"p","h":"Every open app and browser tab takes up part of the RAM. When the worktop is full, the system makes do by temporarily putting part of the work… <strong>onto the storage</strong>."},{"t":"p","h":"But storage is hundreds of times slower than RAM: hence the stuttering. <strong>Closing apps frees the worktop</strong> and makes the machine fluid again."},{"t":"callout","h":"<strong>Remember:</strong> “the computer is lagging” often means “the worktop is full”. RAM is freed by closing programs, not by deleting files."}]}},{"id":"07_duree_de_vie","theme":"mem","fr":{"q":"Combien de temps les données survivent-elles, machine éteinte ?","blocks":[{"t":"rows","rows":[["RAM","quelques millisecondes : sans rafraîchissement, tout s’évapore aussitôt"],["SSD / clé USB","des années : les électrons s’échappent lentement de leur cage (plus vite s’il fait chaud)"],["Disque dur","des décennies : l’aimantation se dégrade très lentement"],["Bandes magnétiques","conçues pour durer : encore utilisées pour les très grandes archives"]]},{"t":"callout","h":"<strong>À retenir :</strong> paradoxe — le support le plus moderne (SSD) n’est pas le plus durable éteint. Pour archiver vingt ans : le disque, la bande… et surtout plusieurs copies."}]},"en":{"q":"How long does data survive with the machine off?","blocks":[{"t":"rows","rows":[["RAM","a few milliseconds: without refreshing, everything evaporates at once"],["SSD / USB stick","years: the electrons slowly escape their cage (faster when warm)"],["Hard drive","decades: the magnetisation degrades very slowly"],["Magnetic tapes","built to last: still used for the very largest archives"]]},{"t":"callout","h":"<strong>Remember:</strong> paradox — the most modern medium (SSD) is not the most durable when off. To archive for twenty years: disk, tape… and above all several copies."}]}},{"id":"08_histoire_memoires","theme":"mem","fr":{"q":"Comment stockait-on les données avant le SSD ?","blocks":[{"t":"rows","rows":[["Années 1950","cartes perforées et bandes : on poinçonne, on déroule"],["Années 1970","la disquette : le stockage devient transportable"],["Années 1980","le disque dur entre dans les PC : des mégaoctets !"],["Années 2000","CD, DVD, clés USB : le gigaoctet dans la poche"]]},{"t":"callout","h":"<strong>À retenir :</strong> le besoin n’a jamais changé — conserver, puis retrouver. Seuls la vitesse, la taille et le prix ont explosé… dans le bon sens."}]},"en":{"q":"How was data stored before the SSD?","blocks":[{"t":"rows","rows":[["1950s","punched cards and tapes: punch, then unroll"],["1970s","the floppy disk: storage becomes portable"],["1980s","the hard drive enters PCs: megabytes!"],["2000s","CDs, DVDs, USB sticks: the gigabyte in your pocket"]]},{"t":"callout","h":"<strong>Remember:</strong> the need has never changed — keep, then retrieve. Only speed, size and price have exploded… in the right direction."}]}},{"id":"09_mot_ram","theme":"mem","fr":{"q":"Pourquoi « accès aléatoire » ?","blocks":[{"t":"p","h":"Sur une bande magnétique ou une cassette audio, retrouver un morceau oblige à <strong>dérouler depuis le début</strong> : l’accès est <strong>séquentiel</strong>."},{"t":"p","h":"La RAM fait l’inverse : chaque case a une adresse, et le processeur y accède <strong>directement, dans n’importe quel ordre</strong> — en anglais <em>random access memory</em>."},{"t":"callout","h":"<strong>À retenir :</strong> « aléatoire » ne veut pas dire « au hasard », mais « où je veux, tout de suite ». C’est ce qui rend le plan de travail si pratique."}]},"en":{"q":"Why “random access”?","blocks":[{"t":"p","h":"On a magnetic tape or audio cassette, finding a track means <strong>unrolling from the start</strong>: access is <strong>sequential</strong>."},{"t":"p","h":"RAM does the opposite: every cell has an address, and the processor reaches it <strong>directly, in any order</strong> — <em>random access memory</em>."},{"t":"callout","h":"<strong>Remember:</strong> “random” doesn’t mean “by chance”, but “wherever I want, right away”. That’s what makes the worktop so handy."}]}},{"id":"10_cpu_ou_ram","theme":"cpu","fr":{"q":"Une donnée passe-t-elle d’abord par le CPU ou par la RAM ?","blocks":[{"t":"rows","rows":[["Ouvrir, charger","Stockage <span style=\"color:var(--primary)\"><strong>→</strong></span> RAM <span style=\"color:var(--primary)\"><strong>→</strong></span> CPU — on sort d’abord les ingrédients du placard"],["Taper, cliquer","Entrée <span style=\"color:var(--primary)\"><strong>→</strong></span> CPU <span style=\"color:var(--primary)\"><strong>→</strong></span> RAM — le cuisinier réceptionne, puis pose sur le plan"],["Enregistrer","RAM <span style=\"color:var(--primary)\"><strong>→</strong></span> Stockage — on range le travail au placard"]]},{"t":"callout","h":"<strong>À retenir :</strong> le processeur ne travaille que sur ce qui est en RAM. Charger une donnée : RAM <strong>d’abord</strong>. Recevoir une entrée : CPU <strong>d’abord</strong>."}]},"en":{"q":"Does data go through the CPU or the RAM first?","blocks":[{"t":"rows","rows":[["Open, load","Storage <span style=\"color:var(--primary)\"><strong>→</strong></span> RAM <span style=\"color:var(--primary)\"><strong>→</strong></span> CPU — the ingredients come out of the cupboard first"],["Type, click","Input <span style=\"color:var(--primary)\"><strong>→</strong></span> CPU <span style=\"color:var(--primary)\"><strong>→</strong></span> RAM — the cook receives it, then sets it on the worktop"],["Save","RAM <span style=\"color:var(--primary)\"><strong>→</strong></span> Storage — the work goes back to the cupboard"]]},{"t":"callout","h":"<strong>Remember:</strong> the processor only works on what is in RAM. Loading data: RAM <strong>first</strong>. Receiving input: CPU <strong>first</strong>."}]}},{"id":"11_cache","theme":"cpu","fr":{"q":"À quoi sert le cache du processeur ?","blocks":[{"t":"p","h":"Le processeur est trop rapide pour attendre la RAM : il garde des <strong>copies des données du moment</strong> dans un cache, une mémoire minuscule mais ultra-rapide, à l’intérieur de la puce."},{"t":"rows","rows":[["Registres","dans les mains du cuisinier — quelques valeurs, accès immédiat"],["Caches L1 et L2","la planche à découper — propres à chaque cœur, de quelques ko à 1 Mo environ"],["Cache L3","l’étagère commune — partagé entre tous les cœurs, quelques Mo"],["RAM","le plan de travail — 8 à 32 Go, déjà beaucoup plus lent"],["Stockage (SSD)","le placard — 128 Go à 1 To, le plus lent de la chaîne"]]},{"t":"callout","h":"<strong>À retenir :</strong> plus une mémoire est rapide, plus elle est petite et chère. La machine est organisée en étages : registres <strong>→</strong> caches <strong>→</strong> RAM <strong>→</strong> stockage."}]},"en":{"q":"What is the processor’s cache for?","blocks":[{"t":"p","h":"The processor is too fast to wait for the RAM: it keeps <strong>copies of the data of the moment</strong> in a cache, a tiny but ultra-fast memory inside the chip."},{"t":"rows","rows":[["Registers","in the cook’s hands — a few values, immediate access"],["L1 and L2 caches","the chopping board — private to each core, a few KB to about 1 MB"],["L3 cache","the shared shelf — shared by all cores, a few MB"],["RAM","the worktop — 8 to 32 GB, already much slower"],["Storage (SSD)","the cupboard — 128 GB to 1 TB, the slowest in the chain"]]},{"t":"callout","h":"<strong>Remember:</strong> the faster a memory, the smaller and dearer it is. The machine is organised in tiers: registers <strong>→</strong> caches <strong>→</strong> RAM <strong>→</strong> storage."}]}},{"id":"12_coeurs","theme":"cpu","fr":{"q":"À quoi servent les cœurs d’un processeur ?","blocks":[{"t":"p","h":"Un processeur « 8 cœurs » contient <strong>8 processeurs complets</strong> qui travaillent vraiment en parallèle."},{"t":"cards","cards":[["À chacun le sien",["Unité de commande, UAL, registres, caches L1 et L2 : chaque cœur a <strong>ses mains et sa planche à découper</strong>."]],["En commun",["Cache L3, RAM, bus, stockage : <strong>un seul plan de travail et un seul placard</strong> pour tous les cuisiniers."]]],"green":["2"]},{"t":"p","h":"Encore faut-il du travail à découper : retoucher 1000 photos se partage bien ; une suite d’étapes dépendantes, non — on ne cuit pas le plat avant d’avoir épluché les légumes."},{"t":"callout","h":"<strong>Piège :</strong> 8 cœurs à 3 GHz ≠ 24 GHz ! Les cœurs travaillent <strong>côte à côte</strong>, pas l’un après l’autre : chacun reste à 3 GHz — c’est le nombre de tâches simultanées qui augmente."}]},"en":{"q":"What are a processor’s cores for?","blocks":[{"t":"p","h":"An “8-core” processor contains <strong>8 complete processors</strong> that genuinely work in parallel."},{"t":"cards","cards":[["Each has its own",["Control unit, ALU, registers, L1 and L2 caches: each core has <strong>its own hands and chopping board</strong>."]],["Shared",["L3 cache, RAM, buses, storage: <strong>one single worktop and one single cupboard</strong> for all the cooks."]]],"green":["2"]},{"t":"p","h":"You still need work that can be split: retouching 1,000 photos shares out well; a chain of dependent steps does not — you can’t cook the dish before peeling the vegetables."},{"t":"callout","h":"<strong>Pitfall:</strong> 8 cores at 3 GHz ≠ 24 GHz! Cores work <strong>side by side</strong>, not one after another: each stays at 3 GHz — it’s the number of simultaneous tasks that grows."}]}},{"id":"13_ghz","theme":"cpu","fr":{"q":"3 GHz contre 4 GHz : qui gagne ?","blocks":[{"t":"p","h":"Le GHz mesure le <strong>rythme</strong> : 4 milliards de cycles par seconde contre 3. Mais tout dépend de ce que le processeur accomplit <strong>à chaque cycle</strong>."},{"t":"p","h":"Travail par cycle, nombre de cœurs, taille du cache : un processeur au tempo plus lent peut faire plus à chaque battement — et gagner la course."},{"t":"callout","h":"<strong>À retenir :</strong> le GHz, c’est le tempo du chef d’orchestre — pas la qualité de l’orchestre. On ne compare les GHz qu’à génération égale."}]},"en":{"q":"3 GHz versus 4 GHz: which wins?","blocks":[{"t":"p","h":"GHz measures the <strong>tempo</strong>: 4 billion cycles per second versus 3. But everything depends on what the processor accomplishes <strong>at each cycle</strong>."},{"t":"p","h":"Work per cycle, number of cores, cache size: a processor with a slower tempo can do more with each beat — and win the race."},{"t":"callout","h":"<strong>Remember:</strong> GHz is the conductor’s tempo — not the quality of the orchestra. Only compare GHz within the same generation."}]}},{"id":"14_hyperthreading","theme":"cpu","fr":{"q":"Comment un cœur fait-il deux choses à la fois ?","blocks":[{"t":"p","h":"Un cœur passe une partie de son temps à <strong>attendre</strong> — une donnée qui arrive de la RAM, par exemple. L’hyperthreading lui donne <strong>deux files d’instructions</strong> : dès que l’une attend, il avance sur l’autre."},{"t":"p","h":"Résultat : le système « voit » deux processeurs par cœur. Gain réel : <strong>20 à 30 %</strong> — pas le double : les mains restent les mêmes."},{"t":"callout","h":"<strong>À retenir :</strong> 8 cœurs avec hyperthreading = 16 processeurs logiques à l’écran… mais seulement 8 paires de mains dans la cuisine."}]},"en":{"q":"How does one core do two things at once?","blocks":[{"t":"p","h":"A core spends part of its time <strong>waiting</strong> — for data arriving from RAM, for instance. Hyperthreading gives it <strong>two instruction queues</strong>: as soon as one waits, it moves ahead on the other."},{"t":"p","h":"Result: the system “sees” two processors per core. Real gain: <strong>20 to 30%</strong> — not double: the hands stay the same."},{"t":"callout","h":"<strong>Remember:</strong> 8 cores with hyperthreading = 16 logical processors on screen… but only 8 pairs of hands in the kitchen."}]}},{"id":"15_gpu","theme":"cpu","fr":{"q":"Pourquoi le GPU a-t-il des milliers de cœurs ?","blocks":[{"t":"p","h":"Là où le CPU aligne quelques cœurs très polyvalents, la carte graphique en aligne <strong>des milliers, très simples</strong>, qui font tous le même petit calcul en même temps."},{"t":"p","h":"Parfait pour les images : des millions de pixels à traiter d’un coup. Tellement pratique que <strong>l’IA lui doit aussi sa vitesse</strong> : des calculs simples, en très grand nombre."},{"t":"callout","h":"<strong>À retenir :</strong> CPU = quelques cuisiniers polyvalents ; GPU = une brigade immense, spécialisée dans un seul geste répété des millions de fois."}]},"en":{"q":"Why does the GPU have thousands of cores?","blocks":[{"t":"p","h":"Where the CPU lines up a few highly versatile cores, the graphics card lines up <strong>thousands of very simple ones</strong>, all performing the same small calculation at once."},{"t":"p","h":"Perfect for images: millions of pixels to process in one go. So handy that <strong>AI also owes it its speed</strong>: simple calculations, in huge numbers."},{"t":"callout","h":"<strong>Remember:</strong> CPU = a few versatile cooks; GPU = a huge brigade specialised in a single gesture repeated millions of times."}]}},{"id":"16_vonneumann_harvard","theme":"cpu","fr":{"q":"Von Neumann ou Harvard : une seule mémoire ou deux ?","blocks":[{"t":"cards","cards":[["Von Neumann (1945)",["<strong>Une seule mémoire</strong> pour les instructions et les données.","Flexible : la machine est <strong>programmable</strong>. Ordinateurs, téléphones, consoles."]],["Harvard",["<strong>Deux mémoires séparées</strong> : une pour les instructions, une pour les données — et deux bus.","On lit une instruction et une donnée <strong>en même temps</strong> : rapide, mais rigide. Microcontrôleurs, appareils embarqués."]]],"green":["1"]},{"t":"p","h":"Dans la pratique, vos machines sont von Neumann vues de l’extérieur… et un peu Harvard à l’intérieur : le cache L1 est souvent séparé en deux, un pour les instructions, un pour les données."},{"t":"callout","h":"<strong>À retenir :</strong> Harvard = spécialisé et rapide pour une tâche répétée ; von Neumann = polyvalent et programmable. Votre portable : von Neumann."}]},"en":{"q":"Von Neumann or Harvard: one memory or two?","blocks":[{"t":"cards","cards":[["Von Neumann (1945)",["<strong>One single memory</strong> for instructions and data.","Flexible: the machine is <strong>programmable</strong>. Computers, phones, consoles."]],["Harvard",["<strong>Two separate memories</strong>: one for instructions, one for data — and two buses.","An instruction and a datum are read <strong>at the same time</strong>: fast, but rigid. Microcontrollers, embedded devices."]]],"green":["1"]},{"t":"p","h":"In practice, your machines are von Neumann seen from the outside… and a bit Harvard inside: the L1 cache is often split in two, one for instructions, one for data."},{"t":"callout","h":"<strong>Remember:</strong> Harvard = specialised and fast for a repeated task; von Neumann = versatile and programmable. Your laptop: von Neumann."}]}},{"id":"17_voyage_son","theme":"voy","fr":{"q":"Comment un fichier MP3 devient-il du son ?","blocks":[{"t":"rows","rows":[["Entrée","le microphone transforme l’air qui vibre en signal électrique"],["Stockage","le signal devient des 0 et des 1 dans un fichier MP3"],["Traitement","le processeur lit le fichier et décode le son, bloc par bloc"],["Sortie","le haut-parleur retransforme le signal en air qui vibre"]]},{"t":"callout","h":"<strong>À retenir :</strong> entre le micro et le haut-parleur, le son a été dématérialisé en nombres : tant qu’il voyage dans l’ordinateur, ce ne sont que des 0 et des 1."}]},"en":{"q":"How does an MP3 file become sound?","blocks":[{"t":"rows","rows":[["Input","the microphone turns vibrating air into an electrical signal"],["Storage","the signal becomes 0s and 1s in an MP3 file"],["Processing","the processor reads the file and decodes the sound, block by block"],["Output","the loudspeaker turns the signal back into vibrating air"]]},{"t":"callout","h":"<strong>Remember:</strong> between microphone and loudspeaker, the sound was dematerialised into numbers: as long as it travels through the computer, it is nothing but 0s and 1s."}]}},{"id":"18_ecran_60hz","theme":"voy","fr":{"q":"Pourquoi l’écran affiche-t-il image après image ?","blocks":[{"t":"p","h":"Votre écran n’affiche pas une image fixe : il la <strong>redessine entièrement 60 fois par seconde</strong> — certains écrans montent à 120 ou 144 fois."},{"t":"p","h":"Une image fixe est donc déjà un film très rapide. Pour animer, l’ordinateur calcule une <strong>nouvelle</strong> image à chaque passage : s’il n’arrive plus à suivre, l’affichage saccade."},{"t":"callout","h":"<strong>À retenir :</strong> 60 Hz = 60 dessins complets par seconde. Une animation fluide, c’est une course contre la montre perpétuelle entre le processeur et l’écran."}]},"en":{"q":"Why does the screen display image after image?","blocks":[{"t":"p","h":"Your screen doesn’t show a fixed image: it <strong>redraws it entirely 60 times per second</strong> — some screens go up to 120 or 144 times."},{"t":"p","h":"A still image is therefore already a very fast film. To animate, the computer computes a <strong>new</strong> image on every pass: if it can’t keep up, the display stutters."},{"t":"callout","h":"<strong>Remember:</strong> 60 Hz = 60 complete drawings per second. Smooth animation is a perpetual race between the processor and the screen."}]}},{"id":"19_carte_mere","theme":"voy","fr":{"q":"À quoi sert la carte mère ?","blocks":[{"t":"p","h":"Processeur, mémoire, stockage, entrées et sorties : tous ces blocs doivent se parler. La <strong>carte mère</strong> est la grande plaque qui les relie tous — l’autoroute de l’ordinateur."},{"t":"p","h":"Les pistes qu’on y voit ne sont pas de la décoration : ce sont des <strong>routes de données</strong>. Et certains ordinateurs tiennent sur une carte pas plus grande qu’une carte bancaire."},{"t":"callout","h":"<strong>À retenir :</strong> aucun composant ne fonctionne seul : tous sont branchés sur la même plaque, qui transporte données, instructions… et électricité."}]},"en":{"q":"What is the motherboard for?","blocks":[{"t":"p","h":"Processor, memory, storage, inputs and outputs: all these blocks must talk to each other. The <strong>motherboard</strong> is the large board connecting them all — the computer’s motorway."},{"t":"p","h":"The tracks you see on it are not decoration: they are <strong>data roads</strong>. And some computers fit on a board no bigger than a bank card."},{"t":"callout","h":"<strong>Remember:</strong> no component works alone: all are plugged into the same board, which carries data, instructions… and electricity."}]}},{"id":"20_clavier","theme":"voy","fr":{"q":"Le clavier envoie-t-il des lettres ?","blocks":[{"t":"p","h":"Chaque touche a un <strong>numéro</strong>. Quand vous appuyez, le clavier n’envoie pas une lettre, mais ce numéro — et un autre signal quand vous relâchez."},{"t":"p","h":"C’est l’ordinateur qui traduit ensuite : « touche 30 » devient <strong>a</strong>… ou <strong>q</strong>, selon la disposition choisie ! C’est pour cela qu’un même clavier physique peut être AZERTY ou QWERTZ."},{"t":"callout","h":"<strong>À retenir :</strong> une entrée, ce n’est jamais qu’un signal codé en nombres. Toute la signification est décidée par l’ordinateur, pas par le clavier."}]},"en":{"q":"Does the keyboard send letters?","blocks":[{"t":"p","h":"Every key has a <strong>number</strong>. When you press it, the keyboard doesn’t send a letter but this number — and another signal when you release it."},{"t":"p","h":"The computer then translates: “key 30” becomes <strong>a</strong>… or <strong>q</strong>, depending on the chosen layout! That’s why the same physical keyboard can be AZERTY or QWERTZ."},{"t":"callout","h":"<strong>Remember:</strong> an input is never more than a signal encoded in numbers. All the meaning is decided by the computer, not by the keyboard."}]}},{"id":"21_wifi","theme":"voy","fr":{"q":"Le Wi-Fi est-il une entrée ou une sortie ?","blocks":[{"t":"p","h":"Par le Wi-Fi, votre ordinateur peut <strong>recevoir</strong> des données… mais aussi <strong>en envoyer</strong> : chaque recherche, chaque message part par la même porte."},{"t":"p","h":"Et quand vous ouvrez un document « dans le cloud », le voyage continue : le fichier quitte votre machine, traverse internet et revient affiché à l’écran."},{"t":"callout","h":"<strong>À retenir :</strong> le Wi-Fi est à la fois une entrée et une sortie — un tuyau dans les deux sens, qui prolonge le voyage de la donnée bien au-delà de la boîte."}]},"en":{"q":"Is Wi-Fi an input or an output?","blocks":[{"t":"p","h":"Through Wi-Fi, your computer can <strong>receive</strong> data… but also <strong>send</strong> it: every search, every message leaves through the same door."},{"t":"p","h":"And when you open a document “in the cloud”, the journey continues: the file leaves your machine, crosses the internet and comes back displayed on screen."},{"t":"callout","h":"<strong>Remember:</strong> Wi-Fi is both an input and an output — a two-way pipe that extends the data’s journey far beyond the box."}]}},{"id":"22_capteurs","theme":"vie","fr":{"q":"Quels capteurs se cachent dans votre téléphone ?","blocks":[{"t":"rows","rows":[["Il vous écoute","microphone — et caméra pour vous voir"],["Il vous sent","accéléromètre et gyroscope : chaque pas, chaque rotation est mesuré"],["Il vous suit","GPS : votre position à quelques mètres près, en continu"],["Il vous touche","écran tactile : des dizaines de contacts par seconde"]]},{"t":"callout","h":"<strong>À retenir :</strong> un smartphone, c’est un ordinateur complet entouré d’une dizaine de capteurs — des entrées que votre PC n’a pas."}]},"en":{"q":"Which sensors hide in your phone?","blocks":[{"t":"rows","rows":[["It listens to you","microphone — and a camera to see you"],["It feels you","accelerometer and gyroscope: every step, every rotation is measured"],["It tracks you","GPS: your position within a few metres, continuously"],["It feels your touch","touchscreen: dozens of contacts per second"]]},{"t":"callout","h":"<strong>Remember:</strong> a smartphone is a complete computer surrounded by about ten sensors — inputs your PC doesn’t have."}]}},{"id":"23_voiture","theme":"vie","fr":{"q":"Combien d’ordinateurs se cachent dans une voiture ?","blocks":[{"t":"p","h":"Moteur, freins, airbags, direction, écran central, ouverture des portes : une voiture récente embarque <strong>des dizaines d’ordinateurs spécialisés</strong>, chacun avec son processeur, sa mémoire, ses capteurs."},{"t":"p","h":"Ils se parlent par un réseau interne. Le freinage d’urgence, par exemple, est décidé par un ordinateur — <strong>bien plus vite qu’un humain</strong>."},{"t":"callout","h":"<strong>À retenir :</strong> vous ne conduisez pas avec un ordinateur, mais au milieu de dizaines d’ordinateurs qui se coordonnent en permanence."}]},"en":{"q":"How many computers hide in a car?","blocks":[{"t":"p","h":"Engine, brakes, airbags, steering, central screen, door locks: a recent car carries <strong>dozens of specialised computers</strong>, each with its processor, memory and sensors."},{"t":"p","h":"They talk to each other over an internal network. Emergency braking, for example, is decided by a computer — <strong>far faster than a human</strong>."},{"t":"callout","h":"<strong>Remember:</strong> you don’t drive with one computer, but surrounded by dozens of computers coordinating all the time."}]}},{"id":"24_ordinateur_deguise","theme":"vie","fr":{"q":"Une console, une box, une montre : des ordinateurs ?","blocks":[{"t":"p","h":"Console de jeux, box internet, montre connectée, téléviseur, lave-linge : <strong>cherchez les quatre blocs</strong> — entrées, traitement, mémoire/stockage, sorties."},{"t":"p","h":"S’ils y sont, c’est un ordinateur, même s’il ne fait qu’un seul métier. Une console est un ordinateur déguisé ; votre box internet aussi."},{"t":"callout","h":"<strong>À retenir :</strong> ce n’est pas la forme qui fait l’ordinateur, mais l’architecture : quatre blocs présents = ordinateur, quel que soit le déguisement."}]},"en":{"q":"A console, a router, a watch: computers?","blocks":[{"t":"p","h":"Games console, internet router, connected watch, TV, washing machine: <strong>look for the four blocks</strong> — inputs, processing, memory/storage, outputs."},{"t":"p","h":"If they’re all there, it’s a computer, even if it does only one job. A console is a computer in disguise; so is your internet router."},{"t":"callout","h":"<strong>Remember:</strong> it’s not the shape that makes a computer, but the architecture: four blocks present = computer, whatever the disguise."}]}},{"id":"25_souris","theme":"vie","fr":{"q":"Une souris est-elle un ordinateur ?","blocks":[{"t":"p","h":"Une souris contient une petite caméra qui photographie le bureau des milliers de fois par seconde, et une puce qui compare les images pour en déduire le mouvement."},{"t":"p","h":"Capteur en entrée, puce qui traite, petite mémoire, signal vers le PC en sortie : <strong>les quatre blocs sont là</strong> — dans quelque chose qui tient dans la main et coûte quelques francs."},{"t":"callout","h":"<strong>À retenir :</strong> les ordinateurs ne sont pas rares et précieux : ils se cachent partout, dès qu’il faut sentir, calculer et transmettre."}]},"en":{"q":"Is a mouse a computer?","blocks":[{"t":"p","h":"A mouse contains a tiny camera that photographs the desk thousands of times per second, and a chip that compares the images to work out the movement."},{"t":"p","h":"Sensor as input, a chip that processes, a small memory, a signal to the PC as output: <strong>all four blocks are there</strong> — in something that fits in your hand and costs a few francs."},{"t":"callout","h":"<strong>Remember:</strong> computers are not rare and precious: they hide everywhere, wherever something must sense, compute and transmit."}]}},{"id":"26_cloud","theme":"vie","fr":{"q":"« C’est dans le cloud » — c’est où, ça ?","blocks":[{"t":"p","h":"« Le cloud » n’est pas un endroit magique : ce sont des <strong>salles immenses remplies d’ordinateurs</strong> — les centres de données — reliés à internet, quelque part sur la planète."},{"t":"p","h":"Vos photos « dans le cloud » sont stockées sur des disques durs et des SSD… <strong>chez quelqu’un d’autre</strong>, souvent en plusieurs copies, dans plusieurs pays."},{"t":"callout","h":"<strong>À retenir :</strong> « dans le cloud » = « sur l’ordinateur de quelqu’un d’autre ». Mêmes blocs, même physique — seule l’adresse change."}]},"en":{"q":"“It’s in the cloud” — where’s that?","blocks":[{"t":"p","h":"“The cloud” is not a magical place: it is <strong>huge halls filled with computers</strong> — data centres — connected to the internet, somewhere on the planet."},{"t":"p","h":"Your photos “in the cloud” are stored on hard drives and SSDs… <strong>on someone else’s machines</strong>, often in several copies, in several countries."},{"t":"callout","h":"<strong>Remember:</strong> “in the cloud” = “on someone else’s computer”. Same blocks, same physics — only the address changes."}]}},{"id":"27_systeme_exploitation","theme":"prog","fr":{"q":"À quoi sert le système d’exploitation ?","blocks":[{"t":"p","h":"Windows, macOS, Linux, Android, iOS : le <strong>système d’exploitation</strong> est un programme spécial, toujours présent, qui organise tout le reste."},{"t":"p","h":"Il distribue le temps du processeur entre les applications, gère la mémoire, les fichiers et les périphériques — et donne à chacun un plan de travail sans que les autres y mettent les doigts."},{"t":"callout","h":"<strong>À retenir :</strong> le système d’exploitation est le maître d’hôtel de la machine : il ne cuisine pas lui-même, mais sans lui, aucun autre programme ne peut travailler."}]},"en":{"q":"What is the operating system for?","blocks":[{"t":"p","h":"Windows, macOS, Linux, Android, iOS: the <strong>operating system</strong> is a special program, always present, that organises everything else."},{"t":"p","h":"It shares the processor’s time between applications, manages memory, files and devices — and gives everyone a worktop without the others meddling with it."},{"t":"callout","h":"<strong>Remember:</strong> the operating system is the machine’s maître d’hôtel: it doesn’t cook itself, but without it no other program can work."}]}},{"id":"28_qui_est_qui","theme":"prog","fr":{"q":"Application, système, pilote : qui fait quoi ?","blocks":[{"t":"rows","rows":[["Applications","les programmes que vous choisissez : navigateur, jeux, traitement de texte"],["Système","l’organisateur toujours présent : il gère fichiers, mémoire et temps de calcul"],["Pilotes","les traducteurs : chacun sait parler à un périphérique précis (imprimante, carte graphique…)"]]},{"t":"callout","h":"<strong>À retenir :</strong> quand vous « installez une imprimante », vous installez surtout son pilote : le programme qui apprend au système à lui parler."}]},"en":{"q":"Application, system, driver: who does what?","blocks":[{"t":"rows","rows":[["Applications","the programs you choose: browser, games, word processor"],["System","the ever-present organiser: it manages files, memory and computing time"],["Drivers","the translators: each one knows how to talk to one specific device (printer, graphics card…)"]]},{"t":"callout","h":"<strong>Remember:</strong> when you “install a printer”, you mainly install its driver: the program that teaches the system how to talk to it."}]}},{"id":"29_virus","theme":"prog","fr":{"q":"Pourquoi un virus est-il possible ?","blocks":[{"t":"p","h":"Dans l’architecture de von Neumann, programme et données partagent la même mémoire. C’est ce qui rend la machine si souple…"},{"t":"p","h":"…et c’est aussi la porte d’entrée des virus : une « donnée » piégée (une image, un document) peut en réalité contenir des <strong>instructions</strong> que la machine se met à exécuter."},{"t":"callout","h":"<strong>À retenir :</strong> un virus n’est pas une magie noire : c’est un programme qui profite du fait que données et instructions vivent dans la même mémoire."}]},"en":{"q":"Why is a virus possible?","blocks":[{"t":"p","h":"In von Neumann architecture, programs and data share the same memory. That’s what makes the machine so flexible…"},{"t":"p","h":"…and it’s also the viruses’ way in: a booby-trapped “datum” (an image, a document) can actually contain <strong>instructions</strong> that the machine starts executing."},{"t":"callout","h":"<strong>Remember:</strong> a virus is not black magic: it is a program that exploits the fact that data and instructions live in the same memory."}]}},{"id":"30_plantage","theme":"prog","fr":{"q":"Pourquoi un programme plante-t-il ?","blocks":[{"t":"p","h":"Le processeur ne devine rien : il exécute les instructions <strong>une par une, dans l’ordre</strong>. Si une instruction l’envoie lire une adresse interdite ou boucler sans fin…"},{"t":"p","h":"…le programme se fige ou plante. L’ordinateur n’est pas « en panne » : il obéit aveuglément à une suite d’instructions mal écrite."},{"t":"callout","h":"<strong>À retenir :</strong> un plantage n’est jamais une décision de la machine : c’est une conséquence logique d’instructions qui mènent dans l’impasse."}]},"en":{"q":"Why does a program crash?","blocks":[{"t":"p","h":"The processor never guesses: it executes instructions <strong>one by one, in order</strong>. If an instruction sends it to read a forbidden address or loop forever…"},{"t":"p","h":"…the program freezes or crashes. The computer is not “broken”: it blindly obeys a badly written sequence of instructions."},{"t":"callout","h":"<strong>Remember:</strong> a crash is never the machine’s decision: it’s the logical consequence of instructions that lead into a dead end."}]}},{"id":"31_installer","theme":"prog","fr":{"q":"Pourquoi faut-il installer un programme ?","blocks":[{"t":"p","h":"Un programme téléchargé arrive sous forme <strong>compressée</strong> — une valise pliée. L’installation la déplie et range chaque fichier à sa place sur le stockage."},{"t":"p","h":"Elle prévient aussi le système d’exploitation : nouveau programme, nouvelles associations de fichiers, raccourci dans le menu. Sans cette mise en place, le programme resterait introuvable."},{"t":"callout","h":"<strong>À retenir :</strong> installer = déplier la valise, ranger les fichiers et prévenir le système. C’est pour cela que « supprimer le raccourci » ne désinstalle rien."}]},"en":{"q":"Why must a program be installed?","blocks":[{"t":"p","h":"A downloaded program arrives in <strong>compressed</strong> form — a folded suitcase. Installation unfolds it and puts every file in its place on the storage."},{"t":"p","h":"It also notifies the operating system: new program, new file associations, a shortcut in the menu. Without this setting up, the program would remain untraceable."},{"t":"callout","h":"<strong>Remember:</strong> installing = unfolding the suitcase, tidying the files and notifying the system. That’s why “deleting the shortcut” uninstalls nothing."}]}},{"id":"32_firmware","theme":"prog","fr":{"q":"Pourquoi peut-on mettre à jour une console ?","blocks":[{"t":"p","h":"Console, four, box internet : leur programme de base est rangé dans une <strong>mémoire qui survit à l’extinction</strong>. Il s’efface et se réécrit : c’est ce qui permet les mises à jour."},{"t":"p","h":"Ce programme installé à demeure porte un nom : le <strong>micrologiciel</strong> (firmware). Ni tout à fait matériel, ni tout à fait logiciel — un logiciel soudé à la machine."},{"t":"callout","h":"<strong>À retenir :</strong> le stockage flash réinscriptible a changé la donne : autrefois gravé pour toujours, le programme de base se met désormais à jour comme les autres."}]},"en":{"q":"Why can a console be updated?","blocks":[{"t":"p","h":"Console, oven, internet router: their basic program is stored in a <strong>memory that survives power-off</strong>. It can be erased and rewritten: that’s what makes updates possible."},{"t":"p","h":"This permanently installed program has a name: <strong>firmware</strong>. Neither quite hardware nor quite software — software welded to the machine."},{"t":"callout","h":"<strong>Remember:</strong> rewritable flash storage changed everything: once engraved forever, the basic program now updates like any other."}]}},{"id":"33_boot","theme":"prog","fr":{"q":"Qui charge le premier programme ?","blocks":[{"t":"p","h":"À l’allumage, la RAM est vide : aucun programme à exécuter. Qui charge donc le premier ? Un <strong>petit programme gravé dans la machine</strong>, qui survit à l’extinction."},{"t":"p","h":"Son travail : vérifier le matériel, trouver le système d’exploitation sur le stockage, le copier en RAM… puis <strong>lui passer la main</strong>. C’est l’amorçage — boot en anglais."},{"t":"callout","h":"<strong>À retenir :</strong> l’ordinateur démarre tout seul grâce à un programme-grain d’entrée : le premier maillon d’une chaîne qui s’étire jusqu’à l’écran d’accueil."}]},"en":{"q":"Who loads the first program?","blocks":[{"t":"p","h":"At power-up, the RAM is empty: no program to run. So who loads the first one? A <strong>small program engraved in the machine</strong>, which survives power-off."},{"t":"p","h":"Its job: check the hardware, find the operating system on the storage, copy it into RAM… then <strong>hand over to it</strong>. This is bootstrapping — boot for short."},{"t":"callout","h":"<strong>Remember:</strong> the computer starts by itself thanks to a seed program: the first link in a chain that stretches all the way to the home screen."}]}},{"id":"34_eteindre","theme":"prog","fr":{"q":"Que se passe-t-il quand on clique « Éteindre » ?","blocks":[{"t":"p","h":"Quand vous cliquez « Éteindre », le système ne coupe pas le courant d’un coup : il demande à chaque programme de <strong>se fermer proprement</strong>, enregistre ce qui doit l’être, puis met tout le monde dehors."},{"t":"p","h":"Forcer l’arrêt (bouton maintenu) interrompt ce rangement : une écriture sur le stockage peut rester à moitié faite — d’où les fichiers abîmés."},{"t":"callout","h":"<strong>À retenir :</strong> « Éteindre » est une procédure, pas un interrupteur : on laisse le système ranger avant de couper le courant."}]},"en":{"q":"What happens when you click “Shut down”?","blocks":[{"t":"p","h":"When you click “Shut down”, the system doesn’t cut the power abruptly: it asks every program to <strong>close properly</strong>, saves what must be saved, then shows everyone out."},{"t":"p","h":"Forcing shutdown (holding the button) interrupts this tidying: a write to storage can be left half-done — hence damaged files."},{"t":"callout","h":"<strong>Remember:</strong> “Shut down” is a procedure, not a switch: let the system tidy up before the power is cut."}]}},{"id":"35_chaleur","theme":"cult","fr":{"q":"Pourquoi l’ordinateur chauffe-t-il ?","blocks":[{"t":"p","h":"Chaque calcul fait circuler du courant dans des milliards d’interrupteurs microscopiques — et une partie de cette électricité se perd <strong>en chaleur</strong>. Calculer, c’est chauffer : c’est inévitable."},{"t":"p","h":"D’où les ventilateurs, les grilles et les ailettes métalliques : tout ce matériel ne sert qu’à <strong>évacuer les calories</strong> du processeur avant qu’il ne ralentisse pour se protéger."},{"t":"callout","h":"<strong>À retenir :</strong> un ordinateur qui chauffe travaille ; un ordinateur qui surchauffe freine. L’air doit circuler : pas de PC posé sur la couette !"}]},"en":{"q":"Why does the computer heat up?","blocks":[{"t":"p","h":"Every calculation sends current through billions of microscopic switches — and part of that electricity is lost <strong>as heat</strong>. Computing means heating: it’s unavoidable."},{"t":"p","h":"Hence the fans, vents and metal fins: all that hardware serves only to <strong>remove the processor’s calories</strong> before it slows down to protect itself."},{"t":"callout","h":"<strong>Remember:</strong> a warm computer is working; an overheating computer slows down. Air must circulate: no laptop on the duvet!"}]}},{"id":"36_alimentation","theme":"cult","fr":{"q":"Quel composant ne transporte aucune donnée ?","blocks":[{"t":"p","h":"Ouvrez un PC de bureau : au fond, un gros bloc métallique. Ce n’est ni une entrée, ni une sortie, ni du traitement, ni du stockage : c’est <strong>l’alimentation</strong>."},{"t":"p","h":"Son unique travail : transformer le courant de la prise en tensions propres et stables pour chaque composant. Sans elle, rien ne démarre — mais <strong>aucune donnée ne la traverse</strong>."},{"t":"callout","h":"<strong>À retenir :</strong> les quatre blocs décrivent le voyage des données ; l’alimentation est la cinquième roue indispensable, celle qui apporte l’énergie."}]},"en":{"q":"Which component carries no data?","blocks":[{"t":"p","h":"Open a desktop PC: at the back, a big metal block. It’s neither an input, nor an output, nor processing, nor storage: it’s the <strong>power supply</strong>."},{"t":"p","h":"Its only job: turning the mains current into clean, steady voltages for every component. Without it, nothing starts — but <strong>no data flows through it</strong>."},{"t":"callout","h":"<strong>Remember:</strong> the four blocks describe the journey of data; the power supply is the indispensable fifth wheel, the one that brings the energy."}]}},{"id":"37_histoire_80ans","theme":"cult","fr":{"q":"Quel âge a l’idée de l’ordinateur ?","blocks":[{"t":"rows","rows":[["1945","von Neumann décrit la machine à programme enregistré : instructions et données dans la même mémoire"],["Années 1950","les premiers ordinateurs remplissent des salles entières"],["1981","le PC entre dans les foyers et les bureaux"],["2007","l’iPhone : l’ordinateur complet tient dans une poche"]]},{"t":"callout","h":"<strong>À retenir :</strong> 80 ans de progrès vertigineux — et pourtant votre téléphone fonctionne exactement sur le principe décrit par von Neumann en 1945."}]},"en":{"q":"How old is the idea of the computer?","blocks":[{"t":"rows","rows":[["1945","von Neumann describes the stored-program machine: instructions and data in the same memory"],["1950s","the first computers fill entire rooms"],["1981","the PC enters homes and offices"],["2007","the iPhone: a complete computer fits in a pocket"]]},{"t":"callout","h":"<strong>Remember:</strong> 80 years of dizzying progress — and yet your phone works exactly on the principle von Neumann described in 1945."}]}},{"id":"38_bug","theme":"cult","fr":{"q":"Pourquoi dit-on « un bug » ?","blocks":[{"t":"p","h":"En 1947, un des premiers ordinateurs de Harvard tombe en panne. En l’ouvrant, les techniciens trouvent la cause : <strong>un papillon de nuit coincé dans un relais</strong>."},{"t":"p","h":"Grace Hopper, pionnière de la programmation, colle l’insecte dans le journal de bord avec la mention « premier cas réel de bogue ». <em>Bug</em> signifie « insecte » en anglais : le mot était né."},{"t":"callout","h":"<strong>À retenir :</strong> aujourd’hui, un bug est presque toujours une erreur humaine dans le programme — l’insecte, lui, est resté dans la légende (et au musée)."}]},"en":{"q":"Why do we say “a bug”?","blocks":[{"t":"p","h":"In 1947, one of Harvard’s first computers breaks down. Opening it up, the technicians find the cause: <strong>a moth stuck in a relay</strong>."},{"t":"p","h":"Grace Hopper, a programming pioneer, tapes the insect into the logbook with the note “first actual case of bug”. <em>Bug</em> means “insect” in English: the word was born."},{"t":"callout","h":"<strong>Remember:</strong> today, a bug is almost always a human error in the program — the insect stayed in the legend (and in the museum)."}]}},{"id":"39_supercalculateurs","theme":"cult","fr":{"q":"Qu’est-ce qu’un supercalculateur ?","blocks":[{"t":"p","h":"Un supercalculateur n’a rien de magique : ce sont <strong>des milliers de processeurs ordinaires rangés en armoires</strong>, reliés par un réseau ultra-rapide, qui se partagent un même calcul."},{"t":"p","h":"Météo, médicaments, physique, entraînement de l’IA : dès qu’un problème peut être découpé en morceaux indépendants, ces machines brillent. Facture d’électricité : celle d’une petite ville."},{"t":"callout","h":"<strong>À retenir :</strong> la puissance vient du partage : un problème coupé en mille morceaux, mille processeurs qui travaillent en même temps — la parallélisation à l’échelle d’un bâtiment."}]},"en":{"q":"What is a supercomputer?","blocks":[{"t":"p","h":"A supercomputer is nothing magical: it is <strong>thousands of ordinary processors lined up in cabinets</strong>, linked by an ultra-fast network, sharing one big calculation."},{"t":"p","h":"Weather, medicine, physics, AI training: whenever a problem can be cut into independent pieces, these machines shine. Electricity bill: that of a small town."},{"t":"callout","h":"<strong>Remember:</strong> power comes from sharing: a problem cut into a thousand pieces, a thousand processors working at once — parallelisation on the scale of a building."}]}},{"id":"40_quantique","theme":"cult","fr":{"q":"Et l’ordinateur quantique ?","blocks":[{"t":"p","h":"L’ordinateur quantique ne calcule pas plus vite sur tout : il explore <strong>certaines pistes en parallèle</strong> grâce aux propriétés étranges de la matière à l’échelle atomique."},{"t":"p","h":"Machines expérimentales, refroidies près du zéro absolu, utiles sur quelques problèmes précis. <strong>Votre PC n’a aucun souci à se faire</strong> : pour le quotidien, le classique reste imbattable."},{"t":"callout","h":"<strong>À retenir :</strong> le quantique est un spécialiste, pas un remplaçant : une piste de recherche fascinante, pas « le prochain PC portable »."}]},"en":{"q":"What about the quantum computer?","blocks":[{"t":"p","h":"The quantum computer doesn’t compute everything faster: it explores <strong>certain paths in parallel</strong> thanks to the strange properties of matter at the atomic scale."},{"t":"p","h":"Experimental machines, cooled near absolute zero, useful on a few precise problems. <strong>Your PC has nothing to worry about</strong>: for everyday tasks, the classic one stays unbeatable."},{"t":"callout","h":"<strong>Remember:</strong> quantum is a specialist, not a replacement: a fascinating research track, not “the next laptop”."}]}},{"id":"41_ordres_grandeur","theme":"ref","fr":{"q":"Et si un cycle du processeur durait une seconde ?","blocks":[{"t":"rows","rows":[["1 cycle = 1 s","le processeur bat au ralenti : un battement par seconde"],["Cache","quelques secondes : tendre la main sur le plan de travail"],["RAM","≈ 5 minutes : se lever et marcher jusqu’au placard"],["SSD","≈ 4 jours : envoyer un colis et attendre son retour"],["Disque dur","≈ 1 an : une expédition à l’autre bout du monde"]]},{"t":"callout","h":"<strong>À retenir :</strong> à l’échelle du processeur, le stockage est infiniment loin. Toute l’architecture — cache, RAM — existe pour cacher cette distance."}]},"en":{"q":"What if one processor cycle lasted a second?","blocks":[{"t":"rows","rows":[["1 cycle = 1 s","the processor beats in slow motion: one beat per second"],["Cache","a few seconds: reaching out to the worktop"],["RAM","≈ 5 minutes: getting up and walking to the cupboard"],["SSD","≈ 4 days: sending a parcel and waiting for its return"],["Hard drive","≈ 1 year: an expedition to the other side of the world"]]},{"t":"callout","h":"<strong>Remember:</strong> at the processor’s scale, storage is infinitely far away. The whole architecture — cache, RAM — exists to hide that distance."}]}},{"id":"42_fiche_technique","theme":"ref","fr":{"q":"Que signifie « 8 cœurs · 3,5 GHz · 16 Go · 512 Go SSD » ?","blocks":[{"t":"rows","rows":[["8 cœurs","huit cuisiniers en parallèle (voir la diapositive sur les cœurs)"],["3,5 GHz","le tempo : 3,5 milliards de battements par seconde"],["16 Go de RAM","la taille du plan de travail — tout ce qui est ouvert y vit"],["512 Go SSD","le placard : fichiers, programmes et système, gardés éteint"]]},{"t":"callout","h":"<strong>À retenir :</strong> une fiche technique raconte toujours la même histoire : combien de cuisiniers, à quel tempo, quel plan de travail, quel placard."}]},"en":{"q":"What does “8 cores · 3.5 GHz · 16 GB · 512 GB SSD” mean?","blocks":[{"t":"rows","rows":[["8 cores","eight cooks in parallel (see the slide about cores)"],["3.5 GHz","the tempo: 3.5 billion beats per second"],["16 GB of RAM","the size of the worktop — everything that’s open lives there"],["512 GB SSD","the cupboard: files, programs and system, kept when off"]]},{"t":"callout","h":"<strong>Remember:</strong> a spec sheet always tells the same story: how many cooks, at what tempo, what worktop, what cupboard."}]}},{"id":"43_pc_ideal","theme":"ref","fr":{"q":"Quel PC pour quelle mission ?","blocks":[{"t":"rows","rows":[["Jeu vidéo","un GPU costaud et un CPU rapide — le budget passe d’abord par l’image"],["Montage vidéo","beaucoup de cœurs et beaucoup de RAM : les fichiers sont énormes et le travail parallèle"],["Élève nomade","léger, bonne batterie, SSD confortable — le GPU peut attendre"]]},{"t":"callout","h":"<strong>À retenir :</strong> il n’existe pas « le meilleur ordinateur », seulement le mieux adapté à une mission. Chaque franc doit aller au bloc qui compte pour vous."}]},"en":{"q":"Which PC for which mission?","blocks":[{"t":"rows","rows":[["Gaming","a beefy GPU and a fast CPU — the budget goes to the image first"],["Video editing","lots of cores and lots of RAM: the files are huge and the work parallel"],["Student on the move","light, good battery, comfortable SSD — the GPU can wait"]]},{"t":"callout","h":"<strong>Remember:</strong> there is no “best computer”, only the one best suited to a mission. Every franc should go to the block that matters to you."}]}}]};
const SLIDES = DATA.slides;
const THEMES = DATA.themes;
const ORDER_THEMES = DATA.order;

const I18N = {
  fr: {
    kicker: "Architecture des ordinateurs",
    title: "Questions pour aller plus loin",
    instruction: "Choisissez une question pour afficher sa réponse. Une pastille verte marque celles que vous avez déjà lues.",
    fs: "Plein écran", fsExit: "Quitter",
    backList: "← Toutes les applications",
    all: "Toutes",
    backToList: "← Liste des questions",
    prev: "← Question précédente",
    next: "Question suivante →",
    counter: (n, t) => n + " question" + (n > 1 ? "s" : "") + " lue" + (n > 1 ? "s" : "") + " sur " + t
  },
  en: {
    kicker: "COMPUTER ARCHITECTURE",
    title: "Questions to go further",
    instruction: "Pick a question to reveal its answer. A green dot marks the ones you have already read.",
    fs: "Fullscreen", fsExit: "Exit",
    backList: "← All applications",
    all: "All",
    backToList: "← Question list",
    prev: "← Previous question",
    next: "Next question →",
    counter: (n, t) => n + " of " + t + " questions read"
  }
};

let lang = (function () {
  try {
    var c = document.cookie.match(/(?:^|;\s*)fj-lang=([a-z]{2})/);
    if (c && (c[1] === "fr" || c[1] === "en")) return c[1];
  } catch (e) {}
  try {
    var s = localStorage.getItem("fj-lang");
    if (s === "fr" || s === "en") return s;
  } catch (e) {}
  return "fr";
})();
const T = () => I18N[lang];

let readSet = new Set();
try { readSet = new Set(JSON.parse(localStorage.getItem("qa-arch-read") || "[]")); } catch (e) {}
function saveRead() {
  try { localStorage.setItem("qa-arch-read", JSON.stringify([...readSet])); } catch (e) {}
}

let filter = "all";

function renderBlocks(blocks) {
  let h = "";
  for (const b of blocks) {
    if (b.t === "p") {
      h += '<p class="para">' + b.h + '</p>';
    } else if (b.t === "rows") {
      h += '<div class="rows">' + b.rows.map(r =>
        '<div class="row"><div class="rlab">' + r[0] + '</div><div class="rtxt">' + r[1] + '</div></div>'
      ).join("") + '</div>';
    } else if (b.t === "cards") {
      const green = b.green || [];
      h += '<div class="cards">' + b.cards.map((c, i) =>
        '<div class="dcard' + (green.includes(String(i + 1)) ? " green" : "") + '">' +
        '<div class="dh">' + c[0] + '</div>' +
        c[1].map(p => '<p>' + p + '</p>').join("") +
        '</div>'
      ).join("") + '</div>';
    } else if (b.t === "callout") {
      h += '<div class="callout">' + b.h + '</div>';
    }
  }
  return h;
}

function renderList() {
  let h = "";
  for (const th of ORDER_THEMES) {
    if (filter !== "all" && filter !== th) continue;
    const items = SLIDES.filter(s => s.theme === th);
    if (!items.length) continue;
    h += '<div class="themeName">' + THEMES[th][lang] + '</div>';
    for (const s of items) {
      h += '<button type="button" class="qitem" data-id="' + s.id + '"><span>' + s[lang].q +
        '</span><span class="dot' + (readSet.has(s.id) ? " on" : "") + '" aria-hidden="true"></span></button>';
    }
  }
  $("listView").innerHTML = h;
  document.querySelectorAll(".qitem").forEach(b => {
    b.onclick = () => { location.hash = "#/" + b.dataset.id; };
  });
  $("counter").textContent = T().counter(readSet.size, SLIDES.length);
  document.querySelectorAll(".chip").forEach(c => c.classList.toggle("active", c.dataset.th === filter));
}

function currentId() {
  const m = location.hash.match(/^#\/(.+)$/);
  return m ? m[1] : null;
}

function renderDetail(id) {
  const s = SLIDES.find(x => x.id === id);
  if (!s) { location.hash = ""; return; }
  if (!readSet.has(id)) { readSet.add(id); saveRead(); }
  $("dTheme").textContent = THEMES[s.theme][lang];
  $("dTitle").textContent = s[lang].q;
  $("dBody").innerHTML = renderBlocks(s[lang].blocks);
  const i = SLIDES.indexOf(s);
  $("prevBtn").disabled = i === 0;
  $("nextBtn").disabled = i === SLIDES.length - 1;
  $("prevBtn").onclick = () => { if (i > 0) location.hash = "#/" + SLIDES[i - 1].id; };
  $("nextBtn").onclick = () => { if (i < SLIDES.length - 1) location.hash = "#/" + SLIDES[i + 1].id; };
}

function route() {
  const id = currentId();
  if (id && SLIDES.some(s => s.id === id)) {
    $("listView").style.display = "none";
    $("chipsRow").style.display = "none";
    $("counter").style.display = "none";
    $("detailView").style.display = "block";
    renderDetail(id);
    window.scrollTo(0, 0);
  } else {
    if (id) history.replaceState(null, "", location.pathname + location.search);
    $("detailView").style.display = "none";
    $("listView").style.display = "block";
    $("chipsRow").style.display = "flex";
    $("counter").style.display = "block";
    renderList();
  }
}
window.addEventListener("hashchange", route);

function buildChips() {
  let h = '<button type="button" class="chip" data-th="all">' + T().all + '</button>';
  for (const th of ORDER_THEMES) {
    h += '<button type="button" class="chip" data-th="' + th + '">' + THEMES[th][lang] + '</button>';
  }
  $("chipsRow").innerHTML = h;
  document.querySelectorAll(".chip").forEach(c => {
    c.onclick = () => { filter = c.dataset.th; renderList(); };
  });
}

function isFs() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }
$("fsBtn").onclick = () => {
  const el = document.documentElement;
  if (isFs()) {
    (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  } else {
    const req = el.requestFullscreen || el.webkitRequestFullscreen;
    if (req) { const r = req.call(el); if (r && r.catch) r.catch(() => {}); }
  }
};
function syncFsLabel() { $("fsLabel").textContent = isFs() ? T().fsExit : T().fs; }
document.addEventListener("fullscreenchange", syncFsLabel);
document.addEventListener("webkitfullscreenchange", syncFsLabel);

function applyLang() {
  document.documentElement.lang = lang;
  $("kicker").textContent = T().kicker;
  $("title").textContent = T().title;
  $("instruction").textContent = T().instruction;
  $("langBtn").textContent = lang === "fr" ? "English" : "Français";
  $("fsLabel").textContent = isFs() ? T().fsExit : T().fs;
  $("backLink").textContent = T().backList;
  $("backListBtn").textContent = T().backToList;
  $("prevBtn").textContent = T().prev;
  $("nextBtn").textContent = T().next;
  document.title = T().title + " · Gymnase — Frédéric Jaccard";
  buildChips();
  route();
}

$("langBtn").onclick = () => {
  lang = lang === "fr" ? "en" : "fr";
  try {
    localStorage.setItem("fj-lang", lang);
    document.cookie = "fj-lang=" + lang + ";domain=.fredericjaccard.com;path=/;max-age=31536000;SameSite=Lax";
  } catch (e) {}
  applyLang();
};
$("backListBtn").onclick = () => { location.hash = ""; };

applyLang();

</script>
</body>
</html>

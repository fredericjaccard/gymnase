<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23155E4C'/%3E%3Ctext x='32' y='43' font-family='Arial,sans-serif' font-size='28' font-weight='bold' fill='%23FBFAF6' text-anchor='middle'%3EFJ%3C/text%3E%3C/svg%3E">
<meta name="description" content="Application interactive pour le cours d'informatique.">
<title>La machine à instructions — Algorithmique · Gymnase — Frédéric Jaccard</title>
<link href="https://fonts.googleapis.com/css2?family=Quattrocento+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBFAF6; --card:#F7F6F2; --primary:#155E4C; --primaryLight:#E3F0EA;
  --accent:#D96A08; --accentLight:#FDEBD8; --line:#D8D5CB; --ink:#20241F; --muted:#6E726B;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:"Quattrocento Sans",sans-serif;padding:20px;max-width:1100px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px;margin-bottom:16px}
.kicker{font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
h1{font-size:26px;color:var(--primary)}
.hdrBtns{display:flex;gap:8px}
button{font-family:inherit;font-size:14px;font-weight:700;padding:8px 16px;border-radius:10px;
  border:2px solid var(--primary);background:var(--card);color:var(--primary);cursor:pointer}
button:hover{background:var(--primaryLight)}
button:disabled{opacity:.4;cursor:default}
.instruction{background:var(--primaryLight);border-radius:12px;padding:12px 16px;margin-bottom:16px;font-size:15px}
.workzone{display:grid;grid-template-columns:1fr 340px;gap:18px;align-items:start}
@media(max-width:860px){.workzone{grid-template-columns:1fr}}
.board{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;align-items:center;gap:12px}
#grid{display:grid;gap:4px;background:var(--line);border:4px solid var(--line);border-radius:10px;max-width:100%}
.cell{width:64px;height:64px;background:#fff;display:flex;align-items:center;justify-content:center;position:relative;font-size:34px}
@media(max-width:640px){.cell{width:52px;height:52px;font-size:26px}}
.cell.wall{background:var(--primary)}
.cell .goal{font-size:24px}
#robot{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;transition:transform .3s}
#robot svg{transition:transform .3s}
.bump{animation:bump .3s}
@keyframes bump{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.panel{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.panel h2{font-size:15px;color:var(--primary);text-transform:uppercase;letter-spacing:.1em}
.cmdRow{display:flex;gap:10px}
.cmdBtn{flex:1;font-size:24px;padding:10px 0;display:flex;flex-direction:column;align-items:center;gap:2px}
.cmdBtn small{font-size:11px;font-weight:700;color:var(--muted)}
.prog{min-height:64px;background:#fff;border:2px dashed var(--line);border-radius:10px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start}
.prog .chip{width:36px;height:36px;border-radius:8px;background:var(--primaryLight);border:1.5px solid var(--primary);
  display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--primary);cursor:pointer;position:relative}
.prog .chip.current{background:var(--accent);border-color:var(--accent);color:#fff}
.prog .chip:hover::after{content:"✕";position:absolute;top:-7px;right:-7px;background:var(--accent);color:#fff;
  border-radius:50%;width:16px;height:16px;font-size:10px;display:flex;align-items:center;justify-content:center}
.progEmpty{font-size:13px;color:var(--muted);align-self:center}
.runRow{display:flex;gap:8px;flex-wrap:wrap}
.goBtn{background:var(--primary);color:#fff;flex:1}
.goBtn:hover{background:#0e4a3b}
.msg{border-radius:10px;padding:10px 14px;font-size:14px;font-weight:700;display:none}
.msg.show{display:block}
.msg.ok{background:var(--primaryLight);color:var(--primary);border:2px solid var(--primary)}
.msg.err{background:var(--accentLight);color:var(--accent);border:2px solid var(--accent)}
.levelRow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.levelRow label{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.lvlBtn{width:36px;height:36px;padding:0;border-radius:50%}
.lvlBtn.active{background:var(--accentLight);border-color:var(--accent);color:var(--accent)}
.lvlBtn.locked{opacity:.35;cursor:not-allowed}
.nextBtn{display:none;background:var(--accent);border-color:var(--accent);color:#fff}
.nextBtn.show{display:inline-block}
.nextBtn:hover{background:#b85806}
.lvlBtn.solved::after{content:"★";font-size:11px;position:absolute;top:-16px;left:50%;transform:translateX(-50%);color:var(--accent)}
.hint{font-size:13px;color:var(--muted);line-height:1.45}
footer{margin-top:20px;text-align:center;color:var(--muted);font-size:13px}
#fireworks{position:fixed;inset:0;pointer-events:none;z-index:50;display:none}

footer a{color:var(--muted);text-decoration:none}
footer a:hover{color:var(--primary);text-decoration:underline}
</style>
</head>
<body>
<header>
  <div>
    <div class="kicker" id="kicker"></div>
    <h1 id="title"></h1>
  </div>
  <div class="hdrBtns">
    <button id="langBtn">English</button>
    <button id="fsBtn"><span id="fsLabel"></span></button>
  </div>
</header>
<div class="instruction" id="instruction"></div>

<div class="workzone">
  <div class="board">
    <div class="levelRow" id="levelRow"><label id="levelLabel"></label></div>
    <button class="nextBtn" id="nextBtn"></button>
    <div id="grid"></div>
    <div class="msg" id="msg"></div>
  </div>
  <div class="panel">
    <h2 id="cmdTitle"></h2>
    <div class="cmdRow">
      <button class="cmdBtn" data-cmd="F"><span>⬆</span><small data-cmdlabel="F"></small></button>
      <button class="cmdBtn" data-cmd="L"><span>↶</span><small data-cmdlabel="L"></small></button>
      <button class="cmdBtn" data-cmd="R"><span>↷</span><small data-cmdlabel="R"></small></button>
    </div>
    <h2 id="progTitle"></h2>
    <div class="prog" id="prog"></div>
    <div class="runRow">
      <button class="goBtn" id="runBtn"></button>
      <button id="clearBtn"></button>
    </div>
    <p class="hint" id="hint"></p>
  </div>
</div>

<canvas id="fireworks"></canvas>
<footer><a href="index.html" id="fjBack"></a> · <a href="https://www.fredericjaccard.com">Frédéric Jaccard</a></footer>

<script>
const $ = id => document.getElementById(id);

/* Niveaux : 0=vide 1=mur ; S=départ (avec direction), G=but */
const LEVELS = [
  { map:[ ".....",
          ".....",
          "S..G.",
          ".....",
          "....." ], dir:0 },
  { map:[ ".....",
          ".###.",
          "S.#G.",
          ".###.",
          "....." ], dir:0 },
  { map:[ "S....",
          "###..",
          "...#.",
          ".G.#.",
          ".#..." ], dir:0 },
  { map:[ ".##.G",
          "#...#",
          "###..",
          "...#.",
          "S#..." ], dir:0 }
];
const DIRS = [ [0,1], [1,0], [0,-1], [-1,0] ];   // droite, bas, gauche, haut
const ARROW = a => `rotate(${a*90} 20 20)`;

const I18N = {
  fr:{back:"← Toutes les applications",
    kicker:"Algorithmique",
    title:"La machine à instructions",
    fs:"Plein écran", fsExit:"Quitter",
    instruction:"Programmez le robot pour qu'il atteigne l'étoile ⭐. Construisez votre programme avec les trois instructions — <b>avancer</b>, <b>tourner à gauche</b>, <b>tourner à droite</b> — puis lancez l'exécution. Attention : la machine fait <b>exactement</b> ce que vous demandez, pas ce que vous pensez !",
    level:"Niveau",
    next:"Niveau suivant →",
    locked:"Terminez d'abord les niveaux précédents !",
    cmdTitle:"Les 3 instructions",
    progTitle:"Votre programme",
    cmdLabels:{F:"avancer", L:"gauche", R:"droite"},
    progEmpty:"Cliquez sur les instructions pour construire votre programme…",
    run:"Exécuter", pause:"Pause", clear:"Tout effacer",
    hint:"Cliquez sur une instruction du programme pour la supprimer. Le robot regarde dans la direction de la flèche : « avancer » veut dire « d'une case, tout droit devant lui ».",
    win:"Bravo ! Le robot a atteint l'étoile avec un programme de N instructions. Essayez le niveau suivant !",
    winLast:"Bravo ! Vous avez terminé le dernier niveau — vous savez programmer une machine !",
    errWall:"Aïe ! Le robot a foncé dans un mur. La machine a fait exactement ce que vous avez demandé… Corrigez le programme et réessayez.",
    errOut:"Le robot est sorti de la grille ! La machine exécute vos instructions à la lettre, même quand elles mènent au désastre.",
    errEmpty:"Le programme est vide : ajoutez d'abord des instructions.",
    errStar:"Le programme est terminé, mais l'étoile n'est pas atteinte. Observez où le robot s'est arrêté, puis ajustez."
  },
  en:{back:"← All applications",
    kicker:"ALGORITHMS",
    title:"The Instruction Machine",
    fs:"Fullscreen", fsExit:"Exit",
    instruction:"Program the robot so it reaches the star ⭐. Build your program with the three instructions — <b>forward</b>, <b>turn left</b>, <b>turn right</b> — then run it. Careful: the machine does <b>exactly</b> what you ask, not what you mean!",
    level:"Level",
    next:"Next level →",
    locked:"Finish the previous levels first!",
    cmdTitle:"The 3 instructions",
    progTitle:"Your program",
    cmdLabels:{F:"forward", L:"left", R:"right"},
    progEmpty:"Click the instructions to build your program…",
    run:"Run", pause:"Pause", clear:"Clear all",
    hint:"Click an instruction in the program to remove it. The robot faces the arrow's direction: “forward” means “one cell straight ahead”.",
    win:"Well done! The robot reached the star with a program of N instructions. Try the next level!",
    winLast:"Well done! You finished the last level — you know how to program a machine!",
    errWall:"Ouch! The robot bumped into a wall. The machine did exactly what you asked… Fix the program and try again.",
    errOut:"The robot left the grid! The machine follows your instructions literally, even when they lead to disaster.",
    errEmpty:"The program is empty: add some instructions first.",
    errStar:"The program is over, but the star was not reached. Look where the robot stopped, then adjust."
  }
};
let lang = (function(){try{var s=localStorage.getItem("fj-lang");return (s==="fr"||s==="en")?s:"fr";}catch(e){return "fr";}})();
const T = () => I18N[lang];

/* ---------- état ---------- */
let levelIdx = 0, solved = new Set();
let robot = {r:0, c:0, d:0, rendered:0};  // d: 0=droite 1=bas 2=gauche 3=haut ; rendered = rotation affichée (cumulée)
let program = [];                 // "F" | "L" | "R"
let runState = {running:false, pos:0, timer:null};

function curLevel(){ return LEVELS[levelIdx]; }
function startPos(){
  const m = curLevel().map;
  for(let r=0;r<m.length;r++) for(let c=0;c<m[r].length;c++)
    if(m[r][c]==="S") return {r,c,d:curLevel().dir};
}

/* ---------- rendu ---------- */
function renderLevelButtons(){
  const row = $("levelRow");
  row.querySelectorAll("button").forEach(b=>b.remove());
  const maxUnlocked = Math.max(0, ...[...solved].map(x=>x+1));  // niveau max accessible
  LEVELS.forEach((_,i)=>{
    const b = document.createElement("button");
    const locked = i > maxUnlocked;
    b.className = "lvlBtn" + (i===levelIdx?" active":"") + (solved.has(i)?" solved":"") + (locked?" locked":"");
    b.textContent = i+1;
    b.style.position = "relative";
    b.onclick = ()=>{
      if(locked){ showMsg("err", T().locked); return; }
      stopRun(); levelIdx=i; program=[]; buildLevel(); renderProgram(); hideMsg(); updateNextBtn();
    };
    row.appendChild(b);
  });
}

function buildLevel(){
  const m = curLevel().map;
  const g = $("grid");
  g.innerHTML = "";
  g.style.gridTemplateColumns = `repeat(${m[0].length}, auto)`;
  robot = startPos(); robot.rendered = robot.d;
  for(let r=0;r<m.length;r++) for(let c=0;c<m[r].length;c++){
    const cell = document.createElement("div");
    cell.className = "cell" + (m[r][c]==="#"?" wall":"");
    cell.id = `cell-${r}-${c}`;
    if(m[r][c]==="G") cell.innerHTML = `<span class="goal">⭐</span>`;
    g.appendChild(cell);
  }
  const rb = document.createElement("div");
  rb.id = "robot";
  rb.innerHTML = `<svg width="40" height="40" viewBox="0 0 40 40">
      <circle cx="20" cy="20" r="16" fill="#D96A08"/>
      <path d="M14 13 L30 20 L14 27 Z" fill="#fff"/>
    </svg>`;
  const svg0 = rb.querySelector("svg");
  svg0.style.transition = "none";
  svg0.style.transform = `rotate(${robot.rendered*90}deg)`;
  g.querySelector(`#cell-${robot.r}-${robot.c}`).appendChild(rb);
  requestAnimationFrame(()=>{ svg0.style.transition = ""; });
}

function renderRobot(){
  const svg = $("robot").querySelector("svg");
  const turns = ((robot.d - robot.rendered) % 4 + 4) % 4;   // 0..3 quarts de tour à droite
  if(turns===3) robot.rendered -= 1;                        // gauche : vraiment -90°
  else robot.rendered += turns;                             // 1 ou 2 quarts à droite
  svg.style.transform = `rotate(${robot.rendered*90}deg)`;
}

function moveRobotVisual(){
  const target = $(`cell-${robot.r}-${robot.c}`);
  if(target) target.appendChild($("robot"));
}

function renderProgram(currentPos=-1){
  const p = $("prog");
  p.innerHTML = "";
  if(program.length===0){
    const s = document.createElement("span");
    s.className = "progEmpty"; s.textContent = T().progEmpty;
    p.appendChild(s);
    return;
  }
  program.forEach((cmd,i)=>{
    const chip = document.createElement("div");
    chip.className = "chip" + (i===currentPos?" current":"");
    chip.textContent = cmd==="F"?"⬆":cmd==="L"?"↶":"↷";
    chip.title = T().cmdLabels[cmd];
    chip.onclick = ()=>{ if(!runState.running){ program.splice(i,1); renderProgram(); } };
    p.appendChild(chip);
  });
}

/* ---------- messages ---------- */
function showMsg(kind, text){
  const m = $("msg");
  m.className = "msg show " + kind;
  m.textContent = text;
}
function hideMsg(){ $("msg").className = "msg"; }
function updateNextBtn(){
  const show = solved.has(levelIdx) && levelIdx < LEVELS.length-1;
  $("nextBtn").classList.toggle("show", show);
}
$("nextBtn").onclick = ()=>{
  if(levelIdx < LEVELS.length-1){
    stopRun(); levelIdx++; program=[]; buildLevel(); renderProgram(); hideMsg();
    renderLevelButtons(); updateNextBtn();
  }
};

/* ---------- exécution ---------- */
function goalPos(){
  const m = curLevel().map;
  for(let r=0;r<m.length;r++) for(let c=0;c<m[r].length;c++)
    if(m[r][c]==="G") return {r,c};
}
function atGoal(){ const g = goalPos(); return robot.r===g.r && robot.c===g.c; }

function execOne(){
  const cmd = program[runState.pos];
  renderProgram(runState.pos);
  if(cmd==="L"){ robot.d = (robot.d+3)%4; renderRobot(); }
  else if(cmd==="R"){ robot.d = (robot.d+1)%4; renderRobot(); }
  else{
    const [dr,dc] = DIRS[robot.d];
    const nr = robot.r+dr, nc = robot.c+dc;
    const m = curLevel().map;
    if(nr<0 || nr>=m.length || nc<0 || nc>=m[0].length){
      stopRun(); showMsg("err", T().errOut); return;
    }
    if(m[nr][nc]==="#"){
      $("robot").classList.add("bump");
      setTimeout(()=>$("robot").classList.remove("bump"), 350);
      stopRun(); showMsg("err", T().errWall); return;
    }
    robot.r = nr; robot.c = nc; moveRobotVisual();
  }
  runState.pos++;
  if(atGoal()){
    stopRun(); renderProgram();
    solved.add(levelIdx); renderLevelButtons(); updateNextBtn();
    const last = levelIdx === LEVELS.length-1;
    const txt = !last ? T().win.replace("N", program.length) : T().winLast;
    showMsg("ok", txt);
    if(last && !fwRunning) setTimeout(fireworks, 600);
    return;
  }
  if(runState.pos >= program.length){
    stopRun(); renderProgram();
    showMsg("err", T().errStar);
  }
}

function stopRun(){
  runState.running = false;
  if(runState.timer){ clearInterval(runState.timer); runState.timer=null; }
  $("runBtn").textContent = T().run;
}
function startRun(){
  if(program.length===0){ showMsg("err", T().errEmpty); return; }
  runState.pos = 0; buildLevel();   // toujours repartir du départ
  hideMsg();
  runState.running = true;
  $("runBtn").textContent = T().pause;
  runState.timer = setInterval(()=>{ if(runState.running) execOne(); }, 450);
}
$("runBtn").onclick = ()=>{ runState.running ? stopRun() : startRun(); };
$("clearBtn").onclick = ()=>{ stopRun(); program=[]; renderProgram(); buildLevel(); hideMsg(); };

document.querySelectorAll(".cmdBtn").forEach(b=>{
  b.onclick = ()=>{ if(!runState.running){ program.push(b.dataset.cmd); renderProgram(); hideMsg(); } };
});

/* ---------- feu d'artifice ---------- */
let fwRunning = false;
function fireworks(){
  const cv = document.getElementById("fireworks"), ctx = cv.getContext("2d");
  cv.width = innerWidth; cv.height = innerHeight;
  cv.style.display = "block";
  fwRunning = true;
  const COLORS = ["#155E4C","#D96A08","#3E8E7E","#F0A04B","#7FB69E","#C84B31"];
  const rockets = [], sparks = [];
  const launch = () => {
    rockets.push({
      x: cv.width * (0.15 + Math.random() * 0.7), y: cv.height,
      vx: (Math.random() - 0.5) * 2, vy: -(10 + Math.random() * 4),
      color: COLORS[Math.floor(Math.random() * COLORS.length)]
    });
  };
  const explode = r => {
    for(let i = 0; i < 90; i++){
      const ang = Math.random() * Math.PI * 2, sp = 2 + Math.random() * 5;
      sparks.push({ x: r.x, y: r.y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp,
                    life: 60 + Math.random() * 40, color: r.color });
    }
  };
  let frame = 0;
  const tick = () => {
    ctx.clearRect(0, 0, cv.width, cv.height);
    frame++;
    if(frame < 260 && frame % 16 === 0) launch();
    for(let i = rockets.length - 1; i >= 0; i--){
      const r = rockets[i];
      r.x += r.vx; r.y += r.vy; r.vy += 0.18;
      ctx.beginPath(); ctx.arc(r.x, r.y, 3, 0, Math.PI * 2);
      ctx.fillStyle = r.color; ctx.fill();
      if(r.vy >= -1.5){ explode(r); rockets.splice(i, 1); }
    }
    for(let i = sparks.length - 1; i >= 0; i--){
      const sp = sparks[i];
      sp.x += sp.vx; sp.y += sp.vy; sp.vy += 0.05; sp.vx *= 0.985; sp.life--;
      ctx.globalAlpha = Math.max(0, sp.life / 80);
      ctx.beginPath(); ctx.arc(sp.x, sp.y, 2.4, 0, Math.PI * 2);
      ctx.fillStyle = sp.color; ctx.fill();
      if(sp.life <= 0) sparks.splice(i, 1);
    }
    ctx.globalAlpha = 1;
    if(frame < 600 || rockets.length || sparks.length) requestAnimationFrame(tick);
    else { cv.style.display = "none"; fwRunning = false; }
  };
  tick();
}

/* ---------- i18n + fullscreen (charte) ---------- */
function applyLang(){
  document.documentElement.lang = lang;
  $("langBtn").textContent = lang==="fr" ? "English" : "Français";
  $("kicker").textContent = T().kicker;
  $("title").textContent = T().title;
  document.title = T().title + " — Algorithmique";
  $("fsLabel").textContent = isFs() ? T().fsExit : T().fs;
  $("instruction").innerHTML = T().instruction;
  $("levelLabel").textContent = T().level;
  $("cmdTitle").textContent = T().cmdTitle;
  $("progTitle").textContent = T().progTitle;
  document.querySelectorAll("[data-cmdlabel]").forEach(el=>{ el.textContent = T().cmdLabels[el.dataset.cmdlabel]; });
  $("runBtn").textContent = runState.running ? T().pause : T().run;
  $("clearBtn").textContent = T().clear;
  $("hint").textContent = T().hint;
  $("nextBtn").textContent = T().next;
  renderProgram();
  renderLevelButtons();
}
$("langBtn").onclick = ()=>{ lang = lang==="fr" ? "en" : "fr"; try{localStorage.setItem("fj-lang",lang);}catch(e){}; applyLang(); };

function isFs(){ return !!(document.fullscreenElement || document.webkitFullscreenElement); }
$("fsBtn").onclick = ()=>{
  const el = document.documentElement;
  if(isFs()){ (document.exitFullscreen || document.webkitExitFullscreen).call(document); }
  else{
    const req = el.requestFullscreen || el.webkitRequestFullscreen;
    if(req){ const r = req.call(el); if(r && r.catch) r.catch(()=>{}); }
  }
};
function syncFsLabel(){ $("fsLabel").textContent = isFs() ? T().fsExit : T().fs; }
document.addEventListener("fullscreenchange", syncFsLabel);
document.addEventListener("webkitfullscreenchange", syncFsLabel);

applyLang();
buildLevel();
updateNextBtn();
</script>

<script>
(function(){
  var el=document.getElementById("fjBack");
  if(!el||typeof I18N==="undefined"||typeof lang==="undefined")return;
  function upd(){try{el.textContent=I18N[lang].back;}catch(e){}}
  var btn=document.getElementById("langBtn");
  if(btn){var old=btn.onclick;btn.onclick=function(){if(old)old.apply(this,arguments);upd();};}
  upd();
})();
</script>
</body>
</html>

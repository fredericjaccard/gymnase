:root{
  --bg:#FBFAF6;--card:#F7F6F2;--primary:#155E4C;--primaryLight:#E3F0EA;
  --accent:#D96A08;--accentLight:#FDEBD8;--line:#D8D5CB;--ink:#20241F;--muted:#6E726B;--error:#C84B31;
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font:16px/1.43 "Quattrocento Sans",sans-serif}
h1,h2,p,dl,dd{margin:0}button,select{font:inherit;color:inherit}button{cursor:pointer;touch-action:manipulation}
button:disabled{cursor:default;opacity:.5}button,select{border-radius:9px}button:focus-visible,select:focus-visible,summary:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button{background:transparent;border:0}button .ico{flex:none}button[hidden],[hidden]{display:none!important}
.ico{width:20px;height:20px;display:block;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
[data-icon]{display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.mast{background:white;border-bottom:1px solid var(--line)}
.mast-inner,.shell{margin:0 auto;width:100%;max-width:1280px;padding-inline:34px}
.mast-inner{display:flex;justify-content:space-between;gap:20px;align-items:center;min-height:88px}
.kicker{font-weight:700;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-bottom:3px}
h1{color:var(--primary);font-size:33px;line-height:1.06;letter-spacing:-.025em}
.header-buttons,.inline-actions,.actions,.bottom-actions,.text-button,.primary,.outline,.icon-btn,.panel-heading,.navline,.course-progress,.table-progress,.equation-row,.family-nav,.family-nav button{display:flex;align-items:center}
.header-buttons,.actions{gap:9px}.icon-btn,.outline,.primary{font-weight:700;justify-content:center;gap:7px;min-height:44px}
.outline{border:1.5px solid var(--primary);background:white;color:var(--primary);padding:8px 14px}
.outline:hover,.icon-btn:hover,.text-button:hover{background:var(--primaryLight)}
.header-buttons .outline{font-size:15px;border-radius:10px}.header-buttons .ico{width:17px;height:17px}
.shell{padding-top:19px;padding-bottom:25px;flex:1}
.instruction{display:flex;align-items:center;gap:13px;background:var(--primaryLight);color:var(--primary);padding:13px 17px;border-radius:12px;font-size:16px}
.instruction .ico{width:23px;height:23px}.navline{justify-content:space-between;gap:16px;margin:15px 0 12px}
.family-nav{gap:4px;background:var(--card);padding:3px;border:1px solid var(--line);border-radius:12px}
.family-nav button{justify-content:center;min-height:43px;gap:8px;padding:7px 15px;font-weight:700;color:var(--muted)}
.family-nav button[aria-pressed=true]{background:var(--primary);color:white}.family-nav button:not([aria-pressed=true]):hover{background:var(--primaryLight);color:var(--primary)}
.family-nav .ico{width:18px;height:18px}
.course-progress{gap:7px;color:var(--primary);font-weight:700;font-size:14px}.course-progress .ico{width:17px;height:17px}
.meter{display:inline-block;overflow:hidden;background:var(--line);height:5px;width:78px;border-radius:5px}.meter i{display:block;height:100%;background:var(--primary);width:0}
.case-nav{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:10px;margin-bottom:17px}
.case{display:flex;align-items:center;gap:11px;min-height:61px;padding:8px 12px;color:var(--ink);background:white;border:1px solid var(--line);border-radius:11px;text-align:left}
.case:hover{border-color:var(--primary)}.case[aria-current=true]{box-shadow:inset 0 0 0 1px var(--accent);border-color:var(--accent);background:var(--accentLight)}
.case-icon{width:34px;height:34px;display:grid;flex:none;place-items:center;border-radius:9px;background:var(--primaryLight);color:var(--primary)}
.case[aria-current=true] .case-icon{background:var(--bg);color:var(--primary)}.case-icon .ico{width:22px;height:22px}
.case-name,.case-count{display:block}.case-name{font-weight:700;font-size:16px;line-height:1.1}.case-count{font-size:13px;color:var(--muted);margin-top:2px}
.case-state{margin-left:auto;display:grid;place-items:center;width:17px;color:var(--primary)}.case-state .ico{width:16px;height:16px}
.mobile-select{display:none}.workspace{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:18px;align-items:start}
.panel{min-width:0;border:1px solid var(--line);border-radius:15px;padding:20px;background:white}
.panel-heading{justify-content:space-between;gap:8px;min-height:35px}
h2{font-size:25px;line-height:1.12;color:var(--primary);letter-spacing:-.025em}
.icon-btn{border:1px solid var(--line);color:var(--primary);width:40px;min-width:40px;height:40px;min-height:40px;border-radius:9px;background:white}
.icon-btn .ico{width:19px;height:19px}.inline-actions{gap:5px}.table-zoom{display:none}
.scenario,.method{font-size:16px;margin:7px 0 15px}.method{font-size:14.5px;color:var(--muted)}
.drawing{display:grid;align-items:center;border:1px solid var(--line);border-radius:11px;background:var(--bg);padding:8px 7px;min-height:185px}
.diagram-svg{display:block;width:100%;height:auto;overflow:visible;font-family:"Quattrocento Sans",sans-serif}
.diagram-svg .wire{fill:none;stroke:var(--primary);stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}
.diagram-svg .wire.selected{stroke:var(--accent);stroke-width:3}.diagram-svg .dot{fill:var(--primary)}.diagram-svg .dot.selected{fill:var(--accent)}
.diagram-svg .gate-face{stroke:var(--primary);stroke-width:2.4;fill:var(--primaryLight);stroke-linejoin:round}
.diagram-svg .gate-bubble{fill:var(--bg);stroke:var(--primary);stroke-width:2.3}.diagram-svg .gate-in{stroke:var(--primary);stroke-width:2.3;fill:none}
.diagram-svg .hot .gate-face,.diagram-svg .hot .gate-bubble{stroke:var(--accent)}.diagram-svg .hot .gate-face{fill:var(--accentLight)}
.diagram-svg .hot .gate-in{stroke:var(--accent)}.diagram-svg .gate-name{fill:var(--ink);font-size:17px;font-weight:700;text-anchor:middle;pointer-events:none}
.diagram-svg .net-label{fill:var(--primary);font-size:19px;font-weight:700;text-anchor:middle;paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}
.diagram-svg .net-label.selected{fill:var(--ink)}.diagram-svg .terminal{fill:white;stroke:var(--primary);stroke-width:1.6}
.diagram-svg .terminal.output{fill:var(--primary)}.diagram-svg .terminal-label{font-size:18px;font-weight:700;text-anchor:middle;fill:var(--primary)}
.diagram-svg .terminal-label.output{fill:white}.diagram-svg .gate-action{cursor:pointer}
.diagram-svg .gate-action:hover .gate-face,.diagram-svg .gate-action:focus .gate-face{stroke:var(--accent);stroke-width:3}
.signals{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 11px;margin:14px 0 17px}.signals div{display:flex;gap:8px;align-items:center;min-width:0;font-size:14.5px;line-height:1.2}
.signals dt{display:grid;place-items:center;flex:none;min-width:23px;height:23px;border:1px solid var(--line);color:var(--primary);font-weight:700;background:var(--card);border-radius:5px}
.signals .output-key{background:var(--primary);color:white;border-color:var(--primary)}
.equation-row{justify-content:space-between;gap:10px;padding-top:12px;border-top:1px solid var(--line)}
.caption{display:block;font-size:13px;color:var(--muted)}#equation{display:block;color:var(--primary);font-size:20px;line-height:1.25;margin-top:2px}
.text-button{gap:6px;min-height:44px;font-size:14.5px;font-weight:700;color:var(--primary);padding:5px 7px}.text-button .ico{width:16px;height:16px}
.hint,.feedback{border-radius:9px;padding:10px 12px;font-size:15px;line-height:1.34}.hint{margin-top:8px;background:var(--accentLight)}
.truth-wrap{width:100%}table{width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed;font-variant-numeric:tabular-nums}
th,td{padding:0;text-align:center}thead tr:first-child th{height:25px;font-size:12px;font-weight:700;letter-spacing:.045em;background:var(--card);color:var(--muted)}
thead tr:first-child th:first-child{border-radius:7px 0 0 0}thead tr:first-child th:last-child{background:var(--primaryLight);color:var(--primary);border-radius:0 7px 0 0}
thead tr:nth-child(2) th{background:var(--card);height:34px;color:var(--primary);font-size:16px;border-bottom:1px solid var(--line)}
thead tr:nth-child(2) th.entry-head{background:var(--primaryLight)}
.col-select{width:100%;min-height:34px;border-radius:0;color:var(--primary);font-size:16px;font-weight:700}
.col-select[aria-pressed=true]{box-shadow:inset 0 -3px var(--accent);background:var(--accentLight);color:var(--ink)}
.col-select:hover{background:var(--accentLight)}td{height:43px;border-bottom:1px solid var(--line)}
.fixed-bit{font-size:17px;font-weight:700;background:var(--bg)}.start-answers{border-left:1px solid var(--line)}
.ans-cell{background:white;padding:2px 3px}.ans-cell.current-col{background:var(--bg)}
.bit{position:relative;display:block;width:100%;height:35px;min-width:0;border:1px solid var(--line);border-radius:6px;color:var(--primary);font-size:18px;font-weight:700;line-height:1;background:white}
.bit:hover{border-color:var(--primary);background:var(--primaryLight)}.bit.none{color:var(--muted);font-weight:400}.bit.set{background:var(--primaryLight);border-color:var(--primary)}
.bit.good{border-color:var(--primary);background:var(--primaryLight)}.bit.bad{border-color:var(--error);background:var(--accentLight);color:var(--ink)}
.mark{position:absolute;right:4px;top:2px;font-size:11px;color:var(--primary);line-height:1}.bad .mark{color:var(--error);font-weight:700}
.table-progress{justify-content:space-between;gap:12px;font-size:13px;color:var(--muted);margin:10px 0}.table-progress .meter{width:80px}.table-progress .meter i{background:var(--accent)}
.actions{flex-wrap:wrap}.actions button{flex:1;white-space:nowrap}.primary{background:var(--primary);border:1.5px solid var(--primary);color:white;padding:8px 13px}.primary:hover{box-shadow:inset 0 0 0 2px var(--primaryLight)}
.primary .ico{width:17px;height:17px}.bottom-actions{justify-content:space-between;margin-top:4px}.bottom-actions .text-button{min-height:34px}
.bottom-actions .next{font-weight:700;color:var(--primary)}.feedback{margin-top:11px;border:1px solid var(--line);background:var(--card)}.feedback strong,.feedback span{display:block}
.feedback.ok{background:var(--primaryLight);border-color:var(--primary)}.feedback.review{background:var(--accentLight);border-color:var(--error)}.feedback span{margin-top:2px}
footer{background:white;border-top:1px solid var(--line);text-align:center;color:var(--muted);font-size:13px;padding:15px}footer a{color:var(--muted);font-weight:400;text-decoration:none}footer a:hover{text-decoration:underline}
dialog{color:var(--ink);width:min(94vw,760px);max-height:92vh;border:1px solid var(--line);border-radius:15px;padding:0;background:var(--bg);font-family:inherit}
dialog::backdrop{background:rgb(32 36 31 / 43%)}.modal-inner{padding:20px}.modal-inner .panel-heading{margin-bottom:14px}
.modal-drawing{overflow:auto;padding:12px 5px;border:1px solid var(--line);border-radius:9px;background:var(--bg)}
.modal-body-text{margin:11px 0}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}
@media(min-width:951px){.mast-inner{min-height:80px}.shell{padding-top:16px}.instruction{padding-block:11px}.navline{margin:12px 0 10px}.case{min-height:57px}.case-nav{margin-bottom:14px}.panel{padding:18px}td{height:40px}}
@media(min-width:1550px){.shell{padding-top:21px}}
@media(max-width:950px){.mast-inner,.shell{padding-inline:19px}.workspace{gap:12px;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.panel{padding:14px}.case{gap:7px;padding:8px}.course-progress .meter{display:none}.drawing{min-height:155px}.signals{gap:6px}.case-icon{height:30px;width:30px}}
@media(max-width:760px){.workspace{grid-template-columns:minmax(0,1fr)}.case-nav{gap:6px}.case-name{font-size:14px}.case-icon{display:none}.table-zoom{display:flex}.table-panel{scroll-margin-top:8px}.drawing{min-height:0}.course-progress{font-size:13px}.method{font-size:15px}.shell{max-width:650px}.mast-inner{max-width:650px}.bit,.col-select,.icon-btn{min-height:44px}.bit{height:44px}.icon-btn{width:44px}.bottom-actions .text-button{min-height:44px}}
@media(max-width:600px){.mast-inner,.shell{padding-inline:13px}.mast-inner{padding-block:11px;gap:8px;min-height:0}.kicker{font-size:10px;letter-spacing:.11em}h1{font-size:26px}.header-buttons{gap:5px}.header-buttons .outline{min-width:44px;padding:6px 9px;font-size:13px}.header-buttons .outline .ico{width:16px;height:16px}
  #truthTable.wide-table col.in-col{width:19px}
  .family-nav button{min-width:0;line-height:1.18}.family-nav button [data-icon]{display:none}
  #langBtn [data-icon],#fsLabel{display:none}#fsBtn{width:44px}.instruction{padding:10px 11px;align-items:start;gap:8px;font-size:14px}.instruction .ico{width:18px;height:18px;margin-top:1px}.shell{padding-top:12px}

// Every input pin has one named source. The same connections drive the drawing
// and the calculation, including connections to both pins of the same gate.
function wire(signal, ...via) { return {signal, via}; }
function bend(signal, x, fromY, toY) { return wire(signal, [x, fromY], [x, toY]); }
function tied(signal, x, y) { return [bend(signal,x,y,y-12), bend(signal,x,y,y+12)]; }
function gate(out, op, x, y, ...pins) { return {out, op, x, y, pins}; }

// The NAND and NOR lessons pair the same two wiring patterns.
function invertGateOutput(id, gateType, icon) {
  return {id, family:gateType, icon, inputs:[['A',45],['B',119]],
    size:[525,166], sink:478, dots:[['N',290,82]], labels:{N:[257,69]},
    gates:[
      gate('N',gateType,147,82, bend('A',94,45,70), bend('B',94,119,94)),
      gate('S',gateType,343,82,...tied('N',290,82))
    ]};
}
function combineInvertedInputs(id, gateType, icon) {
  return {id, family:gateType, icon, inputs:[['A',52],['B',153]],
    size:[525,202], sink:478, dots:[['A',93,52],['B',93,153]], labels:{X:[249,41],Y:[249,142]},

    ]};
}

const OPS = {
  and:(a,b)=>a & b, or:(a,b)=>a | b, not:a=>1-a, nand:(a,b)=>1-(a & b), nor:(a,b)=>1-(a | b)
};
function rowsFor(circuit) {
  const count=circuit.inputs.length;
  return Array.from({length:2**count},(_,index)=>{
    const signals={};
    circuit.inputs.forEach(([id],i)=>{ signals[id]=(index>>(count-1-i)) & 1; });
    for (const g of circuit.gates) signals[g.out]=OPS[g.op](...g.pins.map(p=>signals[p.signal]));
    return signals;
  });
}
function netPaths(circuit) {
  const sources=new Map(circuit.inputs.map(([id,y])=>[id,[48,y]]));
  const paths=[];
  for (const g of circuit.gates) {
    g.pins.forEach((pin,i)=>{
      const y=g.y+(g.pins.length===1 ? 0 : (i===0 ? -12 : 12));
      paths.push({signal:pin.signal, points:[sources.get(pin.signal),...pin.via,[g.x,y]]});
    });
    sources.set(g.out,[g.x+78,g.y]);
  }
  const last=circuit.gates[circuit.gates.length-1];
  paths.push({signal:last.out,points:[sources.get(last.out),[circuit.sink,last.y]]});
  return paths;
}

function svgEl(tag,attrs={},content) {

function wireCrossings(nets) {
  const vertical=[],horizontal=[];
  for(const {signal,points} of nets) {
    for(let k=1;k<points.length;k++) {
      const [x1,y1]=points[k-1], [x2,y2]=points[k];
      if(x1===x2 && y1!==y2) vertical.push({signal,x:x1,lo:Math.min(y1,y2),hi:Math.max(y1,y2)});
      else if(y1===y2 && x1!==x2) horizontal.push({signal,y:y1,lo:Math.min(x1,x2),hi:Math.max(x1,x2)});
    }
  }
  const crosses=new Map();
  for(const h of horizontal) for(const v of vertical) {
    if(h.signal!==v.signal && v.x>h.lo+5 && v.x<h.hi-5 && h.y>v.lo+3 && h.y<v.hi-3) {
      crosses.set(v.x+','+h.y, {x:v.x,y:h.y,signal:h.signal});
    }
  }
  return [...crosses.values()];
}

}
function gateGroup(g,chosen,interactive) {

    shape='M0 -23 Q44 -26 70 0 Q44 26 0 23 Q17 0 0 -23 Z'; tx=36;
    for(const y of [-12,12])gr.append(svgEl('path',{class:'gate-in',d:'M0 '+y+' H7'}));
  } else if(g.op==='not'){ shape='M0 -23 L61 0 L0 23 Z'; tx=21; }
  else {shape='M0 -23 H42 C58 -23 70 -13 70 0 C70 13 58 23 42 23 H0 Z';tx=32;}
  gr.append(svgEl('path',{class:'gate-face',d:shape}));

  }else gr.append(svgEl('path',{class:'gate-in',d:'M70 0H78'}));

function createDiagram(circuit,focus,interactive=true) {
  const [w,h]=circuit.size, svg=svgEl('svg',{
    class:'diagram-svg',viewBox:'0 0 '+w+' '+h,role:'group','aria-label':T().sketch(T().cases[circuit.id].title)
  });
  const nets=netPaths(circuit);
  const line=(s)=>'wire'+(s===focus?' selected':'');
  for(const {signal,points} of nets){
    const d=points.map(([x,y],i)=>(i?'L':'M')+x+' '+y).join(' ');
    svg.append(svgEl('path',{class:line(signal),d,'data-net':signal}));
  }
  for(const {x,y,signal} of wireCrossings(nets)){
    svg.append(svgEl('path',{d:'M'+(x-5)+' '+y+'h10',stroke:'var(--bg)','stroke-width':6,fill:'none'}),
               svgEl('path',{class:line(signal),d:'M'+(x-5)+' '+y+' Q'+x+' '+(y-8)+' '+(x+5)+' '+y}));
  }
  for(const g of circuit.gates) svg.append(gateGroup(g,g.out===focus,interactive));
  for(const [signal,x,y] of circuit.dots) svg.append(svgEl('circle',{class:'dot'+(signal===focus?' selected':''),cx:x,cy:y,r:3.6}));
  for(const [id,y] of circuit.inputs)svg.append(terminal(17,y,id));
  const last=circuit.gates[circuit.gates.length-1]; svg.append(terminal(circuit.sink,last.y,last.out,true));
  for(const [id,[x,y]] of Object.entries(circuit.labels))svg.append(svgEl('text',{class:'net-label'+(id===focus?' selected':''),x,y},id));
  if(interactive){
    const choose=e=>{
      const target=e.target.closest('[data-gate]'); if(!target)return;
      if(e.type==='keydown' && !['Enter',' '].includes(e.key))return;

    };
    svg.addEventListener('click',choose); svg.addEventListener('keydown',choose);
  }
  return svg;
}

  const gates=c.gates.map(g=>g.out), expected=truth[c.id];

function verify(scope){
  const c=current(),b=board(),columns=c.gates.map((g,k)=>({g,k})).filter(({g})=>scope==='all'||g.out===scope);
  let wrong=0,missing=0,firstWrong,firstMissing;
  // Find the earliest incorrect intermediate signal before reporting a later one.
  for(const {g,k} of columns){
    b.vals.forEach((row,r)=>{
      if(row[k]===null){missing++;firstMissing??={row:r,signal:g.out};b.marks[r][k]='';}
      else if(row[k]!==truth[c.id][r][g.out]){wrong++;firstWrong??={row:r,signal:g.out};b.marks[r][k]='bad';}
      else b.marks[r][k]='good';
      drawBit(cellAt(r,k),r,k);
    });
  }
  b.solved=b.marks.every(row=>row.every(m=>m==='good'));
  if(wrong||missing){
    const first=firstWrong||firstMissing;b.feedback={kind:'review',scope,wrong,missing,...first};chooseColumn(first.signal);
  }else if(!b.solved){
    const k=c.gates.findIndex((_,i)=>b.marks.some(row=>row[i]!=='good'));
    b.feedback={kind:'column',signal:scope,next:k>=0?c.gates[k].out:null};
  }else b.feedback=null;

}

}
function tableKey(e){
  const node=e.target.closest('button[data-row]');if(!node||e.ctrlKey||e.altKey||e.metaKey)return;
  const r=Number(node.dataset.row),k=Number(node.dataset.col),c=current(),rows=truth[c.id].length,cols=c.gates.length;
  let rr=r,kk=k;
  if(e.key==='0'||e.key==='1'){
    updateBit(r,k,Number(e.key));
    if(r+1<rows)rr++;
  }else if(e.key==='Enter'&&r===rows-1&&k+1<cols){rr=0;kk++;
  }else if(e.key==='Backspace'||e.key==='Delete'){updateBit(r,k,null);}
  else {
    const delta={ArrowUp:[-1,0],ArrowDown:[1,0],ArrowLeft:[0,-1],ArrowRight:[0,1]}[e.key];
    if(!delta)return;rr=Math.max(0,Math.min(rows-1,r+delta[0]));kk=Math.max(0,Math.min(cols-1,k+delta[1]));
  }
  e.preventDefault();if(rr!==r||kk!==k)cellAt(rr,kk)?.focus();
}
function renderModal(){
  const t=T(),body=$('modalBody');body.replaceChildren();setLabel($('closeModal'),t.close);
  if(modalKind==='diagram'){
    setText('modalTitle',t.cases[state.active].title);
    const area=el('div','modal-drawing');area.tabIndex=0;area.setAttribute('aria-label',t.inspect);
    const diagram=createDiagram(current(),board().focus,false);
    diagram.style.minWidth=current().size[0]+'px';
    area.append(diagram);body.append(area,el('p','modal-body-text',t.graphHelp));
  }else if(modalKind==='help'){
    setText('modalTitle',t.keysTitle);body.append(el('p','modal-body-text',t.keys),el('p','modal-body-text',t.graphHelp));
  }else if(modalKind==='reset'){
    setText('modalTitle',t.resetTitle);body.append(el('p','modal-body-text',t.resetText));
    const actions=el('div','modal-actions'),cancel=el('button','outline',t.cancel),clear=el('button','primary',t.clear);
    cancel.type=clear.type='button';cancel.onclick=closeDialog;clear.onclick=()=>{
      state.boards[state.active]=freshBoard(current());closeDialog();switchCase(state.active);
    };actions.append(cancel,clear);body.append(actions);
  }
}
function openDialog(kind){
  modalKind=kind;renderModal();const dlg=$('modal');
  if(typeof dlg.showModal==='function')dlg.showModal();else dlg.setAttribute('open','');
}
function closeDialog(){
  const dlg=$('modal');if(typeof dlg.close==='function')dlg.close();else dlg.removeAttribute('open');modalKind=null;
}
function isFs(){return !!(document.fullscreenElement||document.webkitFullscreenElement||document.body.classList.contains('focus-mode'));}
function syncFs(){
  const s=isFs()?T().exitFullscreen:T().fullscreen;setText('fsLabel',s);setLabel($('fsBtn'),s);
  $('fsBtn').setAttribute('aria-pressed',String(isFs()));
}
function fullFallback(){document.body.classList.add('focus-mode');window.scrollTo(0,0);syncFs();}
async function toggleFullscreen(){
  if(document.body.classList.contains('focus-mode')){document.body.classList.remove('focus-mode');syncFs();return;}
  try{
    if(isFs()){const exit=document.exitFullscreen||document.webkitExitFullscreen;if(exit)await exit.call(document);}
    else{const root=document.documentElement;const req=root.requestFullscreen||root.webkitRequestFullscreen;
      if(req)await req.call(root);else fullFallback();}
  }catch{if(!isFs())fullFallback();}
  syncFs();
}
function applyLang(){
  const t=T();document.documentElement.lang=lang;document.title=t.title+' · Gymnase — Frédéric Jaccard';
  document.querySelector('meta[name="description"]').setAttribute('content',t.description);
  for(const [id,key] of Object.entries({title:'title',kicker:'kicker',langText:'language',instruction:'instruction',
    storiesText:'stories',nandText:'nand',norText:'nor',tableTitle:'table',method:'method',resetLabel:'startAgain',
    checkAllLabel:'checkAll',nextLabel:'next',backLink:'backList'}))setText(id,t[key]);
  setLabel($('langBtn'),t.switchLang);syncFs();populateNavigation();buildTable();populateCircuit();updateStatus();
  if(modalKind)renderModal();
}
document.querySelectorAll('[data-icon]').forEach(item=>item.append(icon(item.dataset.icon)));
$('familyNav').addEventListener('click',e=>{const b=e.target.closest('[data-family]');if(b && current().family!==b.dataset.family)switchCase(state.last[b.dataset.family]);});
$('caseNav').addEventListener('click',e=>{const b=e.target.closest('[data-case]');if(b && b.dataset.case!==state.active)switchCase(b.dataset.case);});
$('caseSelect').onchange=e=>switchCase(e.target.value);
$('truthTable').addEventListener('click',e=>{
  const head=e.target.closest('[data-head]');if(head){chooseColumn(head.dataset.head);return;}
  const target=e.target.closest('[data-row]');if(!target)return;
  const r=Number(target.dataset.row),k=Number(target.dataset.col),val=board().vals[r][k];
  updateBit(r,k,val===null?0:val===0?1:null);
});
$('truthTable').addEventListener('focusin',e=>{const b=e.target.closest('[data-col]');if(b)chooseColumn(current().gates[Number(b.dataset.col)].out);});
$('truthTable').addEventListener('keydown',tableKey);
$('hintBtn').onclick=()=>{hintOpen=!hintOpen;updateSelection();};
$('checkAll').onclick=()=>verify('all');$('checkColumn').onclick=()=>verify(board().focus);
$('resetBtn').onclick=()=>openDialog('reset');$('nextBtn').onclick=nextCase;
for(const id of ['zoomBtn','tableZoom'])$(id).onclick=()=>openDialog('diagram');
$('helpBtn').onclick=()=>openDialog('help');$('closeModal').onclick=closeDialog;
$('modal').addEventListener('close',()=>{modalKind=null;});
$('modal').addEventListener('click',e=>{if(e.target===$('modal')){const rect=$('modal').getBoundingClientRect();
  if(e.clientX<rect.left||e.clientX>rect.right||e.clientY<rect.top||e.clientY>rect.bottom)closeDialog();}});
$('langBtn').onclick=()=>{lang=lang==='fr'?'en':'fr';saveLang();applyLang();};
$('fsBtn').onclick=toggleFullscreen;
document.addEventListener('fullscreenchange',syncFs);document.addEventListener('webkitfullscreenchange',syncFs);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.body.classList.contains('focus-mode')&&!$('modal').open){document.body.classList.remove('focus-mode');syncFs();}});
applyLang();

</script>
</body>

<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Le jeu de la vie · Gymnase — Frédéric Jaccard</title>

<style>
:root{
  --bg:#FBFAF6; --card:#F7F6F2; --primary:#155E4C; --primaryLight:#E3F0EA;
  --accent:#D96A08; --accentLight:#FDEBD8; --line:#D8D5CB; --ink:#20241F; --muted:#6E726B;
  --error:#C84B31;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:"Quattrocento Sans",sans-serif;padding:20px;max-width:1200px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px;margin-bottom:16px}
.kicker{font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
h1{font-size:26px;color:var(--primary)}
.hdrBtns{display:flex;gap:8px}
button{font-family:inherit;font-size:14px;font-weight:700;padding:8px 16px;border-radius:10px;
  border:2px solid var(--primary);background:var(--card);color:var(--primary);cursor:pointer;min-height:44px}
button:hover{background:var(--primaryLight)}
button.on{background:var(--primary);color:#fff}
button.acc{background:var(--accent);border-color:var(--accent);color:#fff}
button.acc:hover{filter:brightness(1.08)}
.instruction{background:var(--primaryLight);border-radius:12px;padding:12px 16px;margin-bottom:16px;font-size:15px;color:var(--primary)}
.zone{display:grid;grid-template-columns:1fr 300px;gap:16px;align-items:start}
.panel{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:14px}
.panel h2{font-size:15px;color:var(--primary);margin-bottom:10px}
.gridWrap{position:relative;border:2px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
canvas{display:block;width:100%;height:auto;touch-action:none;cursor:crosshair}
.stats{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;font-size:14px;color:var(--muted);align-items:center}
.stats>span{white-space:nowrap}
.stats b{color:var(--ink);font-variant-numeric:tabular-nums;display:inline-block;min-width:6.5ch;text-align:left}
#patInfo,#presetInfo{margin-top:10px;font-size:13.5px;color:var(--muted);line-height:1.45;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;display:none}
#patWarn{margin-top:8px;font-size:13.5px;color:var(--error);background:var(--accentLight);border:1.5px solid var(--error);border-radius:10px;padding:8px 12px;display:none}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.patGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.patGrid button{min-height:44px;font-size:13px;padding:6px 8px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.chip{min-width:40px;min-height:40px;padding:4px;border-radius:8px;font-size:14px}
.chip.on{background:var(--primary);color:#fff}
.rlab{font-size:13px;font-weight:700;color:var(--muted)}
.ruleRead{font-size:14px;font-weight:700;color:var(--accent);margin-bottom:8px}
.speedRow{display:flex;align-items:center;gap:10px;margin-top:4px}
input[type=range]{accent-color:var(--primary);flex:1;height:34px}
#inspect{display:none;margin-top:12px;background:var(--primaryLight);border-radius:10px;padding:10px 12px;font-size:14px;color:var(--primary)}
footer{margin-top:20px;text-align:center;color:var(--muted);font-size:13px}
footer a{color:var(--muted);font-weight:400;text-decoration:none}
footer a:hover{text-decoration:underline}
#infoOverlay{position:fixed;inset:0;background:rgba(32,36,31,.45);display:none;align-items:flex-start;justify-content:center;z-index:40;overflow-y:auto;padding:30px 16px}
#infoPanel{background:var(--bg);border:2px solid var(--primary);border-radius:14px;max-width:720px;width:100%;padding:18px 22px;box-shadow:0 12px 40px rgba(32,36,31,.25)}
#infoHead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:8px}
#infoHead h2{font-size:20px;color:var(--primary)}
#infoBody{font-size:14.5px;line-height:1.55;color:var(--ink)}
#infoBody h3{font-size:15px;color:var(--primary);margin:14px 0 5px}
#infoBody h3:first-child{margin-top:0}
#infoBody p{margin:6px 0}
#infoBody ul{margin:6px 0 6px 20px}
#infoBody li{margin:3px 0}
#infoBody b{color:var(--primary)}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
@media(max-width:900px){.zone{grid-template-columns:1fr}}
@media(max-width:640px){body{padding:14px}h1{font-size:22px}.hdrBtns{width:100%}.patGrid{grid-template-columns:1fr 1fr}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>
</head>

</div>
<footer><a href="index.html" id="backLink"></a> · <a href="https://fredericjaccard.com">Frédéric Jaccard</a></footer>

      pulsar:"Grand oscillateur de période 3, spectaculaire : 48 cellules qui pulsent en cercle.",

    },
    infoBtn:"Information", infoClose:"Fermer", infoHtml:`<h3>Un « jeu » sans joueurs</h3>
<p>Le jeu de la vie n'est pas vraiment un jeu : personne ne joue, il n'y a ni gagnant ni perdant. C'est un <b>automate cellulaire</b> : une grille de cellules, vivantes ou mortes, qui évoluent toutes en même temps selon des règles fixes. On choisit la configuration de départ, on lance… et on regarde ce qui se passe.</p>
<h3>Les règles (B3/S23)</h3>
<p>À chaque génération, on compte pour chaque cellule ses 8 voisines :</p>
<ul>
<li><b>Naissance (B3)</b> : une cellule morte entourée d'exactement <b>3</b> voisines vivantes devient vivante.</li>
<li><b>Survie (S23)</b> : une cellule vivante avec <b>2 ou 3</b> voisines vivantes reste vivante ; sinon elle meurt (d'isolement avec 0 ou 1 voisine, ou d'étouffement avec 4 ou plus).</li>
</ul>
<p>Ces deux phrases suffisent à produire des comportements d'une richesse surprenante : motifs fixes (bloc), oscillateurs (clignotant, pulsar), vaisseaux qui se déplacent (planeur), et même des « canons » qui produisent des planeurs sans fin.</p>
<h3>Un peu d'histoire</h3>
<ul>
<li><b>Années 1940</b> : le mathématicien John von Neumann cherche à décrire des machines capables de s'auto-reproduire et imagine les premiers automates cellulaires.</li>
<li><b>1970</b> : le mathématicien britannique <b>John Horton Conway</b> invente le jeu de la vie, en cherchant les règles les plus simples donnant des comportements intéressants. Il le présente comme un passe-temps, souvent joué à la main sur des plateaux de go.</li>
<li><b>Octobre 1970</b> : Martin Gardner publie le jeu dans sa rubrique de <i>Scientific American</i>. C'est un succès immédiat : on raconte que des millions d'heures de calcul ont été « gaspillées » à le faire tourner dans les universités et les entreprises — probablement l'un des programmes les plus exécutés de l'histoire à l'époque.</li>
<li><b>Quelques semaines plus tard</b>, des lecteurs découvrent le <b>planeur</b>, puis le <b>canon de Gosper</b> (Bill Gosper, MIT), qui prouve que la population peut croître indéfiniment.</li>
<li><b>Années 1980 et après</b> : on démontre que le jeu de la vie est <b>complet au sens de Turing</b> : on peut y construire des portes logiques, de la mémoire… et donc un ordinateur complet. Des ordinateurs entiers ont effectivement été construits avec des planeurs, capables de calculer des nombres premiers.</li>
<li><b>2020</b> : John Horton Conway meurt à 82 ans, des suites de la Covid-19.</li>
</ul>
<h3>Pourquoi est-ce célèbre ?</h3>
<p>Le jeu de la vie est l'exemple le plus connu d'<b>émergence</b> : des règles locales très simples, appliquées partout en même temps, font apparaître des structures complexes que personne n'avait programmées — des vaisseaux, des usines, des calculatrices. C'est une idée centrale en science : la complexité du monde (fourmis, neurones, écosystèmes, villes) peut naître de règles locales simples.</p>
<h3>D'autres règles, d'autres mondes</h3>
<p>Les règles de Conway ne sont qu'une possibilité parmi des milliers : chaque combinaison de conditions de naissance (B) et de survie (S) définit un « univers » différent. On en a catalogué énormément ; la plupart sont ennuyeuses (tout meurt, ou tout explose), mais quelques-unes sont célèbres. Quatre sont proposées dans l'application :</p>
<ul>
<li><b>Conway (B3/S23)</b> — la règle originale : équilibre remarquable entre mort et croissance, oscillateurs, vaisseaux, canons. C'est la plus étudiée de toutes.</li>
<li><b>HighLife (B36/S23)</b> — identique à Conway, plus une naissance possible avec 6 voisins. Ce petit ajout change tout pour certains motifs : il existe en HighLife un « réplicateur », un motif qui produit des copies de lui-même — introuvable sous les règles de Conway.</li>
<li><b>Jour &amp; nuit (B3678/S34678)</b> — une règle dite « inversible » : échanger les cellules vivantes et mortes donne un monde qui se comporte pareil. Résultat : les grandes zones vides se remplissent d'elles-mêmes, et l'univers ressemble à une mosaïque de régions « jour » et « nuit » inversées les unes des autres.</li>
<li><b>Labyrinthe (B3/S12345)</b> — ici, presque toute cellule vivante survit. Les motifs aléatoires se figent rapidement en structures filandreuses qui évoquent des couloirs de labyrinthe ou des réseaux de neurones.</li>
</ul>
<p>Essayez la même configuration de départ (par exemple « Aléatoire ») sous plusieurs règles : le contraste est saisissant, et c'est la meilleure démonstration que <b>ce sont les règles qui créent le monde</b>.</p>
<h3>Quelques motifs à essayer dans l'application</h3>
<ul>
<li><b>Bloc</b> : ne bouge jamais (motif stable).</li>
<li><b>Clignotant</b> : alterne entre deux formes (période 2).</li>
<li><b>Pulsar</b> : oscillateur spectaculaire de période 3.</li>
<li><b>Planeur</b> : se déplace en diagonale, d'une case toutes les 4 générations.</li>
<li><b>R-pentomino</b> : seulement 5 cellules… mais 1&nbsp;103 générations de chaos avant de se stabiliser !</li>
<li><b>Diehard</b> : disparaît complètement après environ 130 générations.</li>
<li><b>Canon de Gosper</b> : produit un planeur toutes les 30 générations, sans jamais s'arrêter.</li>
</ul>`,
    presetInfo:{
      conway:"Les règles originales de Conway (1970) : naissance avec 3 voisins, survie avec 2 ou 3. Un équilibre parfait entre mort et expansion.",
      highlife:"Comme Conway, mais une cellule naît aussi avec 6 voisins : des structures en expansion lente apparaissent.",
      daynight:"Naissance avec 3, 6, 7 ou 8 voisins, survie avec 3, 4, 6, 7 ou 8 : les grandes zones vides se remplissent, créant des continents de cellules.",
      laby:"Naissance avec 3 voisins, survie toujours : les cellules ne meurent jamais et dessinent des couloirs de labyrinthe."
    }
  },
  en:{
    kicker:"ALGORITHMS", title:"The Game of Life",
    instruction:"Click on the grid (or drag) to switch cells on, pick a famous pattern to place, then run the simulation. Turn on “Count the neighbours” to examine a cell in detail.",
    fs:"Fullscreen", fsExit:"Exit", backList:"← All applications",
    play:"Play", pause:"Pause", step:"1 generation", rand:"Random", clear:"Clear all",

    chif:"Chif.02 mode",
    gen:"Generation", alive:"Living cells", speed:"Speed",
    graphTitle:"Population over generations",
    patTitle:"Famous patterns",
    rulesTitle:"Rules of the game",
    surv:"Survival: a living cell survives with…", birth:"Birth: a dead cell is born with…",
    presets:"Famous rule sets:",
    patWarn:"Warning: this pattern is designed for Conway's rule B3/S23. With the current rule, it will behave differently.",
    inspectOn:"Click a cell to see its 8 neighbours.",
    inspect:(alive,n,dest)=>`This cell is ${alive?"alive":"dead"}: ${n} living neighbour${n>1?"s":""} → ${dest}`,
    dMort:"it dies", dNait:"it is born", dVit:"it stays alive", dRien:"it stays dead",

    patInfo:{
      bloc:"Still life: nothing ever changes. Every cell has exactly 3 neighbours.",
      clignotant:"Period-2 oscillator: it flips between horizontal and vertical forever.",
      crapaud:"Period-2 oscillator: the 4 middle cells “breathe”.",
      phare:"Period-2 oscillator: two blocks touching at a corner, like a lighthouse beam.",

    infoBtn:"Information", infoClose:"Close", infoHtml:`<h3>A "game" with no players</h3>
<p>The Game of Life is not really a game: nobody plays, there is no winner and no loser. It is a <b>cellular automaton</b>: a grid of cells, alive or dead, that all evolve at the same time following fixed rules. You choose the starting configuration, press play… and watch what happens.</p>
<h3>The rules (B3/S23)</h3>
<p>At each generation, the 8 neighbours of every cell are counted:</p>
<ul>
<li><b>Birth (B3)</b>: a dead cell with exactly <b>3</b> living neighbours becomes alive.</li>
<li><b>Survival (S23)</b>: a living cell with <b>2 or 3</b> living neighbours stays alive; otherwise it dies (from isolation with 0 or 1 neighbour, or from overcrowding with 4 or more).</li>
</ul>
<p>These two sentences are enough to produce surprisingly rich behaviour: still lifes (block), oscillators (blinker, pulsar), moving spaceships (glider), and even "guns" that produce gliders forever.</p>
<h3>A bit of history</h3>
<ul>
<li><b>1940s</b>: mathematician John von Neumann studies machines able to reproduce themselves and imagines the first cellular automata.</li>
<li><b>1970</b>: British mathematician <b>John Horton Conway</b> invents the Game of Life, looking for the simplest rules that give interesting behaviour. He presents it as a pastime, often played by hand on go boards.</li>
<li><b>October 1970</b>: Martin Gardner publishes the game in his <i>Scientific American</i> column. It is an instant hit: reportedly millions of computer hours were "wasted" running it in universities and companies — probably one of the most-run programs in history at the time.</li>
<li><b>A few weeks later</b>, readers discover the <b>glider</b>, then the <b>Gosper glider gun</b> (Bill Gosper, MIT), proving that the population can grow forever.</li>
<li><b>1980s and beyond</b>: the Game of Life is proven to be <b>Turing complete</b>: you can build logic gates, memory… and therefore a full computer. Real computers made of gliders have been built, capable of computing prime numbers.</li>
<li><b>2020</b>: John Horton Conway dies at 82, from Covid-19.</li>
</ul>
<h3>Why is it famous?</h3>
<p>The Game of Life is the best-known example of <b>emergence</b>: very simple local rules, applied everywhere at once, give rise to complex structures nobody programmed — spaceships, factories, calculators. This is a central idea in science: the complexity of the world (ants, neurons, ecosystems, cities) can arise from simple local rules.</p>
<h3>Other rules, other worlds</h3>
<p>Conway's rules are just one possibility among thousands: every combination of birth (B) and survival (S) conditions defines a different "universe". A great many have been catalogued; most are boring (everything dies, or everything explodes), but a few are famous. Four are available in the app:</p>
<ul>
<li><b>Conway (B3/S23)</b> — the original rule: a remarkable balance between death and growth, with oscillators, spaceships and guns. It is the most studied rule of all.</li>
<li><b>HighLife (B36/S23)</b> — identical to Conway, plus a birth possible with 6 neighbours. This small addition changes everything for some patterns: HighLife has a "replicator", a pattern that produces copies of itself — no such pattern is known under Conway's rules.</li>
<li><b>Day &amp; Night (B3678/S34678)</b> — a so-called "self-complementary" rule: swapping alive and dead cells gives a world that behaves the same way. As a result, large empty regions fill in by themselves, and the universe looks like a mosaic of inverted "day" and "night" regions.</li>
<li><b>Maze (B3/S12345)</b> — here, almost every living cell survives. Random patterns quickly freeze into winding structures that look like maze corridors or networks of neurons.</li>
</ul>
<p>Try the same starting configuration (for example "Random") under several rules: the contrast is striking, and it is the best demonstration that <b>the rules are what create the world</b>.</p>
<h3>Some patterns to try in the app</h3>
<ul>
<li><b>Block</b>: never moves (still life).</li>
<li><b>Blinker</b>: alternates between two shapes (period 2).</li>
<li><b>Pulsar</b>: a spectacular period-3 oscillator.</li>
<li><b>Glider</b>: moves diagonally, one cell every 4 generations.</li>
<li><b>R-pentomino</b>: only 5 cells… but 1,103 generations of chaos before settling down!</li>
<li><b>Diehard</b>: vanishes completely after about 130 generations.</li>
<li><b>Gosper gun</b>: produces one glider every 30 generations, forever.</li>
</ul>`,
    presetInfo:{
      conway:"Conway's original rules (1970): birth with 3 neighbours, survival with 2 or 3. A perfect balance between death and expansion.",
      highlife:"Like Conway, but a cell is also born with 6 neighbours: slowly expanding structures appear.",
      daynight:"Birth with 3, 6, 7 or 8 neighbours, survival with 3, 4, 6, 7 or 8: large empty areas fill up, creating continents of cells.",
      laby:"Birth with 3 neighbours, survival always: cells never die and draw maze corridors."
    }
  }
};
let lang=(function(){try{const c=document.cookie.match(/(?:^|;\s*)fj-lang=([a-z]{2})/);if(c&&(c[1]==="fr"||c[1]==="en"))return c[1];}catch(e){}try{const s=localStorage.getItem("fj-lang");return(s==="fr"||s==="en")?s:"fr";}catch(e){return"fr";}})();
const T = () => I18N[lang];

/* ---------- Grille ---------- */
const COLS = 100, ROWS = 60;            // fenêtre visible (cellules à l'écran)
const OX = 0, OY = 0;                    // origine logique de la fenêtre (monde sans borne)
const cv = $("cv"), ctx = cv.getContext("2d");
cv.width = 900; cv.height = Math.round(900*ROWS/COLS);
const CW = cv.width/COLS, CH = cv.height/ROWS;
let live = new Set();   // cellules vivantes ("c,r") ; le monde est sans borne
let gen = 0, playing = false, timer = null, speed = 8;
let surv = new Set([2,3]), birth = new Set([3]);
let neighMode = false, selected = null;
let chifMode = false;
let histo = [];
let ncounts = new Map();   // nombre de voisins vivants par cellule (génération courante)

const key = (c,r) => c+","+r;
const alive = (c,r) => live.has(key(c,r));
function voisins(c,r){
  let n=0;
  for(let dr=-1;dr<=1;dr++) for(let dc=-1;dc<=1;dc++)
    if(dr||dc) n+=alive(c+dc,r+dr);
  return n;
}
function etape(){
  const counts = new Map();
  for(const k of live){
    const p = k.split(","), c = +p[0], r = +p[1];
    for(let dr=-1;dr<=1;dr++) for(let dc=-1;dc<=1;dc++){
      if(!dr && !dc) continue;
      const kk = key(c+dc, r+dr);
      counts.set(kk, (counts.get(kk)||0)+1);
    }
  }
  const ng = new Set();
  for(const [kk,n] of counts){
    if(live.has(kk) ? surv.has(n) : birth.has(n)) ng.add(kk);
  }
  ncounts = counts;
  live = ng; gen++;
  histo.push(vivantes());
  if(selected) showInspect(selected.c,selected.r);
  render(); stats(); drawGraph();
}
function vivantes(){ return live.size; }

function render(){
  if(chifMode){
    ctx.fillStyle="#0B0F0D"; ctx.fillRect(0,0,cv.width,cv.height);
    ctx.strokeStyle="rgba(255,255,255,.06)"; ctx.lineWidth=1; ctx.beginPath();
    for(let c=0;c<=COLS;c++){ ctx.moveTo(c*CW+.5,0); ctx.lineTo(c*CW+.5,cv.height); }
    for(let r=0;r<=ROWS;r++){ ctx.moveTo(0,r*CH+.5); ctx.lineTo(cv.width,r*CH+.5); }
    ctx.stroke();
    ctx.shadowBlur = 7;
    for(let r=OY;r<OY+ROWS;r++) for(let c=OX;c<OX+COLS;c++){
      if(!live.has(key(c,r))) continue;
      const n = ncounts.get(key(c,r))||0;
      const hue = (n*47 + gen*97) % 360;
      ctx.shadowColor = "hsl("+hue+",100%,60%)";
      ctx.fillStyle = "hsl("+hue+",100%,"+(50+n*4)+"%)";
      ctx.fillRect((c-OX)*CW+1,(r-OY)*CH+1,CW-2,CH-2);
    }
    ctx.shadowBlur = 0;
    return;
  }
  ctx.fillStyle="#FFFFFF"; ctx.fillRect(0,0,cv.width,cv.height);
  ctx.strokeStyle="#D8D5CB"; ctx.lineWidth=1; ctx.beginPath();
  for(let c=0;c<=COLS;c++){ ctx.moveTo(c*CW+.5,0); ctx.lineTo(c*CW+.5,cv.height); }
  for(let r=0;r<=ROWS;r++){ ctx.moveTo(0,r*CH+.5); ctx.lineTo(cv.width,r*CH+.5); }
  ctx.stroke();
  if(neighMode && selected){
    ctx.fillStyle="rgba(217,106,8,.18)";
    for(let dr=-1;dr<=1;dr++) for(let dc=-1;dc<=1;dc++){
      const c=selected.c+dc, r=selected.r+dr;
      if(c>=OX&&c<OX+COLS&&r>=OY&&r<OY+ROWS) ctx.fillRect((c-OX)*CW+1,(r-OY)*CH+1,CW-2,CH-2);
    }
  }
  ctx.fillStyle="#155E4C";
  for(let r=OY;r<OY+ROWS;r++) for(let c=OX;c<OX+COLS;c++)
    if(live.has(key(c,r))) ctx.fillRect((c-OX)*CW+1,(r-OY)*CH+1,CW-2,CH-2);
  if(neighMode && selected){
    ctx.strokeStyle="#D96A08"; ctx.lineWidth=2.5;
    ctx.strokeRect((selected.c-OX)*CW+1,(selected.r-OY)*CH+1,CW-2,CH-2);
  }
}
function drawGraph(){
  const g=$("graph"), gc=g.getContext("2d");
  const W=g.width=g.clientWidth*2, H=g.height=g.clientHeight*2;
  gc.clearRect(0,0,W,H);
  gc.fillStyle="#FFFFFF"; gc.fillRect(0,0,W,H);
  if(histo.length<2) return;
  const max=Math.max(...histo,1);
  const step=W/Math.max(histo.length-1,1);
  // ligne zéro
  gc.strokeStyle="#D8D5CB"; gc.lineWidth=1.5;
  gc.beginPath(); gc.moveTo(0,H-8); gc.lineTo(W,H-8); gc.stroke();
  // courbe
  gc.strokeStyle="#155E4C"; gc.lineWidth=3; gc.lineJoin="round";
  gc.beginPath();
  histo.forEach((v,i)=>{
    const x=i*step, y=H-8-(H-20)*v/max;
    i?gc.lineTo(x,y):gc.moveTo(x,y);
  });
  gc.stroke();
  // valeur max en étiquette
  gc.fillStyle="#6E726B"; gc.font="700 20px 'Quattrocento Sans',sans-serif";
  gc.fillText("max "+max, 8, 24);
}
function fmt(n){
  const s=String(n);
  const sep = lang==="fr" ? "\u202F" : ",";
  return s.replace(/\B(?=(\d{3})+(?!\d))/g, sep);
}
function stats(){
  $("stGen").innerHTML = T().gen+" : <b>"+fmt(gen)+"</b>";
  $("stAlive").innerHTML = T().alive+" : <b>"+fmt(vivantes())+"</b>";
}

/* ---------- Interaction grille ---------- */
let drawing=false, drawVal=1;
function cellFromEvent(e){
  const rect=cv.getBoundingClientRect();
  return { c:OX+Math.floor((e.clientX-rect.left)/rect.width*COLS),
           r:OY+Math.floor((e.clientY-rect.top)/rect.height*ROWS) };
}
cv.addEventListener("pointerdown", e=>{
  e.preventDefault();
  const {c,r}=cellFromEvent(e);
  if(c<OX||c>=OX+COLS||r<OY||r>=OY+ROWS) return;
  $("graphTitle").textContent=T().graphTitle;
  if(neighMode){ selected={c,r}; showInspect(c,r); render(); return; }
  drawing=true; const k=key(c,r);
  drawVal=live.has(k)?0:1;
  if(drawVal) live.add(k); else live.delete(k);
  render(); stats();
  cv.setPointerCapture(e.pointerId);
});
cv.addEventListener("pointermove", e=>{
  if(!drawing) return;
  const {c,r}=cellFromEvent(e);
  if(c<OX||c>=OX+COLS||r<OY||r>=OY+ROWS) return;
  const k2=key(c,r);
  if((live.has(k2)?1:0)!==drawVal){ if(drawVal) live.add(k2); else live.delete(k2); render(); stats(); }
});
addEventListener("pointerup", ()=>drawing=false);

function showInspect(c,r){
  const n=voisins(c,r), v=live.has(key(c,r));
  const dest = v ? (surv.has(n)?T().dVit:T().dMort) : (birth.has(n)?T().dNait:T().dRien);
  $("inspect").style.display="block";
  $("inspect").textContent = T().inspect(v,n,dest);
}

/* ---------- Motifs ---------- */
const PATTERNS = {
  bloc:[[0,0],[1,0],[0,1],[1,1]],
  clignotant:[[0,0],[1,0],[2,0]],
  crapaud:[[1,0],[2,0],[3,0],[0,1],[1,1],[2,1]],
  phare:[[0,0],[1,0],[0,1],[3,2],[2,3],[3,3]],
  planeur:[[1,0],[2,1],[0,2],[1,2],[2,2]],
  vaisseau:[[1,0],[4,0],[0,1],[0,2],[4,2],[0,3],[1,3],[2,3],[3,3]],
  pulsar:(function(){const p=[];const seg=[2,3,4,8,9,10];
    for(const r of [0,5,7,12]) for(const c of seg) p.push([c,r]);
    for(const c of [0,5,7,12]) for(const r of seg) p.push([c,r]);
    return p;})(),
  rpento:[[1,0],[2,0],[0,1],[1,1],[1,2]],
  diehard:[[6,0],[0,1],[1,1],[1,2],[5,2],[6,2],[7,2]],
  canon:[[24,0],[22,1],[24,1],[12,2],[13,2],[20,2],[21,2],[34,2],[35,2],
    [11,3],[15,3],[20,3],[21,3],[34,3],[35,3],[0,4],[1,4],[10,4],[16,4],[20,4],[21,4],
    [0,5],[1,5],[10,5],[14,5],[16,5],[17,5],[22,5],[24,5],[10,6],[16,6],[24,6],[11,7],[15,7],[12,8],[13,8]]
};
function isConway(){ return surv.size===2 && surv.has(2) && surv.has(3) && birth.size===1 && birth.has(3); }
function placer(nom){
  setPlaying(false);
  live=new Set(); gen=0;
  const w=$("patWarn");
  if(!isConway()){ w.textContent=T().patWarn; w.style.display="block"; }
  else w.style.display="none";
  const p=PATTERNS[nom];
  const wc=Math.max(...p.map(q=>q[0])), hc=Math.max(...p.map(q=>q[1]));
  const oc=OX+Math.floor((COLS-wc)/2), orr=OY+Math.floor((ROWS-hc)/2);
  for(const [dc,dr] of p) live.add(key(oc+dc,orr+dr));
  histo=[vivantes()];
  render(); stats(); drawGraph();
}
function buildPatterns(){
  const g=$("patGrid"); g.innerHTML="";
  for(const k of Object.keys(PATTERNS)){
    const b=document.createElement("button");
    b.type="button"; b.textContent=T().patterns[k];
    b.onclick=()=>{
      placer(k);
      const el=$("patInfo");
      el.textContent=T().patInfo[k];
      el.style.display="block";
    };
    g.appendChild(b);
  }
}

/* ---------- Règles ---------- */
function syncPresets(){
  const keys=Object.keys(PRESETS);
  [...$("presetChips").children].forEach((b,i)=>{
    const [B,S]=PRESETS[keys[i]];
    const on = birth.size===B.length && B.every(x=>birth.has(x))
            && surv.size===S.length && S.every(x=>surv.has(x));
    b.classList.toggle("on", on);
  });
}
function rulesChanged(){
  ruleLabel();
  syncPresets();
  if(isConway()) $("patWarn").style.display="none";
  if(selected) showInspect(selected.c,selected.r);
}
function buildChips(el, set, cb){
  el.innerHTML="";
  for(let d=0;d<=8;d++){
    const b=document.createElement("button");
    b.type="button"; b.className="chip"+(set.has(d)?" on":""); b.textContent=d;
    b.onclick=()=>{ set.has(d)?set.delete(d):set.add(d); b.classList.toggle("on"); cb(); };
    el.appendChild(b);
  }
}
function ruleLabel(){
  $("ruleRead").textContent = "B"+[...birth].sort().join("")+"/S"+[...surv].sort().join("");
}
const PRESETS={conway:[[3],[2,3]],highlife:[[3,6],[2,3]],daynight:[[3,6,7,8],[3,4,6,7,8]],laby:[[3],[1,2,3,4,5]]};
function buildPresets(){
  const g=$("presetChips"); g.innerHTML="";
  for(const k of Object.keys(PRESETS)){
    const b=document.createElement("button");
    b.type="button"; b.className="chip"; b.style.minWidth="auto"; b.style.padding="4px 10px";
    const nom=T().presetsNames[k];
    const sep=nom.indexOf(" B");
    b.innerHTML = sep<0 ? nom : nom.slice(0,sep)+' <span style="font-weight:400">'+nom.slice(sep+1)+"</span>";
    b.onclick=()=>{
      birth=new Set(PRESETS[k][0]); surv=new Set(PRESETS[k][1]);
      buildChips($("birthChips"),birth,rulesChanged);
      buildChips($("survChips"),surv,rulesChanged);
      syncPresets();
      rulesChanged();
      const el=$("presetInfo");
      el.textContent=T().presetInfo[k];
      el.style.display="block";
      if(selected) showInspect(selected.c,selected.r);
    };
    g.appendChild(b);
  }
  syncPresets();
}

/* ---------- Contrôles ---------- */
function setPlaying(p){
  playing=p;
  $("playBtn").textContent = playing?T().pause:T().play;
  $("playBtn").classList.toggle("on",playing);
  if(playing){ timer=setInterval(etape, 1000/speed); }
  else if(timer){ clearInterval(timer); timer=null; }
}
$("playBtn").onclick=()=>setPlaying(!playing);
$("stepBtn").onclick=()=>{ setPlaying(false); etape(); };
$("clearBtn").onclick=()=>{ setPlaying(false); live=new Set(); gen=0; selected=null; $("inspect").style.display="none"; histo=[0]; render(); stats(); drawGraph(); };
$("randBtn").onclick=()=>{
  live=new Set();
  for(let r=OY;r<OY+ROWS;r++) for(let c=OX;c<OX+COLS;c++)
    if(Math.random()<0.22) live.add(key(c,r));
  gen=0; histo=[vivantes()]; render(); stats(); drawGraph();
};
$("chifBtn").onclick=()=>{
  chifMode=!chifMode;
  $("chifBtn").classList.toggle("on",chifMode);
  render();
};
$("neighBtn").onclick=()=>{
  neighMode=!neighMode;
  $("neighBtn").classList.toggle("on",neighMode);
  if(!neighMode){ selected=null; $("inspect").style.display="none"; }
  else $("inspect").textContent=T().inspectOn, $("inspect").style.display="block";
  render();
};
$("speed").oninput=e=>{ speed=+e.target.value; if(playing){ clearInterval(timer); timer=setInterval(etape,1000/speed); } };

/* ---------- Langue / plein écran ---------- */
function applyLang(){
  document.documentElement.lang=lang;
  $("kicker").textContent=T().kicker;
  $("title").textContent=T().title;
  $("instruction").textContent=T().instruction;
  $("langBtn").textContent=lang==="fr"?"English":"Français";
  $("fsLabel").textContent=isFs()?T().fsExit:T().fs;
  $("backLink").textContent=T().backList;
  document.title=T().title+" · Gymnase — Frédéric Jaccard";
  $("patTitle").textContent=T().patTitle;
  $("rulesTitle").textContent=T().rulesTitle;
  $("survLab").textContent=T().surv;
  $("birthLab").textContent=T().birth;
  $("presetLab").textContent=T().presets;
  $("speedLab").textContent=T().speed;
  $("playBtn").textContent=playing?T().pause:T().play;
  $("stepBtn").textContent=T().step;
  $("randBtn").textContent=T().rand;
  $("clearBtn").textContent=T().clear;
  $("neighBtn").textContent=T().neigh;
  $("chifBtn").textContent=T().chif;
  $("infoBtn").textContent=T().infoBtn;
  $("infoClose").textContent=T().infoClose;
  $("infoTitle").textContent=T().infoBtn;
  $("infoBody").innerHTML=T().infoHtml;
  buildPatterns(); buildPresets();
  $("graphTitle").textContent=T().graphTitle;
  if(neighMode){
    if(selected) showInspect(selected.c,selected.r);
    else $("inspect").textContent=T().inspectOn;
  }
  stats();
}
$("langBtn").onclick=()=>{
  lang=lang==="fr"?"en":"fr";
  try{
    localStorage.setItem("fj-lang",lang);
    document.cookie="fj-lang="+lang+";domain=.fredericjaccard.com;path=/;max-age=31536000;SameSite=Lax";
  }catch(e){}
  applyLang();
};
$("infoBtn").onclick=()=>{ $("infoOverlay").style.display="flex"; $("infoBtn").blur(); };
function closeInfo(){ $("infoOverlay").style.display="none"; if(document.activeElement&&document.activeElement.blur) document.activeElement.blur(); }
$("infoClose").onclick=closeInfo;
$("infoOverlay").addEventListener("click",e=>{ if(e.target===$("infoOverlay")) closeInfo(); });
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeInfo(); });
function isFs(){ return !!(document.fullscreenElement||document.webkitFullscreenElement); }
$("fsBtn").onclick=()=>{
  const el=document.documentElement;
  if(isFs()) (document.exitFullscreen||document.webkitExitFullscreen).call(document);
  else{ const req=el.requestFullscreen||el.webkitRequestFullscreen;
        if(req){ const r=req.call(el); if(r&&r.catch) r.catch(()=>{}); } }
};
function syncFsLabel(){ $("fsLabel").textContent=isFs()?T().fsExit:T().fs; }
document.addEventListener("fullscreenchange",syncFsLabel);
document.addEventListener("webkitfullscreenchange",syncFsLabel);

/* ---------- Init ---------- */
buildChips($("survChips"),surv,rulesChanged);
buildChips($("birthChips"),birth,rulesChanged);
ruleLabel();
syncPresets();
applyLang();
placer("planeur");
addEventListener("resize", drawGraph);
</script>
</body>
</html>

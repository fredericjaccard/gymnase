let lang=(()=>{try{const c=document.cookie.match(/(?:^|;\s*)fj-lang=([a-z]{2})/);if(c&&['fr','en'].includes(c[1]))return c[1]}catch(e){}try{const s=localStorage.getItem('fj-lang');if(['fr','en'].includes(s))return s}catch(e){}return 'fr'})();const T=()=>I18N[lang];

function renderGuide(){const show=ex.from===10&&ex.guided;$('guide').hidden=!show;if(!show)return;const div=ex.method==='div';$('guideText').textContent=T()[div?'divisionText':'subText'](ex.to);$('qLabel').textContent=T()[div?'qDivision':'qSub'];$('history').innerHTML=cursor?table(steps.slice(0,cursor),ex.method):'';const active=cursor<steps.length&&!ex.closed;$('stepForm').hidden=!active;if(active){const s=steps[cursor];$('stepPrompt').textContent=div?`${s.n} ÷ ${ex.to}`:`${s.n} − ? × ${s.p}`;}if(!steps.length){$('stepFeedback').textContent=T().zero;$('stepFeedback').className='hint'}else if(cursor===steps.length){$('stepFeedback').textContent=T().guidedDone;$('stepFeedback').className='hint'}else{const key=stepMessage;const el=$('stepFeedback');el.className=key?'feedback'+(key==='stepCorrect'?'':' error'):'';el.textContent=key?(key==='stepWrong'?T()[div?'stepWrongDiv':'stepWrongSub'](div?ex.to:steps[cursor].p):T()[key]):''}}
function finish(success){if(ex.closed)return;ex.closed=true;done++;if(success){won++;if(!ex.errors)clean++}}
function solution(){let html='<h2>'+T().correction+'</h2>';if(ex.n===0)html+='<p>'+T().zero+'</p>';else if(ex.from===10){html+=table(steps,ex.method);if(ex.method==='sub')html+=steps.map(s=>'<p class="mono">'+s.n+Array.from({length:s.q},()=> ' − '+s.p).join('')+' = '+s.r+'</p>').join('');const digits=steps.map(s=>repr(ex.method==='div'?s.r:s.q,ex.to));if(ex.method==='div')digits.reverse();html+='<p>'+T()[ex.method==='div'?'readingDiv':'readingSub']+' : <strong class="mono">'+digits.join(' ')+'</strong></p>';if(ex.to===16)html+='<p>'+T().decimalDigits+'</p>'}else if(ex.to===10){const digits=repr(ex.n,ex.from).split('');html+='<p class="mono">'+digits.map((d,i)=>`${parseInt(d,ex.from)} × ${ex.from}<sup>${digits.length-1-i}</sup>`).join(' + ')+' = '+ex.n+'</p>';if(ex.from===16)html+='<p>'+T().decimalDigits+'</p>'}else{const hex=repr(ex.n,16).split('');html+='<h3>'+T().group+'</h3><div class="tablewrap"><table><thead><tr><th>'+T().bases[16]+'</th><th>'+T().bases[2]+'</th></tr></thead><tbody>'+hex.map(d=>'<tr><td>'+d+'</td><td class="mono">'+parseInt(d,16).toString(2).padStart(4,'0')+'</td></tr>').join('')+'</tbody></table></div>'}html+='<p><strong>'+T().result+' : </strong><span class="mono">'+repr(ex.n,ex.from)+'<sub>'+ex.from+'</sub> = '+repr(ex.n,ex.to)+'<sub>'+ex.to+'</sub></span></p>';return html}
$('stepForm').onsubmit=e=>{e.preventDefault();if(ex.closed||cursor>=steps.length)return;const q=parseNumber($('qInput').value,10),r=parseNumber($('rInput').value,10),s=steps[cursor];if(q===null||r===null){stepMessage='stepInvalid';ex.errors=true}else if(q!==s.q||r!==s.r){stepMessage='stepWrong';ex.errors=true}else{cursor++;stepMessage='stepCorrect';$('qInput').value='';$('rInput').value=''}renderGuide();if(cursor<steps.length)$('qInput').focus();else $('answer').focus()};
$('answerForm').onsubmit=e=>{e.preventDefault();if(ex.closed)return;if(ex.from===10&&ex.guided&&cursor<steps.length){message='stepFirst';render();return}const value=parseNumber($('answer').value,ex.to);if(value===null){message='invalid';ex.errors=true}else if(value===ex.n){finish(true);message='correct'}else{message='wrong';ex.errors=true}render()};
$('hintBtn').onclick=()=>{hintOn=!hintOn;render()};$('solutionBtn').onclick=()=>{finish(false);solutionOn=true;message='reveal';render()};$('nextBtn').onclick=()=>{newExercise();$('answer').focus()};for(const id of ['direction','level','mode','method'])$(id).onchange=()=>newExercise();$('customBtn').onclick=()=>{const n=parseNumber($('custom').value,ex.from);if(n===null||n>65535){$('customError').textContent=T().customError;return}newExercise(n);$('custom').value=''};
$('langBtn').onclick=()=>{lang=lang==='fr'?'en':'fr';try{localStorage.setItem('fj-lang',lang)}catch(e){}try{document.cookie='fj-lang='+lang+';domain=.fredericjaccard.com;path=/;max-age=31536000;SameSite=Lax'}catch(e){}applyLang()};
function isFs(){return !!(document.fullscreenElement||document.webkitFullscreenElement||document.body.classList.contains('expanded'))}function syncFsLabel(){$('fsLabel').textContent=isFs()?T().fsExit:T().fs}$('fsBtn').onclick=()=>{const el=document.documentElement;if(document.body.classList.contains('expanded')){document.body.classList.remove('expanded');syncFsLabel();return}if(document.fullscreenElement||document.webkitFullscreenElement){const exit=document.exitFullscreen||document.webkitExitFullscreen;if(exit)exit.call(document)}else{const req=el.requestFullscreen||el.webkitRequestFullscreen;const fallback=()=>{document.body.classList.add('expanded');syncFsLabel()};if(req){try{const r=req.call(el);if(r&&r.catch)r.catch(fallback)}catch(e){fallback()}}else fallback()}};document.addEventListener('fullscreenchange',syncFsLabel);document.addEventListener('webkitfullscreenchange',syncFsLabel);
applyLang();newExercise();
</script></body></html>

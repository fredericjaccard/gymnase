<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23155E4C'/%3E%3Ctext x='32' y='43' font-family='Arial,sans-serif' font-size='28' font-weight='bold' fill='%23FBFAF6' text-anchor='middle'%3EFJ%3C/text%3E%3C/svg%3E">
<meta name="description" content="Application interactive pour le cours d'informatique.">
<title>Constructeur NON-ET — Architecture des ordinateurs · Gymnase — Frédéric Jaccard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Quattrocento+Sans:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FBFAF6; --card:#F7F6F2; --ink:#20241F; --muted:#6E726B;
    --primary:#155E4C; --primary-light:#E3F0EA;
    --accent:#D96A08; --accent-light:#FDEBD8; --line:#D8D5CB;
  }
  *{margin:0; padding:0; box-sizing:border-box; user-select:none; -webkit-user-select:none}
  body{font-family:"Quattrocento Sans",sans-serif; background:var(--bg); color:var(--ink); min-height:100vh; display:flex; flex-direction:column}
  header{padding:16px 28px; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; background:#fff; flex-wrap:wrap; gap:8px}
  .kicker{font-size:12px; letter-spacing:2px; text-transform:uppercase; color:var(--accent); font-weight:700}
  h1{font-size:26px; color:var(--primary); line-height:1.15}
  .hdrbtns{display:flex; gap:10px}
  .hbtn{padding:9px 16px; border-radius:10px; border:2px solid var(--primary); background:#fff; color:var(--primary); font-family:inherit; font-size:14px; font-weight:700; cursor:pointer}
  .hbtn:hover{background:var(--primary-light)}
  main{flex:1; padding:22px 28px; max-width:1240px; margin:0 auto; width:100%}
  .instruction{background:var(--primary-light); border-radius:12px; padding:14px 20px; font-size:16px; line-height:1.45; margin-bottom:16px}
  .chips{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px}
  .chip{padding:8px 14px; border-radius:999px; border:2px solid var(--line); background:#fff; color:var(--muted); font-size:14px; font-weight:700; cursor:default}
  .chip.cur{border-color:var(--accent); color:var(--accent); background:var(--accent-light)}
  .chip.done{border-color:var(--primary); color:var(--primary); background:var(--primary-light); cursor:pointer}
  .layout{display:grid; grid-template-columns:1.35fr 1fr; gap:24px; align-items:start}
  .card{background:#fff; border:1px solid var(--line); border-radius:16px; padding:18px}
  .toolbar{display:flex; gap:10px; margin-bottom:10px}
  .tbtn{padding:9px 14px; border-radius:10px; border:2px solid var(--primary); background:#fff; color:var(--primary); font-family:inherit; font-size:14px; font-weight:700; cursor:pointer}
  .tbtn:hover:not(:disabled){background:var(--primary-light)}
  .tbtn:disabled{opacity:.4; cursor:default}
  svg{display:block; width:100%; height:auto; touch-action:none}
  .pin{cursor:pointer}
  .pin circle:not(.hit){fill:#fff; stroke:var(--primary); stroke-width:3}
  .pin .hit{fill:transparent; stroke:transparent}
  .pin:hover circle:not(.hit){fill:var(--primary-light)}
  .pin.src circle:not(.hit){stroke:var(--accent)}
  .pin.src:hover circle:not(.hit){fill:var(--accent-light)}
  .pin.pend circle:not(.hit){fill:var(--accent); stroke:var(--accent)}
  .wire{stroke:var(--primary); stroke-width:4; fill:none; stroke-linecap:round}
  .wire:hover{stroke:var(--accent); cursor:pointer}
  .wirePrev{stroke:var(--accent); stroke-width:3; fill:none; stroke-dasharray:6 6; pointer-events:none}
  .sw{cursor:pointer; -webkit-tap-highlight-color:transparent}
  .lampOn{fill:var(--accent); filter:drop-shadow(0 0 14px rgba(217,106,8,.75))}
  .lampOff{fill:#fff; stroke:var(--line); stroke-width:3}
  .lampUnk{fill:var(--card); stroke:var(--line); stroke-width:3; stroke-dasharray:5 4}
  .panel h2{font-size:18px; color:var(--primary); margin-bottom:8px}
  .goal{font-size:15px; line-height:1.45; margin-bottom:12px}
  .goal b{color:var(--primary)}
  .hint{font-size:14px; line-height:1.45; background:var(--accent-light); border-radius:10px; padding:10px 14px; margin-bottom:12px; display:none; color:var(--ink)}
  .hint.show{display:block}
  .modeRow{display:flex; gap:8px; margin-bottom:10px}
  .mbtn{flex:1; font-family:inherit; font-size:12.5px; font-weight:700; padding:6px 8px; border-radius:9px; border:2px solid var(--line); background:#fff; color:var(--muted); cursor:pointer}
  .mbtn.sel{border-color:var(--primary); background:var(--primary-light); color:var(--primary)}
  .hintbtn{font-size:13px; font-weight:700; color:var(--accent); background:none; border:none; cursor:pointer; font-family:inherit; padding:0; margin-bottom:12px; text-decoration:underline}
  table{width:100%; border-collapse:collapse; margin-bottom:14px}
  th,td{padding:7px 6px; text-align:center; font-size:15px}
  th{background:var(--primary-light); color:var(--primary); font-weight:700}
  td{border-bottom:1px solid var(--line)}
  td.s{font-weight:700; font-size:17px}
  td.ok{color:var(--primary)}
  td.ko{color:var(--accent)}
  #msg{border-radius:12px; padding:12px 16px; font-size:15px; line-height:1.4; margin-bottom:14px; display:none}
  #msg.info{background:var(--accent-light); color:var(--accent); font-weight:700; display:block}
  #msg.win{background:var(--primary-light); color:var(--primary); font-weight:700; display:block}
  .actions{display:flex; gap:10px}
  .abtn{flex:1; padding:12px; border-radius:10px; border:none; background:var(--primary); color:#fff; font-family:inherit; font-size:15px; font-weight:700; cursor:pointer}
  .abtn:hover{filter:brightness(1.1)}
  .abtn.ghost{background:#fff; color:var(--primary); border:2px solid var(--primary)}
  footer{padding:14px; text-align:center; color:var(--muted); font-size:13px; border-top:1px solid var(--line); background:#fff}
  @media (max-width:900px){
    header{padding:12px 16px}
    h1{font-size:21px}
    main{padding:14px 16px}
    .layout{grid-template-columns:1fr; gap:16px}
    .card{padding:14px}
  }
  /* telephone : suggerer le mode paysage */
  #rotateHint{display:none; text-align:center; font-size:12.5px; font-weight:700; color:var(--accent);
    background:var(--accent-light); border-radius:8px; padding:5px 10px; margin-bottom:8px}
  @media (max-width:900px) and (orientation:portrait){
    #rotateHint{display:block}
    .card:first-child{position:sticky; top:0; z-index:5}
  }
  @media (max-width:900px) and (orientation:landscape){
    header{padding:6px 16px}
    .kicker{font-size:11px}
    h1{font-size:17px}
    main{padding:8px 14px}
    .instruction{font-size:13px; padding:8px 14px}
    .layout{grid-template-columns:1.4fr 1fr; gap:12px}
    .card{padding:10px}
    .panel h2{font-size:15px}
    .goal{font-size:13px}
    table{font-size:13px}
  }
  #fireworks{position:fixed; inset:0; pointer-events:none; z-index:50; display:none}

footer a{color:var(--muted);text-decoration:none}
footer a:hover{color:var(--primary);text-decoration:underline}
</style>
</head>

          <g class="off">

<footer><a href="index.html" id="fjBack"></a> · <a href="https://www.fredericjaccard.com">Frédéric Jaccard</a></footer>
<script>
const $ = id => document.getElementById(id);

const I18N = {
  fr:{back:"← Toutes les applications",
    title:"Constructeur NON-ET",
    instruction:"Tout l'ordinateur peut être construit avec une seule porte : le NON-ET (NAND). Pour chaque défi, les portes sont déjà placées — reliez les broches : cliquez sur une broche de sortie (orange), puis sur une broche d'entrée (vert) ; cliquez sur un fil pour le supprimer — puis vérifiez votre circuit. Relevez les 4 défis !",
    goalB:" (entrées A et B)",
    goalA:" (entrée A seule)",
    gateLbl:"NON-ET",
    rotateHint:"🔄 Tournez votre téléphone en paysage : le circuit sera plus grand",
    modeAuto:"Table automatique",
    modeManual:"Avec les interrupteurs",
    testAll:"Testez d\u2019abord toutes les combinaisons avec les interrupteurs A et B avant de vérifier.",
    testAllA:"Testez d\u2019abord les deux positions de l\u2019interrupteur A avant de vérifier.",
    panelTitle:"Défi en cours",
    clear:"Tout effacer",
    check:"Vérifier le circuit",
    next:"Défi suivant →",
    hintLbl:"Voir un indice",
    challenges:[
      {name:"1 · NON", goal:"Fabriquez une porte <b>NON</b> : la sortie S doit être l'inverse de A. Une seule porte suffit.", hint:"Reliez A aux DEUX entrées de la même porte NON-ET."},
      {name:"2 · ET", goal:"Fabriquez une porte <b>ET</b> : S = 1 seulement si A et B valent 1. Il faut 2 portes NON-ET.", hint:"Un NON-ET fait déjà presque le travail… il manque juste une inversion. Réutilisez votre montage NON du défi 1 !"},
      {name:"3 · OU", goal:"Fabriquez une porte <b>OU</b> : S = 1 si A ou B (ou les deux) valent 1. Il faut 3 portes NON-ET.", hint:"Inversez A, inversez B (deux montages NON), puis combinez les résultats dans un troisième NON-ET."},
      {name:"4 · OU exclusif", goal:"Fabriquez un <b>OU exclusif</b> : S = 1 si exactement une entrée vaut 1. Le grand classique : 4 portes NON-ET !", hint:"Porte 1 : NON-ET de A et B. Porte 2 : NON-ET de A et du résultat 1. Porte 3 : NON-ET de B et du résultat 1. Porte 4 : NON-ET des résultats 2 et 3."}
    ],
    out:"S",
    youCol:"Votre circuit",
    targetCol:"Objectif",
    incomplete:"Le circuit n'est pas complet : une broche n'est pas reliée, ou il y a une boucle.",
    wrong:"Pas encore : comparez votre colonne avec l'objectif.",
    win:"Bravo ! Le défi est réussi.",
    winAll:"Bravo ! Vous avez tout construit à partir de NON-ET — comme un vrai processeur !",
    fs:"Plein écran", fsExit:"Quitter"
  },
  en:{back:"← All applications",
    title:"NAND-only builder",
    instruction:"The whole computer can be built from a single gate: the NAND. For each challenge the gates are already placed — connect the pins: click an output pin (orange), then an input pin (green); click a wire to remove it — then check your circuit. Complete all 4 challenges!",
    goalB:" (inputs A and B)",
    goalA:" (input A only)",
    gateLbl:"NAND",
    rotateHint:"🔄 Rotate your phone to landscape: the circuit will be larger",
    modeAuto:"Automatic table",
    modeManual:"Using the switches",
    testAll:"First test every combination with switches A and B before checking.",
    testAllA:"First test both positions of switch A before checking.",
    panelTitle:"Current challenge",
    clear:"Clear all",
    check:"Check the circuit",
    next:"Next challenge →",
    hintLbl:"Show a hint",
    challenges:[
      {name:"1 · NOT", goal:"Build a <b>NOT</b> gate: output Q must be the inverse of A. A single gate is enough.", hint:"Connect A to BOTH inputs of the same NAND gate."},
      {name:"2 · AND", goal:"Build an <b>AND</b> gate: Q = 1 only if A and B are both 1. You need 2 NAND gates.", hint:"A NAND already does almost the job… only one inversion is missing. Reuse your NOT circuit from challenge 1!"},
      {name:"3 · OR", goal:"Build an <b>OR</b> gate: Q = 1 if A or B (or both) are 1. You need 3 NAND gates.", hint:"Invert A, invert B (two NOT circuits), then combine the results in a third NAND."},
      {name:"4 · XOR", goal:"Build a <b>XOR</b> gate: Q = 1 if exactly one input is 1. The classic: 4 NAND gates!", hint:"Gate 1: NAND of A and B. Gate 2: NAND of A and result 1. Gate 3: NAND of B and result 1. Gate 4: NAND of results 2 and 3."}
    ],
    out:"Q",
    youCol:"Your circuit",
    targetCol:"Target",
    incomplete:"The circuit is not complete: a pin is unconnected, or there is a loop.",
    wrong:"Not yet: compare your column with the target.",
    win:"Well done! Challenge completed.",
    winAll:"Well done! You built everything from NAND gates — just like a real processor!",
    fs:"Fullscreen", fsExit:"Exit"
  }
};

// positions des portes par defi (centre du symbole) :
// NON : une porte au milieu entre A/B et S
// ET  : une a gauche, une a droite, alignees sur l'axe
// OU  : une en haut, une en bas, une a droite
// XOR : une a gauche, deux en colonne au centre, une a droite
const LAYOUTS = [
  [[480,210]],
  [[330,210],[600,210]],
  [[330,115],[330,305],[600,210]],
  [[300,210],[490,100],[490,320],[680,210]]
];
let SLOTS = LAYOUTS[0];
const SRC_PINS = {A:[160,175], B:[160,245]};
const SWA_POS = () => (level === 0 ? [30,186] : [30,151]);
const LAMP_PIN = [786,210];

const FN_NAND = (x,y) => 1-(x&&y);

let lang = (function(){try{var s=localStorage.getItem("fj-lang");return (s==="fr"||s==="en")?s:"fr";}catch(e){return "fr";}})();
let level = 0;              // défi en cours 0..3
let unlocked = 0;           // nb de défis réussis
let manual = false;         // mode table : auto ou par interrupteurs
let tested = new Set();     // combinaisons visitees en mode manuel
let gates = [];             // indices de slots utilisés
let wires = {};             // "g2.in0" -> "A" | "g1" ...
let lampWire = null;        // source reliée à la lampe
let a = 0, b = 0;
let pending = null;         // broche source en attente

const T = () => I18N[lang];
const OUT = () => T().out;

// ---------- géométrie ----------
function pinPos(id){
  if(id === "A") return level === 0 ? [160,210] : SRC_PINS.A;
  if(id === "B") return SRC_PINS.B;
  if(id === "S") return LAMP_PIN;
  const m = id.match(/^g(\d)(?:\.(in[01]))?$/);
  const [x,y] = SLOTS[+m[1]];
  if(!m[2]) return [x+72, y];                     // sortie
  return [x-24, y + (m[2] === "in0" ? -13 : 13)]; // entrées
}
function wirePath(p1, p2, srcId, dstId){
  // courbes en S : on essaie plusieurs positions du point de controle et on
  // garde la premiere dont la courbe ne traverse aucune porte placee.
  const dx = p2[0] - p1[0];
  const cands = [
    dx > 30 ? p1[0] + Math.max(70, dx * 0.6) : p1[0] + 70,
    p1[0] + 55, p2[0] - 70, (p1[0] + p2[0]) / 2, p1[0] + 150, p2[0] - 150,
    p2[0] - 110, p2[0] - 40, p1[0] + 200
  ];
  // les bords de la courbe (pres des broches) ne comptent pas comme collision :
  // le fil doit bien toucher la broche de depart et d'arrivee.
  const ends = (x, y) => {
    const d1 = Math.hypot(x - p1[0], y - p1[1]), d2 = Math.hypot(x - p2[0], y - p2[1]);
    return Math.min(d1, d2) < 26;
  };
  const blocked = mx => {
    for(const i of gates){
      const [gx, gy] = SLOTS[i];
      for(let t = 0; t <= 1; t += 0.02){
        const mt = 1 - t;
        const x = mt*mt*mt*p1[0] + 3*mt*mt*t*mx + 3*mt*t*t*mx + t*t*t*p2[0];
        const y = mt*mt*mt*p1[1] + 3*mt*mt*t*p1[1] + 3*mt*t*t*p2[1] + t*t*t*p2[1];
        if(ends(x, y)) continue;
        if(x > gx - 28 && x < gx + 92 && y > gy - 28 && y < gy + 28) return true;
      }
    }
    return false;
  };
  const mx = cands.find(mx => !blocked(mx)) ?? cands[0];
  return `M ${p1[0]} ${p1[1]} C ${mx} ${p1[1]}, ${mx} ${p2[1]}, ${p2[0]} ${p2[1]}`;
}

// broche cliquable : rond visible + halo transparent pour le tactile
function pinG(id, cx, cy, cls){
  return `<g class="pin ${cls}" data-pin="${id}"><circle class="hit" cx="${cx}" cy="${cy}" r="18"/><circle cx="${cx}" cy="${cy}" r="8"/></g>`;
}

// ---------- symbole NAND ----------
function nandShape(x, y){
  return `
    <path d="M ${x} ${y-22} L ${x+34} ${y-22} A 22 22 0 0 1 ${x+34} ${y+22} L ${x} ${y+22} Z" fill="#E3F0EA" stroke="#155E4C" stroke-width="3"/>
    <circle cx="${x+63}" cy="${y}" r="7" fill="#fff" stroke="#155E4C" stroke-width="3"/>
    <line x1="${x+69}" y1="${y}" x2="${x+96}" y2="${y}" stroke="#155E4C" stroke-width="4"/>`;
}

// ---------- simulation ----------
function simulate(av, bv){
  const known = {A:av, B:bv};
  let progress = true, guard = 0;
  while(progress && guard++ < 20){
    progress = false;
    gates.forEach(i => {
      const id = `g${i}`;
      if(known[id] !== undefined) return;
      const s0 = wires[`${id}.in0`], s1 = wires[`${id}.in1`];
      if(s0 && s1 && known[s0] !== undefined && known[s1] !== undefined){
        known[id] = FN_NAND(known[s0], known[s1]);
        progress = true;
      }
    });
  }
  if(lampWire && known[lampWire] !== undefined) return known[lampWire];
  return null;
}

const TARGETS = [
  (a,b)=>1-a, (a,b)=>a&&b, (a,b)=>(a||b)?1:0, (a,b)=>a^b
];
const ROWS2 = [[0,0],[0,1],[1,0],[1,1]];
const ROWS1 = [[0],[1]];
const usesB = () => level !== 0;

// ---------- rendu ----------
function render(){
  // fils
  let w = "";
  Object.entries(wires).forEach(([dst, src]) => {
    w += `<path class="wire" data-dst="${dst}" d="${wirePath(pinPos(src), pinPos(dst), src, dst)}"/>`;
  });
  if(lampWire) w += `<path class="wire" data-dst="S" d="${wirePath(pinPos(lampWire), pinPos("S"), lampWire, "S")}"/>`;
  $("wires").innerHTML = w;
  $("wires").querySelectorAll(".wire").forEach(el => {
    el.onclick = () => {
      const d = el.dataset.dst;
      if(d === "S") lampWire = null; else delete wires[d];
      pending = null; render();
    };
  });

  // portes
  let g = "";
  gates.forEach(i => {
    const [x,y] = SLOTS[i];
    g += `<g>
      ${nandShape(x-24, y)}
      <text x="${x+18}" y="${y+42}" text-anchor="middle" font-size="13" font-weight="700" fill="#6E726B">${T().gateLbl}</text>
      ${pinG(`g${i}.in0`, x-24, y-13, "")}
      ${pinG(`g${i}.in1`, x-24, y+13, "")}
      ${pinG(`g${i}`, x+72, y, "src")}
    </g>`;
  });
  $("gates").innerHTML = g;

  // broches sources + lampe
  let p = "";
  p += pinG("A", pinPos("A")[0], pinPos("A")[1], "src");
  if(usesB()) p += pinG("B", SRC_PINS.B[0], SRC_PINS.B[1], "src");
  p += pinG("S", LAMP_PIN[0], LAMP_PIN[1], "");
  $("pins").innerHTML = p;
  $("swB").style.display = usesB() ? "" : "none";
  $("swA").setAttribute("transform", `translate(${SWA_POS()[0]},${SWA_POS()[1]})`);

  document.querySelectorAll(".pin").forEach(el => {
    el.onclick = e => { e.stopPropagation(); onPin(el.dataset.pin, el); };
  });
  if(pending){
    const el = document.querySelector(`.pin[data-pin="${pending}"]`);
    if(el) el.classList.add("pend");
  }

  // lampe
  const s = simulate(a,b);
  $("lamp").innerHTML = `
    <circle cx="${LAMP_PIN[0]+42}" cy="${LAMP_PIN[1]}" r="30" class="${s===1 ? "lampOn" : s===0 ? "lampOff" : "lampUnk"}"/>
    <text x="${LAMP_PIN[0]+42}" y="${LAMP_PIN[1]+9}" text-anchor="middle" font-size="24" font-weight="700" fill="${s===1 ? "#fff" : "#6E726B"}">${s===null ? "?" : s}</text>
    <text x="${LAMP_PIN[0]+42}" y="${LAMP_PIN[1]+54}" text-anchor="middle" font-size="16" font-weight="700" fill="#20241F">${OUT()}</text>`;

  renderSwitches(); renderTable(); renderChips();
  $("modeAuto").classList.toggle("sel", !manual);
  $("modeManual").classList.toggle("sel", manual);
}

function renderSwitches(){
  [["swA",a],["swB",b]].forEach(([id,v]) => {
    const el = $(id);
    el.querySelector(".on").style.display = v ? "" : "none";
    el.querySelector(".off").style.display = v ? "none" : "";
  });
}

function renderChips(){
  $("chips").innerHTML = T().challenges.map((c,i) => {
    const cls = i === level ? "cur" : i < unlocked ? "done" : "";
    return `<span class="chip ${cls}" data-lv="${i}">${c.name}${i < unlocked ? " ✓" : ""}</span>`;
  }).join("");
  $("chips").querySelectorAll(".chip.done").forEach(el => {
    el.onclick = () => { level = +el.dataset.lv; resetCircuit(); render(); updatePanel(); };
  });
}

function renderTable(){
  const one = !usesB();
  const rows = one ? ROWS1 : ROWS2;
  // en mode manuel, on enregistre la combinaison actuelle seulement si le
  // circuit y repond vraiment (sinon on aurait une ligne "?" memorisee qui se
  // revelerait plus tard sans etre re-testee)
  if(manual){
    const keyCur = one ? `${a}` : `${a}${b}`;
    if(simulate(a, b) !== null) tested.add(keyCur);
    else tested.delete(keyCur);
  }
  $("tblHead").innerHTML = one
    ? `<th>A</th><th>${T().youCol}</th><th>${T().targetCol}</th>`
    : `<th>A</th><th>B</th><th>${T().youCol}</th><th>${T().targetCol}</th>`;
  $("tblBody").innerHTML = rows.map(r => {
    const ra = r[0], rb = one ? 0 : r[1];
    const key = one ? `${ra}` : `${ra}${rb}`;
    const seen = !manual || tested.has(key);
    const got = seen ? simulate(ra,rb) : null;
    const want = TARGETS[level](ra,rb);
    const cls = !seen ? "" : got === null ? "" : got === want ? "ok" : "ko";
    const txt = !seen ? "·" : got === null ? "?" : got;
    const v = `<td class="s ${cls}">${txt}</td><td class="s ok">${want}</td>`;
    return one ? `<tr><td>${ra}</td>${v}</tr>` : `<tr><td>${ra}</td><td>${rb}</td>${v}</tr>`;
  }).join("");
}

function updatePanel(){
  const c = T().challenges[level];
  $("goal").innerHTML = `<b>${c.name}</b> — ${c.goal}${usesB() ? T().goalB : T().goalA}`;
  $("hint").innerHTML = c.hint;
  $("hint").classList.remove("show");
  $("msg").className = ""; $("msg").style.display = "none";
  $("nextBtn").style.display = "none";
  $("checkBtn").style.display = "";
}


// ---------- feu d'artifice (fin du dernier defi) ----------
let fwRunning = false;
function fireworks(){
  const cv = $("fireworks"), ctx = cv.getContext("2d");
  cv.width = innerWidth; cv.height = innerHeight;
  cv.style.display = "block";
  fwRunning = true;
  const COLORS = ["#155E4C","#D96A08","#3E8E7E","#F0A04B","#7FB69E","#C84B31"];
  const rockets = [], sparks = [];
  const launch = () => {
    rockets.push({
      x: cv.width * (0.15 + Math.random() * 0.7), y: cv.height,
      vx: (Math.random() - 0.5) * 2, vy: -(10 + Math.random() * 4),
      color: COLORS[Math.floor(Math.random() * COLORS.length)]
    });
  };
  const explode = r => {
    for(let i = 0; i < 90; i++){
      const ang = Math.random() * Math.PI * 2, sp = 2 + Math.random() * 5;
      sparks.push({ x: r.x, y: r.y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp,
                    life: 60 + Math.random() * 40, color: r.color });
    }
  };
  let frame = 0;
  const tick = () => {
    ctx.clearRect(0, 0, cv.width, cv.height);
    frame++;
    if(frame < 260 && frame % 16 === 0) launch();
    for(let i = rockets.length - 1; i >= 0; i--){
      const r = rockets[i];
      r.x += r.vx; r.y += r.vy; r.vy += 0.18;
      ctx.beginPath(); ctx.arc(r.x, r.y, 3, 0, Math.PI * 2);
      ctx.fillStyle = r.color; ctx.fill();
      if(r.vy >= -1.5){ explode(r); rockets.splice(i, 1); }
    }
    for(let i = sparks.length - 1; i >= 0; i--){
      const s = sparks[i];
      s.x += s.vx; s.y += s.vy; s.vy += 0.05; s.vx *= 0.985; s.life--;
      ctx.globalAlpha = Math.max(0, s.life / 80);
      ctx.beginPath(); ctx.arc(s.x, s.y, 2.4, 0, Math.PI * 2);
      ctx.fillStyle = s.color; ctx.fill();
      if(s.life <= 0) sparks.splice(i, 1);
    }
    ctx.globalAlpha = 1;
    if(frame < 600 || rockets.length || sparks.length) requestAnimationFrame(tick);
    else { cv.style.display = "none"; fwRunning = false; }
  };
  tick();
}

// ---------- interactions ----------
function onPin(id, el){
  const isSrc = (id === "A" || id === "B" || /^g\d$/.test(id));
  if(!pending){
    if(isSrc) pending = id;
    else if(wires[id]){ delete wires[id]; }
    else if(id === "S" && lampWire){ lampWire = null; }
    render(); return;
  }
  // un fil est en attente : on vise une entrée
  if(isSrc){ pending = id; render(); return; }   // change de source
  if(id === pending) { pending = null; render(); return; }
  if(id === "S"){
    lampWire = pending;
  } else {
    const gid = id.split(".")[0];
    if(gid === pending){ flash(T().incomplete); pending = null; render(); return; } // pas de boucle directe
    wires[id] = pending;
  }
  pending = null; $("preview").style.display = "none";
  render();
}

function flash(txt){
  $("msg").className = ""; $("msg").classList.add("info");
  $("msg").style.display = "block";
  $("msg").textContent = txt;
}

$("scene").addEventListener("mousemove", e => {
  if(!pending) return;
  const svg = $("scene");
  const pt = svg.createSVGPoint();
  pt.x = e.clientX; pt.y = e.clientY;
  const m = svg.getScreenCTM().inverse();
  const loc = pt.matrixTransform(m);
  const pv = $("preview");
  pv.setAttribute("d", wirePath(pinPos(pending), [loc.x, loc.y]));
  pv.style.display = "";
});
$("scene").addEventListener("click", () => {
  if(pending){ pending = null; $("preview").style.display = "none"; render(); }
});

$("swA").onclick = e => { e.stopPropagation(); a = 1-a; render(); };
$("swB").onclick = e => { e.stopPropagation(); b = 1-b; render(); };

$("clearBtn").onclick = () => { resetCircuit(); render(); };

function resetCircuit(){
  SLOTS = LAYOUTS[level];
  gates = SLOTS.map((_, i) => i);
  wires = {};
  lampWire = `g${gates.length - 1}`;   // la porte la plus a droite alimente deja l'ampoule
  tested = new Set();
  a = 0; b = 0;
  pending = null;
  $("preview").style.display = "none";
}

$("hintBtn").onclick = () => $("hint").classList.toggle("show");
$("modeAuto").onclick = () => { manual = false; render(); };
$("modeManual").onclick = () => { manual = true; render(); };

$("checkBtn").onclick = () => {
  const rows = usesB() ? ROWS2 : ROWS1.map(r => [r[0], 0]);
  if(manual){
    const one = !usesB();
    const allTested = rows.every(([ra,rb]) => tested.has(one ? `${ra}` : `${ra}${rb}`));
    if(!allTested){ flash(one ? T().testAllA : T().testAll); return; }
  }
  const bad = rows.some(([ra,rb]) => simulate(ra,rb) !== TARGETS[level](ra,rb));
  if(bad){
    const anyNull = rows.some(([ra,rb]) => simulate(ra,rb) === null);
    flash(anyNull ? T().incomplete : T().wrong);
    return;
  }
  if(level === unlocked) unlocked = Math.min(unlocked+1, 4);
  if(unlocked >= 4 && !fwRunning) fireworks();
  $("msg").className = ""; $("msg").classList.add("win");
  $("msg").style.display = "block";
  $("msg").textContent = unlocked >= 4 ? T().winAll : T().win;
  $("checkBtn").style.display = "none";
  if(level < 3) $("nextBtn").style.display = "";
  renderChips();
};

$("nextBtn").onclick = () => {
  level++;
  resetCircuit(); render(); updatePanel();
};

function applyLang(){
  document.documentElement.lang = lang;
  $("kicker").textContent = lang === "fr" ? "Architecture des ordinateurs" : "Computer architecture";
  $("title").textContent = T().title;
  $("langBtn").textContent = lang === "fr" ? "English" : "Français";
  $("fsLabel").textContent = document.fullscreenElement ? T().fsExit : T().fs;
  $("instruction").textContent = T().instruction;
  $("panelTitle").textContent = T().panelTitle;
  $("clearBtn").textContent = T().clear;
  $("checkBtn").textContent = T().check;
  $("nextBtn").textContent = T().next;
  $("hintBtn").textContent = T().hintLbl;
  $("rotateHint").textContent = T().rotateHint;
  $("modeAuto").textContent = T().modeAuto;
  $("modeManual").textContent = T().modeManual;
  updatePanel(); render();
}

$("langBtn").onclick = () => { lang = lang==="fr" ? "en" : "fr"; try{localStorage.setItem("fj-lang",lang);}catch(e){}; applyLang(); };
$("fsBtn").onclick = () => {
  if(document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen().catch(()=>{});
};
document.addEventListener("fullscreenchange", () => {
  $("fsLabel").textContent = document.fullscreenElement ? T().fsExit : T().fs;
});

resetCircuit();
applyLang();
</script>

<script>
(function(){
  var el=document.getElementById("fjBack");
  if(!el||typeof I18N==="undefined"||typeof lang==="undefined")return;
  function upd(){try{el.textContent=I18N[lang].back;}catch(e){}}
  var btn=document.getElementById("langBtn");
  if(btn){var old=btn.onclick;btn.onclick=function(){if(old)old.apply(this,arguments);upd();};}
  upd();
})();
</script>

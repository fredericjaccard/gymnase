<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23155E4C'/%3E%3Ctext x='32' y='43' font-family='Arial,sans-serif' font-size='28' font-weight='bold' fill='%23FBFAF6' text-anchor='middle'%3EFJ%3C/text%3E%3C/svg%3E">
<meta name="description" content="Application interactive pour le cours d'informatique.">
<title>Du transistor à la porte — Architecture des ordinateurs · Gymnase — Frédéric Jaccard</title>
<style>
  :root{
    --bg:#FBFAF6; --ink:#20241F; --muted:#6E726B;
    --primary:#155E4C; --primary-light:#E3F0EA;
    --accent:#D96A08; --accent-light:#FDEBD8;
    --line:#D8D5CB; --card:#F7F6F2;
  }
  *{margin:0;padding:0;box-sizing:border-box; user-select:none; -webkit-user-select:none}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"Quattrocento Sans","Segoe UI",system-ui,sans-serif;
    display:flex; flex-direction:column; min-height:100vh;
  }
  header{
    display:flex; align-items:center; gap:16px; flex-wrap:wrap;
    padding:14px 24px; border-bottom:1px solid var(--line);
  }
  header .titles{flex:1; min-width:220px}
  .kicker{color:var(--accent); font-weight:700; font-size:13px; letter-spacing:.08em; text-transform:uppercase}
  h1{font-size:26px; color:var(--primary); line-height:1.15}
  .controls{display:flex; gap:10px}
  button.ctl{
    font:inherit; font-weight:700; font-size:14px; cursor:pointer;
    padding:9px 16px; border-radius:8px;
    border:2px solid var(--primary); background:#fff; color:var(--primary);
    transition:background .15s,color .15s;
  }
  button.ctl:hover:not(:disabled){background:var(--primary); color:#fff}
  main{flex:1; display:flex; flex-direction:column; gap:16px; padding:22px 24px; max-width:1100px; width:100%; margin:0 auto}
  .instruction{
    width:100%; font-size:15px; line-height:1.5; background:var(--primary-light);
    border-radius:10px; padding:12px 16px;
  }
  .gatebar{display:flex; gap:10px; flex-wrap:wrap}
  button.gate{
    font:inherit; font-weight:700; font-size:17px; cursor:pointer;
    padding:10px 26px; border-radius:10px; letter-spacing:.04em;
    border:2px solid var(--line); background:#fff; color:var(--muted);
    transition:all .15s;
  }
  button.gate:hover{border-color:var(--primary); color:var(--primary)}
  button.gate.sel{border-color:var(--primary); background:var(--primary-light); color:var(--primary)}
  .playrow{display:grid; grid-template-columns:minmax(0,1.35fr) minmax(280px,1fr); gap:20px; width:100%; align-items:start}
  @media (max-width:900px){ .playrow{grid-template-columns:1fr} }
  .stage{
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:10px; display:flex; align-items:center; justify-content:center;
  }
  svg{width:100%; height:auto; max-height:55vh; display:block}
  .wireBase{stroke:var(--line); stroke-width:5; fill:none; stroke-linecap:round}
  .wireHot{stroke:var(--accent); stroke-width:5; fill:none; stroke-linecap:round; stroke-dasharray:10 8; animation:flow .8s linear infinite}
  .cmdBase{stroke:var(--line); stroke-width:3.5; fill:none; stroke-linecap:round}
  .cmdOn{stroke:var(--primary); stroke-width:3.5; fill:none; stroke-linecap:round; stroke-dasharray:2 7; animation:flow .8s linear infinite}
  @keyframes flow{to{stroke-dashoffset:-18}}
  .tr{cursor:pointer; -webkit-tap-highlight-color:transparent}
  .lampOff{fill:#fff; stroke:var(--line); stroke-width:3}
  .lampOn{fill:var(--accent); stroke:var(--accent); stroke-width:3; filter:drop-shadow(0 0 12px rgba(217,106,8,.65))}
  .panel{
    background:#fff; border:2px solid var(--line); border-radius:10px;
    padding:16px 18px; display:flex; flex-direction:column; gap:12px;
  }
  .panel h2{color:var(--primary); font-size:19px}
  .panel .sub{color:var(--muted); font-size:14px; font-style:italic}
  .status{
    font-size:16px; font-weight:700; border-radius:10px; padding:12px 16px; line-height:1.45;
  }
  .status.on{background:var(--primary-light); color:var(--primary)}
  .status.off{background:var(--accent-light); color:var(--accent)}
  table.truth{
    border-collapse:collapse; width:100%; background:#fff;
    border:2px solid var(--line); border-radius:10px; overflow:hidden;
  }
  table.truth th{
    background:var(--primary-light); color:var(--primary); font-size:15px;
    padding:9px 6px; border-bottom:2px solid var(--line);
  }
  table.truth td{padding:7px 6px; border-bottom:1px solid var(--line); text-align:center; font-weight:700}
  table.truth tr:last-child td{border-bottom:none}
  table.truth tr.now td{background:var(--accent-light)}
  .tried{display:inline-block; width:20px; text-align:center; font-weight:700; color:var(--primary)}
  footer{padding:12px 24px; border-top:1px solid var(--line); color:var(--muted); font-size:13px; text-align:center}

footer a{color:var(--muted);text-decoration:none}
footer a:hover{color:var(--primary);text-decoration:underline}
</style>
</head>
<body>
<header>
  <div class="titles">
    <div class="kicker" id="kicker">Architecture des ordinateurs</div>
    <h1 id="title">Du transistor à la porte</h1>
  </div>
  <div class="controls">
    <button class="ctl" id="langBtn">English</button>
    <button class="ctl" id="fsBtn">⛶ <span id="fsLabel">Plein écran</span></button>
  </div>
</header>

<main>
  <p class="instruction" id="instruction"></p>
  <div class="gatebar" id="gatebar"></div>

  <div class="playrow">
    <div class="stage">
      <svg viewBox="0 0 720 420" id="scene">
        <g id="sceneContent"></g>
        <!-- interrupteurs de commande -->
        <g class="tr" id="swA" transform="translate(185,246)">
          <rect x="0" y="0" width="150" height="52" rx="10" fill="#fff" stroke="#155E4C" stroke-width="2.5"/>
          <g class="off">
            <rect x="12" y="14" width="56" height="24" rx="6" fill="#D8D5CB"/>
            <text x="100" y="34" font-size="20" font-weight="700" fill="#6E726B">0</text>
          </g>
          <g class="on" style="display:none">
            <rect x="82" y="14" width="56" height="24" rx="6" fill="#E3F0EA"/>
            <text x="100" y="34" font-size="20" font-weight="700" fill="#155E4C">1</text>
          </g>
          <text x="0" y="-12" font-size="16" font-weight="700" fill="#20241F">A</text>
        </g>
        <g class="tr" id="swB" transform="translate(375,246)">
          <rect x="0" y="0" width="150" height="52" rx="10" fill="#fff" stroke="#155E4C" stroke-width="2.5"/>
          <g class="off">
            <rect x="12" y="14" width="56" height="24" rx="6" fill="#D8D5CB"/>
            <text x="100" y="34" font-size="20" font-weight="700" fill="#6E726B">0</text>
          </g>
          <g class="on" style="display:none">
            <rect x="82" y="14" width="56" height="24" rx="6" fill="#E3F0EA"/>
            <text x="100" y="34" font-size="20" font-weight="700" fill="#155E4C">1</text>
          </g>
          <text x="0" y="-12" font-size="16" font-weight="700" fill="#20241F">B</text>
        </g>
      </svg>
    </div>

    <div class="panel" id="panel">
      <h2 id="panelTitle"></h2>
      <div class="status off" id="status"></div>
      <table class="truth" id="truth"></table>
      <ul id="points" style="display:none; padding-left:20px; font-size:15px"></ul>
      <p class="sub" id="panelSub"></p>
    </div>
  </div>
</main>

<footer><a href="index.html" id="fjBack"></a> · <a href="https://www.fredericjaccard.com">Frédéric Jaccard</a></footer>

<script>
const GATES = ["TRANS","NON","ET","OU"];
const FN = {
  TRANS: a => a,
  NON: a => a ? 0 : 1,
  ET:  (a,b) => a && b ? 1 : 0,
  OU:  (a,b) => a || b ? 1 : 0,
};
const ROWS = gate => (gate === "NON" || gate === "TRANS") ? [[0],[1]] : [[0,0],[0,1],[1,0],[1,1]];

const I18N = {
  fr:{back:"← Toutes les applications",
    title:"Du transistor à la porte",
    instruction:"Commence par « Le transistor » pour comprendre comment il fonctionne, puis choisis une porte : le circuit la réalise avec des transistors — en série pour ET, en parallèle pour OU, et en inverseur pour NON. Clique sur les interrupteurs : un transistor qui reçoit une tension devient conducteur et laisse passer le courant. Observe l'ampoule et teste toutes les combinaisons !",
    fs:"Plein écran", fsExit:"Quitter",
    panelTitle:"Ce qui se passe",
    panelSub:"Essaie toutes les combinaisons : la ligne en cours est surlignée dans la table.",
    transSub:"Clique sur l'interrupteur A pour ouvrir et fermer le transistor.",
    transPoints:[
      "<b>Trois connexions.</b> Deux pour le courant principal (entrée et sortie), une pour la commande — la <b>grille</b>, reliée ici à l'interrupteur A.",
      "<b>Un interrupteur commandé électriquement.</b> Sans tension sur la grille, le transistor est <b>bloqué</b> ; avec une tension, il devient <b>conducteur</b>. Aucune pièce ne bouge mécaniquement : c'est comme un robinet dont la petite poignée (la grille) contrôle un grand débit d'eau (le courant).",
      "<b>Côté matière.</b> Le transistor est fait d'un <b>semi-conducteur</b> (silicium), un matériau qui conduit mal l'électricité au repos. La tension de la grille modifie le silicium : il devient conducteur, le temps que la tension soit présente.",
      "<b>C'est là tout l'ordinateur.</b> Commutable des milliards de fois par seconde et miniaturisé à l'extrême, on en grave des <b>milliards</b> dans un seul CPU. En les combinant, on fabrique les portes logiques — voir les autres onglets !",
    ],
    gates:{TRANS:"Le transistor", NON:"NON", ET:"ET", OU:"OU"},
    out:"S",
    closed:"conducteur", open:"bloqué",
    msg:{
      TRANS:{
        "0":"A = 0 : aucune tension sur la grille. Le canal du transistor est fermé — le courant ne peut pas passer, l'ampoule reste éteinte.",
        "1":"A = 1 : une tension arrive sur la grille. Le canal devient conducteur — le courant traverse le transistor et l'ampoule s'allume !",
      },
      NON:{
        "0":"Le transistor est bloqué (A = 0) : le courant passe par l'ampoule, elle s'allume. S = 1",
        "1":"Le transistor conduit (A = 1) : le courant est détourné directement vers la masse, l'ampoule s'éteint. S = 0",
      },
      ET:{
        "00":"Les deux transistors sont bloqués : aucun courant ne peut passer. S = 0",
        "01":"Le transistor A est bloqué : le courant est coupé dès le premier transistor, B conduit mais ne reçoit rien. S = 0",
        "10":"Le transistor A conduit, mais B est bloqué : le courant est coupé avant l'ampoule. S = 0",
        "11":"Le courant passe ! Les deux transistors en série conduisent : l'ampoule s'allume. S = 1",
      },
      OU:{
        "00":"Les deux transistors sont bloqués : aucun chemin possible. S = 0",
        "01":"Le transistor B conduit : le courant passe par la branche du bas. S = 1",
        "10":"Le transistor A conduit : le courant passe par la branche du haut. S = 1",
        "11":"Les deux transistors conduisent : le courant passe par les deux branches. S = 1",
      },
    },
  },
  en:{back:"← All applications",
    title:"From the transistor to the gate",
    instruction:"Start with “The transistor” to understand how it works, then pick a gate: the circuit implements it with transistors — in series for AND, in parallel for OR, and as an inverter for NOT. Click the switches: a transistor that receives a voltage conducts and lets current through. Watch the bulb and try every combination!",
    fs:"Fullscreen", fsExit:"Exit",
    panelTitle:"What's happening",
    panelSub:"Try every combination: the current row is highlighted in the table.",
    transSub:"Click switch A to open and close the transistor.",
    transPoints:[
      "<b>Three connections.</b> Two for the main current (in and out), one for control — the <b>gate</b>, wired here to switch A.",
      "<b>An electrically controlled switch.</b> With no voltage on the gate the transistor is <b>off</b>; with a voltage it becomes <b>conducting</b>. No mechanical part moves: think of a tap whose small handle (the gate) controls a large flow of water (the current).",
      "<b>The material side.</b> The transistor is made of a <b>semiconductor</b> (silicon), a material that barely conducts electricity at rest. The gate voltage changes the silicon: it conducts as long as the voltage is present.",
      "<b>This is the whole computer.</b> Switchable billions of times per second and shrunk to the extreme, <b>billions</b> of them fit in a single CPU. Combining them builds the logic gates — see the other tabs!",
    ],
    gates:{TRANS:"The transistor", NON:"NOT", ET:"AND", OU:"OR"},
    out:"Q",
    closed:"conducting", open:"off",
    msg:{
      TRANS:{
        "0":"A = 0: no voltage on the gate. The transistor's channel is closed — current cannot flow, the bulb stays off.",
        "1":"A = 1: a voltage reaches the gate. The channel becomes conducting — current flows through the transistor and the bulb lights up!",
      },
      NON:{
        "0":"The transistor is off (A = 0): current flows through the bulb, it lights up. Q = 1",
        "1":"The transistor conducts (A = 1): current is diverted straight to ground, the bulb goes off. Q = 0",
      },
      ET:{
        "00":"Both transistors are off: no current can flow. Q = 0",
        "01":"Transistor A is off: current is cut at the very first transistor — B conducts but receives nothing. Q = 0",
        "10":"Transistor A conducts, but B is off: current is cut before the bulb. Q = 0",
        "11":"Current flows! Both series transistors conduct: the bulb lights up. Q = 1",
      },
      OU:{
        "00":"Both transistors are off: no path available. Q = 0",
        "01":"Transistor B conducts: current flows through the lower branch. Q = 1",
        "10":"Transistor A conducts: current flows through the upper branch. Q = 1",
        "11":"Both transistors conduct: current flows through both branches. Q = 1",
      },
    },
  }
};

let lang = (function(){try{var s=localStorage.getItem("fj-lang");return (s==="fr"||s==="en")?s:"fr";}catch(e){return "fr";}})();
let gate = "TRANS";
let a = 0, b = 0;
let tried = {};

const $ = id => document.getElementById(id);
const T = () => I18N[lang];
const gateName = g => T().gates[g];
const OUT = () => T().out;
const W = (d, hot) => `<path class="${hot ? "wireHot" : "wireBase"}" d="${d}"/>`;
const WC = (d, on) => `<path class="${on ? "cmdOn" : "cmdBase"}" d="${d}"/>`;
const TR = (x, y, on, rot) => `
  <g transform="translate(${x},${y})${rot ? ` rotate(${rot})` : ""}">
    <rect x="-8" y="-26" width="96" height="52" rx="10" fill="#fff" stroke="#D8D5CB" stroke-width="2"/>
    <line x1="0" y1="0" x2="80" y2="0" stroke="#D96A08" stroke-width="5" stroke-dasharray="7 7" opacity="${on ? 1 : 0}"/>
    <line x1="40" y1="-20" x2="40" y2="20" stroke="#155E4C" stroke-width="4"/>
    <circle cx="0" cy="0" r="5" fill="#fff" stroke="#155E4C" stroke-width="3"/>
    <circle cx="80" cy="0" r="5" fill="#fff" stroke="#155E4C" stroke-width="3"/>
  </g>`;
const LAB = (x, y, txt, on) =>
  `<text x="${x}" y="${y}" text-anchor="middle" font-size="15" font-weight="700" fill="${on ? "#155E4C" : "#D96A08"}">${txt}</text>`;

const BATTERY = `
  <line x1="60" y1="98" x2="104" y2="98" stroke="#20241F" stroke-width="8"/>
  <line x1="74" y1="112" x2="90" y2="112" stroke="#20241F" stroke-width="3"/>
  <text x="118" y="104" font-size="18" font-weight="700" fill="#20241F">+</text>
  <text x="30" y="120" font-size="13" font-weight="700" fill="#6E726B">5V</text>`;
const RETURN = hot => W("M 620 236 L 620 330 L 60 330 L 60 120", hot);

function scene(){
  const s = FN[gate](a, (gate === "NON" || gate === "TRANS") ? 0 : b);
  const stA = `${a ? T().closed : T().open}`;
  const stB = `${b ? T().closed : T().open}`;
  let c = BATTERY;
  if(gate === "TRANS"){
    c += W("M 104 105 L 260 105", s);
    c += W("M 340 105 L 620 105 L 620 164", s);
    c += RETURN(s);
    c += WC("M 300 246 L 300 133", a);
    c += TR(260, 105, a);
    c += LAB(300, 62, `A = ${a} · ${stA}`, a);
  } else if(gate === "ET"){
    c += W("M 104 105 L 220 105", a);
    c += W("M 300 105 L 410 105", a);
    c += W("M 490 105 L 620 105 L 620 164", s);
    c += RETURN(s);
    c += WC("M 260 246 L 260 133", a);
    c += WC("M 450 246 L 450 133", b);
    c += TR(220, 105, a) + TR(410, 105, b);
    c += LAB(260, 62, `A = ${a} · ${stA}`, a) + LAB(450, 62, `B = ${b} · ${stB}`, b);
  } else if(gate === "OU"){
    c += W("M 104 105 L 120 105", s);
    c += W("M 120 105 L 120 70 L 220 70", a);
    c += W("M 300 70 L 500 70 L 500 105", a);
    c += W("M 120 105 L 120 140 L 410 140", b);
    c += W("M 490 140 L 500 140 L 500 105", b);
    c += W("M 500 105 L 620 105 L 620 164", s);
    c += RETURN(s);
    c += WC("M 260 246 L 260 98", a);
    c += WC("M 450 246 L 450 168", b);
    c += TR(220, 70, a) + TR(410, 140, b);
    c += LAB(260, 28, `A = ${a} · ${stA}`, a) + LAB(450, 198, `B = ${b} · ${stB}`, b);
  } else { // NON : inverseur
    c += W("M 104 105 L 170 105", true);
    c += `<rect x="170" y="92" width="80" height="26" rx="6" fill="#fff" stroke="#155E4C" stroke-width="2.5"/>
          <text x="210" y="111" text-anchor="middle" font-size="15" font-weight="700" fill="#155E4C">R</text>`;
    c += W("M 250 105 L 360 105", true);
    c += W("M 360 105 L 620 105 L 620 164", s);
    c += W("M 360 105 L 360 160", a);
    c += W("M 360 240 L 360 330", a);
    c += W("M 620 236 L 620 330 L 360 330", s);
    c += W("M 360 330 L 60 330 L 60 120", true);
    c += TR(360, 160, a, 90);
    c += WC("M 260 246 L 260 200 L 338 200", a);
    c += LAB(465, 205, `A = ${a} · ${stA}`, a);
  }
  // ampoule
  c += `<circle cx="620" cy="200" r="36" class="${s ? "lampOn" : "lampOff"}"/>
        <text x="620" y="209" text-anchor="middle" font-size="26" font-weight="700" fill="${s ? "#fff" : "#6E726B"}">${s}</text>
        <text x="620" y="264" text-anchor="middle" font-size="16" font-weight="700" fill="#20241F">${OUT()}</text>`;
  return { html: c, s };
}

function render(){
  const { html, s } = scene();
  $("sceneContent").innerHTML = html;
  const isT = gate === "TRANS";
  $("panelSub").textContent = isT ? T().transSub : T().panelSub;
  $("truth").style.display = isT ? "none" : "";
  $("points").style.display = isT ? "" : "none";
  if(isT) $("points").innerHTML = T().transPoints.map(x => `<li style="margin-bottom:10px; line-height:1.45">${x}</li>`).join("");
  [["swA",a],["swB",b]].forEach(([id,v]) => {
    const el = $(id);
    el.querySelector(".off").style.display = v ? "none" : "";
    el.querySelector(".on").style.display  = v ? "" : "none";
  });
  const st = $("status");
  st.className = "status " + (s ? "on" : "off");
  const key = (gate === "NON" || gate === "TRANS") ? `${a}` : `${a}${b}`;
  st.textContent = T().msg[gate][key];
  tried[gate + ":" + key] = true;
  renderTable();
}

function renderTable(){
  const rows = ROWS(gate);
  let html = (gate === "NON" || gate === "TRANS")
    ? `<tr><th>A</th><th>${OUT()}</th><th></th></tr>`
    : `<tr><th>A</th><th>B</th><th>${OUT()}</th><th></th></tr>`;
  rows.forEach(r => {
    const x = r[0], y = r[1] ?? 0;
    const s = FN[gate](x, y);
    const oneIn = (gate === "NON" || gate === "TRANS");
    const now = (x === a && (oneIn || y === b)) ? ' class="now"' : "";
    const key = gate + ":" + (oneIn ? `${x}` : `${x}${y}`);
    const seen = tried[key] ? `<span class="tried">✓</span>` : "";
    const cells = r.map(v => `<td>${v}</td>`).join("");
    html += `<tr${now}>${cells}<td>${s}</td><td>${seen}</td></tr>`;
  });
  $("truth").innerHTML = html;
}

function renderGatebar(){
  const bar = $("gatebar");
  bar.innerHTML = "";
  $("swB").style.display = (gate === "NON" || gate === "TRANS") ? "none" : "";
  GATES.forEach(g => {
    const btn = document.createElement("button");
    btn.className = "gate" + (g === gate ? " sel" : "");
    btn.textContent = gateName(g);
    btn.onclick = () => { gate = g; a = 0; b = 0;
      renderGatebar(); render(); };
    bar.appendChild(btn);
  });
}

$("swA").onclick = () => { a = 1 - a; render(); };
$("swB").onclick = () => { b = 1 - b; render(); };

function applyLang(){
  document.documentElement.lang = lang;
  $("kicker").textContent = lang === "fr" ? "Architecture des ordinateurs" : "Computer architecture";
  $("title").textContent = T().title;
  $("langBtn").textContent = lang === "fr" ? "English" : "Français";
  $("fsLabel").textContent = document.fullscreenElement ? T().fsExit : T().fs;
  $("instruction").textContent = T().instruction;
  $("panelTitle").textContent = T().panelTitle;
  renderGatebar(); render();
}

$("langBtn").onclick = () => { lang = lang==="fr" ? "en" : "fr"; try{localStorage.setItem("fj-lang",lang);}catch(e){}; applyLang(); };
$("fsBtn").onclick = () => {
  if(document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen().catch(()=>{});
};
document.addEventListener("fullscreenchange", () => {
  $("fsLabel").textContent = document.fullscreenElement ? T().fsExit : T().fs;
});

$("swB").style.display = "none";
applyLang();
</script>

<script>
(function(){
  var el=document.getElementById("fjBack");
  if(!el||typeof I18N==="undefined"||typeof lang==="undefined")return;
  function upd(){try{el.textContent=I18N[lang].back;}catch(e){}}
  var btn=document.getElementById("langBtn");
  if(btn){var old=btn.onclick;btn.onclick=function(){if(old)old.apply(this,arguments);upd();};}
  upd();
})();
</script>
</body>
</html>

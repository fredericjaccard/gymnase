body{background:var(--bg);margin:0;padding:32px 16px;min-height:100vh;box-sizing:border-box;

.fb{margin-top:16px;border-radius:10px;padding:14px 16px;font-size:14px;line-height:1.55}

<script>
let lang=(function(){try{var s=localStorage.getItem("fj-lang");return (s==="fr"||s==="en")?s:"fr";}catch(e){return "fr";}})();
const I18N={
 fr:{
  kicker:"RÉVISION",
  title:"Algorithmique II — Révision",
  sub:"Questions générées à l'infini sur les 7 leçons · réponse et explication après chaque question",
  all:"Tout mélanger",
  chips:{L1:"L1 · Algorithmes",L2:"L2 · Logigrammes",L3:"L3 · Tri à bulles",L4:"L4 · Sélection & insertion",L5:"L5 · Complexité & recherche",L6:"L6 · Tris efficaces",L7:"L7 · Gloutons"},
  tags:{L1:"Leçon 1 — Comprendre et analyser",L2:"Leçon 2 — Logigrammes",L3:"Leçon 3 — Tri à bulles",L4:"Leçon 4 — Sélection et insertion",L5:"Leçon 5 — Complexité et recherche",L6:"Leçon 6 — Tris efficaces",L7:"Leçon 7 — Algorithmes gloutons"},
  question:n=>`Question ${n}`,
  score:(s,d)=>`Score : ${s} / ${d}`,
  placeholder:"Votre réponse…",
  validate:"Valider",
  next:"Question suivante →",
  correct:"✓ Correct !",
  wrong:"✗ Pas tout à fait…",
  goodAnswer:c=>`Bonne réponse : <b>${c}</b>`,
  wasAnswer:a=>`La bonne réponse était <b>${a}</b>.`,
  langBtn:"EN",
  fsTitle:"Plein écran",
  backList:"← Toutes les applications"
 },
 en:{
  kicker:"REVISION",
  title:"Algorithmics II — Revision",
  sub:"Infinitely generated questions on the 7 lessons · answer and explanation after each question",
  all:"Shuffle all",
  chips:{L1:"L1 · Algorithms",L2:"L2 · Flowcharts",L3:"L3 · Bubble sort",L4:"L4 · Selection & insertion",L5:"L5 · Complexity & search",L6:"L6 · Efficient sorts",L7:"L7 · Greedy"},
  tags:{L1:"Lesson 1 — Understanding algorithms",L2:"Lesson 2 — Flowcharts",L3:"Lesson 3 — Bubble sort",L4:"Lesson 4 — Selection and insertion",L5:"Lesson 5 — Complexity and search",L6:"Lesson 6 — Efficient sorts",L7:"Lesson 7 — Greedy algorithms"},
  question:n=>`Question ${n}`,
  score:(s,d)=>`Score: ${s} / ${d}`,
  placeholder:"Your answer…",
  validate:"Check",
  next:"Next question →",
  correct:"✓ Correct!",
  wrong:"✗ Not quite…",
  goodAnswer:c=>`Correct answer: <b>${c}</b>`,
  wasAnswer:a=>`The correct answer was <b>${a}</b>.`,
  langBtn:"FR",
  fsTitle:"Fullscreen",
  backList:"← All applications"
 }
};
const T=()=>I18N[lang];

const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const mcq=(lesson,html,good,wrongs,explain)=>{
  const set=[...new Set(wrongs.filter(w=>String(w)!==String(good)))].slice(0,3);
  const choices=shuffle([good,...set]);
  return {lesson,html,kind:"mcq",choices,correct:choices.indexOf(good),explain};
};
const num=(lesson,html,answer,explain)=>({lesson,html,kind:"num",answer,explain});
const fmt=n=>{const sep=lang==="fr"?"\u2009":",";return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,sep);};
const lst=a=>a.join(", ");
const ceilLog2=n=>Math.ceil(Math.log2(n));

/* petites simulations (réponses calculées, jamais codées en dur) */
function bubblePass(a){ a=[...a]; for(let j=0;j<a.length-1;j++) if(a[j]>a[j+1]){ [a[j],a[j+1]]=[a[j+1],a[j]]; } return a; }
function selectionPass(a){ a=[...a]; let m=0; for(let i=1;i<a.length;i++) if(a[i]<a[m]) m=i; [a[0],a[m]]=[a[m],a[0]]; return a; }
function insertionStep(a){ a=[...a]; const k=a[1]; if(a[0]>k){ a[1]=a[0]; a[0]=k; } return a; }
function partitionPivot(a){ const p=a[0],lo=[],hi=[]; for(let i=1;i<a.length;i++) (a[i]<p?lo:hi).push(a[i]); return [...lo,p,...hi]; }
function mergeCmp(A,B){ let i=0,j=0,c=0; while(i<A.length&&j<B.length){ c++; if(A[i]<B[j]) i++; else j++; } return c; }
function greedyCoins(coins,t){ let r=t,n=0; for(const c of [...coins].sort((a,b)=>b-a)) while(r>=c){ r-=c; n++; } return r===0?n:Infinity; }
function optCoins(coins,t){ const dp=new Array(t+1).fill(Infinity); dp[0]=0;
  for(let s=1;s<=t;s++) for(const c of coins) if(c<=s) dp[s]=Math.min(dp[s],dp[s-c]+1); return dp[t]; }
const SWISS=[5,10,20,50,100,200,500];
function fmtCHF(c){ return (c/100).toFixed(2).replace(".", lang==="fr"?",":".") + (lang==="fr"?" fr":" CHF"); }
function randList(n,min,max){ const s=new Set(); while(s.size<n) s.add(ri(min,max)); return [...s]; }
</script>
<script>
function buildGens(){
 const fr=lang==="fr";
 return [
 /* ---------- Leçon 1 : comprendre et analyser ---------- */
 ()=>mcq("L1",
   fr?"Un algorithme est…":"An algorithm is…",
   fr?"Une suite finie et ordonnée d'instructions précises qui résout un problème":"A finite, ordered sequence of precise instructions that solves a problem",
   fr?["Un programme écrit en Python","Une suite d'instructions qui peut ne jamais s'arrêter","Un calcul que seul un ordinateur peut faire"]
     :["A program written in Python","A sequence of instructions that may never stop","A computation only a computer can do"],
   fr?"<b>Finie</b> (ça s'arrête), <b>précise</b> (aucune ambiguïté), avec <b>un but</b> : transformer des données en résultat. Le programme n'est que sa traduction dans un langage."
     :"<b>Finite</b> (it stops), <b>precise</b> (no ambiguity), with <b>a goal</b>: turn data into a result. The program is only its translation into a language."),
 ()=>{const s=pick([10,12,15,20,24]),k=pick([2,3,4,5]);
   let v=[],n=s; while(n>0){v.push(n);n-=k;}
   return num("L1",
     (fr?"On exécute cet algorithme. <b>Combien de valeurs sont affichées ?</b>":"We run this algorithm. <b>How many values are displayed?</b>")
     +`<pre class="code">n ← ${s}\ntant que n > 0 :\n    afficher n\n    n ← n − ${k}</pre>`,
     v.length,
     fr?`On trace les valeurs : ${lst(v)} — soit <b>${v.length} valeurs</b>. À chaque tour, n se rapproche de la condition d'arrêt : la boucle se termine.`
       :`Trace the values: ${lst(v)} — that is <b>${v.length} values</b>. Each turn brings n closer to the stop condition: the loop terminates.`);},
 ()=>{const N=pick([500,1000,2000,4000,10000]),steps=ceilLog2(N);
   return num("L1",
     fr?`Dans un dictionnaire de <code>${fmt(N)} pages</code>, combien d'étapes au maximum avec la stratégie moitié-moitié (dichotomie) ?`
       :`In a dictionary of <code>${fmt(N)} pages</code>, how many steps at most with the halving strategy (dichotomy)?`,
     steps,
     fr?`À chaque étape on élimine la moitié : ${N} → ${Math.ceil(N/2)} → … → 1. Il faut environ log₂(${fmt(N)}) ≈ <b>${steps} étapes</b> (2<sup>${steps}</sup> = ${fmt(2**steps)} ≥ ${fmt(N)}).`
       :`Each step eliminates half: ${N} → ${Math.ceil(N/2)} → … → 1. It takes about log₂(${fmt(N)}) ≈ <b>${steps} steps</b> (2<sup>${steps}</sup> = ${fmt(2**steps)} ≥ ${fmt(N)}).`);},
 ()=>mcq("L1",
   fr?"Quelle question ne fait <b>pas</b> partie des trois questions de l'analyse d'un algorithme ?":"Which question is <b>not</b> one of the three questions when analysing an algorithm?",
   fr?"Est-il écrit dans un beau langage ?":"Is it written in a nice language?",
   fr?["Se termine-t-il toujours ?","Donne-t-il le bon résultat ?","Est-il assez rapide ?"]
     :["Does it always terminate?","Does it give the right result?","Is it fast enough?"],
   fr?"Les trois questions, dans l'ordre : <b>terminaison</b>, <b>correction</b>, <b>efficacité</b>. Le langage ne change rien à la qualité de la méthode."
     :"The three questions, in order: <b>termination</b>, <b>correctness</b>, <b>efficiency</b>. The language does not change the quality of the method."),
 /* ---------- Leçon 2 : logigrammes ---------- */
 ()=>{const rows=fr?
     [["une question à réponse oui / non","le losange"],["une étape (calculer, lire, afficher)","le rectangle"],["le début ou la fin","l'ovale"],["une boucle","la flèche qui remonte"]]:
     [["a yes / no question","the diamond"],["a step (compute, read, display)","the rectangle"],["the start or the end","the oval"],["a loop","the arrow going back up"]];
   const r=pick(rows);
   return mcq("L2",
     fr?`Dans un logigramme, quel symbole représente <b>${r[0]}</b> ?`:`In a flowchart, which symbol represents <b>${r[0]}</b>?`,
     r[1], rows.filter(x=>x!==r).map(x=>x[1]),
     fr?`Ovale = début/fin · rectangle = étape · losange = question oui/non · et une flèche qui remonte crée la boucle.`
       :`Oval = start/end · rectangle = step · diamond = yes/no question · and an arrow going back up creates the loop.`);},
 ()=>mcq("L2",
   fr?"Comment reconnaît-on une boucle dans un logigramme ?":"How do you recognize a loop in a flowchart?",
   fr?"Une flèche remonte vers une étape précédente":"An arrow goes back up to a previous step",
   fr?["Deux losanges se suivent","Le mot « boucle » est écrit dans un rectangle","Le logigramme a plus de dix étapes"]
     :["Two diamonds follow each other","The word “loop” is written in a rectangle","The flowchart has more than ten steps"],
   fr?"C'est la <b>flèche qui remonte</b> qui crée la répétition : à chaque tour, on teste à nouveau la condition du losange."
     :"It is the <b>arrow going back up</b> that creates the repetition: each turn, the diamond's condition is tested again."),
 ()=>{const s=pick([8,10,12,15,20]),k=pick([2,3,4]);
   let v=[],n=s; while(n>=0){v.push(n);n-=k;}
   return num("L2",
     (fr?"On exécute ce logigramme (écrit en pseudo-code). <b>Combien de valeurs sont affichées ?</b>":"We run this flowchart (written in pseudocode). <b>How many values are displayed?</b>")
     +`<pre class="code">n ← ${s}\ntant que n ≥ 0 :\n    afficher n\n    n ← n − ${k}</pre>`,
     v.length,
     fr?`Attention à la condition « ≥ 0 » : la valeur 0 est affichée aussi ! Valeurs : ${lst(v)} — soit <b>${v.length} valeurs</b>.`
       :`Watch the “≥ 0” condition: the value 0 is displayed too! Values: ${lst(v)} — that is <b>${v.length} values</b>.`);},
 /* ---------- Leçon 3 : tri à bulles ---------- */
 ()=>{const a=randList(4,1,9),after=bubblePass(a);
   const wrongs=[lst([...a].sort((x,y)=>x-y)),lst([...a].reverse()),lst([a[0],...bubblePass(a.slice(1))])];
   return mcq("L3",
     fr?`On fait <b>une seule passe</b> de tri à bulles sur la liste <code>${lst(a)}</code>. Quelle liste obtient-on ?`
       :`We run <b>a single pass</b> of bubble sort on the list <code>${lst(a)}</code>. Which list do we get?`,
     lst(after), wrongs,
     fr?`On compare les voisins deux à deux : ${a.map((_,j)=>j<3?`${a[j]} et ${a[j+1]}`:null).filter(Boolean).join(" · ")}. Après la passe, le plus grand élément (${Math.max(...a)}) est à sa place définitive, tout à la fin — d'où le nom « bulle ».`
       :`Compare neighbours two by two. After the pass, the largest element (${Math.max(...a)}) is in its final place, at the very end — hence the name “bubble”.`);},
 ()=>{const n=pick([5,8,10,20,50,100]);
   return num("L3",
     fr?`Avec le tri à bulles, combien de <b>comparaisons au maximum</b> pour trier <code>${n} éléments</code> ?`
       :`With bubble sort, what is the <b>maximum number of comparisons</b> to sort <code>${n} elements</code>?`,
     n*(n-1)/2,
     fr?`Passe 1 : ${n-1} comparaisons, puis ${n-2}, … jusqu'à 1. Total : ${n-1} + ${n-2} + … + 1 = ${n} × ${n-1} / 2 = <b>${fmt(n*(n-1)/2)}</b>. C'est pour ça que le tri à bulles est coûteux sur les grandes listes.`
       :`Pass 1: ${n-1} comparisons, then ${n-2}, … down to 1. Total: ${n} × ${n-1} / 2 = <b>${fmt(n*(n-1)/2)}</b>. That is why bubble sort is expensive on large lists.`);},
 ()=>mcq("L3",
   fr?"Après la <b>première passe</b> du tri à bulles, qu'est-ce qui est garanti ?":"After the <b>first pass</b> of bubble sort, what is guaranteed?",
   fr?"Le plus grand élément est à sa place définitive, tout à la fin":"The largest element is in its final place, at the very end",
   fr?["La liste est entièrement triée","Le plus petit élément est au début","Tous les éléments ont été échangés une fois"]
     :["The list is fully sorted","The smallest element is at the start","Every element has been swapped once"],
   fr?"Une seule passe ne garantit que la place du <b>plus grand</b> : il « remonte » comme une bulle. Il faut jusqu'à n − 1 passes pour tout trier."
     :"A single pass only guarantees the position of the <b>largest</b>: it “bubbles up”. Up to n − 1 passes are needed to sort everything."),
 /* ---------- Leçon 4 : sélection et insertion ---------- */
 ()=>{const a=randList(4,1,9),after=selectionPass(a);
   const wrongs=[lst([...a].sort((x,y)=>x-y)),lst(a),lst([Math.max(...a),...a.filter(x=>x!==Math.max(...a))])];
   return mcq("L4",
     fr?`Tri par <b>sélection</b> sur la liste <code>${lst(a)}</code> : quelle liste après la <b>première passe</b> ?`
       :`<b>Selection</b> sort on the list <code>${lst(a)}</code>: which list after the <b>first pass</b>?`,
     lst(after), wrongs,
     fr?`On cherche le minimum de toute la liste (${Math.min(...a)}), puis on l'échange <b>une seule fois</b>, avec le premier élément (${a[0]}). La zone triée grandit à gauche.`
       :`Find the minimum of the whole list (${Math.min(...a)}), then swap it <b>once</b>, with the first element (${a[0]}). The sorted zone grows on the left.`);},
 ()=>{let a; do{a=randList(4,1,9);}while(a[0]<=a[1]);
   const after=insertionStep(a);
   const wrongs=[lst([...a].sort((x,y)=>x-y)),lst(a),lst([a[0],a[2],a[1],a[3]])];
   return mcq("L4",
     fr?`Tri par <b>insertion</b> sur <code>${lst(a)}</code> : on traite la clé ${a[1]}. Quelle liste ensuite ?`
       :`<b>Insertion</b> sort on <code>${lst(a)}</code>: we process the key ${a[1]}. Which list next?`,
     lst(after), wrongs,
     fr?`La clé ${a[1]} est plus petite que ${a[0]} : on <b>décale</b> ${a[0]} vers la droite, puis on insère la clé dans le trou. Ce n'est pas un échange, c'est un décalage suivi d'une insertion — comme trier ses cartes au jass.`
       :`The key ${a[1]} is smaller than ${a[0]}: we <b>shift</b> ${a[0]} to the right, then insert the key into the gap. Not a swap — a shift then an insertion, like sorting cards in your hand.`);},
 ()=>{const n=pick([5,10,20,50]);
   return num("L4",
     fr?`Avec le tri par <b>sélection</b>, combien d'<b>échanges</b> au maximum pour <code>${n} éléments</code> ?`
       :`With <b>selection</b> sort, what is the maximum number of <b>swaps</b> for <code>${n} elements</code>?`,
     n-1,
     fr?`Un seul échange par passe, et ${n-1} passes : au maximum <b>${n-1} échanges</b>, quelle que soit la liste. C'est la grande force du tri par sélection.`
       :`One single swap per pass, and ${n-1} passes: at most <b>${n-1} swaps</b>, whatever the list. That is selection sort's great strength.`);},
 ()=>mcq("L4",
   fr?"Quel tri est <b>très rapide sur une liste presque triée</b> ?":"Which sort is <b>very fast on an almost sorted list</b>?",
   fr?"Le tri par insertion":"Insertion sort",
   fr?["Le tri à bulles","Le tri par sélection","Aucun, tous font le même travail"]
     :["Bubble sort","Selection sort","None, they all do the same work"],
   fr?"L'insertion <b>profite de l'ordre existant</b> : si la clé est déjà à sa place, aucun décalage. Bulles et sélection ne « s'en rendent pas compte » et font tout leur travail quand même."
     :"Insertion <b>takes advantage of the existing order</b>: if the key is already in place, no shift at all. Bubble and selection do not “notice” and do all their work anyway."),
 /* ---------- Leçon 5 : complexité et recherche ---------- */
 ()=>{const algos=fr?
     [["on parcourt la liste une fois, du premier au dernier élément","Linéaire — O(n)"],
      ["pour chaque élément, on le compare à tous les autres","Quadratique — O(n²)"],
      ["à chaque étape, on divise la zone de recherche par deux","Logarithmique — O(log n)"]]:
     [["we scan the list once, from first to last element","Linear — O(n)"],
      ["for each element, we compare it to all the others","Quadratic — O(n²)"],
      ["at each step, we halve the search zone","Logarithmic — O(log n)"]];
   const a=pick(algos);
   const fams=fr?["Linéaire — O(n)","Quadratique — O(n²)","Logarithmique — O(log n)","Cubique — O(n³)"]
                :["Linear — O(n)","Quadratic — O(n²)","Logarithmic — O(log n)","Cubic — O(n³)"];
   return mcq("L5",
     fr?`Un algorithme : <b>${a[0]}</b>. Quelle est sa famille de complexité ?`:`An algorithm: <b>${a[0]}</b>. What is its complexity family?`,
     a[1], fams.filter(f=>f!==a[1]),
     fr?"Deux boucles imbriquées se <b>multiplient</b> (n × n = n², pas 2n) ; diviser par deux à chaque étape donne du logarithmique ; un seul parcours est linéaire."
       :"Nested loops <b>multiply</b> (n × n = n², not 2n); halving at each step is logarithmic; a single scan is linear.");},
 ()=>{const n=pick([100,250,1000,1024,1000000]),steps=ceilLog2(n);
   return num("L5",
     fr?`Recherche <b>binaire</b> dans une liste triée de <code>${fmt(n)} éléments</code> : combien de comparaisons au maximum ?`
       :`<b>Binary</b> search in a sorted list of <code>${fmt(n)} elements</code>: how many comparisons at most?`,
     steps,
     fr?`Chaque comparaison élimine la moitié : il faut log₂(${fmt(n)}) ≈ <b>${steps} étapes</b> (2<sup>${steps}</sup> = ${fmt(2**steps)} ≥ ${fmt(n)}). Condition indispensable : la liste doit être <b>triée</b>.`
       :`Each comparison eliminates half: log₂(${fmt(n)}) ≈ <b>${steps} steps</b> (2<sup>${steps}</sup> = ${fmt(2**steps)} ≥ ${fmt(n)}). Indispensable condition: the list must be <b>sorted</b>.`);},
 ()=>mcq("L5",
   fr?"Si on multiplie la taille des données par 10, le travail d'un algorithme <b>quadratique</b> est multiplié par…":"If the data size is multiplied by 10, the work of a <b>quadratic</b> algorithm is multiplied by…",
   "100",["10","2","1 000"],
   fr?"Quadratique = n² : (10n)² = 100 × n². Un algorithme linéaire, lui, serait multiplié par 10."
     :"Quadratic = n²: (10n)² = 100 × n². A linear algorithm would only be multiplied by 10."),
 ()=>{const n=pick([50,200,1000,5000]);
   return num("L5",
     fr?`Recherche <b>linéaire</b> dans une liste non triée de <code>${fmt(n)} éléments</code> : combien d'étapes dans le pire cas ?`
       :`<b>Linear</b> search in an unsorted list of <code>${fmt(n)} elements</code>: how many steps in the worst case?`,
     n,
     fr?`Dans le pire cas, l'élément cherché est le dernier (ou absent) : on regarde <b>tous</b> les éléments, soit <b>${fmt(n)} étapes</b>. C'est la seule méthode possible si la liste n'est pas triée.`
       :`In the worst case, the element is last (or missing): we look at <b>every</b> element, so <b>${fmt(n)} steps</b>. It is the only possible method when the list is not sorted.`);},
 /* ---------- Leçon 6 : tris efficaces ---------- */
 ()=>{const sizes=pick([[3,3],[3,2],[4,2],[4,3]]);
   const A=[...randList(sizes[0],1,20)].sort((x,y)=>x-y);
   let B; do{ B=[...randList(sizes[1],1,20)].sort((x,y)=>x-y); }while(B.some(v=>A.includes(v)));
   const c=mergeCmp(A,B);
   return num("L6",
     fr?`On <b>fusionne</b> les paquets triés <code>${lst(A)}</code> et <code>${lst(B)}</code>. Combien de comparaisons ?`
       :`We <b>merge</b> the sorted piles <code>${lst(A)}</code> and <code>${lst(B)}</code>. How many comparisons?`,
     c,
     fr?`On ne compare que les deux têtes, on prend la plus petite, on recommence. Dès qu'un paquet est épuisé, on recopie l'autre <b>sans comparer</b>. Total : <b>${c} comparaisons</b> (au pire ${A.length+B.length-1} pour ${A.length+B.length} éléments).`
       :`Only compare the two heads, take the smaller one, repeat. As soon as one pile is empty, copy the other <b>without comparing</b>. Total: <b>${c} comparisons</b> (at worst ${A.length+B.length-1} for ${A.length+B.length} elements).`);},
 ()=>{const a=randList(4,1,9),after=partitionPivot(a);
   const wrongs=[lst([...a].sort((x,y)=>x-y)),lst(a),lst([...a].reverse())];
   return mcq("L6",
     fr?`Tri rapide sur <code>${lst(a)}</code>, pivot = premier élément. Quelle liste après la <b>séparation</b> ?`
       :`Quicksort on <code>${lst(a)}</code>, pivot = first element. Which list after the <b>split</b>?`,
     lst(after), wrongs,
     fr?`Pivot ${a[0]} : les plus petits à gauche (${lst(after.slice(0,after.indexOf(a[0])))||"aucun"}), les plus grands à droite — le pivot est déjà à <b>sa place définitive</b>. Les deux parties ne sont pas encore triées : on recommence sur chacune.`
       :`Pivot ${a[0]}: smaller ones on the left, bigger ones on the right — the pivot is already in <b>its final place</b>. The two parts are not sorted yet: repeat on each.`);},
 ()=>mcq("L6",
   fr?"Pourquoi choisit-on le pivot <b>au hasard</b> en pratique ?":"Why do we pick the pivot <b>at random</b> in practice?",
   fr?"Pour éviter le pire cas : un pivot toujours le plus petit (ou le plus grand) fait retomber en O(n²)":"To avoid the worst case: a pivot that is always the smallest (or largest) falls back to O(n²)",
   fr?["Pour que le tri soit moins prévisible et plus amusant","Parce que le premier élément est toujours le meilleur pivot","Pour utiliser moins de mémoire"]
     :["To make the sort less predictable and more fun","Because the first element is always the best pivot","To use less memory"],
   fr?"Exemple : liste déjà triée + pivot = premier élément → une partie est vide à chaque fois, on retombe en O(n²). Le pivot au hasard rend ce pire cas très improbable."
     :"Example: already sorted list + pivot = first element → one side is empty every time, back to O(n²). A random pivot makes this worst case very unlikely."),
 ()=>{const n=pick([6,8,10,20]);
   return num("L6",
     fr?`Fusionner deux paquets triés totalisant <code>${n} éléments</code> : combien de comparaisons <b>au pire</b> ?`
       :`Merging two sorted piles totalling <code>${n} elements</code>: how many comparisons <b>at worst</b>?`,
     n-1,
     fr?`Au pire, chaque comparaison place un élément, et le dernier se place tout seul : <b>n − 1 = ${n-1}</b> comparaisons.`
       :`At worst, each comparison places one element, and the last one places itself: <b>n − 1 = ${n-1}</b> comparisons.`);},
 /* ---------- Leçon 7 : gloutons ---------- */
 ()=>{let t; do{ t=5*ri(6,198); }while(greedyCoins(SWISS,t)>8);
   const n=greedyCoins(SWISS,t);
   let r=t,used=[]; for(const c of [...SWISS].sort((a,b)=>b-a)) while(r>=c){r-=c;used.push(c);}
   return num("L7",
     fr?`Avec la méthode gloutonne, combien de pièces pour rendre <code>${fmtCHF(t)}</code> (monnaie suisse) ?`
       :`With the greedy method, how many coins to give back <code>${fmtCHF(t)}</code> (Swiss coins)?`,
     n,
     fr?`Toujours la plus grosse pièce qui ne dépasse pas le reste : ${used.map(c=>fmtCHF(c)).join(" → ")} soit <b>${n} pièces</b>. Avec les pièces suisses, c'est aussi le minimum possible.`
       :`Always the largest coin that does not exceed the remainder: ${used.map(c=>fmtCHF(c)).join(" → ")} = <b>${n} coins</b>. With Swiss coins, this is also the minimum possible.`);},
 ()=>{const coins=[1,3,4];
   const traps=[],safe=[];
   for(let t=2;t<=16;t++){ (greedyCoins(coins,t)>optCoins(coins,t)?traps:safe).push(t); }
   const trap=pick(traps);
   return mcq("L7",
     fr?`Avec les pièces <code>1 · 3 · 4</code>, quel montant <b>piège</b> la méthode gloutonne ?`
       :`With coins <code>1 · 3 · 4</code>, which amount <b>traps</b> the greedy method?`,
     String(trap), shuffle(safe).slice(0,3).map(String),
     fr?`Pour ${trap} : le glouton prend 4 en premier et finit avec ${greedyCoins(coins,trap)} pièces, alors que l'optimal est ${optCoins(coins,trap)} pièces. Le meilleur choix immédiat bloque la combinaison gagnante !`
       :`For ${trap}: greedy takes 4 first and ends with ${greedyCoins(coins,trap)} coins, while the optimum is ${optCoins(coins,trap)} coins. The best immediate choice blocks the winning combination!`);},
 ()=>{const cases=[{coins:[1,3,4],t:6},{coins:[1,5,7],t:10},{coins:[1,10,25],t:30}];
   const c=pick(cases),best=optCoins(c.coins,c.t),g=greedyCoins(c.coins,c.t);
   return num("L7",
     fr?`Pièces <code>${c.coins.join(" · ")}</code>, montant à rendre : <code>${c.t}</code>. La <b>meilleure</b> solution utilise combien de pièces ?`
       :`Coins <code>${c.coins.join(" · ")}</code>, amount to give back: <code>${c.t}</code>. The <b>best</b> solution uses how many coins?`,
     best,
     fr?`Le glouton donne ${g} pièces, mais ce n'est pas le minimum : la solution optimale en utilise <b>${best}</b>. Le glouton est rapide et souvent bon — optimal seulement pour certains problèmes.`
       :`Greedy gives ${g} coins, but that is not the minimum: the optimal solution uses <b>${best}</b>. Greedy is fast and often good — optimal only for some problems.`);},
 ()=>mcq("L7",
   fr?"Pourquoi la méthode gloutonne donne-t-elle <b>toujours le minimum</b> avec les pièces suisses ?":"Why does the greedy method <b>always give the minimum</b> with Swiss coins?",
   fr?"Remplacer une pièce par des pièces plus petites demande toujours plus de pièces (rythme 1–2–5)":"Replacing a coin with smaller coins always takes more coins (the 1–2–5 rhythm)",
   fr?["Chaque pièce est un multiple entier de la précédente","Le glouton est optimal pour tous les systèmes de pièces","Parce qu'il existe une pièce de 5 francs"]
     :["Each coin is an integer multiple of the previous one","Greedy is optimal for every coin system","Because there is a 5-franc coin"],
   fr?"Le rythme 1–2–5 fait qu'une grosse pièce vaut toujours mieux que les petites qui la remplaceraient : le choix glouton ne peut jamais être regretté. (La pièce de 5 fr n'est pas un multiple entier de 2 fr — ce n'est pas ça, la raison !)"
     :"The 1–2–5 rhythm means a big coin always beats the smaller coins that would replace it: the greedy choice can never be regretted. (The 5-franc coin is not an integer multiple of 2 francs — that is not the reason!)"),
 ];
}
</script>
<script>
const state={pool:[],idx:0,score:0,done:0,answered:false};
function newPool(filter){
  const gens=buildGens().filter(g=>{const l=g().lesson;return filter==="ALL"||l===filter;});
  return shuffle(gens);
}
let filter="ALL";
function start(f){filter=f;state.pool=newPool(f);state.idx=0;state.score=0;state.done=0;next();}
function next(){
  state.answered=false;
  if(state.idx>=state.pool.length){state.pool=state.pool.concat(newPool(filter));}
  const q=state.pool[state.idx++]();
  render(q);updateBar();
}
function updateBar(){
  document.getElementById("fill").style.width=Math.min(100,state.done*10)+"%";
  document.getElementById("mleft").textContent=T().question(state.done+1);
  document.getElementById("mright").textContent=T().score(state.score,state.done);
}
function render(q){
  const card=document.getElementById("card");
  let h=`<span class="tag">${T().tags[q.lesson]}</span><div class="qt">${q.html}</div>`;
  if(q.kind==="mcq"){
    h+=`<div class="choices">`+q.choices.map((c,i)=>
      `<button class="ch" data-i="${i}">${c}</button>`).join("")+`</div>`;
  }else{
    h+=`<div class="inrow"><input id="ans" type="number" inputmode="numeric" placeholder="${T().placeholder}" autocomplete="off"><button class="btn" id="val">${T().validate}</button></div>`;
  }
  h+=`<div id="fb"></div><div class="next" id="nx" style="display:none"><button class="btn" id="btnNext">${T().next}</button></div>`;
  card.innerHTML=h;
  if(q.kind==="mcq"){
    card.querySelectorAll(".ch").forEach(b=>b.onclick=()=>{
      if(state.answered)return;state.answered=true;
      const i=+b.dataset.i,ok=i===q.correct;
      card.querySelectorAll(".ch").forEach((x,j)=>{x.disabled=true;if(j===q.correct)x.classList.add("ok");else if(j===i)x.classList.add("ko");});
      finish(q,ok,T().goodAnswer(q.choices[q.correct]));
    });
  }else{
    const inp=document.getElementById("ans");inp.focus();
    const go=()=>{if(state.answered)return;const v=inp.value.trim();if(v==="")return;state.answered=true;
      const ok=Number(v.replace(/[\s\u2009,]/g,""))===q.answer;inp.disabled=true;document.getElementById("val").disabled=true;
      finish(q,ok,T().wasAnswer(fmt(q.answer)));};
    document.getElementById("val").onclick=go;
    inp.onkeydown=e=>{if(e.key==="Enter")go();};
  }
  document.getElementById("btnNext").onclick=next;
}
function finish(q,ok,extra){
  state.done++;if(ok)state.score++;
  document.getElementById("fb").innerHTML=
   `<div class="fb ${ok?"good":"bad"}"><b class="t">${ok?T().correct:T().wrong}</b>${ok?"":extra+" "}${q.explain}
</div>`;
  document.getElementById("nx").style.display="flex";
  updateBar();
}

/* --- UI : filtres, langue, plein écran --- */
const FILTERS=["ALL","L1","L2","L3","L4","L5","L6","L7"];
function buildFilters(){
  const box=document.getElementById("filters");
  box.innerHTML="";
  FILTERS.forEach(f=>{
    const b=document.createElement("button");
    b.className="chip"+(f===filter?" on":"");
    b.dataset.f=f;
    b.textContent=f==="ALL"?T().all:T().chips[f];
    b.onclick=()=>{filter=f;buildFilters();start(f);};
    box.appendChild(b);
  });
}
function applyLang(){
  document.documentElement.lang=lang;
  document.getElementById("kicker").textContent=T().kicker;
  document.getElementById("title").textContent=T().title;
  document.getElementById("sub").textContent=T().sub;
  document.getElementById("langBtn").textContent=T().langBtn;
  document.getElementById("fsBtn").title=T().fsTitle;
  document.getElementById("backLink").textContent=T().backList;
  document.title=T().title;
  buildFilters();
  start(filter);
}
document.getElementById("langBtn").onclick=()=>{lang=lang==="fr"?"en":"fr";try{localStorage.setItem("fj-lang",lang);}catch(e){};applyLang();};

const fsBtn=document.getElementById("fsBtn");
function isFs(){return document.fullscreenElement||document.webkitFullscreenElement;}
fsBtn.onclick=()=>{
  const el=document.documentElement;
  if(isFs()){(document.exitFullscreen||document.webkitExitFullscreen).call(document);}
  else{const req=el.requestFullscreen||el.webkitRequestFullscreen;if(req)req.call(el);}
};
function fsChange(){fsBtn.style.background=isFs()?"var(--primaryLight)":"var(--card)";}
document.addEventListener("fullscreenchange",fsChange);
document.addEventListener("webkitfullscreenchange",fsChange);

applyLang();
</script>

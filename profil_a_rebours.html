<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Simulez une journée ordinaire en ligne et découvrez le profil publicitaire assemblé à partir de vos traces — puis vérifiez s'il vous ressemble.">
<title>Le profil à rebours · Gymnase — Frédéric Jaccard</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2320241F'/%3E%3Ctext x='32' y='43' font-family='Arial,sans-serif' font-size='28' font-weight='bold' fill='%23FFFFFF' text-anchor='middle'%3EFJ%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Quattrocento+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBFAF6; --card:#F7F6F2; --primary:#155E4C; --primaryLight:#E3F0EA;
  --accent:#D96A08; --accentLight:#FDEBD8; --line:#D8D5CB; --ink:#20241F; --muted:#6E726B;
  --error:#C84B31;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:"Quattrocento Sans",sans-serif;padding:20px;max-width:980px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px;margin-bottom:16px}
.kicker{font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
h1{font-size:26px;color:var(--primary)}
h2{font-size:19px;color:var(--primary);margin:18px 0 8px}
.hdrBtns{display:flex;gap:8px}
button{font-family:inherit;font-size:14px;font-weight:700;padding:8px 16px;border-radius:10px;
  border:2px solid var(--primary);background:var(--card);color:var(--primary);cursor:pointer}
button:hover{background:var(--primaryLight)}
.instruction{background:var(--primaryLight);border-radius:12px;padding:12px 16px;margin-bottom:16px;font-size:15px}
footer{margin-top:20px;text-align:center;font-size:13px;color:var(--muted)}
footer a{color:var(--muted);font-weight:400;text-decoration:none}
footer a:hover{text-decoration:underline}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}

/* progression de la journée */
.progress{display:flex;gap:6px;margin-bottom:16px}
.pstep{flex:1;text-align:center;font-size:11px;color:var(--muted)}
.dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);background:var(--card);margin:0 auto 4px}
.dot.done{background:var(--primary);border-color:var(--primary)}
.dot.now{border-color:var(--accent);background:var(--accentLight)}

/* moment de la journée */
.moment{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.momentHead{display:flex;align-items:baseline;gap:10px;margin-bottom:4px;flex-wrap:wrap}
.mtime{font-weight:700;color:var(--accent);font-size:15px}
.mq{font-size:17px;font-weight:700}
.choices{display:grid;gap:10px;margin-top:12px}
.choice{text-align:left;font-weight:400;font-size:15px;padding:12px 14px;min-height:44px;line-height:1.35}
.choice:hover{border-color:var(--accent)}

/* journal du traceur */
.traces{background:var(--card);border-left:4px solid var(--accent);border-radius:10px;padding:12px 14px;font-size:13px;color:var(--muted)}
.traces b{color:var(--ink)}
.traces ul{list-style:none;margin-top:8px}
.traces li{padding:4px 0;border-bottom:1px dashed var(--line)}
.traces li:last-child{border-bottom:none}

/* profil révélé */
.profileGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin:14px 0}
.pcard{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:14px}
.pcard h3{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin-bottom:8px;font-weight:700}
.pval{font-size:20px;font-weight:700;color:var(--primary)}
.conf{font-size:13px;color:var(--muted);margin-top:4px}
.barTrack{height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:8px}
.barFill{height:100%;background:var(--accent);border-radius:99px}
.intRow{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:14px}
.intRow .nm{width:130px;flex:none}
.intRow .tr{flex:1;height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.intRow .fl{height:100%;background:var(--primary);border-radius:99px}
.note{background:var(--accentLight);border:2px solid var(--accent);border-radius:10px;padding:10px 14px;font-size:14px;margin:12px 0}

/* quiz réalité */
.qa{margin:14px 0}
.qaLabel{font-weight:700;margin-bottom:8px}
.optRow{display:flex;flex-wrap:wrap;gap:8px}
.opt{font-weight:400;min-height:44px}
.opt.selected{background:var(--primary);color:#fff;border-color:var(--primary)}
.btnAccent{background:var(--accent);border-color:var(--accent);color:#fff;min-height:44px;font-size:15px}
.btnAccent:hover{background:var(--accent);filter:brightness(1.06)}
.btnAccent:disabled{opacity:.45;cursor:not-allowed;filter:none}
.center{text-align:center;margin:18px 0}

/* résultats */
.resultRow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 14px;border-radius:10px;margin:8px 0;font-size:14px;flex-wrap:wrap}
.resultRow.ok{background:var(--primaryLight);border:2px solid var(--primary)}
.resultRow.ko{background:var(--accentLight);border:2px solid var(--error)}
.badge{font-weight:700;white-space:nowrap}
.ok .badge{color:var(--primary)}
.ko .badge{color:var(--error)}
.verdict{font-size:16px;font-weight:700;color:var(--primary);margin:14px 0 4px}
.takeaway{background:var(--primaryLight);border-radius:12px;padding:14px 16px;margin-top:14px}
.takeaway h3{color:var(--primary);margin-bottom:8px}
.takeaway ul{padding-left:20px}
.takeaway li{margin:6px 0;font-size:14px}

@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.fade{animation:fadeIn .45s ease}

@media(max-width:640px){
  body{padding:14px}
  h1{font-size:22px}
  .hdrBtns{width:100%}
  button{min-height:44px}
  .pstep{font-size:9px}
  .intRow .nm{width:104px;font-size:13px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>
</head>

let lang=(function(){try{const c=document.cookie.match(/(?:^|;\s*)fj-lang=([a-z]{2})/);if(c&&(c[1]==="fr"||c[1]==="en"))return c[1];}catch(e){}try{const s=localStorage.getItem("fj-lang");return(s==="fr"||s==="en")?s:"fr";}catch(e){return"fr";}})();
const T = () => I18N[lang];

/* ---------- état ---------- */
let phase = "day";                       // day | reveal | done
let picks = [];                          // index du choix pour chaque moment
let real = {age:null, inc:null, int:null};

/* ---------- calcul du profil ---------- */
function profile(){
  const age={}, inc={}, int={};
  AGE_KEYS.forEach(k=>age[k]=0);
  INC_KEYS.forEach(k=>inc[k]=0);
  INT_KEYS.forEach(k=>int[k]=0);
  picks.forEach((ci,mi)=>{
    const s = MOMENTS[mi].choices[ci].sig;
    for(const k in s.age) age[k]+=s.age[k];
    for(const k in s.inc) inc[k]+=s.inc[k];
    for(const k in s.int) int[k]+=s.int[k];
  });
  const winner = (obj,keys)=>{
    let best=keys[0], tot=0;
    keys.forEach(k=>{ tot+=obj[k]; if(obj[k]>obj[best]) best=k; });
    return {key:best, conf: tot>0 ? Math.round(100*obj[best]/tot) : 0};
  };
  const topInt = INT_KEYS.map(k=>({key:k, n:int[k]}))
    .filter(o=>o.n>0)
    .sort((a,b)=> b.n-a.n || INT_KEYS.indexOf(a.key)-INT_KEYS.indexOf(b.key))
    .slice(0,3);
  return { age:winner(age,AGE_KEYS), inc:winner(inc,INC_KEYS), topInt,
           maxInt: topInt.length ? topInt[0].n : 1, traces: picks.length*3 };
}

/* ---------- rendu ---------- */
function esc(s){ return s; }

function renderDay(){
  let h = `<div class="fade"><h2>${T().dayLabel}</h2><div class="progress">`;

  const m = MOMENTS[picks.length];

    <div class="mq">${m.q[lang]}</div>
    <div class="choices">`;
  m.choices.forEach((c,i)=>{
    h += `<button type="button" class="choice" data-c="${i}">${c.label[lang]}</button>`;
  });
  h += `</div></div>`;
  h += renderTraces();
  h += `</div>`;
  $("app").innerHTML = h;
  document.querySelectorAll(".choice").forEach(b=>{
    b.onclick = ()=> choose(parseInt(b.dataset.c,10));
  });
}

function renderTraces(){
  let h = `<div class="traces"><b>${T().traceTitle(picks.length*3)}</b>`;
  if(picks.length===0){
    h += `<div style="margin-top:6px">${T().traceEmpty}</div>`;
  } else {
    h += `<ul>`;
    picks.forEach((ci,mi)=>{
      h += `<li>${MOMENTS[mi].time} · ${MOMENTS[mi].choices[ci].trace[lang]}</li>`;
    });
    h += `</ul>`;
  }
  return h + `</div>`;
}

function renderReveal(){
  const p = profile();
  let h = `<div class="fade">`;
  h += `<h2>${T().revealTitle}</h2>`;
  h += `<div class="note">${T().revealSub(p.traces)}</div>`;
  h += `<div class="profileGrid">
    <div class="pcard">
      <h3>${T().ageLabel}</h3>
      <div class="pval">${T().ages[p.age.key]}</div>
      <div class="conf">${T().conf(p.age.conf)}</div>
      <div class="barTrack"><div class="barFill" style="width:${p.age.conf}%"></div></div>
    </div>
    <div class="pcard">
      <h3>${T().incLabel}</h3>
      <div class="pval">${T().incs[p.inc.key]}</div>
      <div class="conf">${T().conf(p.inc.conf)}</div>
      <div class="barTrack"><div class="barFill" style="width:${p.inc.conf}%"></div></div>
    </div>
    <div class="pcard">
      <h3>${T().intLabel}</h3>`;
  p.topInt.forEach(o=>{
    h += `<div class="intRow"><span class="nm">${T().ints[o.key]}</span><span class="tr"><span class="fl" style="display:block;width:${Math.round(100*o.n/p.maxInt)}%"></span></span></div>`;
  });
  h += `</div></div>`;
  h += renderTraces();
  /* quiz réalité */
  h += `<h2>${T().quizTitle}</h2><p style="margin-bottom:6px">${T().quizSub}</p>`;
  h += `<div class="qa"><div class="qaLabel">${T().qAge}</div><div class="optRow">`;
  AGE_KEYS.forEach(k=>{
    h += `<button type="button" class="opt${real.age===k?" selected":""}" data-dim="age" data-v="${k}">${T().ages[k]}</button>`;
  });
  h += `</div></div><div class="qa"><div class="qaLabel">${T().qInc}</div><div class="optRow">`;
  INC_KEYS.forEach(k=>{
    h += `<button type="button" class="opt${real.inc===k?" selected":""}" data-dim="inc" data-v="${k}">${T().realInc[k]}</button>`;
  });
  h += `</div></div><div class="qa"><div class="qaLabel">${T().qInt}</div><div class="optRow">`;
  INT_KEYS.forEach(k=>{
    h += `<button type="button" class="opt${real.int===k?" selected":""}" data-dim="int" data-v="${k}">${T().ints[k]}</button>`;
  });
  h += `</div></div>`;
  const ready = real.age && real.inc && real.int;
  h += `<div class="center"><button type="button" id="cmpBtn" class="btnAccent" ${ready?"":"disabled"}>${T().compareBtn}</button>`;
  if(!ready) h += `<div style="font-size:13px;color:var(--muted);margin-top:6px">${T().hintChoose}</div>`;
  h += `</div></div>`;
  $("app").innerHTML = h;
  document.querySelectorAll(".opt").forEach(b=>{
    b.onclick = ()=>{ real[b.dataset.dim]=b.dataset.v; render(); };
  });
  $("cmpBtn").onclick = ()=>{ phase="done"; render(); scrollTop(); };
}

function renderDone(){
  const p = profile();
  const ageOk = p.age.key===real.age;
  const incOk = p.inc.key===real.inc;
  const intOk = p.topInt.some(o=>o.key===real.int);
  const n = (ageOk?1:0)+(incOk?1:0)+(intOk?1:0);
  const row = (ok,body)=>`<div class="resultRow ${ok?"ok":"ko"}"><span>${body}</span><span class="badge">${ok?T().okBadge:T().koBadge}</span></div>`;
  let h = `<div class="fade"><h2>${T().resultTitle(n)}</h2>`;
  h += row(ageOk, `${T().rowAge} : ${T().estL} « ${T().ages[p.age.key]} » · ${T().realL} « ${T().ages[real.age]} »`);
  h += row(incOk, `${T().rowInc} : ${T().estL} « ${T().incs[p.inc.key]} » · ${T().realL} « ${T().realInc[real.inc]} »`);
  const top3 = p.topInt.map(o=>T().ints[o.key]).join(", ");
  h += row(intOk, `${T().intLabel} : « ${T().ints[real.int]} » ${intOk?T().intHit:T().intMiss} (${T().top3L} : ${top3})`);
  h += `<div class="verdict">${T().verdict(n)}</div>`;
  h += `<div class="takeaway"><h3>${T().takeTitle}</h3><ul>`;
  T().takes.forEach(t=>{ h += `<li>${t}</li>`; });
  h += `</ul></div>`;
  h += `<div class="center"><button type="button" id="rstBtn">${T().restart}</button></div></div>`;
  $("app").innerHTML = h;
  $("rstBtn").onclick = ()=>{ phase="day"; picks=[]; real={age:null,inc:null,int:null}; render(); scrollTop(); };
}

function render(){
  if(phase==="day") renderDay();
  else if(phase==="reveal") renderReveal();
  else renderDone();
}

function choose(i){
  picks.push(i);
  if(picks.length>=MOMENTS.length) phase="reveal";
  render();
  scrollTop();
}

function scrollTop(){
  const rm = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  window.scrollTo({top:0, behavior: rm ? "auto" : "smooth"});
}

/* ---------- langue ---------- */
function applyLang(){
  document.documentElement.lang = lang;
  $("kicker").textContent = T().kicker;
  $("title").textContent = T().title;
  $("instruction").textContent = T().instruction;
  $("langBtn").textContent = lang==="fr" ? "English" : "Français";
  $("backLink").textContent = T().backList;
  document.title = T().title + " · Gymnase — Frédéric Jaccard";
  syncFsLabel();
  render();
}
$("langBtn").onclick = ()=>{
  lang = lang==="fr" ? "en" : "fr";
  try{
    localStorage.setItem("fj-lang",lang);
    document.cookie = "fj-lang="+lang+";domain=.fredericjaccard.com;path=/;max-age=31536000;SameSite=Lax";
  }catch(e){}
  applyLang();
};

/* ---------- plein écran (Safari compris) ---------- */
function isFs(){ return !!(document.fullscreenElement || document.webkitFullscreenElement); }
$("fsBtn").onclick = ()=>{
  const el = document.documentElement;
  if(isFs()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  else {
    const req = el.requestFullscreen || el.webkitRequestFullscreen;
    if(req){ const r = req.call(el); if(r && r.catch) r.catch(()=>{}); }
  }
};
function syncFsLabel(){ $("fsLabel").textContent = isFs() ? T().fsExit : T().fs; }
document.addEventListener("fullscreenchange",syncFsLabel);
document.addEventListener("webkitfullscreenchange",syncFsLabel);

applyLang();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Jeu de cartes de dilemmes éthiques du numérique : pour chaque situation, choisissez une option, découvrez les arguments des deux côtés et exportez un résumé pour nourrir le débat de classe.">
<title>Dilemmes du numérique · Gymnase — Frédéric Jaccard</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2320241F'/%3E%3Ctext x='32' y='43' font-family='Arial,sans-serif' font-size='28' font-weight='bold' fill='%23FFFFFF' text-anchor='middle'%3EFJ%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Quattrocento+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBFAF6; --card:#F7F6F2; --primary:#155E4C; --primaryLight:#E3F0EA;
  --accent:#D96A08; --accentLight:#FDEBD8; --line:#D8D5CB; --ink:#20241F; --muted:#6E726B;
  --error:#C84B31;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:"Quattrocento Sans",sans-serif;padding:20px;max-width:860px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px;margin-bottom:16px}
.kicker{font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
h1{font-size:26px;color:var(--primary)}
.hdrBtns{display:flex;gap:8px}
button{font-family:inherit;font-size:14px;font-weight:700;padding:8px 16px;border-radius:10px;
  border:2px solid var(--primary);background:var(--card);color:var(--primary);cursor:pointer;min-height:44px}
button:hover{background:var(--primaryLight)}
.instruction{background:var(--primaryLight);border-radius:12px;padding:12px 16px;margin-bottom:16px;font-size:15px;color:var(--primary)}
footer{margin-top:20px;text-align:center;color:var(--muted);font-size:13px}
footer a{color:var(--muted);font-weight:400;text-decoration:none}
footer a:hover{text-decoration:underline}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}

/* ---------- Zone de jeu ---------- */
.progressWrap{margin-bottom:12px}
.progressMeta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:4px}
.progressTrack{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.progressFill{height:100%;background:var(--accent);border-radius:3px;transition:width .3s ease}

.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px 24px;
  border-top:4px solid var(--accent)}
.cardTitle{font-size:20px;font-weight:700;color:var(--primary);margin-bottom:10px}
.cardSit{font-size:16px;line-height:1.5;margin-bottom:18px}
.choiceRow{display:flex;gap:12px;flex-wrap:wrap}
.choiceRow button{flex:1 1 240px;font-size:15px;padding:12px 14px}

/* état révélé */
.verdict{margin:14px 0 6px;font-size:14px;font-weight:700;color:var(--accent)}
.argCols{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.argBox{border-radius:12px;padding:14px 16px;font-size:14px;line-height:1.45}
.argBox h3{font-size:13px;text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}
.argFor{background:var(--primaryLight);border:1px solid var(--primary)}
.argFor h3{color:var(--primary)}
.argAgainst{background:var(--bg);border:1px solid var(--line)}
.argAgainst h3{color:var(--muted)}
.argBox ul{list-style:none}
.argBox li{margin-bottom:8px;padding-left:16px;position:relative}
.argBox li::before{content:"";position:absolute;left:0;top:8px;width:7px;height:7px;border-radius:50%;background:var(--accent)}
.argFor li::before{background:var(--primary)}
.noAnswer{background:var(--accentLight);border-radius:10px;padding:10px 14px;font-size:14px;margin-bottom:16px}
.nextRow{display:flex;justify-content:flex-end}

/* ---------- Résumé ---------- */
.sumPanel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px 24px;border-top:4px solid var(--primary)}
.sumPanel h2{font-size:20px;color:var(--primary);margin-bottom:8px}
.sumIntro{font-size:15px;margin-bottom:16px}
.sumItem{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px;background:var(--bg)}
.sumItem .t{font-weight:700;color:var(--primary);margin-bottom:4px}
.sumItem .c{font-size:14px;margin-bottom:6px}
.sumItem .c b{color:var(--accent)}
.sumItem .a{font-size:13px;color:var(--muted)}
.sumActions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.sumActions button.accentBtn{background:var(--primary);color:#fff;border-color:var(--primary)}
.sumActions button.accentBtn:hover{filter:brightness(.92)}
.copyMsg{font-size:14px;color:var(--primary);font-weight:700;margin-top:10px;min-height:18px}
textarea.sumText{width:100%;min-height:150px;margin-top:12px;border:1px solid var(--line);border-radius:10px;
  padding:10px;font-family:inherit;font-size:13px;background:var(--bg);color:var(--muted)}

@media(max-width:640px){
  body{padding:14px}
  h1{font-size:22px}
  .hdrBtns{width:100%}
  .argCols{grid-template-columns:1fr}
  .card,.sumPanel{padding:16px}
  .cardTitle{font-size:18px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>
</head>
<body>

  <div>
    <div class="kicker" id="kicker"></div>

    <button id="fsBtn" type="button"><span id="fsLabel"></span></button>

</header>

<div id="stage"></div>

      },
      b: {

  },
  {

/* ================================================================
   LOGIQUE — tirage de cartes, révélation, résumé exportable
   ================================================================ */
const state = {
  order: [],      // ordre mélangé des indices de DILEMMAS
  pos: 0,         // position dans l'ordre
  picked: null,   // "a" | "b" | null pour la carte courante
  log: []         // {idx, choice} pour le résumé
};

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function newGame() {
  state.order = shuffle(DILEMMAS.map((_, i) => i));
  state.pos = 0;
  state.picked = null;
  state.log = [];
  render();
}

function el(tag, cls, html) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html !== undefined) e.innerHTML = html;
  return e;
}

function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function render() {
  const st = $("stage");
  st.innerHTML = "";
  if (state.pos >= state.order.length) { renderSummary(st); return; }
  renderCard(st);
}

function renderCard(st) {
  const t = T();
  const idx = state.order[state.pos];
  const d = DILEMMAS[idx][lang];
  const total = state.order.length;

  const pw = el("div", "progressWrap");
  const meta = el("div", "progressMeta");
  meta.innerHTML = "<span>" + esc(t.cardOf(state.pos + 1, total)) + "</span>";
  const track = el("div", "progressTrack");
  const fill = el("div", "progressFill");
  fill.style.width = Math.round((state.pos / total) * 100) + "%";
  track.appendChild(fill);
  pw.appendChild(meta); pw.appendChild(track);
  st.appendChild(pw);

  const card = el("div", "card");
  card.appendChild(el("div", "cardTitle", esc(d.t)));
  card.appendChild(el("div", "cardSit", esc(d.s)));

  if (!state.picked) {
    const row = el("div", "choiceRow");
    const ba = el("button", null, esc(d.a.l)); ba.type = "button";
    const bb = el("button", null, esc(d.b.l)); bb.type = "button";
    ba.onclick = () => pick("a");
    bb.onclick = () => pick("b");
    row.appendChild(ba); row.appendChild(bb);
    card.appendChild(row);
  } else {
    const mine = d[state.picked];
    const verdict = el("div", "verdict", esc(t.youChose) + " « " + esc(mine.l) + " »");
    card.appendChild(verdict);

    const cols = el("div", "argCols");
    const forBox = el("div", "argBox argFor");
    forBox.appendChild(el("h3", null, esc(t.forYour)));
    const ulF = document.createElement("ul");
    mine.p.forEach(a => ulF.appendChild(el("li", null, esc(a))));
    forBox.appendChild(ulF);

    const againstBox = el("div", "argBox argAgainst");
    againstBox.appendChild(el("h3", null, esc(t.otherSide)));
    const ulA = document.createElement("ul");
    mine.c.forEach(a => ulA.appendChild(el("li", null, esc(a))));
    againstBox.appendChild(ulA);

    cols.appendChild(forBox); cols.appendChild(againstBox);
    card.appendChild(cols);

    card.appendChild(el("div", "noAnswer", esc(t.noAnswer) + " " + esc(t.questionLine) + " : « " + esc(d.q) + " »"));

    const nextRow = el("div", "nextRow");
    const nb = el("button", null, esc(state.pos + 1 >= total ? t.seeSummary : t.nextBtn));
    nb.type = "button";
    nb.onclick = nextCard;
    nextRow.appendChild(nb);
    card.appendChild(nextRow);
  }
  st.appendChild(card);
}

function pick(choice) {
  if (state.picked) return;
  state.picked = choice;
  state.log.push({ idx: state.order[state.pos], choice: choice });
  render();
}

function nextCard() {
  state.pos++;
  state.picked = null;
  render();
}

/* ---------- Résumé ---------- */
function summaryText() {
  const t = T();
  const lines = [];
  lines.push(t.sumHeader);
  lines.push("".padEnd(t.sumHeader.length, "="));
  lines.push("");
  state.log.forEach((e, i) => {
    const d = DILEMMAS[e.idx][lang];
    const mine = d[e.choice];
    lines.push((i + 1) + ". " + d.t);
    lines.push("   " + t.sumChoice + " : " + mine.l);
    lines.push("   " + t.sumFor + " : " + mine.p.join(" / "));
    lines.push("   " + t.sumAgainst + " : " + mine.c.join(" / "));
    lines.push("   " + t.questionLine + " : " + d.q);
    lines.push("");
  });
  return lines.join("\n");
}

function renderSummary(st) {
  const t = T();
  const panel = el("div", "sumPanel");
  panel.appendChild(el("h2", null, esc(t.endTitle)));
  panel.appendChild(el("div", "sumIntro", esc(t.endIntro)));

  state.log.forEach(e => {
    const d = DILEMMAS[e.idx][lang];
    const mine = d[e.choice];
    const item = el("div", "sumItem");
    item.appendChild(el("div", "t", esc(d.t)));
    item.appendChild(el("div", "c", esc(t.yourChoice) + " : <b>" + esc(mine.l) + "</b>"));
    item.appendChild(el("div", "a", esc(t.sumFor) + " — " + esc(mine.p.join(" · "))));
    item.appendChild(el("div", "a", esc(t.sumAgainst) + " — " + esc(mine.c.join(" · "))));
    panel.appendChild(item);
  });

  const actions = el("div", "sumActions");
  const cb = el("button", "accentBtn", esc(t.copyBtn)); cb.type = "button";
  cb.onclick = copySummary;
  const db = el("button", null, esc(t.dlBtn)); db.type = "button";
  db.onclick = downloadSummary;
  const rb = el("button", null, esc(t.againBtn)); rb.type = "button";
  rb.onclick = newGame;
  actions.appendChild(cb); actions.appendChild(db); actions.appendChild(rb);
  panel.appendChild(actions);

  panel.appendChild(el("div", "copyMsg", "", ""));
  panel.appendChild(el("textarea", "sumText", esc(summaryText())));
  const ta = panel.lastChild;
  ta.readOnly = true;
  ta.setAttribute("aria-label", t.sumHeader);

  st.appendChild(panel);
}

function copySummary() {
  const t = T();
  const msg = document.querySelector(".copyMsg");
  const done = ok => {
    if (msg) msg.textContent = ok ? t.copied : t.copyFail;
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(summaryText()).then(() => done(true), () => manualCopy(done));
  } else {
    manualCopy(done);
  }
}

function manualCopy(done) {
  const ta = document.querySelector(".sumText");
  if (!ta) { done(false); return; }
  ta.removeAttribute("readonly");
  ta.select();
  ta.setSelectionRange(0, ta.value.length);
  let ok = false;
  try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
  ta.setAttribute("readonly", "readonly");
  window.getSelection().removeAllRanges();
  done(ok);
}

function downloadSummary() {
  const blob = new Blob([summaryText()], { type: "text/plain;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = lang === "fr" ? "dilemmes_du_numerique_resume.txt" : "digital_dilemmas_summary.txt";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

/* ================================================================
   LANGUE + PLEIN ÉCRAN (gabarit)
   ================================================================ */
let lang = (function () {
  try {
    var c = document.cookie.match(/(?:^|;\s*)fj-lang=([a-z]{2})/);
    if (c && (c[1] === "fr" || c[1] === "en")) return c[1];
  } catch (e) {}
  try {
    var s = localStorage.getItem("fj-lang");
    if (s === "fr" || s === "en") return s;
  } catch (e) {}
  return "fr";
})();
const T = () => I18N[lang];

function applyLang() {
  document.documentElement.lang = lang;
  $("kicker").textContent = T().kicker;
  $("title").textContent = T().title;
  $("instruction").textContent = T().instruction;
  $("langBtn").textContent = lang === "fr" ? "English" : "Français";
  $("fsLabel").textContent = isFs() ? T().fsExit : T().fs;
  $("backLink").textContent = T().backList;
  document.title = T().title + " · Gymnase — Frédéric Jaccard";
  render(); // contenu dynamique régénéré
}
$("langBtn").onclick = () => {
  lang = lang === "fr" ? "en" : "fr";
  try {
    localStorage.setItem("fj-lang", lang);
    document.cookie = "fj-lang=" + lang + ";domain=.fredericjaccard.com;path=/;max-age=31536000;SameSite=Lax";
  } catch (e) {}
  applyLang();
};

function isFs() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }
$("fsBtn").onclick = () => {
  const eldoc = document.documentElement;
  if (isFs()) {
    (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  } else {
    const req = eldoc.requestFullscreen || eldoc.webkitRequestFullscreen;
    if (req) { const r = req.call(eldoc); if (r && r.catch) r.catch(() => {}); }
  }
};
function syncFsLabel() { $("fsLabel").textContent = isFs() ? T().fsExit : T().fs; }
document.addEventListener("fullscreenchange", syncFsLabel);
document.addEventListener("webkitfullscreenchange", syncFsLabel);

applyLang();
newGame();
</script>

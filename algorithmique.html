<!DOCTYPE html><html lang="fr"><head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Algorithmique — Applications d'informatique</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2320241F'/%3E%3Ctext x='32' y='43' font-family='Arial,sans-serif' font-size='28' font-weight='bold' fill='%23FFFFFF' text-anchor='middle'%3EFJ%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quattrocento+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBFAF6; --card:#F7F6F2; --primary:#155E4C; --primaryLight:#E3F0EA;
  --accent:#D96A08; --accentLight:#FDEBD8; --line:#D8D5CB; --ink:#20241F; --muted:#6E726B;
}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);margin:0;padding:32px 16px;min-height:100vh;
  font-family:'Quattrocento Sans','Segoe UI',system-ui,sans-serif;color:var(--ink)}
button{font:inherit;cursor:pointer}
.app{max-width:860px;margin:0 auto}
.topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.kicker{color:var(--accent);font-weight:700;letter-spacing:.14em;font-size:12px;text-transform:uppercase;margin-bottom:4px}
h1{font-size:24px;font-weight:700}
.btns{display:flex;gap:8px;flex-shrink:0;padding-top:2px}
.iconBtn{min-width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card);
  color:var(--primary);font-weight:700;font-size:13px;display:inline-flex;align-items:center;justify-content:center;padding:0 10px}
.iconBtn:hover{border-color:var(--primary)}
.sub{font-size:15px;color:var(--muted);margin:6px 0 24px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.cardApp{display:block;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);
  border-radius:14px;padding:20px;transition:border-color .15s,transform .15s}
.cardApp:hover{border-color:var(--primary);transform:translateY(-2px)}
.cardApp .em{font-size:34px;line-height:1;margin-bottom:12px}
.cardApp h2{font-size:17px;font-weight:700;margin-bottom:6px}
.cardApp p{font-size:13.5px;line-height:1.5;color:var(--muted)}
.cardApp .count{display:inline-block;margin-top:10px;font-size:12px;font-weight:700;color:var(--primary);
  background:var(--primaryLight);border-radius:8px;padding:3px 9px}
footer{margin-top:32px;text-align:center;font-size:13px;color:var(--muted)}
footer a{color:inherit;text-decoration:none}
footer a:hover{text-decoration:underline}
@media(max-width:640px){
  body{padding:20px 12px}
  h1{font-size:19px}
  .grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="app">
<div class="topbar">
  <div>
    <div class="kicker" id="kicker">INFORMATIQUE · GYMNASE</div>
    <h1 id="title"></h1>
  </div>
  <div class="btns">
    <button class="iconBtn" id="langBtn" title="English">EN</button>
    <button class="iconBtn" id="fsBtn" title="Plein écran">⛶</button>
  </div>
</div>
<div class="sub" id="sub"></div>
<div id="content"></div>
<footer><a href="index.html" id="backCats"></a> · <a href="https://fredericjaccard.com">Frédéric Jaccard</a></footer>
</div>

<script>
let lang=(function(){try{var c=document.cookie.match(/(?:^|;\s*)fj-lang=([a-z]{2})/);if(c&&(c[1]==="fr"||c[1]==="en"))return c[1];}catch(e){}try{var s=localStorage.getItem("fj-lang");return(s==="fr"||s==="en")?s:"fr";}catch(e){return"fr";}})();
const I18N={
 fr:{
  kicker:"INFORMATIQUE · GYMNASE",
  title:"Algorithmique",
  sub:"Des premiers algorithmes aux tris et à la complexité : programmez, comparez et simulez.",
  backCats:"← Toutes les catégories",
  apps:[
   {file:"machine_a_instructions.html",em:"🤖",title:"Machine à instructions",
    desc:"Programmez un robot case par case : la machine fait exactement ce que vous demandez, pas ce que vous pensez !"},
   {file:"cuisine_litterale.html",em:"🍳",title:"Cuisine littérale",
    desc:"Remettez les étapes d'une recette dans le bon ordre : tartine, œuf à la coque, pâtes et fondue au fromage."},
   {file:"course_des_tris.html",em:"🏁",title:"Course des tris",
    desc:"Cinq algorithmes de tri s'affrontent en direct sur la même liste. Qui gagnera : bulles, sélection, insertion, fusion ou rapide ?"},
   {file:"rendu_de_monnaie.html",em:"🪙",title:"Le rendu de monnaie",
    desc:"Rendez la monnaie avec le moins de pièces possible : le glouton gagne avec les francs suisses… mais se trompe dans d'autres systèmes !"},
   {file:"sac_a_dos.html",em:"🎒",title:"Sac à dos glouton",
    desc:"Remplissez votre sac à dos avec la meilleure valeur possible… et découvrez quand la stratégie gloutonne se trompe."},
   {file:"revision_algorithmique.html",em:"📝",title:"Révision — Algorithmique II",
    desc:"Questions générées à l'infini sur les 7 leçons : algorithmes, tris, complexité, recherche et algorithmes gloutons."},
   {file:"jeu_de_la_vie.html",em:"🧬",title:"Le jeu de la vie",
    desc:"Simulateur interactif du jeu de la vie de Conway : motifs célèbres, comptage des voisins et règles personnalisables."},
   {file:"dijkstra.html",em:"🗺️",title:"Dijkstra : trouver le plus court chemin",
    desc:"Suivez deux démonstrations de l'algorithme de Dijkstra et entraînez-vous à trouver le plus court chemin dans cinq exercices progressifs."}
  ],
  fsTitle:"Plein écran",langBtn:"EN"
 },
 en:{
  kicker:"COMPUTER SCIENCE · HIGH SCHOOL",
  title:"Algorithmics",
  sub:"From first algorithms to sorting and complexity: program, compare and simulate.",
  backCats:"← All categories",
  apps:[
   {file:"machine_a_instructions.html",em:"🤖",title:"Instruction machine",
    desc:"Program a robot cell by cell: the machine does exactly what you ask, not what you think!"},
   {file:"cuisine_litterale.html",em:"🍳",title:"Literal cooking",
    desc:"Put the steps of a recipe back in the right order: toast, boiled egg, pasta and cheese fondue."},
   {file:"course_des_tris.html",em:"🏁",title:"Sorting race",
    desc:"Five sorting algorithms compete live on the same list. Who wins: bubble, selection, insertion, merge or quicksort?"},
   {file:"rendu_de_monnaie.html",em:"🪙",title:"Making change",
    desc:"Give change with as few coins as possible: greedy wins with Swiss francs… but fails in other coin systems!"},
   {file:"sac_a_dos.html",em:"🎒",title:"Greedy knapsack",
    desc:"Fill your knapsack with the best possible value… and discover when the greedy strategy gets it wrong."},
   {file:"revision_algorithmique.html",em:"📝",title:"Revision — Algorithmics II",
    desc:"Infinitely generated questions on the 7 lessons: algorithms, sorts, complexity, search and greedy algorithms."},
   {file:"jeu_de_la_vie.html",em:"🧬",title:"The Game of Life",
    desc:"Interactive simulator of Conway's Game of Life: famous patterns, neighbour counting and customisable rules."},
   {file:"dijkstra.html",em:"🗺️",title:"Dijkstra: finding the shortest path",
    desc:"Follow two demonstrations of Dijkstra's algorithm and practise finding shortest paths in five exercises."}
  ],
  fsTitle:"Fullscreen",langBtn:"FR"
 }
};
const T=()=>I18N[lang];

function applyLang(){
  try{localStorage.setItem("fj-lang",lang);document.cookie="fj-lang="+lang+";domain=.fredericjaccard.com;path=/;max-age=31536000;SameSite=Lax";}catch(e){}
  const t=T();
  document.documentElement.lang=lang;
  document.getElementById("kicker").textContent=t.kicker;
  document.getElementById("title").textContent=t.title;
  document.getElementById("sub").textContent=t.sub;
  document.getElementById("langBtn").textContent=t.langBtn;
  document.getElementById("fsBtn").title=t.fsTitle;
  document.title=t.title;
  document.getElementById("backCats").textContent=t.backCats;
  const box=document.getElementById("content");
  box.innerHTML="";
  const g=document.createElement("div");g.className="grid";
  t.apps.forEach(a=>{
    const c=document.createElement("a");
    c.className="cardApp";c.href=a.file;
    c.innerHTML=`<div class="em">${a.em}</div><h2>${a.title}</h2><p>${a.desc}</p>`;
    g.appendChild(c);
  });
  box.appendChild(g);
}
document.getElementById("langBtn").onclick=()=>{lang=lang==="fr"?"en":"fr";applyLang();};

const fsBtn=document.getElementById("fsBtn");
function isFs(){return document.fullscreenElement||document.webkitFullscreenElement;}
fsBtn.onclick=()=>{
  const el=document.documentElement;
  if(isFs()){(document.exitFullscreen||document.webkitExitFullscreen).call(document);}
  else{const req=el.requestFullscreen||el.webkitRequestFullscreen;if(req)req.call(el);}
};
function fsChange(){fsBtn.style.background=isFs()?"var(--primaryLight)":"var(--card)";}
document.addEventListener("fullscreenchange",fsChange);
document.addEventListener("webkitfullscreenchange",fsChange);

applyLang();
</script>
</body></html>

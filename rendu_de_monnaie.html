<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Le rendu de monnaie — Algorithmique</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2320241F'/%3E%3Ctext x='32' y='43' font-family='Arial,sans-serif' font-size='28' font-weight='bold' fill='%23FFFFFF' text-anchor='middle'%3EFJ%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Quattrocento+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBFAF6; --card:#F7F6F2; --primary:#155E4C; --primaryLight:#E3F0EA;
  --accent:#D96A08; --accentLight:#FDEBD8; --line:#D8D5CB; --ink:#20241F; --muted:#6E726B;
  --error:#C84B31;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:"Quattrocento Sans",sans-serif;padding:20px;max-width:1100px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px;margin-bottom:16px}
.kicker{font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
h1{font-size:26px;color:var(--primary)}
.hdrBtns{display:flex;gap:8px}
button{font-family:inherit;font-size:14px;font-weight:700;padding:8px 16px;border-radius:10px;
  border:2px solid var(--primary);background:var(--card);color:var(--primary);cursor:pointer}
button:hover{background:var(--primaryLight)}
.instruction{background:var(--primaryLight);border-radius:12px;padding:12px 16px;margin-bottom:16px;font-size:15px}
.levelRow{display:flex;gap:6px;flex-wrap:wrap;align-items:center;justify-content:center;margin-bottom:14px}
.levelRow label{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.lvlBtn{width:36px;height:36px;padding:0;border-radius:50%;position:relative}
.lvlBtn.active{background:var(--accentLight);border-color:var(--accent);color:var(--accent)}
.lvlBtn.locked{opacity:.35;cursor:not-allowed}
.lvlBtn.solved::after{content:"★";font-size:11px;position:absolute;top:-16px;left:50%;transform:translateX(-50%);color:var(--accent)}
.nextBtn{display:none;background:var(--accent);border-color:var(--accent);color:#fff;margin:0 auto 14px}
.nextBtn.show{display:inline-block}
.nextBtn:hover{background:#b85806}
.workzone{display:grid;grid-template-columns:1fr 380px;gap:18px;align-items:start}
@media(max-width:860px){.workzone{grid-template-columns:1fr}}
/* pièces */
.coins{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:16px}
.coins h2{font-size:15px;color:var(--primary);text-transform:uppercase;letter-spacing:.1em;margin-bottom:12px}
.coinGrid{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;padding:8px 0}
.coin{border:none;cursor:pointer;transition:transform .1s;border-radius:50%;padding:0;
  display:flex;flex-direction:column;align-items:center;gap:4px;background:transparent;border:2px solid transparent}
.coin:hover{transform:translateY(-2px)}
.coin .disc{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;
  border:3px solid var(--line);background:#fff;color:var(--ink)}
.coin.gold .disc{border-color:#c9a227;background:#fdf3d7}
.coin.silver .disc{border-color:#a8a9ad;background:#f0f0f2}
.coin .cnt{font-size:12px;color:var(--muted);font-weight:700}
/* monnaie rendue */
.purse{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.purse h2{font-size:15px;color:var(--primary);text-transform:uppercase;letter-spacing:.1em}
.target{font-size:15px;color:var(--muted)}
.target b{color:var(--ink);font-size:17px}
.bagBar{height:26px;background:#fff;border:2px solid var(--line);border-radius:13px;overflow:hidden;position:relative}
.bagFill{height:100%;background:var(--primary);transition:width .25s;border-radius:11px}
.bagFill.over{background:var(--error)}
.bagTxt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
.bagList{min-height:52px;display:flex;flex-wrap:wrap;gap:6px}
.bagChip{background:var(--primaryLight);border:1.5px solid var(--primary);border-radius:8px;padding:5px 9px;font-size:13px;cursor:pointer;color:var(--primary)}
.bagEmpty{font-size:13px;color:var(--muted)}
.valueRow{font-size:16px;font-weight:700;color:var(--primary)}
.goBtn{background:var(--primary);color:#fff;font-size:16px;padding:10px 0}
.goBtn:hover{background:#0e4a3b}
.greedyBtn{font-size:13px}
.msg{border-radius:10px;padding:10px 14px;font-size:14px;font-weight:700;display:none;line-height:1.5}
.msg.show{display:block}
.msg.ok{background:var(--primaryLight);color:var(--primary);border:2px solid var(--primary)}
.msg.err{background:var(--accentLight);color:var(--error);border:2px solid var(--error)}
.msg.info{background:#fff;color:var(--ink);border:2px solid var(--line)}
.msg.ok.big{font-size:18px;text-align:center;padding:18px;animation:pop .4s}
.msg.ok.big .bigTitle{font-size:22px;display:block;margin-bottom:4px}
@keyframes pop{0%{transform:scale(.85);opacity:0}100%{transform:scale(1);opacity:1}}
.purse.solved{border-color:var(--primary);background:var(--primaryLight)}
.hint{font-size:13px;color:var(--muted);line-height:1.45}
footer{margin-top:20px;text-align:center;color:var(--muted);font-size:13px}
footer a{color:inherit;text-decoration:none}
footer a:hover{text-decoration:underline}
</style>
</head>
<body>
<header>
  <div>
    <div class="kicker" id="kicker"></div>
    <h1 id="title"></h1>
  </div>
  <div class="hdrBtns">
    <button id="langBtn">English</button>
    <button id="fsBtn"><span id="fsLabel"></span></button>
  </div>
</header>
<div class="instruction" id="instruction"></div>

<div class="levelRow" id="levelRow"><label id="levelLabel"></label></div>
<div style="text-align:center"><button class="nextBtn" id="nextBtn"></button></div>

<div class="workzone">
  <div class="coins">
    <h2 id="coinsTitle"></h2>
    <div class="coinGrid" id="coinGrid"></div>
  </div>
  <div class="purse">
    <h2 id="purseTitle"></h2>
    <div class="target" id="targetRow"></div>
    <div class="bagBar"><div class="bagFill" id="bagFill"></div><div class="bagTxt" id="bagTxt"></div></div>
    <div class="bagList" id="bagList"></div>
    <div class="valueRow" id="valueRow"></div>
    <button class="goBtn" id="evalBtn"></button>
    <button class="greedyBtn" id="greedyBtn"></button>
    <div class="msg" id="msg"></div>
    <p class="hint" id="hint"></p>
  </div>
</div>

<footer><a href="index.html" id="backLink"></a> · <a href="https://fredericjaccard.com">Frédéric Jaccard</a></footer>

<script>
const $ = id => document.getElementById(id);

/* ---------- niveaux (vérifiés par calcul : DP pour l'optimal) ---------- */
/* suisses : cible en centimes ; le glouton y est optimal.
   pièges : systèmes imaginaires où le glouton échoue. */
const LEVELS = [
  { coins:[5,10,20,50,100,200,500], target:95,  chf:true },   // glouton 4 = optimal 4
  { coins:[1,3,4],                  target:6,   chf:false },  // glouton 3, optimal 2 (3+3)
  { coins:[1,10,25],                target:30,  chf:false },  // glouton 6, optimal 3 (10+10+10)
  { coins:[1,5,7],                  target:10,  chf:false },  // glouton 4, optimal 2 (5+5)
  { coins:[5,10,20,50,100,200,500], target:385, chf:true }    // glouton 6 = optimal 6
];

const I18N = {
  fr:{
  backList:"← Toutes les applications",
    kicker:"Algorithmique",
    title:"Le rendu de monnaie",
    fs:"Plein écran", fsExit:"Quitter",
    instruction:"Vous êtes caissier·ère : rendez la monnaie avec <b>le moins de pièces possible</b>. Cliquez sur les pièces pour les ajouter. Vous pouvez voir ce que ferait la stratégie gloutonne (toujours la plus grande pièce possible)… mais est-ce toujours la meilleure idée ?",
    level:"Défi",
    next:"Défi suivant →",
    locked:"Réussissez d'abord les défis précédents !",
    coinsTitle:"Les pièces disponibles",
    purseTitle:"Votre monnaie",
    target:"Montant à rendre",
    purseEmpty:"Cliquez sur des pièces pour les ajouter…",
    count:n=>`${n} pièce${n>1?"s":""}`,
    eval:"Évaluer mon rendu",
    greedy:"🤖 Voir la stratégie gloutonne",
    hint:"Cliquez sur une pièce de votre monnaie pour la retirer. Le glouton prend toujours la plus grande pièce qui ne dépasse pas le reste à rendre.",
    over:"Vous avez dépassé le montant à rendre !",
    notExact:(s,t)=>`Vous avez rendu ${s} au lieu de ${t} — le montant doit être exact.`,
    empty:"Vous n'avez encore pris aucune pièce.",
    win:(n,last)=> last
      ? "Bravo ! Vous avez réussi tous les défis — et vous avez vu que le glouton ne gagne pas à tous les coups !"
      : `Parfait ! ${n} pièces — c'est le minimum possible. Vous avez trouvé la solution optimale !`,
    fail:(n,best,g,gv)=> g===null
      ? `${n} pièces — on peut faire mieux : le minimum est ${best}. Ici, le glouton ne peut même pas atteindre le montant ! Cherchez la combinaison gagnante !`
      : `${n} pièces — on peut faire mieux : le minimum est ${best}. La stratégie gloutonne en utilise ${gv}. Cherchez la combinaison gagnante !`,
    greedyMsg:(list,n)=> n===null
      ? `Le glouton prend : ${list}… et il reste bloqué, il ne peut pas atteindre le montant exact !`
      : `Le glouton prend : ${list} → ${n} pièces. Est-ce le minimum possible ? À vous de vérifier !`,
    fr2:"fr"
  },
  en:{
  backList:"← All applications",
    kicker:"ALGORITHMS",
    title:"Making Change",
    fs:"Fullscreen", fsExit:"Exit",
    instruction:"You are the cashier: give change using <b>as few coins as possible</b>. Click the coins to add them. You can see what the greedy strategy would do (always the largest possible coin)… but is it always the best idea?",
    level:"Challenge",
    next:"Next challenge →",
    locked:"Complete the previous challenges first!",
    coinsTitle:"Available coins",
    purseTitle:"Your change",
    target:"Amount to give back",
    purseEmpty:"Click coins to add them…",
    count:n=>`${n} coin${n>1?"s":""}`,
    eval:"Evaluate my change",
    greedy:"🤖 See the greedy strategy",
    hint:"Click a coin in your change to remove it. The greedy algorithm always takes the largest coin that does not exceed the remaining amount.",
    over:"You went over the amount to give back!",
    notExact:(s,t)=>`You gave back ${s} instead of ${t} — the amount must be exact.`,
    empty:"You have not picked any coin yet.",
    win:(n,last)=> last
      ? "Well done! You completed all the challenges — and you saw that greedy does not win every time!"
      : `Perfect! ${n} coins — this is the minimum possible. You found the optimal solution!`,
    fail:(n,best,g,gv)=> g===null
      ? `${n} coins — you can do better: the minimum is ${best}. Here, greedy cannot even reach the amount! Find the winning combination!`
      : `${n} coins — you can do better: the minimum is ${best}. The greedy strategy uses ${gv}. Find the winning combination!`,
    greedyMsg:(list,n)=> n===null
      ? `Greedy takes: ${list}… and gets stuck, it cannot reach the exact amount!`
      : `Greedy takes: ${list} → ${n} coins. Is this the minimum possible? Check for yourself!`,
    fr2:"fr"
  }
};
let lang=(function(){try{var c=document.cookie.match(/(?:^|;\s*)fj-lang=([a-z]{2})/);if(c&&(c[1]==="fr"||c[1]==="en"))return c[1];}catch(e){}try{var s=localStorage.getItem("fj-lang");return(s==="fr"||s==="en")?s:"fr";}catch(e){return"fr";}})();
const T = () => I18N[lang];

/* ---------- état ---------- */
let levelIdx = 0, solved = new Set();
let purse = [];   // valeurs des pièces prises

/* ---------- calculs ---------- */
function cur(){ return LEVELS[levelIdx]; }
function purseSum(){ return purse.reduce((s,c)=>s+c,0); }
function greedyPick(){
  const t = cur().target; let rest = t; const out = [];
  for(const c of [...cur().coins].sort((a,b)=>b-a)){
    while(rest>=c){ rest-=c; out.push(c); }
  }
  return rest===0 ? out : null;
}
function optimalCount(){
  const t = cur().target, INF = 1e9;
  const dp = new Array(t+1).fill(INF); dp[0]=0;
  for(let s=1;s<=t;s++) for(const c of cur().coins) if(c<=s) dp[s]=Math.min(dp[s],dp[s-c]+1);
  return dp[t];
}

/* ---------- format ---------- */
function fmtV(v){   // valeur d'une pièce
  if(cur().chf){
    if(v>=100){
      const f = v/100;
      const fs = Number.isInteger(f) ? f.toString() : f.toFixed(2).replace(".", lang==="fr"?",":".");
      return fs + " fr";
    }
    return v + " ct";
  }
  return "" + v;
}
function fmtT(v){   // montant cible / total
  if(cur().chf){
    const fs = (v/100).toFixed(2).replace(".", lang==="fr"?",":".");
    return fs + " fr";
  }
  return "" + v;
}

/* ---------- rendu ---------- */
function renderLevelButtons(){
  const row = $("levelRow");
  row.querySelectorAll("button").forEach(b=>b.remove());
  const maxUnlocked = Math.max(0, ...[...solved].map(x=>x+1));
  LEVELS.forEach((_,i)=>{
    const b = document.createElement("button");
    const locked = i > maxUnlocked;
    b.className = "lvlBtn" + (i===levelIdx?" active":"") + (solved.has(i)?" solved":"") + (locked?" locked":"");
    b.textContent = i+1;
    b.onclick = ()=>{
      if(locked){ showMsg("err", T().locked); return; }
      levelIdx=i; purse=[]; buildLevel(); hideMsg(); updateNextBtn();
    };
    row.appendChild(b);
  });
}
function updateNextBtn(){
  $("nextBtn").classList.toggle("show", solved.has(levelIdx) && levelIdx < LEVELS.length-1);
}
$("nextBtn").onclick = ()=>{
  if(levelIdx < LEVELS.length-1){
    levelIdx++; purse=[]; buildLevel(); hideMsg();
    renderLevelButtons(); updateNextBtn();
  }
};

function coinSize(v){   // diamètre selon la valeur
  const cs = cur().coins, mn = Math.min(...cs), mx = Math.max(...cs);
  return 52 + Math.round(34 * (Math.log(v)-Math.log(mn)) / (Math.log(mx)-Math.log(mn) || 1));
}
function buildLevel(){
  const grid = $("coinGrid");
  grid.innerHTML = "";
  [...cur().coins].sort((a,b)=>b-a).forEach(v=>{
    const b = document.createElement("button");
    b.className = "coin " + (cur().chf && v>=100 ? "gold" : "silver");
    const n = purse.filter(x=>x===v).length;
    b.innerHTML = `<span class="disc" style="width:${coinSize(v)}px;height:${coinSize(v)}px;font-size:${coinSize(v)>70?17:14}px">${fmtV(v)}</span>
      <span class="cnt">${n>0 ? "× "+n : " "}</span>`;
    b.onclick = ()=>{
      purse.push(v); purse.sort((a,b)=>b-a);
      buildLevel(); hideMsg();
      if(purseSum() > cur().target) showMsg("err", T().over);
    };
    grid.appendChild(b);
  });
  // monnaie
  const s = purseSum();
  const fill = $("bagFill");
  fill.style.width = Math.min(100, 100*s/cur().target) + "%";
  fill.classList.toggle("over", s > cur().target);
  $("bagTxt").textContent = `${fmtT(s)} / ${fmtT(cur().target)}`;
  $("targetRow").innerHTML = `${T().target} : <b>${fmtT(cur().target)}</b>`;
  $("valueRow").textContent = purse.length>0 ? T().count(purse.length) : "";
  const bl = $("bagList");
  bl.innerHTML = "";
  if(purse.length===0){
    const sp=document.createElement("span"); sp.className="bagEmpty"; sp.textContent=T().purseEmpty; bl.appendChild(sp);
  }else{
    purse.forEach((v,idx)=>{
      const c = document.createElement("span");
      c.className="bagChip"; c.textContent=fmtV(v);
      c.onclick=()=>{ purse.splice(idx,1); buildLevel(); hideMsg(); };
      bl.appendChild(c);
    });
  }
}

/* ---------- messages ---------- */
function showMsg(kind,text){ const m=$("msg"); m.className="msg show "+kind; m.textContent=text; }
function hideMsg(){ $("msg").className="msg"; document.querySelector(".purse").classList.remove("solved"); }

/* ---------- évaluation ---------- */
$("evalBtn").onclick = ()=>{
  if(purse.length===0){ showMsg("err", T().empty); return; }
  const s = purseSum();
  if(s !== cur().target){ showMsg("err", T().notExact(fmtT(s), fmtT(cur().target))); return; }
  const best = optimalCount();
  const g = greedyPick();
  const n = purse.length;
  if(n === best){
    solved.add(levelIdx); renderLevelButtons(); updateNextBtn();
    const last = levelIdx===LEVELS.length-1;
    const m=$("msg");
    m.className="msg show ok big";
    m.innerHTML = `<span class="bigTitle">🎉 ${T().win(n, last)}</span>`;
    document.querySelector(".purse").classList.add("solved");
  }else{
    showMsg("err", T().fail(n, best, g===null?null:0, g===null?null:g.length));
  }
};
$("greedyBtn").onclick = ()=>{
  const g = greedyPick();
  if(g===null){
    purse = [...cur().coins].sort((a,b)=>b-a).reduce((acc,c)=>{ while(purseSumLocal(acc)+c<=cur().target) acc.push(c); return acc; },[]);
    function purseSumLocal(a){ return a.reduce((s,x)=>s+x,0); }
    buildLevel();
    showMsg("info", T().greedyMsg(greedyListText(purse), null));
    return;
  }
  purse = [...g];
  buildLevel();
  showMsg("info", T().greedyMsg(greedyListText(purse), purse.length));
};
function greedyListText(list){
  const counts = {};
  list.forEach(v=>counts[v]=(counts[v]||0)+1);
  return Object.keys(counts).sort((a,b)=>b-a).map(v=>`${counts[v]} × ${fmtV(+v)}`).join(", ");
}

/* ---------- i18n + fullscreen ---------- */
function applyLang(){try{localStorage.setItem("fj-lang",lang);document.cookie="fj-lang="+lang+";domain=.fredericjaccard.com;path=/;max-age=31536000;SameSite=Lax";}catch(e){}
  document.getElementById("backLink").textContent=T().backList;
  document.documentElement.lang = lang;
  $("langBtn").textContent = lang==="fr" ? "English" : "Français";
  $("kicker").textContent = T().kicker;
  $("title").textContent = T().title;
  document.title = T().title + " — Algorithmique";
  $("fsLabel").textContent = isFs() ? T().fsExit : T().fs;
  $("instruction").innerHTML = T().instruction;
  $("levelLabel").textContent = T().level;
  $("nextBtn").textContent = T().next;
  $("coinsTitle").textContent = T().coinsTitle;
  $("purseTitle").textContent = T().purseTitle;
  $("evalBtn").textContent = T().eval;
  $("greedyBtn").textContent = T().greedy;
  $("hint").textContent = T().hint;
  buildLevel(); renderLevelButtons(); updateNextBtn();
}
$("langBtn").onclick = ()=>{ lang = lang==="fr" ? "en" : "fr"; applyLang(); };

function isFs(){ return !!(document.fullscreenElement || document.webkitFullscreenElement); }
$("fsBtn").onclick = ()=>{
  const el = document.documentElement;
  if(isFs()){ (document.exitFullscreen || document.webkitExitFullscreen).call(document); }
  else{
    const req = el.requestFullscreen || el.webkitRequestFullscreen;
    if(req){ const r = req.call(el); if(r && r.catch) r.catch(()=>{}); }
  }
};
function syncFsLabel(){ $("fsLabel").textContent = isFs() ? T().fsExit : T().fs; }
document.addEventListener("fullscreenchange", syncFsLabel);
document.addEventListener("webkitfullscreenchange", syncFsLabel);

applyLang();
buildLevel();
</script>
</body>
</html>

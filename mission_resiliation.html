<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Résiliez un abonnement piégé et apprenez à reconnaître les dark patterns : culpabilisation, fausse urgence, cases pré-cochées…">
<title>Mission : résiliation · Gymnase — Frédéric Jaccard</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2320241F'/%3E%3Ctext x='32' y='43' font-family='Arial,sans-serif' font-size='28' font-weight='bold' fill='%23FFFFFF' text-anchor='middle'%3EFJ%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Quattrocento+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBFAF6; --card:#F7F6F2; --primary:#155E4C; --primaryLight:#E3F0EA;
  --accent:#D96A08; --accentLight:#FDEBD8; --line:#D8D5CB; --ink:#20241F; --muted:#6E726B;
  --error:#C84B31;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:"Quattrocento Sans",sans-serif;padding:20px}
.wrap{max-width:760px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px;margin-bottom:16px}
.kicker{font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
h1{font-size:26px;color:var(--primary)}
.hdrBtns{display:flex;gap:8px}
button{font-family:inherit;font-size:14px;font-weight:700;padding:8px 16px;border-radius:10px;
  border:2px solid var(--primary);background:var(--card);color:var(--primary);cursor:pointer}
button:hover{background:var(--primaryLight)}
.instruction{background:var(--primaryLight);border-radius:12px;padding:12px 16px;margin-bottom:16px;font-size:15px;color:var(--primary)}
.progressRow{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.pbar{flex:1;height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.pfill{height:100%;background:var(--accent);width:0;transition:width .3s}
.pLabel{font-size:13px;font-weight:700;color:var(--muted);white-space:nowrap}
.trapCount{font-size:13px;font-weight:700;color:var(--error);white-space:nowrap;min-width:34px;text-align:right}

/* Fausse coquille de site */
.shell{background:var(--card);border:2px solid var(--line);border-radius:14px;overflow:hidden}
.shellBar{display:flex;align-items:center;gap:8px;background:var(--primaryLight);padding:9px 14px;border-bottom:2px solid var(--line)}
.dot{width:11px;height:11px;border-radius:50%;background:var(--line)}
.dot:first-child{background:var(--accent)}
.shellUrl{margin-left:8px;font-size:12.5px;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:3px 10px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stage{padding:22px}

/* Contenu de la fausse application */
.siteRow{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.logo{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:10px;background:var(--primary);color:#fff;font-weight:700;font-size:17px}
.siteName{font-size:22px;font-weight:700;color:var(--primary)}
.hello{font-size:15px;margin-bottom:14px}
.cards{display:grid;gap:10px;margin-bottom:18px}
.decoy{display:block;width:100%;text-align:left;background:var(--bg);border:2px solid var(--line);border-radius:12px;
  padding:14px 16px;font-size:15px;font-weight:700;color:var(--ink)}
.decoy:hover{border-color:var(--accent);background:var(--accentLight)}
.meta{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px;margin-bottom:6px}
.tinyRow{display:flex;justify-content:flex-start}
.tiny{background:none;border:none;color:var(--muted);font-size:12px;font-weight:400;text-decoration:underline;
  cursor:pointer;padding:9px 8px;border-radius:6px}
.tiny:hover{color:var(--ink);background:none}
.stageTitle{font-size:20px;font-weight:700;color:var(--primary);margin-bottom:10px}
.stageBody{font-size:15px;margin-bottom:16px;line-height:1.45}
.bigTrap{display:block;width:100%;background:var(--primary);border:2px solid var(--primary);color:#fff;
  font-size:17px;padding:15px 18px;border-radius:12px;margin-bottom:8px}
.bigTrap:hover{background:var(--primary);filter:brightness(1.08)}
.bigTrap.orange{background:var(--accent);border-color:var(--accent)}
.bigTrap.orange:hover{background:var(--accent);filter:brightness(1.06)}
.mainBtn{display:block;width:100%;background:var(--accent);border:2px solid var(--accent);color:#fff;
  font-size:16px;padding:14px 18px;border-radius:12px}
.mainBtn:hover{background:var(--accent);filter:brightness(1.06)}
.cbrow{display:flex;gap:12px;align-items:flex-start;background:var(--bg);border:2px solid var(--line);
  border-radius:12px;padding:13px 14px;margin-bottom:10px;cursor:pointer;font-size:15px;line-height:1.4}
.cbrow input{width:22px;height:22px;accent-color:var(--primary);flex-shrink:0;margin-top:1px;cursor:pointer}
.countdown{display:inline-block;background:var(--accent);color:#fff;font-weight:700;border-radius:10px;
  padding:5px 13px;font-size:17px;font-variant-numeric:tabular-nums;margin-left:6px}

/* Feedback */
.feedback{margin-top:14px;border-radius:12px;padding:12px 16px;font-size:15px;border:2px solid;line-height:1.45}
.feedback.ok{background:var(--primaryLight);border-color:var(--primary);color:var(--primary);font-weight:700}
.feedback.ko{background:var(--accentLight);border-color:var(--error);color:var(--ink)}

/* Écran de victoire */
.winTitle{font-size:24px;color:var(--primary);margin-bottom:8px}
.winScore{font-weight:700;color:var(--accent);margin:10px 0 20px}
.gloTitle{font-size:17px;color:var(--primary);margin-bottom:12px}
.gcard{border:2px solid var(--line);border-left:6px solid var(--primary);border-radius:12px;
  padding:13px 15px;background:var(--bg);margin-bottom:12px}
.gname{font-weight:700;color:var(--primary);font-size:16px;margin-bottom:4px}
.gen{color:var(--muted);font-size:13px;font-style:italic;font-weight:400}
.gseen{font-size:14px;margin-bottom:5px}
.gexp{font-size:14px;color:var(--ink);line-height:1.45}
.gbadge{display:inline-block;background:var(--accentLight);border:1px solid var(--error);color:var(--error);
  font-size:12px;font-weight:700;border-radius:8px;padding:2px 8px;margin-left:6px}

#fireworks{position:fixed;inset:0;pointer-events:none;z-index:50;display:none}

footer{margin-top:20px;text-align:center;font-size:13px;color:var(--muted)}
footer a{color:var(--muted);font-weight:400;text-decoration:none}
footer a:hover{text-decoration:underline}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
@media(max-width:640px){
  body{padding:14px}
  h1{font-size:22px}
  .hdrBtns{width:100%}
  .hdrBtns button{min-height:44px;flex:1}
  .stage{padding:16px}
  .decoy,.bigTrap,.mainBtn,.cbrow{min-height:44px}
  .siteName{font-size:19px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>
</head>

let lang=(function(){try{const c=document.cookie.match(/(?:^|;\s*)fj-lang=([a-z]{2})/);if(c&&(c[1]==="fr"||c[1]==="en"))return c[1];}catch(e){}try{const s=localStorage.getItem("fj-lang");return(s==="fr"||s==="en")?s:"fr";}catch(e){return"fr";}})();
const T = () => I18N[lang];

/* État du jeu */
let stage=1, traps=0, trapped={};
let s3offers=true, s3confirm=false;
let s5step=0;
let s4sec=299, s4timer=null;
const TECH_STAGE=[1,2,3,3,4,5]; /* glossaire -> étape où la technique apparaît */

function fmt(s){ const m=Math.floor(s/60), r=s%60; return m+":"+String(r).padStart(2,"0"); }
function stopTimer(){ if(s4timer){ clearInterval(s4timer); s4timer=null; } }
function startTimer(){
  stopTimer();
  s4timer=setInterval(()=>{
    s4sec--;
    if(s4sec<0) s4sec=299;             /* compte à rebours bidon : il repart */
    const el=document.getElementById("cd");
    if(el) el.textContent=fmt(s4sec); else stopTimer();
  },1000);
}

function showFeedback(msg, ok){
  const f=$("feedback");
  f.textContent=msg;
  f.className="feedback "+(ok?"ok":"ko");
  f.hidden=false;
}
function hideFeedback(){ $("feedback").hidden=true; }

function syncTrapCount(){ $("trapCount").textContent = traps>0 ? "💥 ×"+traps : ""; }

function trap(msg, st){
  traps++; trapped[st]=true; syncTrapCount();
  showFeedback(msg,false);
}
function pass(msg, next){
  showFeedback(msg,true);
  setTimeout(()=>{
    stage=next;
    hideFeedback();
    if(stage>5) win(); else render();
  },1700);
}

function render(){
  stopTimer();
  hideFeedback();
  syncTrapCount();
  const el=$("stage");
  $("progressLabel").textContent=T().stepLabel(stage,5);
  $("progressFill").style.width=((stage-1)/5*100)+"%";

  if(stage===1){
    $("shellUrl").textContent=T().url1;
    el.innerHTML=
      '<div class="siteRow"><span class="logo">S+</span><span class="siteName">Streamly+</span></div>'
      +'<p class="hello">'+T().s1hello+'</p>'
      +'<div class="cards">'+T().s1cards.map(c=>'<button class="decoy" type="button">'+c+'</button>').join("")+'</div>'
      +'<p class="meta">'+T().s1meta+'</p>'
      +'<div class="tinyRow"><button id="tiny1" class="tiny" type="button">'+T().s1tiny+'</button></div>';
    el.querySelectorAll(".decoy").forEach(b=>b.onclick=()=>trap(T().s1trap,1));
    $("tiny1").onclick=()=>pass(T().s1ok,2);
  }

  else if(stage===2){
    $("shellUrl").textContent=T().url2;
    el.innerHTML=
      '<div class="stageTitle">'+T().s2title+'</div>'
      +'<p class="stageBody">'+T().s2body+'</p>'
      +'<button id="s2big" class="bigTrap" type="button">'+T().s2big+'</button>'
      +'<div class="tinyRow"><button id="s2tiny" class="tiny" type="button">'+T().s2tiny+'</button></div>';
    $("s2big").onclick=()=>trap(T().s2trap,2);
    $("s2tiny").onclick=()=>pass(T().s2ok,3);
  }

  else if(stage===3){
    $("shellUrl").textContent=T().url3;
    el.innerHTML=
      '<div class="stageTitle">'+T().s3title+'</div>'
      +'<p class="stageBody">'+T().s3body+'</p>'
      +'<label class="cbrow"><input id="cb1" type="checkbox"><span>'+T().s3cb1+'</span></label>'
      +'<label class="cbrow"><input id="cb2" type="checkbox"><span>'+T().s3cb2+'</span></label>'
      +'<button id="s3btn" class="mainBtn" type="button" style="margin-top:6px">'+T().s3btn+'</button>';
    $("cb1").checked=s3offers;
    $("cb2").checked=s3confirm;
    $("s3btn").onclick=()=>{
      s3offers=$("cb1").checked; s3confirm=$("cb2").checked;
      if(s3offers){ trap(T().s3trap,3); }
      else if(!s3confirm){ showFeedback(T().s3err,false); }
      else pass(T().s3ok,4);
    };
  }

  else if(stage===4){
    $("shellUrl").textContent=T().url4;
    el.innerHTML=
      '<div class="stageTitle">'+T().s4title+'</div>'
      +'<p class="stageBody">'+T().s4timer+'<span id="cd" class="countdown">'+fmt(s4sec)+'</span></p>'
      +'<p class="stageBody">'+T().s4body+'</p>'
      +'<button id="s4big" class="bigTrap orange" type="button">'+T().s4big+'</button>'
      +'<div class="tinyRow"><button id="s4tiny" class="tiny" type="button">'+T().s4tiny+'</button></div>';
    $("s4big").onclick=()=>trap(T().s4trap,4);
    $("s4tiny").onclick=()=>pass(T().s4ok,5);
    startTimer();
  }

  else if(stage===5){
    $("shellUrl").textContent=T().url5;
    if(s5step===0){
      el.innerHTML=
        '<div class="stageTitle">'+T().s5aTitle+'</div>'
        +'<p class="stageBody">'+T().s5aBody+'</p>'
        +T().s5opts.map((o,i)=>'<label class="cbrow"><input type="radio" name="why"'+(i===0?' checked':'')+'><span>'+o+'</span></label>').join("")
        +'<button id="s5a" class="mainBtn" type="button" style="margin-top:6px">'+T().s5aBtn+'</button>';
      $("s5a").onclick=()=>{ s5step=1; render(); };
    } else if(s5step===1){
      el.innerHTML=
        '<div class="stageTitle">'+T().s5bTitle+'</div>'
        +'<p class="stageBody">'+T().s5bBody+'</p>'
        +'<button id="s5b" class="mainBtn" type="button">'+T().s5bBtn+'</button>';
      $("s5b").onclick=()=>{ s5step=2; render(); };
    } else {
      el.innerHTML=
        '<div class="stageTitle">'+T().s5cTitle+'</div>'
        +'<p class="stageBody">'+T().s5cBody+'</p>'
        +'<button id="s5c" class="mainBtn" type="button">'+T().s5cBtn+'</button>';
      $("s5c").onclick=()=>{ win(); };
    }
  }
}

function renderWin(){
  stopTimer();
  hideFeedback();
  syncTrapCount();
  $("shellUrl").textContent=T().urlWin;
  $("progressLabel").textContent="";
  $("progressFill").style.width="100%";
  const g=T().glossary;
  $("stage").innerHTML=
    '<div class="winTitle">'+T().winTitle+'</div>'
    +'<p class="stageBody">'+T().winBody+'</p>'
    +'<p class="winScore">'+(traps===0?T().winPerfect:T().winTraps(traps))+'</p>'
    +'<div class="gloTitle">'+T().gloTitle+'</div>'
    +g.map((t,i)=>
      '<div class="gcard">'
      +'<div class="gname">'+t.icon+' '+t.name+' <span class="gen">'+t.en+'</span></div>'
      +'<div class="gseen">'+t.seen+(trapped[TECH_STAGE[i]]?'<span class="gbadge">'+T().gloTrapBadge+'</span>':'')+'</div>'
      +'<div class="gexp">'+t.explain+'</div>'
      +'</div>').join("")
    +'<button id="replay" class="mainBtn" type="button" style="margin-top:8px">'+T().replay+'</button>';
  $("replay").onclick=reset;
}

function win(){
  renderWin();
  fireworks();
}

function reset(){
  stage=1; traps=0; trapped={};
  s3offers=true; s3confirm=false; s5step=0; s4sec=299;
  render();
}

/* Feux d'artifice de fin */
let fwRunning=false;
function fireworks(){
  if(window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv=$("fireworks"), ctx=cv.getContext("2d");
  cv.width=innerWidth; cv.height=innerHeight;
  cv.style.display="block";
  fwRunning=true;
  const COLORS=["#155E4C","#D96A08","#C84B31"];
  const rockets=[], sparks=[];
  const launch=()=>{
    rockets.push({
      x:cv.width*(0.15+Math.random()*0.7), y:cv.height,
      vx:(Math.random()-0.5)*2, vy:-(10+Math.random()*4),
      color:COLORS[Math.floor(Math.random()*COLORS.length)]
    });
  };
  const explode=r=>{
    for(let i=0;i<90;i++){
      const ang=Math.random()*Math.PI*2, sp=2+Math.random()*5;
      sparks.push({x:r.x,y:r.y,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,
                   life:60+Math.random()*40,color:r.color});
    }
  };
  let frame=0;
  const tick=()=>{
    ctx.clearRect(0,0,cv.width,cv.height);
    frame++;
    if(frame<260 && frame%16===0) launch();
    for(let i=rockets.length-1;i>=0;i--){
      const r=rockets[i];
      r.x+=r.vx; r.y+=r.vy; r.vy+=0.18;
      ctx.beginPath(); ctx.arc(r.x,r.y,3,0,Math.PI*2);
      ctx.fillStyle=r.color; ctx.fill();
      if(r.vy>=-1.5){ explode(r); rockets.splice(i,1); }
    }
    for(let i=sparks.length-1;i>=0;i--){
      const s=sparks[i];
      s.x+=s.vx; s.y+=s.vy; s.vy+=0.05; s.vx*=0.985; s.life--;
      ctx.globalAlpha=Math.max(0,s.life/80);
      ctx.beginPath(); ctx.arc(s.x,s.y,2.4,0,Math.PI*2);
      ctx.fillStyle=s.color; ctx.fill();
      if(s.life<=0) sparks.splice(i,1);
    }
    ctx.globalAlpha=1;
    if(frame<600 || rockets.length || sparks.length) requestAnimationFrame(tick);
    else { cv.style.display="none"; fwRunning=false; }
  };
  tick();
}

/* Langue */
function applyLang(){
  document.documentElement.lang=lang;
  $("kicker").textContent=T().kicker;
  $("title").textContent=T().title;
  $("instruction").textContent=T().instruction;
  $("langBtn").textContent=lang==="fr"?"English":"Français";
  syncFsLabel();
  $("backLink").textContent=T().backList;
  document.title=T().title+" · Gymnase — Frédéric Jaccard";
  if(stage>5) renderWin(); else render();
}
$("langBtn").onclick=()=>{
  lang=lang==="fr"?"en":"fr";
  try{localStorage.setItem("fj-lang",lang);document.cookie="fj-lang="+lang+";domain=.fredericjaccard.com;path=/;max-age=31536000;SameSite=Lax";}catch(e){}
  applyLang();
};

/* Plein écran (Safari inclus) */
function isFs(){ return !!(document.fullscreenElement || document.webkitFullscreenElement); }
$("fsBtn").onclick=()=>{
  const el=document.documentElement;
  if(isFs()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  else {
    const req=el.requestFullscreen || el.webkitRequestFullscreen;
    if(req){ const r=req.call(el); if(r && r.catch) r.catch(()=>{}); }
  }
};
function syncFsLabel(){ $("fsLabel").textContent=isFs()?T().fsExit:T().fs; }
document.addEventListener("fullscreenchange",syncFsLabel);
document.addEventListener("webkitfullscreenchange",syncFsLabel);

applyLang();
</script>

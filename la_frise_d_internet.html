<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Jeu de tri chronologique : replacez dix événements clés de l'histoire d'Internet, d'ARPANET au RGPD, et découvrez une anecdote à chaque bon placement.">
<title>La frise d'Internet · Gymnase — Frédéric Jaccard</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2320241F'/%3E%3Ctext x='32' y='43' font-family='Arial,sans-serif' font-size='28' font-weight='bold' fill='%23FFFFFF' text-anchor='middle'%3EFJ%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Quattrocento+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBFAF6; --card:#F7F6F2; --primary:#155E4C; --primaryLight:#E3F0EA;
  --accent:#D96A08; --accentLight:#FDEBD8; --line:#D8D5CB; --ink:#20241F; --muted:#6E726B;
  --error:#C84B31;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:"Quattrocento Sans",sans-serif;padding:20px;max-width:1000px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px;margin-bottom:16px}
.kicker{font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
h1{font-size:26px;color:var(--primary)}
.hdrBtns{display:flex;gap:8px}
button{font-family:inherit;font-size:14px;font-weight:700;padding:8px 16px;border-radius:10px;
  border:2px solid var(--primary);background:var(--card);color:var(--primary);cursor:pointer}
button:hover{background:var(--primaryLight)}
.instruction{background:var(--primaryLight);border-radius:12px;padding:12px 16px;margin-bottom:16px;font-size:15px}
footer{margin-top:20px;text-align:center;color:var(--muted);font-size:13px}
footer a{color:var(--muted);font-weight:400;text-decoration:none}
footer a:hover{text-decoration:underline}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}

.progress{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;
  margin-bottom:12px;font-size:14px;color:var(--muted)}
.progress b{color:var(--accent)}

/* La frise : ligne horizontale + événements placés */
.friseWrap{background:var(--card);border:2px solid var(--line);border-radius:12px;
  padding:14px 14px 18px;margin-bottom:16px;overflow-x:auto}
.friseLine{height:3px;background:var(--line);border-radius:2px;position:relative;margin:26px 8px 30px}
.frise{display:flex;gap:22px;min-height:96px;align-items:flex-start}
.friseEmpty{color:var(--muted);font-size:14px;font-style:italic;padding:8px 4px}
.fevent{position:relative;min-width:118px;max-width:140px;text-align:center;cursor:pointer;
  background:var(--bg);border:2px solid var(--primary);border-radius:10px;padding:10px 8px 8px;flex:none}
.fevent:hover{background:var(--primaryLight)}
.fevent .fy{display:inline-block;background:var(--accent);color:#fff;font-weight:700;font-size:13px;
  border-radius:8px;padding:2px 8px;margin-bottom:6px}
.fevent .fn{font-size:13.5px;font-weight:700;color:var(--primary);line-height:1.25}
.fevent::after{content:"";position:absolute;left:50%;top:-21px;width:3px;height:19px;background:var(--line);transform:translateX(-50%)}
.fevent::before{content:"";position:absolute;left:50%;top:-25px;width:9px;height:9px;border-radius:50%;
  background:var(--accent);transform:translateX(-50%)}
.fevent.last{box-shadow:0 0 0 3px var(--primaryLight)}

/* Panneau anecdote */
.anecdote{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:14px 16px;
  margin-bottom:16px;min-height:88px;font-size:15px;line-height:1.5}
.anecdote .aTitle{font-weight:700;color:var(--primary);margin-bottom:4px}
.anecdote.placeholder{color:var(--muted);font-style:italic;display:flex;align-items:center}
.anecdote.good{border-color:var(--primary);background:var(--primaryLight)}
.anecdote.bad{border-color:var(--error);background:var(--accentLight)}
.anecdote.bad .aTitle{color:var(--error)}
.anecdote.win{border-color:var(--primary);background:var(--primaryLight)}

/* Cartes à trier */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.ecard{min-height:56px;font-size:15px;border-radius:10px;border:2px solid var(--primary);
  background:var(--card);color:var(--ink);font-weight:700;padding:10px 12px;line-height:1.25}
.ecard:hover{background:var(--primaryLight)}
.ecard.wrong{border-color:var(--error);background:var(--accentLight);animation:shake .45s ease}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.actions{display:flex;justify-content:center;gap:10px}
#replayBtn{display:none;background:var(--accent);border-color:var(--accent);color:#fff}
#replayBtn:hover{background:var(--accent);opacity:.92}

#fireworks{position:fixed;inset:0;pointer-events:none;z-index:50;display:none}

@media(max-width:640px){
  body{padding:14px}
  h1{font-size:22px}
  .hdrBtns{width:100%}
  .hdrBtns button{min-height:44px}
  .ecard{min-height:52px}
  .fevent{min-width:104px;max-width:120px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header>
  <div>
    <div class="kicker" id="kicker"></div>
    <h1 id="title"></h1>
  </div>
  <div class="hdrBtns">
    <button id="langBtn" type="button">English</button>
    <button id="fsBtn" type="button"><span id="fsLabel"></span></button>
  </div>
</header>
<div class="instruction" id="instruction"></div>

<div class="progress"><span id="progLeft"></span><span id="progRight"></span></div>

<div class="friseWrap">
  <div class="frise" id="frise"></div>
  <div class="friseLine"></div>
</div>

<div class="anecdote placeholder" id="anecdote" aria-live="polite"></div>

<div class="cards" id="cards"></div>

<div class="actions">
  <button id="replayBtn" type="button"></button>
</div>

<canvas id="fireworks"></canvas>
<footer><a href="enjeux_sociaux.html" id="backLink"></a> · <a href="https://fredericjaccard.com">Frédéric Jaccard</a></footer>
<script>
const $ = id => document.getElementById(id);

/* Événements dans l'ordre chronologique strict (années distinctes) */
const EVENTS = [
  { year: 1969,
    fr: { name: "ARPANET",
          anecdote: "Le premier message envoyé sur ARPANET devait être « LOGIN », mais le réseau a planté après deux lettres : seul « LO » est arrivé à destination." },
    en: { name: "ARPANET",
          anecdote: "The first message ever sent over ARPANET was meant to be “LOGIN”, but the network crashed after two letters: only “LO” made it through." } },
  { year: 1971,
    fr: { name: "Le premier e-mail",
          anecdote: "Ray Tomlinson envoie le premier e-mail de l'histoire et choisit le signe @ pour séparer le nom de l'utilisateur de celui de la machine — un symbole alors presque inutilisé." },
    en: { name: "The first e-mail",
          anecdote: "Ray Tomlinson sends the first e-mail in history and picks the @ sign to separate the user's name from the machine's — a symbol almost never used at the time." } },
  { year: 1983,
    fr: { name: "Naissance d'Internet",
          anecdote: "Le 1er janvier 1983, toutes les machines d'ARPANET passent au protocole TCP/IP. C'est ce jour-là que l'on considère généralement comme la naissance d'Internet." },
    en: { name: "The birth of the Internet",
          anecdote: "On 1 January 1983, every ARPANET machine switched to the TCP/IP protocol. That day is generally considered the birthday of the Internet." } },
  { year: 1989,
    fr: { name: "Le Web",
          anecdote: "Tim Berners-Lee imagine le Web au CERN, près de Genève, pour aider les physiciens à partager leurs documents. Sur sa proposition, son patron note simplement : « vague, mais excitant »." },
    en: { name: "The Web",
          anecdote: "Tim Berners-Lee invents the Web at CERN, near Geneva, to help physicists share their documents. On his proposal, his boss simply wrote: “vague, but exciting”." } },
  { year: 1998,
    fr: { name: "Google",
          anecdote: "Google naît dans un garage loué à Menlo Park. Son nom vient de « googol », le nombre 1 suivi de 100 zéros — écrit avec une faute d'orthographe." },
    en: { name: "Google",
          anecdote: "Google was born in a rented garage in Menlo Park. Its name comes from “googol”, the number 1 followed by 100 zeros — spelled with a mistake." } },
  { year: 2001,
    fr: { name: "Wikipédia",
          anecdote: "Wikipédia ne devait être qu'un projet annexe de Nupedia, une encyclopédie écrite par des experts. Un an après son lancement, elle compte déjà 20 000 articles." },
    en: { name: "Wikipedia",
          anecdote: "Wikipedia was only meant to be a side project of Nupedia, an encyclopedia written by experts. One year after launch, it already had 20,000 articles." } },
  { year: 2004,
    fr: { name: "Facebook",
          anecdote: "Facebook est d'abord réservé aux étudiants de Harvard : il faut une adresse e-mail de l'université pour s'inscrire. Le grand public n'y a accès qu'en 2006." },
    en: { name: "Facebook",
          anecdote: "Facebook was first reserved for Harvard students: a university e-mail address was required to sign up. The general public only gained access in 2006." } },
  { year: 2007,
    fr: { name: "Le smartphone",
          anecdote: "En présentant le premier iPhone, Steve Jobs annonce trois appareils — « un iPod, un téléphone et un communicateur Internet » — avant de révéler qu'il s'agit d'un seul et même objet." },
    en: { name: "The smartphone",
          anecdote: "Introducing the first iPhone, Steve Jobs announced three devices — “an iPod, a phone, and an Internet communicator” — before revealing they were one and the same." } },
  { year: 2018,
    fr: { name: "Le RGPD",
          anecdote: "Le RGPD s'applique à toute organisation qui traite des données de résidents européens, même hors d'Europe. Les amendes peuvent atteindre 4 % du chiffre d'affaires mondial." },
    en: { name: "The GDPR",
          anecdote: "The GDPR applies to any organisation processing data of European residents, even outside Europe. Fines can reach 4% of worldwide turnover." } },
  { year: 2022,
    fr: { name: "ChatGPT",
          anecdote: "ChatGPT atteint 100 millions d'utilisateurs en deux mois à peine — une croissance bien plus rapide que celle de TikTok ou d'Instagram à leur lancement." },
    en: { name: "ChatGPT",
          anecdote: "ChatGPT reached 100 million users in just two months — growing far faster than TikTok or Instagram did after their launch." } }
];

const I18N = {
  fr: {
    kicker: "ENJEUX SOCIAUX",
    title: "La frise d'Internet",
    instruction: "Cliquez sur les cartes de la plus ancienne à la plus récente pour reconstituer la frise. Chaque bon placement révèle son année et une anecdote.",
    fs: "Plein écran", fsExit: "Quitter",
    backList: "← Toutes les applications",
    progress: (n, total) => `${n} / ${total} événements placés`,
    errors: (e) => e === 0 ? "aucune erreur" : (e === 1 ? "1 erreur" : `${e} erreurs`),
    friseEmpty: "La frise est vide : placez le premier événement !",
    placeholder: "L'anecdote du prochain événement bien placé apparaîtra ici.",
    errorTitle: "Pas encore !",
    errorMsg: "Cet événement est arrivé plus tard : il reste au moins un événement plus ancien à placer. Cherchez dans le passé !",
    winTitle: "Frise complète !",
    win: (e) => e === 0
      ? "Parcours parfait, sans aucune erreur : vous connaissez votre histoire d'Internet !"
      : `Bravo, la frise est reconstituée avec ${e === 1 ? "une seule erreur" : e + " erreurs"}. Relisez les anecdotes pour bien mémoriser les dates !`,
    replay: "Rejouer"
  },
  en: {
    kicker: "SOCIAL ISSUES",
    title: "The Internet timeline",
    instruction: "Click the cards from the oldest to the most recent event to rebuild the timeline. Each correct placement reveals its year and an anecdote.",
    fs: "Fullscreen", fsExit: "Exit",
    backList: "← All applications",
    progress: (n, total) => `${n} / ${total} events placed`,
    errors: (e) => e === 0 ? "no mistakes" : (e === 1 ? "1 mistake" : `${e} mistakes`),
    friseEmpty: "The timeline is empty: place the first event!",
    placeholder: "The anecdote of the next correctly placed event will appear here.",
    errorTitle: "Not yet!",
    errorMsg: "This event happened later: at least one older event is still waiting to be placed. Look further back in time!",
    winTitle: "Timeline complete!",
    win: (e) => e === 0
      ? "A flawless run, without a single mistake: you really know your Internet history!"
      : `Well done — the timeline is complete with ${e === 1 ? "only one mistake" : e + " mistakes"}. Read the anecdotes again to memorise the dates!`,
    replay: "Play again"
  }
};

let lang=(function(){try{const c=document.cookie.match(/(?:^|;\s*)fj-lang=([a-z]{2})/);if(c&&(c[1]==="fr"||c[1]==="en"))return c[1];}catch(e){}try{const s=localStorage.getItem("fj-lang");return(s==="fr"||s==="en")?s:"fr";}catch(e){return"fr";}})();
const T = () => I18N[lang];

/* État du jeu */
let order = [];      // indices mélangés des cartes encore en jeu
let placed = [];     // indices placés, dans l'ordre chronologique
let errors = 0;
let lastPlaced = -1; // dernier événement placé (anecdote affichée)
let done = false;
let fwRunning = false;

function shuffle(a){
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function reset(){
  order = shuffle(EVENTS.map((_, i) => i));
  placed = [];
  errors = 0;
  lastPlaced = -1;
  done = false;
}

function render(){
  /* Progression */
  $("progLeft").textContent = T().progress(placed.length, EVENTS.length);
  $("progRight").textContent = T().errors(errors);

  /* Frise */
  const frise = $("frise");
  frise.innerHTML = "";
  if(placed.length === 0){
    const d = document.createElement("div");
    d.className = "friseEmpty";
    d.textContent = T().friseEmpty;
    frise.appendChild(d);
  } else {
    placed.forEach(idx => {
      const ev = EVENTS[idx];
      const tile = document.createElement("div");
      tile.className = "fevent" + (idx === lastPlaced ? " last" : "");
      tile.setAttribute("role", "button");
      tile.setAttribute("tabindex", "0");
      const fy = document.createElement("span");
      fy.className = "fy";
      fy.textContent = ev.year;
      const fn = document.createElement("div");
      fn.className = "fn";
      fn.textContent = ev[lang].name;
      tile.appendChild(fy);
      tile.appendChild(fn);
      const show = () => showAnecdote(idx);
      tile.onclick = show;
      tile.onkeydown = e => { if(e.key === "Enter" || e.key === " "){ e.preventDefault(); show(); } };
      frise.appendChild(tile);
    });
    const lastTile = frise.querySelector(".fevent.last");
    if(lastTile) lastTile.scrollIntoView({ inline: "end", block: "nearest", behavior: "smooth" });
  }

  /* Cartes restantes */
  const cards = $("cards");
  cards.innerHTML = "";
  order.forEach(idx => {
    if(placed.includes(idx)) return;
    const b = document.createElement("button");
    b.type = "button";
    b.className = "ecard";
    b.textContent = EVENTS[idx][lang].name;
    b.onclick = () => tryPlace(idx, b);
    cards.appendChild(b);
  });

  /* Panneau anecdote / message */
  renderPanel();

  /* Bouton rejouer */
  $("replayBtn").style.display = done ? "inline-block" : "none";
  $("replayBtn").textContent = T().replay;
}

function renderPanel(){
  const p = $("anecdote");
  if(done){
    p.className = "anecdote win";
    p.innerHTML = `<div class="aTitle">${T().winTitle}</div><div>${T().win(errors)}</div>`;
  } else if(lastPlaced >= 0){
    showAnecdote(lastPlaced);
  } else {
    p.className = "anecdote placeholder";
    p.textContent = T().placeholder;
  }
}

function showAnecdote(idx){
  const p = $("anecdote");
  const ev = EVENTS[idx];
  p.className = "anecdote good";
  p.innerHTML = `<div class="aTitle">${ev.year} — ${ev[lang].name}</div><div>${ev[lang].anecdote}</div>`;
}

function showError(){
  const p = $("anecdote");
  p.className = "anecdote bad";
  p.innerHTML = `<div class="aTitle">${T().errorTitle}</div><div>${T().errorMsg}</div>`;
}

function tryPlace(idx, btn){
  if(done) return;
  /* L'événement attendu = le plus ancien parmi ceux qui restent */
  const remaining = EVENTS.map((_, i) => i).filter(i => !placed.includes(i));
  const expected = remaining.reduce((a, b) => EVENTS[a].year < EVENTS[b].year ? a : b);
  if(idx === expected){
    placed.push(idx);
    lastPlaced = idx;
    if(placed.length === EVENTS.length){
      done = true;
      render();
      fireworks();
    } else {
      render();
    }
  } else {
    errors++;
    $("progRight").textContent = T().errors(errors);
    showError();
    btn.classList.add("wrong");
    setTimeout(() => btn.classList.remove("wrong"), 500);
  }
}

$("replayBtn").onclick = () => { reset(); render(); };

/* Feux d'artifice de fin (recette éprouvée) */
function fireworks(){
  if(window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  if(fwRunning) return;
  const cv = document.getElementById("fireworks"), ctx = cv.getContext("2d");
  cv.width = innerWidth; cv.height = innerHeight;
  cv.style.display = "block";
  fwRunning = true;
  const COLORS = ["#155E4C","#D96A08","#C84B31"];
  const rockets = [], sparks = [];
  const launch = () => {
    rockets.push({
      x: cv.width * (0.15 + Math.random() * 0.7), y: cv.height,
      vx: (Math.random() - 0.5) * 2, vy: -(10 + Math.random() * 4),
      color: COLORS[Math.floor(Math.random() * COLORS.length)]
    });
  };
  const explode = r => {
    for(let i = 0; i < 90; i++){
      const ang = Math.random() * Math.PI * 2, sp = 2 + Math.random() * 5;
      sparks.push({ x: r.x, y: r.y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp,
                    life: 60 + Math.random() * 40, color: r.color });
    }
  };
  let frame = 0;
  const tick = () => {
    ctx.clearRect(0, 0, cv.width, cv.height);
    frame++;
    if(frame < 260 && frame % 16 === 0) launch();
    for(let i = rockets.length - 1; i >= 0; i--){
      const r = rockets[i];
      r.x += r.vx; r.y += r.vy; r.vy += 0.18;
      ctx.beginPath(); ctx.arc(r.x, r.y, 3, 0, Math.PI * 2);
      ctx.fillStyle = r.color; ctx.fill();
      if(r.vy >= -1.5){ explode(r); rockets.splice(i, 1); }
    }
    for(let i = sparks.length - 1; i >= 0; i--){
      const s = sparks[i];
      s.x += s.vx; s.y += s.vy; s.vy += 0.05; s.vx *= 0.985; s.life--;
      ctx.globalAlpha = Math.max(0, s.life / 80);
      ctx.beginPath(); ctx.arc(s.x, s.y, 2.4, 0, Math.PI * 2);
      ctx.fillStyle = s.color; ctx.fill();
      if(s.life <= 0) sparks.splice(i, 1);
    }
    ctx.globalAlpha = 1;
    if(frame < 600 || rockets.length || sparks.length) requestAnimationFrame(tick);
    else { cv.style.display = "none"; fwRunning = false; }
  };
  tick();
}

/* Langue */
function applyLang(){
  document.documentElement.lang = lang;
  $("kicker").textContent = T().kicker;
  $("title").textContent = T().title;
  $("instruction").textContent = T().instruction;
  $("langBtn").textContent = lang === "fr" ? "English" : "Français";
  $("fsLabel").textContent = isFs() ? T().fsExit : T().fs;
  $("backLink").textContent = T().backList;
  document.title = T().title + " · Gymnase — Frédéric Jaccard";
  render();
}
$("langBtn").onclick = () => {
  lang = lang === "fr" ? "en" : "fr";
  try {
    localStorage.setItem("fj-lang", lang);
    document.cookie = "fj-lang=" + lang + ";domain=.fredericjaccard.com;path=/;max-age=31536000;SameSite=Lax";
  } catch(e) {}
  applyLang();
};

/* Plein écran compatible Safari */
function isFs(){ return !!(document.fullscreenElement || document.webkitFullscreenElement); }
$("fsBtn").onclick = () => {
  const el = document.documentElement;
  if(isFs()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  else {
    const req = el.requestFullscreen || el.webkitRequestFullscreen;
    if(req){ const r = req.call(el); if(r && r.catch) r.catch(() => {}); }
  }
};
function syncFsLabel(){ $("fsLabel").textContent = isFs() ? T().fsExit : T().fs; }
document.addEventListener("fullscreenchange", syncFsLabel);
document.addEventListener("webkitfullscreenchange", syncFsLabel);

reset();
applyLang();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Répartissez l'empreinte carbone d'un smartphone à l'intuition, découvrez la réalité étape par étape, et la chute : obsolescence et réparabilité.">
<title>La vie d'un smartphone · Gymnase — Frédéric Jaccard</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2320241F'/%3E%3Ctext x='32' y='43' font-family='Arial,sans-serif' font-size='28' font-weight='bold' fill='%23FFFFFF' text-anchor='middle'%3EFJ%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Quattrocento+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBFAF6; --card:#F7F6F2; --primary:#155E4C; --primaryLight:#E3F0EA;
  --accent:#D96A08; --accentLight:#FDEBD8; --line:#D8D5CB; --ink:#20241F; --muted:#6E726B;
  --error:#C84B31;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:"Quattrocento Sans",sans-serif;padding:20px;max-width:1000px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px;margin-bottom:16px}
.kicker{font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
h1{font-size:26px;color:var(--primary)}
.hdrBtns{display:flex;gap:8px}
button{font-family:inherit;font-size:14px;font-weight:700;padding:8px 16px;border-radius:10px;
  border:2px solid var(--primary);background:var(--card);color:var(--primary);cursor:pointer;min-height:44px}
button:hover{background:var(--primaryLight)}
button:disabled{opacity:.4;cursor:not-allowed}
button.accent{background:var(--accent);border-color:var(--accent);color:#fff}
button.accent:hover{background:var(--accent);filter:brightness(1.08)}
.instruction{background:var(--primaryLight);border-radius:12px;padding:12px 16px;margin-bottom:16px;font-size:15px;color:var(--primary)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
.row{display:grid;grid-template-columns:32px minmax(150px,220px) 1fr 64px;gap:12px;align-items:center;margin-bottom:12px}
.row .ic{font-size:22px;text-align:center}
.row label{font-weight:700;font-size:15px}
.row input[type=range]{width:100%;height:44px;accent-color:var(--primary);cursor:pointer}
.row .val{font-weight:700;text-align:right;font-size:16px;font-variant-numeric:tabular-nums}
.totalRow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 14px}
.chip{font-weight:700;font-size:15px;padding:6px 14px;border-radius:999px;border:2px solid var(--line);background:var(--card)}
.chip.ok{border-color:var(--primary);background:var(--primaryLight);color:var(--primary)}
.chip.bad{border-color:var(--error);background:var(--accentLight);color:var(--error)}
.bar{display:flex;height:44px;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--card)}
.bar div{transition:width .9s ease;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.barTitle{font-size:13px;font-weight:700;color:var(--muted);margin:14px 0 6px;text-transform:uppercase;letter-spacing:.08em}
.callout{background:var(--accentLight);border:2px solid var(--error);border-radius:12px;padding:14px 16px;font-size:16px;margin:14px 0}
.callout strong{color:var(--error)}
.okbox{background:var(--primaryLight);border:2px solid var(--primary);border-radius:12px;padding:14px 16px;font-size:16px;margin:14px 0}
.okbox strong{color:var(--primary)}
table{width:100%;border-collapse:collapse;margin-top:6px;font-size:15px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}
th{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.delta{font-weight:700;border-radius:8px;padding:2px 8px;display:inline-block;min-width:58px;text-align:center}
.delta.over{background:var(--accentLight);color:var(--error)}
.delta.under{background:var(--primaryLight);color:var(--primary)}
.delta.good{background:var(--primaryLight);color:var(--primary)}
.journey{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.jIcon{font-size:42px;line-height:1}
.jName{font-size:22px;font-weight:700;color:var(--primary)}
ul.facts{list-style:none;margin:8px 0}
ul.facts li{padding:8px 0 8px 26px;position:relative;border-bottom:1px solid var(--line);font-size:15.5px}
ul.facts li:last-child{border-bottom:none}
ul.facts li::before{content:"";position:absolute;left:4px;top:16px;width:9px;height:9px;border-radius:50%;background:var(--accent)}
.dots{display:flex;gap:8px;justify-content:center;margin:14px 0}
.dot{width:14px;height:14px;border-radius:50%;background:var(--line)}
.dot.done{background:var(--primaryLight);border:2px solid var(--primary)}
.dot.cur{background:var(--primary)}
.jNav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.bigSlider{display:grid;grid-template-columns:1fr 110px;gap:12px;align-items:center;margin:8px 0 4px}
.bigSlider input[type=range]{width:100%;height:44px;accent-color:var(--accent)}
.bigSlider .val{font-size:20px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums;color:var(--accent)}
.result{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}
.result .box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
.result .num{font-size:26px;font-weight:700;color:var(--primary);font-variant-numeric:tabular-nums}
.result .cap{font-size:13px;color:var(--muted)}
.src{font-size:12.5px;color:var(--muted);margin-top:14px;line-height:1.5}
footer{margin-top:20px;text-align:center;color:var(--muted);font-size:13px}
footer a{color:var(--muted);font-weight:400;text-decoration:none}
footer a:hover{text-decoration:underline}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
@media(max-width:640px){
  body{padding:14px}
  h1{font-size:21px}
  .hdrBtns{width:100%}
  .row{grid-template-columns:28px 1fr 56px;grid-template-areas:"ic lab val" "sl sl sl"}
  .row .ic{grid-area:ic}
  .row label{grid-area:lab}
  .row input{grid-area:sl}
  .row .val{grid-area:val}
  .result{grid-template-columns:1fr}
  .bigSlider{grid-template-columns:1fr;gap:4px}
  .bigSlider .val{text-align:left;font-size:18px}
  .jName{font-size:19px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header>
  <div>
    <div class="kicker" id="kicker"></div>
    <h1 id="title"></h1>
  </div>
  <div class="hdrBtns">
    <button id="langBtn" type="button">English</button>
    <button id="fsBtn" type="button"><span id="fsLabel"></span></button>
  </div>
</header>
<div class="instruction" id="instruction"></div>
<main id="app"></main>
<footer><a href="enjeux_sociaux.html" id="backLink"></a> · <a href="https://fredericjaccard.com">Frédéric Jaccard</a></footer>
<script>
const $ = id => document.getElementById(id);

/* ---------- Données : répartition réelle de l'empreinte (moyennes d'ACV publiées) ---------- */
const STAGES = [
  { key:"extraction",   real:16, col:"#6E726B" },
  { key:"fabrication",  real:64, col:"#C84B31" },
  { key:"transport",    real:3,  col:"#D8D5CB" },
  { key:"usage",        real:16, col:"#155E4C" },
  { key:"findevie",     real:1,  col:"#D96A08" }
];
const TOTAL_KG = 80;        /* ordre de grandeur : 43–80 kg CO2e selon les modèles */
const CAR_KG_KM = 0.2;      /* ~0,2 kg CO2e par km en voiture (ADEME) */

const I18N = {
  fr: {
    kicker: "ENJEUX SOCIAUX",
    title: "La vie d'un smartphone",
    instruction: "Répartissez 100 % de l'empreinte carbone d'un smartphone entre les cinq étapes de sa vie — à l'intuition, sans chercher la réponse !",
    instructionReveal: "Voici la réalité, à côté de votre intuition. Observez les écarts… puis explorez chaque étape une par une.",
    instructionJourney: "Parcourez les cinq étapes de la vie d'un smartphone, de l'extraction des matières premières à la fin de vie.",
    instructionFinal: "Dernière étape : ce que vous pouvez réellement changer. Faites glisser le curseur pour voir l'effet de la durée de vie.",
    fs: "Plein écran", fsExit: "Quitter",
    backList: "← Toutes les applications",
    stages: {
      extraction:  { name:"Extraction",  icon:"⛏️" },
      fabrication: { name:"Fabrication", icon:"🏭" },
      transport:   { name:"Transport",   icon:"🚢" },
      usage:       { name:"Usage",       icon:"🔌" },
      findevie:    { name:"Fin de vie",  icon:"♻️" }
    },
    yourBar: "Votre intuition",
    realBar: "La réalité",
    total: "Total",
    totalOk: "100 % — vous pouvez valider !",
    totalBad: (d) => d > 0 ? `Il reste ${d} points à retirer` : `Il manque ${-d} points`,
    validate: "Découvrir la réalité",
    colYou: "Vous",
    colReal: "Réalité",
    colDelta: "Écart",
    over: "de trop", under: "en moins", exact: "juste !",
    calloutTitle: "La fabrication écrase tout.",
    callout: (p) => `Environ <strong>${p} % de l'empreinte d'un smartphone est produite avant même la première utilisation</strong> (extraction + fabrication). La charger pendant des années ne pèse presque rien à côté : le vrai impact, c'est la production.`,
    explore: "Explorer les cinq étapes",
    prev: "← Précédent",
    next: "Suivant →",
    toFinal: "Vers la conclusion →",
    facts: {
      extraction: [
        "Un smartphone contient plus de 50 éléments chimiques : cuivre, cobalt, lithium, terres rares, or…",
        "Plus de 70 % du cobalt mondial est extrait en République démocratique du Congo.",
        "C'est surtout ici que se joue l'épuisement des ressources : le numérique mobilise environ 1,7 tonne de matières par habitant et par an (ADEME)."
      ],
      fabrication: [
        "Environ 80 % de l'empreinte carbone est émise avant la première utilisation.",
        "Les puces — processeur, mémoire — pèsent à elles seules plus de la moitié des émissions de la production.",
        "Les usines sont concentrées en Asie : Taïwan, Chine et Corée du Sud."
      ],
      transport: [
        "Seulement ~3 % de l'empreinte totale : ce n'est presque rien.",
        "L'essentiel du trajet se fait par cargo conteneur depuis l'Asie vers l'Europe.",
        "Le fret aérien émet des dizaines de fois plus que le maritime : c'est pourquoi le transport reste faible."
      ],
      usage: [
        "Environ 15 % de l'empreinte sur une durée de vie de trois ans.",
        "Une recharge complète consomme ~14 Wh, soit moins de 10 g CO₂e avec le mix électrique mondial.",
        "Plus votre électricité est bas-carbone (Suisse, France), plus cette part devient négligeable."
      ],
      findevie: [
        "Moins de 1 % de l'empreinte… directement.",
        "Mais le recyclage récupère très mal les métaux critiques : on ne récupère qu'une fraction des terres rares.",
        "Il reste indispensable : l'or, le palladium et le cuivre d'un téléphone ont une vraie valeur."
      ]
    },
    finalTitle: "Et maintenant, la chute : obsolescence et réparabilité",
    finalFacts: [
      "Durée de vie moyenne d'un smartphone en France : ~3 ans. Or un téléphone peut fonctionner 5 à 7 ans.",
      "Faire passer la durée de vie de 3 à 5 ans réduit les émissions annuelles de ~31 % ; à 7 ans, de ~44 % (ACV Fairphone 4).",
      "L'indice de réparabilité, obligatoire en France depuis 2021, va de 1/10 (appareils collés) à 10/10 (modèles modulaires)."
    ],
    sliderLabel: "Vous gardez votre téléphone",
    years: (n) => n + (n > 1 ? " ans" : " an"),
    perYear: "Empreinte par année d'utilisation",
    carEq: "Soit, en voiture",
    km: (k) => k + " km",
    finalMsg: (best) => `Changer de téléphone tous les 2 ans émet <strong>deux fois plus</strong> par an que tous les 4 ans. Le geste le plus efficace n'est pas de charger moins : c'est de <strong>garder son téléphone plus longtemps, le réparer, ou l'acheter reconditionné</strong>${best ? " — comme vous le faites déjà !" : "."}`,
    restart: "Recommencer",
    sources: "Ordres de grandeur établis à partir d'ACV publiées : rapport environnemental Apple iPhone 16 (2024), base Boavizta / Greenly (2024), ACV Fairphone 4 (2022). La répartition extraction / fabrication sépare, au sein de la « production » (~80 %), les matières premières de la fabrication des composants."
  },
  en: {
    kicker: "SOCIAL ISSUES",
    title: "The life of a smartphone",
    instruction: "Allocate 100% of a smartphone's carbon footprint across the five stages of its life — go with your gut, don't look anything up!",
    instructionReveal: "Here is reality, next to your intuition. Look at the gaps… then explore each stage, one by one.",
    instructionJourney: "Walk through the five stages of a smartphone's life, from raw material extraction to end of life.",
    instructionFinal: "Final stage: what you can actually change. Drag the slider to see the effect of device lifespan.",
    fs: "Fullscreen", fsExit: "Exit",
    backList: "← All applications",
    stages: {
      extraction:  { name:"Extraction",  icon:"⛏️" },
      fabrication: { name:"Manufacturing", icon:"🏭" },
      transport:   { name:"Transport",   icon:"🚢" },
      usage:       { name:"Use",         icon:"🔌" },
      findevie:    { name:"End of life", icon:"♻️" }
    },
    yourBar: "Your gut feeling",
    realBar: "Reality",
    total: "Total",
    totalOk: "100% — you can submit!",
    totalBad: (d) => d > 0 ? `${d} points over` : `${-d} points missing`,
    validate: "See the reality",
    colYou: "You",
    colReal: "Reality",
    colDelta: "Gap",
    over: "too many", under: "too few", exact: "spot on!",
    calloutTitle: "Manufacturing crushes everything.",
    callout: (p) => `About <strong>${p}% of a smartphone's footprint is produced before it is even switched on</strong> (extraction + manufacturing). Years of charging weigh almost nothing by comparison: the real impact is production.`,
    explore: "Explore the five stages",
    prev: "← Previous",
    next: "Next →",
    toFinal: "To the conclusion →",
    facts: {
      extraction: [
        "A smartphone contains more than 50 chemical elements: copper, cobalt, lithium, rare earths, gold…",
        "Over 70% of the world's cobalt is mined in the Democratic Republic of Congo.",
        "This is where resource depletion mostly happens: digital technology uses about 1.7 tonnes of materials per person per year (ADEME)."
      ],
      fabrication: [
        "About 80% of the carbon footprint is emitted before the first use.",
        "The chips — processor, memory — alone account for more than half of production emissions.",
        "Factories are concentrated in Asia: Taiwan, China and South Korea."
      ],
      transport: [
        "Only ~3% of the total footprint: almost nothing.",
        "Most of the journey is by container ship from Asia to Europe.",
        "Air freight emits dozens of times more than sea freight: that is why transport stays so low."
      ],
      usage: [
        "About 15% of the footprint over a three-year lifespan.",
        "A full charge uses ~14 Wh, i.e. under 10 g CO₂e with the world average electricity mix.",
        "The lower-carbon your electricity (Switzerland, France), the more negligible this share becomes."
      ],
      findevie: [
        "Less than 1% of the footprint… directly.",
        "But recycling recovers critical metals very poorly: only a fraction of rare earths is recovered.",
        "It remains essential: the gold, palladium and copper in a phone are genuinely valuable."
      ]
    },
    finalTitle: "And now, the twist: obsolescence and repairability",
    finalFacts: [
      "Average smartphone lifespan in France: ~3 years. Yet a phone can work for 5 to 7 years.",
      "Extending lifespan from 3 to 5 years cuts annual emissions by ~31%; at 7 years, by ~44% (Fairphone 4 LCA).",
      "The repairability index, mandatory in France since 2021, ranges from 1/10 (glued devices) to 10/10 (modular models)."
    ],
    sliderLabel: "You keep your phone for",
    years: (n) => n + (n > 1 ? " years" : " year"),
    perYear: "Footprint per year of use",
    carEq: "That's, by car,",
    km: (k) => k + " km",
    finalMsg: (best) => `Replacing your phone every 2 years emits <strong>twice as much</strong> per year as every 4 years. The most effective move is not charging less: it is to <strong>keep your phone longer, repair it, or buy it refurbished</strong>${best ? " — as you already do!" : "."}`,
    restart: "Start over",
    sources: "Orders of magnitude based on published LCAs: Apple iPhone 16 environmental report (2024), Boavizta database / Greenly (2024), Fairphone 4 LCA (2022). The extraction / manufacturing split separates, within \"production\" (~80%), raw materials from component manufacturing."
  }
};

let lang = (function () {
  try {
    var c = document.cookie.match(/(?:^|;\s*)fj-lang=([a-z]{2})/);
    if (c && (c[1] === "fr" || c[1] === "en")) return c[1];
  } catch (e) {}
  try {
    var s = localStorage.getItem("fj-lang");
    if (s === "fr" || s === "en") return s;
  } catch (e) {}
  return "fr";
})();
const T = () => I18N[lang];

/* ---------- État ---------- */
let screen = "guess";        /* guess | reveal | journey | final */
let guess = [0, 0, 0, 0, 0];
let jstep = 0;
let lifeYears = 3;

/* ---------- Formats ---------- */
function sep(n) {
  const s = Math.round(n).toString();
  return lang === "fr" ? s.replace(/\B(?=(\d{3})+(?!\d))/g, " ") : s.replace(/\B(?=(\d{3})+(?!\d))/g, ",");
}
function dec1(n) { return lang === "fr" ? n.toFixed(1).replace(".", ",") : n.toFixed(1); }
function pct(n) { return n + (lang === "fr" ? " %" : "%"); }

/* ---------- Rendu ---------- */
function barHTML(values, showPct) {
  return '<div class="bar">' + STAGES.map((s, i) =>
    values[i] > 0 ? `<div style="width:${values[i]}%;background:${s.col}" title="${T().stages[s.key].name}">${showPct && values[i] >= 5 ? pct(values[i]) : ""}</div>` : ""
  ).join("") + "</div>";
}

function render() {
  const app = $("app");
  $("instruction").textContent = screen === "reveal" ? T().instructionReveal
    : screen === "journey" ? T().instructionJourney
    : screen === "final" ? T().instructionFinal
    : T().instruction;
  if (screen === "guess") {
    let rows = STAGES.map((s, i) => `
      <div class="row">
        <div class="ic">${T().stages[s.key].icon}</div>
        <label for="sl${i}">${T().stages[s.key].name}</label>
        <input type="range" id="sl${i}" min="0" max="100" step="1" value="${guess[i]}" aria-label="${T().stages[s.key].name}">
        <div class="val" id="v${i}">${pct(guess[i])}</div>
      </div>`).join("");
    const sum = guess.reduce((a, b) => a + b, 0);
    const ok = sum === 100;
    app.innerHTML = `
      <div class="panel">
        ${rows}
        <div class="totalRow">
          <span class="chip ${ok ? "ok" : "bad"}" id="totalChip">${T().total} : ${pct(sum)} — ${ok ? T().totalOk : T().totalBad(100 - sum)}</span>
        </div>
        ${barHTML(guess, true)}
        <div class="actions">
          <button id="btnValidate" class="accent" type="button" ${ok ? "" : "disabled"}>${T().validate}</button>
        </div>
      </div>`;
    STAGES.forEach((s, i) => {
      $("sl" + i).addEventListener("input", e => {
        guess[i] = +e.target.value;
        $("v" + i).textContent = pct(guess[i]);
        const sm = guess.reduce((a, b) => a + b, 0);
        const okk = sm === 100;
        const chip = $("totalChip");
        chip.className = "chip " + (okk ? "ok" : "bad");
        chip.textContent = T().total + " : " + pct(sm) + " — " + (okk ? T().totalOk : T().totalBad(100 - sm));
        const bv = app.querySelector(".bar");
        bv.outerHTML = barHTML(guess, true);
        $("btnValidate").disabled = !okk;
      });
    });
    $("btnValidate").onclick = () => { screen = "reveal"; render(); window.scrollTo(0, 0); };
  }
  else if (screen === "reveal") {
    const prodShare = STAGES[0].real + STAGES[1].real;
    let tbl = `<table><tr><th></th><th>${T().colYou}</th><th class="num">${T().colReal}</th><th class="num">${T().colDelta}</th></tr>`;
    STAGES.forEach((s, i) => {
      const d = guess[i] - s.real;
      const cls = d > 0 ? "over" : d < 0 ? "under" : "good";
      const txt = d === 0 ? T().exact : (d > 0 ? "+" + d : d) + " " + (d > 0 ? T().over : T().under);
      tbl += `<tr><td>${T().stages[s.key].icon} ${T().stages[s.key].name}</td>
        <td class="num">${pct(guess[i])}</td><td class="num">${pct(s.real)}</td>
        <td class="num"><span class="delta ${cls}">${txt}</span></td></tr>`;
    });
    tbl += "</table>";
    app.innerHTML = `
      <div class="panel">
        <div class="barTitle">${T().yourBar}</div>
        ${barHTML(guess, true)}
        <div class="barTitle">${T().realBar}</div>
        ${barHTML(STAGES.map(s => s.real), true)}
        <div class="callout"><strong>${T().calloutTitle}</strong> ${T().callout(prodShare)}</div>
        ${tbl}
        <div class="actions">
          <button id="btnExplore" class="accent" type="button">${T().explore}</button>
        </div>
      </div>
      <div class="src">${T().sources}</div>`;
    $("btnExplore").onclick = () => { screen = "journey"; jstep = 0; render(); window.scrollTo(0, 0); };
    /* animation d'entrée des barres */
    requestAnimationFrame(() => requestAnimationFrame(() => {
      app.querySelectorAll(".bar div").forEach(d => { d.style.width = d.style.width; });
    }));
  }
  else if (screen === "journey") {
    const s = STAGES[jstep];
    const facts = T().facts[s.key].map(f => `<li>${f}</li>`).join("");
    const dots = STAGES.map((_, i) => `<div class="dot ${i < jstep ? "done" : i === jstep ? "cur" : ""}"></div>`).join("");
    app.innerHTML = `
      <div class="panel">
        <div class="journey">
          <div class="jIcon">${T().stages[s.key].icon}</div>
          <div>
            <div class="jName">${T().stages[s.key].name} — ${pct(s.real)}</div>
          </div>
        </div>
        ${barHTML(STAGES.map((x, i) => i === jstep ? x.real : 0), true)}
        <ul class="facts">${facts}</ul>
        <div class="dots">${dots}</div>
        <div class="jNav">
          <button id="btnPrev" type="button" ${jstep === 0 ? "disabled" : ""}>${T().prev}</button>
          <button id="btnNext" class="accent" type="button">${jstep === STAGES.length - 1 ? T().toFinal : T().next}</button>
        </div>
      </div>`;
    $("btnPrev").onclick = () => { jstep = Math.max(0, jstep - 1); render(); };
    $("btnNext").onclick = () => {
      if (jstep === STAGES.length - 1) { screen = "final"; render(); window.scrollTo(0, 0); }
      else { jstep++; render(); }
    };
  }
  else if (screen === "final") {
    const kgPerYear = TOTAL_KG / lifeYears;
    const kmPerYear = Math.round(kgPerYear / CAR_KG_KM);
    const facts = T().finalFacts.map(f => `<li>${f}</li>`).join("");
    app.innerHTML = `
      <div class="panel">
        <div class="jName" style="margin-bottom:8px">${T().finalTitle}</div>
        <ul class="facts">${facts}</ul>
        <div style="margin-top:16px;font-weight:700">${T().sliderLabel}</div>
        <div class="bigSlider">
          <input type="range" id="slYears" min="2" max="10" step="1" value="${lifeYears}" aria-label="${T().sliderLabel}">
          <div class="val" id="yearsVal">${T().years(lifeYears)}</div>
        </div>
        <div class="result">
          <div class="box"><div class="num">${dec1(kgPerYear)} kg CO₂e</div><div class="cap">${T().perYear}</div></div>
          <div class="box"><div class="num">≈ ${sep(kmPerYear)} km</div><div class="cap">${T().carEq}</div></div>
        </div>
        <div class="okbox" id="finalMsg">${T().finalMsg(lifeYears >= 5)}</div>
        <div class="actions">
          <button id="btnRestart" type="button">${T().restart}</button>
        </div>
      </div>
      <div class="src">${T().sources}</div>`;
    $("slYears").addEventListener("input", e => {
      lifeYears = +e.target.value;
      $("yearsVal").textContent = T().years(lifeYears);
      const kg = TOTAL_KG / lifeYears, km = Math.round(kg / CAR_KG_KM);
      const boxes = app.querySelectorAll(".result .num");
      boxes[0].textContent = dec1(kg) + " kg CO₂e";
      boxes[1].textContent = "≈ " + sep(km) + " km";
      $("finalMsg").innerHTML = T().finalMsg(lifeYears >= 5);
    });
    $("btnRestart").onclick = () => { screen = "guess"; guess = [0, 0, 0, 0, 0]; jstep = 0; lifeYears = 3; render(); window.scrollTo(0, 0); };
  }
}

function applyLang() {
  document.documentElement.lang = lang;
  $("kicker").textContent = T().kicker;
  $("title").textContent = T().title;
  $("langBtn").textContent = lang === "fr" ? "English" : "Français";
  $("fsLabel").textContent = isFs() ? T().fsExit : T().fs;
  document.getElementById("backLink").textContent = T().backList;
  document.title = T().title + " · Gymnase — Frédéric Jaccard";
  render();
}
$("langBtn").onclick = () => {
  lang = lang === "fr" ? "en" : "fr";
  try {
    localStorage.setItem("fj-lang", lang);
    document.cookie = "fj-lang=" + lang + ";domain=.fredericjaccard.com;path=/;max-age=31536000;SameSite=Lax";
  } catch (e) {}
  applyLang();
};
function isFs() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }
$("fsBtn").onclick = () => {
  const el = document.documentElement;
  if (isFs()) {
    (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  } else {
    const req = el.requestFullscreen || el.webkitRequestFullscreen;
    if (req) { const r = req.call(el); if (r && r.catch) r.catch(() => {}); }
  }
};
function syncFsLabel() { $("fsLabel").textContent = isFs() ? T().fsExit : T().fs; }
document.addEventListener("fullscreenchange", syncFsLabel);
document.addEventListener("webkitfullscreenchange", syncFsLabel);
applyLang();
</script>
</body>
</html>

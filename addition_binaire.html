<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Addition binaire — du calcul au circuit</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2320241F'/%3E%3Ctext x='32' y='43' font-family='Arial,sans-serif' font-size='28' font-weight='bold' fill='%23FFFFFF' text-anchor='middle'%3EFJ%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quattrocento+Sans:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --primary:#155E4C; --primary-light:#E3F0EA; --accent:#D96A08; --accent-light:#FDEBD8;
    --bg:#FBFAF6; --card:#F7F6F2; --line:#D8D5CB; --ink:#20241F; --muted:#6E726B;
    --ok:#2E7D52; --ko:#C0392B;
  }
  *{margin:0; padding:0; box-sizing:border-box}
  body{font-family:'Quattrocento Sans',sans-serif; background:var(--bg); color:var(--ink); min-height:100vh; display:flex; flex-direction:column}
  header{display:flex; justify-content:space-between; align-items:center; padding:14px 24px; border-bottom:1px solid var(--line); background:#fff}
  .kicker{font-size:13px; letter-spacing:2px; text-transform:uppercase; color:var(--accent); font-weight:700}
  h1{font-size:24px; color:var(--primary)}
  .hdrbtns{display:flex; gap:10px}
  .hbtn{font-family:inherit; font-size:14px; font-weight:700; padding:8px 14px; border-radius:10px; border:2px solid var(--primary); background:#fff; color:var(--primary); cursor:pointer}
  .hbtn:hover{background:var(--primary-light)}
  main{flex:1; max-width:1400px; margin:0 auto; padding:16px 24px; width:100%}
  .instruction{background:var(--primary-light); border-radius:12px; padding:12px 18px; font-size:15px; line-height:1.5; margin-bottom:14px}
  .steps{display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap}
  .step{font-family:inherit; font-size:13.5px; font-weight:700; padding:8px 14px; border-radius:20px; border:2px solid var(--line); background:#fff; color:var(--muted); cursor:pointer}
  .step.sel{border-color:var(--primary); background:var(--primary-light); color:var(--primary)}
  .step.done{border-color:var(--primary); color:var(--primary)}
  .step:disabled{opacity:.45; cursor:not-allowed}
  .duo{display:grid; grid-template-columns:1fr 1.35fr; gap:18px; align:start}
  .card{background:#fff; border:1px solid var(--line); border-radius:14px; padding:16px}
  .card h2{font-size:17px; color:var(--primary); margin-bottom:10px}
  svg{width:100%; height:auto; display:block; touch-action:manipulation}
  .dig[data-dig]{cursor:pointer}
  .dig rect{fill:#fff; stroke:var(--line); stroke-width:2}
  .dig text{fill:var(--ink); font-size:24px; font-weight:700}
  .dig.clickable:hover rect{stroke:var(--primary); fill:var(--primary-light)}
  .dig.ok rect{stroke:var(--ok); fill:#E8F5EC}
  .dig.ok text{fill:var(--ok)}
  .dig.ko rect{stroke:var(--ko); fill:#FBEBE9}
  .dig.ko text{fill:var(--ko)}
  .dig.fixed rect{fill:var(--card)}
  .pin circle:not(.hit){fill:#fff; stroke:var(--primary); stroke-width:3}
  .pin.on circle:not(.hit){stroke:var(--accent)}
  .pin.clickable{cursor:pointer}
  .pin.clickable:hover circle:not(.hit){stroke-width:4.5}
  .hit{fill:transparent; stroke:transparent}
  .dig.ghost rect{fill:var(--card); stroke:var(--line); stroke-dasharray:4 4}
  .dig.ghost text{fill:#AFB4AA}
  .dig.bad rect{stroke:var(--ko); fill:#FBEBE9}
  .dig.bad text{fill:var(--ko)}
  .decBad{fill:var(--ko) !important}
  .decGood{fill:var(--ok) !important}
  .wire{stroke:var(--line); stroke-width:3.2; fill:none; stroke-linecap:round}
  .wire.on{stroke:var(--accent); stroke-dasharray:9 7; animation:flow .6s linear infinite}
  @keyframes flow{to{stroke-dashoffset:-16}}
  .abtn{font-family:inherit; font-size:15px; font-weight:700; padding:12px; border-radius:12px; border:none; background:var(--primary); color:#fff; cursor:pointer; width:100%; margin-top:10px}
  .abtn:hover{filter:brightness(1.08)}
  .abtn.ghost{background:#fff; color:var(--primary); border:2px solid var(--primary)}
  #msg{border-radius:10px; padding:10px 14px; font-size:14.5px; font-weight:700; margin-top:12px; display:none}
  #msg.win{background:var(--primary-light); color:var(--primary)}
  #msg.err{background:var(--accent-light); color:var(--accent)}
  .expl{font-size:13.5px; line-height:1.5; color:var(--ink); margin-top:12px; background:var(--card); border-radius:10px; padding:10px 14px}
  .ovf{background:var(--accent-light); border-radius:10px; padding:10px 14px; font-size:14px; font-weight:700; color:var(--accent); margin-top:12px; display:none}
  .ovf.show{display:block}
  footer{text-align:center; padding:12px; color:var(--muted); font-size:13px; border-top:1px solid var(--line)}
footer a{color:inherit;text-decoration:none}
footer a:hover{text-decoration:underline}
  #rotateHint{display:none; text-align:center; font-size:12.5px; font-weight:700; color:var(--accent);
    background:var(--accent-light); border-radius:8px; padding:5px 10px; margin-bottom:8px}
  @media (max-width:1000px){
    header{padding:10px 16px}
    h1{font-size:19px}
    main{padding:12px 14px}
    .duo{grid-template-columns:1fr}
  }
  @media (max-width:1000px) and (orientation:portrait){ #rotateHint{display:block} }
  @media (max-width:1000px) and (orientation:landscape){
    header{padding:5px 16px}
    .kicker{font-size:11px}
    h1{font-size:16px}
    main{padding:8px 12px}
    .instruction{font-size:12.5px; padding:8px 12px}
    .duo{grid-template-columns:1fr 1.35fr; gap:12px}
    .card{padding:10px}
  }
</style>
</head>
<body>
<header>
  <div>
    <div class="kicker" id="kicker">Architecture des ordinateurs</div>
    <h1 id="title">Addition binaire — du calcul au circuit</h1>
  </div>
  <div class="hdrbtns">
    <button class="hbtn" id="langBtn">English</button>
    <button class="hbtn" id="fsBtn">⛶ <span id="fsLabel">Plein écran</span></button>
  </div>
</header>
<main>
  <div class="instruction" id="instruction"></div>
  <div id="rotateHint"></div>
  <div class="steps" id="steps"></div>
  <div class="duo">
    <div class="card">
      <h2 id="leftTitle"></h2>
      <svg viewBox="0 0 420 380" id="sceneL"></svg>
      <div id="msg"></div>
      <div class="expl" id="expl"></div>
    </div>
    <div class="card">
      <h2 id="rightTitle"></h2>
      <svg viewBox="0 0 620 380" id="sceneR"></svg>
    </div>
  </div>
</main>
<footer><a href="index.html" id="backLink"></a> · <a href="https://fredericjaccard.com">Frédéric Jaccard</a></footer>
<script>
const $ = id => document.getElementById(id);

const I18N = {
  fr:{
  backList:"← Toutes les applications",
    title:"Addition binaire — du calcul au circuit",
    instruction:"À chaque étape, cliquez sur les chiffres des deux nombres — dans le calcul à gauche ou sur les entrées A et B du circuit (et R₀ dans l'additionneur 1 bit) — pour changer l'addition : le résultat, les retenues et le circuit (courant orange) se mettent à jour instantanément.",
    rotateHint:"🔄 Tournez votre téléphone en paysage pour tout voir côte à côte",
    steps:["1 · Demi-additionneur 1 bit","2 · Additionneur 1 bit","3 · Additionneur 2 bits","4 · Additionneur 4 bits","5 · Additionneur 4 bits avec dépassement"],
    leftHand:"Votre calcul",
    rightCircuit:"Le circuit",
    expl:[
      "Le <b>demi-additionneur</b> additionne deux bits A et B : la somme S vaut A OU exclusif B, la retenue R vaut A ET B. C'est la plus petite brique d'addition.",
      "L'<b>additionneur complet</b> ajoute la retenue entrante R₀ : 5 portes suffisent. S = (A OU exclusif B) OU exclusif R₀ et R₁ = (A ET B) OU (A OU exclusif B) ET R₀.",
      "Pour 2 bits, on <b>chaîne</b> un demi-additionneur (colonne 0) et un additionneur complet (colonne 1) : la retenue sort de l'un et entre dans l'autre, exactement comme à la main.",
      "Pour 4 bits, quatre additionneurs en cascade — c'est l'additionneur à propagation de retenue du processeur.",
      "Avec 4 bits, on ne peut représenter que 0 à 15. Si la somme dépasse 15, la retenue finale « sort » du circuit : c'est le <b>dépassement de capacité</b> (overflow). Le processeur la mémorise dans un <b>drapeau</b> — un bit spécial qui signale qu'une opération a produit un résultat trop grand."
    ],
    flagL1:"drapeau de", flagL2:"retenue",
    ovfTxt:"⚠ Dépassement de capacité : la somme vaut",
    ovfTxt2:"mais 4 bits ne peuvent stocker que 0 à 15. La retenue finale est perdue (elle part dans le drapeau de retenue du processeur).",
    fs:"Plein écran", fsExit:"Quitter",
    box1:"demi-additionneur", box2:"additionneur",
    half:"demi-additionneur",
    gXor:"OU exclusif", gAnd:"ET", gOr:"OU",
    full:"additionneur",
    carryOut:"retenue sortante",
    colLbl:"colonne",
  },
  en:{
  backList:"← All applications",
    title:"Binary addition — from paper to circuit",
    instruction:"At each step, click the digits of the two numbers — in the calculation on the left or on the A and B inputs of the circuit (and R₀ in the 1-bit adder) — to change the addition: the result, the carries and the circuit (orange current) update instantly.",
    rotateHint:"🔄 Rotate your phone to landscape to see both side by side",
    steps:["1 · 1-bit half adder","2 · 1-bit full adder","3 · 2-bit adder","4 · 4-bit adder","5 · 4-bit adder with overflow"],
    leftHand:"Your calculation",
    rightCircuit:"The circuit",
    expl:[
      "The <b>half adder</b> adds two bits A and B: the sum S is A XOR B, the carry R is A AND B. It is the smallest adding brick.",
      "The <b>full adder</b> also takes the incoming carry R₀: 5 gates are enough. S = (A XOR B) XOR R₀ and R₁ = (A AND B) OR (A XOR B) AND R₀.",
      "For 2 bits we <b>chain</b> a half adder (column 0) and a full adder (column 1): the carry leaves one and enters the other, exactly like on paper.",
      "For 4 bits, four adders in cascade — this is the ripple-carry adder inside the processor.",
      "With 4 bits we can only represent 0 to 15. If the sum exceeds 15, the final carry «falls out» of the circuit: this is an <b>overflow</b>. The processor stores it in a <b>flag</b> — a special bit that signals an operation produced a result too large to fit."
    ],
    flagL1:"carry", flagL2:"flag",
    ovfTxt:"⚠ Overflow: the sum is",
    ovfTxt2:"but 4 bits can only hold 0 to 15. The final carry is lost (it goes to the processor's carry flag).",
    fs:"Fullscreen", fsExit:"Exit",
    box1:"half adder", box2:"full adder",
    half:"half adder",
    gXor:"XOR", gAnd:"AND", gOr:"OR",
    full:"full adder",
    carryOut:"carry out",
    colLbl:"column",
  }
};
let lang=(function(){try{const s=localStorage.getItem("fj-lang");return(s==="fr"||s==="en")?s:"fr";}catch(e){return"fr";}})();
const T = () => I18N[lang];

// ---------- etat ----------
let stage = 0;              // 0..4
let unlocked = 0;
let A=[], B=[], NB=1;       // operandes (bit0 = poids faible)
let CIN = 0;            // retenue entrante R1 (cliquable)
let S=[], R=[];             // reponses eleve ; R indexe de 1..NB
let checked = false;
let withOverflow = false;

const STAGE_BITS = [1,1,2,4,4];
// stage 2 : add. complet => A,B,R1 en entree, 2 sorties (S,R2) ; R1 est un chiffre d'entree ?

function genStage(){
  NB = STAGE_BITS[stage];
  const av = 0, bv = 0;
  A=[]; B=[];
  for(let i=0;i<NB;i++){ A.push((av>>i)&1); B.push((bv>>i)&1); }
  CIN = 0;
}
function decOf(V){ return V.reduce((acc,b,i)=>acc+b*(1<<i),0); }
function setVal(which, v){
  const V = which==="A"?A:B;
  for(let i=0;i<NB;i++) V[i]=(v>>i)&1;
  // etape 5 : garder le depassement
  if(stage===4){
    const other = decOf(which==="A"?B:A);
    if(v+other<=15){
      // ajuster l'autre nombre pour depasser 15
      const need = 16-v;
      const V2 = which==="A"?B:A;
      for(let i=0;i<NB;i++) V2[i]=((need)&1<<i)?1:0;
    }
  }
}

// vraies valeurs colonne i (chaine complete)
function trueCol(i){
  let r1 = CIN;
  for(let k=0;k<=i;k++){
    const tot = A[k]+B[k]+r1;
    if(k===i) return {a:A[k],b:B[k],r1,s:tot&1,r2:tot>>1};
    r1 = tot>>1;
  }
}

// ---------- portes ----------
function gAnd(x,y){ return `<path d="M ${x-26} ${y-17} L ${x} ${y-17} A 17 17 0 0 1 ${x} ${y+17} L ${x-26} ${y+17} Z" fill="#E3F0EA" stroke="var(--primary)" stroke-width="3"/>`; }
function gOr(x,y,xor){ return `<path d="M ${x-30} ${y-17} Q ${x-12} ${y} ${x-30} ${y+17} Q ${x-2} ${y+12} ${x+22} ${y} Q ${x-2} ${y-12} ${x-30} ${y-17} Z" fill="#E3F0EA" stroke="var(--primary)" stroke-width="3"/>`; }
function gXor(x,y){ return gOr(x,y,true) + `<path d="M ${x-37} ${y-17} Q ${x-19} ${y} ${x-37} ${y+17}" fill="none" stroke="var(--primary)" stroke-width="3"/>`; }
function wirePath(p1,p2){
  const dx=p2[0]-p1[0];
  const mx = (p1[0]+p2[0])/2;
  return `M ${p1[0]} ${p1[1]} C ${mx} ${p1[1]}, ${mx} ${p2[1]}, ${p2[0]} ${p2[1]}`;
}
const W = (p1,p2,on) => `<path class="wire ${on?"on":""}" d="${wirePath(p1,p2)}"/>`;
const pinV = (x,y,v,id) => `<g class="pin ${v?"on":""} ${id?"clickable":""}"${id?` data-pin="${id}"`:""}>${id?`<circle class="hit" cx="${x}" cy="${y}" r="17"/>`:""}<circle cx="${x}" cy="${y}" r="8"/><text x="${x}" y="${y+4.5}" text-anchor="middle" font-size="12" font-weight="700" fill="${v?"var(--accent)":"var(--muted)"}" style="pointer-events:none">${v}</text></g>`;
const gateLbl = (x,y,txt,dy) => `<text x="${x}" y="${dy===undefined?y-26:y+dy}" text-anchor="middle" font-size="10" font-weight="700" fill="var(--primary)">${txt}</text>`;
const dotJ = (x,y,v) => `<circle cx="${x}" cy="${y}" r="4.5" fill="${v?"var(--accent)":"var(--primary)"}"/>`;
const tag = (x,y,txt,on) => `<text x="${x}" y="${y}" text-anchor="middle" font-size="12" font-weight="700" fill="${on?"var(--accent)":"var(--muted)"}">${txt}</text>`;

// ---------- case cliquable (calcul a la main) ----------
function digBox(cx,cy,val,opts){
  const cls = ["dig",opts.cls||"",opts.clickable?"clickable":"fixed"].join(" ").trim();
  const id = opts.id?` data-dig="${opts.id}"`:"";
  return `<g class="${cls}"${id}><rect x="${cx-22}" y="${cy-26}" width="44" height="52" rx="8"/>
    <text x="${cx}" y="${cy+8}" text-anchor="middle">${val===null?"·":val}</text></g>`;
}

// ==================== vue gauche : calcul ====================
function drawHand(){
  const CW = NB>=4 ? 56 : 64, X0 = NB>=4 ? 386 : 330, YR=64, YA=140, YB=216, YS=316;
  const colX = i => X0 - i*CW;
  let s = "";
  // poids en haut
  for(let i=0;i<NB;i++)
    s += `<text x="${colX(i)}" y="16" text-anchor="middle" font-size="11" fill="var(--muted)">2<tspan baseline-shift="super" font-size="8">${i}</tspan></text>`;
  s += `<text x="${colX(NB)}" y="16" text-anchor="middle" font-size="11" fill="var(--muted)">2<tspan baseline-shift="super" font-size="8">${NB}</tspan></text>`;
  // operandes cliquables, etiquetees A et B
  s += `<text x="${colX(NB)+6}" y="${YA+7}" text-anchor="end" font-size="16" font-weight="700" fill="var(--primary)">A</text>`;
  s += `<text x="${colX(NB)+6}" y="${YB+7}" text-anchor="end" font-size="16" font-weight="700" fill="var(--primary)">B</text>`;
  for(let i=0;i<NB;i++){
    s += digBox(colX(i),YA,A[i],{id:`A${i}`,clickable:true});
    s += digBox(colX(i),YB,B[i],{id:`B${i}`,clickable:true});
  }
  // valeur decimale a gauche
  s += `<text x="${colX(NB)-104}" y="${YA+7}" text-anchor="end" font-size="14" font-weight="700" fill="var(--muted)">${decOf(A)}</text>`;
  s += `<text x="${colX(NB)-104}" y="${YB+7}" text-anchor="end" font-size="14" font-weight="700" fill="var(--muted)">${decOf(B)}</text>`;
  s += `<text x="${colX(NB)-78}" y="${YB+8}" text-anchor="end" font-size="24" font-weight="700" fill="var(--accent)">+</text>`;
  s += `<line x1="${colX(NB)-94}" y1="${YB+36}" x2="${colX(0)+24}" y2="${YB+36}" stroke="var(--ink)" stroke-width="2.5"/>`;
  // retenues (calculees)
  for(let i=1;i<=NB;i++) s += digBox(colX(i),YR,trueCol(i-1).r2,{clickable:false});
  if(stage===1) s += digBox(colX(0),YR,CIN,{id:"R1"});
  // somme (calculee)
  for(let i=0;i<NB;i++) s += digBox(colX(i),YS,trueCol(i).s,{clickable:false});
  const tot = decOf(A)+decOf(B)+CIN;
  const ovf5 = stage===4 && tot>15;
  s += digBox(colX(NB),YS,trueCol(NB-1).r2,{cls:ovf5?"bad":"ghost",clickable:false});
  // valeur decimale du resultat (tronquee a NB bits)
  if(stage===4){
    s += `<text x="${colX(NB)-104}" y="${YS+7}" text-anchor="end" font-size="14" font-weight="700" class="${ovf5?"decBad":"decGood"}">${ovf5 ? tot-(1<<NB) : tot}</text>`;
  } else {
    s += `<text x="${colX(NB)-104}" y="${YS+7}" text-anchor="end" font-size="14" font-weight="700" fill="var(--primary)">${tot}</text>`;
  }
  // fleche colonne <-> circuit
  return s;
}

// ==================== vue droite : circuit ====================
function drawCircuit(){
  if(stage===0) return circHalf();
  if(stage===1) return circFull();
  return circChain();
}

// demi-additionneur : A,B -> S (XOR), R (ET)
function circHalf(){
  const a=A[0], b=B[0], s0=a^b, r0=a&&b;
  let s="";
  s+=W([54,90],[180,83],a);
  s+=W([54,210],[180,103],b);
  s+=W([54,90],[184,258],a);
  s+=W([54,210],[184,272],b);
  s+=`<text x="14" y="90" font-size="17" font-weight="700">A</text>${pinV(46,90,a,"A0")}`;
  s+=`<text x="14" y="210" font-size="17" font-weight="700">B</text>${pinV(46,210,b,"B0")}`;
  s+=gXor(215,93); s+=gAnd(215,265);
  s+=gateLbl(200,93,T().gXor); s+=gateLbl(200,265,T().gAnd);
  s+=W([244,93],[376,93],s0); s+=W([236,265],[376,265],r0);
  s+=pinV(391,93,s0)+`<text x="412" y="98" font-size="17" font-weight="700">S</text>`;
  s+=pinV(391,265,r0)+`<text x="412" y="270" font-size="17" font-weight="700">R</text>`;
  // boite en pointilles autour du circuit
  s+=`<rect x="70" y="42" width="290" height="268" rx="14" fill="none" stroke="var(--muted)" stroke-width="1.8" stroke-dasharray="7 5"/>`;
  s+=`<text x="215" y="32" text-anchor="middle" font-size="13" font-weight="700" fill="var(--muted)">${T().box1}</text>`;
  return s;
}

// additionneur complet : 5 portes
function circFull(){
  const t=trueCol(0), a=t.a, b=t.b, r1=t.r1;
  const x1=a^b, S_out=x1^r1, g1=a&&b, g2=x1&&r1, r2=(g1||g2)?1:0;
  let s="";
  // ---- 1) tous les fils (dessous)
  // A : entrée vers XOR1, colonne vers ET1 (A·B)
  s+=W([36,45],[166,56],a);
  s+=W([65,45],[65,305],a); s+=W([65,305],[236,305],a);
  // B : entrée vers XOR1, colonne vers ET1
  s+=W([36,70],[166,70],b);
  s+=W([90,70],[90,291],b); s+=W([90,291],[236,291],b);
  // R0 : ligne horizontale, monte vers XOR2, colonne vers ET2
  s+=W([38,95],[220,95],r1); s+=W([220,95],[280,95],r1);
  s+=W([280,95],[280,77],r1); s+=W([280,77],[326,77],r1);
  s+=W([220,95],[220,219],r1); s+=W([220,219],[316,219],r1);
  // x1 : sortie XOR1 vers XOR2, colonne vers ET2
  s+=W([209,63],[326,63],x1);
  s+=W([235,63],[235,191],x1); s+=W([235,191],[316,191],x1);
  // XOR2 -> S
  s+=W([385,70],[590,70],S_out);
  // ET2 -> OU, ET1 -> OU
  s+=W([277,298],[380,298],g1); s+=W([380,298],[380,259],g1); s+=W([380,259],[440,259],g1);
  s+=W([357,205],[410,205],g2); s+=W([410,205],[410,245],g2); s+=W([410,245],[440,245],g2);
  // OU -> R1
  s+=W([492,252],[590,252],r2);
  // ---- 2) les 4 ronds verts de jonction (sur les fils)
  s+=dotJ(65,45,a); s+=dotJ(90,70,b); s+=dotJ(220,95,r1); s+=dotJ(235,63,x1);
  // ---- 3) les 5 portes (au-dessus des fils)
  s+=gXor(196,63);
  s+=gateLbl(181,63,T().gXor);
  s+=gXor(356,70);
  s+=gateLbl(341,70,T().gXor);
  s+=gAnd(336,205);
  s+=gateLbl(321,205,T().gAnd);
  s+=gAnd(256,298);
  s+=gateLbl(241,298,T().gAnd);
  s+=gOr(470,252);
  s+=gateLbl(470,252,T().gOr);
  // ---- 4) pastilles et étiquettes (tout en haut)
  s+=`<text x="2" y="50" font-size="16" font-weight="700">A</text>${pinV(28,45,a,"A0")}`;
  s+=`<text x="2" y="75" font-size="16" font-weight="700">B</text>${pinV(28,70,b,"B0")}`;
  s+=`<text x="2" y="100" font-size="15" font-weight="700">R₀</text>${pinV(30,95,r1,"R1")}`;
  s+=pinV(604,70,S_out)+`<text x="598" y="52" font-size="17" font-weight="700">S</text>`;
  s+=pinV(604,252,r2)+`<text x="598" y="234" font-size="17" font-weight="700">R₁</text>`;
  // boite en pointilles autour du circuit
  s+=`<rect x="50" y="24" width="536" height="322" rx="14" fill="none" stroke="var(--muted)" stroke-width="1.8" stroke-dasharray="7 5"/>`;
  s+=`<text x="318" y="14" text-anchor="middle" font-size="13" font-weight="700" fill="var(--muted)">${T().box2}</text>`;
  return s;
}

// chaine d'additionneurs en boites (2 ou 4 bits)
function circChain(){
  const labels = stage===2 ? [T().half, T().full] : [T().half, T().full, T().full, T().full];
  const boxW=112, x0=NB>=4?86:200, Y=130, boxH=96;
  const gap=(600-x0-NB*boxW)/(NB-1);
  const yMid = Y+boxH/2;
  let s="";
  // ---- 1) tous les fils d abord (sous les boites et les pastilles)
  for(let i=0;i<NB;i++){
    const bx = x0+(NB-1-i)*(boxW+gap);
    const t = trueCol(i);
    const cxA = bx+boxW/2-24, cxB = bx+boxW/2+24, cxS = bx+boxW/2;
    s+=W([cxA,Y-30],[cxA,Y],t.a);
    s+=W([cxB,Y-30],[cxB,Y],t.b);
    s+=W([cxS,Y+boxH],[cxS,Y+boxH+22],t.s);
    if(i<NB-1){
      const bx2 = x0+(NB-2-i)*(boxW+gap);
      s+=W([bx,yMid],[bx2+boxW,yMid],t.r2);
      s+=tag((bx+bx2+boxW)/2, yMid-12, `${t.r2}`, t.r2);
    } else {
      s+=W([bx,yMid],[bx-42,yMid],t.r2);
    }
  }
  // ---- 2) les boites (par-dessus les fils)
  for(let i=0;i<NB;i++){
    const bx = x0+(NB-1-i)*(boxW+gap);
    const cxS = bx+boxW/2;
    s+=`<rect x="${bx}" y="${Y}" width="${boxW}" height="${boxH}" rx="12" fill="${labels[i]===T().half?"#FCFBF7":"var(--card)"}" stroke="var(--primary)" stroke-width="2.5"/>`;
    s+=`<text x="${cxS}" y="${Y+boxH/2+5}" text-anchor="middle" font-size="10.5" font-weight="700" fill="var(--primary)">${labels[i]}</text>`;
  }
  // ---- 3) pastilles et etiquettes (tout en haut)
  for(let i=0;i<NB;i++){
    const bx = x0+(NB-1-i)*(boxW+gap);
    const t = trueCol(i);
    const cxA = bx+boxW/2-24, cxB = bx+boxW/2+24, cxS = bx+boxW/2;
    s+=`<text x="${cxA}" y="${Y-58}" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--primary)">A<tspan baseline-shift="sub" font-size="9">${i}</tspan></text>`;
    s+=`<text x="${cxB}" y="${Y-58}" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--primary)">B<tspan baseline-shift="sub" font-size="9">${i}</tspan></text>`;
    s+=pinV(cxA,Y-38,t.a,`A${i}`);
    s+=pinV(cxB,Y-38,t.b,`B${i}`);
    s+=pinV(cxS,Y+boxH+34,t.s)+`<text x="${cxS}" y="${Y+boxH+60}" text-anchor="middle" font-size="12" font-weight="700">S<tspan baseline-shift="sub" font-size="9">${i}</tspan></text>`;
    if(i===NB-1){
      s+=pinV(bx-54,yMid,t.r2);
      if(stage===4){
      s+=`<text x="${bx-70}" y="${yMid+4}" text-anchor="end" font-size="13" font-weight="700">C</text>`;
        s+=`<text x="${bx-54}" y="${yMid+22}" text-anchor="middle" font-size="10.5" fill="var(--muted)">${T().flagL1}</text>`;
        s+=`<text x="${bx-54}" y="${yMid+35}" text-anchor="middle" font-size="10.5" fill="var(--muted)">${T().flagL2}</text>`;
      } else {
        s+=`<text x="${bx-70}" y="${yMid+4}" text-anchor="end" font-size="13" font-weight="700">R</text>`;
      }
    }
  }
  return s;
}

// ==================== rendu ====================
function render(){
  $("sceneL").innerHTML = drawHand();
  $("sceneR").innerHTML = drawCircuit();
  const toggle = id => {
    if(id==="R1"){ CIN = 1-CIN; }
    else{
      const i=+id.slice(1);
      if(id[0]==="A") A[i]=1-A[i]; else B[i]=1-B[i];
    }
    render();
  };
  document.querySelectorAll(".dig[data-dig]").forEach(el=>{ el.onclick=()=>toggle(el.dataset.dig); });
  document.querySelectorAll(".pin.clickable").forEach(el=>{ el.onclick=()=>toggle(el.dataset.pin); });
  $("expl").innerHTML = T().expl[stage];
  if(stage===4){
    const sum = decOf(A)+decOf(B)+CIN;
    const ovf = sum>15;
    $("expl").innerHTML += `<div class="ovf ${ovf?"show":""}" style="margin-top:10px">${T().ovfTxt} ${sum}, ${T().ovfTxt2}</div>`;
  }
}
function renderSteps(){
  $("steps").innerHTML = T().steps.map((n,i)=>{
    const cls = i===stage?"sel":"";
    return `<button class="step ${cls}" data-s="${i}">${n}</button>`;
  }).join("");
  $("steps").querySelectorAll(".step").forEach(el=>{
    el.onclick=()=>{ stage=+el.dataset.s; genStage(); renderSteps(); render(); };
  });
}

function showMsg(t,cls){ const m=$("msg"); m.className=cls; m.style.display="block"; m.textContent=t; }


function applyLang(){try{localStorage.setItem("fj-lang",lang);}catch(e){}
  document.getElementById("backLink").textContent=T().backList;
  document.documentElement.lang=lang;
  $("kicker").textContent = lang==="fr"?"Architecture des ordinateurs":"Computer architecture";
  $("title").textContent=T().title;
  $("langBtn").textContent = lang==="fr"?"English":"Français";
  $("fsLabel").textContent = document.fullscreenElement?T().fsExit:T().fs;
  $("instruction").textContent=T().instruction;
  $("rotateHint").textContent=T().rotateHint;
  $("leftTitle").textContent=T().leftHand;
  $("rightTitle").textContent=T().rightCircuit;
  renderSteps(); render();
}
$("langBtn").onclick=()=>{ lang=lang==="fr"?"en":"fr"; applyLang(); };
$("fsBtn").onclick=()=>{
  if(document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen().catch(()=>{});
};
document.addEventListener("fullscreenchange",()=>{ $("fsLabel").textContent=document.fullscreenElement?T().fsExit:T().fs; });

genStage();
applyLang();
</script>

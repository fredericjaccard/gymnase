<!DOCTYPE html><html lang="fr"><head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Portail — Applications d'informatique</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2320241F'/%3E%3Ctext x='32' y='43' font-family='Arial,sans-serif' font-size='28' font-weight='bold' fill='%23FFFFFF' text-anchor='middle'%3EFJ%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quattrocento+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBFAF6; --card:#F7F6F2; --primary:#155E4C; --primaryLight:#E3F0EA;
  --accent:#D96A08; --accentLight:#FDEBD8; --line:#D8D5CB; --ink:#20241F; --muted:#6E726B;
}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);margin:0;padding:32px 16px;min-height:100vh;
  font-family:'Quattrocento Sans','Segoe UI',system-ui,sans-serif;color:var(--ink)}
button{font:inherit;cursor:pointer}
.app{max-width:860px;margin:0 auto}
.topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.kicker{color:var(--accent);font-weight:700;letter-spacing:.14em;font-size:12px;text-transform:uppercase;margin-bottom:4px}
h1{font-size:24px;font-weight:700}
.btns{display:flex;gap:8px;flex-shrink:0;padding-top:2px}
.iconBtn{min-width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card);
  color:var(--primary);font-weight:700;font-size:13px;display:inline-flex;align-items:center;justify-content:center;padding:0 10px}
.iconBtn:hover{border-color:var(--primary)}
.sub{font-size:15px;color:var(--muted);margin:6px 0 24px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.cardApp{display:block;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);
  border-radius:14px;padding:20px;transition:border-color .15s,transform .15s}
.cardApp:hover{border-color:var(--primary);transform:translateY(-2px)}
.cardApp .em{font-size:34px;line-height:1;margin-bottom:12px}
.cardApp h2{font-size:17px;font-weight:700;margin-bottom:6px}
.cardApp p{font-size:13.5px;line-height:1.5;color:var(--muted)}
.chapTitle{font-size:13px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.12em;margin:28px 0 12px}
.chapTitle:first-of-type{margin-top:0}
footer{margin-top:32px;text-align:center;font-size:13px;color:var(--muted)}
footer a{color:inherit;text-decoration:none}
footer a:hover{text-decoration:underline}
@media(max-width:640px){
  body{padding:20px 12px}
  h1{font-size:19px}
  .grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="app">
<div class="topbar">
  <div>
    <div class="kicker" id="kicker">INFORMATIQUE · GYMNASE</div>
    <h1 id="title"></h1>
  </div>
  <div class="btns">
    <button class="iconBtn" id="langBtn" title="English">EN</button>
    <button class="iconBtn" id="fsBtn" title="Plein écran">⛶</button>
  </div>
</div>
<div class="sub" id="sub"></div>
<div id="content"></div>
<footer><a href="https://fredericjaccard.com">Frédéric Jaccard</a></footer>
</div>

<script>
let lang="fr";
const I18N={
 fr:{
  kicker:"INFORMATIQUE · GYMNASE",
  title:"Applications interactives",
  sub:"Cliquez sur une application pour l'ouvrir. Toutes fonctionnent directement dans le navigateur, sans installation.",
  chapters:{rep:"Représentation de l'information",algo:"Algorithmique",arch:"Architecture des ordinateurs"},
  apps:[
   {file:"revision_quiz.html",em:"📝",title:"Quiz de révision",
    desc:"Questions générées à l'infini sur le binaire, l'hexadécimal, les couleurs, les tailles, les images, les caractères et AlgoPython.",cat:"rep"},
   {file:"rvb.html",em:"🎨",title:"Synthèse additive RVB",
    desc:"Réglez l'intensité des trois projecteurs rouge, vert et bleu : la couleur résultante et ses codes décimal, hexadécimal et binaire se mettent à jour en direct.",cat:"rep"},
   {file:"machine_a_instructions.html",em:"🤖",title:"Machine à instructions",
    desc:"Programmez un robot case par case : la machine fait exactement ce que vous demandez, pas ce que vous pensez !",cat:"algo"},
   {file:"cuisine_litterale.html",em:"🍳",title:"Cuisine littérale",
    desc:"Remettez les étapes d'une recette dans le bon ordre : tartine, œuf à la coque, pâtes et fondue au fromage.",cat:"algo"},
   {file:"course_des_tris.html",em:"🏁",title:"Course des tris",
    desc:"Cinq algorithmes de tri s'affrontent en direct sur la même liste. Qui gagnera : bulles, sélection, insertion, fusion ou rapide ?",cat:"algo"},
   {file:"rendu_de_monnaie.html",em:"🪙",title:"Le rendu de monnaie",
    desc:"Rendez la monnaie avec le moins de pièces possible : le glouton gagne avec les francs suisses… mais se trompe dans d'autres systèmes !",cat:"algo"},
   {file:"sac_a_dos.html",em:"🎒",title:"Sac à dos glouton",
    desc:"Remplissez votre sac à dos avec la meilleure valeur possible… et découvrez quand la stratégie gloutonne se trompe.",cat:"algo"},
   {file:"revision_algorithmique.html",em:"📝",title:"Révision — Algorithmique II",
    desc:"Questions générées à l'infini sur les 7 leçons : algorithmes, tris, complexité, recherche et algorithmes gloutons.",cat:"algo"},
   {file:"inside_the_machine.html",em:"🖥️",title:"Dans l'ordinateur",
    desc:"Explorez les composants d'un ordinateur — CPU, RAM, disque, périphériques — et testez vos connaissances en mode quiz.",cat:"arch"},
   {file:"architecture_ordinateur.html",em:"🔍",title:"Dans l'ordinateur en 3D",
    desc:"Explorez une tour et un portable en 3D, cliquez sur les composants et suivez le trajet d'une donnée, de l'entrée à la sortie.",cat:"arch"},
   {file:"voyage_donnee.html",em:"⌨️",title:"Le voyage d'une donnée",
    desc:"Suivez le signal d'une touche pressée à travers le clavier, le CPU, la RAM et la carte graphique jusqu'à l'écran.",cat:"arch"},
   {file:"transistor_porte.html",em:"🔌",title:"Du transistor à la porte",
    desc:"Ouvrez et fermez des transistors pour comprendre comment on construit les portes NON, ET et OU.",cat:"arch"},
   {file:"portes_logiques.html",em:"🚪",title:"Portes logiques",
    desc:"Testez les quatre portes à l'aide d'interrupteurs, puis reconstruisez leur table de vérité.",cat:"arch"},
   {file:"circuit_mystere.html",em:"🕵️",title:"Circuit mystère",
    desc:"Une porte se cache dans la boîte noire : observez ses entrées et ses sorties pour l'identifier sans vous tromper.",cat:"arch"},
   {file:"constructeur_nand.html",em:"🧱",title:"Constructeur NON-ET",
    desc:"Reliez des portes NON-ET pour fabriquer NON, ET, OU et OU exclusif — comme un vrai processeur.",cat:"arch"},
   {file:"addition_binaire.html",em:"➕",title:"Addition binaire",
    desc:"Additionnez à la main et regardez le circuit en direct : demi-additionneur, additionneur complet et dépassement de capacité.",cat:"arch"}
  ],
  fsTitle:"Plein écran",langBtn:"EN"
 },
 en:{
  kicker:"COMPUTER SCIENCE · HIGH SCHOOL",
  title:"Interactive applications",
  sub:"Click an application to open it. They all run directly in the browser, with no installation.",
  chapters:{rep:"Representing information",algo:"Algorithmics",arch:"Computer architecture"},
  apps:[
   {file:"revision_quiz.html",em:"📝",title:"Revision quiz",
    desc:"Infinitely generated questions on binary, hexadecimal, colors, file sizes, images, characters and AlgoPython.",cat:"rep"},
   {file:"rvb.html",em:"🎨",title:"RGB additive synthesis",
    desc:"Adjust the intensity of the red, green and blue spotlights: the resulting color and its decimal, hexadecimal and binary codes update live.",cat:"rep"},
   {file:"machine_a_instructions.html",em:"🤖",title:"Instruction machine",
    desc:"Program a robot cell by cell: the machine does exactly what you ask, not what you think!",cat:"algo"},
   {file:"cuisine_litterale.html",em:"🍳",title:"Literal cooking",
    desc:"Put the steps of a recipe back in the right order: toast, boiled egg, pasta and cheese fondue.",cat:"algo"},
   {file:"course_des_tris.html",em:"🏁",title:"Sorting race",
    desc:"Five sorting algorithms compete live on the same list. Who wins: bubble, selection, insertion, merge or quicksort?",cat:"algo"},
   {file:"rendu_de_monnaie.html",em:"🪙",title:"Making change",
    desc:"Give change with as few coins as possible: greedy wins with Swiss francs… but fails in other coin systems!",cat:"algo"},
   {file:"sac_a_dos.html",em:"🎒",title:"Greedy knapsack",
    desc:"Fill your knapsack with the best possible value… and discover when the greedy strategy gets it wrong.",cat:"algo"},
   {file:"revision_algorithmique.html",em:"📝",title:"Revision — Algorithmics II",
    desc:"Infinitely generated questions on the 7 lessons: algorithms, sorts, complexity, search and greedy algorithms.",cat:"algo"},
   {file:"inside_the_machine.html",em:"🖥️",title:"Inside the Machine",
    desc:"Explore the components of a computer — CPU, RAM, drive, peripherals — and test your knowledge in quiz mode.",cat:"arch"},
   {file:"architecture_ordinateur.html",em:"🔍",title:"Inside the computer",
    desc:"Explore a desktop tower and a laptop in 3D, click the components and follow the path of data, from input to output.",cat:"arch"},
   {file:"voyage_donnee.html",em:"⌨️",title:"The journey of a piece of data",
    desc:"Follow the signal of a keystroke through the keyboard, CPU, RAM and graphics card all the way to the screen.",cat:"arch"},
   {file:"transistor_porte.html",em:"🔌",title:"From the transistor to the gate",
    desc:"Open and close transistors to understand how NOT, AND and OR gates are built.",cat:"arch"},
   {file:"portes_logiques.html",em:"🚪",title:"Logic gates",
    desc:"Test the four gates with switches, then rebuild their truth tables.",cat:"arch"},
   {file:"circuit_mystere.html",em:"🕵️",title:"Mystery circuit",
    desc:"A gate hides in the black box: observe its inputs and outputs to identify it without a mistake.",cat:"arch"},
   {file:"constructeur_nand.html",em:"🧱",title:"NAND-only builder",
    desc:"Wire NAND gates to build NOT, AND, OR and XOR — just like a real processor.",cat:"arch"},
   {file:"addition_binaire.html",em:"➕",title:"Binary addition",
    desc:"Add by hand and watch the circuit live: half adder, full adder and overflow.",cat:"arch"}
  ],
  fsTitle:"Fullscreen",langBtn:"FR"
 }
};
const T=()=>I18N[lang];

function applyLang(){
  const t=T();
  document.documentElement.lang=lang;
  document.getElementById("kicker").textContent=t.kicker;
  document.getElementById("title").textContent=t.title;
  document.getElementById("sub").textContent=t.sub;
  document.getElementById("langBtn").textContent=t.langBtn;
  document.getElementById("fsBtn").title=t.fsTitle;
  document.title=t.title;
  const box=document.getElementById("content");
  box.innerHTML="";
  ["rep","algo","arch"].forEach(cat=>{
    const apps=t.apps.filter(a=>a.cat===cat);
    if(!apps.length)return;
    const h=document.createElement("div");h.className="chapTitle";h.textContent=t.chapters[cat];box.appendChild(h);
    const g=document.createElement("div");g.className="grid";
    apps.forEach(a=>{
      const c=document.createElement("a");
      c.className="cardApp";c.href=a.file;
      c.innerHTML=`<div class="em">${a.em}</div><h2>${a.title}</h2><p>${a.desc}</p>`;
      g.appendChild(c);
    });
    box.appendChild(g);
  });
}
document.getElementById("langBtn").onclick=()=>{lang=lang==="fr"?"en":"fr";applyLang();};

const fsBtn=document.getElementById("fsBtn");
function isFs(){return document.fullscreenElement||document.webkitFullscreenElement;}
fsBtn.onclick=()=>{
  const el=document.documentElement;
  if(isFs()){(document.exitFullscreen||document.webkitExitFullscreen).call(document);}
  else{const req=el.requestFullscreen||el.webkitRequestFullscreen;if(req)req.call(el);}
};
function fsChange(){fsBtn.style.background=isFs()?"var(--primaryLight)":"var(--card)";}
document.addEventListener("fullscreenchange",fsChange);
document.addEventListener("webkitfullscreenchange",fsChange);

applyLang();
</script>
</body></html>

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Atelier inversé : assemblez des briques pour fabriquer un titre putaclic, repérez les mécaniques d'accroche dans des exemples, puis analysez votre propre fil.">
<title>La fabrique à clics · Gymnase — Frédéric Jaccard</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2320241F'/%3E%3Ctext x='32' y='43' font-family='Arial,sans-serif' font-size='28' font-weight='bold' fill='%23FFFFFF' text-anchor='middle'%3EFJ%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Quattrocento+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBFAF6; --card:#F7F6F2; --primary:#155E4C; --primaryLight:#E3F0EA;
  --accent:#D96A08; --accentLight:#FDEBD8; --line:#D8D5CB; --ink:#20241F; --muted:#6E726B;
  --error:#C84B31;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:"Quattrocento Sans",sans-serif;padding:20px}
.wrap{max-width:1080px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px;margin-bottom:16px}
.kicker{font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
h1{font-size:26px;color:var(--primary)}
.hdrBtns{display:flex;gap:8px}
button{font-family:inherit;font-size:14px;font-weight:700;padding:8px 16px;border-radius:10px;
  border:2px solid var(--primary);background:var(--card);color:var(--primary);cursor:pointer}
button:hover{background:var(--primaryLight)}
.instruction{background:var(--primaryLight);border-radius:12px;padding:12px 16px;margin-bottom:16px;font-size:15px}
footer{margin-top:20px;text-align:center;font-size:13px;color:var(--muted)}
footer a{color:var(--muted);font-weight:400;text-decoration:none}
footer a:hover{text-decoration:underline}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.tab{position:relative;font-size:14px}
.tab.active{background:var(--primary);color:#fff}
.tab.locked{opacity:.35}
.tab.solved::after{content:"★";position:absolute;top:-15px;left:50%;transform:translateX(-50%);color:var(--accent);font-size:13px}
#tabMsg{font-size:13px;color:var(--error);min-height:18px;margin-bottom:6px;font-weight:700}
section{display:none}
section.on{display:block}
h2{font-size:20px;color:var(--primary);margin-bottom:4px}
.sub{font-size:14px;color:var(--muted);margin-bottom:14px}
.l1grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
.brow{margin-bottom:14px}
.blab{font-weight:700;font-size:14px;color:var(--primary);margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:13px;font-weight:400;padding:6px 12px;min-height:44px;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px}
.chip:hover{background:var(--primaryLight)}
.chip.sel{border-color:var(--accent);background:var(--accentLight);font-weight:700;color:var(--ink)}
#subject{width:100%;font-family:inherit;font-size:15px;padding:10px 12px;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
#subject:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.mission{font-size:14px;font-weight:700;color:var(--accent);margin:4px 0 10px}
.pvLab{font-size:13px;font-weight:700;color:var(--muted);margin-bottom:6px}
.pvCard{background:var(--card);border:2px solid var(--line);border-radius:16px;overflow:hidden}
.pvThumb{background:var(--primaryLight);min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:18px;position:relative}
.pvTitle{font-size:20px;font-weight:700;color:var(--primary);text-align:center;line-height:1.35}
.pvTitle .seg{background:var(--accentLight);border-radius:6px;padding:0 5px}
.play{width:46px;height:46px;border-radius:50%;background:#fff;border:2px solid var(--primary);display:flex;align-items:center;justify-content:center}
.play::after{content:"";border-left:16px solid var(--accent);border-top:10px solid transparent;border-bottom:10px solid transparent;margin-left:4px}
.pvMeta{padding:10px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--primary);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.pvName{font-weight:700;font-size:14px}
.pvViews{font-size:13px;color:var(--muted)}
.gaugeLab{font-size:13px;font-weight:700;color:var(--muted);margin:12px 0 6px}
.gauge{display:flex;gap:6px}
.gseg{flex:1;height:18px;border-radius:6px;border:2px solid var(--line);background:var(--bg)}
.gseg.f1{background:var(--primary)}
.gseg.f2{background:var(--accent)}
.gseg.f3{background:var(--accent)}
.gseg.f4{background:var(--error)}
.mrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.mchip{border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700;border:2px solid var(--line);background:var(--card);color:var(--muted);display:inline-flex;align-items:center;gap:6px;transition:opacity .15s}
.mchip.on.cur{border-color:var(--accent);color:var(--accent);background:var(--accentLight)}
.mchip.on.fea{border-color:var(--error);color:var(--error);background:var(--accentLight)}
.mchip.on.pro{border-color:var(--primary);color:var(--primary);background:var(--primaryLight)}
.mchip.on.num{border-color:var(--ink);color:var(--ink);background:var(--card)}
.mchip.off{opacity:.35}
.mdesc{font-size:13px;color:var(--muted);margin-top:8px;line-height:1.45}
.mdesc b{color:var(--ink)}
.fb{border-radius:12px;padding:12px 14px;font-size:14px;margin-top:12px;border:2px solid;display:none;line-height:1.45}
.fb.ok{display:block;background:var(--primaryLight);border-color:var(--primary);color:var(--primary)}
.fb.ko{display:block;background:var(--accentLight);border-color:var(--error);color:var(--ink)}
.actRow{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.nextBtn{background:var(--accent);border-color:var(--accent);color:#fff;display:none}
.nextBtn:hover{background:var(--accent);filter:brightness(1.08)}
.case{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
.caseT{font-size:16px;font-weight:700;margin-bottom:10px;line-height:1.4}
.cFb{display:none;margin-top:10px;font-size:13px;border-radius:10px;padding:10px 12px;border:2px solid;line-height:1.45}
.cFb.ok{display:block;background:var(--primaryLight);border-color:var(--primary)}
.cFb.ko{display:block;background:var(--accentLight);border-color:var(--error)}
.cFb .why{display:block;margin-top:6px;color:var(--ink)}
.miss{color:var(--error);font-weight:700}
#score2{font-size:16px;font-weight:700;color:var(--primary);margin:6px 0 12px;display:none}
.ta{width:100%;font-family:inherit;font-size:15px;padding:10px 12px;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);min-height:90px;resize:vertical}
.l3grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.panel{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:14px}
.panel h3{font-size:15px;color:var(--primary);margin-bottom:10px}
.chkRow{display:flex;align-items:center;gap:10px;min-height:44px;font-size:14px;cursor:pointer}
.chkRow input{width:20px;height:20px;accent-color:var(--primary);cursor:pointer}
.hits{font-size:12px;color:var(--muted);margin-top:4px;min-height:16px}
.hits b{color:var(--ink);font-weight:400}
.refl{margin-top:14px}
.refl h3{font-size:15px;color:var(--primary);margin-bottom:8px}
.refl ul{margin-left:20px;font-size:14px;line-height:1.6}
#fireworks{position:fixed;inset:0;pointer-events:none;z-index:50;display:none}
@media(max-width:640px){
  body{padding:14px}
  h1{font-size:22px}
  .hdrBtns{width:100%}
  .hdrBtns button{flex:1;min-height:44px}
  .l1grid,.l3grid{grid-template-columns:1fr}
  .tabs{flex-wrap:nowrap;overflow-x:auto}
  .tab{flex:1;white-space:nowrap}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>
</head>
<body>

      </div>
      <div class="gaugeLab" id="gaugeLab"></div>
      <div class="gauge" id="gauge" aria-hidden="true"><div class="gseg"></div><div class="gseg"></div><div class="gseg"></div><div class="gseg"></div></div>

</section>

<section id="s2">
  <h2 id="l2h"></h2>
  <div class="sub" id="l2sub"></div>
  <div id="cases"></div>
  <div id="score2" aria-live="polite"></div>
  <div class="actRow">
    <button id="validateL2" type="button"></button>
    <button id="retry2" type="button" style="display:none"></button>
    <button id="next2" type="button" class="nextBtn"></button>
  </div>
  <div class="fb" id="l2Msg" aria-live="polite"></div>
</section>

<section id="s3">
  <h2 id="l3h"></h2>
  <div class="sub" id="l3sub"></div>
  <textarea class="ta" id="feedTitle"></textarea>
  <div class="actRow">
    <button id="analyze3" type="button"></button>
    <button id="finish3" type="button"></button>
  </div>
  <div class="l3grid">
    <div class="panel">
      <h3 id="selfH"></h3>
      <label class="chkRow"><input type="checkbox" id="sc_cur"><span id="sc_cur_l"></span></label>
      <label class="chkRow"><input type="checkbox" id="sc_fea"><span id="sc_fea_l"></span></label>
      <label class="chkRow"><input type="checkbox" id="sc_pro"><span id="sc_pro_l"></span></label>
      <label class="chkRow"><input type="checkbox" id="sc_num"><span id="sc_num_l"></span></label>
    </div>
    <div class="panel">
      <h3 id="autoH"></h3>
      <div class="mrow" id="autoRow"></div>
      <div class="hits" id="autoHits"></div>
    </div>
  </div>
  <div class="fb" id="l3Msg" aria-live="polite"></div>
  <div class="refl"><h3 id="reflH"></h3><ul id="reflList"></ul></div>
  <div class="fb" id="finalMsg" aria-live="polite"></div>
</section>

<footer><a href="index.html" id="backLink"></a> · <a href="https://fredericjaccard.com">Frédéric Jaccard</a></footer>
</div>
<canvas id="fireworks"></canvas>

const KW = {
  fr: {
    cur: ["jamais", "secret", "surprendre", "choqu", "révél", "cach", "ce que", "personne ne vous dit", "deviner", "inattendu", "improbable", "imaginez"],

  },

    cur: ["never", "secret", "surprise", "shock", "revealed", "hidden", "hiding", "what nobody", "guess", "unbelievable", "won't believe"],
    fea: ["warning", "urgent", "alert", "danger", "stop", "alarm", "avoid", "fear", "threat", "risk", "ban", "never again"],

/* ================= État ================= */
let lvl = 1;
let sel = { num: 0, hook: 0, end: 0 };
let subject = "";
let subjectTouched = false;
let progress = { l1: false, l2: false };
try { const p = JSON.parse(localStorage.getItem("fabrique-clics-progress")); if (p) { progress.l1 = !!p.l1; progress.l2 = !!p.l2; } } catch (e) {}
function saveProgress(){ try { localStorage.setItem("fabrique-clics-progress", JSON.stringify(progress)); } catch (e) {} }
let detSel = [];
let detDone = false;
let auto = null;
let mySel = { cur: false, fea: false, pro: false, num: false };

function maxUnlocked(){ return progress.l1 ? (progress.l2 ? 3 : 2) : 1; }
function esc(s){ return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
function currentMechs(){
  const B = BRICKS[lang];
  const s = new Set();
  [B.num[sel.num], B.hook[sel.hook], B.end[sel.end]].forEach(b => (b.m || []).forEach(x => s.add(x)));
  return s;
}
function detect(text){
  const low = " " + text.toLowerCase() + " ";
  const K = KW[lang];
  const q1 = lang === "fr" ? "« " : "“", q2 = lang === "fr" ? " »" : "”";
  const hits = {};
  MECHS.forEach(m => {
    hits[m] = [];
    K[m].forEach(k => {
      if (k instanceof RegExp) { if (k.test(text)) hits[m].push("0–9"); }
      else if (low.indexOf(k) !== -1) hits[m].push(q1 + k + q2);
    });
  });
  return { set: new Set(MECHS.filter(m => hits[m].length > 0)), hits: hits };
}

/* ================= Niveau 1 : la fabrique ================= */
function renderBricks(){
  const B = BRICKS[lang];
  [["rowNum", "num"], ["rowHook", "hook"], ["rowEnd", "end"]].forEach(([rid, key]) => {
    const box = $(rid); box.innerHTML = "";
    B[key].forEach((b, i) => {
      const c = document.createElement("button");
      c.type = "button"; c.className = "chip" + (sel[key] === i ? " sel" : "");
      c.textContent = b.t; c.setAttribute("aria-pressed", sel[key] === i);
      c.onclick = () => { sel[key] = i; renderBricks(); renderPreview(); };
      box.appendChild(c);
    });
  });
  $("subject").placeholder = T().subjPh;
  const dl = $("subjList"); dl.innerHTML = "";
  T().subjList.forEach(s => { const o = document.createElement("option"); o.value = s; dl.appendChild(o); });
}

function renderPreview(){
  const B = BRICKS[lang];
  const parts = [];
  if (sel.num > 0) parts.push({ txt: B.num[sel.num].t, seg: true });
  if (sel.hook > 0) parts.push({ txt: B.hook[sel.hook].t, seg: true });
  parts.push({ txt: subject.trim(), seg: false });
  if (sel.end > 0) parts.push({ txt: B.end[sel.end].t, seg: true });
  $("pvTitle").innerHTML = parts.map(p =>
    p.txt ? (p.seg ? '<span class="seg">' + esc(p.txt) + '</span>' : esc(p.txt))
          : '<span style="color:var(--muted)">' + esc(T().subjPh) + "</span>"
  ).join(" ");
  const n = currentMechs().size;
  const segs = $("gauge").children;
  for (let i = 0; i < 4; i++) segs[i].className = "gseg" + (i < n ? " f" + Math.max(1, n) : "");
  $("gaugeLab").textContent = T().gaugeLab + " : " + n + " / 4";
  const row = $("mechRow"); row.innerHTML = "";
  MECHS.forEach(m => {
    const c = document.createElement("span");
    c.className = "mchip " + m + (currentMechs().has(m) ? " on" : " off");
    c.textContent = T().mechName[m];
    row.appendChild(c);
  });
  $("mechDesc").innerHTML = MECHS.map(m => "<b>" + T().mechName[m] + "</b> : " + T().mechDesc[m]).join("<br>");
}

function validateL1(){
  const msg = $("l1Msg");
  if (!subject.trim()) { msg.className = "fb ko"; msg.textContent = T().l1nosubj; return; }
  const n = currentMechs().size;
  if (n >= 3) {
    msg.className = "fb ok"; msg.textContent = T().l1win(n);
    progress.l1 = true; saveProgress();
    $("next1").style.display = "inline-block";
    renderTabs();
  } else {
    msg.className = "fb ko"; msg.textContent = T().l1more(n);
  }
}

/* ================= Niveau 2 : le détective ================= */
function renderCases(){
  const cases = CASES[lang];
  if (detSel.length !== cases.length) detSel = cases.map(() => ({ cur: false, fea: false, pro: false, num: false }));
  const box = $("cases"); box.innerHTML = "";
  cases.forEach((cs, i) => {
    const card = document.createElement("div"); card.className = "case";
    const t = document.createElement("div"); t.className = "caseT"; t.textContent = (i + 1) + ". " + cs.t;
    card.appendChild(t);
    const row = document.createElement("div"); row.className = "chips";
    MECHS.forEach(m => {
      const c = document.createElement("button");
      c.type = "button"; c.className = "chip" + (detSel[i][m] ? " sel" : "");
      c.textContent = T().mechName[m]; c.setAttribute("aria-pressed", detSel[i][m]);
      c.onclick = () => { detSel[i][m] = !detSel[i][m]; renderCases(); };
      row.appendChild(c);
    });
    card.appendChild(row);
    const fb = document.createElement("div"); fb.className = "cFb"; fb.id = "cfb" + i;
    card.appendChild(fb);
    box.appendChild(card);
  });
  if (detDone) fillL2Feedback();
}

function fillL2Feedback(){
  const cases = CASES[lang];
  let okCount = 0;
  cases.forEach((cs, i) => {
    const fb = $("cfb" + i); if (!fb) return;
    const expected = new Set(cs.mechs);
    let exact = expected.size === MECHS.filter(m => detSel[i][m]).length;
    MECHS.forEach(m => { if (expected.has(m) !== !!detSel[i][m]) exact = false; });
    const missed = MECHS.filter(m => expected.has(m) && !detSel[i][m]).map(m => T().mechName[m]);
    const extra = MECHS.filter(m => !expected.has(m) && detSel[i][m]).map(m => T().mechName[m]);
    fb.className = "cFb " + (exact ? "ok" : "ko");
    let html = (exact ? T().exact : T().notExact) + ' <span class="why">' + T().why2[i] + "</span>";
    if (!exact) {
      if (missed.length) html += '<br><span class="miss">' + T().cmpMissing + missed.join(", ") + "</span>";
      if (extra.length) html += '<br><span class="miss">' + T().cmpExtra + extra.join(", ") + "</span>";
    }
    fb.innerHTML = html;
    if (exact) okCount++;
  });
  return okCount;
}

function validateL2(){
  detDone = true;
  renderCases();
  const okCount = fillL2Feedback();
  $("score2").style.display = "block";
  $("score2").textContent = T().score2(okCount, CASES[lang].length);
  const msg = $("l2Msg");
  if (okCount >= 3) {
    msg.className = "fb ok"; msg.textContent = T().l2win;
    progress.l2 = true; saveProgress();
    $("next2").style.display = "inline-block";
    renderTabs();
  } else {
    msg.className = "fb ko"; msg.textContent = T().l2fail;
    $("retry2").style.display = "inline-block";
  }
}

function retryL2(){
  detDone = false;
  detSel = CASES[lang].map(() => ({ cur: false, fea: false, pro: false, num: false }));
  $("retry2").style.display = "none";
  $("score2").style.display = "none";
  $("l2Msg").className = "fb";
  renderCases();
}

/* ================= Niveau 3 : mon fil ================= */
function renderL3(){
  $("selfH").textContent = T().selfH;
  $("autoH").textContent = T().autoH;
  $("reflH").textContent = T().reflH;
  MECHS.forEach(m => { $("sc_" + m + "_l").textContent = T().mechName[m]; });

  T().refl.forEach(r => { const li = document.createElement("li"); li.textContent = r; ul.appendChild(li); });
  renderAuto();
}

function renderAuto(){
  const row = $("autoRow"); row.innerHTML = "";
  const set = auto ? auto.set : new Set();
  MECHS.forEach(m => {
    const c = document.createElement("span");
    c.className = "mchip " + m + (set.has(m) ? " on" : " off");
    c.textContent = T().mechName[m];
    row.appendChild(c);
  });
  if (!auto) { $("autoHits").textContent = ""; return; }
  const parts = MECHS.filter(m => auto.hits[m].length)
    .map(m => "<b>" + T().mechName[m] + "</b> : " + auto.hits[m].join(", "));
  $("autoHits").innerHTML = parts.length ? T().hitsLab + parts.join(" · ") : T().autoEmpty;
}

function analyze3(){
  const msg = $("l3Msg");
  const text = $("feedTitle").value.trim();
  if (!text) { msg.className = "fb ko"; msg.textContent = T().noTitle; return; }
  auto = detect(text);
  renderAuto();
  MECHS.forEach(m => { mySel[m] = $("sc_" + m).checked; });
  const found = MECHS.filter(m => mySel[m] && auto.set.has(m)).length;
  const missing = MECHS.filter(m => !mySel[m] && auto.set.has(m)).map(m => T().mechName[m]);
  const extra = MECHS.filter(m => mySel[m] && !auto.set.has(m)).map(m => T().mechName[m]);
  if (auto.set.size === 0) { msg.className = "fb ok"; msg.textContent = T().autoEmpty; return; }
  if (!missing.length && !extra.length) { msg.className = "fb ok"; msg.textContent = T().cmpAll; return; }
  let txt = T().cmpSome(found, auto.set.size);
  if (missing.length) txt += " " + T().cmpMissing + missing.join(", ") + ".";
  if (extra.length) txt += " " + T().cmpExtra + extra.join(", ") + ".";
  msg.className = "fb ko"; msg.textContent = txt;
}

function finish3(){
  $("finalMsg").className = "fb ok";
  $("finalMsg").textContent = T().finalMsg;
  fireworks();
}

/* ================= Feux d'artifice ================= */
function fireworks(){
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv = $("fireworks"), ctx = cv.getContext("2d");
  cv.width = innerWidth; cv.height = innerHeight;
  cv.style.display = "block";
  const COLORS = ["#155E4C", "#D96A08", "#C84B31"];
  const rockets = [], sparks = [];
  const launch = () => { rockets.push({ x: cv.width * (0.15 + Math.random() * 0.7), y: cv.height, vx: (Math.random() - 0.5) * 2, vy: -(10 + Math.random() * 4), color: COLORS[Math.floor(Math.random() * COLORS.length)] }); };
  const explode = r => { for (let i = 0; i < 90; i++) { const ang = Math.random() * Math.PI * 2, sp = 2 + Math.random() * 5; sparks.push({ x: r.x, y: r.y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp, life: 60 + Math.random() * 40, color: r.color }); } };
  let frame = 0;
  const tick = () => {
    ctx.clearRect(0, 0, cv.width, cv.height);
    frame++;
    if (frame < 260 && frame % 16 === 0) launch();
    for (let i = rockets.length - 1; i >= 0; i--) {
      const r = rockets[i];
      r.x += r.vx; r.y += r.vy; r.vy += 0.18;
      ctx.beginPath(); ctx.arc(r.x, r.y, 3, 0, Math.PI * 2); ctx.fillStyle = r.color; ctx.fill();
      if (r.vy >= -1.5) { explode(r); rockets.splice(i, 1); }
    }
    for (let i = sparks.length - 1; i >= 0; i--) {
      const s = sparks[i];
      s.x += s.vx; s.y += s.vy; s.vy += 0.05; s.vx *= 0.985; s.life--;
      ctx.globalAlpha = Math.max(0, s.life / 80);
      ctx.beginPath(); ctx.arc(s.x, s.y, 2.4, 0, Math.PI * 2); ctx.fillStyle = s.color; ctx.fill();
      if (s.life <= 0) sparks.splice(i, 1);
    }
    ctx.globalAlpha = 1;
    if (frame < 600 || rockets.length || sparks.length) requestAnimationFrame(tick);
    else cv.style.display = "none";
  };
  tick();
}

/* ================= Onglets et langue ================= */
function renderTabs(){
  const box = $("tabs"); box.innerHTML = "";
  I18N.fr.tabs.forEach((_, i) => {
    const n = i + 1;
    const b = document.createElement("button");
    b.type = "button"; b.className = "tab";
    const solved = (n === 1 && progress.l1) || (n === 2 && progress.l2);
    if (n === lvl) b.classList.add("active");
    if (n > maxUnlocked()) b.classList.add("locked");
    if (solved) b.classList.add("solved");
    b.textContent = T().tabs[i] + (n > maxUnlocked() ? " 🔒" : "");
    b.onclick = () => {
      if (n > maxUnlocked()) { $("tabMsg").textContent = T().lockedMsg; return; }
      $("tabMsg").textContent = "";
      setLvl(n);
    };
    box.appendChild(b);
  });
}
function setLvl(n){
  lvl = n;
  [1, 2, 3].forEach(i => $("s" + i).classList.toggle("on", i === n));

}

};

  else { const req = el.requestFullscreen || el.webkitRequestFullscreen; if (req) { const r = req.call(el); if (r && r.catch) r.catch(() => {}); } }
};
function syncFsLabel(){ $("fsLabel").textContent = isFs() ? T().fsExit : T().fs; }
document.addEventListener("fullscreenchange", syncFsLabel);

$("subject").addEventListener("input", e => { subject = e.target.value; subjectTouched = true; renderPreview(); });

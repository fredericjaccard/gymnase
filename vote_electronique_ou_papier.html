<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Vivez deux scrutins simulés, papier et électronique, confrontés à des incidents, puis comparez secret, vérifiabilité, coût et accessibilité des deux modes de vote.">
<title>Vote électronique ou papier ? · Gymnase — Frédéric Jaccard</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2320241F'/%3E%3Ctext x='32' y='43' font-family='Arial,sans-serif' font-size='28' font-weight='bold' fill='%23FFFFFF' text-anchor='middle'%3EFJ%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Quattrocento+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBFAF6; --card:#F7F6F2; --primary:#155E4C; --primaryLight:#E3F0EA;
  --accent:#D96A08; --accentLight:#FDEBD8; --line:#D8D5CB; --ink:#20241F; --muted:#6E726B;
  --error:#C84B31;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:"Quattrocento Sans",sans-serif;padding:20px;max-width:980px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px;margin-bottom:16px}
.kicker{font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
h1{font-size:26px;color:var(--primary)}
.hdrBtns{display:flex;gap:8px}
button{font-family:inherit;font-size:14px;font-weight:700;padding:8px 16px;border-radius:10px;
  border:2px solid var(--primary);background:var(--card);color:var(--primary);cursor:pointer}
button:hover{background:var(--primaryLight)}
.instruction{background:var(--primaryLight);border-radius:12px;padding:12px 16px;margin-bottom:16px;font-size:15px;color:var(--primary)}
.stageNav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.stageChip{padding:8px 14px;border-radius:999px;border:2px solid var(--primary);background:var(--card);
  color:var(--primary);font-weight:700;cursor:pointer;font-size:14px}
.stageChip.current{background:var(--primary);color:#fff}
.stageChip.current:hover{background:var(--primary)}
.stageChip.locked{opacity:.35;cursor:not-allowed}
.stageIntro{font-size:14px;color:var(--muted);margin-bottom:16px}
.tlItem{display:flex;gap:12px;margin-bottom:12px;align-items:flex-start}
.tlDot{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;
  justify-content:center;flex-shrink:0;font-weight:700;background:var(--card);color:var(--muted);font-size:14px}
.tlItem.done .tlDot{background:var(--primary);border-color:var(--primary);color:#fff}
.tlItem.current .tlDot{border-color:var(--accent);color:var(--accent);background:var(--accentLight)}
.tlItem.current .tlText{font-weight:700}
.tlText{padding-top:4px;font-size:15px;line-height:1.45}
.incident{background:var(--accentLight);border:2px solid var(--error);border-radius:12px;padding:14px 16px;margin:14px 0 14px 42px}
.incident .incTag{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--error);margin-bottom:6px}
.incident .incText{font-size:15px;line-height:1.45;margin-bottom:8px}
.incident .incQ{font-weight:700;color:var(--primary);margin-bottom:4px}
.choice{display:block;width:100%;text-align:left;margin-top:8px;padding:12px 14px;min-height:44px;
  font-weight:400;font-size:14.5px;line-height:1.4}
.choice:hover{background:var(--primaryLight)}
.choice.wrong{background:var(--accentLight);border-color:var(--error);color:var(--error)}
.note{margin-top:10px;padding:10px 12px;border-radius:10px;font-size:14px;line-height:1.45}
.note.ok{background:var(--primaryLight);border:1.5px solid var(--primary);color:var(--primary)}
.note.ko{background:var(--accentLight);border:1.5px solid var(--error);color:var(--error)}
.banner{background:var(--primaryLight);border:2px solid var(--primary);border-radius:12px;padding:18px;text-align:center;margin:16px 0}
.banner h2{color:var(--primary);font-size:19px;margin-bottom:6px}
.banner p{font-size:15px;margin-bottom:12px}
.nextBtn{background:var(--accent);border-color:var(--accent);color:#fff}
.nextBtn:hover{background:var(--accent);opacity:.9}
.actionRow{margin:6px 0 20px}
.primaryBtn{background:var(--primary);color:#fff}
.primaryBtn:hover{background:var(--primary);opacity:.92}
.cmp{display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:10px;align-items:stretch}
.cmp .h{font-weight:700;text-align:center;color:var(--primary);padding:4px}
.cmp .crit{font-weight:700;color:var(--primary);display:flex;align-items:center;font-size:15px}
.cell{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:10px}
.cell .mode{display:none;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.optRow{display:flex;gap:6px}
.opt{flex:1;padding:8px 4px;font-size:13px;min-height:44px;border-radius:9px}
.opt.on{background:var(--primary);color:#fff;border-color:var(--primary)}
.opt.on:hover{background:var(--primary)}
.cell.ok{border-color:var(--primary);background:var(--primaryLight)}
.cell.bad{border-color:var(--error);background:var(--accentLight)}
.explain{grid-column:1/-1;font-size:13.5px;color:var(--muted);background:var(--card);
  border-left:3px solid var(--primary);padding:10px 12px;border-radius:8px;line-height:1.5}
.explain b{color:var(--primary)}
.scoreLine{margin:14px 0 6px;font-weight:700;color:var(--primary)}
footer{margin-top:20px;text-align:center;font-size:13px;color:var(--muted)}
footer a{color:var(--muted);font-weight:400;text-decoration:none}
footer a:hover{text-decoration:underline}
#fireworks{position:fixed;inset:0;pointer-events:none;z-index:50;display:none}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
@media(max-width:640px){
  body{padding:14px}
  h1{font-size:22px}
  .hdrBtns{width:100%}
  button{min-height:44px}
  .incident{margin-left:0}
  .cmp{grid-template-columns:1fr}
  .cmp .h{display:none}
  .cmp .crit{margin-bottom:2px}
  .cell .mode{display:block}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>

let lang=(function(){try{const c=document.cookie.match(/(?:^|;\s*)fj-lang=([a-z]{2})/);if(c&&(c[1]==="fr"||c[1]==="en"))return c[1];}catch(e){}try{const s=localStorage.getItem("fj-lang");return(s==="fr"||s==="en")?s:"fr";}catch(e){return"fr";}})();
const T = () => I18N[lang];

/* ---- Grille de correction du tableau : 0=fort, 1=moyen, 2=faible ----
   lignes : secret, vérifiabilité, coûts, accessibilité ; colonnes : papier, électronique */
const KEY = [[0,1],[0,1],[2,1],[1,0]];

/* ---- Séquences des scrutins : s = étape, i = incident, d = terminé ---- */
const SEQS = [
  ["s0","s1","s2","s3","i0","s4","i1","d"],
  ["s0","s1","i0","s2","s3","i1","s4","d"]
];

/* ---- État ---- */
let stage = 0;                 // étape affichée (0, 1, 2)
let unlocked = 0;              // étape maximale accessible
let simPos = [0, 0];           // position dans la séquence de chaque scrutin
let simAnswered = [[false, false],[false, false]]; // incidents résolus
let simDone = [false, false];
let tableSel = [[null,null],[null,null],[null,null],[null,null]];
let tableChecked = false;
let tableSolved = false;
let notice = "";               // message temporaire (ex. niveau verrouillé)

/* ---- Rendu de la navigation par étapes ---- */
function renderNav(){
  const nav = $("stageNav");
  nav.innerHTML = "";
  T().stages.forEach((label, i) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "stageChip" + (i === stage ? " current" : "") + (i > unlocked ? " locked" : "");
    b.textContent = label;
    b.onclick = () => {
      if(i > unlocked){
        notice = T().lockedMsg;
        renderStage();
        return;
      }
      notice = "";
      stage = i;
      renderNav();
      renderStage();
    };
    nav.appendChild(b);
  });
}

/* ---- Rendu d'un scrutin simulé (n = 0 papier, 1 électronique) ---- */
function renderSim(n){
  const zone = $("zone");
  zone.innerHTML = "";
  const steps = n === 0 ? T().paperSteps : T().elecSteps;
  const incs  = n === 0 ? T().paperIncidents : T().elecIncidents;
  const seq = SEQS[n];
  const pos = simPos[n];

  for(let k = 0; k <= pos && k < seq.length; k++){
    const item = seq[k];
    if(item[0] === "s"){
      const idx = parseInt(item.slice(1), 10);
      const row = document.createElement("div");
      row.className = "tlItem " + (k === pos ? "current" : "done");
      const dot = document.createElement("div");
      dot.className = "tlDot";
      dot.textContent = k === pos ? String(idx + 1) : "✓";
      const txt = document.createElement("div");
      txt.className = "tlText";
      txt.textContent = steps[idx];
      row.appendChild(dot);
      row.appendChild(txt);
      zone.appendChild(row);
    } else if(item[0] === "i"){
      const idx = parseInt(item.slice(1), 10);
      zone.appendChild(renderIncident(n, idx, k === pos));
    } else {
      const banner = document.createElement("div");
      banner.className = "banner";
      const h = document.createElement("h2");
      h.textContent = T().doneTitle;
      const p = document.createElement("p");
      p.textContent = n === 0 ? T().paperDoneText : T().elecDoneText;
      banner.appendChild(h);
      banner.appendChild(p);
      if(stage < 2){
        const b = document.createElement("button");
        b.type = "button";
        b.className = "nextBtn";
        b.textContent = T().nextStage;
        b.onclick = () => { stage = n + 1; notice = ""; renderNav(); renderStage(); };
        banner.appendChild(b);
      } else {
        const fn = document.createElement("p");
        fn.textContent = T().finishedNote;
        banner.appendChild(fn);
      }
      zone.appendChild(banner);
    }
  }

  /* bouton « Étape suivante » si l'élément courant est une étape */
  const cur = seq[pos];
  if(cur && cur[0] === "s"){
    const row = document.createElement("div");
    row.className = "actionRow";
    const b = document.createElement("button");
    b.type = "button";
    b.className = "primaryBtn";
    b.textContent = T().nextStep;
    b.onclick = () => {
      if(simPos[n] < seq.length - 1) simPos[n]++;
      renderStage();
    };
    row.appendChild(b);
    zone.appendChild(row);
  }
}

/* ---- Carte incident avec QCM ---- */
function renderIncident(n, idx, isCurrent){
  const incs = n === 0 ? T().paperIncidents : T().elecIncidents;
  const inc = incs[idx];
  const box = document.createElement("div");
  box.className = "incident";

  const tag = document.createElement("div");
  tag.className = "incTag";
  tag.textContent = T().incidentTag;
  box.appendChild(tag);

  const tx = document.createElement("div");
  tx.className = "incText";
  tx.textContent = inc.text;
  box.appendChild(tx);

  const q = document.createElement("div");
  q.className = "incQ";
  q.textContent = inc.q;
  box.appendChild(q);

  const solved = simAnswered[n][idx];
  inc.choices.forEach((c, ci) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "choice" + (!solved && wrongPick[n * 2 + idx] === ci ? " wrong" : "");
    b.textContent = c;
    b.disabled = solved;
    if(!solved){
      b.onclick = () => {
        if(ci === inc.good){
          simAnswered[n][idx] = true;
          wrongPick[n * 2 + idx] = -1;
        } else {
          wrongPick[n * 2 + idx] = ci;
        }
        renderStage();
      };
    }
    box.appendChild(b);
  });

  if(solved){
    const note = document.createElement("div");
    note.className = "note ok";
    note.textContent = inc.ok;
    box.appendChild(note);
    if(isCurrent){
      const row = document.createElement("div");
      row.className = "actionRow";
      row.style.marginTop = "12px";
      const b = document.createElement("button");
      b.type = "button";
      b.className = "primaryBtn";
      b.textContent = T().continueBtn;
      b.onclick = () => {
        if(simPos[n] < SEQS[n].length - 1){
          simPos[n]++;
          if(SEQS[n][simPos[n]] === "d"){
            simDone[n] = true;
            unlocked = Math.max(unlocked, n + 1);
            renderNav();
          }
        }
        renderStage();
      };
      row.appendChild(b);
      box.appendChild(row);
    }
  } else if(isCurrent && wrongPick[n * 2 + idx] >= 0){
    const note = document.createElement("div");
    note.className = "note ko";
    note.textContent = inc.ko;
    box.appendChild(note);
  }
  return box;
}

/* ---- Tableau comparatif ---- */
function checkTable(sel){
  const res = [];
  for(let r = 0; r < 4; r++)
    for(let c = 0; c < 2; c++)
      res.push(sel[r][c] !== null && sel[r][c] === KEY[r][c]);
  return res;
}

function renderTable(){
  const zone = $("zone");
  zone.innerHTML = "";
  const grid = document.createElement("div");
  grid.className = "cmp";

  const corner = document.createElement("div");
  grid.appendChild(corner);
  T().modes.forEach(m => {
    const h = document.createElement("div");
    h.className = "h";
    h.textContent = m;
    grid.appendChild(h);
  });

  const marks = tableChecked ? checkTable(tableSel) : null;
  let okCount = 0;
  if(marks) marks.forEach(m => { if(m) okCount++; });

  for(let r = 0; r < 4; r++){
    const crit = document.createElement("div");
    crit.className = "crit";
    crit.textContent = T().crits[r];
    grid.appendChild(crit);

    let rowAllOk = true;
    for(let c = 0; c < 2; c++){
      const cell = document.createElement("div");
      let cls = "cell";
      if(marks){
        if(marks[r * 2 + c]) cls += " ok";
        else if(tableSel[r][c] !== null) cls += " bad";
      }
      cell.className = cls;
      const mode = document.createElement("div");
      mode.className = "mode";
      mode.textContent = T().modes[c];
      cell.appendChild(mode);
      const optRow = document.createElement("div");
      optRow.className = "optRow";
      T().opts.forEach((o, oi) => {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "opt" + (tableSel[r][c] === oi ? " on" : "");
        b.textContent = o;
        b.disabled = tableSolved;
        b.onclick = () => {
          tableSel[r][c] = tableSel[r][c] === oi ? null : oi;
          tableChecked = false;
          renderStage();
        };
        optRow.appendChild(b);
      });
      cell.appendChild(optRow);
      grid.appendChild(cell);
      if(!(marks && marks[r * 2 + c])) rowAllOk = false;
    }

    if(rowAllOk){
      const ex = document.createElement("div");
      ex.className = "explain";
      const b1 = document.createElement("b");
      b1.textContent = T().modes[0] + " : ";
      ex.appendChild(b1);
      ex.appendChild(document.createTextNode(T().explains[r][0] + " "));
      const b2 = document.createElement("b");
      b2.textContent = T().modes[1] + " : ";
      ex.appendChild(b2);
      ex.appendChild(document.createTextNode(T().explains[r][1]));
      grid.appendChild(ex);
    }
  }
  zone.appendChild(grid);

  if(!tableSolved){
    const row = document.createElement("div");
    row.className = "actionRow";
    row.style.marginTop = "14px";
    const b = document.createElement("button");
    b.type = "button";
    b.className = "primaryBtn";
    b.textContent = T().validateBtn;
    b.onclick = () => {
      tableChecked = true;
      const marks2 = checkTable(tableSel);
      if(marks2.every(m => m)){
        tableSolved = true;
        renderStage();
        fireworks();
      } else {
        renderStage();
      }
    };
    row.appendChild(b);
    zone.appendChild(row);

    if(tableChecked){
      const sc = document.createElement("div");
      sc.className = "scoreLine";
      sc.textContent = T().scoreMsg(okCount, 8);
      zone.appendChild(sc);
      if(okCount < 8){
        const note = document.createElement("div");
        note.className = "note ko";
        note.textContent = T().tableKo;
        zone.appendChild(note);
      }
    }
  } else {
    const banner = document.createElement("div");
    banner.className = "banner";
    const h = document.createElement("h2");
    h.textContent = T().tableWinTitle;
    const p = document.createElement("p");
    p.textContent = T().tableWinText;
    banner.appendChild(h);
    banner.appendChild(p);
    zone.appendChild(banner);
  }
}

/* dernier choix erroné par incident (pour le marquage rouge), -1 = aucun */
let wrongPick = [-1, -1, -1, -1];

/* ---- Rendu général ---- */
function renderStage(){
  $("stageIntro").textContent = notice || T().intros[stage];
  if(stage < 2) renderSim(stage);
  else renderTable();
}

/* ---- Feux d'artifice ---- */
let fwRunning = false;
function fireworks(){
  if(window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv = $("fireworks"), ctx = cv.getContext("2d");
  cv.width = innerWidth; cv.height = innerHeight;
  cv.style.display = "block";
  fwRunning = true;
  const COLORS = ["#155E4C","#D96A08","#C84B31"];
  const rockets = [], sparks = [];
  const launch = () => {
    rockets.push({
      x: cv.width * (0.15 + Math.random() * 0.7), y: cv.height,
      vx: (Math.random() - 0.5) * 2, vy: -(10 + Math.random() * 4),
      color: COLORS[Math.floor(Math.random() * COLORS.length)]
    });
  };
  const explode = r => {
    for(let i = 0; i < 90; i++){
      const ang = Math.random() * Math.PI * 2, sp = 2 + Math.random() * 5;
      sparks.push({ x: r.x, y: r.y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp,
                    life: 60 + Math.random() * 40, color: r.color });
    }
  };
  let frame = 0;
  const tick = () => {
    ctx.clearRect(0, 0, cv.width, cv.height);
    frame++;
    if(frame < 260 && frame % 16 === 0) launch();
    for(let i = rockets.length - 1; i >= 0; i--){
      const r = rockets[i];
      r.x += r.vx; r.y += r.vy; r.vy += 0.18;
      ctx.beginPath(); ctx.arc(r.x, r.y, 3, 0, Math.PI * 2);
      ctx.fillStyle = r.color; ctx.fill();
      if(r.vy >= -1.5){ explode(r); rockets.splice(i, 1); }
    }
    for(let i = sparks.length - 1; i >= 0; i--){
      const s = sparks[i];
      s.x += s.vx; s.y += s.vy; s.vy += 0.05; s.vx *= 0.985; s.life--;
      ctx.globalAlpha = Math.max(0, s.life / 80);
      ctx.beginPath(); ctx.arc(s.x, s.y, 2.4, 0, Math.PI * 2);
      ctx.fillStyle = s.color; ctx.fill();
      if(s.life <= 0) sparks.splice(i, 1);
    }
    ctx.globalAlpha = 1;
    if(frame < 600 || rockets.length || sparks.length) requestAnimationFrame(tick);
    else { cv.style.display = "none"; fwRunning = false; }
  };
  tick();
}

/* ---- Plein écran (compatible Safari) ---- */
function isFs(){ return !!(document.fullscreenElement || document.webkitFullscreenElement); }
$("fsBtn").onclick = () => {
  const el = document.documentElement;
  if(isFs()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  else {
    const req = el.requestFullscreen || el.webkitRequestFullscreen;
    if(req){ const r = req.call(el); if(r && r.catch) r.catch(() => {}); }
  }
};
function syncFsLabel(){ $("fsLabel").textContent = isFs() ? T().fsExit : T().fs; }
document.addEventListener("fullscreenchange", syncFsLabel);
document.addEventListener("webkitfullscreenchange", syncFsLabel);

/* ---- Langue ---- */
function applyLang(){
  document.documentElement.lang = lang;
  $("kicker").textContent = T().kicker;
  $("title").textContent = T().title;
  $("instruction").textContent = T().instruction;
  $("langBtn").textContent = lang === "fr" ? "English" : "Français";
  syncFsLabel();
  $("backLink").textContent = T().backList;
  document.title = T().title + T().tabSuffix;
  renderNav();
  renderStage();
}
$("langBtn").onclick = () => {
  lang = lang === "fr" ? "en" : "fr";
  try {
    localStorage.setItem("fj-lang", lang);
    document.cookie = "fj-lang=" + lang + ";domain=.fredericjaccard.com;path=/;max-age=31536000;SameSite=Lax";
  } catch(e) {}
  applyLang();
};
applyLang();

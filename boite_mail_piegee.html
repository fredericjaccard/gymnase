<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Triez une boîte mail : repérez les e-mails d'hameçonnage parmi les messages légitimes, puis décortiquez vos erreurs. Trois niveaux progressifs.">
<title>La boîte mail piégée · Gymnase — Frédéric Jaccard</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2320241F'/%3E%3Ctext x='32' y='43' font-family='Arial,sans-serif' font-size='28' font-weight='bold' fill='%23FFFFFF' text-anchor='middle'%3EFJ%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Quattrocento+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBFAF6; --card:#F7F6F2; --primary:#155E4C; --primaryLight:#E3F0EA;
  --accent:#D96A08; --accentLight:#FDEBD8; --line:#D8D5CB; --ink:#20241F; --muted:#6E726B;
  --error:#C84B31;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:"Quattrocento Sans",sans-serif;padding:20px;max-width:1100px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px;margin-bottom:16px}
.kicker{font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
h1{font-size:26px;color:var(--primary)}
.hdrBtns{display:flex;gap:8px}
button{font-family:inherit;font-size:14px;font-weight:700;padding:8px 16px;border-radius:10px;
  border:2px solid var(--primary);background:var(--card);color:var(--primary);cursor:pointer}
button:hover{background:var(--primaryLight)}
.instruction{background:var(--primaryLight);border-radius:12px;padding:12px 16px;margin-bottom:16px;font-size:15px;color:var(--primary)}
footer{margin-top:20px;text-align:center;color:var(--muted);font-size:13px}
footer a{color:var(--muted);font-weight:400;text-decoration:none}
footer a:hover{text-decoration:underline}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
#fireworks{position:fixed;inset:0;pointer-events:none;z-index:50;display:none}

.levels{display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.lvlBtn{position:relative;min-width:118px;min-height:44px}
.lvlBtn.current{background:var(--primary);color:#fff}
.lvlBtn.current:hover{background:var(--primary)}
.lvlBtn:disabled{opacity:.35;cursor:not-allowed}
.lvlBtn.solved::after{content:"★";position:absolute;top:-13px;left:50%;transform:translateX(-50%);color:var(--accent);font-size:16px}
.progress{font-size:13px;color:var(--muted);margin-bottom:10px;font-weight:700}

.game{display:grid;grid-template-columns:330px 1fr;gap:16px;align-items:start}
.inbox{display:flex;flex-direction:column;gap:8px}
.mailItem{border:2px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--card);
  cursor:pointer;text-align:left;width:100%;font-family:inherit;color:var(--ink);font-size:14px;font-weight:400;min-height:44px}
.mailItem:hover{background:var(--primaryLight)}
.mailItem .miFrom{font-weight:700;color:var(--ink);display:flex;justify-content:space-between;gap:8px}
.mailItem .miSubj{font-size:13px;color:var(--muted);margin-top:2px}
.mailItem.cur{border-color:var(--accent)}
.mailItem .st{font-weight:700}
.mailItem.ok .st{color:var(--primary)}
.mailItem.ko .st{color:var(--error)}

.reading{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:18px}
.mvHead{border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:12px}
.mvRow{font-size:14px;margin-bottom:4px}
.mvRow .lab{font-weight:700;color:var(--primary);display:inline-block;min-width:52px}
.mvAddr{color:var(--muted);font-size:13px}
.mvSubj{font-weight:700;font-size:16px}
.mvBody p{font-size:15px;margin-bottom:10px;line-height:1.45}
.fakelink{color:var(--primary);text-decoration:underline;cursor:not-allowed;font-weight:700}

.actions{display:flex;gap:12px;margin-top:14px}
.actions button{flex:1;min-height:50px;font-size:16px}
#btnLegit{border-color:var(--primary);color:var(--primary)}
#btnLegit:hover{background:var(--primaryLight)}
#btnPhish{border-color:var(--error);color:var(--error)}
#btnPhish:hover{background:var(--accentLight)}
.feedback{margin-top:14px;border-radius:12px;padding:12px 16px;font-size:15px}
.feedback.good{background:var(--primaryLight);border:2px solid var(--primary)}
.feedback.bad{background:var(--accentLight);border:2px solid var(--error)}
.nextWrap{margin-top:14px;text-align:right}
#nextBtn{background:var(--accent);border-color:var(--accent);color:#fff;min-height:46px}
#nextBtn:hover{background:var(--accent)}

.resCard{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:18px}
.resCard h2{font-size:20px;color:var(--primary);margin-bottom:8px}
.resScore{font-size:17px;font-weight:700;margin-bottom:6px}
.resMsg{font-size:15px;margin-bottom:12px}
.err{border:2px solid var(--line);border-radius:12px;padding:14px;margin-top:12px;background:var(--bg)}
.err h3{font-size:15px;color:var(--ink);margin-bottom:6px}
.verdict{font-weight:700;margin-bottom:8px}
.verdict.ph{color:var(--error)}
.verdict.lg{color:var(--primary)}
.linkRev{font-size:13px;margin-bottom:10px;color:var(--muted)}
.linkRev code{font-family:"Courier New",monospace;font-size:12px;color:var(--ink)}
.err ul{list-style:none}
.err li{font-size:14px;margin-bottom:8px;line-height:1.4}
.tag{display:inline-block;font-size:11px;font-weight:700;border-radius:8px;padding:2px 8px;margin-right:8px;
  background:var(--primaryLight);color:var(--primary);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
.resBtns{margin-top:16px;display:flex;gap:12px;flex-wrap:wrap}
.resBtns .accent{background:var(--accent);border-color:var(--accent);color:#fff}
.resBtns .accent:hover{background:var(--accent)}
.finalList{margin-top:14px}
.finalList li{font-size:15px;margin-bottom:8px;margin-left:18px;line-height:1.45}

@media(max-width:640px){
  body{padding:14px}
  h1{font-size:22px}
  .hdrBtns{width:100%}
  button{min-height:44px}
  .game{grid-template-columns:1fr}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<canvas id="fireworks"></canvas>
<header>
  <div>
    <div class="kicker" id="kicker"></div>
    <h1 id="title"></h1>
  </div>
  <div class="hdrBtns">
    <button id="langBtn" type="button">English</button>
    <button id="fsBtn" type="button"><span id="fsLabel"></span></button>
  </div>
</header>
<div class="instruction" id="instruction"></div>
<div class="levels" id="levels"></div>
<main>
  <section id="gameArea">
    <div class="progress" id="progress"></div>
    <div class="game">
      <div class="inbox" id="inbox"></div>
      <div class="reading">
        <div class="mailview" id="mailview"></div>
        <div class="actions" id="actions">
          <button id="btnLegit" type="button"></button>
          <button id="btnPhish" type="button"></button>
        </div>
        <div class="feedback" id="feedback" hidden></div>
        <div class="nextWrap"><button id="nextBtn" type="button" hidden></button></div>
      </div>
    </div>
  </section>
  <section class="results" id="results" hidden>
    <div class="resCard" id="resCard"></div>
  </section>
</main>
<footer><a href="enjeux_sociaux.html" id="backLink"></a> · <a href="https://fredericjaccard.com">Frédéric Jaccard</a></footer>

/* ---------- État ---------- */
const NB_LEVELS = 3, PASS_SCORE = 4;
let level = 0;
let order = [];        // indices des e-mails du niveau, mélangés
let idx = 0;           // position dans order
let answers = {};      // indice global e-mail -> true (juste) / false (faux)
const solved = new Set();

function levelEmails(n) {
  return EMAILS.map((m, i) => ({ m, i })).filter(x => x.m.lvl === n);
}
function isUnlocked(n) {
  if (n === 0) return true;
  for (let k = 0; k < n; k++) if (!solved.has(k)) return false;
  return true;
}
function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* ---------- Rendu ---------- */
function renderLevels() {
  const box = $("levels");
  box.innerHTML = "";
  for (let n = 0; n < NB_LEVELS; n++) {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "lvlBtn" + (n === level && !$("results").hidden ? " current" : (n === level ? " current" : "")) + (solved.has(n) ? " solved" : "");
    b.textContent = T().level(n + 1);
    if (!isUnlocked(n)) { b.disabled = true; b.title = T().lockedTitle; }
    b.onclick = () => startLevel(n);
    box.appendChild(b);
  }
}

function renderInbox() {
  const box = $("inbox");
  box.innerHTML = "";
  order.forEach((gi, pos) => {
    const m = EMAILS[gi];
    const it = document.createElement("button");
    it.type = "button";
    let cls = "mailItem";
    if (pos === idx) cls += " cur";
    if (gi in answers) cls += answers[gi] ? " ok" : " ko";
    it.className = cls;
    const st = (gi in answers) ? (answers[gi] ? "✓" : "✗") : "";
    it.innerHTML = "<span class='miFrom'><span></span><span class='st'></span></span><span class='miSubj'></span>";
    it.querySelector(".miFrom span:first-child").textContent = m.from[lang];
    it.querySelector(".st").textContent = st;
    it.querySelector(".miSubj").textContent = m.subj[lang];
    it.onclick = () => { idx = pos; renderAll(); };
    box.appendChild(it);
  });
}

function renderMail() {
  if (!order.length) return;
  const gi = order[idx];
  const m = EMAILS[gi];
  const mv = $("mailview");
  mv.innerHTML = "";
  const head = document.createElement("div");
  head.className = "mvHead";
  const r1 = document.createElement("div");
  r1.className = "mvRow";
  r1.innerHTML = "<span class='lab'></span><span class='nm'></span> <span class='mvAddr'></span>";
  r1.querySelector(".lab").textContent = T().from;
  r1.querySelector(".nm").textContent = m.from[lang];
  r1.querySelector(".mvAddr").textContent = "‹" + m.addr + "›";
  const r2 = document.createElement("div");
  r2.className = "mvRow";
  r2.innerHTML = "<span class='lab'></span><span class='mvSubj'></span>";
  r2.querySelector(".lab").textContent = T().subject;
  r2.querySelector(".mvSubj").textContent = m.subj[lang];
  head.appendChild(r1); head.appendChild(r2);
  const body = document.createElement("div");
  body.className = "mvBody";
  m.body[lang].forEach(p => {
    const el = document.createElement("p");
    el.textContent = p;
    body.appendChild(el);
  });
  if (m.link) {
    const p = document.createElement("p");
    const a = document.createElement("span");
    a.className = "fakelink";
    a.textContent = m.link.text[lang];
    a.setAttribute("role", "link");
    a.setAttribute("aria-disabled", "true");
    p.appendChild(a);
    body.appendChild(p);
  }
  mv.appendChild(head); mv.appendChild(body);

  const answered = gi in answers;
  $("btnLegit").disabled = answered;
  $("btnPhish").disabled = answered;
  if (answered) {
    showFeedback(gi);
    $("nextBtn").hidden = false;
    $("nextBtn").textContent = (idx === order.length - 1) ? T().seeResults : T().next;
  } else {
    $("feedback").hidden = true;
    $("nextBtn").hidden = true;
  }
  $("progress").textContent = T().mailCounter(idx + 1, order.length);
}

function showFeedback(gi) {
  const m = EMAILS[gi];
  const ok = answers[gi];
  const fb = $("feedback");
  fb.hidden = false;
  fb.className = "feedback " + (ok ? "good" : "bad");
  let txt;
  if (ok) txt = T().correct + m.note[lang];
  else txt = m.phish ? T().wrongPhish : T().wrongLegit;
  fb.textContent = txt;
}

function classify(choicePhish) {
  const gi = order[idx];
  if (gi in answers) return;
  const m = EMAILS[gi];
  answers[gi] = (choicePhish === m.phish);
  renderAll();
}

function renderAll() {
  renderLevels();
  renderInbox();
  renderMail();
}

/* ---------- Bilan de niveau ---------- */
function showResults() {
  const gi_list = order.slice();
  const score = gi_list.filter(gi => answers[gi]).length;
  const total = gi_list.length;
  const pass = score >= PASS_SCORE;
  const errors = gi_list.filter(gi => !answers[gi]);

  if (pass) solved.add(level);
  $("gameArea").hidden = true;
  $("results").hidden = false;
  renderLevels();

  const card = $("resCard");
  card.innerHTML = "";

  const h2 = document.createElement("h2");
  h2.textContent = T().resTitle + " — " + T().level(level + 1);
  card.appendChild(h2);

  const sc = document.createElement("div");
  sc.className = "resScore";
  sc.textContent = T().scoreMsg(score, total);
  card.appendChild(sc);

  const msg = document.createElement("div");
  msg.className = "resMsg";
  if (pass && score === total) msg.textContent = T().pass + T().perfect;
  else if (pass) msg.textContent = T().pass;
  else msg.textContent = T().fail;
  card.appendChild(msg);

  const dt = document.createElement("h2");
  dt.textContent = T().dissectTitle;
  card.appendChild(dt);

  if (errors.length === 0) {
    const p = document.createElement("p");
    p.textContent = T().noErrors;
    card.appendChild(p);
  }
  errors.forEach(gi => {
    const m = EMAILS[gi];
    const d = document.createElement("div");
    d.className = "err";
    const h3 = document.createElement("h3");
    h3.textContent = m.subj[lang] + " — " + m.addr;
    d.appendChild(h3);
    const v = document.createElement("div");
    v.className = "verdict " + (m.phish ? "ph" : "lg");
    v.textContent = m.phish ? T().verdictPhish : T().verdictLegit;
    d.appendChild(v);
    if (m.link) {
      const lr = document.createElement("div");
      lr.className = "linkRev";
      lr.innerHTML = "<span class='ls'></span> : <code></code> — <span class='lr2'></span> : <code></code>";
      lr.querySelector(".ls").textContent = T().linkShown;
      lr.querySelectorAll("code")[0].textContent = m.link.text[lang];
      lr.querySelector(".lr2").textContent = T().linkReal;
      lr.querySelectorAll("code")[1].textContent = m.link.real;
      d.appendChild(lr);
    }
    const ul = document.createElement("ul");
    m.clues.forEach(c => {
      const li = document.createElement("li");
      const tag = document.createElement("span");
      tag.className = "tag";
      tag.textContent = T().cat[c.t] || c.t;
      li.appendChild(tag);
      li.appendChild(document.createTextNode(c[lang]));
      ul.appendChild(li);
    });
    d.appendChild(ul);
    card.appendChild(d);
  });

  if (pass && level === NB_LEVELS - 1) {
    const fh = document.createElement("h2");
    fh.style.marginTop = "18px";
    fh.textContent = T().winMsg + " " + T().finalTitle;
    card.appendChild(fh);
    const ul = document.createElement("ul");
    ul.className = "finalList";
    T().finalList.forEach(t => {
      const li = document.createElement("li");
      li.textContent = t;
      ul.appendChild(li);
    });
    card.appendChild(ul);
  }

  const btns = document.createElement("div");
  btns.className = "resBtns";
  if (!pass) {
    const r = document.createElement("button");
    r.type = "button"; r.className = "accent";
    r.textContent = T().retry;
    r.onclick = () => startLevel(level);
    btns.appendChild(r);
  } else if (level < NB_LEVELS - 1) {
    const n = document.createElement("button");
    n.type = "button"; n.className = "accent";
    n.textContent = T().nextLevel;
    n.onclick = () => startLevel(level + 1);
    btns.appendChild(n);
  }
  const again = document.createElement("button");
  again.type = "button";
  again.textContent = T().retry;
  again.onclick = () => startLevel(level);
  if (pass) btns.appendChild(again);
  card.appendChild(btns);

  if (pass && level === NB_LEVELS - 1) fireworks();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

/* ---------- Navigation ---------- */
function startLevel(n) {
  if (!isUnlocked(n)) return;
  level = n;
  order = shuffle(levelEmails(n).map(x => x.i));
  idx = 0;
  answers = {};
  $("gameArea").hidden = false;
  $("results").hidden = true;
  renderAll();
  window.scrollTo({ top: 0 });
}

$("btnLegit").onclick = () => classify(false);
$("btnPhish").onclick = () => classify(true);
$("nextBtn").onclick = () => {
  if (idx === order.length - 1) showResults();
  else { idx++; renderAll(); }
};

/* ---------- Feux d'artifice ---------- */
let fwRunning = false;
function fireworks() {
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv = $("fireworks"), ctx = cv.getContext("2d");
  cv.width = innerWidth; cv.height = innerHeight;
  cv.style.display = "block";
  fwRunning = true;
  const COLORS = ["#155E4C", "#D96A08", "#C84B31"];
  const rockets = [], sparks = [];
  const launch = () => {
    rockets.push({
      x: cv.width * (0.15 + Math.random() * 0.7), y: cv.height,
      vx: (Math.random() - 0.5) * 2, vy: -(10 + Math.random() * 4),
      color: COLORS[Math.floor(Math.random() * COLORS.length)]
    });
  };
  const explode = r => {
    for (let i = 0; i < 90; i++) {
      const ang = Math.random() * Math.PI * 2, sp = 2 + Math.random() * 5;
      sparks.push({ x: r.x, y: r.y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp,
                    life: 60 + Math.random() * 40, color: r.color });
    }
  };
  let frame = 0;
  const tick = () => {
    ctx.clearRect(0, 0, cv.width, cv.height);
    frame++;
    if (frame < 260 && frame % 16 === 0) launch();
    for (let i = rockets.length - 1; i >= 0; i--) {
      const r = rockets[i];
      r.x += r.vx; r.y += r.vy; r.vy += 0.18;
      ctx.beginPath(); ctx.arc(r.x, r.y, 3, 0, Math.PI * 2);
      ctx.fillStyle = r.color; ctx.fill();
      if (r.vy >= -1.5) { explode(r); rockets.splice(i, 1); }
    }
    for (let i = sparks.length - 1; i >= 0; i--) {
      const s = sparks[i];
      s.x += s.vx; s.y += s.vy; s.vy += 0.05; s.vx *= 0.985; s.life--;
      ctx.globalAlpha = Math.max(0, s.life / 80);
      ctx.beginPath(); ctx.arc(s.x, s.y, 2.4, 0, Math.PI * 2);
      ctx.fillStyle = s.color; ctx.fill();
      if (s.life <= 0) sparks.splice(i, 1);
    }
    ctx.globalAlpha = 1;
    if (frame < 600 || rockets.length || sparks.length) requestAnimationFrame(tick);
    else { cv.style.display = "none"; fwRunning = false; }
  };
  tick();
}

/* ---------- Langue & plein écran ---------- */
function applyLang() {
  document.documentElement.lang = lang;
  $("kicker").textContent = T().kicker;
  $("title").textContent = T().title;
  $("instruction").textContent = T().instruction;
  $("langBtn").textContent = lang === "fr" ? "English" : "Français";
  $("fsLabel").textContent = isFs() ? T().fsExit : T().fs;
  $("backLink").textContent = T().backList;
  document.title = T().title + " — " + T().kicker;
  $("btnLegit").textContent = T().btnLegit;
  $("btnPhish").textContent = T().btnPhish;
  if ($("results").hidden) { if (order.length) renderAll(); else renderLevels(); }
  else showResults();
}
$("langBtn").onclick = () => {
  lang = lang === "fr" ? "en" : "fr";
  try {
    localStorage.setItem("fj-lang", lang);
    document.cookie = "fj-lang=" + lang + ";domain=.fredericjaccard.com;path=/;max-age=31536000;SameSite=Lax";
  } catch (e) {}
  applyLang();
};
function isFs() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }
$("fsBtn").onclick = () => {
  const el = document.documentElement;
  if (isFs()) {
    (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  } else {
    const req = el.requestFullscreen || el.webkitRequestFullscreen;
    if (req) { const r = req.call(el); if (r && r.catch) r.catch(() => {}); }
  }
};
function syncFsLabel() { $("fsLabel").textContent = isFs() ? T().fsExit : T().fs; }
document.addEventListener("fullscreenchange", syncFsLabel);
document.addEventListener("webkitfullscreenchange", syncFsLabel);

/* ---------- Démarrage ---------- */
applyLang();
startLevel(0);
</script>

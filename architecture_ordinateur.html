<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Explorez une tour et un ordinateur portable en 3D, identifiez leurs composants et suivez le trajet d’une donnée.">
<title>Dans l’ordinateur · Gymnase — Frédéric Jaccard</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2320241F'/%3E%3Ctext x='32' y='43' font-family='Arial,sans-serif' font-size='28' font-weight='bold' fill='%23FFFFFF' text-anchor='middle'%3EFJ%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Quattrocento+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBFAF6; --card:#F7F6F2; --primary:#155E4C; --primaryLight:#E3F0EA;
  --accent:#D96A08; --accentLight:#FDEBD8; --line:#D8D5CB; --ink:#20241F;
  --muted:#6E726B; --error:#C84B31;
}
*{margin:0;padding:0;box-sizing:border-box}
html{min-height:100%;background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:"Quattrocento Sans",sans-serif;padding:20px;min-height:100dvh}
button{font-family:inherit;font-size:14px;font-weight:700;padding:9px 15px;border-radius:10px;border:2px solid var(--primary);background:var(--card);color:var(--primary);cursor:pointer;min-height:44px;transition:background .18s,transform .18s,color .18s}
button:hover{background:var(--primaryLight)}
button:active{transform:scale(.97)}
button:focus-visible,a:focus-visible,canvas:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
button.active{background:var(--primary);color:var(--bg)}
button.accent{border-color:var(--accent);color:var(--accent)}
button.accent:hover{background:var(--accentLight)}
button.accent.active{background:var(--accent);color:var(--bg)}
header{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px;margin-bottom:16px;max-width:1440px;margin-left:auto;margin-right:auto}
.kicker{font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
h1{font-size:28px;color:var(--primary);line-height:1.15;margin-top:3px}
.hdrBtns{display:flex;gap:8px;flex-wrap:wrap}
.instruction{background:var(--primaryLight);border-radius:12px;padding:12px 16px;margin:0 auto 16px;font-size:15px;max-width:1440px;line-height:1.5}
.toolbar{max-width:1440px;margin:0 auto 12px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.segment{display:flex;gap:6px;flex-wrap:wrap}
.segment button{border-width:1px;padding:7px 13px}
.workspace{max-width:1440px;margin:0 auto;display:grid;grid-template-columns:minmax(0,2.15fr) minmax(280px,.85fr);gap:16px;align-items:stretch}
.stage{position:relative;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;min-width:0;height:590px}
#scene{display:block;width:100%;height:100%;touch-action:none;cursor:grab;background:var(--card)}
#scene.dragging{cursor:grabbing}
.sceneBadge{position:absolute;left:14px;top:14px;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:7px 11px;color:var(--primary);font-size:13px;font-weight:700;pointer-events:none}
.sceneHint{position:absolute;left:14px;bottom:12px;color:var(--muted);font-size:12px;background:var(--bg);border-radius:8px;padding:6px 9px;pointer-events:none}
#componentLabel{position:absolute;transform:translate(-50%,-115%);background:var(--primary);color:var(--bg);border-radius:8px;padding:6px 10px;font-size:13px;font-weight:700;pointer-events:none;white-space:nowrap;display:none}
#componentLabel:after{content:"";position:absolute;left:50%;bottom:-6px;width:12px;height:12px;background:var(--primary);transform:translateX(-50%) rotate(45deg)}
.panel{border:1px solid var(--line);border-radius:16px;background:var(--card);padding:18px;display:flex;flex-direction:column;min-height:590px}
.panelTop{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.componentIcon{width:42px;height:42px;flex:0 0 42px;border-radius:10px;background:var(--primaryLight);display:grid;place-items:center;color:var(--primary);font-weight:700;font-size:13px}
.panel h2{font-size:22px;color:var(--primary);line-height:1.2}
.category{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--accent);font-weight:700;margin-bottom:10px}
.description{font-size:16px;line-height:1.55;margin-bottom:14px}
.remember{background:var(--primaryLight);border-radius:10px;padding:11px 13px;font-size:14px;line-height:1.5;margin-bottom:16px}
.remember strong{display:block;color:var(--primary);margin-bottom:3px}
.listTitle{font-size:13px;font-weight:700;color:var(--muted);margin:auto 0 8px;padding-top:10px}
.componentList{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.componentList button{font-size:12px;min-height:40px;padding:6px 7px;border-width:1px;white-space:normal;line-height:1.2}
.componentList button.active{border-color:var(--accent);background:var(--accentLight);color:var(--accent)}
.flowPanel{max-width:1440px;margin:16px auto 0;border:1px solid var(--line);border-radius:16px;background:var(--card);padding:16px}
.flowHeader{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.flowHeader h2{font-size:19px;color:var(--primary)}
.flowSteps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.flowStep{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:10px;text-align:left;display:flex;align-items:center;gap:9px;font-weight:400;min-height:58px}
.flowStep:hover{background:var(--primaryLight)}
.flowStep.active{border:2px solid var(--accent);background:var(--accentLight);color:var(--ink)}
.stepNum{display:grid;place-items:center;flex:0 0 28px;width:28px;height:28px;border-radius:50%;background:var(--primaryLight);color:var(--primary);font-weight:700}
.flowStep.active .stepNum{background:var(--accent);color:var(--bg)}
.flowStep strong{display:block;font-size:14px}
.flowStep small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
#flowText{font-size:15px;line-height:1.55;margin-top:12px;min-height:24px}
.legend{max-width:1440px;margin:10px auto 0;display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:12px}
.legend span{display:flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;background:var(--accent)}
.dot.green{background:var(--primary)}
footer{margin:20px auto 0;text-align:center;color:var(--muted);font-size:13px;max-width:1440px}
footer a{color:var(--muted);text-decoration:none}
footer a:hover{text-decoration:underline}
.srOnly{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(max-width:900px){
  .workspace{grid-template-columns:1fr}.stage{height:530px}.panel{min-height:0}.componentList{grid-template-columns:repeat(4,1fr)}
}
@media(max-width:640px){
  body{padding:12px}h1{font-size:23px}.hdrBtns{width:100%}.hdrBtns button{flex:1}
  .instruction{font-size:14px;padding:11px 13px}.toolbar{gap:9px}.segment{width:100%}.segment button{flex:1;padding:7px 8px}
  .stage{height:440px;border-radius:13px}.sceneHint{font-size:11px;max-width:85%}
  .panel{padding:15px}.componentList{grid-template-columns:repeat(2,1fr)}
  .flowPanel{padding:13px}.flowSteps{grid-template-columns:1fr 1fr}.flowStep{min-height:62px;padding:8px}
  .flowHeader button{width:100%}.flowHeader h2{font-size:18px}
}
@media(prefers-reduced-motion:reduce){button{transition:none}}
</style>
</head>

</main>
<footer><a id="backLink" href="index.html">← Toutes les applications</a> · <a href="https://www.fredericjaccard.com">Frédéric Jaccard</a></footer>

function buildLaptop(){

let parts=buildTower();
let explodeAmount=1;
function componentIds(){return [...new Set(parts.map(p=>p.id))].filter(id=>T().components[id]);}
function currentAnchor(id){
  const found=parts.filter(p=>p.id===id);
  if(!found.length)return V();
  const sum=found.reduce((a,p)=>add(a,add(p.pos,scale(p.exp,explodeAmount))),V());
  return scale(sum,1/found.length);

const canvas=$("scene"),ctx=canvas.getContext("2d");
let cw=800,ch=590,dpr=1,visibleFaces=[],hovered=null;
function rotateLocal(v,p){

  if(p.rotZ){const c=Math.cos(p.rotZ),s=Math.sin(p.rotZ);[x,y]=[c*x-s*y,s*x+c*y];}
  if(p.rotX){const c=Math.cos(p.rotX),s=Math.sin(p.rotX);[y,z]=[c*y-s*z,s*y+c*z];}
  return V(x,y,z);

function boxMesh(p){

  const vs=[V(-x,-y,-z),V(x,-y,-z),V(x,y,-z),V(-x,y,-z),V(-x,-y,z),V(x,-y,z),V(x,y,z),V(-x,y,z)].map(v=>rotateLocal(v,p));

function cylinderMesh(p){

  }

  for(let i=0;i<n;i++){const j=(i+1)%n;faces.push([i,j,j+n,i+n]);}

  return {vs,faces};
}
function view(v){
  const cy=Math.cos(yaw),sy=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch);
  const x=cy*v.x-sy*v.z,z=sy*v.x+cy*v.z;

function project(v){

function normalOf(points){
  const a=points[0],b=points[1],c=points[2],u=V(b.x-a.x,b.y-a.y,b.z-a.z),v=V(c.x-a.x,c.y-a.y,c.z-a.z);

  return V(n.x/l,n.y/l,n.z/l);

function rgb(hex){return [parseInt(hex.slice(1,3),16),parseInt(hex.slice(3,5),16),parseInt(hex.slice(5,7),16)];}
function shade(hex,n){
  const light=V(-.45,.75,.55),d=Math.max(0,n.x*light.x+n.y*light.y+n.z*light.z),f=.68+.32*d,c=rgb(hex),paper=rgb(PALETTE.bg);

function pathPolygon(points){ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath();}
function flowAnchors(){return ["keyboard","cpu","ram","storage","ram",modelType==="laptop"?"cpu":"gpu","screen"].map(id=>currentAnchor(id));}
function flowPosition(){
  const anchors=flowAnchors(),u=Math.max(0,Math.min(5.999,playTime/12*6)),i=Math.floor(u),t=u-i;
  return mix(anchors[i],anchors[i+1],t*t*(3-2*t));

function drawFlowPath(){
  if(!playing&&activeStep<0)return;
  const pts=flowAnchors().map(project);
  ctx.save();ctx.strokeStyle=PALETTE.accent;ctx.globalAlpha=.32;ctx.lineWidth=2;ctx.setLineDash([6,7]);ctx.beginPath();
  pts.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.stroke();ctx.restore();
}
function drawDataDot(){
  if(!playing&&activeStep<0)return;
  const p=project(flowPosition()),r=Math.max(6,Math.min(11,p.s*.09));
  ctx.save();ctx.fillStyle=PALETTE.accentLight;ctx.beginPath();ctx.arc(p.x,p.y,r+6,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=PALETTE.accent;ctx.beginPath();ctx.arc(p.x,p.y,r,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle=PALETTE.bg;ctx.lineWidth=2;ctx.stroke();ctx.restore();
}
function render(){
  ctx.clearRect(0,0,cw,ch);ctx.fillStyle=PALETTE.card;ctx.fillRect(0,0,cw,ch);
  ctx.save();ctx.globalAlpha=.16;ctx.fillStyle=PALETTE.muted;ctx.beginPath();ctx.ellipse(cw*.48,ch*.87,cw*.29,ch*.045,0,0,Math.PI*2);ctx.fill();ctx.restore();

      const pts=indices.map(i=>world[i]),n=normalOf(pts),vn=view(n);
      if(vn.z<-.08)continue;

      faces.push({id:p.id,color:p.color,pts,projected,depth,n});

  }

    ctx.globalAlpha=f.id===selected||f.id===hovered?1:.2;ctx.lineWidth=f.id===selected?1.8:.65;ctx.stroke();ctx.globalAlpha=1;

}
function updateLabel(){
  const el=$("componentLabel");
  if(!selected){el.style.display="none";return;}
  const p=project(currentAnchor(selected));el.style.display="block";el.textContent=T().components[selected].name;
  el.style.left=Math.max(65,Math.min(cw-65,p.x))+"px";el.style.top=Math.max(55,p.y-24)+"px";
}
function pointInPoly(x,y,pts){
  let inside=false;
  for(let i=0,j=pts.length-1;i<pts.length;j=i++){
    const a=pts[i],b=pts[j],hit=((a.y>y)!==(b.y>y))&&(x<(b.x-a.x)*(y-a.y)/(b.y-a.y)+a.x);
    if(hit)inside=!inside;
  }
  return inside;
}
function pick(x,y){
  for(let i=visibleFaces.length-1;i>=0;i--){const f=visibleFaces[i];if(pointInPoly(x,y,f.projected))return f.id;}
  return null;

function resize(){
  const r=canvas.getBoundingClientRect();cw=Math.max(1,r.width);ch=Math.max(1,r.height);dpr=Math.min(2,window.devicePixelRatio||1);
  canvas.width=Math.round(cw*dpr);canvas.height=Math.round(ch*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);render();
}
new ResizeObserver(resize).observe(canvas);
const pointers=new Map();let dragStart=null,pinchDistance=0;
canvas.addEventListener("pointerdown",e=>{
  canvas.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  dragStart={x:e.clientX,y:e.clientY,moved:false};canvas.classList.add("dragging");
  if(pointers.size===2){const a=[...pointers.values()];pinchDistance=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);}
});
canvas.addEventListener("pointermove",e=>{
  const r=canvas.getBoundingClientRect();
  if(!pointers.has(e.pointerId)){hovered=pick(e.clientX-r.left,e.clientY-r.top);canvas.style.cursor=hovered?"pointer":"grab";return;}
  const old=pointers.get(e.pointerId),dx=e.clientX-old.x,dy=e.clientY-old.y;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(dragStart&&Math.hypot(e.clientX-dragStart.x,e.clientY-dragStart.y)>5)dragStart.moved=true;
  if(pointers.size===2){const a=[...pointers.values()],d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);targetDistance=Math.max(8,Math.min(27,targetDistance-(d-pinchDistance)*.035));pinchDistance=d;}
  else{yaw+=dx*.008;pitch=Math.max(-.15,Math.min(1.15,pitch+dy*.006));}

function endPointer(e){
  const r=canvas.getBoundingClientRect(),wasTap=dragStart&&!dragStart.moved&&pointers.size===1;
  pointers.delete(e.pointerId);canvas.classList.remove("dragging");
  if(wasTap){const id=pick(e.clientX-r.left,e.clientY-r.top);if(id&&T().components[id])selectComponent(id);}

canvas.addEventListener("pointerup",endPointer);canvas.addEventListener("pointercancel",endPointer);
canvas.addEventListener("pointerleave",()=>{hovered=null;});
canvas.addEventListener("wheel",e=>{e.preventDefault();targetDistance=Math.max(8,Math.min(27,targetDistance+e.deltaY*.012));},{passive:false});
canvas.addEventListener("keydown",e=>{
  if(e.key==="ArrowLeft")yaw-=.12;else if(e.key==="ArrowRight")yaw+=.12;else if(e.key==="ArrowUp")pitch=Math.min(1.15,pitch+.1);else if(e.key==="ArrowDown")pitch=Math.max(-.15,pitch-.1);
  else if(e.key==="+"||e.key==="=")targetDistance=Math.max(8,targetDistance-1);else if(e.key==="-")targetDistance=Math.min(27,targetDistance+1);else return;e.preventDefault();
});
function renderPanel(){
  const c=T().components[selected]||T().components.cpu;
  $("componentIcon").textContent=c.icon;$("componentName").textContent=c.name;
  const categories={motherboard:"connection",cpu:"processing",ram:"memory",storage:"storage",gpu:"graphics",psu:"power",battery:"power",fan:"cooling",keyboard:"input",screen:"output",case:"case"};
  $("componentCategory").textContent=T().categories[categories[selected]];$("componentDescription").textContent=c.desc;$("componentRemember").textContent=c.remember;
  document.querySelectorAll("#componentList button").forEach(b=>b.classList.toggle("active",b.dataset.id===selected));
}
function buildComponentList(){
  const order=["motherboard","cpu","ram","storage","gpu","psu","battery","fan","keyboard","screen","case"],ids=componentIds().sort((a,b)=>order.indexOf(a)-order.indexOf(b));
  $("componentList").innerHTML="";
  ids.forEach(id=>{const b=document.createElement("button");b.type="button";b.dataset.id=id;b.textContent=T().components[id].name;b.onclick=()=>selectComponent(id);$("componentList").appendChild(b);});
  renderPanel();
}
function selectComponent(id){if(!exploded&&!["case","keyboard","screen"].includes(id))setExploded(true);selected=id;renderPanel();}
function buildFlowSteps(){
  $("flowSteps").innerHTML="";
  T().flowSteps.forEach((s,i)=>{const b=document.createElement("button");b.type="button";b.className="flowStep"+(i===activeStep?" active":"");b.innerHTML=`<span class="stepNum">${i+1}</span><span><strong>${s.title.slice(3)}</strong><small>${s.short}</small></span>`;b.onclick=()=>setStep(i);$("flowSteps").appendChild(b);});
  updateFlowText();
}
function updateFlowText(){

  document.querySelectorAll(".flowStep").forEach((b,i)=>b.classList.toggle("active",i===activeStep));
  $("playBtn").textContent=playing?T().pause:(playTime>=12?T().replay:T().play);
}
function setStep(i){if(!exploded)setExploded(true);playing=false;activeStep=i;playTime=[.5,1.5,3,5.2][i]/6*12;updateFlowText();}
function stepFromTime(){const u=playTime/12*6;return u<1?0:u<2?1:u<4?2:3;}
function setModel(type){
  modelType=type;parts=type==="tower"?buildTower():buildLaptop();selected="cpu";activeStep=-1;playing=false;playTime=0;
  yaw=type==="tower"?-.65:-.48;pitch=type==="tower"?.42:.5;distance=targetDistance=type==="tower"?19.5:14.5;
  $("towerBtn").classList.toggle("active",type==="tower");$("laptopBtn").classList.toggle("active",type==="laptop");
  $("sceneBadge").textContent=type==="tower"?T().badgeTower:T().badgeLaptop;buildComponentList();buildFlowSteps();
}
function setExploded(value){
  exploded=value;if(!value&&!["case","keyboard","screen"].includes(selected)){selected="case";renderPanel();}
  $("assembledBtn").classList.toggle("active",!value);$("explodedBtn").classList.toggle("active",value);
}
function resetView(){
  yaw=modelType==="tower"?-.65:-.48;pitch=modelType==="tower"?.42:.5;targetDistance=modelType==="tower"?19.5:14.5;
}
function applyLang(){
  document.documentElement.lang=lang;document.title=T().tab;document.querySelector('meta[name="description"]').content=T().description;
  $("kicker").textContent=T().kicker;$("title").textContent=T().title;$("langBtn").textContent=lang==="fr"?"English":"Français";
  $("modelGroup").setAttribute("aria-label",T().modelAria);$("viewGroup").setAttribute("aria-label",T().viewAria);$("stage").setAttribute("aria-label",T().stageAria);$("scene").setAttribute("aria-label",T().stageAria);
  $("instruction").textContent=T().instruction;$("towerBtn").textContent=T().tower;$("laptopBtn").textContent=T().laptop;
  $("assembledBtn").textContent=T().assembled;$("explodedBtn").textContent=T().exploded;$("resetBtn").textContent=T().reset;
  $("sceneBadge").textContent=modelType==="tower"?T().badgeTower:T().badgeLaptop;$("sceneHint").textContent=T().hint;
  $("rememberTitle").textContent=T().remember;$("listTitle").textContent=T().list;$("flowTitle").textContent=T().flowTitle;
  $("legendData").textContent=T().legendData;$("legendSelected").textContent=T().legendSelected;$("backLink").textContent=T().back;
  syncFsLabel();buildComponentList();buildFlowSteps();
}
$("towerBtn").onclick=()=>setModel("tower");$("laptopBtn").onclick=()=>setModel("laptop");
$("assembledBtn").onclick=()=>setExploded(false);$("explodedBtn").onclick=()=>setExploded(true);$("resetBtn").onclick=resetView;
$("playBtn").onclick=()=>{
  if(playing){playing=false;}else{if(!exploded)setExploded(true);if(playTime>=12)playTime=0;playing=true;activeStep=stepFromTime();}updateFlowText();
};
$("langBtn").onclick=()=>{lang=lang==="fr"?"en":"fr";try{localStorage.setItem("fj-lang",lang);}catch(e){}applyLang();};
function isFs(){return document.fullscreenElement||document.webkitFullscreenElement;}
function syncFsLabel(){$("fsLabel").textContent=isFs()?T().fsExit:T().fs;}
function toggleFs(){
  try{
    if(isFs()){const fn=document.exitFullscreen||document.webkitExitFullscreen;if(fn){const r=fn.call(document);if(r&&r.catch)r.catch(()=>{});}}

$("fsBtn").onclick=toggleFs;document.addEventListener("fullscreenchange",syncFsLabel);document.addEventListener("webkitfullscreenchange",syncFsLabel);
function animate(now){
  const dt=Math.min(.05,(now-lastTime)/1000||0);lastTime=now;

applyLang();setModel("tower");resize();requestAnimationFrame(animate);

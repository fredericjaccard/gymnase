    listen(target,type,handler,options) { target.addEventListener(type,handler,options);this.listeners.push(()=>target.removeEventListener(type,handler,options)); }
    bind() {

    draw(mesh, id='', picking=false, offset=[0,0,0], unlit=0, scale=1) {

    drawPaths(time) {
      const gl=this.gl,verts=[],routes=[];

      if(this.power&&this.flow.length>1)for(let i=0;i<this.flow.length-1;i++)routes.push({a:this.flow[i],b:this.flow[i+1],active:true});

        for(let j=0;j<3;j++){const t=this.reduced?(j+1)/4:((time*.00027+j/3-i*.12)%1);this.draw(this.particle,'',false,this.curve(a,b,t),1);}

      if(!picking)this.drawPaths(time);

    pick(x,y) {

    setCaseOpen(value) {this.caseOpen=!!value;this.request();}

  }

let lang=(function(){try{var c=document.cookie.match(/(?:^|;\s*)fj-lang=([a-z]{2})/);if(c&&(c[1]==="fr"||c[1]==="en"))return c[1];}catch(e){}try{var s=localStorage.getItem("fj-lang");return(s==="fr"||s==="en")?s:"fr";}catch(e){return"fr";}})();
const T = () => I18N[lang];
let mode='explore',selected='cpu',scenario=0,step=0,playing=false,playTimer=0;
let renderer=null,caseOpen=true,exploded=false,connections=false,showMarkers=true,graphicsReady=false;
let powered=true,ramText='',savedText='',savedExists=false,memoryEvent='memoryReady';
const reducedMotion=window.matchMedia('(prefers-reduced-motion: reduce)');
const markerButtons={},partButtons={};

function buildComponents(){
 PART_IDS.forEach((id,index)=>{
  const b=document.createElement('button');b.className='component-btn';b.dataset.part=id;
  const num=document.createElement('span');num.className='number';num.textContent=String(index+1).padStart(2,'0');
  const name=document.createElement('span');name.className='component-name';b.append(num,name);b.onclick=()=>selectPart(id,true);$('componentGrid').appendChild(b);partButtons[id]=b;
  const m=document.createElement('button');m.className='marker';m.innerHTML='<span>'+String(index+1)+'</span><span class="label"></span>';m.onclick=()=>selectPart(id,true);m.setAttribute('tabindex','-1');$('markerLayer').appendChild(m);markerButtons[id]=m;
 });
}
function selectPart(id,fromUser=false){
 if(!PART_IDS.includes(id))return;
 selected=id;renderer?.setSelected(id);
 if(fromUser&&mode==='flow'){stopPlayback();setMode('explore');}
 renderPart();
}
function renderPart(){
 const p=T().parts[selected];
 $('partRole').textContent=p.role;$('partNumber').textContent=String(PART_IDS.indexOf(selected)+1).padStart(2,'0');
 $('partTitle').textContent=p.name;$('partCode').textContent=p.code;$('partDescription').textContent=p.description;
 $('partFacts').replaceChildren(...p.facts.map(f=>{const li=document.createElement('li');li.textContent=f;return li;}));
 $('partRemember').textContent=p.remember;$('partAction').textContent=T().seeFlow;
 PART_IDS.forEach(id=>{const pressed=String(id===selected);partButtons[id].setAttribute('aria-pressed',pressed);markerButtons[id].setAttribute('aria-pressed',pressed);});
}
function setMode(next){
 stopPlayback();mode=next;
 document.querySelectorAll('[data-mode]').forEach(b=>{const active=b.dataset.mode===mode;b.setAttribute('aria-selected',String(active));b.tabIndex=active?0:-1;});
 mode=mode==='flow'?'flow':'explore';
 $('machinePanel').hidden=false;
 $('machinePanel').setAttribute('aria-labelledby',mode==='flow'?'tabFlow':'tabExplore');
 $('detailPanel').hidden=mode!=='explore';$('flowPanel').hidden=mode!=='flow';$('experiment').hidden=mode!=='flow';
 $('instruction').textContent=T()[mode==='explore'?'instructionExplore':'instructionFlow'];
 renderer?.setFlow([]);
 if(mode==='flow')renderStep(true);
 if(mode==='explore')renderer?.setSelected(selected);
}
function renderScenarioOptions(){
 $('scenarioSelect').replaceChildren(...T().scenarios.map((s,i)=>{const o=document.createElement('option');o.value=i;o.textContent=s.name;return o;}));$('scenarioSelect').value=scenario;
}
function renderStep(updateModel=false){
 const steps=T().scenarios[scenario].steps;step=Math.max(0,Math.min(steps.length-1,step));const [title,body,route]=steps[step];
 $('stepCounter').textContent=T().step+' '+(step+1)+' '+T().of+' '+steps.length;
 $('stepTitle').textContent=title;$('stepBody').textContent=body;
 $('stepRoute').replaceChildren();route.forEach((id,i)=>{if(i)$('stepRoute').appendChild(document.createTextNode(' → '));const span=document.createElement('span');span.textContent=T().parts[id].short;$('stepRoute').appendChild(span);});
 $('progressTrack').replaceChildren(...steps.map((s,i)=>{const b=document.createElement('button');b.className=i===step?'current':i<step?'done':'';b.setAttribute('aria-label',T().step+' '+(i+1)+' : '+s[0]);if(i===step)b.setAttribute('aria-current','step');b.disabled=!powered;b.onclick=()=>{stopPlayback();step=i;renderStep(true);$('progressTrack').children[i].focus();};return b;}));
 $('prevStep').disabled=!powered||step===0;$('nextStep').disabled=!powered||step===steps.length-1;
 $('playFlow').disabled=!powered;$('flowReset').disabled=!powered;$('scenarioSelect').disabled=!powered;
 $('playFlow').textContent=playing?T().pause:step===steps.length-1?T().replay:T().play;
 if(updateModel&&renderer){renderer.setFlow(powered?route:[]);selectPart(route[route.length-1]);}
}
function stopPlayback(){playing=false;clearTimeout(playTimer);playTimer=0;if($('playFlow'))$('playFlow').textContent=step===T().scenarios[scenario].steps.length-1?T().replay:T().play;}
function scheduleStep(){clearTimeout(playTimer);playTimer=setTimeout(()=>{if(!playing)return;const n=T().scenarios[scenario].steps.length;if(step<n-1){step++;renderStep(true);scheduleStep();}else{stopPlayback();renderStep();}},6500);}
function togglePlay(){if(!powered)return;if(playing){stopPlayback();return;}if(step===T().scenarios[scenario].steps.length-1)step=0;playing=true;renderStep(true);scheduleStep();}
function updateViewButtons(){
 $('caseBtn').setAttribute('aria-pressed',String(caseOpen));$('explodeBtn').setAttribute('aria-pressed',String(exploded));$('connectionsBtn').setAttribute('aria-pressed',String(connections));$('labelsBtn').setAttribute('aria-pressed',String(showMarkers));$('markerLayer').hidden=!showMarkers||!graphicsReady;
}
function renderMemory(){
 $('ramValue').textContent=ramText||T().emptyMemory;$('ssdValue').textContent=savedExists?(savedText||'“ ”'):T().noFile;
 $('draftInput').value=ramText;$('draftInput').disabled=!powered;
 $('saveDraft').disabled=!powered;$('loadDraft').disabled=!powered||!savedExists;
 $('powerBtn').textContent=powered?T().powerOff:T().powerOn;$('powerBtn').setAttribute('aria-pressed',String(!powered));
 $('memoryStatus').textContent=T()[memoryEvent];
}
function memoryFlow(route){stopPlayback();renderer?.setFlow(powered?route:[]);if(route.length)selectPart(route[route.length-1]);}
function togglePower(){
 stopPlayback();powered=!powered;ramText='';memoryEvent=powered?'memoryOn':'memoryOff';renderer?.setPower(powered);renderer?.setFlow([]);if(!powered)selectPart('psu');renderMemory();renderStep();
}
function fullscreenElement(){return document.fullscreenElement||document.webkitFullscreenElement;}
function updateFullscreen(){ $('fsLabel').textContent=fullscreenElement()?T().fsExit:T().fs; }
async function toggleFullscreen(){
 try{
  if(fullscreenElement()){const exit=document.exitFullscreen||document.webkitExitFullscreen;if(exit)await exit.call(document);}
  else{const enter=document.documentElement.requestFullscreen||document.documentElement.webkitRequestFullscreen;if(enter)await enter.call(document.documentElement);else window.alert(T().fsUnavailable);}
 }catch(e){window.alert(T().fsUnavailable);}updateFullscreen();
}
function applyLang(){
 document.documentElement.lang=lang;document.title=T().tab;
 document.querySelectorAll('[data-i18n]').forEach(el=>{el.textContent=T()[el.dataset.i18n];});
 document.querySelectorAll('[data-i18n-aria]').forEach(el=>{el.setAttribute('aria-label',T()[el.dataset.i18nAria]);});
 document.querySelectorAll('[data-i18n-placeholder]').forEach(el=>{el.setAttribute('placeholder',T()[el.dataset.i18nPlaceholder]);});
 $('langBtn').textContent=lang==='fr'?'English':'Français';$('langBtn').setAttribute('aria-label',lang==='fr'?'Switch to English':'Passer en français');
 $('backLink').textContent=T().backList;
 $('instruction').textContent=T()[mode==='explore'?'instructionExplore':'instructionFlow'];
 PART_IDS.forEach(id=>{partButtons[id].querySelector('.component-name').textContent=T().parts[id].short;markerButtons[id].querySelector('.label').textContent=T().parts[id].short;markerButtons[id].setAttribute('aria-label',T().parts[id].name);markerButtons[id].title=T().parts[id].name;});
 renderPart();renderScenarioOptions();renderStep();renderMemory();updateFullscreen();
}

buildComponents();
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
document.querySelector('.tabs').addEventListener('keydown',e=>{const tabs=[...document.querySelectorAll('[data-mode]')];const i=tabs.indexOf(document.activeElement);if(i<0)return;let next;if(e.key==='ArrowRight')next=(i+1)%tabs.length;else if(e.key==='ArrowLeft')next=(i+tabs.length-1)%tabs.length;else if(e.key==='Home')next=0;else if(e.key==='End')next=tabs.length-1;else return;e.preventDefault();setMode(tabs[next].dataset.mode);tabs[next].focus();});
$('partAction').onclick=()=>{setMode('flow');$('tabFlow').focus();};
$('langBtn').onclick=()=>{lang=lang==='fr'?'en':'fr';try{localStorage.setItem("fj-lang",lang);document.cookie="fj-lang="+lang+";domain=.fredericjaccard.com;path=/;max-age=31536000;SameSite=Lax";}catch(e){}applyLang();};
$('fsBtn').onclick=toggleFullscreen;document.addEventListener('fullscreenchange',updateFullscreen);document.addEventListener('webkitfullscreenchange',updateFullscreen);
$('caseBtn').onclick=()=>{caseOpen=!caseOpen;if(!caseOpen){exploded=false;renderer?.setExploded(false);}renderer?.setCaseOpen(caseOpen);updateViewButtons();};
$('explodeBtn').onclick=()=>{exploded=!exploded;if(exploded){caseOpen=true;renderer?.setCaseOpen(true);}renderer?.setExploded(exploded);updateViewButtons();};
$('connectionsBtn').onclick=()=>{connections=!connections;renderer?.setConnections(connections);updateViewButtons();};
$('labelsBtn').onclick=()=>{showMarkers=!showMarkers;updateViewButtons();};
$('zoomIn').onclick=()=>renderer?.zoom(1);$('zoomOut').onclick=()=>renderer?.zoom(-1);$('resetView').onclick=()=>renderer?.resetView();
$('scenarioSelect').onchange=e=>{stopPlayback();scenario=Number(e.target.value);step=0;renderStep(true);};
$('flowReset').onclick=()=>{stopPlayback();step=0;renderStep(true);};
$('prevStep').onclick=()=>{stopPlayback();step--;renderStep(true);};$('nextStep').onclick=()=>{stopPlayback();step++;renderStep(true);};$('playFlow').onclick=togglePlay;
$('draftInput').addEventListener('input',e=>{ramText=e.target.value;memoryEvent='memoryEdited';memoryFlow(['input','cpu','ram']);renderMemory();});
$('saveDraft').onclick=()=>{if(!powered)return;savedText=ramText;savedExists=true;memoryEvent='memorySaved';memoryFlow(['ram','ssd']);renderMemory();};
$('loadDraft').onclick=()=>{if(!powered||!savedExists)return;ramText=savedText;memoryEvent='memoryLoaded';memoryFlow(['ssd','ram']);renderMemory();};
$('powerBtn').onclick=togglePower;
$('resetMemory').onclick=()=>{stopPlayback();powered=true;ramText='';savedText='';savedExists=false;memoryEvent='memoryReady';renderer?.setPower(true);renderer?.setFlow([]);renderMemory();renderStep();};
document.addEventListener('visibilitychange',()=>{if(document.hidden)stopPlayback();});
applyLang();updateViewButtons();
try{
 renderer=new Computer3D($('computer'),{
  onSelect:id=>selectPart(id,true),
  onReady:ok=>{graphicsReady=ok;$('webglFallback').hidden=ok;updateViewButtons();},
  onFrame:anchors=>{
   PART_IDS.forEach(id=>{const p=anchors[id],m=markerButtons[id];const visible=p&&p.visible&&Number.isFinite(p.x)&&Number.isFinite(p.y);m.hidden=!visible;if(visible){m.style.left=p.x+'px';m.style.top=p.y+'px';}});
  }
 });
 renderer.setSelected(selected);

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Quiz interactif : devinez quelle application cache chaque clause réelle de conditions générales, puis découvrez le droit d'accès aux données de la nLPD suisse.">
<title>Ce que vous avez accepté · Gymnase — Frédéric Jaccard</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2320241F'/%3E%3Ctext x='32' y='43' font-family='Arial,sans-serif' font-size='28' font-weight='bold' fill='%23FFFFFF' text-anchor='middle'%3EFJ%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Quattrocento+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBFAF6; --card:#F7F6F2; --primary:#155E4C; --primaryLight:#E3F0EA;
  --accent:#D96A08; --accentLight:#FDEBD8; --line:#D8D5CB; --ink:#20241F; --muted:#6E726B;
  --error:#C84B31;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:"Quattrocento Sans",sans-serif;padding:20px}
header{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px;margin-bottom:16px;max-width:860px;margin-left:auto;margin-right:auto}
.kicker{font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
h1{font-size:26px;color:var(--primary)}
.hdrBtns{display:flex;gap:8px}
button{font-family:inherit;font-size:14px;font-weight:700;padding:8px 16px;border-radius:10px;
  border:2px solid var(--primary);background:var(--card);color:var(--primary);cursor:pointer}
button:hover{background:var(--primaryLight)}
.instruction{background:var(--primaryLight);color:var(--primary);border-radius:12px;padding:12px 16px;margin-bottom:16px;font-size:15px;max-width:860px;margin-left:auto;margin-right:auto}
main{max-width:860px;margin:0 auto}
footer{margin-top:20px;text-align:center;color:var(--muted);font-size:13px}
footer a{color:var(--muted);font-weight:400;text-decoration:none}
footer a:hover{text-decoration:underline}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}

/* Accueil */
.introCard{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:26px 24px;text-align:center}
.introCard h2{color:var(--primary);font-size:21px;margin-bottom:12px;line-height:1.35}
.introCard p{font-size:16px;line-height:1.55;margin-bottom:12px}
.hint{color:var(--muted);font-size:14px;margin-bottom:18px}

/* Quiz */
.prog{display:flex;justify-content:space-between;gap:10px;font-size:14px;color:var(--muted);margin-bottom:6px}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:16px}
.barFill{height:100%;background:var(--accent);border-radius:99px;transition:width .3s ease}
.clause{background:var(--card);border:2px solid var(--line);border-left:6px solid var(--accent);border-radius:12px;padding:16px 18px;margin-bottom:16px}
.clauseTag{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.clause p{font-size:17px;line-height:1.55;font-style:italic}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.choice{display:flex;align-items:center;gap:10px;justify-content:flex-start;text-align:left;min-height:52px;font-size:16px;padding:10px 14px}
.choice .em{font-size:20px;line-height:1}
.choice.correct{background:var(--primaryLight);border-color:var(--primary)}
.choice.wrong{background:var(--accentLight);border-color:var(--error)}
.choice.dim{opacity:.5}
.choice:disabled{cursor:default}
.explain{border-radius:12px;padding:14px 16px;border:2px solid var(--primary);background:var(--primaryLight)}
.explain.ko{border-color:var(--error);background:var(--accentLight)}
.verdict{font-weight:700;font-size:16px;margin-bottom:8px}
.explain p{font-size:15px;line-height:1.55;margin-bottom:10px}
.src{font-size:13px;color:var(--muted);font-style:italic;margin-bottom:12px}
.takeaway{background:var(--card);border:2px solid var(--line);border-left:6px solid var(--accent);border-radius:10px;padding:10px 12px;font-size:15px;line-height:1.45;margin-bottom:16px}
.cta{background:var(--accent);border-color:var(--accent);color:#fff;display:block;margin:0 auto;padding:12px 26px;font-size:16px}
.cta:hover{background:var(--accent);opacity:.88}

/* Bilan */
.scoreCard{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:26px 24px;text-align:center}
.scoreCard h2{color:var(--primary);font-size:22px;margin-bottom:6px}
.scoreNum{font-size:56px;font-weight:700;color:var(--primary);line-height:1.1}
.scoreNum span{font-size:24px;color:var(--muted)}
.scoreMsg{font-size:17px;line-height:1.5;margin:8px auto 20px;max-width:560px}
.nlpd{text-align:left;background:var(--primaryLight);border-radius:12px;padding:16px 18px;margin-bottom:20px}
.nlpd h3{color:var(--primary);font-size:18px;margin-bottom:8px}
.nlpd p,.nlpd li{font-size:15px;line-height:1.55}
.nlpd ul{margin:8px 0 10px 22px}
.nlpd li{margin-bottom:6px}
.outro{font-weight:700;color:var(--primary)}

#fireworks{position:fixed;inset:0;pointer-events:none;z-index:50;display:none}

@media(max-width:640px){
  body{padding:14px}
  h1{font-size:22px}
  .hdrBtns{width:100%}
  button{min-height:44px}
  .choices{grid-template-columns:1fr}
  .clause p{font-size:16px}
  .scoreNum{font-size:46px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>
</head>

  <div>
    <div class="kicker" id="kicker"></div>

  <div class="hdrBtns">

    <button id="fsBtn" type="button"><span id="fsLabel"></span></button>

</header>
<div class="instruction" id="instruction"></div>
<main id="stage"></main>
<footer><a href="index.html" id="backLink"></a> · <a href="https://fredericjaccard.com">Frédéric Jaccard</a></footer>

        clause: "You grant us a perpetual, worldwide, non-exclusive, royalty-free right to use your meeting content — audio, video, chat, screen sharing — for machine learning and artificial intelligence purposes, including training and tuning our models and algorithms.",
        choices: [{n:"Microsoft Teams",e:"🧑‍💼"},{n:"Google Meet",e:"🎥"},{n:"Zoom",e:"📹"},{n:"Jitsi Meet",e:"🤝"}],
        answer: 2,
        explain: "This clause really appeared in Zoom's terms of service in March 2023. Faced with public outcry, the company backtracked a few months later: it now commits not to use meeting content to train AI models. Terms change all the time — and user pushback can change them too.",
        source: "Zoom Terms of Service, section 10.4 (March 2023), amended August 2023",
        takeaway: "Terms can change overnight — for worse, but also for better."
      },
      {
        clause: "Starting 3 November 2025, we may use your profile data — name, photo, professional history, education — as well as your posts and comments to train our generative AI models, including if you live in Switzerland. You can opt out in your privacy settings.",
        choices: [{n:"X (Twitter)",e:"✖️"},{n:"Facebook",e:"👍"},{n:"WhatsApp",e:"💬"},{n:"LinkedIn",e:"💼"}],
        answer: 3,
        explain: "Since 3 November 2025, LinkedIn (Microsoft) has been using its members' data by default — including in Switzerland and the EU — to train its generative AI. To refuse, you must untick the option yourself in the settings. Beware: data already absorbed into a model can no longer be removed from it.",
        source: "LinkedIn Privacy Notice, “Data for Generative AI Improvement” (2025)",
        takeaway: "“By default” means “accepted for you”: it's up to you to find the off switch."
      }
    ]
  }
};
let lang = (function () {
  try {
    var c = document.cookie.match(/(?:^|;\s*)fj-lang=([a-z]{2})/);
    if (c && (c[1] === "fr" || c[1] === "en")) return c[1];
  } catch (e) {}
  try {
    var s = localStorage.getItem("fj-lang");
    if (s === "fr" || s === "en") return s;
  } catch (e) {}
  return "fr";
})();
const T = () => I18N[lang];

let screen = "intro", qi = 0, score = 0, answered = false, picked = -1, fwDone = false;

function esc(s){ return s; }

function introHTML(){
  return '<div class="introCard">' +
    '<h2>' + T().introTitle + '</h2>' +
    '<p>' + T().introText + '</p>' +
    '<div class="hint">' + T().introHint + '</div>' +
    '<button class="cta" id="startBtn" type="button">' + T().start + '</button>' +
  '</div>';
}

function quizHTML(){
  const q = T().questions[qi], n = T().questions.length;
  const w = Math.round((qi + (answered ? 1 : 0)) / n * 100);
  let h = '<div class="prog"><span>' + T().qLabel(qi + 1, n) + '</span><span>' + T().scoreLabel(score) + '</span></div>' +
    '<div class="bar"><div class="barFill" style="width:' + w + '%"></div></div>' +
    '<div class="clause"><div class="clauseTag">' + T().excerpt + '</div><p>' + T().qOpen + q.clause + T().qClose + '</p></div>' +
    '<div class="choices">';
  q.choices.forEach((c, i) => {
    let cls = "choice";
    if(answered){
      if(i === q.answer) cls += " correct";
      else if(i === picked) cls += " wrong";
      else cls += " dim";
    }
    h += '<button class="' + cls + '" data-i="' + i + '" type="button"' + (answered ? " disabled" : "") + '><span class="em">' + c.e + '</span><span>' + c.n + '</span></button>';
  });
  h += '</div>';
  if(answered){
    const ok = picked === q.answer;
    h += '<div class="explain ' + (ok ? "ok" : "ko") + '">' +
      '<div class="verdict">' + (ok ? T().correct : T().wrong(q.choices[q.answer].n)) + '</div>' +
      '<p>' + q.explain + '</p>' +
      '<div class="src">' + T().source + q.source + '</div>' +
      '<div class="takeaway"><strong>' + T().takeawayLabel + '</strong> — ' + q.takeaway + '</div>' +
      '<button class="cta" id="nextBtn" type="button">' + (qi + 1 < n ? T().next : T().finish) + '</button>' +
    '</div>';
  }
  return h;
}

function endHTML(){
  const n = T().questions.length;
  return '<div class="scoreCard">' +
    '<h2>' + T().scoreTitle + '</h2>' +
    '<div class="scoreNum">' + score + '<span>/' + n + '</span></div>' +
    '<div class="scoreMsg">' + T().scoreMsg(score, n) + '</div>' +
    '<div class="nlpd"><h3>' + T().nlpdTitle + '</h3>' +
      '<p>' + T().nlpdIntro + '</p>' +
      '<ul>' + T().nlpdList.map(x => '<li>' + x + '</li>').join("") + '</ul>' +
      '<p class="outro">' + T().nlpdOutro + '</p>' +
    '</div>' +
    '<button class="cta" id="replayBtn" type="button">' + T().replay + '</button>' +
  '</div>';
}

function render(){
  const st = $("stage");
  if(screen === "intro"){
    st.innerHTML = introHTML();
    $("startBtn").onclick = () => { screen = "quiz"; qi = 0; score = 0; answered = false; picked = -1; fwDone = false; render(); syncInstr(); };
  } else if(screen === "quiz"){
    st.innerHTML = quizHTML();
    st.querySelectorAll(".choice").forEach(b => {
      b.onclick = () => pick(parseInt(b.getAttribute("data-i"), 10));
    });
    if(answered && $("nextBtn")) $("nextBtn").onclick = nextQ;
  } else {
    st.innerHTML = endHTML();
    $("replayBtn").onclick = () => { screen = "quiz"; qi = 0; score = 0; answered = false; picked = -1; render(); syncInstr(); window.scrollTo(0, 0); };
    if(score === T().questions.length && !fwDone){ fwDone = true; fireworks(); }
  }
}

function pick(i){
  if(answered) return;
  answered = true; picked = i;
  if(i === T().questions[qi].answer) score++;
  render();
}

function nextQ(){
  qi++;
  if(qi >= T().questions.length){ screen = "end"; }
  answered = false; picked = -1;
  render(); syncInstr();
  window.scrollTo(0, 0);
}

function syncInstr(){
  $("instruction").textContent = screen === "intro" ? T().instrIntro : screen === "quiz" ? T().instrQuiz : T().instrEnd;
}

function applyLang(){
  document.documentElement.lang = lang;
  $("kicker").textContent = T().kicker;
  $("title").textContent = T().title;
  $("langBtn").textContent = lang === "fr" ? "English" : "Français";
  $("fsLabel").textContent = isFs() ? T().fsExit : T().fs;
  document.getElementById("backLink").textContent = T().backList;
  document.title = T().title + " — " + T().kicker;
  syncInstr();
  render();
}
$("langBtn").onclick = () => {
  lang = lang === "fr" ? "en" : "fr";
  try {
    localStorage.setItem("fj-lang", lang);
    document.cookie = "fj-lang=" + lang + ";domain=.fredericjaccard.com;path=/;max-age=31536000;SameSite=Lax";
  } catch (e) {}
  applyLang();
};

function isFs(){ return !!(document.fullscreenElement || document.webkitFullscreenElement); }
$("fsBtn").onclick = () => {
  const el = document.documentElement;
  if(isFs()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  else {
    const req = el.requestFullscreen || el.webkitRequestFullscreen;
    if(req){ const r = req.call(el); if(r && r.catch) r.catch(() => {}); }
  }
};
function syncFsLabel(){ $("fsLabel").textContent = isFs() ? T().fsExit : T().fs; }
document.addEventListener("fullscreenchange", syncFsLabel);
document.addEventListener("webkitfullscreenchange", syncFsLabel);

let fwRunning = false;
function fireworks(){
  if(window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv = document.getElementById("fireworks"), ctx = cv.getContext("2d");
  cv.width = innerWidth; cv.height = innerHeight;
  cv.style.display = "block";
  fwRunning = true;
  const COLORS = ["#155E4C","#D96A08","#C84B31"];
  const rockets = [], sparks = [];
  const launch = () => {
    rockets.push({
      x: cv.width * (0.15 + Math.random() * 0.7), y: cv.height,
      vx: (Math.random() - 0.5) * 2, vy: -(10 + Math.random() * 4),
      color: COLORS[Math.floor(Math.random() * COLORS.length)]
    });
  };
  const explode = r => {
    for(let i = 0; i < 90; i++){
      const ang = Math.random() * Math.PI * 2, sp = 2 + Math.random() * 5;
      sparks.push({ x: r.x, y: r.y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp,
                    life: 60 + Math.random() * 40, color: r.color });
    }
  };
  let frame = 0;
  const tick = () => {
    ctx.clearRect(0, 0, cv.width, cv.height);
    frame++;
    if(frame < 260 && frame % 16 === 0) launch();
    for(let i = rockets.length - 1; i >= 0; i--){
      const r = rockets[i];
      r.x += r.vx; r.y += r.vy; r.vy += 0.18;
      ctx.beginPath(); ctx.arc(r.x, r.y, 3, 0, Math.PI * 2);
      ctx.fillStyle = r.color; ctx.fill();
      if(r.vy >= -1.5){ explode(r); rockets.splice(i, 1); }
    }
    for(let i = sparks.length - 1; i >= 0; i--){
      const s = sparks[i];
      s.x += s.vx; s.y += s.vy; s.vy += 0.05; s.vx *= 0.985; s.life--;
      ctx.globalAlpha = Math.max(0, s.life / 80);
      ctx.beginPath(); ctx.arc(s.x, s.y, 2.4, 0, Math.PI * 2);
      ctx.fillStyle = s.color; ctx.fill();
      if(s.life <= 0) sparks.splice(i, 1);
    }
    ctx.globalAlpha = 1;
    if(frame < 600 || rockets.length || sparks.length) requestAnimationFrame(tick);
    else { cv.style.display = "none"; fwRunning = false; }
  };
  tick();
}

applyLang();
</script>
</body>
</html>

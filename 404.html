<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page introuvable — Gymnase · Frédéric Jaccard</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23155E4C'/%3E%3Ctext x='32' y='43' font-family='Arial,sans-serif' font-size='28' font-weight='bold' fill='%23FBFAF6' text-anchor='middle'%3EFJ%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Quattrocento+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBFAF6; --card:#F7F6F2; --primary:#155E4C; --primaryLight:#E3F0EA;
  --accent:#D96A08; --accentLight:#FDEBD8; --line:#D8D5CB; --ink:#20241F; --muted:#6E726B;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:"Quattrocento Sans",sans-serif;
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.box{max-width:520px;text-align:center}
.code{font-size:72px;font-weight:700;color:var(--primaryLight);line-height:1}
.kicker{font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-top:8px}
h1{font-size:24px;color:var(--primary);margin:8px 0 12px}
p{color:var(--muted);font-size:15px;line-height:1.55;margin-bottom:20px}
.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
a.btn{font-size:14px;font-weight:700;padding:10px 18px;border-radius:10px;border:2px solid var(--primary);
  background:var(--card);color:var(--primary);text-decoration:none}
a.btn:hover{background:var(--primaryLight)}
a.btn.solid{background:var(--primary);color:var(--bg)}
a.btn.solid:hover{background:#0f4a3c}
footer{margin-top:28px;font-size:13px;color:var(--muted)}
footer a{color:var(--muted);text-decoration:none}
footer a:hover{color:var(--primary);text-decoration:underline}
</style>
</head>
<body>
<div class="box">
  <div class="code">404</div>
  <div class="kicker" id="kicker"></div>
  <h1 id="title"></h1>
  <p id="msg"></p>
  <div class="btns">
    <a class="btn solid" href="index.html" id="backApp"></a>
    <a class="btn" href="https://www.fredericjaccard.com" id="backSite"></a>
  </div>
  <footer><a href="https://www.fredericjaccard.com">Frédéric Jaccard</a></footer>
</div>
<script>
const I18N = {
  fr:{ kicker:"PAGE INTROUVABLE", title:"Cette page n'existe pas (ou plus).",
    msg:"Le lien est peut-être ancien : les applications ont changé d'adresse. Retrouvez-les toutes sur le portail.",
    backApp:"← Toutes les applications", backSite:"← fredericjaccard.com" },
  en:{ kicker:"PAGE NOT FOUND", title:"This page does not exist (anymore).",
    msg:"The link may be outdated: the applications have moved. Find them all on the portal.",
    backApp:"← All applications", backSite:"← fredericjaccard.com" }
};
let lang = (function(){try{var s=localStorage.getItem("fj-lang");return (s==="fr"||s==="en")?s:"fr";}catch(e){return "fr";}})();
const T = () => I18N[lang];
function applyLang(){
  document.documentElement.lang = lang;
  document.getElementById("kicker").textContent = T().kicker;
  document.getElementById("title").textContent = T().title;
  document.getElementById("msg").textContent = T().msg;
  document.getElementById("backApp").textContent = T().backApp;
  document.getElementById("backSite").textContent = T().backSite;
}
applyLang();
</script>
</body>
</html>

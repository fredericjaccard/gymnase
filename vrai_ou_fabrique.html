<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Analysez des titres, images et captures d'écran : authentique ou fabriqué ? Découvrez ensuite les indices — source, date, image inversée, ton, corroboration — et entraînez-vous à vérifier avant de partager.">
<title>Vrai ou fabriqué ? · Gymnase — Frédéric Jaccard</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2320241F'/%3E%3Ctext x='32' y='43' font-family='Arial,sans-serif' font-size='28' font-weight='bold' fill='%23FFFFFF' text-anchor='middle'%3EFJ%3C/text%3E%3C/svg%3E">

<style>
:root{
  --bg:#FBFAF6; --card:#F7F6F2; --primary:#155E4C; --primaryLight:#E3F0EA;
  --accent:#D96A08; --accentLight:#FDEBD8; --line:#D8D5CB; --ink:#20241F; --muted:#6E726B;
  --error:#C84B31;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:"Quattrocento Sans",sans-serif;padding:20px}
header{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px;margin-bottom:16px}
.kicker{font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
h1{font-size:26px;color:var(--primary)}
.hdrBtns{display:flex;gap:8px}
button{font-family:inherit;font-size:14px;font-weight:700;padding:8px 16px;border-radius:10px;
  border:2px solid var(--primary);background:var(--card);color:var(--primary);cursor:pointer}
button:hover{background:var(--primaryLight)}
.instruction{background:var(--primaryLight);border-radius:12px;padding:12px 16px;margin-bottom:14px;font-size:15px;color:var(--primary)}
main{max-width:820px;margin:0 auto}
.prog{height:8px;background:var(--card);border:1px solid var(--line);border-radius:99px;overflow:hidden;margin-bottom:12px}
.progBar{height:100%;width:0;background:var(--accent);transition:width .4s}
.metaRow{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:8px}
.badge{background:var(--primaryLight);color:var(--primary);font-weight:700;font-size:12px;letter-spacing:.12em;text-transform:uppercase;padding:6px 14px;border-radius:99px;border:1px solid var(--primary)}
.metaN{color:var(--muted);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin:0 auto}
.decide{display:flex;gap:12px;justify-content:center;margin:18px auto 4px;flex-wrap:wrap}
.decide button{min-width:200px;min-height:52px;font-size:16px}
#btnFake{border-color:var(--error);color:var(--error)}
#btnFake:hover{background:var(--accentLight)}
.feedback{max-width:820px;margin:14px auto 0;border-radius:12px;padding:14px 18px;display:none}
.feedback.ok{background:var(--primaryLight);border:2px solid var(--primary)}
.feedback.ko{background:var(--accentLight);border:2px solid var(--error)}
.feedback .head{font-weight:700;font-size:17px;margin-bottom:6px}
.feedback.ok .head{color:var(--primary)}
.feedback.ko .head{color:var(--error)}
.checks{max-width:820px;margin:14px auto 0;border:1px solid var(--line);border-radius:12px;padding:16px 18px;background:var(--bg);display:none}
.checks h2{font-size:14px;color:var(--primary);letter-spacing:.12em;text-transform:uppercase;margin-bottom:12px}
#checkList{list-style:none}
#checkList li{display:flex;gap:12px;margin-bottom:12px;align-items:flex-start}
#checkList li:last-child{margin-bottom:0}
.ic{flex:0 0 24px;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;margin-top:1px}
.ic.yes{background:var(--primaryLight);color:var(--primary);border:1.5px solid var(--primary)}
.ic.no{background:var(--accentLight);color:var(--error);border:1.5px solid var(--error)}
.ckName{font-weight:700}
.nextBtn{display:block;margin:16px auto 0;background:var(--accent);border-color:var(--accent);color:#FBFAF6;font-size:15px;min-height:48px}
.nextBtn[hidden]{display:none}
.legend{max-width:820px;margin:10px auto 0;font-size:13px;color:var(--muted)}
.note{max-width:820px;margin:8px auto 0;font-size:12px;color:var(--muted);font-style:italic}
/* ---- maquettes de contenus (fictifs) ---- */
.mock{background:var(--bg);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.chrome{display:flex;align-items:center;gap:8px;background:var(--card);border-bottom:1px solid var(--line);padding:8px 12px}
.dot{width:11px;height:11px;border-radius:50%}
.url{flex:1;background:var(--bg);border:1px solid var(--line);border-radius:99px;font-size:12px;color:var(--muted);padding:4px 12px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.siteHead{display:flex;align-items:center;gap:10px;padding:14px 18px 6px}
.siteLogo{font-size:20px;font-weight:700;color:var(--primary);border-left:6px solid var(--accent);padding-left:8px}
.article{padding:8px 18px 16px}
.article h2{font-size:21px;color:var(--ink);margin-bottom:6px;line-height:1.25}
.byline{font-size:13px;color:var(--muted);margin-bottom:12px}
.lead{font-size:15px;line-height:1.45}
.tag{display:inline-block;background:var(--primaryLight);color:var(--primary);font-size:12px;font-weight:700;border-radius:6px;padding:3px 8px;margin-top:10px}
.credit{font-size:11px;color:var(--muted);margin-top:6px}
.phone{max-width:340px;margin:0 auto;border:3px solid var(--muted);border-radius:26px;padding:12px;background:var(--card)}
.smsFrom{font-weight:700;font-size:14px;margin-bottom:2px}
.smsTime{font-size:12px;color:var(--muted);margin-bottom:10px}
.bubble{background:var(--bg);border:1px solid var(--line);border-radius:14px;border-top-left-radius:4px;padding:10px 14px;font-size:14px;line-height:1.45}
.postHead{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.avatar{flex:0 0 40px;width:40px;height:40px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;color:var(--bg);font-weight:700;font-size:17px}
.postSrc{font-weight:700;font-size:15px}
.postSub{font-size:12px;color:var(--muted)}
.headline{font-size:23px;font-weight:700;line-height:1.25;margin-bottom:10px}
.chip{display:inline-block;background:var(--error);color:var(--bg);font-size:12px;font-weight:700;letter-spacing:.06em;border-radius:6px;padding:3px 10px;margin-bottom:8px}
.share{font-size:13px;color:var(--muted)}
.srcLine{font-size:14px;font-weight:700;color:var(--muted);margin-top:12px}
.figcap{font-size:14px;margin-top:10px}
.imgCredit{background:var(--ink);color:var(--bg);font-size:12px;padding:6px 12px;border-radius:0 0 12px 12px}
svg{display:block;width:100%;height:auto}
/* ---- bilan ---- */
.summary{max-width:820px;margin:0 auto}
.sumCard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;text-align:center;margin-bottom:16px}
.score{font-size:34px;font-weight:700;color:var(--primary);margin:6px 0}
.methodCard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
.methodCard h2{font-size:17px;color:var(--primary);margin-bottom:12px}
.methodCard ol{list-style:none;counter-reset:m}
.methodCard li{counter-increment:m;display:flex;gap:12px;margin-bottom:12px;align-items:flex-start}
.methodCard li::before{content:counter(m);flex:0 0 28px;width:28px;height:28px;border-radius:50%;background:var(--primary);color:var(--bg);font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px}
.mTxt b{display:block}
.restartBtn{display:block;margin:18px auto 0}
#fireworks{position:fixed;inset:0;pointer-events:none;z-index:50;display:none}
footer{margin-top:20px;text-align:center;font-size:13px;color:var(--muted)}
footer a{color:var(--muted);font-weight:400;text-decoration:none}
footer a:hover{text-decoration:underline}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
@media(max-width:640px){
  body{padding:14px}
  h1{font-size:22px}
  .hdrBtns{width:100%}
  button{min-height:44px}
  .decide{flex-direction:column}
  .decide button{width:100%}
  .headline{font-size:19px}
  .article h2{font-size:18px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>

/* ---------- logique de l'activité ---------- */
const TOTAL = 6;
let stage = 0, score = 0, answered = false, lastChoice = null, fwDone = false;

function render(){
  const t = T();
  $("summary").hidden = true;
  $("stage").style.display = "";
  const it = CONTENT[lang][stage];
  const badgeKey = it.type === "title" ? "typeTitle" : (it.type === "image" ? "typeImage" : "typeCapture");
  $("badge").textContent = t[badgeKey];
  $("metaN").textContent = t.itemN(stage + 1, TOTAL);
  $("progBar").style.width = (stage / TOTAL * 100) + "%";
  $("card").innerHTML = it.html;
  $("btnReal").textContent = t.btnReal;
  $("btnFake").textContent = t.btnFake;
  $("legend").textContent = t.legend;
  $("note").textContent = t.note;
  $("feedback").style.display = "none";
  $("checks").style.display = "none";
  $("nextBtn").hidden = true;
  $("decide").style.display = "";
  if(answered && lastChoice){ showFeedback(lastChoice); }
}

function decide(choice){
  if(answered) return;
  answered = true; lastChoice = choice;
  if(choice === CONTENT[lang][stage].verdict) score++;
  showFeedback(choice);
}

function showFeedback(choice){
  const t = T();
  const it = CONTENT[lang][stage];
  const good = choice === it.verdict;
  const fb = $("feedback");
  fb.className = "feedback " + (good ? "ok" : "ko");
  $("fbHead").textContent = (good ? t.correct + " " : t.wrong + " ") + (it.verdict === "real" ? t.verdictReal : t.verdictFake);
  $("fbWhy").textContent = it.why;
  fb.style.display = "block";
  $("checksTitle").textContent = t.checksTitle;
  $("checkList").innerHTML = it.checks.map(c =>
    '<li><span class="ic ' + (c.ok ? "yes" : "no") + '">' + (c.ok ? "✓" : "✗") +
    '</span><span><span class="ckName">' + t.ck[c.k] + '.</span> ' + c.t + '</span></li>'
  ).join("");
  $("checks").style.display = "block";
  $("decide").style.display = "none";
  $("nextBtn").hidden = false;
  $("nextBtn").textContent = stage === TOTAL - 1 ? t.nextLast : t.next;
  $("progBar").style.width = ((stage + 1) / TOTAL * 100) + "%";
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  fb.scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "nearest" });
}

function next(){
  stage++;
  answered = false; lastChoice = null;
  if(stage >= TOTAL){ renderSummary(true); }
  else render();
}

function renderSummary(withFw){
  const t = T();
  $("stage").style.display = "none";
  $("summary").hidden = false;
  $("progBar").style.width = "100%";
  $("sumTitle").textContent = t.sumTitle;
  $("scoreLine").textContent = t.scoreLine(score, TOTAL);
  $("scoreMsg").textContent = score === 6 ? t.scoreMsg6 : score >= 4 ? t.scoreMsg45 : score >= 2 ? t.scoreMsg23 : t.scoreMsg01;
  $("methodTitle").textContent = t.methodTitle;
  $("methodList").innerHTML = t.method.map(m =>
    '<li><span class="mTxt"><b>' + m.q + "</b>" + m.d + "</span></li>").join("");
  $("restartBtn").textContent = t.restart;
  $("note2").textContent = t.note;
  if(withFw && !fwDone){ fwDone = true; fireworks(); }
}

function restart(){
  stage = 0; score = 0; answered = false; lastChoice = null; fwDone = false;
  render();
}

/* ---------- feux d'artifice de fin ---------- */
function fireworks(){
  if(window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv = $("fireworks"), ctx = cv.getContext("2d");
  cv.width = innerWidth; cv.height = innerHeight;
  cv.style.display = "block";
  const COLORS = ["#155E4C", "#D96A08", "#C84B31"];
  const rockets = [], sparks = [];
  const launch = () => {
    rockets.push({
      x: cv.width * (0.15 + Math.random() * 0.7), y: cv.height,
      vx: (Math.random() - 0.5) * 2, vy: -(10 + Math.random() * 4),
      color: COLORS[Math.floor(Math.random() * COLORS.length)]
    });
  };
  const explode = r => {
    for(let i = 0; i < 90; i++){
      const ang = Math.random() * Math.PI * 2, sp = 2 + Math.random() * 5;
      sparks.push({ x: r.x, y: r.y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp, life: 60 + Math.random() * 40, color: r.color });
    }
  };
  let frame = 0;
  const tick = () => {
    ctx.clearRect(0, 0, cv.width, cv.height);
    frame++;
    if(frame < 260 && frame % 16 === 0) launch();
    for(let i = rockets.length - 1; i >= 0; i--){
      const r = rockets[i];
      r.x += r.vx; r.y += r.vy; r.vy += 0.18;
      ctx.beginPath(); ctx.arc(r.x, r.y, 3, 0, Math.PI * 2);
      ctx.fillStyle = r.color; ctx.fill();
      if(r.vy >= -1.5){ explode(r); rockets.splice(i, 1); }
    }
    for(let i = sparks.length - 1; i >= 0; i--){
      const s = sparks[i];
      s.x += s.vx; s.y += s.vy; s.vy += 0.05; s.vx *= 0.985; s.life--;
      ctx.globalAlpha = Math.max(0, s.life / 80);
      ctx.beginPath(); ctx.arc(s.x, s.y, 2.4, 0, Math.PI * 2);
      ctx.fillStyle = s.color; ctx.fill();
      if(s.life <= 0) sparks.splice(i, 1);
    }
    ctx.globalAlpha = 1;
    if(frame < 600 || rockets.length || sparks.length) requestAnimationFrame(tick);
    else cv.style.display = "none";
  };
  tick();
}

/* ---------- i18n, plein écran, initialisation ---------- */
function isFs(){ return !!(document.fullscreenElement || document.webkitFullscreenElement); }
$("fsBtn").onclick = () => {
  const el = document.documentElement;
  if(isFs()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  else {
    const req = el.requestFullscreen || el.webkitRequestFullscreen;
    if(req){ const r = req.call(el); if(r && r.catch) r.catch(() => {}); }
  }
};
function syncFsLabel(){ $("fsLabel").textContent = isFs() ? T().fsExit : T().fs; }
document.addEventListener("fullscreenchange", syncFsLabel);
document.addEventListener("webkitfullscreenchange", syncFsLabel);

function applyLang(){
  document.documentElement.lang = lang;
  $("kicker").textContent = T().kicker;
  $("title").textContent = T().title;
  $("instruction").textContent = T().instruction;
  $("langBtn").textContent = lang === "fr" ? "English" : "Français";
  $("backLink").textContent = T().backList;
  document.title = T().title + " — " + T().kicker;
  syncFsLabel();
  if($("summary").hidden){ render(); }
  else { renderSummary(false); }
}
$("langBtn").onclick = () => {
  lang = lang === "fr" ? "en" : "fr";
  try {
    localStorage.setItem("fj-lang", lang);
    document.cookie = "fj-lang=" + lang + ";domain=.fredericjaccard.com;path=/;max-age=31536000;SameSite=Lax";
  } catch(e) {}
  applyLang();
};
$("btnReal").onclick = () => decide("real");
$("btnFake").onclick = () => decide("fake");
$("nextBtn").onclick = next;
$("restartBtn").onclick = restart;

applyLang();
</script>

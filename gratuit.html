<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Jeu de gestion : dirigez une application gratuite, réglez publicité, collecte de données et abonnement pour survivre 12 mois sans perdre vos utilisateurs.">
<title>Gratuit ? · Gymnase — Frédéric Jaccard</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2320241F'/%3E%3Ctext x='32' y='43' font-family='Arial,sans-serif' font-size='28' font-weight='bold' fill='%23FFFFFF' text-anchor='middle'%3EFJ%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Quattrocento+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBFAF6; --card:#F7F6F2; --primary:#155E4C; --primaryLight:#E3F0EA;
  --accent:#D96A08; --accentLight:#FDEBD8; --line:#D8D5CB; --ink:#20241F; --muted:#6E726B;
  --error:#C84B31;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:"Quattrocento Sans",sans-serif;padding:20px;max-width:1000px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px;margin-bottom:16px}
.kicker{font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
h1{font-size:26px;color:var(--primary)}
.hdrBtns{display:flex;gap:8px}
button{font-family:inherit;font-size:14px;font-weight:700;padding:8px 16px;border-radius:10px;
  border:2px solid var(--primary);background:var(--card);color:var(--primary);cursor:pointer}
button:hover{background:var(--primaryLight)}
button:disabled{opacity:.4;cursor:default}
button:disabled:hover{background:var(--card)}
.instruction{background:var(--primaryLight);border-radius:12px;padding:12px 16px;margin-bottom:16px;font-size:15px}
footer{margin-top:20px;text-align:center;color:var(--muted);font-size:13px}
footer a{color:var(--muted);font-weight:400;text-decoration:none}
footer a:hover{text-decoration:underline}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}

/* Tableau de bord */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:10px 12px}
.stat .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stat .val{font-size:22px;font-weight:700;color:var(--primary);margin-top:2px}
.stat .sub{font-size:12px;color:var(--muted)}
.stat.bad .val{color:var(--error)}
.satBar{height:8px;background:var(--line);border-radius:4px;margin-top:6px;overflow:hidden}
.satFill{height:100%;background:var(--primary);border-radius:4px;transition:width .4s}
.stat.bad .satFill{background:var(--error)}

/* Historique */
.hist{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.histCard{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:10px 12px}
.histCard .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.bars{display:flex;align-items:flex-end;gap:4px;height:56px}
.bars .b{flex:1;background:var(--primary);border-radius:3px 3px 0 0;min-height:2px;opacity:.35}
.bars .b.now{opacity:1}
.bars .b.neg{background:var(--error);opacity:1}
.bars.money .b{background:var(--accent)}
.bars.money .b.neg{background:var(--error)}

/* Réglages */
.panel{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:14px}
.panel h2{font-size:16px;color:var(--primary);margin-bottom:10px}
.ctl{padding:10px 0;border-top:1px solid var(--line)}
.ctl:first-of-type{border-top:none}
.ctlHead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;min-height:22px;margin-bottom:2px}
.ctlHead label{font-weight:700;font-size:15px}
.ctl .sval{font-weight:700;color:var(--accent);font-size:15px;white-space:nowrap;text-align:right}
.ctl .hint{font-size:13px;color:var(--muted);margin-top:2px}
input[type=range]{width:100%;height:34px;accent-color:var(--accent);cursor:pointer}
.preview{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;font-size:14px}
.chip{background:var(--primaryLight);color:var(--primary);border-radius:8px;padding:6px 10px;font-weight:700}
.chip.warn{background:var(--accentLight);color:var(--error)}

/* Bouton mois suivant */
.nextRow{text-align:center;margin-bottom:14px}
#nextBtn{background:var(--accent);border-color:var(--accent);color:#fff;font-size:17px;padding:12px 28px}
#nextBtn:hover{background:var(--accent);filter:brightness(1.08)}

/* Journal */
.news{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:12px 16px}
.news h2{font-size:16px;color:var(--primary);margin-bottom:8px}
.news ul{list-style:none}
.news li{padding:6px 0;border-top:1px solid var(--line);font-size:14px}
.news li:first-child{border-top:none}
.news li .mo{font-weight:700;color:var(--accent);margin-right:6px}
.news li.alert{background:var(--accentLight);border-radius:8px;padding:6px 10px;margin:4px 0;border-top:none}
.news li.good{background:var(--primaryLight);border-radius:8px;padding:6px 10px;margin:4px 0;border-top:none}

/* Écran de fin */
.end{display:none;background:var(--card);border:2px solid var(--primary);border-radius:12px;padding:18px;margin-bottom:14px}
.end.lose{border-color:var(--error)}
.end h2{font-size:20px;color:var(--primary);margin-bottom:8px}
.end.lose h2{color:var(--error)}
.end p{font-size:15px;margin-bottom:8px}
.end .moral{background:var(--primaryLight);border-radius:10px;padding:10px 14px;font-weight:700;color:var(--primary);margin:10px 0 14px}
.end .recap{font-size:14px;color:var(--muted);margin-bottom:10px}
#fireworks{position:fixed;inset:0;pointer-events:none;z-index:50;display:none}

@media(max-width:640px){
  body{padding:14px}
  h1{font-size:22px}
  .hdrBtns{width:100%}
  button{min-height:44px}
  .stats{grid-template-columns:repeat(2,1fr)}
  .hist{grid-template-columns:1fr}
  .ctl input[type=range]{height:44px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header>
  <div>
    <div class="kicker" id="kicker"></div>
    <h1 id="title"></h1>
  </div>
  <div class="hdrBtns">
    <button id="langBtn" type="button">English</button>
    <button id="fsBtn" type="button"><span id="fsLabel"></span></button>
  </div>
</header>
<div class="instruction" id="instruction"></div>

<div class="stats">

  <div class="stat" id="stUsers"><div class="lbl" id="lblUsers"></div><div class="val" id="vUsers"></div><div class="sub" id="vPrem"></div></div>
  <div class="stat" id="stMoney"><div class="lbl" id="lblMoney"></div><div class="val" id="vMoney"></div></div>
  <div class="stat" id="stSat"><div class="lbl" id="lblSat"></div><div class="val" id="vSat"></div><div class="satBar"><div class="satFill" id="satFill"></div></div></div>
</div>

<div class="hist">

<div class="panel" id="panelCtl">

    <input type="range" id="lev3" min="0" max="5" step="1" value="0">
    <div class="hint" id="levHint3"></div>
  </div>
  <div class="preview" id="preview"></div>
</div>

<div class="nextRow"><button id="nextBtn" type="button"></button></div>

<div class="end" id="endBox">
  <h2 id="endTitle"></h2>
  <p id="endText"></p>
  <div class="recap" id="endRecap"></div>

  <button id="againBtn" type="button"></button>
</div>

<div class="news">
  <h2 id="lblNews"></h2>
  <ul id="newsList"></ul>
</div>

<footer><a href="index.html" id="backLink"></a> · <a href="https://fredericjaccard.com">Frédéric Jaccard</a></footer>
<canvas id="fireworks"></canvas>

<script>
const $ = id => document.getElementById(id);

const I18N = {

    hSub: "Les abonnés ne voient plus de pub et ne sont plus pistés. Une pub agressive pousse à s'abonner.",
    prevRev: (v) => "Recettes prévues : +" + v,
    prevCost: (v) => "Coûts : −" + v,
    prevBal: (v) => "Solde du mois : " + v,
    nextBtn: "Mois suivant ▶",
    lblNews: "Journal",
    nStart: "Votre application est en ligne. 10 000 utilisateurs, et des serveurs à payer chaque mois…",
    nScandal: "Scandale ! Un article révèle l'ampleur de votre collecte de données. La satisfaction chute.",
    nExodus: "Vos utilisateurs désinstallent en masse : ils ne se sentent plus respectés.",
    nGrowth: "Le bouche-à-oreille fonctionne : vos utilisateurs recommandent votre application.",
    nAds: "Sur les forums, on se plaint : il y a trop de publicités.",
    nPrem: (n) => n + " nouveaux abonnés premium ce mois-ci.",
    nCalm: "Un mois sans histoire.",
    mo: (m) => "Mois " + m,
    winTitle: "12 mois — vous avez survécu !",
    winData: "Regardez d'où vient l'argent : vos utilisateurs gratuits ne payaient rien, mais leurs données et leur attention étaient vendues. C'était eux, le produit.",
    winAds: "Vos utilisateurs gratuits ne payaient rien : c'est leur attention, vendue aux annonceurs, qui faisait tourner l'entreprise.",
    winSub: "Bravo : vous avez prouvé qu'un modèle viable peut reposer sur un abonnement honnête plutôt que sur l'exploitation des utilisateurs.",

    loseMoney: "Sans revenus suffisants, les serveurs coûtent plus cher que ce que rapporte l'application. « Gratuit » ne veut pas dire « sans coût » : quelqu'un doit payer.",
    loseUsersTitle: "Exode !",
    loseUsers: "Vous avez trop monétisé vos utilisateurs : ils sont partis. Sans eux, plus rien à vendre — ni pub, ni données, ni abonnements.",
    recap: (u, up, m, s) => "Bilan : " + u + " utilisateurs (" + up + " premium) · " + m + " en caisse · satisfaction " + s + " %.",
    moral: "« Si c'est gratuit, c'est vous le produit. »",
    moralTxt: " Une application gratuite doit quand même payer ses serveurs : si vous ne payez pas, c'est votre attention (publicité) ou vos données personnelles qui sont vendues.",

  },
  en: {

    title: "Free?",
    instruction: "You run a free app: 10,000 users, CHF 5,000 in the bank. Each month, tune the ads, the data collection and the premium subscription, then click “Next month”. Goal: survive 12 months without going bankrupt and without losing your users.",
    fs: "Fullscreen", fsExit: "Exit",
    backList: "← All applications",
    lblMonth: "Month", lblUsers: "Users", lblMoney: "Cash", lblSat: "Satisfaction",
    prem: (n) => n + " premium",
    lblHistU: "Users (12 months)", lblHistM: "Cash (12 months)",
    lblCtl: "Your settings for this month",
    lblAds: "Advertising", lblData: "Data collection", lblSub: "Premium subscription",
    adsLevels: ["None", "Discreet", "Moderate", "Noticeable", "Intrusive", "Invasive"],
    dataLevels: ["None", "Anonymous", "Basic", "Detailed", "Massive", "Total"],
    subLevels: ["No offer", "CHF 1/mo", "CHF 2/mo", "CHF 3/mo", "CHF 4/mo", "CHF 5/mo"],
    hAds: "Earns money per free user… but annoys them.",
    hData: "Sold to advertisers. Lucrative and discreet — until the scandal.",
    hSub: "Subscribers see no ads and are not tracked. Aggressive ads push users to subscribe.",
    prevRev: (v) => "Expected revenue: +" + v,
    prevCost: (v) => "Costs: −" + v,
    prevBal: (v) => "Month balance: " + v,
    nextBtn: "Next month ▶",
    lblNews: "News feed",
    nStart: "Your app is live. 10,000 users — and servers to pay every month…",
    nScandal: "Scandal! An article exposes the scale of your data collection. Satisfaction drops.",
    nExodus: "Your users are uninstalling in droves: they no longer feel respected.",
    nGrowth: "Word of mouth works: your users are recommending your app.",
    nAds: "On the forums, people complain: too many ads.",
    nPrem: (n) => n + " new premium subscribers this month.",
    nCalm: "An uneventful month.",
    mo: (m) => "Month " + m,
    winTitle: "12 months — you survived!",
    winData: "Look where the money came from: your free users paid nothing, but their data and attention were being sold. They were the product.",
    winAds: "Your free users paid nothing: it was their attention, sold to advertisers, that kept the company running.",
    winSub: "Well done: you proved a viable model can rest on an honest subscription rather than on exploiting users.",
    loseMoneyTitle: "Bankrupt!",
    loseMoney: "Without enough revenue, the servers cost more than the app earns. “Free” doesn't mean “costless”: someone has to pay.",
    loseUsersTitle: "Exodus!",
    loseUsers: "You monetised your users too hard: they left. Without them, nothing left to sell — no ads, no data, no subscriptions.",
    recap: (u, up, m, s) => "Final tally: " + u + " users (" + up + " premium) · " + m + " in cash · satisfaction " + s + " %.",
    moral: "“If it's free, you are the product.”",
    moralTxt: " A free app still has to pay for its servers: if you're not paying, it's your attention (advertising) or your personal data being sold.",
    again: "↺ Play again",
    endMonth: (m) => "End of month " + m + " / 12"
  }
};

let lang = (function () {
  try { const c = document.cookie.match(/(?:^|;\s*)fj-lang=([a-z]{2})/); if (c && (c[1] === "fr" || c[1] === "en")) return c[1]; } catch (e) {}
  try { const s = localStorage.getItem("fj-lang"); return (s === "fr" || s === "en") ? s : "fr"; } catch (e) { return "fr"; }
})();
const T = () => I18N[lang];

/* ---------- Formatage des nombres (FR : espace fine insécable / EN : virgule) ---------- */
function fmtNum(n) {
  n = Math.round(n);
  if (lang === "fr") return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, " ");
  return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
}
function fmtCHF(n) {
  const v = fmtNum(Math.abs(Math.round(n)));
  if (lang === "fr") return (n < 0 ? "−" : "") + v + " CHF";
  return (n < 0 ? "−" : "") + "CHF " + v;
}

/* ---------- État du jeu ---------- */
const MONTHS = 12;
let U, prem, M, S, month, over, news, histU, histM, revTot;

function reset() {
  U = 10000; prem = 0; M = 5000; S = 75;
  month = 0; over = null;
  news = [{ k: "nStart", cls: "" }];
  histU = []; histM = [];
  revTot = { ads: 0, data: 0, sub: 0 };
  $("endBox").style.display = "none";
  $("endBox").className = "end";
  $("panelCtl").style.display = "";
  $("nextBtn").style.display = "";
  render();
}

/* ---------- Un mois de simulation (formules calibrées) ---------- */
function stepMonth(ads, data, prix) {
  let free = U - prem, newPrem = 0;
  if (prix > 0) {
    const conv = Math.max(0, Math.min(8, 8 + 2 * ads - 2.5 * prix)) / 100;
    newPrem = free * conv;
    prem += newPrem; free -= newPrem;
    const cancel = prem * (6 + 3 * prix) / 100;
    prem -= cancel; free += cancel;
  }
  const rAds = free * ads * 0.04, rData = free * data * 0.03, rSub = prem * prix;
  const revenue = rAds + rData + rSub;
  const costs = 1800 + U * 0.04;
  revTot.ads += rAds; revTot.data += rData; revTot.sub += rSub;
  M += revenue - costs;
  const target = 85 - 8 * ads - 7 * data;
  const sBefore = S;
  S += (target - S) * 0.45;
  let scandal = false;
  if (data >= 3 && Math.random() < (data - 2) * 0.08) { S -= 18; scandal = true; }
  S = Math.max(0, Math.min(100, S));
  let rate = (S - 55) / 10;
  if (S < 35) rate -= (35 - S) / 8;
  rate = Math.max(-9, Math.min(6, rate)) / 100;
  U *= (1 + rate); prem *= (1 + rate);
  month++;
  histU.push(U); histM.push(M);

  /* Journal du mois */
  const items = [];
  if (scandal) items.push({ k: "nScandal", cls: "alert" });
  if (rate < -0.03) items.push({ k: "nExodus", cls: "alert" });
  else if (rate > 0.015 && S > 70) items.push({ k: "nGrowth", cls: "good" });
  if (ads >= 4) items.push({ k: "nAds", cls: "alert" });
  if (newPrem >= 100) items.push({ k: "nPrem", p: [fmtNum(newPrem)], cls: "good" });
  if (!items.length) items.push({ k: "nCalm", cls: "" });
  news = items.map(it => ({ ...it, mo: month })).concat(news).slice(0, 6);

  if (M <= 0) over = "money";
  else if (U < 1000) over = "users";
  else if (month >= MONTHS) over = (U >= 5000) ? "win" : "users";
}

/* ---------- Rendu ---------- */
function render() {
  const t = T();
  $("vMonth").textContent = month + " / " + MONTHS;
  $("vUsers").textContent = fmtNum(U);
  $("vPrem").textContent = t.prem(fmtNum(prem));
  $("vMoney").textContent = fmtCHF(M);
  $("vSat").textContent = Math.round(S) + " %";
  $("satFill").style.width = Math.max(0, Math.min(100, S)) + "%";
  $("stUsers").classList.toggle("bad", U < 5000);
  $("stMoney").classList.toggle("bad", M < 1500);
  $("stSat").classList.toggle("bad", S < 35);

  /* Historique */
  drawBars($("barsU"), histU, false);
  drawBars($("barsM"), histM, true);

  /* Réglages */
  const ads = +$("lev1").value, data = +$("lev2").value, prix = +$("lev3").value;
  $("levVal1").textContent = t.adsLevels[ads];
  $("levVal2").textContent = t.dataLevels[data];
  $("levVal3").textContent = t.subLevels[prix];
  $("levHint1").textContent = t.hAds;
  $("levHint2").textContent = t.hData;
  $("levHint3").textContent = t.hSub;

  /* Prévision (formules identiques à la simulation, hors hasard) */
  let free = U - prem, p2 = prem;
  if (prix > 0) {
    const conv = Math.max(0, Math.min(8, 8 + 2 * ads - 2.5 * prix)) / 100;
    const np = free * conv; p2 += np; free -= np;
    const cancel = p2 * (6 + 3 * prix) / 100; p2 -= cancel; free += cancel;
  }
  const rev = free * ads * 0.04 + free * data * 0.03 + p2 * prix;
  const cost = 1800 + U * 0.04;
  const bal = rev - cost;
  $("preview").innerHTML =
    '<span class="chip">' + t.prevRev(fmtCHF(rev)) + '</span>' +
    '<span class="chip">' + t.prevCost(fmtCHF(cost)) + '</span>' +
    '<span class="chip' + (bal < 0 ? " warn" : "") + '">' + t.prevBal((bal < 0 ? "−" : "+") + fmtCHF(Math.abs(bal))) + '</span>';

  /* Journal */
  $("newsList").innerHTML = news.map(n =>
    '<li class="' + n.cls + '"><span class="mo">' + (n.mo ? t.mo(n.mo) : "") + '</span>' +
    (n.p ? t[n.k].apply(null, n.p) : t[n.k]) + '</li>').join("");

  if (over) showEnd();
}

function drawBars(el, vals, money) {
  let html = "";
  const max = Math.max(1, ...vals.map(v => Math.abs(v)));
  for (let i = 0; i < MONTHS; i++) {
    if (i < vals.length) {
      const v = vals[i];
      const h = Math.max(4, Math.round(Math.abs(v) / max * 52));
      html += '<div class="b' + (i === vals.length - 1 ? " now" : "") + (v < 0 ? " neg" : "") + '" style="height:' + h + 'px"></div>';
    } else html += '<div class="b" style="height:2px;opacity:.12"></div>';
  }
  el.innerHTML = html;
}

function showEnd() {
  const t = T();
  const box = $("endBox");
  box.style.display = "block";
  $("panelCtl").style.display = "none";
  $("nextBtn").style.display = "none";
  let title, text;
  if (over === "win") {
    title = t.winTitle;
    const tot = revTot.ads + revTot.data + revTot.sub;
    if (revTot.sub >= tot * 0.6) text = t.winSub;
    else if (revTot.data >= revTot.ads) text = t.winData;
    else text = t.winAds;
  } else if (over === "money") { title = t.loseMoneyTitle; text = t.loseMoney; box.classList.add("lose"); }
  else { title = t.loseUsersTitle; text = t.loseUsers; box.classList.add("lose"); }
  $("endTitle").textContent = title;
  $("endText").textContent = text;
  $("endRecap").textContent = t.recap(fmtNum(U), fmtNum(prem), fmtCHF(M), Math.round(S));
  $("endMoral").innerHTML = t.moral + "<span style='font-weight:400'>" + t.moralTxt + "</span>";
  $("againBtn").textContent = t.again;
  if (over === "win" && !render.fwDone) { render.fwDone = true; fireworks(); }
}

/* ---------- Langue ---------- */
function applyLang() {
  document.documentElement.lang = lang;
  const t = T();
  $("kicker").textContent = t.kicker;
  $("title").textContent = t.title;
  $("instruction").textContent = t.instruction;
  $("langBtn").textContent = lang === "fr" ? "English" : "Français";
  $("fsLabel").textContent = isFs() ? t.fsExit : t.fs;
  $("backLink").textContent = t.backList;
  document.title = t.title + " · Gymnase — Frédéric Jaccard";
  $("lblMonth").textContent = t.lblMonth; $("lblUsers").textContent = t.lblUsers;
  $("lblMoney").textContent = t.lblMoney; $("lblSat").textContent = t.lblSat;
  $("lblHistU").textContent = t.lblHistU; $("lblHistM").textContent = t.lblHistM;
  $("lblCtl").textContent = t.lblCtl;
  $("levLbl1").textContent = t.lblAds; $("levLbl2").textContent = t.lblData; $("levLbl3").textContent = t.lblSub;
  $("nextBtn").textContent = t.nextBtn;
  $("lblNews").textContent = t.lblNews;
  render();
}
$("langBtn").onclick = () => {
  lang = lang === "fr" ? "en" : "fr";
  try {
    localStorage.setItem("fj-lang", lang);
    document.cookie = "fj-lang=" + lang + ";domain=.fredericjaccard.com;path=/;max-age=31536000;SameSite=Lax";
  } catch (e) {}
  applyLang();
};

/* ---------- Plein écran (Safari inclus) ---------- */
function isFs() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }
$("fsBtn").onclick = () => {
  const el = document.documentElement;
  if (isFs()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  else {
    const req = el.requestFullscreen || el.webkitRequestFullscreen;
    if (req) { const r = req.call(el); if (r && r.catch) r.catch(() => {}); }
  }
};
function syncFsLabel() { $("fsLabel").textContent = isFs() ? T().fsExit : T().fs; }
document.addEventListener("fullscreenchange", syncFsLabel);
document.addEventListener("webkitfullscreenchange", syncFsLabel);

/* ---------- Feux d'artifice (victoire) ---------- */
let fwRunning = false;
function fireworks() {
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv = $("fireworks"), ctx = cv.getContext("2d");
  cv.width = innerWidth; cv.height = innerHeight;
  cv.style.display = "block";
  fwRunning = true;
  const COLORS = ["#155E4C", "#D96A08", "#C84B31"];
  const rockets = [], sparks = [];
  const launch = () => {
    rockets.push({
      x: cv.width * (0.15 + Math.random() * 0.7), y: cv.height,
      vx: (Math.random() - 0.5) * 2, vy: -(10 + Math.random() * 4),
      color: COLORS[Math.floor(Math.random() * COLORS.length)]
    });
  };
  const explode = r => {
    for (let i = 0; i < 90; i++) {
      const ang = Math.random() * Math.PI * 2, sp = 2 + Math.random() * 5;
      sparks.push({ x: r.x, y: r.y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp,
                    life: 60 + Math.random() * 40, color: r.color });
    }
  };
  let frame = 0;
  const tick = () => {
    ctx.clearRect(0, 0, cv.width, cv.height);
    frame++;
    if (frame < 260 && frame % 16 === 0) launch();
    for (let i = rockets.length - 1; i >= 0; i--) {
      const r = rockets[i];
      r.x += r.vx; r.y += r.vy; r.vy += 0.18;
      ctx.beginPath(); ctx.arc(r.x, r.y, 3, 0, Math.PI * 2);
      ctx.fillStyle = r.color; ctx.fill();
      if (r.vy >= -1.5) { explode(r); rockets.splice(i, 1); }
    }
    for (let i = sparks.length - 1; i >= 0; i--) {
      const s = sparks[i];
      s.x += s.vx; s.y += s.vy; s.vy += 0.05; s.vx *= 0.985; s.life--;
      ctx.globalAlpha = Math.max(0, s.life / 80);
      ctx.beginPath(); ctx.arc(s.x, s.y, 2.4, 0, Math.PI * 2);
      ctx.fillStyle = s.color; ctx.fill();
      if (s.life <= 0) sparks.splice(i, 1);
    }
    ctx.globalAlpha = 1;
    if (frame < 600 || rockets.length || sparks.length) requestAnimationFrame(tick);
    else { cv.style.display = "none"; fwRunning = false; }
  };
  tick();
}

/* ---------- Interactions ---------- */
["lev1", "lev2", "lev3"].forEach(id => $(id).addEventListener("input", render));
$("nextBtn").onclick = () => {
  if (over) return;
  stepMonth(+$("lev1").value, +$("lev2").value, +$("lev3").value);
  render();
};
$("againBtn").onclick = () => { render.fwDone = false; reset(); };

reset();
applyLang();

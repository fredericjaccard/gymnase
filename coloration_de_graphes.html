<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Comprenez les contraintes de coloration, appliquez un algorithme glouton et organisez des examens sans conflit.">
<title>Coloration de graphes · Gymnase — Frédéric Jaccard</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2320241F'/%3E%3Ctext x='32' y='43' font-family='Arial,sans-serif' font-size='28' font-weight='bold' fill='%23FFFFFF' text-anchor='middle'%3EFJ%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Quattrocento+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#FBFAF6; --card:#F7F6F2; --primary:#155E4C; --primaryLight:#E3F0EA;
  --accent:#D96A08; --accentLight:#FDEBD8; --line:#D8D5CB; --ink:#20241F;
  --muted:#6E726B; --error:#C84B31;
}
*,*::before,*::after { box-sizing:border-box }
[hidden] { display:none !important }
body { margin:0; background:var(--bg); color:var(--ink); font:17px/1.45 "Quattrocento Sans",sans-serif }
.page { max-width:1340px; margin:auto; padding:28px 24px 20px }
h1,h2,h3,p { margin:0 }
h1,h2,h3 { color:var(--primary); line-height:1.2 }
h1 { font-size:clamp(28px,4vw,40px) }
h2 { font-size:clamp(23px,2.7vw,30px) }
h3 { font-size:20px }
p { max-width:76ch }
.masthead,.header-actions,.actions,#navigation,.legend { display:flex; align-items:center; flex-wrap:wrap; gap:8px }
.masthead { justify-content:space-between; gap:12px; margin-bottom:18px }
.header-actions { margin-left:auto }
.kicker { margin-bottom:5px; color:var(--accent); font-size:12px; font-weight:700; letter-spacing:.18em; text-transform:uppercase }
button { min-height:44px; min-width:44px; border:1px solid var(--primary); border-radius:9px; padding:7px 12px; background:var(--card); color:var(--primary); font:700 1em/1.25 "Quattrocento Sans",sans-serif; cursor:pointer; touch-action:manipulation; overflow-wrap:anywhere }
button:hover:not(:disabled) { background:var(--primaryLight) }
button:disabled { cursor:default; color:var(--muted); border-color:var(--line) }
button.active { background:var(--primary); color:var(--bg) }
button.active:hover { background:var(--primary) }
button.primary:not(:disabled) { background:var(--accentLight); color:var(--ink); border-color:var(--accent) }
button.primary:hover:not(:disabled) { border-color:var(--ink) }
button.secondary { border-color:var(--line) }
button[aria-pressed="true"] { background:var(--primaryLight); border-color:var(--primary); box-shadow:inset 0 0 0 1px var(--primary) }
:focus-visible { outline:3px solid var(--accent); outline-offset:3px }
.instruction { max-width:none; padding:11px 15px; margin-bottom:14px; border-radius:10px; color:var(--primary); background:var(--primaryLight) }
#navigation { margin-bottom:15px }
#navigation button { font-size:15px }
.badge { display:inline-block; margin-left:7px; padding:1px 6px; border-radius:4px; background:var(--primaryLight); color:var(--primary); font-size:13px }
.screen,.graph-card,.quiz-card { min-width:0; border:1px solid var(--line); border-radius:13px; background:var(--card) }
.screen { padding:clamp(13px,2.2vw,24px) }
.screen-heading { display:flex; align-items:flex-start; justify-content:space-between; flex-wrap:wrap; gap:10px }
.screen-heading > div { flex:1 1 300px; min-width:0 }
.screen-heading p { margin-top:7px }
.screen-heading button { flex-shrink:0 }
.workspace { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:clamp(12px,2.1vw,24px); align-items:start; margin-top:16px }
.worksheet { display:grid; gap:12px; min-width:0; align-content:start }
.graph-card { background:var(--bg); padding:12px }
.graph-card h3 { font-size:18px }
.graph-card svg { width:100%; height:auto; display:block; overflow:visible }
.edge { stroke:var(--muted); stroke-width:1.8px; vector-effect:non-scaling-stroke }
.conflict-edge { stroke:var(--error); stroke-width:3px; stroke-dasharray:7 4 }
.node-shape { stroke:var(--muted); stroke-width:1.7px; vector-effect:non-scaling-stroke }
.node-halo { fill:none; stroke:var(--accent); stroke-width:3px; vector-effect:non-scaling-stroke }
.related .node-halo { stroke:var(--primary); stroke-width:2px; stroke-dasharray:3 3 }
.current .node-halo { stroke:var(--accent); stroke-width:3px; stroke-dasharray:none }
.vertex-name,.vertex-color { fill:var(--ink); text-anchor:middle; dominant-baseline:middle; pointer-events:none; font-weight:700 }
.vertex-name { font-size:24px }
.vertex-color { font-size:18px }
.c0 .node-shape { fill:var(--card) }
.c1,.c1 .node-shape { background:var(--primary); fill:var(--primary); color:var(--bg) }
.c2,.c2 .node-shape { background:var(--accent); fill:var(--accent); color:var(--ink) }
.c3,.c3 .node-shape { background:var(--ink); fill:var(--ink); color:var(--bg) }
.c4,.c4 .node-shape { background:var(--muted); fill:var(--muted); color:var(--bg) }
.c5,.c5 .node-shape { background:var(--primaryLight); fill:var(--primaryLight); color:var(--ink) }
.c6,.c6 .node-shape { background:var(--line); fill:var(--line); color:var(--ink) }
:is(.c1,.c3,.c4) :is(.vertex-name,.vertex-color) { fill:var(--bg) }
.hit-area { fill:transparent; stroke:none }
.vertex[role="button"] { cursor:pointer; touch-action:manipulation }
.vertex.disabled-vertex { opacity:.55; cursor:default }
.vertex[role="button"]:hover .node-shape,.vertex[role="button"]:focus-visible .node-shape { stroke:var(--ink); stroke-width:3px }
.vertex[role="button"]:focus-visible { outline:none }
.vertex[role="button"]:focus-visible .hit-area { stroke:var(--accent); stroke-width:3px; stroke-dasharray:4 3; vector-effect:non-scaling-stroke }
.legend { padding:8px 0 4px; margin:0; list-style:none; font-size:14px; gap:7px 12px }
.legend li { display:flex; align-items:center; gap:6px }
.key { display:inline-block; width:15px; height:15px; flex:none }
.key.selected { border:2px solid var(--accent); border-radius:50% }
.key.related { border:2px dashed var(--primary); border-radius:50% }
.key.conflict-key { height:0; border-top:3px dashed var(--error) }
details { min-width:0 }
summary { color:var(--primary); cursor:pointer; min-height:44px; padding:10px 0; font-weight:700 }
.definitions { display:grid; gap:5px; margin:15px 0 5px; padding-left:23px; max-width:85ch }
.use-cases { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; margin:16px 0 12px }
.use-case { min-width:0; padding:13px 15px; border:1px solid var(--line); border-radius:10px; background:var(--bg) }
.use-case h3 { font-size:19px; margin-bottom:6px }
.use-case:last-child:nth-child(odd) { grid-column:1/-1 }
.concept-controls { margin:8px 0 }
.concept-workspace { margin-top:12px }
.info-extra { margin-top:22px; border-top:1px solid var(--line); padding-top:8px }
.info-extra>details+details { margin-top:8px }
.other-algorithms { margin-top:16px; padding-top:16px; border-top:1px solid var(--line) }
.algorithm-names { display:flex; flex-wrap:wrap; gap:6px 30px; padding-left:22px; margin:12px 0 }
.algorithm-names li { max-width:100%; overflow-wrap:anywhere }
.extra-label { margin-top:12px; margin-bottom:8px }
.extra-result { margin:12px 0 }
.stage-label { display:inline-block; margin:15px 0 10px; padding:7px 11px; border-radius:8px; background:var(--primaryLight); color:var(--primary); font-weight:700 }
.enrollments { table-layout:fixed; font-size:15px }
.enrollments th:first-child { width:29% }
.enrollments th,.enrollments td { vertical-align:middle }
.enrollments button { min-width:0; width:100%; padding:7px 6px }
.subject-list { display:flex; flex-wrap:wrap; gap:5px 12px }
.subject-list span { display:inline-block }
.selected-person>* { background:var(--primaryLight) }
.hint-grid.person-hint { display:block }
.rules { margin:0 0 8px; padding-left:23px }
.rules li+li { margin-top:5px }
.demo-heading { border-top:1px solid var(--line); padding-top:20px; margin-top:18px; display:grid; gap:12px }
.demo-heading h2 { font-size:24px }
.demo-heading > .actions button { flex:1 1 240px }
.demo-intro { margin-top:12px }
.demo-orders { margin-top:10px }
.meetings { table-layout:fixed }
.meetings th:first-child { width:20% }
.meetings th:nth-child(2) { width:47% }
.meeting-room { display:inline-flex; align-items:center; flex-wrap:wrap; gap:3px }
.guide-exercises { margin-top:16px }
.guide-exercises button { flex:0 1 auto }
.demo-control { display:flex; align-items:center; gap:8px 12px; flex-wrap:wrap }
.step-indicator,.note { color:var(--muted); font-size:15px }
.step-indicator { font-variant-numeric:tabular-nums }
.explanation,.hint-grid,.proof { padding:12px; border-left:3px solid var(--primary); border-radius:0 8px 8px 0; background:var(--bg) }
.explanation p,.proof p { margin-top:7px }
.hint-grid { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:10px }
.eyebrow { color:var(--primary); font-size:15px; font-weight:700 }
.feedback { padding:10px 12px; border:1px solid var(--primary); border-radius:9px; background:var(--primaryLight); color:var(--primary); overflow-wrap:anywhere }
.feedback.error { border-color:var(--error); background:var(--accentLight); color:var(--ink) }
#fullscreen-message { margin-bottom:10px }
.table-wrap { max-width:100%; overflow-x:auto; border:1px solid var(--line); border-radius:9px }
table { width:100%; border-collapse:collapse; background:var(--bg); font-size:15px }
th,td { border-bottom:1px solid var(--line); border-right:1px solid var(--line); padding:8px; text-align:left; vertical-align:top; font-variant-numeric:tabular-nums }
tr:last-child>* { border-bottom:0 }
tr>:last-child { border-right:0 }
thead th { background:var(--primary); color:var(--bg); font-weight:700 }
tbody th { color:var(--primary); font-weight:700 }
.history { min-width:390px }
.history th:first-child { width:13% }
.history th:last-child { width:18% }
.history td:last-child { text-align:center }
tr.latest>th { background:var(--primaryLight) }
tr.draft>* { background:var(--accentLight) }
.schedule th:first-child { width:34% }
.schedule td { overflow-wrap:anywhere }
.attempts th:first-child { width:65% }
.color-chip { display:inline-flex; min-width:28px; align-items:center; justify-content:center; padding:1px 5px; border:1px solid var(--muted); border-radius:5px; font-size:14px; font-weight:700; white-space:nowrap; line-height:1.5; margin:1px 0 }
.sequence { display:flex; flex-wrap:wrap; gap:6px; margin:0; padding:0; list-style:none }
.sequence li { display:flex; align-items:center; gap:6px }
.sequence li:not(:last-child)::after { content:"→"; color:var(--muted) }
.sequence li span { padding:4px 10px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--primary); font-weight:700 }
.sequence li span.current { background:var(--accentLight); border-color:var(--accent) }
.vertex-choices { display:flex; flex-wrap:wrap; gap:7px }
.vertex-choice { min-width:44px }
.palette { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px }
.color-button { min-height:52px; display:flex; align-items:center; justify-content:flex-start; gap:8px; padding:7px 8px; font-size:16px }
.swatch { display:inline-flex; flex:none; width:29px; height:29px; align-items:center; justify-content:center; border:1px solid var(--muted); border-radius:50%; font-size:13px }
.color-button.chosen { background:var(--primaryLight); box-shadow:inset 0 0 0 1px var(--primary) }
.conflicting-subject { text-decoration:underline; text-decoration-style:wavy; text-decoration-color:var(--error) }
.minimum-assignment { display:flex; flex-wrap:wrap; gap:10px }
.quiz-grid { display:grid; gap:12px; margin-top:16px }
.quiz-card { padding:15px; background:var(--bg) }
.quiz-card h3 { font-size:20px; max-width:80ch }
.quiz-card .actions,.quiz-card .feedback { margin-top:10px }
footer { margin-top:20px; text-align:center; color:var(--muted); font-size:13px }
footer a { color:var(--muted); font-weight:400; text-decoration:none }
footer a:hover { text-decoration:underline }
.sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip-path:inset(50%); white-space:nowrap; border:0 }
@media(max-width:800px) {
  .workspace { grid-template-columns:minmax(0,1fr) }
  .graph-card { width:100% }
}
@media(max-width:640px) {
  body { font-size:16px }
  .page { padding:14px 10px 18px }
  .screen { padding:11px }
  .graph-card { padding:7px }
  .vertex-name { font-size:29px }
  .vertex-color { font-size:23px }
  .palette { grid-template-columns:repeat(2,minmax(0,1fr)) }
  .color-button { font-size:15px }
  .quiz-card { padding:11px }
  .quiz-card h3 { font-size:19px }
  th,td { padding:7px 6px }
  .schedule { font-size:14px }
  .meetings { font-size:14px }
  .header-actions { gap:6px }
  .use-cases { grid-template-columns:minmax(0,1fr); gap:8px }
  .enrollments { font-size:14px }
  .enrollments th:first-child { width:30% }
  .subject-list { gap:4px }
  .history { min-width:0; table-layout:fixed; font-size:13px }
  .history th,.history td { padding:7px 4px; overflow-wrap:anywhere }
  .history th:first-child { width:20% }
  .history th:last-child { width:18% }
}
@media(prefers-reduced-motion:reduce) {
  *,*::before,*::after { scroll-behavior:auto !important }
}

</style>
</head>
<body>
<div class="page">
  <header class="masthead">
    <div>
      <p class="kicker" id="kicker"></p>
      <h1 id="title"></h1>
    </div>
    <div class="header-actions">
      <button type="button" id="language" lang="en">English</button>
      <button type="button" id="fullscreen"></button>
    </div>
  </header>
  <p class="feedback error" id="fullscreen-message" role="status" hidden></p>
  <p class="instruction" id="instruction"></p>
  <nav id="navigation"></nav>
  <main id="activity"></main>
  <p class="sr-only" id="announcement" role="status" aria-atomic="true"></p>
  <footer><a href="algorithmique.html" id="backLink"></a> · <a href="https://fredericjaccard.com">Frédéric Jaccard</a></footer>
</div>

function neighbors(graph, vertex) {
  return graph.edges.flatMap(([a, b]) => a === vertex ? [b] : b === vertex ? [a] : []);
}

function usedColors(colors) {
  return [...new Set(Object.values(colors).filter(Boolean))].sort((a, b) => a - b);
}

function conflicts(graph, colors) {
  return graph.edges.filter(([a, b]) => colors[a] && colors[a] === colors[b]);
}

function isComplete(graph, colors) {
  return graph.nodes.every(vertex => Number.isInteger(colors[vertex]) && colors[vertex] > 0);
}

function greedy(graph, order) {
  const colors = {};
  return order.map(vertex => {
    const adjacent = neighbors(graph, vertex).filter(v => colors[v]);
    const forbidden = usedColors(Object.fromEntries(adjacent.map(v => [v, colors[v]])));
    let color = 1;
    while (forbidden.includes(color)) color++;
    colors[vertex] = color;
    return { vertex, adjacent, forbidden, color, colors: { ...colors } };
  });
}

function minimumColoring(graph) {
  const order = [...graph.nodes].sort((a, b) => neighbors(graph, b).length - neighbors(graph, a).length);
  for (let limit = 1; limit <= graph.nodes.length; limit++) {
    const colors = {};
    function assign(index) {
      if (index === order.length) return { ...colors };
      const vertex = order[index];
      const unavailable = new Set(neighbors(graph, vertex).map(v => colors[v]));
      for (let color = 1; color <= limit; color++) {
        if (unavailable.has(color)) continue;
        colors[vertex] = color;
        const result = assign(index + 1);
        if (result) return result;
      }
      delete colors[vertex];
      return null;
    }
    const solution = assign(0);
    if (solution) return { count: limit, colors: solution };
  }
}

function handlePlanning(action,value,target) {
  if (!action.startsWith("planning-")) return false;
  const p=state.exams, sub=action.slice(9);
  if (sub==="back") {
    p.phase="build";p.checked=false;p.pair=[];p.buildFeedback=null;p.feedback=null;
    render("screen-title");return true;
  }
  if (p.phase!=="build") return true;
  if (sub==="person") {
    const index=Number(value);
    if(Number.isInteger(index)&&ENROLLMENTS[index])p.person=index;
    p.pair=[];p.buildFeedback=null;render(target.id);return true;
  }
  if (sub==="vertex" && GRAPHS.exams.nodes.includes(value)) {
    if(p.pair.includes(value))p.pair=p.pair.filter(v=>v!==value);
    else if(p.pair.length===2)p.pair=[value];
    else p.pair.push(value);
    p.buildFeedback=null;render("planning-vertex-"+value);return true;
  }
  if (sub==="undo") {
    if(p.edges.length)p.edges.pop();
    p.pair=[];p.checked=false;p.buildFeedback=null;render(target.id);return true;
  }
  if (sub==="add") {
    if(p.pair.length!==2)p.buildFeedback={type:"pair"};
    else {
      const [a,b]=[...p.pair].sort(), people=edgeWitnesses(a,b);
      if(!people.length)p.buildFeedback={type:"wrong",a,b};
      else if(p.edges.some(pair=>edgeKey(pair)===edgeKey([a,b])))p.buildFeedback={type:"duplicate",a,b,people};
      else {
        p.edges.push([a,b]);p.pair=[];p.checked=false;
        p.buildFeedback={type:"added",a,b,people};
      }
    }
    render("feedback");announce($("feedback").textContent);return true;
  }
  if(sub==="continue") {
    if(!planningComplete()) {
      const have=new Set(p.edges.map(edgeKey));
      p.buildFeedback={type:"missing",count:GRAPHS.exams.edges.filter(pair=>!have.has(edgeKey(pair))).length};
      render("feedback");announce($("feedback").textContent);
    } else {
      p.phase="color";p.buildFeedback=null;checkPainter(p,GRAPHS.exams);
      render("screen-title");
    }
    return true;
  }
  return true;
}

    body += "<h3 id='turn-heading' tabindex='-1'>" + esc(t().turn(step.vertex)) + "</h3>";
    if (!independent) body += "<div class='hint-grid'><div><p class='eyebrow'>" + esc(t().neighborHeading) + "</p><p>" +
      (step.adjacent.length ? step.adjacent.map(v=>v+" "+chip(colors[v])).join(", ") : esc(t().noNeighbor)) +
      "</p></div><div><p class='eyebrow'>" + esc(t().forbiddenHeading) + "</p><p>" + colorList(step.forbidden) + "</p></div></div>";
    else body += "<p class='note'>" + esc(t().independent) + "</p>";
    body += "<p class='note'>" + esc(t().automaticColor) + "</p>" +
      palette(graph.paletteSize || graph.nodes.length,run.choice,prefix+"-color") +
      (run.choice ? "<p class='note'>" + esc(t().attemptColor(step.vertex,run.choice)) + "</p>" : "") + runFeedback(run,trace,graph);
  }
  if (complete) {
    const count = usedColors(colors).length;
    body += notice(independent ? (count === 2 ? t().orderSuccess : t().fewer(count)) : t().guideSuccess(run.order.length,count));
    if (independent) body += "<p class='proof'>" + esc(count === 2 ? t().edgeProof(...graph.bound) : t().edgeLowerBound(...graph.bound)) + "</p><div class='actions'>" +
      button(t().tryAnother,"order-build",{class:"primary"}) + "</div>";
    else if (house) body += "<p>" + esc(t().houseObservation) + "</p><div class='actions'>" +
      button(t().houseStart,"guide-improve",{class:"primary"}) + "</div>";
    else body += "<p class='proof'>" + esc(t().triangleProof(...graph.bound,MINIMUM.prism.count)) + "</p><div class='actions'>" +
      button(t().guideNextExercise,"guide-exercise",{value:1,id:"guide-next-exercise",class:"primary"}) + "</div>";
  }
  body += "<div class='actions'>" + button(t().undo,prefix+"-undo",{disabled:!run.completed,class:"secondary"}) + "</div>" +
    history(graph,trace,run.completed,!reviewing,!independent);
  if (independent) body += attemptsTable(run);
  return body + "</section></div>";
}
function quizScreen() {
  return heading(t().quizHead,t().quizIntro) + "<div class='quiz-grid'>" + t().quiz.map((q,i)=>{
    const answer = state.quiz[i], correct = answer === q.answer;
    return "<section class='quiz-card' aria-labelledby='quiz-"+i+"'><h3 id='quiz-"+i+"'>"+(i+1)+". "+esc(q.statement)+"</h3>" +
      "<div class='actions' role='group' aria-labelledby='quiz-"+i+"'>" +
      button(t().yes,"quiz",{value:i+":true",id:"quiz-"+i+"-true",pressed:answer === true}) +
      button(t().no,"quiz",{value:i+":false",id:"quiz-"+i+"-false",pressed:answer === false}) + "</div>" +
      (answer === null ? "" : notice((correct ? t().correct : t().incorrect)+" "+q.explanation,!correct,"quiz-feedback-"+i)) + "</section>";
  }).join("") + "</div>";
}
function achievements() {
  const valid = (p,g) => p.checked && isComplete(g,p.colors) && !conflicts(g,p.colors).length;
  const a = state.autonomous, last = greedy(GRAPHS.cube,a.order).at(-1).colors;
  return [false,valid(state.free,GRAPHS.cycle),
    state.guide.completed === GRAPHS.prism.nodes.length && houseImproved(),
    !a.constructing && a.completed === GRAPHS.cube.nodes.length && usedColors(last).length === MINIMUM.cube.count,
    state.exams.phase==="color" && planningComplete() && valid(state.exams,GRAPHS.exams) && usedColors(state.exams.colors).length === MINIMUM.exams.count,
    state.quiz.every((answer,i)=>answer === t().quiz[i].answer)];
}
function render(focusId) {
  const done = achievements();
  $("navigation").innerHTML = t().sections.map((label,i)=>
    "<button type='button' data-act='nav' data-value='"+i+"'"+(state.screen === i ? " aria-current='page' class='active'" : "")+">"+
    (i ? i+". " : "")+esc(label)+(done[i] ? "<span class='badge'>✓ "+esc(t().done)+"</span>" : "")+"</button>").join("");
  const screens = [infoScreen,()=>painterScreen(false),()=>runScreen(false),()=>runScreen(true),()=>painterScreen(true),quizScreen];
  $("activity").innerHTML = "<section class='screen'>"+screens[state.screen]()+"</section>";
  if (focusId && $(focusId)) $(focusId).focus({preventScroll:true});
}
function fullscreenActive() {
  return !!(document.fullscreenElement || document.webkitFullscreenElement);
}
function updateFullscreen() {
  $("fullscreen").textContent = fullscreenActive() ? t().exitFullscreen : t().fullscreen;
  $("fullscreen-message").hidden = !state.fullscreenError;
  $("fullscreen-message").textContent = t().fullscreenUnavailable;
}
function applyLang(focusId) {
  $("announcement").textContent = "";
  document.documentElement.lang = lang;
  document.title = t().title+" · Gymnase — Frédéric Jaccard";
  document.querySelector('meta[name="description"]').content = t().description;
  $("kicker").textContent = t().kicker;
  $("title").textContent = t().title;
  $("instruction").textContent = t().instruction;
  $("backLink").textContent = t().backList;
  $("navigation").setAttribute("aria-label",t().navigation);
  $("language").textContent = lang === "fr" ? "English" : "Français";
  $("language").lang = lang === "fr" ? "en" : "fr";
  updateFullscreen();
  render(focusId);
}
function saveLanguage() {
  try {
    localStorage.setItem("fj-lang",lang);
    document.cookie = "fj-lang="+lang+";domain=.fredericjaccard.com;path=/;max-age=31536000;SameSite=Lax";
  } catch (_) {}
}
async function toggleFullscreen() {
  state.fullscreenError = false;
  try {
    if (fullscreenActive()) {
      const exit = document.exitFullscreen || document.webkitExitFullscreen;
      if (!exit) throw new Error("unavailable");
      await exit.call(document);
    } else {
      const enter = document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen;
      if (!enter) throw new Error("unavailable");
      await enter.call(document.documentElement);
    }
  } catch (_) { state.fullscreenError = true; announce(t().fullscreenUnavailable); }
  updateFullscreen();
}
function updatePainter(p,vertex,color) {
  const old = p.colors[vertex] || 0;
  if (old === color) return;
  p.undo.push({vertex,color:old});
  if (color) p.colors[vertex] = color;
  else delete p.colors[vertex];
  p.checked = false;
  p.feedback = null;
}
function checkPainter(p,graph) {
  p.checked = isComplete(graph,p.colors) && !conflicts(graph,p.colors).length;
  p.feedback = null;
}
function validateRun(run, graph, independent) {
  if (run.phase !== "color") return;
  const trace = greedy(graph,run.order), step = trace[run.completed];
  if (!Number.isInteger(run.choice)) run.feedback = {type:"missing"};
  else if (step.forbidden.includes(run.choice)) {
    const previous = run.completed ? trace[run.completed-1].colors : {};
    run.feedback = {type:"conflict",color:run.choice,neighbor:step.adjacent.find(v=>previous[v] === run.choice)};
  } else if (run.choice !== step.color) run.feedback = {type:"later",color:run.choice};
  else {
    run.completed++;
    run.phase = "review";
    run.feedback = null;
    if (independent && run.completed === run.order.length) {
      const result = {order:[...run.order],count:usedColors(step.colors).length};
      if (!run.attempts.some(a=>a.order.join() === result.order.join())) run.attempts.push(result);
    }
    render(run.completed === run.order.length ? "feedback" : "run-next");
    announce(t().validated+" "+t().coloredDemo(step.vertex,step.color));
    return;
  }
  render("feedback");
  announce($("feedback").textContent);
}
function handleHouseImprovement(action,value,target) {
  if (!action.startsWith("improve-")) return false;
  const p = state.houseImprovement, graph = GRAPHS.house, sub = action.split("-")[1];
  if (state.screen !== 2 || state.guideExercise !== 1 || !p) return true;
  if (sub === "vertex" && graph.nodes.includes(value)) p.selected = value;
  if (sub === "color" && Number.isInteger(Number(value)) && Number(value) >= 1 && Number(value) <= graph.paletteSize) {
    updatePainter(p,p.selected,Number(value));
  }
  if (sub === "erase") updatePainter(p,p.selected,0);
  if (sub === "undo" && p.undo.length) {
    const old = p.undo.pop(); p.selected = old.vertex;
    if (old.color) p.colors[old.vertex] = old.color; else delete p.colors[old.vertex];
    p.checked = false; p.feedback = null;
  }
  if (sub === "reset") {
    state.houseImprovement = {...initialPainter("F"),colors:{...greedy(graph,HOUSE_ORDER).at(-1).colors},initialCount:p.initialCount};
    checkPainter(state.houseImprovement,graph);
    render("improve-heading"); announce($("feedback").textContent); return true;
  }
  if (["color","erase","undo"].includes(sub)) checkPainter(p,graph);
  render(sub === "vertex" ? "vertex-" + p.selected : target.id);
  if (["color","erase","undo"].includes(sub)) announce($("feedback").textContent);
  return true;
}
function handleAction(action, value, target) {
  if (action === "nav") { state.screen = Number(value); $("announcement").textContent=""; render("screen-title"); return; }
  if (handlePlanning(action,value,target)) return;
  if (handleHouseImprovement(action,value,target)) return;
  if (action === "guide-exercise") {
    if (![0,1].includes(Number(value))) return;
    state.guideExercise = Number(value); $("announcement").textContent=""; render("screen-title"); return;
  }
  if (action === "guide-improve") {
    if (state.guideExercise !== 1 || state.guideHouse.completed !== HOUSE_ORDER.length) return;
    if (!state.houseImprovement) {
      const colors = greedy(GRAPHS.house,HOUSE_ORDER).at(-1).colors;
      state.houseImprovement = {...initialPainter("F"),colors:{...colors},initialCount:usedColors(colors).length};
      checkPainter(state.houseImprovement,GRAPHS.house);
    }
    render("improve-heading"); announce(t().houseTask); return;
  }
  if(action==="concept") {
    const mode=Number(value);
    if([0,1,2].includes(mode))state.info.concept=mode;
    render(target.id);return;
  }
  if(action==="factorial") {
    const size=Number(value);
    if(FACTORIAL_SIZES.includes(size))state.info.factorialSize=size;
    render(target.id);return;
  }
  if(action==="bonus") {
    state.info.bonusBetter=value==="1";render(target.id);return;
  }
  if (action === "restart") {
    if (state.screen === 1) state.free = initialPainter("A");
    if (state.screen === 2) {
      if (state.guideExercise) { state.guideHouse = initialRun(HOUSE_ORDER); state.houseImprovement = null; }
      else state.guide = initialRun(GUIDE_ORDER);
    }
    if (state.screen === 3) state.autonomous = {...initialRun(CHALLENGE_ORDER),constructing:false,draftOrder:[],attempts:[]};
    if (state.screen === 4) state.exams = initialPlanning();
    if (state.screen === 5) state.quiz = [null,null,null,null];
    render("screen-title"); return;
  }
  if (action.startsWith("demo-")) {
    if (action === "demo-example") {
      const example = Number(value);
      if (!Number.isInteger(example) || !DEMONSTRATIONS[example]) return;
      state.demo.example = example;
    }
    if (action === "demo-order") {
      const orderIndex = Number(value);
      if (!Number.isInteger(orderIndex) || !DEMONSTRATIONS[state.demo.example].orders[orderIndex]) return;
      state.demo.orders[state.demo.example] = orderIndex; state.demo.steps[state.demo.example] = 0;
    }
    const index = state.demo.example, total = GRAPHS[DEMONSTRATIONS[index].graph].nodes.length;
    if (action === "demo-prev") state.demo.steps[index] = Math.max(0,state.demo.steps[index]-1);
    if (action === "demo-next") state.demo.steps[index] = Math.min(total,state.demo.steps[index]+1);
    render(action === "demo-next" && state.demo.steps[index] === total ? "demo-prev" :
      action === "demo-prev" && !state.demo.steps[index] ? "demo-next" : target.id);
    return;
  }
  if (action.startsWith("free-") || action.startsWith("exam-")) {
    const exams = action.startsWith("exam-"), p = exams ? state.exams : state.free;
    if(exams && (p.phase!=="color" || !planningComplete()))return;
    const graph = exams ? GRAPHS.exams : GRAPHS.cycle, sub = action.split("-")[1];
    if (sub === "vertex" && graph.nodes.includes(value)) p.selected = value;
    if (sub === "color") updatePainter(p,p.selected,Number(value));
    if (sub === "erase") updatePainter(p,p.selected,0);
    if (sub === "undo" && p.undo.length) {
      const old = p.undo.pop(); p.selected = old.vertex;
      if (old.color) p.colors[old.vertex] = old.color; else delete p.colors[old.vertex];
      p.checked = false; p.feedback = null;
    }
    if (["color","erase","undo"].includes(sub)) checkPainter(p,graph);
    render(sub === "vertex" ? "vertex-"+p.selected : target.id);
    if (sub === "color" || sub === "erase" || sub === "undo") announce($("feedback").textContent);
    return;
  }
  if (action === "order-build") {
    state.autonomous.constructing = true; state.autonomous.draftOrder = []; state.autonomous.feedback = null;
    render("screen-title"); return;
  }
  if (action === "order-add") {
    const run = state.autonomous;
    if (!run.draftOrder.includes(value) && GRAPHS.cube.nodes.includes(value)) run.draftOrder.push(value);
    run.feedback = null;
    const next = GRAPHS.cube.nodes.find(v=>!run.draftOrder.includes(v));
    render(next ? "order-add-"+next : "order-apply"); return;
  }
  if (action === "order-remove") {
    const removed = state.autonomous.draftOrder.pop(); state.autonomous.feedback = null;
    render(removed ? "order-add-"+removed : "order-apply"); return;
  }
  if (action === "order-apply") {
    const a = state.autonomous;
    const nodes = GRAPHS.cube.nodes;
    if (a.draftOrder.length !== nodes.length || new Set(a.draftOrder).size !== nodes.length || !a.draftOrder.every(v=>nodes.includes(v))) {
      a.feedback = {type:"order"}; render("feedback"); announce(t().orderMissing); return;
    }
    Object.assign(a,initialRun(a.draftOrder),{constructing:false});
    render("turn-heading"); return;
  }
  if (action.startsWith("guide-") || action.startsWith("order-")) {
    const independent = action.startsWith("order-"), run = independent ? state.autonomous : selectedGuideRun();
    const graph = independent ? GRAPHS.cube : selectedGuideGraph(), sub = action.split("-")[1];
    if (!independent && state.guideExercise && state.houseImprovement) return;
    if (sub === "color" && run.phase === "color") {
      const color = Number(value);
      if (!Number.isInteger(color) || color < 1 || color > (graph.paletteSize || graph.nodes.length)) return;
      run.choice = color; run.feedback = null; validateRun(run,graph,independent);
    }
    if (sub === "next" && run.phase === "review" && run.completed < run.order.length) {
      run.phase = "color"; run.choice = null; run.feedback = null; render("turn-heading");
    }
    if (sub === "undo" && run.completed) {
      run.completed--; run.phase = "color"; run.choice = null; run.feedback = null; render("turn-heading");
    }
    return;
  }
  if (action === "quiz") {
    const [index,answer] = value.split(":"); state.quiz[Number(index)] = answer === "true";
    render(target.id); announce($("quiz-feedback-"+index).textContent);
  }
}
document.addEventListener("click",event=>{
  const target = event.target.closest("[data-act]");
  if (!target || target.disabled) return;
  if (event.detail > 1 && /-(next|check|apply|add|continue)$/.test(target.dataset.act)) return;
  handleAction(target.dataset.act,target.dataset.value,target);
});
document.addEventListener("keydown",event=>{
  if (event.repeat && event.key === "Enter") { event.preventDefault(); return; }
  const target = event.target.closest("svg [role='button']");
  if (!target || (event.key !== "Enter" && event.key !== " ")) return;
  event.preventDefault();
  if (!event.repeat) handleAction(target.dataset.act,target.dataset.value,target);
});
document.addEventListener("toggle",event=>{
  const id = event.target.dataset && event.target.dataset.disclosure;
  if (!id) return;
  if (event.target.open) state.disclosures.add(id); else state.disclosures.delete(id);
},true);
$("language").addEventListener("click",()=>{lang = lang === "fr" ? "en" : "fr";saveLanguage();applyLang("language");});
$("fullscreen").addEventListener("click",toggleFullscreen);
document.addEventListener("fullscreenchange",updateFullscreen);
document.addEventListener("webkitfullscreenchange",updateFullscreen);
applyLang();

</script>
</body>

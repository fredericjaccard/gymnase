<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Révisez les cellules, les formats, les formules et le recalcul en complétant un budget dans un mini-tableur.">
<title>Le budget du stand · Gymnase — Frédéric Jaccard</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2320241F'/%3E%3Ctext x='32' y='43' font-family='Arial,sans-serif' font-size='28' font-weight='bold' fill='%23FFFFFF' text-anchor='middle'%3EFJ%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Quattrocento+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#FBFAF6; --card:#F7F6F2; --primary:#155E4C; --primaryLight:#E3F0EA;
  --accent:#D96A08; --accentLight:#FDEBD8; --line:#D8D5CB; --ink:#20241F;
  --muted:#6E726B; --error:#C84B31;
}
* { box-sizing:border-box }
[hidden] { display:none !important }
body { background:var(--bg); color:var(--ink); margin:0; font:17px/1.45 'Quattrocento Sans',sans-serif }
main { max-width:1180px; margin:auto; padding:32px 24px }
body.expanded main { max-width:1500px }
header, .hdrBtns, .actions { display:flex; gap:8px; align-items:center; flex-wrap:wrap }
header { justify-content:space-between; margin-bottom:18px }
.hdrBtns { margin-left:auto }
.kicker { color:var(--accent); font-size:12px; font-weight:700; letter-spacing:.18em; text-transform:uppercase }
h1 { font-size:clamp(29px,5vw,44px); margin:4px 0; line-height:1.08; color:var(--primary) }
h2 { color:var(--primary); line-height:1.2; margin:0 0 12px; font-size:26px }
p { margin:0 0 12px }
button, input, select { font:inherit; min-height:44px }
button, select { padding:8px 12px; color:var(--primary); border:1px solid var(--primary); border-radius:8px; background:var(--card) }
button { font-weight:700; cursor:pointer }
button:hover { background:var(--primaryLight) }
button:disabled { opacity:.48; cursor:default }
:focus-visible { outline:3px solid var(--accent); outline-offset:2px }
.instruction, .feedback { color:var(--primary); border-radius:10px; background:var(--primaryLight); padding:12px 15px }
.progress { display:flex; padding:0; margin:19px 0 15px; list-style:none; gap:8px }
.progress li { flex:1; border-top:3px solid var(--line); padding:7px 3px 0; font-size:15px; color:var(--muted) }
.progress .current { color:var(--primary); border-color:var(--accent); font-weight:700 }
.progress .complete { color:var(--primary); border-color:var(--primary) }
.workspace { display:grid; grid-template-columns:minmax(0,1fr) minmax(255px,310px); gap:18px; align-items:start }
.sheet, .task { min-width:0; background:var(--card); border:1px solid var(--line); border-radius:12px }
.sheet { padding:12px }
.task { padding:18px }
.tool { display:flex; align-items:center; gap:6px; margin:0 0 8px }
.tool input { border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--ink); padding:6px 8px; width:0; flex:1 }
.tool input[readonly] { background:var(--card) }
#address { flex:0 0 87px; font-family:monospace; font-size:14px }
.fx { font-weight:700; font-style:italic; color:var(--primary) }
#commit { flex-shrink:0 }
#formatTools, #fillTools { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:8px }
#formatChoice { max-width:100% }
table { width:100%; table-layout:fixed; border-collapse:collapse; font-variant-numeric:tabular-nums }
col.rowNumber { width:34px }
col.numeric { width:17% }
th, td { padding:0; border:1px solid var(--line) }
th { text-align:center; color:var(--primary); background:var(--primaryLight); font-size:14px }
thead th { height:27px }
td button { display:block; width:100%; height:100%; min-height:44px; text-align:left; padding:5px 7px; border:0; border-radius:0; background:var(--bg); color:var(--ink); font-weight:400; overflow-wrap:anywhere; line-height:1.17; position:relative }
td button:focus-visible { outline-offset:-3px }
td.number button { text-align:right }
td.heading button, td.resultLabel button { font-weight:700; color:var(--primary) }
td.editable button { background:var(--primaryLight) }
td.selected button { background:var(--accentLight) }
td.active button { box-shadow:inset 0 0 0 2px var(--primary) }
td.invalid button { color:var(--error) }
#handle { position:absolute; bottom:1px; right:1px; width:12px; height:12px; background:var(--primary); cursor:crosshair; touch-action:none }
.feedback { border:1px solid var(--primary); margin-top:12px }
.feedback.error { background:var(--accentLight); border-color:var(--error); color:var(--ink) }
.actions { margin-top:12px }
.primary { background:var(--primary); color:var(--bg) }
.primary:hover { background:var(--primaryLight); color:var(--primary) }
.next { background:var(--accent); color:var(--ink); border-color:var(--accent) }
.next:hover { background:var(--accentLight) }
.prediction { display:flex; flex-wrap:wrap; gap:8px; margin:0; padding:0; border:0 }
.prediction label { display:flex; align-items:center; gap:5px; min-height:44px; padding:5px 8px; border:1px solid var(--line); border-radius:6px }
.prediction input { min-height:0; accent-color:var(--primary); width:17px; height:17px }
#hintText { color:var(--primary); margin:12px 0 0 }
footer { margin-top:20px; text-align:center; color:var(--muted); font-size:13px }
footer a { color:var(--muted); font-weight:400; text-decoration:none }
footer a:hover { text-decoration:underline }
@media(max-width:760px) {
  main { padding:16px 12px }
  .workspace { grid-template-columns:minmax(0,1fr) }
  .task { grid-row:1; padding:12px }
}
@media(max-width:640px) {
  .sheet { padding:6px }
  col.rowNumber { width:24px }
  col.numeric { width:18% }
  td button { font-size:13px; padding:4px }
  th { font-size:12px }
  #address { flex-basis:66px; padding:5px }
  .progress li { font-size:13px }
}
@media(prefers-reduced-motion:reduce) { * { scroll-behavior:auto!important } }
</style>
</head>
<body><main>
<header>
  <div><div class="kicker" id="kicker"></div><h1 id="title"></h1></div>
  <div class="hdrBtns"><button id="langBtn" type="button">English</button><button id="fsBtn" type="button"><span id="fsLabel"></span></button></div>
</header>
<div id="instruction" class="instruction"></div>
<ol class="progress" id="progress"></ol>
<div class="workspace">
  <section class="sheet" id="sheet">
    <div class="tool">
      <input id="address" autocomplete="off" spellcheck="false" maxlength="7">
      <span class="fx" aria-hidden="true">ƒx</span>
      <input id="formula" autocomplete="off" spellcheck="false" maxlength="60">
      <button id="commit" type="button" hidden>✓</button>
    </div>
    <div id="formatTools" hidden>
      <select id="formatChoice"></select>
      <button id="formatApply" type="button"></button>
    </div>
    <div id="fillTools" hidden><button id="fill" type="button"></button></div>
    <table id="grid">
      <colgroup><col class="rowNumber"><col><col class="numeric"><col class="numeric"><col class="numeric"></colgroup>
      <thead><tr><th></th><th scope="col">A</th><th scope="col">B</th><th scope="col">C</th><th scope="col">D</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </section>
  <section class="task" aria-labelledby="taskTitle">
    <h2 id="taskTitle" tabindex="-1"></h2>
    <p id="prompt"></p>
    <fieldset class="prediction" id="prediction" hidden>
      <label><input type="checkbox" value="D8">D8</label>
      <label><input type="checkbox" value="D12">D12</label>
      <label><input type="checkbox" value="D13">D13</label>
    </fieldset>
    <div class="actions">
      <button id="check" class="primary" type="button"></button>
      <button id="hint" type="button"></button>
      <button id="next" class="next" type="button" hidden></button>
    </div>
    <p id="hintText" hidden></p>
    <div id="feedback" class="feedback" role="status" hidden></div>
  </section>
</div>
<footer><a href="bureautique.html" id="backLink"></a> · <a href="https://fredericjaccard.com">Frédéric Jaccard</a></footer>
</main>
<script>
'use strict';
const $ = id => document.getElementById(id);
const I18N = {

    address:'Adresse de cellule ou de plage', formula:'Barre de formule', commit:'Valider la saisie',
    format:'Format de nombre', general:'Standard', zero:'Nombre · 0 décimale', two:'Nombre · 2 décimales',

  en: {

      'Click C6, then hold Shift and click C10. You can also type C6:C10 in the address box and press Enter.',

    ],

    headers:['Item','Quantity','Unit price','Subtotal'],
    total:'Budget total', max:'Largest expense', sheet:'Stand budget grid',
    address:'Cell or range address', formula:'Formula bar', commit:'Confirm entry',
    format:'Number format', general:'General', zero:'Number · 0 decimal places', two:'Number · 2 decimal places',
    apply:'Apply', fill:'Fill D6 down to D10', handle:'Fill handle', check:'Check',
    hint:'Hint', next:'Next challenge', restart:'Start again',
    pickWrong:'Look for the unit price in column C.',
    pickRight:'C7 is where column C and row 7 meet.',
    formatWrong:'Select exactly C6:C10, then apply the Number format with two decimal places.',
    formatRight:'All five prices now show two decimal places. The format changes how a value is displayed.',
    formulaWrong:row=>'In D'+row+', multiply the quantity by the unit price from row '+row+'.',
    copyWrong:'Fill the formula in D6 down to D10 using the handle or the fill button.',
    sumWrong:'In D12, use SUM on the full range of subtotals, from D6 to D10.',
    maxWrong:'In D13, use MAX on the same range as the total.',
    formulasRight:'Each subtotal uses its own row. The total is 41.20 and the maximum is 13.00.',
    predictWrong:'Recalculate the subtotal for napkins, then compare it with the largest subtotal.',
    predictRight:'Correct prediction. Change B8 to check it.',
    quantityWrong:'Enter the number 6 in B8, then confirm the entry.',
    success:'D8 rises from 3.60 to 7.20 and D12 rises from 41.20 to 44.80. D13 stays at 13.00, the subtotal for the syrup bottles.',
    addressWrong:'Enter an address in the grid, such as C7 or C6:C10.',
    formatRange:'Select a range in column C between rows 6 and 10.',
    fillFirst:'Enter a subtotal formula in D6 first.',
    formulaError:'#FORMULA!', valueError:'#VALUE!'
  }
};
const cols = ['A','B','C','D'];
const rowNumbers = [5,6,7,8,9,10,11,12,13];
const itemRows = rowNumbers.slice(1,6);
const prices = [2.5,6.5,1.2,3.8,1.4];
const quantities = [4,2,3,2,5];
const T = () => I18N[lang];
let lang = 'fr';
try {
  const cookie = document.cookie.match(/(?:^|;\s*)fj-lang=(fr|en)(?:;|$)/);
  const saved = cookie?.[1] ?? localStorage.getItem('fj-lang');
  if (saved === 'fr' || saved === 'en') lang = saved;
} catch {}
let phase, waiting, active, anchor, entries, formats, fillUsed, feedback, hintVisible, formatChoice;
const predictions = [...$('prediction').querySelectorAll('input')];

function reset() {
  phase = 0;
  waiting = false;
  active = anchor = 'A5';
  entries = Object.fromEntries(itemRows.flatMap((row,i) => [
    ['B'+row, quantities[i]], ['C'+row, prices[i]], ['D'+row, '=B'+row+'*C'+row]
  ]));
  entries.D12 = '=SUM(D6:D10)';
  formats = {};
  fillUsed = false;
  feedback = null;
  hintVisible = false;
  formatChoice = 'general';
  for (const box of predictions) box.checked = false;
  render();
}

function parseFormula(input) {
  const text = String(input ?? '').toUpperCase().replace(/\s+/g,'');
  const product = text.match(/^=([A-D][5-9]|[A-D]1[0-3])\*([A-D][5-9]|[A-D]1[0-3])$/);
  if (product) return {kind:'product', refs:product.slice(1)};
  const aggregate = text.match(/^=(SUM|SOMME|MAX)\(([A-D](?:[5-9]|1[0-3])):([A-D](?:[5-9]|1[0-3]))\)$/);
  if (aggregate) return {kind:aggregate[1] === 'MAX' ? 'max' : 'sum', refs:aggregate.slice(2)};
  return null;
}
function cellRange(first, last) {
  const [left,right] = [cols.indexOf(first[0]),cols.indexOf(last[0])].sort((a,b) => a-b);
  const [top,bottom] = [Number(first.slice(1)),Number(last.slice(1))].sort((a,b) => a-b);
  return rowNumbers.filter(row => row >= top && row <= bottom)
    .flatMap(row => cols.slice(left,right+1).map(col => col+row));
}
function calculate(id, trail = []) {
  const raw = entries[id];
  if (raw === undefined || raw === '') return null;
  if (typeof raw === 'number') return raw;
  if (trail.includes(id)) return NaN;
  const expr = parseFormula(raw);
  if (!expr) return NaN;
  const refs = expr.kind === 'product' ? expr.refs : cellRange(...expr.refs);
  const values = refs.map(ref => calculate(ref,[...trail,id]));
  if (values.some(Number.isNaN)) return NaN;
  if (expr.kind === 'product') return values[0] * values[1];
  if (expr.kind === 'sum') return values.reduce((sum,value) => sum + value,0);
  return Math.max(0,...values.filter(value => value !== null));
}
function number(value, digits) {
  if (digits === undefined) return String(value).replace('.', lang === 'fr' ? ',' : '.');
  return value.toLocaleString(lang === 'fr' ? 'fr-FR' : 'en-GB', {
    minimumFractionDigits:digits, maximumFractionDigits:digits
  });
}
function staticLabel(id) {
  const row = Number(id.slice(1));
  if (row === 5) return T().headers[cols.indexOf(id[0])];
  if (id[0] !== 'A') return '';
  if (itemRows.includes(row)) return T().items[row-6];
  if (row === 12) return T().total;
  if (row === 13 && phase >= 2) return T().max;
  return '';
}
function display(id) {
  if (!(id in entries)) return staticLabel(id);
  const value = calculate(id);
  if (value === null) return '';
  if (Number.isNaN(value)) return T()[parseFormula(entries[id]) ? 'valueError' : 'formulaError'];
  return number(value,formats[id] ?? (id[0] === 'D' ? 2 : undefined));
}
function rawDisplay(id) {
  const raw = entries[id];
  if (typeof raw === 'number') return number(raw);
  if (typeof raw === 'string') return raw.replace(/^=(SUM|SOMME)(?=\s*\()/i,lang === 'fr' ? '=SOMME' : '=SUM');
  return staticLabel(id);
}
function canEdit(id) {
  if (waiting) return false;
  if (phase === 2) return id === 'D6' || id === 'D12' || id === 'D13' ||
    itemRows.slice(1).some(row => id === 'D'+row);
  return phase === 4 && id === 'B8';
}
function setFeedback(key, error = false, detail) {
  feedback = {key,error,detail};
  renderFeedback();
}
function renderFeedback() {
  const box = $('feedback');
  box.hidden = !feedback;
  if (!feedback) return;
  const message = T()[feedback.key];
  box.textContent = typeof message === 'function' ? message(feedback.detail) : message;
  box.classList.toggle('error',feedback.error);
}
function selectCell(id, extend = false, focus = false) {
  commit(false);
  if (!extend) anchor = id;
  active = id;
  renderSelection();
  if (focus) $('rows').querySelector('[data-cell="'+id+'"]')?.focus();
}
function renderSelection() {
  const selected = new Set(cellRange(anchor,active));
  $('address').value = anchor === active ? active : anchor+':'+active;
  $('formula').value = rawDisplay(active);
  $('formula').readOnly = !canEdit(active);
  $('commit').hidden = !canEdit(active);
  for (const button of $('rows').querySelectorAll('[data-cell]')) {
    const id = button.dataset.cell;
    button.parentElement.classList.toggle('selected',selected.has(id));
    button.parentElement.classList.toggle('active',id === active);
    button.tabIndex = id === active ? 0 : -1;
    button.setAttribute('aria-pressed',String(selected.has(id)));
    button.querySelector('#handle')?.remove();
    if (phase === 2 && !waiting && id === 'D6' && active === 'D6') {
      const handle = document.createElement('span');
      handle.id = 'handle';
      handle.title = T().handle;
      handle.setAttribute('aria-hidden','true');
      button.append(handle);
    }
  }
}
function renderGrid() {
  const rows = $('rows');
  rows.replaceChildren();
  for (const row of rowNumbers) {
    if (row === 13 && phase < 2) continue;
    const tr = rows.insertRow();
    const heading = document.createElement('th');
    heading.scope = 'row';
    heading.textContent = row;
    tr.append(heading);
    for (const col of cols) {
      const id = col+row;
      const td = tr.insertCell();
      td.classList.toggle('number',col !== 'A' && row !== 5);
      td.classList.toggle('heading',row === 5);
      td.classList.toggle('resultLabel',col === 'A' && row >= 12);
      td.classList.toggle('editable',canEdit(id));
      const button = document.createElement('button');
      button.type = 'button';
      button.dataset.cell = id;
      button.append(document.createElement('span'));
      td.append(button);
    }
  }
  refreshValues();
  renderSelection();
}
function refreshValues() {
  for (const button of $('rows').querySelectorAll('[data-cell]')) {
    const id = button.dataset.cell;
    const value = display(id);
    button.firstElementChild.textContent = value;
    button.setAttribute('aria-label',value ? id+' '+value : id);
    button.parentElement.classList.toggle('invalid',value.startsWith('#'));
  }
}
function render() {
  const step = Math.min(2,phase < 2 ? 0 : phase === 2 ? 1 : 2);
  $('progress').replaceChildren(...T().titles.map((title,i) => {
    const item = document.createElement('li');
    item.textContent = (i+1)+'. '+title;
    item.className = i < step || phase === 5 || (waiting && i === step)
      ? 'complete' : i === step ? 'current' : '';
    if (i === step && phase !== 5) item.setAttribute('aria-current','step');
    return item;
  }));
  $('taskTitle').textContent = T().titles[step];
  $('prompt').textContent = T().prompts[phase];
  $('prediction').hidden = phase !== 3;
  $('formatTools').hidden = phase !== 1 || waiting;
  $('fillTools').hidden = phase !== 2 || waiting;
  $('check').hidden = waiting || phase === 5;
  $('hint').hidden = waiting || phase === 5;
  $('next').hidden = !waiting && phase !== 5;
  $('next').textContent = phase === 5 ? T().restart : T().next;
  $('hintText').hidden = !hintVisible || waiting || phase === 5;
  $('hintText').textContent = T().hints[phase] || '';
  $('hint').setAttribute('aria-expanded',String(!$('hintText').hidden));
  renderGrid();
  renderFeedback();
}
function commit(updateBar = true) {
  if (!canEdit(active)) return;
  const text = $('formula').value.trim();
  if (text === rawDisplay(active)) return;
  const numeric = /^\d+(?:[.,]\d+)?$/.test(text) ? Number(text.replace(',','.')) : NaN;
  entries[active] = Number.isFinite(numeric) ? numeric : text;
  if (updateBar) $('formula').value = rawDisplay(active);
  refreshValues();
}
function movePhase(target, id) {
  phase = target;
  waiting = false;
  active = anchor = id;
  hintVisible = false;
  feedback = null;
  render();
}
function fillDown(lastRow) {
  commit();
  const expr = parseFormula(entries.D6);
  if (!expr || expr.kind !== 'product') {
    setFeedback('fillFirst',true);
    return;
  }
  for (const row of itemRows.slice(1)) {
    if (row > lastRow) break;
    const [left,right] = expr.refs.map(ref => ref[0]+(Number(ref.slice(1))+row-6));
    entries['D'+row] = '='+left+'*'+right;
  }
  if (lastRow === 10) fillUsed = true;
  active = 'D'+lastRow;
  anchor = 'D6';
  refreshValues();
  renderSelection();
}
function validProduct(row) {
  const expr = parseFormula(entries['D'+row]);
  return expr?.kind === 'product' && [...expr.refs].sort().join(',') === 'B'+row+',C'+row;
}
function validAggregate(id, kind) {
  const expr = parseFormula(entries[id]);
  return expr?.kind === kind && cellRange(...expr.refs).join(',') === itemRows.map(row => 'D'+row).join(',');
}
function check() {
  commit();
  if (phase === 0) {
    if (active !== 'C7' || anchor !== 'C7') return setFeedback('pickWrong',true);
    movePhase(1,'C7');
    return setFeedback('pickRight');
  }
  if (phase === 1) {
    if (!itemRows.every(row => formats['C'+row] === 2)) return setFeedback('formatWrong',true);
    waiting = true;
    render();
    return setFeedback('formatRight');
  }
  if (phase === 2) {
    if (!validProduct(6)) return setFeedback('formulaWrong',true,6);
    if (!fillUsed) return setFeedback('copyWrong',true);
    const wrong = itemRows.find(row => !validProduct(row));
    if (wrong) return setFeedback('formulaWrong',true,wrong);
    if (!validAggregate('D12','sum')) return setFeedback('sumWrong',true);
    if (!validAggregate('D13','max')) return setFeedback('maxWrong',true);
    waiting = true;
    render();
    return setFeedback('formulasRight');
  }
  if (phase === 3) {
    if (predictions.filter(box => box.checked).map(box => box.value).join(',') !== 'D8,D12') {
      return setFeedback('predictWrong',true);
    }
    movePhase(4,'B8');
    return setFeedback('predictRight');
  }
  if (entries.B8 !== 6) return setFeedback('quantityWrong',true);
  movePhase(5,'B8');
  setFeedback('success');
}
$('rows').addEventListener('click',event => {
  const cell = event.target.closest('[data-cell]');
  if (cell) selectCell(cell.dataset.cell,event.shiftKey,true);
});
$('rows').addEventListener('dblclick',event => {
  const cell = event.target.closest('[data-cell]');
  if (!cell || !canEdit(cell.dataset.cell)) return;
  $('formula').focus();
  $('formula').select();
});
$('rows').addEventListener('keydown',event => {
  const moves = {ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]};
  const move = moves[event.key];
  if (move) {
    event.preventDefault();
    const col = cols[cols.indexOf(active[0])+move[0]];
    const row = Number(active.slice(1))+move[1];
    if (col && row >= 5 && row <= (phase < 2 ? 12 : 13)) {
      selectCell(col+row,event.shiftKey,true);
    }
  }
  if (event.key === 'F2' && canEdit(active)) {
    event.preventDefault();
    $('formula').focus();
    $('formula').select();
  }
});
$('rows').addEventListener('pointerdown',event => {
  if (event.target.id !== 'handle' || event.button !== 0) return;
  event.preventDefault();
  const handle = event.target;
  const pointer = event.pointerId;
  handle.setPointerCapture(pointer);
  handle.addEventListener('pointerup',release => {
    const cell = document.elementFromPoint(release.clientX,release.clientY)?.closest('[data-cell]');
    const row = Number(cell?.dataset.cell.slice(1));
    if (cell?.dataset.cell.startsWith('D') && row >= 7 && row <= 10) fillDown(row);
  },{once:true});
});
$('address').addEventListener('keydown',event => {
  if (event.key !== 'Enter') return;
  const [first,last = first,...extra] = $('address').value.toUpperCase().replace(/\s/g,'').split(':');
  const valid = id => /^[A-D](?:[5-9]|1[0-3])$/.test(id) && (phase >= 2 || !id.endsWith('13'));
  if (extra.length || !valid(first) || !valid(last)) return setFeedback('addressWrong',true);
  commit();
  anchor = first;
  active = last;
  renderSelection();
});
$('formula').addEventListener('keydown',event => {
  if (event.key === 'Enter') commit();
  if (event.key === 'Escape') $('formula').value = rawDisplay(active);
});
$('commit').onclick = () => commit();
$('formatChoice').onchange = () => { formatChoice = $('formatChoice').value; };
$('formatApply').onclick = () => {
  const selected = cellRange(anchor,active);
  if (selected.some(id => !/^C(?:[6-9]|10)$/.test(id))) return setFeedback('formatRange',true);
  for (const id of selected) {
    if (formatChoice === 'general') delete formats[id];
    else formats[id] = Number(formatChoice);
  }
  refreshValues();
  feedback = null;
  renderFeedback();
};
$('fill').onclick = () => fillDown(10);
$('check').onclick = check;
$('hint').onclick = () => {
  hintVisible = !hintVisible;
  $('hintText').hidden = !hintVisible;
  $('hint').setAttribute('aria-expanded',String(hintVisible));
};
$('next').onclick = () => {
  if (phase === 1) {
    entries.D6 = '=B6*C7';
    for (const row of itemRows.slice(1)) delete entries['D'+row];
    delete entries.D12;
    movePhase(2,'D6');
  } else if (phase === 2) {
    movePhase(3,'D8');
  } else {
    reset();
  }
  $('taskTitle').focus({preventScroll:true});
};
function isFullscreen() {
  return Boolean(document.fullscreenElement || document.webkitFullscreenElement ||
    document.body.classList.contains('expanded'));
}
function syncFsLabel() {
  $('fsLabel').textContent = '⛶ '+T()[isFullscreen() ? 'fsExit' : 'fs'];
}
$('fsBtn').onclick = async () => {
  if (document.body.classList.contains('expanded')) {
    document.body.classList.remove('expanded');
  } else if (isFullscreen()) {
    const exit = document.exitFullscreen || document.webkitExitFullscreen;
    if (exit) await Promise.resolve(exit.call(document)).catch(() => setFeedback('fsUnavailable',true));
  } else {
    const root = document.documentElement;
    const request = root.requestFullscreen || root.webkitRequestFullscreen;
    try {
      if (!request) throw new Error();
      await request.call(root);
    } catch {
      if (innerWidth > 1180) document.body.classList.add('expanded');
      else setFeedback('fsUnavailable',true);
    }
  }
  syncFsLabel();
};
document.addEventListener('fullscreenchange',syncFsLabel);
document.addEventListener('webkitfullscreenchange',syncFsLabel);
function applyLang() {
  document.documentElement.lang = lang;
  document.title = T().title+' · Gymnase — Frédéric Jaccard';
  document.querySelector('meta[name="description"]').content = T().desc;
  for (const id of ['kicker','title','instruction','check','hint','fill']) {
    $(id).textContent = T()[id];
  }
  $('backLink').textContent = T().backList;
  $('langBtn').textContent = lang === 'fr' ? 'English' : 'Français';
  for (const id of ['sheet','address','formula','commit']) $(id).setAttribute('aria-label',T()[id]);
  $('prediction').setAttribute('aria-label',T().prompts[3]);
  $('formatApply').textContent = T().apply;
  $('formatChoice').setAttribute('aria-label',T().format);
  $('formatChoice').replaceChildren(...[
    new Option(T().general,'general'), new Option(T().zero,'0'), new Option(T().two,'2')
  ]);
  $('formatChoice').value = formatChoice;
  syncFsLabel();
  render();
}
$('langBtn').onclick = () => {
  commit();
  lang = lang === 'fr' ? 'en' : 'fr';
  try { localStorage.setItem('fj-lang',lang); } catch {}
  try { document.cookie = 'fj-lang='+lang+';domain=.fredericjaccard.com;path=/;max-age=31536000;SameSite=Lax'; } catch {}
  applyLang();
};
reset();
applyLang();
</script>

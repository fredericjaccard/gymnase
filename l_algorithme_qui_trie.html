<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Un algorithme fictif trie des CV de façon discriminatoire : inspectez les données, retirez des variables, rééquilibrez l'échantillon et mesurez l'équité.">
<title>L'algorithme qui trie · Gymnase — Frédéric Jaccard</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2320241F'/%3E%3Ctext x='32' y='43' font-family='Arial,sans-serif' font-size='28' font-weight='bold' fill='%23FFFFFF' text-anchor='middle'%3EFJ%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Quattrocento+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBFAF6; --card:#F7F6F2; --primary:#155E4C; --primaryLight:#E3F0EA;
  --accent:#D96A08; --accentLight:#FDEBD8; --line:#D8D5CB; --ink:#20241F; --muted:#6E726B;
  --error:#C84B31;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:"Quattrocento Sans",sans-serif;padding:20px;max-width:1200px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px;margin-bottom:16px}
.kicker{font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
h1{font-size:26px;color:var(--primary)}
.hdrBtns{display:flex;gap:8px}
button{font-family:inherit;font-size:14px;font-weight:700;padding:8px 16px;border-radius:10px;
  border:2px solid var(--primary);background:var(--card);color:var(--primary);cursor:pointer}
button:hover{background:var(--primaryLight)}
.instruction{background:var(--primaryLight);color:var(--primary);border-radius:12px;padding:12px 16px;margin-bottom:16px;font-size:15px}
footer{margin-top:20px;text-align:center;color:var(--muted);font-size:13px}
footer a{color:var(--muted);font-weight:400;text-decoration:none}
footer a:hover{text-decoration:underline}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.grid{display:grid;grid-template-columns:1.05fr .95fr;gap:16px;align-items:start}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0}
.panel h2{font-size:17px;color:var(--primary);margin-bottom:8px}
.note{font-size:13.5px;color:var(--muted);margin-bottom:10px}
.twrap{overflow-x:auto;max-height:360px;overflow-y:auto;border:1px solid var(--line);border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:14px;background:var(--bg)}
th{position:sticky;top:0;background:var(--primaryLight);color:var(--primary);text-align:left;padding:7px 8px;font-size:13px;white-space:nowrap}
td{padding:6px 8px;border-top:1px solid var(--line);white-space:nowrap}
tr.added td{background:var(--accentLight)}
.chip{display:inline-block;padding:1px 9px;border-radius:999px;font-weight:700;font-size:12.5px}
.chipA{background:var(--primaryLight);color:var(--primary)}
.chipB{background:var(--accentLight);color:var(--accent)}
.yes{color:var(--primary);font-weight:700}
.no{color:var(--error);font-weight:700}
.badge{font-size:11px;font-weight:700;color:var(--accent);border:1px solid var(--accent);border-radius:6px;padding:0 5px;margin-left:6px}
.count{font-size:13.5px;color:var(--muted);margin-top:8px}
.srow{display:grid;grid-template-columns:minmax(170px,auto) 1fr 34px;align-items:center;gap:10px;margin-bottom:12px}
.srow label{font-size:14.5px}
.srow .val{font-weight:700;color:var(--accent);text-align:right}
input[type=range]{accent-color:var(--accent);width:100%;height:28px}
input[type=checkbox]{accent-color:var(--primary);width:20px;height:20px;flex:none}
.vrow{display:grid;grid-template-columns:auto minmax(150px,1fr) 130px 52px;align-items:center;gap:10px;min-height:44px;padding:3px 0;border-top:1px solid var(--line)}
.vrow:first-of-type{border-top:none}
.vrow label{font-size:14.5px;cursor:pointer}
.wbar{position:relative;height:12px;background:var(--bg);border:1px solid var(--line);border-radius:6px}
.wbar::before{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:2px;background:var(--muted)}
.wfill{position:absolute;top:1px;bottom:1px;border-radius:5px}
.wval{font-size:13.5px;font-weight:700;text-align:right}
details{margin-top:10px;font-size:13.5px;color:var(--muted)}
summary{cursor:pointer;font-weight:700;color:var(--primary);padding:6px 0}
.mrow{display:grid;grid-template-columns:96px 1fr 46px;align-items:center;gap:10px;margin-bottom:8px}
.mbar{height:16px;background:var(--bg);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.mfill{height:100%;border-radius:8px}
.mA{background:var(--primary)}
.mB{background:var(--accent)}
.mval{font-weight:700;text-align:right;font-size:14px}
.kpis{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0}
.kpi{flex:1;min-width:150px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 12px;text-align:center}
.kpi .big{font-size:22px;font-weight:700;color:var(--primary)}
.kpi .lbl{font-size:12.5px;color:var(--muted)}
.stchip{display:inline-block;margin-top:4px;padding:1px 10px;border-radius:999px;font-size:12px;font-weight:700}
.ok{background:var(--primaryLight);color:var(--primary)}
.bad{background:var(--accentLight);color:var(--error)}
.objline{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px;margin-top:4px}
.dots{display:flex;flex-wrap:wrap;gap:4px;margin:2px 0 10px}
.dot{width:13px;height:13px;border-radius:50%;border:2px solid var(--line);background:var(--bg)}
.dot.in{background:var(--primary);border-color:var(--primary)}
.drow{display:grid;grid-template-columns:80px 1fr;align-items:center;gap:8px}
.drow .g{font-weight:700;font-size:14px}
.legend{font-size:12.5px;color:var(--muted);margin-top:2px}
.success{display:none;margin-top:12px;border:2px solid var(--primary);background:var(--primaryLight);border-radius:12px;padding:12px 16px}
.success h3{color:var(--primary);font-size:16px;margin-bottom:4px}
.success p{font-size:14px}
#resetBtn{margin-top:4px}
.panel.locked{opacity:.55}
input[type=range]:disabled{opacity:.4;cursor:not-allowed}
input[type=checkbox]:disabled{opacity:.45;cursor:not-allowed}
input[type=checkbox]:disabled+label{opacity:.55;cursor:not-allowed}
.instruction strong{color:var(--accent)}
@media(max-width:980px){.grid{grid-template-columns:1fr}}
@media(max-width:640px){
  body{padding:14px}
  h1{font-size:22px}
  .hdrBtns{width:100%}
  button{min-height:44px}
  .srow{grid-template-columns:1fr 34px}
  .srow label{grid-column:1/-1}
  input[type=range]{height:44px}
  .vrow{grid-template-columns:auto 1fr;grid-template-rows:auto auto}
  .wbar{grid-column:2}
  .wval{grid-column:2;text-align:left}
  th,td{padding:6px 6px;font-size:13px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header>
  <div>
    <div class="kicker" id="kicker"></div>
    <h1 id="title"></h1>
  </div>
  <div class="hdrBtns">
    <button id="langBtn" type="button">English</button>
    <button id="fsBtn" type="button"><span id="fsLabel"></span></button>
  </div>
</header>
<div class="instruction"><strong id="stageTag"></strong> <span id="instruction"></span></div>

<div class="grid">
  <div class="col">
    <section class="panel" aria-labelledby="hData">
      <h2 id="hData"></h2>
      <p class="note" id="dataNote"></p>
      <div class="twrap">
        <table id="cvTable"></table>
      </div>
      <p class="count" id="sampleCount"></p>
    </section>

    <section class="panel" aria-labelledby="hBal">
      <h2 id="hBal"></h2>
      <p class="note" id="balNote"></p>
      <div class="srow">
        <label for="slB" id="slBLabel"></label>
        <input type="range" id="slB" min="0" max="5" step="1" value="0">
        <span class="val" id="slBVal">0</span>
      </div>
      <div class="srow">
        <label for="slA" id="slALabel"></label>
        <input type="range" id="slA" min="0" max="5" step="1" value="0">
        <span class="val" id="slAVal">0</span>
      </div>
      <button id="resetBtn" type="button"></button>
    </section>
  </div>

  <div class="col">
    <section class="panel" aria-labelledby="hVars">
      <h2 id="hVars"></h2>
      <p class="note" id="varsNote"></p>
      <div id="varList"></div>
      <details>
        <summary id="howTitle"></summary>
        <p id="howText" style="margin-top:6px"></p>
      </details>
    </section>

    <section class="panel" aria-labelledby="hRes">
      <h2 id="hRes"></h2>
      <p class="note" id="resNote"></p>
      <div class="mrow">
        <span class="g" id="lblA"></span>
        <div class="mbar"><div class="mfill mA" id="barA" style="width:0%"></div></div>
        <span class="mval" id="valA">–</span>
      </div>
      <div class="mrow">
        <span class="g" id="lblB"></span>
        <div class="mbar"><div class="mfill mB" id="barB" style="width:0%"></div></div>
        <span class="mval" id="valB">–</span>
      </div>
      <div class="drow" style="margin-top:6px"><span class="g" id="dotLblA"></span><div class="dots" id="dotsA"></div></div>
      <div class="drow"><span class="g" id="dotLblB"></span><div class="dots" id="dotsB"></div></div>
      <p class="legend" id="dotsLegend"></p>
      <div class="kpis">
        <div class="kpi">
          <div class="big" id="kpiGap">–</div>
          <div class="lbl" id="kpiGapLbl"></div><br>
          <span class="stchip" id="gapChip"></span>
        </div>
        <div class="kpi">
          <div class="big" id="kpiPert">–</div>
          <div class="lbl" id="kpiPertLbl"></div><br>
          <span class="stchip" id="pertChip"></span>
        </div>
      </div>
      <div class="objline">
        <span id="objText" style="font-weight:700"></span>
        <span class="stchip" id="objGapChip"></span>
        <span class="stchip" id="objPertChip"></span>
      </div>
      <div class="success" id="successBox">
        <h3 id="successTitle"></h3>
        <p id="takeaway"></p>
        <button id="nextBtn" type="button" style="display:none;margin-top:10px;background:var(--accent);border-color:var(--accent);color:#fff"></button>
      </div>
    </section>
  </div>
</div>

<footer><a href="index.html" id="backLink"></a> · <a href="https://fredericjaccard.com">Frédéric Jaccard</a></footer>
<script>

function fmtInt(n) { return String(n); }
function fmtW(x) {
  let s = (x >= 0 ? "+" : "−") + Math.abs(x).toFixed(2);
  return lang === "fr" ? s.replace(".", ",") : s;
}

/* ---------- État ---------- */
let stage = 1;
let active = {grp:true, dip:true, exp:true, tst:true, qrt:true, clb:true};
let nB = 0, nA = 0;

/* ---------- Modèle : poids = moyenne(embauchés) − moyenne(refusés), variables normalisées ---------- */
function trainSet() {
  const t = BASE.map(c => ({c:c, added:false}));
  for (let i = 0; i < nB; i++) t.push({c:ADDB[i], added:true});
  for (let i = 0; i < nA; i++) t.push({c:ADDA[i], added:true});
  return t;
}
function learn(train) {
  const idx = {grp:0, dip:1, exp:2, tst:3, qrt:4, clb:5};
  const hired = train.filter(r => r.c[6] === 1), refused = train.filter(r => r.c[6] === 0);
  const w = {};
  for (const v of VARS) {
    if (!active[v]) continue;
    const i = idx[v];
    const mh = hired.reduce((s, r) => s + r.c[i], 0) / hired.length;
    const mr = refused.reduce((s, r) => s + r.c[i], 0) / refused.length;
    w[v] = mh - mr;
  }
  return w;
}
const qual = cv => 2 * cv[1] + cv[2] + cv[3];
const trueTop = new Set(
  VAL.map((cv, i) => ({q:-qual(cv), i})).sort((a, b) => (a.q - b.q) || (a.i - b.i)).slice(0, 20).map(o => o.i)
);
function evaluate() {
  const train = trainSet();
  const w = learn(train);
  const idx = {grp:0, dip:1, exp:2, tst:3, qrt:4, clb:5};
  const act = VARS.filter(v => active[v]);
  const scored = VAL.map((cv, i) => ({
    s: act.reduce((sum, v) => sum + w[v] * cv[idx[v]] / RANGE[v], 0), i
  })).sort((a, b) => (b.s - a.s) || (a.i - b.i));
  const acc = scored.slice(0, 20).map(o => o.i);
  const accSet = new Set(acc);
  const nAccA = acc.filter(i => VAL[i][0] === 0).length;
  const tauxA = 5 * nAccA, tauxB = 5 * (20 - nAccA);
  const gap = Math.abs(tauxA - tauxB);
  let hit = 0;
  for (const i of acc) if (trueTop.has(i)) hit++;
  const pert = Math.round(100 * hit / 20);
  return {train, w, act, accSet, tauxA, tauxB, gap, pert};
}

/* ---------- Rendu ---------- */
function renderTable(train) {
  const t = T();
  let html = "<thead><tr>" + t.th.map(h => `<th>${h}</th>`).join("") + "</tr></thead><tbody>";
  train.forEach((r, k) => {
    const c = r.c;
    const g = c[0] === 0
      ? `<span class="chip chipA">${t.groupA}</span>`
      : `<span class="chip chipB">${t.groupB}</span>`;
    const dec = c[6] === 1
      ? `<span class="yes">✓ ${t.hired}</span>`
      : `<span class="no">✗ ${t.rejected}</span>`;
    const q = c[4] === 0 ? t.north : t.south;
    const cl = c[5] === 0 ? t.robotics : t.drama;
    const bd = r.added ? `<span class="badge">+ ${t.addedBadge}</span>` : "";
    html += `<tr class="${r.added ? "added" : ""}"><td>${k + 1}${bd}</td><td>${g}</td><td>${c[1]}</td><td>${c[2]}</td><td>${c[3]}</td><td>${q}</td><td>${cl}</td><td>${dec}</td></tr>`;
  });
  $("cvTable").innerHTML = html + "</tbody>";
  $("sampleCount").textContent = t.sampleCount(train.length, nB + nA);
}
function renderVars(w, act) {
  const t = T();
  const list = $("varList");
  list.innerHTML = "";
  if (act.length === 0) {
    const p = document.createElement("p");
    p.className = "note";
    p.style.color = "var(--error)";
    p.textContent = t.noVar;
    list.appendChild(p);
  }
  const maxAbs = Math.max(0.01, ...act.map(v => Math.abs(w[v])));
  for (const v of VARS) {
    const row = document.createElement("div");
    row.className = "vrow";
    const cb = document.createElement("input");
    cb.type = "checkbox";
    cb.id = "cb_" + v;
    cb.checked = active[v];
    cb.disabled = (stage === 1);
    cb.setAttribute("aria-label", t.vname[v]);
    cb.onchange = () => { active[v] = cb.checked; render(); };
    const lb = document.createElement("label");
    lb.htmlFor = "cb_" + v;
    lb.textContent = t.vname[v];
    const bar = document.createElement("div");
    bar.className = "wbar";
    const val = document.createElement("span");
    val.className = "wval";
    if (active[v]) {
      const wv = w[v];
      const pct = Math.abs(wv) / maxAbs * 50;
      const fill = document.createElement("div");
      fill.className = "wfill";
      fill.style.background = wv >= 0 ? "var(--primary)" : "var(--error)";
      if (wv >= 0) { fill.style.left = "50%"; fill.style.width = pct + "%"; }
      else { fill.style.width = pct + "%"; fill.style.left = (50 - pct) + "%"; }
      bar.appendChild(fill);
      val.textContent = fmtW(wv);
      val.style.color = wv >= 0 ? "var(--primary)" : "var(--error)";
    } else {
      val.textContent = "–";
      val.style.color = "var(--muted)";
      bar.style.opacity = ".45";
    }
    row.append(cb, lb, bar, val);
    list.appendChild(row);
  }
}
function renderResults(r) {
  const t = T();
  $("barA").style.width = r.tauxA + "%";
  $("barB").style.width = r.tauxB + "%";
  $("valA").textContent = r.tauxA + " %";
  $("valB").textContent = r.tauxB + " %";
  const mk = (elId, group) => {
    const box = $(elId);
    box.innerHTML = "";
    VAL.forEach((cv, i) => {
      if (cv[0] !== group) return;
      const d = document.createElement("span");
      d.className = "dot" + (r.accSet.has(i) ? " in" : "");
      box.appendChild(d);
    });
  };
  mk("dotsA", 0);
  mk("dotsB", 1);
  $("kpiGap").textContent = t.gapPts(r.gap);
  const gapOk = r.gap <= 10;
  $("gapChip").textContent = gapOk ? t.fair : t.unfair;
  $("gapChip").className = "stchip " + (gapOk ? "ok" : "bad");
  $("kpiGap").style.color = gapOk ? "var(--primary)" : "var(--error)";
  $("kpiPert").textContent = r.pert + " %";
  const pertOk = r.pert >= 80;
  $("pertChip").textContent = pertOk ? t.pertOk : t.pertKo;
  $("pertChip").className = "stchip " + (pertOk ? "ok" : "bad");
  $("kpiPert").style.color = pertOk ? "var(--primary)" : "var(--error)";
  $("objGapChip").textContent = (gapOk ? "✓ " : "✗ ") + t.objGap;
  $("objGapChip").className = "stchip " + (gapOk ? "ok" : "bad");
  $("objPertChip").textContent = (pertOk ? "✓ " : "✗ ") + t.objPert;
  $("objPertChip").className = "stchip " + (pertOk ? "ok" : "bad");
  const win = gapOk && pertOk;
  $("successBox").style.display = win ? "block" : "none";
  $("successTitle").textContent = stage === 1 ? t.successTitle1 : t.successTitle2;
  $("takeaway").textContent = stage === 1 ? t.takeaway1 : t.takeaway2;
  $("nextBtn").style.display = (win && stage === 1) ? "inline-block" : "none";
}
function render() {
  const r = evaluate();
  renderTable(r.train);
  renderVars(r.w, r.act);
  renderResults(r);
}
function syncStage() {
  $("slB").disabled = (stage === 2);
  $("slA").disabled = (stage === 2);
  $("slB").closest(".panel").classList.toggle("locked", stage === 2);
  $("varList").closest(".panel").classList.toggle("locked", stage === 1);
  $("balNote").textContent = stage === 2 ? T().lockedSliders : T().balNote;
  $("varsNote").textContent = stage === 1 ? T().lockedVars : T().varsNote;
}
function resetStage() {
  nB = 0; nA = 0;
  $("slB").value = 0; $("slA").value = 0;
  $("slBVal").textContent = "0"; $("slAVal").textContent = "0";
  active = {grp:true, dip:true, exp:true, tst:true, qrt:true, clb:true};
}

/* ---------- Langue ---------- */
function applyLang() {
  const t = T();
  document.documentElement.lang = lang;
  $("kicker").textContent = t.kicker;
  $("title").textContent = t.title;
  $("stageTag").textContent = stage === 1 ? t.stage1tag : t.stage2tag;
  $("instruction").textContent = stage === 1 ? t.instruction1 : t.instruction2;
  $("langBtn").textContent = lang === "fr" ? "English" : "Français";
  $("fsLabel").textContent = isFs() ? t.fsExit : t.fs;
  $("backLink").textContent = t.backList;
  document.title = t.title + " · Gymnase — Frédéric Jaccard";
  $("hData").textContent = t.hData;
  $("dataNote").textContent = t.dataNote;
  $("hBal").textContent = t.hBal;
  $("hVars").textContent = t.hVars;
  $("hRes").textContent = t.hRes;
  $("resNote").textContent = t.resNote;
  $("howTitle").textContent = t.howTitle;
  $("howText").textContent = t.howText;
  $("slBLabel").textContent = t.slB;
  $("slALabel").textContent = t.slA;
  $("resetBtn").textContent = t.reset;
  $("lblA").textContent = t.groupA;
  $("lblB").textContent = t.groupB;
  $("dotLblA").textContent = t.groupA;
  $("dotLblB").textContent = t.groupB;
  $("dotsLegend").textContent = t.invitedLegend;
  $("kpiGapLbl").textContent = t.gapLbl;
  $("kpiPertLbl").textContent = t.pertLbl;
  $("objText").textContent = t.objText;
  $("nextBtn").textContent = t.nextStage;
  syncStage();
  render();
}
$("langBtn").onclick = () => {
  lang = lang === "fr" ? "en" : "fr";
  try {
    localStorage.setItem("fj-lang", lang);
    document.cookie = "fj-lang=" + lang + ";domain=.fredericjaccard.com;path=/;max-age=31536000;SameSite=Lax";
  } catch (e) {}
  applyLang();
};

/* ---------- Plein écran (compatible Safari) ---------- */
function isFs() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }
$("fsBtn").onclick = () => {
  const el = document.documentElement;
  if (isFs()) {
    (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  } else {
    const req = el.requestFullscreen || el.webkitRequestFullscreen;
    if (req) { const r = req.call(el); if (r && r.catch) r.catch(() => {}); }
  }
};
function syncFsLabel() { $("fsLabel").textContent = isFs() ? T().fsExit : T().fs; }
document.addEventListener("fullscreenchange", syncFsLabel);
document.addEventListener("webkitfullscreenchange", syncFsLabel);

/* ---------- Contrôles ---------- */
$("slB").oninput = () => { nB = +$("slB").value; $("slBVal").textContent = $("slB").value; render(); };
$("slA").oninput = () => { nA = +$("slA").value; $("slAVal").textContent = $("slA").value; render(); };
$("resetBtn").onclick = () => {
  resetStage();
  render();
};
$("nextBtn").onclick = () => {
  stage = 2;
  resetStage();
  applyLang();
  window.scrollTo({top: 0, behavior: "smooth"});
};

applyLang();
</script>
</body>
</html>

:root{--bg:#FBFAF6;--card:#F7F6F2;--primary:#155E4C;--primaryLight:#E3F0EA;--accent:#D96A08;--accentLight:#FDEBD8;--line:#D8D5CB;--ink:#20241F;--muted:#6E726B;--error:#C84B31}
*{box-sizing:border-box}html{color-scheme:light}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.46 "Quattrocento Sans","Segoe UI",Arial,sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:30px 34px 18px}
button,input,select{font:inherit;color:inherit}button,select,summary{cursor:pointer}button{display:inline-flex;align-items:center;justify-content:center;gap:.48em;min-height:44px;padding:8px 14px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--primary);font-weight:700;line-height:1.2}
button:hover,select:hover{border-color:var(--primary);background-color:var(--primaryLight)}button:disabled{opacity:.42;cursor:default}
button.primary{background:var(--primary);color:var(--bg);border-color:var(--primary)}button.primary:hover{filter:brightness(1.12)}
button.light{background:transparent;border-color:var(--primary)}button.light:hover{background:var(--primaryLight)}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}a{color:var(--primary);text-underline-offset:.18em}svg.icon{flex:none;width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}h1,h2,h3,p,ul,ol{margin:0}h1,h2,h3{color:var(--primary);line-height:1.12}h1{font-size:clamp(1.8rem,3.4vw,2.55rem);letter-spacing:-.035em}h2{font-size:clamp(1.35rem,2.2vw,1.75rem);letter-spacing:-.025em}h3{font-size:1.15rem}
header,.brand,.toolbar,.sectionhead,.actions,.switches,.labNav,.pager,.metaLine,.displayHead{display:flex;align-items:center}
header{justify-content:space-between;gap:16px}.brand{gap:14px}.brandMark{width:54px;height:54px;flex:none;color:var(--primary)}.kicker{font-size:.73rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin-bottom:3px}.toolbar{gap:8px;flex-shrink:0}.toolbar button{font-size:.92rem;background:var(--card)}

 ["Radius and tangent","Move T. What happens to the angle between OT and the tangent when the line changes direction?","The radius to a point of contact meets the tangent at a right angle.","T is the closest point on the tangent to O. The shortest segment from a point to a line is perpendicular to that line.","If P lies on the tangent at T and ∠TOP = 42°, then ∠OPT = 180° − 90° − 42° = 48°."],
 ["Tangents from an external point","Move P away from the circle. Both tangent segments get longer. Can one ever become longer than the other?","If PA and PB touch the same circle at A and B, their lengths from the common external point P are equal.","OA and OB are equal radii. The right triangles OAP and OBP also share hypotenuse OP, so their corresponding tangent sides are equal.","If PA = 3x + 2 and PB = 20, then 3x + 2 = 20 and x = 6."],
 ["Tangent and chord","Move A, keeping the tangent fixed. At which point of the triangle can you find an angle equal to ∠QTA?","The angle between tangent TQ and chord TA equals the angle subtended by TA in the alternate segment, here ∠TCA.","OT is perpendicular to the tangent and triangle OTA is isosceles. The tangent–chord angle is half the central angle on arc TA, just as ∠TCA is.","If ∠QTA = 49° and ∠CTA = 75°, then ∠TCA = 49° and ∠TAC = 56°."],
 ["Perpendicular bisector of a chord","Slide M away from O. AB gets shorter. How do the two parts of the chord compare?","The perpendicular from O to chord AB meets it at its midpoint M. Equivalently, the perpendicular bisector of a chord passes through O.","OA and OB are equal radii. The right triangles OMA and OMB share OM and have equal hypotenuses, so AM = MB.","For a radius of 5 cm and a chord of 8 cm, AM = 4 cm. Pythagoras gives OM = √(5² − 4²) = 3 cm."],
 ["Equal chords","Drag M to change both equal chords together. Compare OM and ON even though the chords have different directions.","In the same circle, chords of equal length have equal perpendicular distances from the centre.","The perpendiculars halve both chords. The resulting right triangles have equal hypotenuses (radii) and equal half-chords, so their remaining legs are equal.","If AB = CD and OM = 3.5 cm, the perpendicular distance ON from O to CD is also 3.5 cm."]

 ["Angle dans un demi-cercle","Glissez C vers A, puis vers B. Quel angle du triangle garde la même mesure ?","Si AB est un diamètre, tout point C situé sur l’un ou l’autre demi-cercle forme un angle droit ∠ACB.","Au centre, le diamètre détermine un angle plat. L’angle inscrit qui intercepte le même demi-cercle vaut la moitié de 180°.","Si ∠CAB = 28°, alors ∠ABC = 180° − 90° − 28° = 62°."],
 ["Angles inscrits dans le même segment","Déplacez C en laissant A, B et D fixes. L’angle ∠ACB peut-il changer si l’arc AB reste le même ?","Les angles en C et en D sont égaux lorsqu’ils s’appuient sur la même corde AB et que leurs sommets sont du même côté de cette corde.","Les deux angles interceptent le même arc AB. Chacun vaut la moitié de l’angle au centre associé à cet arc.","Si ∠ACB = 41°, alors ∠ADB = 41°. Vérifiez que les deux sommets sont dans le même segment circulaire."],
 ["Quadrilatère inscrit","Déplacez B et prévoyez la variation de l’angle opposé. Puis prolongez DC au-delà de C et comparez l’angle extérieur avec celui en A.","Si les quatre sommets d’un quadrilatère sont sur un cercle, ses angles intérieurs opposés ont pour somme 180°. Un angle extérieur est égal à l’angle intérieur opposé.","Les deux angles opposés interceptent des arcs qui forment ensemble le cercle entier. La moitié de 360° vaut 180°. En C, les angles intérieur et extérieur forment un angle plat.","Si ∠DAB = 81°, l’angle intérieur en C vaut 99°. En prolongeant DC, on obtient l’angle extérieur ∠BCE = 81°."],
 ["Rayon et tangente","Déplacez T. Lorsque la tangente change de direction, que devient l’angle qu’elle forme avec OT ?","Au point de contact, la tangente est perpendiculaire au rayon.","T est le point de la tangente le plus proche de O. Le plus court segment entre un point et une droite est perpendiculaire à cette droite.","Si P appartient à la tangente en T et que ∠TOP = 42°, alors ∠OPT = 180° − 90° − 42° = 48°."],
 ["Deux tangentes issues d’un point","Éloignez P du cercle. Les deux segments tangents s’allongent. L’un peut-il devenir plus long que l’autre ?","Si PA et PB sont tangents au même cercle en A et B, leurs longueurs depuis le point extérieur P sont égales.","OA et OB sont deux rayons égaux. Les triangles rectangles OAP et OBP ont aussi la même hypoténuse OP. Leurs côtés PA et PB sont donc égaux.","Si PA = 3x + 2 et PB = 20, alors 3x + 2 = 20, d’où x = 6."],
 ["Tangente et corde","Déplacez A en gardant la tangente fixe. À quel sommet du triangle retrouvez-vous un angle égal à ∠QTA ?","L’angle formé par la tangente TQ et la corde TA est égal à l’angle inscrit qui s’appuie sur TA dans le segment opposé, ici ∠TCA.","OT est perpendiculaire à la tangente et le triangle OTA est isocèle. L’angle tangente-corde vaut la moitié de l’angle au centre associé à l’arc TA, tout comme ∠TCA.","Si ∠QTA = 49° et ∠CTA = 75°, alors ∠TCA = 49° et ∠TAC = 56°."],
 ["Médiatrice d’une corde","Éloignez M de O. La corde AB se raccourcit. Comparez les longueurs de ses deux parties.","La perpendiculaire issue de O coupe la corde AB en son milieu M. La médiatrice d’une corde passe donc par le centre du cercle.","OA et OB sont deux rayons égaux. Les triangles rectangles OMA et OMB ont le côté OM en commun et leurs hypoténuses sont égales. On en déduit AM = MB.","Avec un rayon de 5 cm et une corde de 8 cm, AM = 4 cm. Pythagore donne OM = √(5² − 4²) = 3 cm."],
 ["Cordes de même longueur","Déplacez M pour faire varier ensemble les deux cordes égales. Comparez OM et ON malgré les directions différentes des cordes.","Dans un même cercle, deux cordes de même longueur se trouvent à la même distance du centre. La distance se mesure perpendiculairement à la corde.","Les perpendiculaires partagent les cordes en deux. Les triangles rectangles obtenus ont des hypoténuses égales (rayons) et des demi-cordes égales. Leurs autres côtés sont donc égaux.","Si AB = CD et OM = 3,5 cm, la distance perpendiculaire ON du centre à CD vaut aussi 3,5 cm."]

   if(params.has("pos")&&Number.isFinite(Number(params.get("pos")))){const c=CONTROLS[labIndex];positions[labIndex]=clamp(Math.round(Number(params.get("pos"))),c.min,c.max)}
   if(params.has("hide"))showNumbers=params.get("hide")!=="1";
   if(params.has("ext"))exterior=params.get("ext")==="1";
 }
 if(tab===2&&Number.isInteger(num)&&num>=1&&num<=PRACTICE_COUNT)qIndex=num-1;
}
function hashFor(){const n=[termIndex+1,labIndex+1,qIndex+1,0][tab];return "#"+routes[tab]+(n?"/"+n:"")}
function setRoute(){
 try{if(location.hash!==hashFor())history.pushState(null,"",hashFor())}catch{}
}
function navigate(t,i,scroll=true){
 tab=t;if(t===0&&i!==undefined)termIndex=i;if(t===1&&i!==undefined)labIndex=i;if(t===2&&i!==undefined)qIndex=i;
 rule=false;hint=false;solution=false;activePointer=null;setRoute();renderView();
 if(scroll)window.scrollTo(0,0);
}
window.addEventListener("hashchange",()=>{readRoute();rule=false;hint=false;solution=false;renderView()});
function fsActive(){return !!(document.fullscreenElement||document.webkitFullscreenElement)}
function syncFs(){
 const label=fsActive()?T().fsExit:document.body.classList.contains("focusMode")?T().focusExit:T().fs;
 $("fsBtn").innerHTML=icon("expand")+'<span class="fsWord">'+label+'</span>';$("fsBtn").title=label;$("fsBtn").setAttribute("aria-label",label);
}
function focusFallback(){document.body.classList.toggle("focusMode");syncFs()}
$("fsBtn").addEventListener("click",()=>{
 if(document.body.classList.contains("focusMode")){focusFallback();return}
 if(fsActive()){const exit=document.exitFullscreen||document.webkitExitFullscreen;if(exit)exit.call(document);return}
 const el=document.documentElement,req=el.requestFullscreen||el.webkitRequestFullscreen;
 if(!req){focusFallback();return}
 try{const result=req.call(el);if(result&&result.catch)result.catch(focusFallback)}catch{focusFallback()}
});
document.addEventListener("fullscreenchange",syncFs);document.addEventListener("webkitfullscreenchange",syncFs);
function applyLang(){
 document.documentElement.lang=lang;document.title=T().title+" · Gymnase — Frédéric Jaccard";
 $("title").textContent=T().title;$("kicker").textContent=T().kicker;
 $("langBtn").innerHTML=icon("globe","langIcon")+T().langButton;$("langBtn").lang=lang==="fr"?"en":"fr";
 $("backLink").textContent=T().backList;syncFs();renderView();
}
$("langBtn").onclick=()=>{lang=lang==="fr"?"en":"fr";storeLang();applyLang()};
function heading(kicker,title,tools=""){
 return '<div class="sectionhead"><div><div class="metaLine"><span class="rule"></span>'+kicker+'</div><h2>'+title+'</h2></div>'+tools+'</div>';
}
function svgShell(id,bits,title,desc,interactive=false){
 return '<svg class="drawing" '+(id?'id="'+id+'" ':"")+'viewBox="34 5 340 262" '+(interactive?'role="group"':'role="img"')+' aria-label="'+escapeHTML(title)+'"><title>'+escapeHTML(title)+'</title><desc>'+escapeHTML(desc)+'</desc>'+bits+'</svg>';
}
function displayHead(label,glyph,extra=""){return '<div class="displayHead"><span class="figureTitle">'+icon(glyph)+label+'</span>'+extra+'</div>'}
function numberedSelect(action,items,current,label){
 return '<select id="'+action+'" aria-label="'+label+'">'+items.map((title,i)=>'<option value="'+i+'" '+(i===current?"selected":"")+'>'+title+'</option>').join("")+'</select>';
}
function choiceNav(which,items,current,label){
 return '<div class="labNav">'+iconBtn(which+"Prev",T().previous,"prev",current===0)+numberedSelect(which+"Select",items,current,label)+iconBtn(which+"Next",T().next,"next",current===items.length-1)+'</div>';
}
function renderBasics(){
 const t=T(),term=t.terms[termIndex];
 const main=heading(t.course,t.vocabTitle)+'<div class="work"><div class="board"><div class="canvas">'+displayHead(t.vocab,"book")+svgShell("",vocabularyDrawing(termIndex),term[0],term[1])+'</div><div class="glossText"><h3>'+term[0]+'</h3><p>'+term[1]+'</p></div></div>'+
 '<section class="side"><h3>'+icon("book")+t.vocab+'</h3><div class="termGrid">'+t.terms.map((item,i)=>btn("term",item[0],"","",'data-i="'+i+'" aria-pressed="'+(i===termIndex)+'"')).join("")+'</div><p class="note">'+t.notation+'</p><div class="why"><h3>'+t.oral+'</h3><p>'+t.oralQ+'</p><div class="actions">'+(termIndex!==8?btn("triangle",t.triangle,"","angle"):"")+btn("oral",oral?t.oralClose:t.oralOpen,"light","","aria-expanded="+oral)+'</div>'+(oral?'<p>'+t.oralA+'</p>':"")+'</div>'+btn("startLab",t.toLab,"related","compass")+'</section></div>';
 return main+'<details class="guideBox" id="plan" '+(guide?"open":"")+'><summary>'+t.plan+'</summary><div class="guideRows">'+t.planRows.map(row=>'<b>'+row[0]+'</b><span>'+row[1]+'</span>').join("")+'</div><div class="resources"><a href="'+POSTER+'" target="_blank" rel="noopener">'+t.poster+'</a><a href="'+ILLUSTRATED+'" target="_blank" rel="noopener">'+t.publisher+'</a></div></details>';
}
function measuresHTML(s){
 return s.metrics.map((m,i)=>'<div class="measure '+(i?"mGreen":"")+'"><span class="mName"><span class="swatch"></span>'+(s.metrics[0][2]==="°"?(i?"β · ":"α · "):"")+m[0]+(showNumbers&&s.index===0&&i===0&&s.v>180?' <small>('+T().refl+')</small>':"")+'</span><strong'+(!showNumbers?' aria-label="'+T().hidden+'"':"")+'>'+(showNumbers?metricText(m):"—")+'</strong></div>').join("");
}
function renderLab(){
 const t=T(),l=t.labs[labIndex],c=CONTROLS[labIndex];labScene=sceneFor(labIndex,positions[labIndex],{exterior,proof:rule});
 const choose=choiceNav("lab",t.labs.map((l,i)=>(i+1)+". "+l[0]),labIndex,t.chooseTheorem);
 const visibility=btn("measure",showNumbers?t.hideMeasures:t.showMeasures,"miniBtn",showNumbers?"eyeOff":"eye",'aria-pressed="'+(!showNumbers)+'"');
 const cap=t.fig;
 const board='<section class="board"><div class="canvas">'+displayHead(cap,"angle",visibility)+svgShell("labSvg",renderDrawing(labScene,true,!showNumbers),l[0],t.labDesc,true)+'</div>'+
 '<div class="measures" id="metrics" role="group" aria-label="'+t.legend+'">'+measuresHTML(labScene)+'</div>'+
 '<div class="slideTools"><label for="position">'+t.move+' '+c.handle+'</label><input id="position" type="range" min="'+c.min+'" max="'+c.max+'" value="'+positions[labIndex]+'" aria-valuetext="'+t.position+' '+Math.round((positions[labIndex]-c.min)*100/(c.max-c.min))+'%">'+
 btn("reset",'<span class="resetWord">'+t.reset+'</span>',"miniBtn","reset",'title="'+t.reset+'" aria-label="'+t.reset+'"')+'</div></section>';
 const variants=labIndex===3?'<div class="switches">'+btn("interior",t.inside,"","",'aria-pressed="'+(!exterior)+'"')+btn("exterior",t.outside,"","",'aria-pressed="'+exterior+'"')+'</div>':"";
 const panel='<section class="side"><h3>'+icon("hint")+t.observe+'</h3><p class="prompt">'+l[1]+'</p>'+variants+'<div class="actions">'+btn("rule",rule?t.hideRule:t.showRule,"primary blockBtn","layers",'aria-expanded="'+rule+'"')+'</div>'+
 (rule?'<div class="why"><p><strong>'+l[2]+'</strong></p><p><strong>'+t.why+'</strong> '+l[3]+'</p><p><strong>'+t.example+'.</strong> '+l[4]+'</p></div>':"")+
 btn("related",t.related,"related","edit")+'</section>';
 const share=/^https?:$/.test(location.protocol)?btn("share",t.copyLink,"miniBtn","link"):"";
 return heading(t.theorem+" "+(labIndex+1)+" / "+CONTROLS.length,l[0],choose)+'<div class="work">'+board+panel+'</div><div class="pager"><div class="navGroup">'+share+'<span id="shareStatus" role="status"></span></div>'+btn("continueLab",labIndex===8?t.toPractice:t.nextTheorem,"light","next")+'</div>';
}
function updateLabValue(v,refocus=false){
 const c=CONTROLS[labIndex];positions[labIndex]=clamp(Math.round(v),c.min,c.max);labScene=sceneFor(labIndex,positions[labIndex],{exterior,proof:rule});
 const chart=$("labSvg");if(!chart)return;
 chart.innerHTML='<title>'+escapeHTML(T().labs[labIndex][0])+'</title><desc>'+T().labDesc+'</desc>'+renderDrawing(labScene,true,!showNumbers);
 $("metrics").innerHTML=measuresHTML(labScene);$("position").value=positions[labIndex];
 $("position").setAttribute("aria-valuetext",T().position+" "+Math.round(100*(positions[labIndex]-c.min)/(c.max-c.min))+"%");
 if($("shareStatus"))$("shareStatus").textContent="";
 if(refocus)chart.querySelector(".handle").focus({preventScroll:true});
}
function formatUnit(v,unit){return unit==="°"?fmt(v)+"°":unit?fmt(v)+" "+unit:fmt(v)}
function inputPanel(i,a,isExit){
 const t=T(),q=QUESTIONS[i],copy=t.questions[i];const opts=q.choices.map(r=>'<label class="reasonOption"><input type="radio" name="reason" value="'+r+'" '+(String(r)===a.reason?"checked":"")+'><span>'+t.reasons[r]+'</span></label>').join("");
 const chosen=a.reason===""?t.chooseReason:t.reasons[Number(a.reason)];
 const unit=q.unit||"";
 return '<form id="answerForm" novalidate><h3>'+icon("edit")+t.yourTurn+'</h3><label for="answer" class="field">'+t.value+'</label><div class="valueField"><input id="answer" name="answer" type="text" inputmode="decimal" maxlength="32" autocomplete="off" value="'+escapeHTML(a.value)+'" aria-label="'+t.value+(unit?" ("+unit+")":"")+'"><span>'+unit+'</span></div>'+
 '<fieldset class="reasonField"><legend>'+(copy[4]||t.reason)+'</legend><details id="reasonMenu"><summary id="reasonChoice">'+escapeHTML(chosen)+'</summary><div class="reasonChoices">'+opts+'</div></details></fieldset>'+
 '<div class="actions"><button class="primary" type="submit">'+icon(isExit?(ticket.at===2?"check":"next"):"check")+(isExit?(ticket.at===2?t.finish:t.saveNext):t.check)+'</button>'+(isExit?"":btn("hint",hint?t.hideHint:t.hint,"","hint",'aria-expanded="'+hint+'"'))+'</div></form>';
}
function problemBoard(i,prefix=""){
 const t=T(),q=QUESTIONS[i],copy=t.questions[i],s=sceneFor(q.scene,q.v,q);
 return '<div class="board"><div class="canvas">'+displayHead(t.fixedFig,"angle")+svgShell("",renderDrawing(s),t.fixedFig+" "+(prefix||i+1),copy[0]+" "+copy[1])+'</div><div class="taskText"><p>'+copy[0]+'</p><p class="ask">'+copy[1]+'</p></div></div>';
}
function workedSteps(i){return '<ol class="workedList">'+T().questions[i][3].map(line=>'<li>'+line+'</li>').join("")+'</ol>'}
function feedbackHTML(a){
 if(!a.feedback)return '<div id="fb" role="status"></div>';
 return '<div id="fb" role="status" class="feedback '+(a.feedback==="correct"?"success":"error")+'">'+T()[a.feedback]+'</div>';
}
function actualStatus(a){return a.solved?T().solved:a.seen?T().assisted:T().open}
function renderPractice(){
 const t=T(),a=records[qIndex],copy=t.questions[qIndex];
 const items=records.map((r,i)=>t.practice+" "+(i+1)+" · "+actualStatus(r));
 const nav=choiceNav("q",items,qIndex,t.chooseQuestion);
 const solved=records.filter(r=>r.solved).length;
 const panel='<section class="side">'+inputPanel(qIndex,a,false)+feedbackHTML(a)+(hint?'<div class="hintText"><strong>'+t.hint+'.</strong> '+copy[2]+'</div>':"")+
 '<div class="why">'+btn("solution",solution?t.hideSolution:t.solution,"miniBtn","book",'aria-expanded="'+solution+'"')+(solution?workedSteps(qIndex):"")+'</div>'+
 btn("revise",t.goExplore,"related","compass")+'</section>';
 return heading(t.practice+" "+(qIndex+1)+" / "+PRACTICE_COUNT,qIndex<9?t.exerciseTitle:t.challenge,nav)+'<div class="work">'+problemBoard(qIndex)+panel+'</div><div class="pager"><div><span>'+solved+' / '+PRACTICE_COUNT+' '+t.progress+'</span><div class="progressline"><span style="width:'+100*solved/PRACTICE_COUNT+'%"></span></div></div>'+btn("continuePractice",qIndex===PRACTICE_COUNT-1?t.startExit:t.next,"light","next")+'</div>';
}
function renderResult(){
 const t=T(),graded=ticket.answers.map((a,k)=>marked(QUESTIONS[k+PRACTICE_COUNT],a));
 const total=graded.filter(g=>g.number&&g.reason).length;
 const rows=ticket.answers.map((a,k)=>{
   const i=PRACTICE_COUNT+k,q=QUESTIONS[i],r=graded[k],visible=reviewOpen.has(k);
   return '<div class="reviewItem"><div class="reviewHeader"><div><h3>'+t.item+' '+(k+1)+'</h3><p class="small">'+(r.number?t.valueCorrect:t.valueWrong)+' · '+(r.reason?t.reasonCorrect:t.reasonWrong)+'</p></div>'+
   btn("review",visible?t.hideReview:t.showReview,"miniBtn","book",'data-i="'+k+'" aria-expanded="'+visible+'"')+'</div>'+
   (visible?'<div class="work" style="margin-top:12px">'+problemBoard(i,String(k+1))+'<div><p><strong>'+t.yourAnswer+'</strong> · '+escapeHTML(a.value)+(q.unit==="°"?"°":q.unit?" "+q.unit:"")+'</p><p class="small">'+t.reasons[Number(a.reason)]+'</p><p><strong>'+t.expected+'</strong> · '+formatUnit(q.answer,q.unit)+'</p><p class="small"><strong>'+t.rightReason+'</strong> · '+t.reasons[q.reason]+'</p>'+workedSteps(i)+'</div></div>':"")+'</div>';
 }).join("");
 return heading(t.exitTitle,t.results)+'<div class="summaryBox"><div class="resultTop"><strong>'+total+' / 3</strong><p>'+t.total+'</p></div><div class="reviewRows">'+rows+'</div><div class="actions">'+btn("retryExit",t.retry,"primary","reset")+btn("backPractice",t.again,"light","edit")+'</div></div>';
}
function renderExit(){
 const t=T();if(ticket.done)return renderResult();
 if(!ticket.started)return heading(t.exitTitle,t.exitIntro)+'<div class="summaryBox"><p>'+t.exitDetail+'</p><div class="actions">'+btn("startExit",t.start,"primary","list")+'</div></div>';
 const k=ticket.at,i=PRACTICE_COUNT+k,a=ticket.answers[k];
 return heading(t.item+" "+(k+1)+" / 3",t.exitTitle)+'<div class="work">'+problemBoard(i,String(k+1))+'<section class="side">'+inputPanel(i,a,true)+feedbackHTML(a)+(k>0?btn("prevExit",t.goBack,"related","prev"):"")+'</section></div>';
}
function renderView(){
 const t=T(),icons=["book","compass","edit","list"];
 $("nav").setAttribute("aria-label",t.nav);$("nav").innerHTML=t.tabs.map((name,i)=>btn("tab",name,"",icons[i],'data-i="'+i+'" '+(i===tab?'aria-current="page"':""))).join("");
 $("instruction").innerHTML=icon(["book","hand","edit","list"][tab])+'<span>'+t.instructions[tab]+'</span>';
 $("main").innerHTML=[renderBasics,renderLab,renderPractice,renderExit][tab]();
 if($("plan"))$("plan").ontoggle=e=>{guide=e.currentTarget.open};
}
function refreshAfterAction(el){
 const action=el?.dataset.action;const idx=el?.dataset.i;renderView();
 if(!action)return;const match=Array.from(document.querySelectorAll("[data-action]")).find(b=>b.dataset.action===action&&(idx===undefined||b.dataset.i===idx));
 if(match)match.focus({preventScroll:true});
}
function syncDraft(){
 if(!$("answer")||!$("reasonMenu"))return;
 const a=tab===2?records[qIndex]:ticket.answers[ticket.at];a.value=$("answer").value;a.reason=document.querySelector('input[name="reason"]:checked')?.value??"";a.feedback="";
 if($("fb")){$("fb").className="";$("fb").textContent=""}save();
}
function submitAnswer(){
 syncDraft();const isExit=tab===3,i=isExit?PRACTICE_COUNT+ticket.at:qIndex,a=isExit?ticket.answers[ticket.at]:records[qIndex],g=marked(QUESTIONS[i],a);
 if(!g.valid)a.feedback="missing";
 else if(isExit){
   if(ticket.at<2)ticket.at++;
   else{const missing=ticket.answers.findIndex((ans,k)=>!marked(QUESTIONS[PRACTICE_COUNT+k],ans).valid);if(missing>=0){ticket.at=missing;ticket.answers[missing].feedback="missing"}else{ticket.done=true;reviewOpen.clear()}}
 }else{
   a.feedback=g.number&&g.reason?"correct":g.number?"badReason":g.reason?"badNum":"badBoth";
   if(g.number&&g.reason)a.solved=true;
 }
 save();renderView();if(isExit&&g.valid){window.scrollTo(0,0);if($("answer"))$("answer").focus({preventScroll:true})}
 else{if(!g.valid){if(Number.isFinite(parseNumber(a.value))){$("reasonMenu").open=true;$("reasonChoice").focus({preventScroll:true})}else $("answer").focus({preventScroll:true})}else document.querySelector("#answerForm [type=submit]")?.focus({preventScroll:true})}
}
async function shareDiagram(){
 const url=new URL(location.href);url.searchParams.set("lang",lang);
 const args=new URLSearchParams({pos:String(positions[labIndex]),hide:showNumbers?"0":"1"});if(labIndex===3)args.set("ext",exterior?"1":"0");
 url.hash="explore/"+(labIndex+1)+"?"+args;const area=$("shareStatus");if(!area)return;
 try{await navigator.clipboard.writeText(url.href);area.textContent=T().copied}
 catch{area.innerHTML='<label>'+T().copyManually+' <input id="shareUrl" readonly></label>';$("shareUrl").value=url.href;$("shareUrl").select()}
}
document.addEventListener("click",e=>{
 const b=e.target.closest("button[data-action]");if(!b)return;
 const a=b.dataset.action,i=Number(b.dataset.i);switch(a){
   case "tab":navigate(i);break;
   case "term":termIndex=i;setRoute();refreshAfterAction(b);break;
   case "triangle":termIndex=8;setRoute();renderView();break;
   case "oral":oral=!oral;termIndex=8;setRoute();refreshAfterAction(b);break;
   case "startLab":navigate(1,0);break;
   case "labPrev":navigate(1,Math.max(0,labIndex-1));break;
   case "labNext":navigate(1,Math.min(8,labIndex+1));break;
   case "continueLab":labIndex===8?navigate(2,0):navigate(1,labIndex+1);break;
   case "related":navigate(2,MATCH[labIndex]);break;
   case "measure":showNumbers=!showNumbers;refreshAfterAction(b);break;
   case "rule":rule=!rule;refreshAfterAction(b);break;
   case "reset":updateLabValue(CONTROLS[labIndex].start);break;
   case "exterior":case "interior":exterior=a==="exterior";refreshAfterAction(b);break;
   case "share":shareDiagram();break;
   case "qPrev":navigate(2,Math.max(0,qIndex-1));break;
   case "qNext":navigate(2,Math.min(PRACTICE_COUNT-1,qIndex+1));break;
   case "continuePractice":qIndex===PRACTICE_COUNT-1?navigate(3):navigate(2,qIndex+1);break;
   case "hint":hint=!hint;refreshAfterAction(b);break;
   case "solution":solution=!solution;if(solution)records[qIndex].seen=true;save();refreshAfterAction(b);break;
   case "revise":navigate(1,RELATED_LAB[qIndex]);break;
   case "backPractice":navigate(2);break;
   case "startExit":ticket.started=true;save();renderView();break;
   case "prevExit":ticket.at=Math.max(0,ticket.at-1);save();renderView();window.scrollTo(0,0);break;
   case "review":reviewOpen.has(i)?reviewOpen.delete(i):reviewOpen.add(i);refreshAfterAction(b);break;
   case "retryExit":ticket=newExit();ticket.started=true;reviewOpen.clear();save();renderView();window.scrollTo(0,0);break;
 }
});
document.addEventListener("input",e=>{if(e.target.id==="position")updateLabValue(+e.target.value);if(e.target.id==="answer")syncDraft()});
document.addEventListener("change",e=>{if(e.target.id==="labSelect")navigate(1,+e.target.value,false);if(e.target.id==="qSelect")navigate(2,+e.target.value,false);if(e.target.name==="reason"){syncDraft();$("reasonChoice").textContent=T().reasons[Number(e.target.value)];$("reasonMenu").open=false;$("reasonChoice").focus({preventScroll:true})}});
document.addEventListener("submit",e=>{if(e.target.id==="answerForm"){e.preventDefault();submitAnswer()}});
function fromPointer(e,svg){
 const point=svg.createSVGPoint();point.x=e.clientX;point.y=e.clientY;
 const transform=svg.getScreenCTM();return transform?point.matrixTransform(transform.inverse()):null;
}
document.addEventListener("pointerdown",e=>{
 if(!e.isPrimary||e.button!==0||!e.target.closest("#labSvg .handle"))return;
 const svg=$("labSvg");e.preventDefault();activePointer=e.pointerId;svg.setPointerCapture(e.pointerId);
});
document.addEventListener("pointermove",e=>{
 if(activePointer!==e.pointerId||tab!==1)return;
 const svg=$("labSvg");if(!svg)return;const pos=fromPointer(e,svg);if(pos)updateLabValue(parameterAt(labScene,pos));
});
function endDrag(e){if(activePointer===e.pointerId)activePointer=null}
document.addEventListener("pointerup",endDrag);document.addEventListener("pointercancel",endDrag);document.addEventListener("lostpointercapture",endDrag);
document.addEventListener("keydown",e=>{
 if(!e.target.closest("#labSvg .handle"))return;
 const c=CONTROLS[labIndex],step=e.shiftKey?5:1,values={ArrowLeft:-step,ArrowDown:-step,ArrowRight:step,ArrowUp:step,Home:c.min-positions[labIndex],End:c.max-positions[labIndex]};
 if(Object.hasOwn(values,e.key)){e.preventDefault();updateLabValue(positions[labIndex]+values[e.key],true)}
});
readRoute();applyLang();

</script></body></html>

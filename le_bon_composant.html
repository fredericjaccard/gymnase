<style>

*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:"Quattrocento Sans",sans-serif;padding:20px;min-height:100dvh}
button{font-family:inherit;font-size:14px;font-weight:700;padding:9px 16px;border-radius:10px;border:2px solid var(--primary);background:var(--card);color:var(--primary);cursor:pointer;min-height:44px;transition:background .18s,transform .18s,border-color .18s}
button:hover{background:var(--primaryLight)}button:active{transform:scale(.98)}
button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
header{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px;margin:0 auto 16px;max-width:1180px}
.kicker{font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
h1{font-size:28px;color:var(--primary);margin-top:3px}.hdrBtns{display:flex;gap:8px;flex-wrap:wrap}
.instruction{background:var(--primaryLight);border-radius:12px;padding:12px 16px;margin:0 auto 16px;font-size:15px;max-width:1180px;line-height:1.5}
.game{max-width:1180px;margin:0 auto}
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.levelBtn{position:relative;background:var(--card);border:1px solid var(--primary);text-align:left;padding:12px 14px;display:flex;align-items:center;gap:10px}
.levelBtn.current{background:var(--primary);color:var(--bg)}.levelBtn.locked{opacity:.35;cursor:not-allowed}.levelBtn.solved{border-color:var(--accent)}
.levelBtn.solved:after{content:"★";position:absolute;top:-13px;left:50%;transform:translateX(-50%);color:var(--accent);font-size:22px;background:var(--bg);padding:0 5px}
.levelNum{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--primaryLight);color:var(--primary);flex:0 0 30px}.current .levelNum{background:var(--bg)}
.levelBtn small{display:block;font-size:12px;font-weight:400;margin-top:2px}.levelBtn.locked small{visibility:hidden}
.hud{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px;color:var(--muted);font-size:14px}
.score{color:var(--accent);font-weight:700;font-size:16px}.progress{height:7px;background:var(--line);border-radius:8px;overflow:hidden;margin-bottom:14px}.progressBar{height:100%;background:var(--accent);width:0;transition:width .25s}
.quizCard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;min-height:460px;display:flex;flex-direction:column}
.questionGrid{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);gap:24px;align-items:start}
.promptSide{display:flex;flex-direction:column;gap:14px}.chipArt{width:104px;height:104px;border:2px solid var(--primary);border-radius:22px;background:var(--primaryLight);display:grid;place-items:center;position:relative;color:var(--primary);font-size:34px;font-weight:700}
.chipArt:before,.chipArt:after{content:"";position:absolute;left:-14px;right:-14px;height:2px;background:var(--line)}.chipArt:before{top:28px}.chipArt:after{bottom:28px}
.chipPins{position:absolute;top:-12px;bottom:-12px;width:2px;background:var(--line);left:31px;box-shadow:40px 0 0 var(--line)}
.levelTag{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--accent);font-weight:700}
h2{font-size:24px;line-height:1.25;color:var(--primary)}.prompt{font-size:18px;line-height:1.55;max-width:65ch}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.answer{border:1px solid var(--primary);background:var(--bg);text-align:left;padding:13px;display:flex;align-items:center;gap:10px;line-height:1.3;min-height:62px;color:var(--ink);font-weight:400}
.answer:hover:not(:disabled){background:var(--primaryLight)}.answer:disabled{cursor:default}.answer.wrong{border-color:var(--error);background:var(--accentLight);color:var(--error)}.answer.correct{border:2px solid var(--primary);background:var(--primaryLight);color:var(--primary);font-weight:700}
.answer.dimmed{opacity:.45}.answerIcon{display:grid;place-items:center;min-width:42px;height:38px;padding:0 5px;border-radius:8px;background:var(--primaryLight);color:var(--primary);font-size:11px;font-weight:700}.wrong .answerIcon{background:var(--accentLight);color:var(--error)}
.feedback{margin-top:18px;border-radius:11px;padding:12px 14px;line-height:1.5;font-size:15px;display:none}.feedback.show{display:block}.feedback.good{background:var(--primaryLight);color:var(--primary)}.feedback.bad{background:var(--accentLight);color:var(--error)}
.feedback strong{display:block;margin-bottom:2px}.cardFooter{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:auto;padding-top:18px}.miniTip{font-size:13px;color:var(--muted)}
.nextBtn{background:var(--accent);border-color:var(--accent);color:var(--bg);display:none}.nextBtn.show{display:block}.nextBtn:hover{background:var(--accentLight);color:var(--accent)}
.sequenceArea{margin-top:14px}.sequenceSlots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}.slot{min-height:78px;border:2px dashed var(--line);border-radius:10px;padding:8px;display:flex;align-items:center;gap:7px;font-size:13px;background:var(--bg)}.slot.filled{border-style:solid;border-color:var(--primary);background:var(--primaryLight)}.slotNum{color:var(--accent);font-weight:700;font-size:18px}.sequenceControls{display:flex;gap:8px;flex-wrap:wrap}.sequenceControls button:disabled{opacity:.4;cursor:not-allowed}
.final{text-align:center;display:none;padding:26px 10px;margin:auto}.final.show{display:block}.finalMedal{width:104px;height:104px;border-radius:50%;background:var(--accentLight);color:var(--accent);display:grid;place-items:center;font-size:52px;margin:0 auto 18px;border:2px solid var(--accent)}.final h2{font-size:30px;margin-bottom:10px}.finalScore{font-size:22px;color:var(--accent);font-weight:700;margin:12px 0}.final p{font-size:17px;line-height:1.55;max-width:55ch;margin:0 auto 18px}
.lockedMessage{color:var(--error);font-size:14px;margin:0 0 10px;display:none}.lockedMessage.show{display:block}
footer{margin:20px auto 0;text-align:center;color:var(--muted);font-size:13px;max-width:1180px}footer a{color:var(--muted);font-weight:400;text-decoration:none}footer a:hover{text-decoration:underline}
#fireworks{position:fixed;inset:0;pointer-events:none;z-index:50;display:none}
@media(max-width:760px){.questionGrid{grid-template-columns:1fr;gap:16px}.promptSide{display:grid;grid-template-columns:78px 1fr;gap:8px 14px}.chipArt{width:76px;height:76px;border-radius:17px;font-size:25px;grid-row:span 2}.promptSide .prompt{grid-column:1/-1}.quizCard{min-height:540px}}
@media(max-width:640px){body{padding:12px}h1{font-size:24px}.hdrBtns{width:100%}.hdrBtns button{flex:1}.instruction{font-size:14px}.levels{gap:6px}.levelBtn{padding:10px 7px;gap:5px;font-size:12px;justify-content:center}.levelNum{width:25px;height:25px;flex-basis:25px}.levelBtn small{display:none}.quizCard{padding:16px;min-height:560px}h2{font-size:21px}.prompt{font-size:16px}.answers{grid-template-columns:1fr}.answer{min-height:54px}.hud{font-size:12px}.score{font-size:14px}.cardFooter{align-items:flex-end}.miniTip{max-width:55%}.sequenceSlots{grid-template-columns:1fr 1fr}.slot{min-height:65px}}
@media(prefers-reduced-motion:reduce){button,.progressBar{transition:none}}
</style>

 $("answers").innerHTML="";$("sequenceArea").hidden=q.type!=="sequence";
 q.options.forEach(opt=>{
  const b=document.createElement("button");b.type="button";b.className="answer";b.dataset.id=opt.id;b.innerHTML=`<span class="answerIcon">${opt.icon}</span><span>${opt.name}</span>`;
  if(q.type==="sequence"){
   if(sequence.includes(opt.id)){b.disabled=true;b.classList.add("dimmed");}
   if(answered){b.disabled=true;if(q.answer.includes(opt.id))b.classList.add("correct");}
   b.onclick=()=>{if(answered||sequence.includes(opt.id))return;$("lockedMessage").classList.remove("show");sequence.push(opt.id);renderQuestion();};
  }else{
   if(answered){b.disabled=true;if(opt.id===q.answer)b.classList.add("correct");else b.classList.add("dimmed");}
   b.onclick=()=>answerChoice(opt.id,b);
  }
  $("answers").appendChild(b);
 });
 if(q.type==="sequence")renderSequenceSlots();
 if(answered){$("nextBtn").classList.add("show");$("nextBtn").textContent=qIndex<level.questions.length-1?T().next:(stage<2?T().nextLevel:T().finish);}
 else{$("nextBtn").classList.remove("show");$("feedback").className="feedback";}
}
function answerChoice(id,button){
 if(answered||button.disabled)return;$("lockedMessage").classList.remove("show");const q=currentQ();
 if(id===q.answer){handleCorrect();}
 else{attempts++;button.disabled=true;button.classList.add("wrong");showBad(T().bad);}
}
function award(){
 const key=stage+":"+qIndex;if(credited.has(key))return 0;const pts=attempts===0?10:5;score+=pts;credited.add(key);return pts;
}
function handleCorrect(){
 answered=true;const pts=award();renderQuestion();renderLevels();$("score").textContent=T().score(score);showGood(pts);
}
function showGood(pts=0){
 const q=currentQ(),f=$("feedback");f.className="feedback show good";f.innerHTML=`<strong>${T().good}${pts?` +${pts} pts`:""}</strong>${q.explain}`;
}
function showBad(message){const f=$("feedback");f.className="feedback show bad";f.innerHTML=`<strong>${message}</strong>`;}
function renderSequenceSlots(){
 const q=currentQ();$("sequenceSlots").innerHTML="";
 for(let i=0;i<4;i++){
  const slot=document.createElement("div");slot.className="slot"+(sequence[i]?" filled":"");
  const opt=q.options.find(o=>o.id===sequence[i]);slot.innerHTML=`<span class="slotNum">${i+1}</span><span>${opt?opt.name:T().emptySlot}</span>`;$("sequenceSlots").appendChild(slot);
 }
 $("undoBtn").textContent=T().undo;$("resetSeqBtn").textContent=T().resetSeq;$("validateSeqBtn").textContent=T().validate;
 $("undoBtn").disabled=!sequence.length||answered;$("resetSeqBtn").disabled=!sequence.length||answered;$("validateSeqBtn").disabled=sequence.length!==4||answered;
}
function validateSequence(){
 const q=currentQ();if(sequence.length!==4||answered)return;
 if(sequence.every((id,i)=>id===q.answer[i]))handleCorrect();
 else{attempts++;sequence=[];renderQuestion();showBad(T().badSequence);}
}
$("undoBtn").onclick=()=>{sequence.pop();renderQuestion();};$("resetSeqBtn").onclick=()=>{sequence=[];renderQuestion();};$("validateSeqBtn").onclick=validateSequence;
$("nextBtn").onclick=()=>{
 if(!answered)return;
 if(qIndex<currentLevel().questions.length-1){qIndex++;resetQuestionState();renderAll();return;}
 solved.add(stage);
 if(stage<2){maxUnlocked=Math.max(maxUnlocked,stage+1);stage++;qIndex=0;resetQuestionState();renderAll();}
 else finishGame();
};
function finishGame(){finished=true;renderLevels();$("quizCard").style.display="none";$("finalCard").classList.add("show");$("progressBar").style.width="100%";$("progressText").textContent="3 / 3";renderFinal();fireworks();}
function renderFinal(){$("finalTitle").textContent=T().finalTitle;$("finalScore").textContent=T().finalScore(score);$("finalText").textContent=T().finalText;$("restartBtn").textContent=T().restart;}
function resetGame(){stage=0;qIndex=0;score=0;solved=new Set();credited=new Set();maxUnlocked=0;finished=false;resetQuestionState();renderAll();}
$("restartBtn").onclick=resetGame;
function renderAll(){renderLevels();if(finished){renderFinal();$("score").textContent=T().score(score);}else renderQuestion();}
function applyLang(){
 document.documentElement.lang=lang;document.title=T().tab;document.querySelector('meta[name="description"]').content=T().description;
 $("kicker").textContent=T().kicker;$("title").textContent=T().title;$("langBtn").textContent=lang==="fr"?"English":"Français";
 $("instruction").textContent=T().instruction;$("backLink").textContent=T().backList;syncFsLabel();renderAll();if(answered&&!finished)showGood(0);
}
$("langBtn").onclick=()=>{lang=lang==="fr"?"en":"fr";try{localStorage.setItem("fj-lang",lang);}catch(e){}applyLang();};
function isFs(){return document.fullscreenElement||document.webkitFullscreenElement;}
function syncFsLabel(){$("fsLabel").textContent=isFs()?T().fsExit:T().fs;}
function toggleFs(){
 try{if(isFs()){const fn=document.exitFullscreen||document.webkitExitFullscreen;if(fn){const r=fn.call(document);if(r&&r.catch)r.catch(()=>{});}}
 else{const el=document.documentElement,fn=el.requestFullscreen||el.webkitRequestFullscreen;if(fn){const r=fn.call(el);if(r&&r.catch)r.catch(()=>{});}}}catch(e){}
}
$("fsBtn").onclick=toggleFs;document.addEventListener("fullscreenchange",syncFsLabel);document.addEventListener("webkitfullscreenchange",syncFsLabel);
let fwRunning=false;
function fireworks(){
 if(window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches)return;
 const cv=$("fireworks"),ctx=cv.getContext("2d");cv.width=innerWidth;cv.height=innerHeight;cv.style.display="block";fwRunning=true;
 const COLORS=["#155E4C","#D96A08","#3E8E7E","#F0A04B","#7FB69E","#C84B31"],rockets=[],sparks=[];
 const launch=()=>{rockets.push({x:cv.width*(.15+Math.random()*.7),y:cv.height,vx:(Math.random()-.5)*2,vy:-(10+Math.random()*4),color:COLORS[Math.floor(Math.random()*COLORS.length)]});};
 const explode=r=>{for(let i=0;i<90;i++){const ang=Math.random()*Math.PI*2,sp=2+Math.random()*5;sparks.push({x:r.x,y:r.y,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,life:60+Math.random()*40,color:r.color});}};
 let frame=0;const tick=()=>{ctx.clearRect(0,0,cv.width,cv.height);frame++;if(frame<260&&frame%16===0)launch();
  for(let i=rockets.length-1;i>=0;i--){const r=rockets[i];r.x+=r.vx;r.y+=r.vy;r.vy+=.18;ctx.beginPath();ctx.arc(r.x,r.y,3,0,Math.PI*2);ctx.fillStyle=r.color;ctx.fill();if(r.vy>=-1.5){explode(r);rockets.splice(i,1);}}
  for(let i=sparks.length-1;i>=0;i--){const s=sparks[i];s.x+=s.vx;s.y+=s.vy;s.vy+=.05;s.vx*=.985;s.life--;ctx.globalAlpha=Math.max(0,s.life/80);ctx.beginPath();ctx.arc(s.x,s.y,2.4,0,Math.PI*2);ctx.fillStyle=s.color;ctx.fill();if(s.life<=0)sparks.splice(i,1);}
  ctx.globalAlpha=1;if(frame<600||rockets.length||sparks.length)requestAnimationFrame(tick);else{cv.style.display="none";fwRunning=false;}};tick();
}
applyLang();
</script>
</body>

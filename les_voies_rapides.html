<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Simulateur de neutralité du net : incarnez un fournisseur d'accès, accélérez ou bridez les services et observez qui gagne, qui perd.">
<title>Les voies rapides · Gymnase — Frédéric Jaccard</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2320241F'/%3E%3Ctext x='32' y='43' font-family='Arial,sans-serif' font-size='28' font-weight='bold' fill='%23FFFFFF' text-anchor='middle'%3EFJ%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Quattrocento+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBFAF6; --card:#F7F6F2; --primary:#155E4C; --primaryLight:#E3F0EA;
  --accent:#D96A08; --accentLight:#FDEBD8; --line:#D8D5CB; --ink:#20241F; --muted:#6E726B;
  --error:#C84B31;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:"Quattrocento Sans",sans-serif;padding:20px;max-width:1150px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px;margin-bottom:16px}
.kicker{font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
h1{font-size:26px;color:var(--primary)}
.hdrBtns{display:flex;gap:8px}
button{font-family:inherit;font-size:14px;font-weight:700;padding:8px 16px;border-radius:10px;
  border:2px solid var(--primary);background:var(--card);color:var(--primary);cursor:pointer}
button:hover{background:var(--primaryLight)}
.instruction{background:var(--primaryLight);color:var(--primary);border-radius:12px;padding:12px 16px;margin-bottom:16px;font-size:15px}
.instruction b{color:var(--ink)}
footer{margin-top:20px;text-align:center;font-size:13px;color:var(--muted)}
footer a{color:var(--muted);font-weight:400;text-decoration:none}
footer a:hover{text-decoration:underline}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}

/* Missions */
.missions{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.missionPill{position:relative;flex:1;min-width:180px;text-align:left;padding:10px 14px;border-radius:12px;
  border:2px solid var(--line);background:var(--card);color:var(--ink);font-size:14px;line-height:1.3}
.missionPill .mName{font-weight:700;color:var(--primary)}
.missionPill.current{border-color:var(--primary);background:var(--primaryLight)}
.missionPill.locked{opacity:.35;cursor:not-allowed}
.missionPill.solved::after{content:"★";position:absolute;top:-14px;left:50%;transform:translateX(-50%);
  color:var(--accent);font-size:18px}
.missionPill:hover:not(.locked):not(.current){background:var(--primaryLight)}

/* Disposition principale */
.main{display:grid;grid-template-columns:minmax(320px,420px) 1fr;gap:16px;align-items:start}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.panel h2{font-size:16px;color:var(--primary);margin-bottom:10px}

/* Cartes de service */
.svc{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px;background:var(--bg)}
.svcHead{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.svcName{font-weight:700;font-size:15px}
.svcType{font-size:12.5px;color:var(--muted)}
.svcTrait{font-size:12.5px;color:var(--muted);font-style:italic;margin:2px 0 6px}
.svcDemand{font-size:12.5px;color:var(--primary);font-weight:700;margin-left:auto}
.polBtns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.polBtns button{padding:6px 4px;font-size:13px;border-radius:9px;min-height:44px;border-width:2px}
.polBtns button[data-pol="t"].on{border-color:var(--error);background:var(--accentLight);color:var(--error)}
.polBtns button[data-pol="n"].on{border-color:var(--ink);background:#fff;color:var(--ink)}
.polBtns button[data-pol="f"].on{border-color:var(--primary);background:var(--primary);color:#fff}
.polBtns button:disabled{opacity:.35;cursor:not-allowed}
.feeNote{font-size:12px;margin-top:5px;color:var(--accent);font-weight:700;min-height:15px}
.feeNote.cant{color:var(--muted);font-weight:400;font-style:italic}

#simBtn{width:100%;margin-top:4px;min-height:48px;font-size:15px;background:var(--accent);border-color:var(--accent);color:#fff}
#simBtn:hover{background:var(--accent);filter:brightness(1.08)}
#fastLockNote{font-size:12.5px;color:var(--muted);font-style:italic;margin-top:8px}

/* Visualisation */
#pipeLabel{font-size:13.5px;font-weight:700;color:var(--ink);margin-bottom:6px}
#lanes{width:100%;height:250px;display:block;border:1px solid var(--line);border-radius:12px;background:#fff}

/* Jauges */
.gauges{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-top:12px}
.gauge .gLabel{font-size:12.5px;font-weight:700;color:var(--ink);min-height:32px}
.gauge .gBar{height:12px;border-radius:6px;background:var(--line);overflow:hidden;margin:5px 0 3px}
.gauge .gFill{height:100%;border-radius:6px;width:0;transition:width .6s ease}
.gauge .gVal{font-size:12.5px;color:var(--muted)}

/* Objectifs */
#objectives{margin-top:10px;font-size:13.5px;display:none}
#objectives .obj{display:flex;gap:6px;align-items:center;padding:2px 0}
.obj .ok{color:var(--primary);font-weight:700}
.obj .ko{color:var(--error);font-weight:700}

/* Observations */
#observations{margin-top:10px;font-size:13.5px}
#observations ul{list-style:none}
#observations li{padding:3px 0 3px 4px;border-bottom:1px dashed var(--line)}
#observations li:last-child{border-bottom:none}

/* Verdict */
#verdict{margin-top:12px;border-radius:12px;padding:12px 14px;font-size:14.5px;display:none}
#verdict.win{display:block;background:var(--primaryLight);border:2px solid var(--primary);color:var(--primary)}
#verdict.fail{display:block;background:var(--accentLight);border:2px solid var(--error);color:var(--error)}
#nextBtn{margin-top:10px;background:var(--accent);border-color:var(--accent);color:#fff;display:none;min-height:44px}
#nextBtn:hover{background:var(--accent);filter:brightness(1.08)}

/* Débat final */
#debrief{margin-top:16px;display:none}
#debrief.show{display:block}
#debrief h2{margin-bottom:6px}
.debCols{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:8px}
.debCol{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--bg)}
.debCol h3{font-size:14px;margin-bottom:6px}
.debCol.pro h3{color:var(--primary)}
.debCol.isp h3{color:var(--accent)}
.debCol ul{padding-left:18px;font-size:13.5px}
.debCol li{margin-bottom:5px}
#debRecap{margin-top:12px;background:var(--primaryLight);border-radius:12px;padding:10px 14px;font-size:14px;color:var(--primary)}

#fireworks{position:fixed;inset:0;pointer-events:none;z-index:50;display:none}

@media(max-width:900px){
  .main{grid-template-columns:1fr}
}
@media(max-width:640px){
  body{padding:14px}
  h1{font-size:22px}
  .hdrBtns{width:100%}
  button{min-height:44px}
  .gauges{grid-template-columns:1fr}
  .debCols{grid-template-columns:1fr}
  .svcDemand{margin-left:0;width:100%}
  #lanes{height:230px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;
    transition-duration:.01ms!important;scroll-behavior:auto!important}
}
</style>

let lang = (function () {
  try {
    const c = document.cookie.match(/(?:^|;\s*)fj-lang=([a-z]{2})/);
    if (c && (c[1] === "fr" || c[1] === "en")) return c[1];
  } catch (e) {}
  try {
    const s = localStorage.getItem("fj-lang");
    return (s === "fr" || s === "en") ? s : "fr";
  } catch (e) { return "fr"; }
})();
const T = () => I18N[lang];

/* Nombres : virgule décimale + espace fine insécable (fr), point + virgule (en) */
function fmtNum(n) {
  n = Math.round(n);
  const s = String(n);
  const grp = s.replace(/\B(?=(\d{3})+(?!\d))/g, lang === "fr" ? "\u202F" : ",");
  return grp;
}

/* ---------- Modèle de simulation (vérifié par force brute) ---------- */
const CAP = 1000;
const SERV = ["stream", "visio", "petit", "cloud"];
const DEM  = { stream: 600, visio: 250, petit: 150, cloud: 300 };
const WPOL = { t: 0.5, n: 1, f: 2 };
const FEES = { stream: 400, visio: 150, petit: 0, cloud: 100 };
const TOTDEM = SERV.reduce((a, s) => a + DEM[s], 0); // 1300

function allocate(pol) {
  const eff = {}, rem = {}, alloc = {};
  SERV.forEach(s => { eff[s] = WPOL[pol[s]] * DEM[s]; rem[s] = DEM[s]; alloc[s] = 0; });
  let C = CAP;
  let active = SERV.slice();
  while (active.length && C > 1e-9) {
    const tot = active.reduce((a, s) => a + eff[s], 0);
    if (tot <= 0) break;
    const stuck = [];
    active.forEach(s => {
      if (C * eff[s] / tot >= rem[s] - 1e-9) {
        C -= rem[s]; alloc[s] += rem[s]; rem[s] = 0; stuck.push(s);
      }
    });
    if (!stuck.length) {
      active.forEach(s => { const a = C * eff[s] / tot; alloc[s] += a; rem[s] -= a; });
      C = 0;
    } else {
      active = active.filter(s => !stuck.includes(s));
    }
  }
  return alloc;
}
const clamp01 = x => Math.max(0, Math.min(1, x));
function simulate(pol) {
  const al = allocate(pol);
  const perc = {}, sc = {};
  SERV.forEach(s => perc[s] = al[s] / DEM[s]);
  sc.stream = 100 * clamp01((perc.stream - 0.40) / 0.45);
  sc.visio  = 100 * clamp01((perc.visio  - 0.60) / 0.35);
  sc.petit  = 100 * clamp01((perc.petit  - 0.30) / 0.40);
  sc.cloud  = 100 * clamp01((perc.cloud  - 0.05) / 0.30);
  const sat = 0.35 * sc.stream + 0.35 * sc.visio + 0.15 * sc.petit + 0.15 * sc.cloud;
  const fees = SERV.reduce((a, s) => a + (pol[s] === "f" ? FEES[s] : 0), 0);
  const rev = 900 * (0.5 + 0.5 * sat / 100) + fees;
  return { perc, sc, sat, rev, fees, vit: sc.petit };
}

/* Seuils des missions : [sat, rev, vit] (null = pas de seuil) */

  { sat: 85, rev: null, vit: null, fastAllowed: false },

/* ---------- État ---------- */

const solved = [false, false, false];
const policy = { stream: "n", visio: "n", petit: "n", cloud: "n" };
let simCount = 0;
let lastRes = simulate(policy);

/* ---------- Rendu ---------- */
function fmtPct(v) { return fmtNum(v) + (lang === "fr" ? " %" : "%"); }

function statusOf(score) { return score >= 75 ? 0 : score >= 40 ? 1 : 2; }
function colorOf(score) {
  return score >= 75 ? "#155E4C" : score >= 40 ? "#D96A08" : "#C84B31";
}

function renderMissions() {
  const el = $("missions");
  el.innerHTML = "";
  T().missions.forEach((m, i) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "missionPill" + (i === mission ? " current" : "")
      + (solved[i] ? " solved" : "")
      + (i > maxUnlocked() ? " locked" : "");
    b.innerHTML = `<span class="mName">${T().missionWord} ${i + 1} — ${m.name}</span>`;
    b.onclick = () => {
      if (i > maxUnlocked()) { flashLock(b); return; }
      mission = i; simCount = 0; applyLang();
    };
    el.appendChild(b);
  });
}
function maxUnlocked() {
  let u = 0;
  solved.forEach((s, i) => { if (s) u = Math.max(u, i + 1); });
  return Math.min(u, MISSIONS.length - 1);
}
function flashLock(btn) {
  const old = btn.innerHTML;
  btn.innerHTML = `<span style="color:var(--error);font-weight:700">${T().lockedMsg}</span>`;
  setTimeout(() => { btn.innerHTML = old; }, 1600);
}

function renderServices() {
  const el = $("services");
  el.innerHTML = "";
  const fastOk = MISSIONS[mission].fastAllowed;
  SERV.forEach(s => {
    const info = T().services[s];
    const card = document.createElement("div");
    card.className = "svc";
    card.innerHTML = `
      <div class="svcHead">
        <span class="svcName">${info.name}</span>
        <span class="svcType">${info.type}</span>
        <span class="svcDemand">${T().demand}${fmtNum(DEM[s])}${T().demandUnit}</span>
      </div>
      <div class="svcTrait">${info.trait}</div>
      <div class="polBtns">
        ${["t", "n", "f"].map(p =>
          `<button type="button" data-pol="${p}" data-svc="${s}"
             class="${policy[s] === p ? "on" : ""}"
             ${p === "f" && !fastOk ? "disabled" : ""}>${T().pols[p]}</button>`).join("")}
      </div>
      <div class="feeNote ${FEES[s] === 0 ? "cant" : ""}">
        ${policy[s] === "f" ? "" : (FEES[s] > 0 ? T().feeNote(fmtNum(FEES[s])) : T().feeNone)}
      </div>`;
    card.querySelectorAll("button[data-pol]").forEach(b => {
      b.onclick = () => {
        policy[s] = b.dataset.pol;
        lastRes = simulate(policy);
        renderServices();
        drawStatic();
      };
    });
    el.appendChild(card);
  });
  $("fastLockNote").textContent = fastOk ? "" : T().fastLockNote;
}

function renderGauges(res) {
  const g = T().gauges;
  const defs = [
    { label: g.sat, val: res.sat, txt: fmtPct(res.sat), pct: res.sat, col: colorOf(res.sat) },
    { label: g.rev, val: res.rev, txt: fmtNum(res.rev) + T().revUnit,
      pct: Math.min(100, res.rev / 1500 * 100), col: "#155E4C" },
    { label: g.vit, val: res.vit, txt: fmtPct(res.vit), pct: res.vit, col: colorOf(res.vit) }
  ];
  const el = $("gauges");
  el.innerHTML = "";
  defs.forEach(d => {
    const div = document.createElement("div");
    div.className = "gauge";
    div.innerHTML = `<div class="gLabel">${d.label}</div>
      <div class="gBar"><div class="gFill" style="width:${d.pct.toFixed(1)}%;background:${d.col}"></div></div>
      <div class="gVal">${d.txt}</div>`;
    el.appendChild(div);
  });
}

function renderObjectives(res) {
  const m = MISSIONS[mission];
  const items = [];
  if (m.sat !== null) items.push({ ok: res.sat >= m.sat, txt: T().objSat(fmtNum(res.sat), m.sat) });
  if (m.rev !== null) items.push({ ok: res.rev >= m.rev, txt: T().objRev(fmtNum(res.rev), fmtNum(m.rev)) });
  if (m.vit !== null) items.push({ ok: res.vit >= m.vit, txt: T().objVit(fmtNum(res.vit), m.vit) });
  const el = $("objectives");
  el.style.display = "block";
  el.innerHTML = items.map(i =>
    `<div class="obj"><span class="${i.ok ? "ok" : "ko"}">${i.ok ? "✓" : "✗"}</span> ${i.txt}</div>`).join("");
  return items.every(i => i.ok);
}

function renderObservations(res) {
  const el = $("observations");
  const lis = SERV.map(s => T().obs[s][statusOf(res.sc[s])]);
  lis.push(res.fees > 0 ? T().feeObs(fmtNum(res.fees)) : T().feeObsNone);
  el.innerHTML = "<ul>" + lis.map(t => `<li>${t}</li>`).join("") + "</ul>";
}

function renderVerdict(win) {
  const v = $("verdict");
  v.className = win ? "win" : "fail";
  v.textContent = win ? T().winMsgs[mission] : T().failHints[mission];
  const nb = $("nextBtn");
  if (win && mission < MISSIONS.length - 1) {
    nb.style.display = "inline-block";
    nb.textContent = T().nextMission;
  } else {
    nb.style.display = "none";
  }
}

function renderDebrief() {
  const d = T();
  $("debTitle").textContent = d.debTitle;
  $("debProT").textContent = d.debProT;
  $("debIspT").textContent = d.debIspT;
  $("debProL").innerHTML = d.debProL.map(x => `<li>${x}</li>`).join("");
  $("debIspL").innerHTML = d.debIspL.map(x => `<li>${x}</li>`).join("");
  $("debRecap").textContent = d.debRecap;
}

/* ---------- Canvas : les voies ---------- */
const cv = $("lanes");
const ctx = cv.getContext("2d");
const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
let packets = [];

function sizeCanvas() {
  const w = cv.clientWidth, h = cv.clientHeight;
  if (cv.width !== Math.round(w) || cv.height !== Math.round(h)) {
    cv.width = Math.round(w); cv.height = Math.round(h);
  }
}
function laneGeom() {
  const w = cv.width, h = cv.height;
  const labelW = 118, rightPad = 46;
  const top = 18, bottom = h - 10;
  const laneH = (bottom - top) / 4;
  return { w, h, labelW, rightPad, top, laneH, x0: labelW + 6, x1: w - rightPad };
}
function resetPackets() {
  packets = [];
  const g = laneGeom();
  SERV.forEach((s, i) => {
    const n = Math.max(2, Math.round(DEM[s] / 80));
    for (let k = 0; k < n; k++) {
      packets.push({ svc: s, lane: i, x: g.x0 + Math.random() * (g.x1 - g.x0) });
    }
  });
}
function drawLanes(advance) {
  sizeCanvas();
  const g = laneGeom();
  const res = lastRes;
  ctx.clearRect(0, 0, g.w, g.h);
  ctx.font = "12px 'Quattrocento Sans', sans-serif";
  ctx.textBaseline = "middle";
  SERV.forEach((s, i) => {
    const y = g.top + g.laneH * (i + 0.5);
    const score = res.sc[s], col = colorOf(score);
    // étiquette
    ctx.fillStyle = "#20241F";
    ctx.font = "700 12px 'Quattrocento Sans', sans-serif";
    ctx.fillText(T().services[s].name, 6, y - 8);
    ctx.fillStyle = "#6E726B";
    ctx.font = "11px 'Quattrocento Sans', sans-serif";
    ctx.fillText(fmtNum(DEM[s]) + " Mb/s", 6, y + 9);
    // piste
    ctx.strokeStyle = "#D8D5CB";
    ctx.lineWidth = 7;
    ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(g.x0, y); ctx.lineTo(g.x1, y); ctx.stroke();
    // pourcentage servi
    ctx.fillStyle = col;
    ctx.font = "700 12px 'Quattrocento Sans', sans-serif";
    ctx.textAlign = "left";
    ctx.fillText(fmtPct(res.perc[s] * 100), g.x1 + 6, y);
  });
  // paquets
  packets.forEach(p => {
    const g2 = laneGeom();
    const y = g2.top + g2.laneH * (p.lane + 0.5);
    const score = res.sc[p.svc];
    if (advance) {
      const sp = 0.35 + 2.4 * (score / 100);
      p.x += sp;
      if (p.x > g2.x1 + 8) p.x = g2.x0 - 8;
    }
    ctx.fillStyle = colorOf(score);
    ctx.beginPath();
    ctx.arc(Math.min(Math.max(p.x, g2.x0), g2.x1), y, 4, 0, Math.PI * 2);
    ctx.fill();
  });
}
function drawStatic() {
  resetPackets();
  drawLanes(false);
  if (reducedMotion) return;
  // une courte animation de transition
}
let animOn = true;
function loop() {
  if (!reducedMotion && animOn) drawLanes(true);
  requestAnimationFrame(loop);
}
window.addEventListener("resize", () => { sizeCanvas(); drawStatic(); });

/* ---------- Simulation (clic) ---------- */
$("simBtn").onclick = () => {
  lastRes = simulate(policy);
  simCount++;
  renderGauges(lastRes);
  renderObservations(lastRes);
  const win = renderObjectives(lastRes);
  renderVerdict(win);
  drawStatic();
  if (win && !solved[mission]) {
    solved[mission] = true;
    renderMissions();
    if (mission === MISSIONS.length - 1) {
      $("debrief").classList.add("show");
      renderDebrief();
      fireworks();
      $("debrief").scrollIntoView({ behavior: reducedMotion ? "auto" : "smooth", block: "start" });
    }
  } else if (win) {
    renderMissions();
  }
};
$("nextBtn").onclick = () => {
  if (mission < MISSIONS.length - 1) {
    mission++;
    simCount = 0;
    applyLang();
    window.scrollTo({ top: 0, behavior: reducedMotion ? "auto" : "smooth" });
  }
};

/* ---------- Feux d'artifice ---------- */
let fwRunning = false;
function fireworks() {
  if (reducedMotion || fwRunning) return;
  const cvf = $("fireworks"), c = cvf.getContext("2d");
  cvf.width = innerWidth; cvf.height = innerHeight;
  cvf.style.display = "block";
  fwRunning = true;
  const COLORS = ["#155E4C", "#D96A08", "#C84B31"];
  const rockets = [], sparks = [];
  const launch = () => {
    rockets.push({
      x: cvf.width * (0.15 + Math.random() * 0.7), y: cvf.height,
      vx: (Math.random() - 0.5) * 2, vy: -(10 + Math.random() * 4),
      color: COLORS[Math.floor(Math.random() * COLORS.length)]
    });
  };
  const explode = r => {
    for (let i = 0; i < 90; i++) {
      const ang = Math.random() * Math.PI * 2, sp = 2 + Math.random() * 5;
      sparks.push({ x: r.x, y: r.y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp,
                    life: 60 + Math.random() * 40, color: r.color });
    }
  };
  let frame = 0;
  const tick = () => {
    c.clearRect(0, 0, cvf.width, cvf.height);
    frame++;
    if (frame < 260 && frame % 16 === 0) launch();
    for (let i = rockets.length - 1; i >= 0; i--) {
      const r = rockets[i];
      r.x += r.vx; r.y += r.vy; r.vy += 0.18;
      c.beginPath(); c.arc(r.x, r.y, 3, 0, Math.PI * 2);
      c.fillStyle = r.color; c.fill();
      if (r.vy >= -1.5) { explode(r); rockets.splice(i, 1); }
    }
    for (let i = sparks.length - 1; i >= 0; i--) {
      const s = sparks[i];
      s.x += s.vx; s.y += s.vy; s.vy += 0.05; s.vx *= 0.985; s.life--;
      c.globalAlpha = Math.max(0, s.life / 80);
      c.beginPath(); c.arc(s.x, s.y, 2.4, 0, Math.PI * 2);
      c.fillStyle = s.color; c.fill();
      if (s.life <= 0) sparks.splice(i, 1);
    }
    c.globalAlpha = 1;
    if (frame < 600 || rockets.length || sparks.length) requestAnimationFrame(tick);
    else { cvf.style.display = "none"; fwRunning = false; }
  };
  tick();
}

/* ---------- Langue / plein écran ---------- */
function applyLang() {
  document.documentElement.lang = lang;
  $("kicker").textContent = T().kicker;
  $("title").textContent = T().title;
  const m = T().missions[mission];
  $("instruction").innerHTML = m.story + " <b>" + m.obj + "</b>";
  $("langBtn").textContent = lang === "fr" ? "English" : "Français";
  $("fsLabel").textContent = isFs() ? T().fsExit : T().fs;
  $("backLink").textContent = T().backList;
  document.title = T().title + " · Gymnase — Frédéric Jaccard";
  $("controlsTitle").textContent = T().controlsTitle;
  $("simBtn").textContent = T().simulate;
  $("pipeLabel").textContent = T().pipeLabel(fmtNum(CAP), fmtNum(TOTDEM));
  renderMissions();
  renderServices();
  if (simCount > 0) {
    renderGauges(lastRes);
    renderObservations(lastRes);
    const win = (function () {
      const mm = MISSIONS[mission];
      return (mm.sat === null || lastRes.sat >= mm.sat)
        && (mm.rev === null || lastRes.rev >= mm.rev)
        && (mm.vit === null || lastRes.vit >= mm.vit);
    })();
    renderObjectives(lastRes);
    renderVerdict(win);
  } else {
    renderGauges(lastRes);
    $("observations").innerHTML = "";
    $("objectives").style.display = "none";
    $("verdict").className = "";
    $("nextBtn").style.display = "none";
  }
  if ($("debrief").classList.contains("show")) renderDebrief();
  drawStatic();
}
$("langBtn").onclick = () => {
  lang = lang === "fr" ? "en" : "fr";
  try {
    localStorage.setItem("fj-lang", lang);
    document.cookie = "fj-lang=" + lang + ";domain=.fredericjaccard.com;path=/;max-age=31536000;SameSite=Lax";
  } catch (e) {}
  applyLang();
};
function isFs() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }
$("fsBtn").onclick = () => {
  const el = document.documentElement;
  if (isFs()) {
    (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  } else {
    const req = el.requestFullscreen || el.webkitRequestFullscreen;
    if (req) { const r = req.call(el); if (r && r.catch) r.catch(() => {}); }
  }
};
function syncFsLabel() { $("fsLabel").textContent = isFs() ? T().fsExit : T().fs; }
document.addEventListener("fullscreenchange", syncFsLabel);
document.addEventListener("webkitfullscreenchange", syncFsLabel);

applyLang();
loop();
</script>
</body>
</html>

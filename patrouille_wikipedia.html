<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Patrouillez les modifications récentes de Wikipédia : vandalisme, ajout sourcé, copié-collé, conflit d'intérêts — saurez-vous décider ?">
<title>Patrouille Wikipédia · Gymnase — Frédéric Jaccard</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2320241F'/%3E%3Ctext x='32' y='43' font-family='Arial,sans-serif' font-size='28' font-weight='bold' fill='%23FFFFFF' text-anchor='middle'%3EFJ%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Quattrocento+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBFAF6; --card:#F7F6F2; --primary:#155E4C; --primaryLight:#E3F0EA;
  --accent:#D96A08; --accentLight:#FDEBD8; --line:#D8D5CB; --ink:#20241F; --muted:#6E726B;
  --error:#C84B31;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:"Quattrocento Sans",sans-serif;padding:20px;max-width:940px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px;margin-bottom:16px}
.kicker{font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
h1{font-size:26px;color:var(--primary)}
.hdrBtns{display:flex;gap:8px}
button{font-family:inherit;font-size:15px;font-weight:700;padding:10px 18px;border-radius:10px;
  border:2px solid var(--primary);background:var(--card);color:var(--primary);cursor:pointer;min-height:44px}
button:hover{background:var(--primaryLight)}
button:disabled{opacity:.45;cursor:default}
button:disabled:hover{background:var(--card)}
button.primary{background:var(--primary);color:#fff}
button.primary:hover{background:#0F4739}
button.accent{background:var(--accent);border-color:var(--accent);color:#fff}
button.accent:hover{background:#B55A06}
.instruction{background:var(--primaryLight);color:var(--primary);border-radius:12px;padding:12px 16px;margin-bottom:16px;font-size:15px}

/* Barre de progression */
.progressRow{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.progressLabel{font-size:14px;font-weight:700;color:var(--muted)}
.progressBar{flex:1;min-width:120px;height:10px;background:var(--card);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.progressFill{height:100%;background:var(--accent);width:0;transition:width .3s ease}
.scoreBox{font-size:14px;font-weight:700;color:var(--primary);background:var(--primaryLight);border-radius:8px;padding:6px 12px;white-space:nowrap}

/* Carte de la modification */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
.articleTitle{font-size:19px;font-weight:700;color:var(--primary);margin-bottom:4px}
.metaRow{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 14px;align-items:center}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--muted)}
.badge.ip{background:var(--accentLight);border-color:var(--accent);color:var(--accent)}
.badge.reg{background:var(--primaryLight);border-color:var(--primary);color:var(--primary)}
.summary{font-size:14px;color:var(--ink);background:var(--bg);border-left:3px solid var(--line);padding:6px 12px;border-radius:0 8px 8px 0;width:100%}
.summary.empty{color:var(--muted);font-style:italic}
.diffLabel{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}
.diff{background:var(--bg);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:12px}
.diff table{width:100%;border-collapse:collapse;font-family:"Courier New",monospace;font-size:13.5px}
.diff td{padding:6px 10px;vertical-align:top;border-bottom:1px solid var(--line);white-space:pre-wrap;word-break:break-word}
.diff tr:last-child td{border-bottom:none}
td.sig{width:26px;text-align:center;font-weight:700}
tr.del td{background:var(--accentLight);color:var(--error)}
tr.add td{background:var(--primaryLight);color:var(--primary)}
tr.del td.sig::before{content:"−";color:var(--error)}
tr.add td.sig::before{content:"+";color:var(--primary)}
.diffHeader{background:var(--card);border-bottom:1px solid var(--line);padding:6px 10px;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.context{background:var(--bg);border:1px dashed var(--accent);border-radius:10px;padding:10px 14px;margin-bottom:12px;font-size:14px}
.context .ctxTitle{font-weight:700;color:var(--accent);margin-bottom:2px}
.legend{font-size:12.5px;color:var(--muted);margin-top:2px}
.legend .lg{display:inline-flex;align-items:center;gap:5px;margin-right:16px}
.legend .sw{width:12px;height:12px;border-radius:3px;display:inline-block}

/* Décision */
.decision{display:flex;gap:12px;margin:6px 0 16px;flex-wrap:wrap}
.decision button{flex:1;min-width:180px;font-size:16px;padding:14px 18px}
.btnKeep::before{content:"✔ ";font-weight:400}
.btnRevert::before{content:"✖ ";font-weight:400}
.btnKeep.chosen{outline:4px solid var(--primary);outline-offset:2px}
.btnRevert.chosen{outline:4px solid var(--error);outline-offset:2px}

/* Feedback */
.feedback{border-radius:12px;padding:14px 18px;margin-bottom:16px;display:none}
.feedback.show{display:block}
.feedback.good{background:var(--primaryLight);border:2px solid var(--primary)}
.feedback.bad{background:var(--accentLight);border:2px solid var(--error)}
.fbHead{font-size:17px;font-weight:700;margin-bottom:6px}
.feedback.good .fbHead{color:var(--primary)}
.feedback.bad .fbHead{color:var(--error)}
.tagRow{margin:6px 0}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--bg);border:1px solid var(--muted);color:var(--muted);margin-right:6px}
.fbText{font-size:14.5px;line-height:1.45}
.fbNav{margin-top:12px;text-align:right}

/* Bilan final */
.final{display:none}
.final.show{display:block}
.finalCard{background:var(--primaryLight);border:2px solid var(--primary);border-radius:14px;padding:22px;text-align:center;margin-bottom:16px}
.finalScore{font-size:44px;font-weight:700;color:var(--primary);line-height:1.1}
.badgeFinal{display:inline-block;font-size:16px;font-weight:700;color:#fff;background:var(--accent);border-radius:999px;padding:8px 22px;margin:10px 0}
.finalMsg{font-size:15px;color:var(--ink)}
.recap{border-collapse:collapse;width:100%;margin-bottom:16px;font-size:14px}
.recap th{background:var(--card);color:var(--muted);text-align:left;padding:8px 10px;border-bottom:2px solid var(--line);font-size:12.5px;text-transform:uppercase;letter-spacing:.06em}
.recap td{padding:8px 10px;border-bottom:1px solid var(--line)}
.recap td.ok{color:var(--primary);font-weight:700;white-space:nowrap}
.recap td.ko{color:var(--error);font-weight:700;white-space:nowrap}
.rulesBox{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:16px}
.rulesBox h2{font-size:17px;color:var(--primary);margin-bottom:8px}
.rulesBox ul{margin-left:20px;font-size:14.5px;line-height:1.5}
.center{text-align:center}

footer{margin-top:20px;text-align:center;font-size:13px;color:var(--muted)}
footer a{color:var(--muted);font-weight:400;text-decoration:none}
footer a:hover{text-decoration:underline}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
#fireworks{position:fixed;inset:0;pointer-events:none;z-index:50;display:none}
@media(max-width:640px){
  body{padding:14px}
  h1{font-size:22px}
  .hdrBtns{width:100%;justify-content:flex-end}
  .decision button{min-width:100%;flex-basis:100%}
  .diff table{font-size:12.5px}
  .recap th:nth-child(2),.recap td:nth-child(2){display:none}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header>
  <div>
    <div class="kicker" id="kicker"></div>
    <h1 id="title"></h1>
  </div>
  <div class="hdrBtns">
    <button id="langBtn" type="button">English</button>
    <button id="fsBtn" type="button"><span id="fsLabel"></span></button>
  </div>
</header>
<div class="instruction" id="instruction"></div>

<div id="game">
  <div class="progressRow">
    <div class="progressLabel" id="progressLabel"></div>
    <div class="progressBar"><div class="progressFill" id="progressFill"></div></div>
    <div class="scoreBox" id="scoreBox"></div>
  </div>

  <div class="card">
    <div class="articleTitle" id="articleTitle"></div>
    <div class="metaRow" id="metaRow"></div>
    <div class="diff">
      <div class="diffHeader" id="diffHeader"></div>
      <table><tbody id="diffBody"></tbody></table>
    </div>
    <div class="legend" id="legend"></div>
  </div>

  <div class="decision">
    <button id="btnKeep" type="button" class="primary btnKeep"></button>
    <button id="btnRevert" type="button" class="btnRevert"></button>
  </div>

  <div class="feedback" id="feedback">
    <div class="fbHead" id="fbHead"></div>
    <div class="tagRow" id="tagRow"></div>
    <div class="fbText" id="fbText"></div>
    <div class="fbNav"><button id="nextBtn" type="button" class="accent"></button></div>
  </div>
</div>

<div class="final" id="final">
  <div class="finalCard">
    <div class="finalScore" id="finalScore"></div>
    <div class="badgeFinal" id="badgeFinal"></div>
    <div class="finalMsg" id="finalMsg"></div>
  </div>
  <div class="rulesBox">
    <h2 id="rulesTitle"></h2>
    <ul id="rulesList"></ul>
  </div>
  <table class="recap"><thead><tr><th id="rc1"></th><th id="rc2"></th><th id="rc3"></th><th id="rc4"></th></tr></thead><tbody id="recapBody"></tbody></table>
  <div class="center"><button id="restartBtn" type="button"></button></div>
</div>

<canvas id="fireworks"></canvas>
<footer><a href="index.html" id="backLink"></a> · <a href="https://fredericjaccard.com">Frédéric Jaccard</a></footer>
<script>

  },
  en: {
    kicker: "SOCIAL ISSUES",
    title: "Wikipedia patrol",
    instruction: "You have joined the recent-changes patrol: edits keep arriving on articles and you must decide, for each one, whether to keep or revert it. Study the diff, the edit summary and the author's profile — the decision is final, just like for a real patroller!",
    fs: "Fullscreen", fsExit: "Exit",
    backList: "← All applications",
    modification: "Edit",
    legendAdd: "line added", legendDel: "line removed",
    badgeIp: "anonymous", badgeReg: "registered account",
    summaryEmpty: "No edit summary",
    ctxTitle: "Context",
    diffHeader: "Comparison with the previous version",
    keep: "Keep", revert: "Revert",
    next: "Next edit", seeResults: "See the debrief",
    good: "Good call!",
    badKeep: "You kept it… but it should have been reverted.",
    badRevert: "You reverted it… but it should have been kept.",
    rulesTitle: "What the patrol taught you",
    rules: [
      "Vandalism: obvious destruction or nonsense → revert, no debate.",
      "Verifiability: every claim must be checkable against a source; unsourced claims do not stay.",
      "Biographies of living people: any negative unsourced claim is removed immediately.",
      "Copyright: never copy-paste from a protected site — Wikipedia only hosts original or freely licensed text.",
      "Conflict of interest: a neutral point of view is impossible when you are paid by the article's subject.",
      "Good faith: behind a silly edit there is often a newcomer; revert politely and explain."
    ],
    rcArticle: "Article", rcCase: "Case", rcDecision: "Right call?", rcTag: "Rule",
    finalScore: (s, n) => s + " / " + n,
    badge: (s, n) => s === n ? "Guardian of Wikipedia" : (s >= 6 ? "Confirmed patroller" : (s >= 4 ? "Patroller in training" : "Rookie patroller")),
    finalMsg: (s, n) => s === n ? "Perfect patrol: no doubtful edit slipped past you!" : (s >= 6 ? "Great patrolling! Just one or two tricky cases left to master." : (s >= 4 ? "Fair enough, but re-read the rules below before your next round." : "Patrolling is a craft: re-read the rules and try another round.")),
    restart: "Patrol again",
    kept: "kept", reverted: "reverted",
    youChose: "You chose:",
    tagNames: { vandal: "Vandalism", sourced: "Sourced addition", copyvio: "Copyright", coi: "Conflict of interest", goodfaith: "Good faith", blp: "Living people" }
  }
};

let lang = (function () {
  try {
    var c = document.cookie.match(/(?:^|;\s*)fj-lang=([a-z]{2})/);
    if (c && (c[1] === "fr" || c[1] === "en")) return c[1];
  } catch (e) {}
  try {
    var s = localStorage.getItem("fj-lang");
    if (s === "fr" || s === "en") return s;
  } catch (e) {}
  return "fr";
})();
const T = () => I18N[lang];

/* État du jeu */
let idx = 0, score = 0, answered = false, lastChoice = null, results = [];

function esc(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function renderCase() {
  const d = CASES[idx][lang];
  const t = T();
  $("diffHeader").textContent = t.diffHeader;
  $("articleTitle").textContent = d.article;
  const meta = $("metaRow");
  meta.innerHTML = "";
  const ub = document.createElement("span");
  ub.className = "badge " + (d.ip ? "ip" : "reg");
  ub.textContent = "👤 " + d.user + " · " + (d.ip ? t.badgeIp : t.badgeReg);
  meta.appendChild(ub);
  const sm = document.createElement("div");
  sm.className = "summary" + (d.summary ? "" : " empty");
  sm.textContent = d.summary ? "✎ " + d.summary : t.summaryEmpty;
  meta.appendChild(sm);
  /* Contexte éventuel */
  const oldCtx = $("ctxBox");
  if (oldCtx) oldCtx.remove();
  if (d.context) {
    const cx = document.createElement("div");
    cx.className = "context"; cx.id = "ctxBox";
    cx.innerHTML = '<div class="ctxTitle">🔎 ' + esc(t.ctxTitle) + '</div>' + esc(d.context);
    $("articleTitle").parentNode.insertBefore(cx, $("legend"));
  }
  /* Diff */
  const tbl = $("diffBody");
  tbl.innerHTML = "";
  d.removed.forEach(line => {
    const tr = document.createElement("tr");
    tr.className = "del";
    tr.innerHTML = '<td class="sig"></td><td>' + esc(line) + '</td>';
    tbl.appendChild(tr);
  });
  d.added.forEach(line => {
    const tr = document.createElement("tr");
    tr.className = "add";
    tr.innerHTML = '<td class="sig"></td><td>' + esc(line) + '</td>';
    tbl.appendChild(tr);
  });
  /* Légende */
  $("legend").innerHTML =
    '<span class="lg"><span class="sw" style="background:var(--primaryLight);border:1px solid var(--primary)"></span>' + esc(t.legendAdd) + '</span>' +
    '<span class="lg"><span class="sw" style="background:var(--accentLight);border:1px solid var(--error)"></span>' + esc(t.legendDel) + '</span>';
  /* Progression */
  $("progressLabel").textContent = t.modification + " " + (idx + 1) + " / " + CASES.length;
  $("progressFill").style.width = (idx / CASES.length * 100) + "%";
  $("scoreBox").textContent = "★ " + score + " / " + CASES.length;
  /* Boutons */
  answered = false;
  $("btnKeep").disabled = false;
  $("btnRevert").disabled = false;
  $("btnKeep").classList.remove("chosen");
  $("btnRevert").classList.remove("chosen");
  $("feedback").className = "feedback";
}

function decide(choice) {
  if (answered) return;
  answered = true;
  const d = CASES[idx][lang];
  const t = T();
  const ok = choice === CASES[idx].verdict;
  lastChoice = choice;
  if (ok) score++;
  results.push(ok);
  $("btnKeep").disabled = true;
  $("btnRevert").disabled = true;
  (choice === "keep" ? $("btnKeep") : $("btnRevert")).classList.add("chosen");
  $("scoreBox").textContent = "★ " + score + " / " + CASES.length;
  $("progressFill").style.width = ((idx + 1) / CASES.length * 100) + "%";
  /* Feedback */
  const fb = $("feedback");
  fb.className = "feedback show " + (ok ? "good" : "bad");
  $("fbHead").textContent = ok ? t.good : (choice === "keep" ? t.badKeep : t.badRevert);
  $("tagRow").innerHTML = '<span class="tag">🏷 ' + esc(t.tagNames[CASES[idx].tag]) + '</span>' +
    '<span class="tag" style="border-style:dashed">' + esc(t.youChose) + ' ' + esc(choice === "keep" ? t.kept : t.reverted) + '</span>';
  $("fbText").textContent = d.why;
  $("nextBtn").textContent = idx < CASES.length - 1 ? t.next : t.seeResults;
  fb.scrollIntoView({ behavior: "smooth", block: "nearest" });
}

function next() {
  if (idx < CASES.length - 1) {
    idx++;
    renderCase();
    window.scrollTo({ top: 0, behavior: "smooth" });
  } else {
    renderFinal();
  }
}

function renderFinal() {
  const t = T();
  $("game").style.display = "none";
  const f = $("final");
  f.className = "final show";
  $("finalScore").textContent = t.finalScore(score, CASES.length);
  $("badgeFinal").textContent = "🛡 " + t.badge(score, CASES.length);
  $("finalMsg").textContent = t.finalMsg(score, CASES.length);
  $("rulesTitle").textContent = t.rulesTitle;
  const ul = $("rulesList");
  ul.innerHTML = "";
  t.rules.forEach(r => {
    const li = document.createElement("li");
    li.textContent = r;
    ul.appendChild(li);
  });
  $("rc1").textContent = t.rcCase;
  $("rc2").textContent = t.rcArticle;
  $("rc3").textContent = t.rcDecision;
  $("rc4").textContent = t.rcTag;
  const body = $("recapBody");
  body.innerHTML = "";
  CASES.forEach((c, i) => {
    const tr = document.createElement("tr");
    const tdN = document.createElement("td");
    tdN.textContent = i + 1;
    const tdA = document.createElement("td");
    tdA.textContent = c[lang].article;
    const tdR = document.createElement("td");
    tdR.className = results[i] ? "ok" : "ko";
    tdR.textContent = results[i] ? "✔" : "✘";
    const tdT = document.createElement("td");
    tdT.textContent = t.tagNames[c.tag];
    tr.appendChild(tdN); tr.appendChild(tdA); tr.appendChild(tdR); tr.appendChild(tdT);
    body.appendChild(tr);
  });
  $("restartBtn").textContent = t.restart;
  if (score >= 6) fireworks();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function restart() {
  idx = 0; score = 0; results = [];
  $("final").className = "final";
  $("game").style.display = "block";
  renderCase();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

/* Feux d'artifice de fin */
let fwRunning = false;
function fireworks() {
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv = $("fireworks"), ctx = cv.getContext("2d");
  cv.width = innerWidth; cv.height = innerHeight;
  cv.style.display = "block";
  fwRunning = true;
  const COLORS = ["#155E4C", "#D96A08", "#C84B31"];
  const rockets = [], sparks = [];
  const launch = () => {
    rockets.push({
      x: cv.width * (0.15 + Math.random() * 0.7), y: cv.height,
      vx: (Math.random() - 0.5) * 2, vy: -(10 + Math.random() * 4),
      color: COLORS[Math.floor(Math.random() * COLORS.length)]
    });
  };
  const explode = r => {
    for (let i = 0; i < 90; i++) {
      const ang = Math.random() * Math.PI * 2, sp = 2 + Math.random() * 5;
      sparks.push({ x: r.x, y: r.y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp,
                    life: 60 + Math.random() * 40, color: r.color });
    }
  };
  let frame = 0;
  const tick = () => {
    ctx.clearRect(0, 0, cv.width, cv.height);
    frame++;
    if (frame < 260 && frame % 16 === 0) launch();
    for (let i = rockets.length - 1; i >= 0; i--) {
      const r = rockets[i];
      r.x += r.vx; r.y += r.vy; r.vy += 0.18;
      ctx.beginPath(); ctx.arc(r.x, r.y, 3, 0, Math.PI * 2);
      ctx.fillStyle = r.color; ctx.fill();
      if (r.vy >= -1.5) { explode(r); rockets.splice(i, 1); }
    }
    for (let i = sparks.length - 1; i >= 0; i--) {
      const s = sparks[i];
      s.x += s.vx; s.y += s.vy; s.vy += 0.05; s.vx *= 0.985; s.life--;
      ctx.globalAlpha = Math.max(0, s.life / 80);
      ctx.beginPath(); ctx.arc(s.x, s.y, 2.4, 0, Math.PI * 2);
      ctx.fillStyle = s.color; ctx.fill();
      if (s.life <= 0) sparks.splice(i, 1);
    }
    ctx.globalAlpha = 1;
    if (frame < 600 || rockets.length || sparks.length) requestAnimationFrame(tick);
    else { cv.style.display = "none"; fwRunning = false; }
  };
  tick();
}

/* Langue */
function applyLang() {
  document.documentElement.lang = lang;
  const t = T();
  $("kicker").textContent = t.kicker;
  $("title").textContent = t.title;
  $("instruction").textContent = t.instruction;
  $("langBtn").textContent = lang === "fr" ? "English" : "Français";
  $("fsLabel").textContent = isFs() ? t.fsExit : t.fs;
  $("backLink").textContent = t.backList;
  document.title = t.title + " · Gymnase — Frédéric Jaccard";
  $("btnKeep").textContent = t.keep;
  $("btnRevert").textContent = t.revert;
  if ($("game").style.display !== "none") {
    if (answered) {
      /* re-rendu du cas courant sans perdre l'état "répondu" */
      renderCase();
      answered = true;
      $("btnKeep").disabled = true;
      $("btnRevert").disabled = true;
      const fb = $("feedback");
      fb.className = "feedback show " + (results[idx] ? "good" : "bad");
      const t2 = T();
      $("fbHead").textContent = results[idx] ? t2.good : (lastChoice === "keep" ? t2.badKeep : t2.badRevert);
      $("tagRow").innerHTML = '<span class="tag">🏷 ' + esc(t2.tagNames[CASES[idx].tag]) + '</span>';
      $("fbText").textContent = CASES[idx][lang].why;
      $("nextBtn").textContent = idx < CASES.length - 1 ? t2.next : t2.seeResults;
    } else {
      renderCase();
    }
  } else {
    renderFinal();
  }
}
$("langBtn").onclick = () => {
  lang = lang === "fr" ? "en" : "fr";
  try {
    localStorage.setItem("fj-lang", lang);
    document.cookie = "fj-lang=" + lang + ";domain=.fredericjaccard.com;path=/;max-age=31536000;SameSite=Lax";
  } catch (e) {}
  applyLang();
};

/* Plein écran Safari */
function isFs() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }
$("fsBtn").onclick = () => {
  const el = document.documentElement;
  if (isFs()) {
    (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  } else {
    const req = el.requestFullscreen || el.webkitRequestFullscreen;
    if (req) { const r = req.call(el); if (r && r.catch) r.catch(() => {}); }
  }
};
function syncFsLabel() { $("fsLabel").textContent = isFs() ? T().fsExit : T().fs; }
document.addEventListener("fullscreenchange", syncFsLabel);
document.addEventListener("webkitfullscreenchange", syncFsLabel);

$("btnKeep").onclick = () => decide("keep");
$("btnRevert").onclick = () => decide("revert");
$("nextBtn").onclick = next;
$("restartBtn").onclick = restart;

applyLang();
renderCase();
</script>
</body>
</html>

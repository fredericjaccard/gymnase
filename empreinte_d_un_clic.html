<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Calculez l'empreinte carbone de vos usages numériques (streaming, cloud, smartphone), comparez-la à des repères concrets, puis testez vos idées reçues dans un quiz vrai/faux.">
<title>L'empreinte d'un clic · Gymnase — Frédéric Jaccard</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2320241F'/%3E%3Ctext x='32' y='43' font-family='Arial,sans-serif' font-size='28' font-weight='bold' fill='%23FFFFFF' text-anchor='middle'%3EFJ%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Quattrocento+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBFAF6; --card:#F7F6F2; --primary:#155E4C; --primaryLight:#E3F0EA;
  --accent:#D96A08; --accentLight:#FDEBD8; --line:#D8D5CB; --ink:#20241F; --muted:#6E726B;
  --error:#C84B31;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:"Quattrocento Sans",sans-serif;padding:20px;max-width:980px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px;margin-bottom:16px}
.kicker{font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
h1{font-size:26px;color:var(--primary)}
.hdrBtns{display:flex;gap:8px}
button{font-family:inherit;font-size:14px;font-weight:700;padding:8px 16px;border-radius:10px;
  border:2px solid var(--primary);background:var(--card);color:var(--primary);cursor:pointer}
button:hover{background:var(--primaryLight)}
.instruction{background:var(--primaryLight);border-radius:12px;padding:12px 16px;margin-bottom:16px;font-size:15px;color:var(--primary)}
footer{margin-top:20px;text-align:center;color:var(--muted);font-size:13px}
footer a{color:var(--muted);font-weight:400;text-decoration:none}
footer a:hover{text-decoration:underline}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}

h2{font-size:20px;color:var(--primary);margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:18px}

/* --- calculateur --- */
.sliderRow{display:grid;grid-template-columns:170px 1fr 96px;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.sliderRow:last-of-type{border-bottom:none}
.sliderRow label{font-weight:700;font-size:15px}
.sliderRow .unit{font-size:13px;color:var(--muted);font-weight:400;display:block}
input[type=range]{width:100%;accent-color:var(--primary);height:28px;cursor:pointer}
.valChip{background:var(--primaryLight);color:var(--primary);border-radius:8px;text-align:center;
  font-weight:700;padding:6px 4px;font-size:14px;min-height:32px}

.totalBox{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;
  background:var(--primaryLight);border-radius:12px;padding:14px 16px;margin-top:14px}
.totalBig{font-size:30px;font-weight:700;color:var(--primary)}
.totalBig small{font-size:15px;font-weight:700}
.totalLbl{font-size:13px;color:var(--primary)}

.barWrap{margin-top:14px}
.bar{display:flex;height:22px;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.bar div{height:100%}
.segS{background:var(--primary)}
.segC{background:var(--accent)}
.segP{background:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:8px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:12px;height:12px;border-radius:4px;display:inline-block}

.compare{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.cmp{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center}
.cmp .n{font-size:24px;font-weight:700;color:var(--accent)}
.cmp .t{font-size:14px;margin-top:4px}
.note{font-size:12.5px;color:var(--muted);margin-top:12px}

/* --- quiz --- */
.qProgress{font-size:13px;color:var(--muted);margin-bottom:8px;font-weight:700}
.qStmt{background:var(--card);border:2px solid var(--primary);border-radius:12px;padding:16px;
  font-size:17px;font-weight:700;margin-bottom:12px}
.qBtns{display:flex;gap:12px;flex-wrap:wrap}
.qBtns button{flex:1;min-width:130px;min-height:44px;font-size:15px}
.feedback{border-radius:12px;padding:12px 14px;margin-top:12px;font-size:15px;display:none}
.feedback.ok{display:block;background:var(--primaryLight);border:2px solid var(--primary);color:var(--ink)}
.feedback.ko{display:block;background:var(--accentLight);border:2px solid var(--error);color:var(--ink)}
.feedback .verdict{font-weight:700;display:block;margin-bottom:4px}
.feedback.ok .verdict{color:var(--primary)}
.feedback.ko .verdict{color:var(--error)}
#nextBtn{margin-top:12px;background:var(--accent);border-color:var(--accent);color:#fff;display:none;min-height:44px}
#nextBtn:hover{background:var(--accent)}
.qEnd{text-align:center}
.qEnd .score{font-size:34px;font-weight:700;color:var(--primary);margin:8px 0}
.qEnd p{margin-bottom:14px}
#restartBtn{background:var(--accent);border-color:var(--accent);color:#fff;min-height:44px}
#restartBtn:hover{background:var(--accent)}

#fireworks{position:fixed;inset:0;pointer-events:none;z-index:50;display:none}

@media(max-width:640px){
  body{padding:14px}
  h1{font-size:22px}
  .hdrBtns{width:100%}
  button{min-height:44px}
  .sliderRow{grid-template-columns:1fr 80px;gap:6px 10px}
  .sliderRow input[type=range]{grid-column:1/-1;height:44px}
  .compare{grid-template-columns:1fr}
  .totalBig{font-size:24px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>
<header>
  <div>
    <div class="kicker" id="kicker"></div>
    <h1 id="title"></h1>
  </div>
  <div class="hdrBtns">
    <button id="langBtn" type="button">English</button>
    <button id="fsBtn" type="button"><span id="fsLabel"></span></button>
  </div>
</header>
<div class="instruction" id="instruction"></div>

<section class="card" aria-labelledby="calcH">
  <h2 id="calcH"></h2>

  <div class="sliderRow">
    <label for="rStream"><span id="lblStream"></span><span class="unit" id="unitStream"></span></label>
    <input type="range" id="rStream" min="0" max="8" step="0.5" value="2">
    <div class="valChip" id="vStream"></div>
  </div>

  <div class="sliderRow">
    <label for="rCloud"><span id="lblCloud"></span><span class="unit" id="unitCloud"></span></label>
    <input type="range" id="rCloud" min="0" max="2000" step="50" value="500">
    <div class="valChip" id="vCloud"></div>
  </div>

  <div class="sliderRow">
    <label for="rPhone"><span id="lblPhone"></span><span class="unit" id="unitPhone"></span></label>
    <input type="range" id="rPhone" min="1" max="6" step="1" value="3">
    <div class="valChip" id="vPhone"></div>
  </div>

  <div class="totalBox">
    <div>
      <div class="totalBig"><span id="totalKg"></span>&nbsp;<small id="totalUnit"></small></div>
      <div class="totalLbl" id="totalLbl"></div>
    </div>
  </div>

  <div class="barWrap">
    <div class="bar" id="bar">
      <div class="segS" id="segS"></div>
      <div class="segC" id="segC"></div>
      <div class="segP" id="segP"></div>
    </div>
    <div class="legend">
      <span><i class="dot segS"></i><span id="legS"></span></span>
      <span><i class="dot segC"></i><span id="legC"></span></span>
      <span><i class="dot segP"></i><span id="legP"></span></span>
    </div>
  </div>

  <div class="compare">
    <div class="cmp"><div class="n" id="cmpCar"></div><div class="t" id="cmpCarT"></div></div>
    <div class="cmp"><div class="n" id="cmpShower"></div><div class="t" id="cmpShowerT"></div></div>
  </div>

  <p class="note" id="noteCalc"></p>
</section>

<section class="card" aria-labelledby="quizH">
  <h2 id="quizH"></h2>
  <div id="quizZone">
    <div class="qProgress" id="qProgress"></div>
    <div class="qStmt" id="qStmt"></div>
    <div class="qBtns">
      <button type="button" id="btnTrue"></button>
      <button type="button" id="btnFalse"></button>
    </div>
    <div class="feedback" id="feedback"><span class="verdict" id="verdict"></span><span id="why"></span></div>
    <button type="button" id="nextBtn"></button>
  </div>
  <div class="qEnd" id="quizEnd" style="display:none">
    <div class="score" id="score"></div>
    <p id="scoreMsg"></p>
    <button type="button" id="restartBtn"></button>
  </div>
</section>

<canvas id="fireworks"></canvas>
<footer><a href="enjeux_sociaux.html" id="backLink"></a> · <a href="https://fredericjaccard.com">Frédéric Jaccard</a></footer>

<script>
const $ = id => document.getElementById(id);

/* Facteurs d'émission (ordres de grandeur) */
const STREAM_KG_PER_H   = 0.05;  /* 50 g CO2e / heure de streaming vidéo */
const CLOUD_KG_PER_GO   = 0.06;  /* 6 kg CO2e / an pour 100 Go stockés */
const PHONE_KG          = 60;    /* 60 kg CO2e pour fabriquer un smartphone */
const CAR_KG_PER_KM     = 0.12;  /* 120 g CO2e / km (voiture moyenne) */
const SHOWER_KG         = 2;     /* 2 kg CO2e / douche de 5 min */

const I18N = {
  fr: {
    kicker: "ENJEUX SOCIAUX",
    title: "L'empreinte d'un clic",
    instruction: "Réglez les trois curseurs selon vos usages, observez votre empreinte annuelle et ses équivalences, puis défilez vers le quiz pour tester vos idées reçues.",
    fs: "Plein écran", fsExit: "Quitter",
    backList: "← Toutes les applications",
    calcH: "1 · Calculez votre empreinte",
    lblStream: "Streaming vidéo", unitStream: "heures par jour",
    lblCloud: "Stockage cloud", unitCloud: "Go stockés en ligne",
    lblPhone: "Smartphone neuf", unitPhone: "tous les… ans",
    hPerDay: v => v + " h/j",
    goStored: v => v + " Go",
    everyYears: v => v === 1 ? "chaque année" : "tous les " + v + " ans",
    totalUnit: "kg CO₂e / an",
    totalLbl: "votre empreinte numérique annuelle estimée",
    legS: v => "Streaming : " + v + " kg",
    legC: v => "Cloud : " + v + " kg",
    legP: v => "Smartphone : " + v + " kg",
    cmpCarT: "km parcourus en voiture",
    cmpShowerT: "douches de 5 minutes",
    noteCalc: "Ordres de grandeur indicatifs, d'après les estimations de l'ADEME, de l'IEA et du Carbon Trust : 50 g CO₂e par heure de streaming, 6 kg CO₂e par an pour 100 Go en ligne, 60 kg CO₂e pour fabriquer un smartphone, 120 g CO₂e par km en voiture, 2 kg CO₂e par douche.",
    quizH: "2 · Quiz : idées reçues",
    qProgress: (i, n) => "Question " + i + " / " + n,
    btnTrue: "Vrai", btnFalse: "Faux",
    correct: "Exact !", wrong: "Pas tout à fait…",
    wasTrue: "C'était vrai.", wasFalse: "C'était faux.",
    nextBtn: "Question suivante",
    finishBtn: "Voir mon score",
    score: (s, n) => s + " / " + n,
    scorePerfect: "Sans faute ! Vous voyez clair dans l'empreinte du numérique.",
    scoreGood: "Bien joué ! Quelques idées reçues ont la vie dure.",
    scoreLow: "Les idées reçues sont tenaces : refaites un tour du calculateur et réessayez !",
    restart: "Recommencer le quiz",
    quiz: [
      { q: "Le numérique émet plus de gaz à effet de serre que l'aviation civile mondiale.", a: true,
        why: "Le numérique représente environ 3 à 4 % des émissions mondiales, contre environ 2,5 % pour l'aviation civile." },
      { q: "Supprimer régulièrement ses e-mails est le geste le plus efficace pour réduire son empreinte numérique.", a: false,
        why: "L'effet est minuscule. Garder ses appareils plus longtemps et modérer la vidéo comptent infiniment plus." },
      { q: "La fabrication compte pour l'essentiel de l'empreinte carbone d'un smartphone.", a: true,
        why: "Environ 80 % de l'empreinte d'un smartphone vient de sa fabrication, pas de son utilisation." },
      { q: "Une heure de streaming vidéo émet autant de CO₂ que 100 km en voiture.", a: false,
        why: "Une heure de streaming ≈ 50 g de CO₂e, contre environ 12 kg pour 100 km en voiture : plus de 200 fois moins." },
      { q: "Pour la même vidéo, le Wi-Fi consomme généralement moins d'énergie que le réseau 4G.", a: true,
        why: "Transporter des données par le réseau mobile demande plus d'énergie aux antennes que par une box Wi-Fi." },
      { q: "Recycler son smartphone suffit à compenser son impact environnemental.", a: false,
        why: "Le recyclage ne récupère qu'une fraction des matériaux. L'essentiel de l'impact a déjà eu lieu à la fabrication : allonger la durée de vie est bien plus efficace." },
      { q: "La vidéo (streaming, réseaux sociaux) représente la plus grande part du trafic internet mondial.", a: true,
        why: "La vidéo pèse environ 60 à 80 % du trafic mondial : c'est le premier poste de données." },
      { q: "Grâce à son efficacité, la 5G fera baisser l'empreinte globale du numérique.", a: false,
        why: "Chaque gigaoctet coûte moins d'énergie, mais les usages explosent en volume : c'est l'effet rebond, déjà observé avec la 3G et la 4G." }
    ]
  },
  en: {
    kicker: "SOCIAL ISSUES",
    title: "The footprint of a click",
    instruction: "Set the three sliders to match your habits, watch your yearly footprint and its equivalents, then scroll down to the quiz to challenge your assumptions.",
    fs: "Fullscreen", fsExit: "Exit",
    backList: "← All applications",
    calcH: "1 · Work out your footprint",
    lblStream: "Video streaming", unitStream: "hours per day",
    lblCloud: "Cloud storage", unitCloud: "GB stored online",
    lblPhone: "New smartphone", unitPhone: "every… years",
    hPerDay: v => v + " h/day",
    goStored: v => v + " GB",
    everyYears: v => v === 1 ? "every year" : "every " + v + " years",
    totalUnit: "kg CO₂e / year",
    totalLbl: "your estimated yearly digital footprint",
    legS: v => "Streaming: " + v + " kg",
    legC: v => "Cloud: " + v + " kg",
    legP: v => "Smartphone: " + v + " kg",
    cmpCarT: "km driven by car",
    cmpShowerT: "5-minute showers",
    noteCalc: "Indicative orders of magnitude, based on ADEME, IEA and Carbon Trust estimates: 50 g CO₂e per hour of streaming, 6 kg CO₂e per year for 100 GB online, 60 kg CO₂e to manufacture a smartphone, 120 g CO₂e per km by car, 2 kg CO₂e per shower.",
    quizH: "2 · Quiz: common misconceptions",
    qProgress: (i, n) => "Question " + i + " / " + n,
    btnTrue: "True", btnFalse: "False",
    correct: "Correct!", wrong: "Not quite…",
    wasTrue: "It was true.", wasFalse: "It was false.",
    nextBtn: "Next question",
    finishBtn: "See my score",
    score: (s, n) => s + " / " + n,
    scorePerfect: "A perfect score! You see clearly through the footprint of digital technology.",
    scoreGood: "Well done! A few misconceptions are hard to shake off.",
    scoreLow: "Misconceptions are stubborn: take another look at the calculator and try again!",
    restart: "Restart the quiz",
    quiz: [
      { q: "Digital technology emits more greenhouse gases than global civil aviation.", a: true,
        why: "Digital technology accounts for about 3–4% of global emissions, versus roughly 2.5% for civil aviation." },
      { q: "Regularly deleting your e-mails is the most effective way to cut your digital footprint.", a: false,
        why: "The effect is tiny. Keeping your devices longer and moderating video use matter far more." },
      { q: "Manufacturing accounts for most of a smartphone's carbon footprint.", a: true,
        why: "About 80% of a smartphone's footprint comes from manufacturing, not from using it." },
      { q: "One hour of video streaming emits as much CO₂ as driving 100 km.", a: false,
        why: "One hour of streaming ≈ 50 g of CO₂e, versus about 12 kg for 100 km by car: over 200 times less." },
      { q: "For the same video, Wi-Fi generally uses less energy than the 4G mobile network.", a: true,
        why: "Carrying data over the mobile network requires more energy from antennas than from a Wi-Fi router." },
      { q: "Recycling your smartphone is enough to offset its environmental impact.", a: false,
        why: "Recycling only recovers a fraction of the materials. Most of the impact already happened during manufacturing: extending the device's life is far more effective." },
      { q: "Video (streaming, social media) makes up the largest share of global internet traffic.", a: true,
        why: "Video accounts for roughly 60–80% of global traffic: it is the biggest data category." },
      { q: "Thanks to its efficiency, 5G will reduce the overall footprint of digital technology.", a: false,
        why: "Each gigabyte costs less energy, but usage grows even faster in volume: this is the rebound effect, already seen with 3G and 4G." }
    ]
  }
};

let lang = (function () {
  try { const c = document.cookie.match(/(?:^|;\s*)fj-lang=([a-z]{2})/); if (c && (c[1] === "fr" || c[1] === "en")) return c[1]; } catch (e) {}
  try { const s = localStorage.getItem("fj-lang"); if (s === "fr" || s === "en") return s; } catch (e) {}
  return "fr";
})();
const T = () => I18N[lang];

const fmt = (n, dec) => new Intl.NumberFormat(lang === "fr" ? "fr-FR" : "en-US",
  { minimumFractionDigits: dec || 0, maximumFractionDigits: dec || 0 }).format(n);

/* ---------- calculateur ---------- */
function calcParts() {
  const h = parseFloat($("rStream").value);
  const go = parseInt($("rCloud").value, 10);
  const yrs = parseInt($("rPhone").value, 10);
  const s = h * 365 * STREAM_KG_PER_H;
  const c = go * CLOUD_KG_PER_GO;
  const p = PHONE_KG / yrs;
  return { s, c, p, total: s + c + p };
}

function renderCalc() {
  const r = calcParts();
  $("vStream").textContent = T().hPerDay(fmt(parseFloat($("rStream").value), 1));
  $("vCloud").textContent = T().goStored(fmt(parseInt($("rCloud").value, 10)));
  $("vPhone").textContent = T().everyYears(parseInt($("rPhone").value, 10));

  $("totalKg").textContent = fmt(Math.round(r.total));
  $("totalUnit").textContent = T().totalUnit;
  $("totalLbl").textContent = T().totalLbl;

  const pct = x => (r.total > 0 ? (x / r.total * 100) : 0) + "%";
  $("segS").style.width = pct(r.s);
  $("segC").style.width = pct(r.c);
  $("segP").style.width = pct(r.p);
  $("legS").textContent = T().legS(fmt(Math.round(r.s)));
  $("legC").textContent = T().legC(fmt(Math.round(r.c)));
  $("legP").textContent = T().legP(fmt(Math.round(r.p)));

  $("cmpCar").textContent = fmt(Math.round(r.total / CAR_KG_PER_KM));
  $("cmpCarT").textContent = T().cmpCarT;
  $("cmpShower").textContent = fmt(Math.round(r.total / SHOWER_KG));
  $("cmpShowerT").textContent = T().cmpShowerT;
}

["rStream", "rCloud", "rPhone"].forEach(id => { $(id).addEventListener("input", renderCalc); });

/* ---------- quiz ---------- */
let qIndex = 0, qScore = 0, qAnswered = false;

function renderQuiz() {
  const quiz = T().quiz;
  $("quizZone").style.display = "";
  $("quizEnd").style.display = "none";
  if (qIndex >= quiz.length) {
    $("quizZone").style.display = "none";
    $("quizEnd").style.display = "";
    $("score").textContent = T().score(qScore, quiz.length);
    $("scoreMsg").textContent =
      qScore === quiz.length ? T().scorePerfect :
      qScore >= Math.ceil(quiz.length / 2) ? T().scoreGood : T().scoreLow;
    $("restartBtn").textContent = T().restart;
    if (qScore === quiz.length) fireworks();
    return;
  }
  $("qProgress").textContent = T().qProgress(qIndex + 1, quiz.length);
  $("qStmt").textContent = quiz[qIndex].q;
  $("btnTrue").textContent = T().btnTrue;
  $("btnFalse").textContent = T().btnFalse;
  $("btnTrue").disabled = $("btnFalse").disabled = false;
  $("feedback").className = "feedback";
  const isLast = qIndex === quiz.length - 1;
  $("nextBtn").textContent = isLast ? T().finishBtn : T().nextBtn;
  $("nextBtn").style.display = "none";
  qAnswered = false;
}

function answer(choice) {
  if (qAnswered) return;
  qAnswered = true;
  const item = T().quiz[qIndex];
  const ok = choice === item.a;
  if (ok) qScore++;
  $("btnTrue").disabled = $("btnFalse").disabled = true;
  $("verdict").textContent = (ok ? T().correct : T().wrong) + " " + (item.a ? T().wasTrue : T().wasFalse);
  $("why").textContent = item.why;
  $("feedback").className = "feedback " + (ok ? "ok" : "ko");
  $("nextBtn").style.display = "block";
}
$("btnTrue").onclick = () => answer(true);
$("btnFalse").onclick = () => answer(false);
$("nextBtn").onclick = () => { qIndex++; renderQuiz(); };
$("restartBtn").onclick = () => { qIndex = 0; qScore = 0; renderQuiz(); };

/* ---------- feux d'artifice ---------- */
let fwRunning = false;
function fireworks() {
  if (fwRunning) return;
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv = $("fireworks"), ctx = cv.getContext("2d");
  cv.width = innerWidth; cv.height = innerHeight;
  cv.style.display = "block";
  fwRunning = true;
  const COLORS = ["#155E4C", "#D96A08", "#C84B31"];
  const rockets = [], sparks = [];
  const launch = () => {
    rockets.push({
      x: cv.width * (0.15 + Math.random() * 0.7), y: cv.height,
      vx: (Math.random() - 0.5) * 2, vy: -(10 + Math.random() * 4),
      color: COLORS[Math.floor(Math.random() * COLORS.length)]
    });
  };
  const explode = r => {
    for (let i = 0; i < 90; i++) {
      const ang = Math.random() * Math.PI * 2, sp = 2 + Math.random() * 5;
      sparks.push({ x: r.x, y: r.y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp,
                    life: 60 + Math.random() * 40, color: r.color });
    }
  };
  let frame = 0;
  const tick = () => {
    ctx.clearRect(0, 0, cv.width, cv.height);
    frame++;
    if (frame < 260 && frame % 16 === 0) launch();
    for (let i = rockets.length - 1; i >= 0; i--) {
      const r = rockets[i];
      r.x += r.vx; r.y += r.vy; r.vy += 0.18;
      ctx.beginPath(); ctx.arc(r.x, r.y, 3, 0, Math.PI * 2);
      ctx.fillStyle = r.color; ctx.fill();
      if (r.vy >= -1.5) { explode(r); rockets.splice(i, 1); }
    }
    for (let i = sparks.length - 1; i >= 0; i--) {
      const s = sparks[i];
      s.x += s.vx; s.y += s.vy; s.vy += 0.05; s.vx *= 0.985; s.life--;
      ctx.globalAlpha = Math.max(0, s.life / 80);
      ctx.beginPath(); ctx.arc(s.x, s.y, 2.4, 0, Math.PI * 2);
      ctx.fillStyle = s.color; ctx.fill();
      if (s.life <= 0) sparks.splice(i, 1);
    }
    ctx.globalAlpha = 1;
    if (frame < 600 || rockets.length || sparks.length) requestAnimationFrame(tick);
    else { cv.style.display = "none"; fwRunning = false; }
  };
  tick();
}

/* ---------- langue ---------- */
function applyLang() {
  document.documentElement.lang = lang;
  $("kicker").textContent = T().kicker;
  $("title").textContent = T().title;
  $("instruction").textContent = T().instruction;
  $("langBtn").textContent = lang === "fr" ? "English" : "Français";
  $("fsLabel").textContent = isFs() ? T().fsExit : T().fs;
  $("backLink").textContent = T().backList;
  document.title = T().title + " · Gymnase — Frédéric Jaccard";
  $("calcH").textContent = T().calcH;
  $("lblStream").textContent = T().lblStream;
  $("unitStream").textContent = T().unitStream;
  $("lblCloud").textContent = T().lblCloud;
  $("unitCloud").textContent = T().unitCloud;
  $("lblPhone").textContent = T().lblPhone;
  $("unitPhone").textContent = T().unitPhone;
  $("noteCalc").textContent = T().noteCalc;
  $("quizH").textContent = T().quizH;
  renderCalc();
  renderQuiz();
}
$("langBtn").onclick = () => {
  lang = lang === "fr" ? "en" : "fr";
  try {
    localStorage.setItem("fj-lang", lang);
    document.cookie = "fj-lang=" + lang + ";domain=.fredericjaccard.com;path=/;max-age=31536000;SameSite=Lax";
  } catch (e) {}
  applyLang();
};

/* ---------- plein écran (Safari inclus) ---------- */
function isFs() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }
$("fsBtn").onclick = () => {
  const el = document.documentElement;
  if (isFs()) {
    (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  } else {
    const req = el.requestFullscreen || el.webkitRequestFullscreen;
    if (req) { const r = req.call(el); if (r && r.catch) r.catch(() => {}); }
  }
};
function syncFsLabel() { $("fsLabel").textContent = isFs() ? T().fsExit : T().fs; }
document.addEventListener("fullscreenchange", syncFsLabel);
document.addEventListener("webkitfullscreenchange", syncFsLabel);

applyLang();
</script>

<!DOCTYPE html><html lang="fr"><head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Architecture des ordinateurs — Applications d'informatique</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2320241F'/%3E%3Ctext x='32' y='43' font-family='Arial,sans-serif' font-size='28' font-weight='bold' fill='%23FFFFFF' text-anchor='middle'%3EFJ%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quattrocento+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBFAF6; --card:#F7F6F2; --primary:#155E4C; --primaryLight:#E3F0EA;
  --accent:#D96A08; --accentLight:#FDEBD8; --line:#D8D5CB; --ink:#20241F; --muted:#6E726B;
}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);margin:0;padding:32px 16px;min-height:100vh;
  font-family:'Quattrocento Sans','Segoe UI',system-ui,sans-serif;color:var(--ink)}
button{font:inherit;cursor:pointer}
.app{max-width:860px;margin:0 auto}
.topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.kicker{color:var(--accent);font-weight:700;letter-spacing:.14em;font-size:12px;text-transform:uppercase;margin-bottom:4px}
h1{font-size:24px;font-weight:700}
.btns{display:flex;gap:8px;flex-shrink:0;padding-top:2px}
.iconBtn{min-width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card);
  color:var(--primary);font-weight:700;font-size:13px;display:inline-flex;align-items:center;justify-content:center;padding:0 10px}
.iconBtn:hover{border-color:var(--primary)}
.sub{font-size:15px;color:var(--muted);margin:6px 0 24px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.cardApp{display:block;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);
  border-radius:14px;padding:20px;transition:border-color .15s,transform .15s}
.cardApp:hover{border-color:var(--primary);transform:translateY(-2px)}
.cardApp .em{font-size:34px;line-height:1;margin-bottom:12px}
.cardApp h2{font-size:17px;font-weight:700;margin-bottom:6px}
.cardApp p{font-size:13.5px;line-height:1.5;color:var(--muted)}
.cardApp .count{display:inline-block;margin-top:10px;font-size:12px;font-weight:700;color:var(--primary);
  background:var(--primaryLight);border-radius:8px;padding:3px 9px}
footer{margin-top:32px;text-align:center;font-size:13px;color:var(--muted)}
footer a{color:inherit;text-decoration:none}
footer a:hover{text-decoration:underline}
@media(max-width:640px){
  body{padding:20px 12px}
  h1{font-size:19px}
  .grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="app">
<div class="topbar">
  <div>
    <div class="kicker" id="kicker">INFORMATIQUE · GYMNASE</div>
    <h1 id="title"></h1>
  </div>
  <div class="btns">
    <button class="iconBtn" id="langBtn" title="English">EN</button>
    <button class="iconBtn" id="fsBtn" title="Plein écran">⛶</button>
  </div>
</div>
<div class="sub" id="sub"></div>
<div id="content"></div>
<footer><a href="index.html" id="backCats"></a> · <a href="https://fredericjaccard.com">Frédéric Jaccard</a></footer>
</div>

<script>
let lang=(function(){try{var c=document.cookie.match(/(?:^|;\s*)fj-lang=([a-z]{2})/);if(c&&(c[1]==="fr"||c[1]==="en"))return c[1];}catch(e){}try{var s=localStorage.getItem("fj-lang");return(s==="fr"||s==="en")?s:"fr";}catch(e){return"fr";}})();
const I18N={
 fr:{
  kicker:"INFORMATIQUE · GYMNASE",
  title:"Architecture des ordinateurs",
  sub:"Composants, trajets des données, transistors et portes logiques : explorez l'intérieur de la machine.",
  backCats:"← Toutes les catégories",
  apps:[
   {file:"inside_the_machine.html",em:"🖥️",title:"Dans l'ordinateur",
    desc:"Explorez les composants d'un ordinateur — CPU, RAM, disque, périphériques — et testez vos connaissances en mode quiz."},
   {file:"architecture_ordinateur.html",em:"🔍",title:"Dans l'ordinateur en 3D",
    desc:"Explorez une tour d'ordinateur en 3D, cliquez sur les composants et suivez le trajet d'une donnée, de l'entrée à la sortie."},
   {file:"voyage_donnee.html",em:"⌨️",title:"Le voyage d'une donnée",
    desc:"Suivez le signal d'une touche pressée à travers le clavier, le CPU, la RAM et la carte graphique jusqu'à l'écran."},
   {file:"le_bon_composant.html",em:"🧩",title:"Le bon composant",
    desc:"Quiz progressif en trois niveaux : identifiez les composants, comprenez leur rôle et reconstituez le trajet d'une donnée."},
   {file:"le_pc_monte_par_un_eleve.html",em:"🛠️",title:"Le PC monté par un élève",
    desc:"Explorez le PC assemblé par un élève : identifiez les composants sur les photos, découvrez l'organisation des câbles et reliez chaque élément à son rôle."},
   {file:"questions_architecture.html",em:"❓",title:"Questions pour aller plus loin",
    desc:"Questions d'architecture des ordinateurs : mémoires, processeur, voyages des données, programmes. Choisissez une question pour afficher sa réponse."},
   {file:"transistor_porte.html",em:"🔌",title:"Du transistor à la porte",
    desc:"Ouvrez et fermez des transistors pour comprendre comment on construit les portes NON, ET et OU."},
   {file:"portes_logiques.html",em:"🚪",title:"Portes logiques",
    desc:"Testez les quatre portes à l'aide d'interrupteurs, puis reconstruisez leur table de vérité."},
   {file:"circuit_mystere.html",em:"🕵️",title:"Circuit mystère",
    desc:"Une porte se cache dans la boîte noire : observez ses entrées et ses sorties pour l'identifier sans vous tromper."},
   {file:"constructeur_nand.html",em:"🧱",title:"Constructeur NON-ET",
    desc:"Reliez des portes NON-ET pour fabriquer NON, ET, OU et OU exclusif — comme un vrai processeur."},
   {file:"addition_binaire.html",em:"➕",title:"Addition binaire",
    desc:"Additionnez à la main et regardez le circuit en direct : demi-additionneur, additionneur complet et dépassement de capacité."}
  ],
  fsTitle:"Plein écran",langBtn:"EN"
 },
 en:{
  kicker:"COMPUTER SCIENCE · HIGH SCHOOL",
  title:"Computer architecture",
  sub:"Components, data paths, transistors and logic gates: explore the inside of the machine.",
  backCats:"← All categories",
  apps:[
   {file:"inside_the_machine.html",em:"🖥️",title:"Inside the Machine",
    desc:"Explore the components of a computer — CPU, RAM, drive, peripherals — and test your knowledge in quiz mode."},
   {file:"architecture_ordinateur.html",em:"🔍",title:"Inside the computer",
    desc:"Explore a desktop tower in 3D, click the components and follow the path of data, from input to output."},
   {file:"voyage_donnee.html",em:"⌨️",title:"The journey of a piece of data",
    desc:"Follow the signal of a keystroke through the keyboard, CPU, RAM and graphics card all the way to the screen."},
   {file:"le_bon_composant.html",em:"🧩",title:"The right component",
    desc:"A three-level progressive quiz: identify the components, understand their roles and reconstruct the path of data."},
   {file:"le_pc_monte_par_un_eleve.html",em:"🛠️",title:"A PC built by a student",
    desc:"Explore a PC assembled by a student: identify the components in the photos, discover the cable management and match each part to its role."},
   {file:"questions_architecture.html",em:"❓",title:"Questions to go further",
    desc:"Computer architecture questions: memory, processor, data journeys, programs. Pick a question to reveal its answer."},
   {file:"transistor_porte.html",em:"🔌",title:"From the transistor to the gate",
    desc:"Open and close transistors to understand how NOT, AND and OR gates are built."},
   {file:"portes_logiques.html",em:"🚪",title:"Logic gates",
    desc:"Test the four gates with switches, then rebuild their truth tables."},
   {file:"circuit_mystere.html",em:"🕵️",title:"Mystery circuit",
    desc:"A gate hides in the black box: observe its inputs and outputs to identify it without a mistake."},
   {file:"constructeur_nand.html",em:"🧱",title:"NAND-only builder",
    desc:"Wire NAND gates to build NOT, AND, OR and XOR — just like a real processor."},
   {file:"addition_binaire.html",em:"➕",title:"Binary addition",
    desc:"Add by hand and watch the circuit live: half adder, full adder and overflow."}
  ],
  fsTitle:"Fullscreen",langBtn:"FR"
 }
};
const T=()=>I18N[lang];

function applyLang(){
  try{localStorage.setItem("fj-lang",lang);document.cookie="fj-lang="+lang+";domain=.fredericjaccard.com;path=/;max-age=31536000;SameSite=Lax";}catch(e){}
  const t=T();
  document.documentElement.lang=lang;
  document.getElementById("kicker").textContent=t.kicker;
  document.getElementById("title").textContent=t.title;
  document.getElementById("sub").textContent=t.sub;
  document.getElementById("langBtn").textContent=t.langBtn;
  document.getElementById("fsBtn").title=t.fsTitle;
  document.title=t.title;
  document.getElementById("backCats").textContent=t.backCats;
  const box=document.getElementById("content");
  box.innerHTML="";
  const g=document.createElement("div");g.className="grid";
  t.apps.forEach(a=>{
    const c=document.createElement("a");
    c.className="cardApp";c.href=a.file;
    c.innerHTML=`<div class="em">${a.em}</div><h2>${a.title}</h2><p>${a.desc}</p>`;
    g.appendChild(c);
  });
  box.appendChild(g);
}
document.getElementById("langBtn").onclick=()=>{lang=lang==="fr"?"en":"fr";applyLang();};

const fsBtn=document.getElementById("fsBtn");
function isFs(){return document.fullscreenElement||document.webkitFullscreenElement;}
fsBtn.onclick=()=>{
  const el=document.documentElement;
  if(isFs()){(document.exitFullscreen||document.webkitExitFullscreen).call(document);}
  else{const req=el.requestFullscreen||el.webkitRequestFullscreen;if(req)req.call(el);}
};
function fsChange(){fsBtn.style.background=isFs()?"var(--primaryLight)":"var(--card)";}
document.addEventListener("fullscreenchange",fsChange);
document.addEventListener("webkitfullscreenchange",fsChange);

applyLang();
</script>
</body></html>

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23155E4C'/%3E%3Ctext x='32' y='43' font-family='Arial,sans-serif' font-size='28' font-weight='bold' fill='%23FBFAF6' text-anchor='middle'%3EFJ%3C/text%3E%3C/svg%3E">
<meta name="description" content="Application interactive pour le cours d'informatique.">
<title>Portes logiques — Architecture des ordinateurs · Gymnase — Frédéric Jaccard</title>
<style>
  :root{
    --bg:#FBFAF6; --ink:#20241F; --muted:#6E726B;
    --primary:#155E4C; --primary-light:#E3F0EA;
    --accent:#D96A08; --accent-light:#FDEBD8;
    --line:#D8D5CB; --card:#F7F6F2;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"Quattrocento Sans","Segoe UI",system-ui,sans-serif;
    display:flex; flex-direction:column; min-height:100vh;
  }
  header{
    display:flex; align-items:center; gap:16px; flex-wrap:wrap;
    padding:14px 24px; border-bottom:1px solid var(--line);
  }
  header .titles{flex:1; min-width:220px}
  .kicker{color:var(--accent); font-weight:700; font-size:13px; letter-spacing:.08em; text-transform:uppercase}
  h1{font-size:26px; color:var(--primary); line-height:1.15}
  .controls{display:flex; gap:10px}
  button.ctl{
    font:inherit; font-weight:700; font-size:14px; cursor:pointer;
    padding:9px 16px; border-radius:8px;
    border:2px solid var(--primary); background:#fff; color:var(--primary);
    transition:background .15s,color .15s;
  }
  button.ctl:hover:not(:disabled){background:var(--primary); color:#fff}
  button.ctl:disabled{opacity:.35; cursor:default}
  button.ctl.big{font-size:16px; padding:12px 22px}
  main{flex:1; display:flex; flex-direction:column; gap:16px; padding:22px 24px; max-width:1100px; width:100%; margin:0 auto}
  .instruction{
    width:100%; font-size:15px; line-height:1.5; background:var(--primary-light);
    border-radius:10px; padding:12px 16px;
  }
  .gatebar{display:flex; gap:10px; flex-wrap:wrap}
  button.gate{
    font:inherit; font-weight:700; font-size:17px; cursor:pointer;
    padding:10px 26px; border-radius:10px; letter-spacing:.04em;
    border:2px solid var(--line); background:#fff; color:var(--muted);
    transition:all .15s;
  }
  button.gate:hover:not(:disabled){border-color:var(--primary); color:var(--primary)}
  button.gate.sel{border-color:var(--primary); background:var(--primary-light); color:var(--primary)}
  button.gate.done::after{content:" ✓"; color:var(--primary)}
  .playrow{display:grid; grid-template-columns:minmax(0,1.35fr) minmax(280px,1fr); gap:20px; width:100%; align-items:start}
  @media (max-width:900px){ .playrow{grid-template-columns:1fr} }
  .stage{
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:10px; display:flex; align-items:center; justify-content:center;
  }
  svg{width:100%; height:auto; max-height:48vh; display:block}
  .sw{cursor:pointer; user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent}
  *{user-select:none; -webkit-user-select:none}
  .sw .off{display:block} .sw .on{display:none}
  .sw.on .off{display:none} .sw.on .on{display:block}
  .sw text{fill:var(--ink); font-weight:700}
  .swlabel{fill:var(--ink); font-weight:700; font-size:16px}
  .lampOff{fill:#fff; stroke:var(--line); stroke-width:3}
  .lampOn{fill:var(--accent); stroke:var(--accent); stroke-width:3; filter:drop-shadow(0 0 10px rgba(217,106,8,.6))}
  .wireBase{stroke:var(--line); stroke-width:5; fill:none; stroke-linecap:round}
  .wireHot{stroke:var(--accent); stroke-width:5; fill:none; stroke-linecap:round; stroke-dasharray:10 8; animation:flow .8s linear infinite}
  @keyframes flow{to{stroke-dashoffset:-18}}
  .gatelabel{fill:var(--primary); font-weight:700; font-size:22px}
  table.truth{
    border-collapse:collapse; width:100%; background:#fff;
    border:2px solid var(--line); border-radius:10px; overflow:hidden;
  }
  table.truth th{
    background:var(--primary-light); color:var(--primary); font-size:15px;
    padding:9px 6px; border-bottom:2px solid var(--line);
  }
  table.truth td{padding:6px; border-bottom:1px solid var(--line); text-align:center}
  table.truth tr:last-child td{border-bottom:none}
  button.bit{
    font:inherit; font-weight:700; font-size:17px; cursor:pointer;
    width:52px; height:40px; border-radius:8px;
    border:2px solid var(--line); background:#fff; color:var(--muted);
    transition:all .12s;
  }
  button.bit:hover:not(:disabled){border-color:var(--primary)}
  button.bit.filled{border-color:var(--primary); color:var(--primary)}
  button.bit.good{border-color:var(--primary); background:var(--primary-light); color:var(--primary)}
  button.bit.bad{border-color:var(--accent); background:var(--accent-light); color:var(--accent)}
  .panel{
    background:#fff; border:2px solid var(--line); border-radius:10px;
    padding:16px 18px; display:flex; flex-direction:column; gap:12px;
  }
  .panel h2{color:var(--primary); font-size:19px}
  .panel .sub{color:var(--muted); font-size:14px; font-style:italic}
  .feedback{font-size:15px; min-height:20px; font-weight:700}
  .feedback.ok{color:var(--primary)}
  .feedback.ko{color:var(--accent)}
  .final{
    width:100%; background:var(--primary-light); border-radius:10px; padding:20px 22px;
    display:none; flex-direction:column; gap:12px; align-items:flex-start;
  }
  .final.show{display:flex}
  .final h2{color:var(--primary); font-size:21px}
  footer{padding:12px 24px; border-top:1px solid var(--line); color:var(--muted); font-size:13px; text-align:center}

footer a{color:var(--muted);text-decoration:none}
footer a:hover{color:var(--primary);text-decoration:underline}
</style>
</head>
<body>
<header>
  <div class="titles">
    <div class="kicker" id="kicker">Architecture des ordinateurs</div>
    <h1 id="title">Portes logiques à manipuler</h1>
  </div>
  <div class="controls">
    <button class="ctl" id="langBtn">English</button>
    <button class="ctl" id="fsBtn">⛶ <span id="fsLabel">Plein écran</span></button>
  </div>
</header>

<main>
  <p class="instruction" id="instruction"></p>

  <div class="gatebar" id="gatebar"></div>

  <div class="playrow">
    <div class="stage">
      <svg viewBox="0 0 720 320" id="scene">
        <!-- fils entrées -->
        <path class="wireBase" id="wA" d="M 190 110 L 260 110 L 260 140 L 300 140"/>
        <path class="wireBase" id="wB" d="M 190 230 L 260 230 L 260 200 L 300 200"/>
        <path class="wireBase" id="wS" d="M 420 170 L 560 170"/>
        <!-- porte (dessinée par JS) -->
        <g id="gateShape"></g>
        <!-- interrupteurs -->
        <g class="sw" id="swA" transform="translate(40,84)">
          <text class="swlabel" x="0" y="-14">A</text>
          <rect class="box" x="0" y="0" width="150" height="52" rx="10" fill="#fff" stroke="#155E4C" stroke-width="2.5"/>
          <g class="off">
            <rect x="12" y="14" width="56" height="24" rx="6" fill="#D8D5CB"/>
            <text x="100" y="34" font-size="20" font-weight="700" fill="#6E726B">0</text>
          </g>
          <g class="on">
            <rect x="82" y="14" width="56" height="24" rx="6" fill="#E3F0EA"/>
            <text x="100" y="34" font-size="20" font-weight="700" fill="#155E4C">1</text>
          </g>
        </g>
        <g class="sw" id="swB" transform="translate(40,204)">
          <text class="swlabel" x="0" y="-14">B</text>
          <rect class="box" x="0" y="0" width="150" height="52" rx="10" fill="#fff" stroke="#155E4C" stroke-width="2.5"/>
          <g class="off">
            <rect x="12" y="14" width="56" height="24" rx="6" fill="#D8D5CB"/>
            <text x="100" y="34" font-size="20" font-weight="700" fill="#6E726B">0</text>
          </g>
          <g class="on">
            <rect x="82" y="14" width="56" height="24" rx="6" fill="#E3F0EA"/>
            <text x="100" y="34" font-size="20" font-weight="700" fill="#155E4C">1</text>
          </g>
        </g>
        <!-- ampoule -->
        <g transform="translate(590,170)">
          <circle id="lamp" class="lampOff" r="34"/>
          <text id="lampVal" text-anchor="middle" dy="8" font-size="24" font-weight="700" fill="#6E726B">0</text>
          <text id="lampLabel" class="swlabel" text-anchor="middle" y="60" font-size="16">S</text>
        </g>
      </svg>
    </div>

    <div class="panel" id="panel">
      <h2 id="panelTitle"></h2>
      <p class="sub" id="panelSub"></p>
      <table class="truth" id="truth"></table>
      <div class="feedback" id="fb"></div>
      <div style="display:flex; gap:10px; flex-wrap:wrap">
        <button class="ctl" id="checkBtn"></button>
        <button class="ctl" id="resetBtn"></button>
      </div>
    </div>
  </div>

  <div class="final" id="final">
    <h2 id="finalTitle"></h2>
    <p id="finalText" style="font-size:16px"></p>
    <button class="ctl big" id="restartBtn"></button>
  </div>
</main>

<footer><a href="index.html" id="fjBack"></a> · <a href="https://www.fredericjaccard.com">Frédéric Jaccard</a></footer>

<script>
const GATES = ["NON","ET","OU","XOR"];
const FN = {
  NON: a => a ? 0 : 1,
  ET:  (a,b) => a && b ? 1 : 0,
  OU:  (a,b) => a || b ? 1 : 0,
  XOR: (a,b) => (a !== b) ? 1 : 0,
};
const ROWS = gate => gate === "NON" ? [[0],[1]] : [[0,0],[0,1],[1,0],[1,1]];

const I18N = {
  fr:{back:"← Toutes les applications",
    title:"Portes logiques à manipuler",
    instruction:"Choisis une porte, teste toutes les combinaisons avec les interrupteurs A et B, observe l'ampoule S… puis reconstruis la table de vérité en cliquant sur les cases de la colonne S !",
    fs:"Plein écran", fsExit:"Quitter",
    panelTitle:"Table de vérité — ",
    panelSub:"Clique sur les cases de la colonne S pour les remplir (0 ou 1).",
    check:"Vérifier la table", reset:"Tout effacer",
    good:"Table correcte, bravo !",
    bad:(n)=>`${n} erreur${n>1?"s":""}… retourne tester la porte avec les interrupteurs !`,
    doneGate:(g)=>`Porte ${gateName(g)} maîtrisée !`,
    finalTitle:"Les quatre portes sont maîtrisées !",
    finalText:(ok,tot)=>`Tables reconstruites correctement : ${ok} / ${tot}. Tu peux recommencer pour t'entraîner avant le test !`,
    restart:"Recommencer",
    out:"S",
    gates:{NON:"NON", ET:"ET", OU:"OU", XOR:"OU exclusif"},
    combos:["A = 0","A = 1"],
    combos2:["A = 0, B = 0","A = 0, B = 1","A = 1, B = 0","A = 1, B = 1"],
  },
  en:{back:"← All applications",
    title:"Logic gates playground",
    instruction:"Pick a gate, test every combination with switches A and B, watch bulb Q… then rebuild the truth table by clicking the cells in column Q!",
    fs:"Fullscreen", fsExit:"Exit",
    panelTitle:"Truth table — ",
    panelSub:"Click the cells in column Q to fill them in (0 or 1).",
    check:"Check the table", reset:"Clear all",
    good:"Table correct, well done!",
    bad:(n)=>`${n} error${n>1?"s":""}… go back and test the gate with the switches!`,
    doneGate:(g)=>`Gate ${gateName(g)} mastered!`,
    finalTitle:"All four gates mastered!",
    finalText:(ok,tot)=>`Tables rebuilt correctly: ${ok} / ${tot}. You can start over to practice!`,
    restart:"Start over",
    out:"Q",
    gates:{NON:"NOT", ET:"AND", OU:"OR", XOR:"XOR"},
    combos:["A = 0","A = 1"],
    combos2:["A = 0, B = 0","A = 0, B = 1","A = 1, B = 0","A = 1, B = 1"],
  }
};
const gateName = g => I18N[lang].gates[g];

let lang = (function(){try{var s=localStorage.getItem("fj-lang");return (s==="fr"||s==="en")?s:"fr";}catch(e){return "fr";}})();
let gate = "NON";
let a = 0, b = 0;
let entries = {};        // "ET" -> [null,"0","1",null]
let mastered = {};       // "ET" -> true
let masterCount = 0;

const $ = id => document.getElementById(id);
const T = () => I18N[lang];

/* ---------- dessin des portes (symboles normalisés ANSI/IEEE) ---------- */
const SHAPES = {
  // ET : forme en « D »
  ET:  `<path d="M 300 120 L 360 120 A 60 50 0 0 1 360 220 L 300 220 Z" fill="#fff" stroke="#155E4C" stroke-width="3.5"/>`,
  // OU : forme pointue à base concave
  OU:  `<path d="M 300 120 Q 350 120 415 170 Q 350 220 300 220 Q 330 170 300 120 Z" fill="#fff" stroke="#155E4C" stroke-width="3.5"/>`,
  // XOR : OU + courbe supplémentaire à l'entrée
  XOR: `<path d="M 315 120 Q 365 120 430 170 Q 365 220 315 220 Q 345 170 315 120 Z" fill="#fff" stroke="#155E4C" stroke-width="3.5"/>
        <path d="M 290 120 Q 320 170 290 220" fill="none" stroke="#155E4C" stroke-width="3.5"/>`,
  // NON : triangle + bulle d'inversion
  NON: `<path d="M 300 120 L 300 220 L 420 170 Z" fill="#fff" stroke="#155E4C" stroke-width="3.5"/>
        <circle cx="429" cy="170" r="8" fill="#fff" stroke="#155E4C" stroke-width="3"/>`,
};
const OUTX = { ET: 420, OU: 415, XOR: 430, NON: 437 };

function drawGate(g){
  const el = $("gateShape");
  el.innerHTML = SHAPES[g] +
    `<text x="360" y="104" text-anchor="middle" font-size="17" font-weight="700" fill="#D96A08">${gateName(g)}</text>`;
  // cacher l'entrée B pour NON, et recentrer A verticalement au milieu de la porte
  const non = g === "NON";
  $("wB").style.display = non ? "none" : "";
  $("swB").style.display = non ? "none" : "";
  $("swA").setAttribute("transform", non ? "translate(40,144)" : "translate(40,84)");
  // fils d'entrée : reculer pour XOR (courbe supplémentaire), droit pour NON
  const wA = $("wA");
  if(non)              wA.setAttribute("d","M 190 170 L 300 170");
  else if(g === "XOR") wA.setAttribute("d","M 190 110 L 250 110 L 250 140 L 290 140");
  else                 wA.setAttribute("d","M 190 110 L 260 110 L 260 140 L 300 140");
  const wB = $("wB");
  if(g === "XOR")      wB.setAttribute("d","M 190 230 L 250 230 L 250 200 L 290 200");
  else                 wB.setAttribute("d","M 190 230 L 260 230 L 260 200 L 300 200");
  // fil de sortie
  $("wS").setAttribute("d", `M ${OUTX[g]} 170 L 560 170`);
}

function output(){
  return FN[gate](a, gate === "NON" ? 0 : b);
}

function render(){
  $("swA").classList.toggle("on", a === 1);
  $("swB").classList.toggle("on", b === 1);
  const s = output();
  $("lamp").setAttribute("class", s ? "lampOn" : "lampOff");
  $("lampVal").textContent = s;
  $("lampVal").setAttribute("fill", s ? "#fff" : "#6E726B");
  $("lampLabel").textContent = T().out;
  $("wA").setAttribute("class", a ? "wireHot" : "wireBase");
  $("wB").setAttribute("class", b && gate !== "NON" ? "wireHot" : "wireBase");
  $("wS").setAttribute("class", s ? "wireHot" : "wireBase");
}

/* ---------- table de vérité ---------- */
function renderTable(){
  const rows = ROWS(gate);
  const ent = entries[gate];
  const combos = gate === "NON" ? T().combos : T().combos2;
  const O = T().out;
  let html = gate === "NON"
    ? `<tr><th>A</th><th>${O}</th></tr>`
    : `<tr><th>A</th><th>B</th><th>${O}</th></tr>`;
  rows.forEach((r, i) => {
    const cells = r.map(v => `<td style="font-weight:700">${v}</td>`).join("");
    const val = ent[i];
    const cls = val === null ? "bit" : "bit filled";
    html += `<tr title="${combos[i]}">${cells}<td><button class="${cls}" data-row="${i}">${val === null ? "?" : val}</button></td></tr>`;
  });
  $("truth").innerHTML = html;
  $("truth").querySelectorAll(".bit").forEach(btn => {
    btn.onclick = () => {
      const i = +btn.dataset.row;
      const cur = entries[gate][i];
      entries[gate][i] = cur === null ? "0" : (cur === "0" ? "1" : "0");
      renderTable();
    };
  });
}

function checkTable(){
  const rows = ROWS(gate);
  const ent = entries[gate];
  let errors = 0;
  rows.forEach((r, i) => {
    const expected = FN[gate](r[0], r[1] ?? 0);
    const btn = $("truth").querySelector(`[data-row="${i}"]`);
    btn.disabled = true;
    if(ent[i] !== null && +ent[i] === expected){ btn.className = "bit good"; }
    else { btn.className = "bit bad"; errors++; }
  });
  const fb = $("fb");
  if(errors === 0){
    fb.textContent = T().good + " " + T().doneGate(gate);
    fb.className = "feedback ok";
    if(!mastered[gate]){ mastered[gate] = true; masterCount++; renderGatebar(); }
    if(masterCount === GATES.length) showFinal();
  } else {
    fb.textContent = T().bad(errors);
    fb.className = "feedback ko";
    setTimeout(() => { enableCells(); }, 1600);
  }
}

function enableCells(){
  $("truth").querySelectorAll(".bit").forEach(btn => {
    btn.disabled = false;
    if(!btn.classList.contains("good")){
      btn.className = btn.textContent === "?" ? "bit" : "bit filled";
    }
  });
}

/* ---------- barre des portes ---------- */
function renderGatebar(){
  const bar = $("gatebar");
  bar.innerHTML = "";
  GATES.forEach(g => {
    const btn = document.createElement("button");
    btn.className = "gate" + (g === gate ? " sel" : "") + (mastered[g] ? " done" : "");
    btn.textContent = gateName(g);
    btn.onclick = () => selectGate(g);
    bar.appendChild(btn);
  });
}

function selectGate(g){
  gate = g; a = 0; b = 0;
  if(!entries[g]) entries[g] = ROWS(g).map(() => null);
  drawGate(g); render(); renderTable(); renderGatebar();
  $("fb").textContent = ""; $("panelTitle").textContent = T().panelTitle + gateName(g);
}

function showFinal(){
  $("final").classList.add("show");
  $("finalTitle").textContent = T().finalTitle;
  $("finalText").innerHTML = T().finalText(masterCount, GATES.length);
  $("restartBtn").textContent = T().restart;
}

/* ---------- interactions ---------- */
$("swA").onclick = () => { a = 1 - a; render(); };
$("swB").onclick = () => { b = 1 - b; render(); };
$("checkBtn").onclick = checkTable;
$("resetBtn").onclick = () => { entries[gate] = ROWS(gate).map(() => null); renderTable(); $("fb").textContent = ""; };
$("restartBtn").onclick = () => {
  mastered = {}; masterCount = 0; entries = {};
  $("final").classList.remove("show");
  GATES.forEach(g => entries[g] = ROWS(g).map(() => null));
  selectGate(gate);
};

function applyLang(){
  document.documentElement.lang = lang;
  $("kicker").textContent = lang === "fr" ? "Architecture des ordinateurs" : "Computer architecture";
  $("title").textContent = T().title;
  $("langBtn").textContent = lang === "fr" ? "English" : "Français";
  $("fsLabel").textContent = document.fullscreenElement ? T().fsExit : T().fs;
  $("instruction").textContent = T().instruction;
  $("panelTitle").textContent = T().panelTitle + gateName(gate);
  $("panelSub").textContent = T().panelSub;
  $("checkBtn").textContent = T().check;
  $("resetBtn").textContent = T().reset;
  if($("final").classList.contains("show")) showFinal();
  drawGate(gate); renderGatebar(); render();
  renderTable();
}

$("langBtn").onclick = () => { lang = lang==="fr" ? "en" : "fr"; try{localStorage.setItem("fj-lang",lang);}catch(e){}; applyLang(); };
$("fsBtn").onclick = () => {
  if(document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen().catch(()=>{});
};
document.addEventListener("fullscreenchange", () => {
  $("fsLabel").textContent = document.fullscreenElement ? T().fsExit : T().fs;
});

GATES.forEach(g => entries[g] = ROWS(g).map(() => null));
applyLang();
selectGate("NON");
</script>

<script>
(function(){
  var el=document.getElementById("fjBack");
  if(!el||typeof I18N==="undefined"||typeof lang==="undefined")return;
  function upd(){try{el.textContent=I18N[lang].back;}catch(e){}}
  var btn=document.getElementById("langBtn");
  if(btn){var old=btn.onclick;btn.onclick=function(){if(old)old.apply(this,arguments);upd();};}
  upd();
})();
</script>
</body>
</html>

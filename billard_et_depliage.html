<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Une bille rebondit dans un rectangle quadrillé m × n : comptez les carreaux traversés, puis dépliez les rebonds pour comprendre pourquoi ce nombre vaut ppmc(m, n).">
<title>Billard et dépliage · Gymnase — Frédéric Jaccard</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2320241F'/%3E%3Ctext x='32' y='43' font-family='Arial,sans-serif' font-size='28' font-weight='bold' fill='%23FFFFFF' text-anchor='middle'%3EFJ%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Quattrocento+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBFAF6; --card:#F7F6F2; --primary:#155E4C; --primaryLight:#E3F0EA;
  --accent:#D96A08; --accentLight:#FDEBD8; --line:#D8D5CB; --ink:#20241F; --muted:#6E726B;
  --error:#C84B31;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:"Quattrocento Sans",sans-serif;padding:20px;max-width:960px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px;margin-bottom:14px}
.kicker{font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
h1{font-size:26px;color:var(--primary)}
.hdrBtns{display:flex;gap:8px}
button{font-family:inherit;font-size:14px;font-weight:700;padding:8px 16px;border-radius:10px;border:2px solid var(--primary);background:var(--card);color:var(--primary);cursor:pointer}
button:hover{background:var(--primaryLight)}
button.main{background:var(--primary);color:#fff}
button.main:hover{background:var(--primary);filter:brightness(1.15)}
.instruction{background:var(--primaryLight);border-radius:12px;padding:12px 16px;margin-bottom:16px;font-size:15px}
.tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.tabs button[aria-pressed="true"]{background:var(--primary);color:#fff}
[hidden]{display:none}
.contenu{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
.scene{flex:1 1 420px;min-width:300px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.panneau{flex:0 0 260px;min-width:220px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
.chiffre{font-size:48px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;color:var(--accent)}
.etiquette{font-size:14px;color:var(--muted);margin-bottom:6px}
.ligne{display:flex;justify-content:space-between;gap:12px;padding:4px 0;font-size:15px;border-bottom:1px solid var(--line)}
.ligne:last-of-type{border-bottom:none}
.ligne b{font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.note{margin-top:4px;font-size:14px;color:var(--muted);font-style:italic}
.aide{margin-top:10px;font-size:13px;color:var(--muted);line-height:1.5}
.cols{display:flex;flex-wrap:wrap;gap:16px}
.cols>div{flex:1 1 300px;min-width:280px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.cap{font-size:14px;color:var(--muted);margin-bottom:8px;font-weight:700}
svg{width:100%;height:auto;display:block;touch-action:none}
svg text{font-family:"Quattrocento Sans",sans-serif}
.ctrl{display:flex;align-items:center;gap:10px;margin-top:16px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 16px}
input[type=range]{flex:1;min-width:140px;height:28px;accent-color:var(--primary);cursor:pointer}
.klab{font-size:14px;color:var(--muted);min-width:100px;font-variant-numeric:tabular-nums;text-align:right}
.stats{display:flex;flex-wrap:wrap;gap:8px 20px;margin-top:14px;font-size:15px;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 16px}
.stats b{color:var(--ink);font-variant-numeric:tabular-nums}
.proof{margin-top:16px;font-size:14px;line-height:1.65;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.proof b{color:var(--ink)}
footer{margin-top:20px;text-align:center;font-size:13px;color:var(--muted)}
footer a{color:var(--muted);font-weight:400;text-decoration:none}
footer a:hover{text-decoration:underline}
.hdl{transition:transform .12s ease-out}
.hdl:hover{transform:scale(1.15)}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
@media(max-width:700px){
  body{padding:14px}
  h1{font-size:22px}
  .hdrBtns{width:100%}
  button{min-height:44px}
  .scene,.panneau,.cols>div{flex:1 1 100%;min-width:0}
  .chiffre{font-size:40px}
  input[type=range]{flex:1 1 100%;height:44px}
  .klab{text-align:left;min-width:0}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header>
  <div>
    <div class="kicker" id="kicker"></div>
    <h1 id="title"></h1>
  </div>
  <div class="hdrBtns">
    <button id="langBtn" type="button">English</button>
    <button id="fsBtn" type="button"><span id="fsLabel"></span></button>
  </div>
</header>
<div class="instruction" id="instruction"></div>
<div class="tabs">
  <button id="tabB" type="button" aria-pressed="true"></button>
  <button id="tabD" type="button" aria-pressed="false"></button>
</div>
<section id="viewB">
  <div class="contenu">
    <div class="scene">
      <svg id="b" viewBox="0 0 560 500" role="img"></svg>
    </div>
    <div class="panneau">
      <div>
        <div class="chiffre" id="cnt"></div>
        <div class="etiquette" id="lab_cnt"></div>
      </div>
      <div class="ligne"><span id="lab_dims"></span><b id="dims"></b></div>
      <div class="ligne"><span id="lab_aire"></span><b id="aire"></b></div>
      <div class="ligne"><span id="lab_pg"></span><b id="pg"></b></div>
      <div class="ligne"><span id="lab_form"></span><b id="form"></b></div>
      <div class="note" id="note"></div>
      <div class="aide" id="aide"></div>
    </div>
  </div>
</section>
<section id="viewD" hidden>
  <div class="cols">
    <div>
      <div class="cap" id="cap1"></div>
      <svg id="f" viewBox="0 0 300 300" role="img"></svg>
    </div>
    <div>
      <div class="cap" id="cap2"></div>
      <svg id="u" viewBox="0 0 380 380" role="img"></svg>
    </div>
  </div>
  <div class="ctrl">
    <button id="play" class="main" type="button"></button>
    <button id="rst" type="button"></button>
    <input type="range" id="k" min="0" max="12" value="0">
    <span id="klab" class="klab"></span>
  </div>
  <div class="stats" id="stats"></div>
  <div class="proof" id="proof"></div>
</section>
<footer><a href="mathematiques.html" id="backLink"></a> · <a href="https://fredericjaccard.com">Frédéric Jaccard</a></footer>
<script>
(function(){
const $ = id => document.getElementById(id);
const svgB=$("b"),F=$("f"),U=$("u"),SL=$("k"),PL=$("play"),KL=$("klab"),ST=$("stats");
let m=6,n=4,k=0,timer=null,drag=null,tab="b";
const MAX=12,LIM=90;
const WB=560,HB=500,FW=300,FH=300,UW=380,UH=380;
const ACC="#D96A08",ACCL="#FDEBD8",GRIS="#6E726B",BORD="#D8D5CB",ENCRE="#20241F",CARD="#F7F6F2",BGC="#FBFAF6";
const I18N={
  fr:{
    kicker:"PGDC et PPMC",
    title:"Billard et dépliage",
    docTitle:"Billard et dépliage · Gymnase — Frédéric Jaccard",
    tabB:"1 · Le billard",tabD:"2 · Le dépliage",
    instrB:"À partir du coin A, une bille suit les diagonales des carreaux en rebondissant sur les bords. Combien de carrés traverse-t-elle avant d’atteindre un sommet ? Faites glisser les poignées pour modifier le rectangle.",
    instrD:"Chaque rebond peut être « déplié » en reflétant le rectangle : la ligne brisée devient alors une diagonale droite. Lancez l’animation pour voir les carreaux se correspondre un à un.",
    ariaB:"Billard interactif sur quadrillage",
    fs:"Plein écran",fsExit:"Quitter",
    backList:"← Toutes les applications",
    cnt:"carrés traversés",cntSur:"sur",
    dims:"rectangle m × n",aire:"aire m·n",pg:"pgdc(m, n)",form:"m·n / pgdc",
    notePrem:"m et n sont premiers entre eux : tous les carrés sont traversés.",
    noteDiv:function(a,g){return "Un carré sur "+g+" est traversé ("+a+" / "+g+" = "+(a/g)+").";},
    aideB:"Le coin A reste fixe. Faites glisser le sommet C pour changer les deux dimensions, ou les poignées du milieu pour une seule.",
    cap1:"Rectangle replié — la bille rebondit",
    cap2:"Rebonds dépliés — diagonale d’un carré L × L",
    play:"Lecture",pause:"Pause",rst:"Remise à zéro",
    etape:function(k,l){return "étape "+k+" / "+l;},
    statsD:function(m,n,g,l){return '<b>m × n = '+m+' × '+n+'</b><span>pgdc = <b>'+g+'</b></span><span>L = ppmc = <b>'+l+'</b></span><span>carrés traversés = <b>'+l+'</b></span>';},
    proof:'<b>Pourquoi ça marche.</b> (1) Déplier un rebond = refléter le rectangle : la ligne brisée devient la <b>diagonale d’un carré de côté L = ppmc(m, n)</b>. (2) Une diagonale de carré L × L traverse exactement <b>L carreaux</b> (un par colonne). (3) En repliant, chaque carreau de la diagonale retombe sur un carreau <b>différent</b> du rectangle — jamais deux sur le même. Conclusion : carrés traversés = ppmc(m, n) = m·n / pgdc(m, n).',
    tooBig:function(m,n,l){return "ppmc("+m+", "+n+") = "+l+" : trop grand pour être dessiné";},
    tooBig2:"L’argument reste valable — essayez des valeurs plus petites."
  },
  en:{
    kicker:"GCD and LCM",
    title:"Billiard and unfolding",
    docTitle:"Billiard and unfolding · Gymnase — Frédéric Jaccard",
    tabB:"1 · The billiard",tabD:"2 · The unfolding",
    instrB:"From corner A, a ball follows the diagonals of the squares, bouncing off the edges. How many squares does it cross before reaching a vertex? Drag the handles to change the rectangle.",
    instrD:"Each bounce can be “unfolded” by reflecting the rectangle: the broken line then becomes a straight diagonal. Play the animation to see the squares correspond one-to-one.",
    ariaB:"Interactive billiard on a grid",
    fs:"Fullscreen",fsExit:"Exit",
    backList:"← All applications",
    cnt:"squares crossed",cntSur:"out of",
    dims:"rectangle m × n",aire:"area m·n",pg:"gcd(m, n)",form:"m·n / gcd",
    notePrem:"m and n are coprime: all squares are crossed.",
    noteDiv:function(a,g){return "One square out of "+g+" is crossed ("+a+" / "+g+" = "+(a/g)+").";},
    aideB:"Corner A stays fixed. Drag corner C to change both dimensions, or the middle handles for one dimension only.",
    cap1:"Folded rectangle — the ball bounces",
    cap2:"Unfolded bounces — diagonal of an L × L square",
    play:"Play",pause:"Pause",rst:"Reset",
    etape:function(k,l){return "step "+k+" / "+l;},
    statsD:function(m,n,g,l){return '<b>m × n = '+m+' × '+n+'</b><span>gcd = <b>'+g+'</b></span><span>L = lcm = <b>'+l+'</b></span><span>squares crossed = <b>'+l+'</b></span>';},
    proof:'<b>Why it works.</b> (1) Unfolding a bounce = reflecting the rectangle: the broken line becomes the <b>diagonal of a square of side L = lcm(m, n)</b>. (2) A diagonal of an L × L square crosses exactly <b>L squares</b> (one per column). (3) When folding back, each square on the diagonal lands on a <b>different</b> square of the rectangle — never two on the same. Conclusion: squares crossed = lcm(m, n) = m·n / gcd(m, n).',
    tooBig:function(m,n,l){return "lcm("+m+", "+n+") = "+l+" : too large to draw";},
    tooBig2:"The argument still holds — try smaller values."
  }
};
let lang=(function(){try{var c=document.cookie.match(/(?:^|;\s*)fj-lang=([a-z]{2})/);if(c&&(c[1]==="fr"||c[1]==="en"))return c[1];}catch(e){}try{var s=localStorage.getItem("fj-lang");if(s==="fr"||s==="en")return s;}catch(e){}return "fr";})();
const T=()=>I18N[lang];
function gcd(a,b){return b?gcd(b,a%b):a}
function calc(){
  var pts=[[0,0]],x=0,y=0,dx=1,dy=1;
  for(var g=0;g<6000;g++){
    var tx=dx>0?(Math.ceil(x)-x||1):(x-Math.floor(x)||1);
    var ty=dy>0?(Math.ceil(y)-y||1):(y-Math.floor(y)||1);
    var t=Math.min(tx,ty);
    x+=dx*t;y+=dy*t;pts.push([x,y]);
    var cx=Math.round(x),cy=Math.round(y);
    var wx=(cx===0||cx===m),wy=(cy===0||cy===n);
    if(wx&&wy)break;
    if(wx)dx=-dx;if(wy)dy=-dy;
  }
  return pts;
}
function cells(pts){
  var s={};
  for(var i=0;i<pts.length-1;i++){
    var x0=pts[i][0],y0=pts[i][1],x1=pts[i+1][0],y1=pts[i+1][1];
    var sx=x1>x0?1:-1,sy=y1>y0?1:-1;
    var kk=Math.round(Math.max(Math.abs(x1-x0),Math.abs(y1-y0)));
    var cx,cy;
    if(i===0){cx=0;cy=0}
    else{cx=Math.min(m-1,Math.max(0,sx>0?x0:x0-1));cy=Math.min(n-1,Math.max(0,sy>0?y0:y0-1))}
    s[cx+','+cy]=1;
    for(var j=1;j<kk;j++){cx=Math.min(m-1,Math.max(0,cx+sx));cy=Math.min(n-1,Math.max(0,cy+sy));s[cx+','+cy]=1}
  }
  return s;
}
function foldP(v,d){var q=Math.floor(v/d),r=v-q*d;return (q%2===1)?d-r:r}
function foldC(i,d){var r=i%d,q=(i-r)/d;return (q%2===1)?d-1-r:r}
function geoB(){var c=Math.max(10,Math.min(34,Math.floor(Math.min((WB-140)/m,(HB-140)/n))));var ox=Math.max(46,Math.round((WB-m*c)/2));return [c,ox,HB-52];}
function geoF(){var cf=Math.max(14,Math.min(26,Math.floor(Math.min((FW-64)/m,(FH-64)/n))));return [cf,(FW-m*cf)/2,(FH-n*cf)/2];}
function renderB(){
  var g=gcd(m,n),aire=m*n;
  var pts=calc(),cs=cells(pts);
  var gb=geoB(),CELL=gb[0],OX=gb[1],OYB=gb[2];
  var gw=m*CELL,gh=n*CELL,top=OYB-gh,s='';
  function px(p){return (OX+p[0]*CELL).toFixed(1)+','+(OYB-p[1]*CELL).toFixed(1)}
  s+='<defs><marker id="ah" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,1 L8,5 L0,9 z" fill="'+ACC+'"/></marker></defs>';
  for(var key in cs){
    var c=key.split(','),ccx=+c[0],ccy=+c[1];
    s+='<rect x="'+(OX+ccx*CELL)+'" y="'+(OYB-(ccy+1)*CELL)+'" width="'+CELL+'" height="'+CELL+'" fill="'+ACCL+'"/>';
  }
  var d='';
  for(var i=0;i<=m;i++)d+='M'+(OX+i*CELL)+' '+top+'V'+OYB;
  for(var j=0;j<=n;j++)d+='M'+OX+' '+(top+j*CELL)+'H'+(OX+gw);
  s+='<path d="'+d+'" fill="none" stroke="'+BORD+'" stroke-width="1"/>';
  s+='<rect x="'+OX+'" y="'+top+'" width="'+gw+'" height="'+gh+'" fill="none" stroke="'+ENCRE+'" stroke-width="1.4"/>';
  s+='<polyline points="'+pts.map(px).join(' ')+'" fill="none" stroke="'+ACC+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-start="url(#ah)"/>';
  var fs=11;
  s+='<text x="'+(OX-10)+'" y="'+(OYB+16)+'" text-anchor="end" font-size="'+fs+'" fill="'+GRIS+'">A</text>';
  s+='<text x="'+(OX+gw+10)+'" y="'+(OYB+16)+'" font-size="'+fs+'" fill="'+GRIS+'">B</text>';
  s+='<text x="'+(OX+gw+10)+'" y="'+(top+12)+'" font-size="'+fs+'" fill="'+GRIS+'">C</text>';
  s+='<text x="'+(OX-10)+'" y="'+(top+12)+'" text-anchor="end" font-size="'+fs+'" fill="'+GRIS+'">D</text>';
  s+='<text x="'+(OX+gw/2)+'" y="'+(OYB+32)+'" text-anchor="middle" font-size="13" fill="'+GRIS+'">m = '+m+'</text>';
  s+='<text transform="translate('+(OX-28)+' '+(top+gh/2)+') rotate(-90)" text-anchor="middle" font-size="13" fill="'+GRIS+'">n = '+n+'</text>';
  var hit='rgba(0,0,0,0)';
  s+='<circle class="hdl" data-h="y" cx="'+(OX+gw/2)+'" cy="'+top+'" r="7" fill="'+ENCRE+'" stroke="#ffffff" stroke-width="2" style="cursor:ns-resize"/>';
  s+='<circle data-h="y" cx="'+(OX+gw/2)+'" cy="'+top+'" r="18" fill="'+hit+'" style="cursor:ns-resize"/>';
  s+='<circle class="hdl" data-h="x" cx="'+(OX+gw)+'" cy="'+(top+gh/2)+'" r="7" fill="'+ENCRE+'" stroke="#ffffff" stroke-width="2" style="cursor:ew-resize"/>';
  s+='<circle data-h="x" cx="'+(OX+gw)+'" cy="'+(top+gh/2)+'" r="18" fill="'+hit+'" style="cursor:ew-resize"/>';
  s+='<circle class="hdl" data-h="c" cx="'+(OX+gw)+'" cy="'+top+'" r="9.5" fill="'+ENCRE+'" stroke="#ffffff" stroke-width="2" style="cursor:nwse-resize"/>';
  s+='<circle data-h="c" cx="'+(OX+gw)+'" cy="'+top+'" r="20" fill="'+hit+'" style="cursor:nwse-resize"/>';
  svgB.innerHTML=s;
  var size=Object.keys(cs).length;
  $("cnt").textContent=size;
  $("lab_cnt").textContent=T().cnt+" "+T().cntSur+" "+aire;
  $("dims").textContent=m+" × "+n;
  $("aire").textContent=aire;
  $("pg").textContent=g;
  $("form").textContent=aire+" / "+g+" = "+(aire/g);
  $("note").textContent=g===1?T().notePrem:T().noteDiv(aire,g);
}
function renderD(){
  var g=gcd(m,n),l=m*n/g;
  if(k>l)k=l;
  var gf=geoF(),cf=gf[0],fox=gf[1],ftop=gf[2];
  var pts=calc(),s='',i,cx,cy;
  function fp(x,y){return (fox+x*cf).toFixed(1)+','+(ftop+(n-y)*cf).toFixed(1)}
  for(i=0;i<k;i++){cx=foldC(i,m);cy=foldC(i,n);
    s+='<rect x="'+(fox+cx*cf)+'" y="'+(ftop+(n-1-cy)*cf)+'" width="'+cf+'" height="'+cf+'" fill="'+ACCL+'"/>';}
  if(k<l){cx=foldC(k,m);cy=foldC(k,n);
    s+='<rect x="'+(fox+cx*cf)+'" y="'+(ftop+(n-1-cy)*cf)+'" width="'+cf+'" height="'+cf+'" fill="'+ACC+'"/>';}
  var d='';for(i=0;i<=m;i++)d+='M'+(fox+i*cf)+' '+ftop+'V'+(ftop+n*cf);
  for(var j=0;j<=n;j++)d+='M'+fox+' '+(ftop+j*cf)+'H'+(fox+m*cf);
  s+='<path d="'+d+'" fill="none" stroke="'+BORD+'" stroke-width="1"/>';
  s+='<rect x="'+fox+'" y="'+ftop+'" width="'+(m*cf)+'" height="'+(n*cf)+'" fill="none" stroke="'+ENCRE+'" stroke-width="1.5"/>';
  s+='<polyline points="'+pts.map(fp).join(' ')+'" fill="none" stroke="'+ACC+'" stroke-width="1.6" opacity="0.35" stroke-linecap="round" stroke-linejoin="round"/>';
  var ddx=foldP(k,m),ddy=foldP(k,n);
  s+='<circle cx="'+(fox+ddx*cf)+'" cy="'+(ftop+(n-ddy)*cf)+'" r="4" fill="'+ACC+'"/>';
  s+='<text x="'+(fox-10)+'" y="'+(ftop+n*cf+16)+'" text-anchor="end" font-size="11" fill="'+GRIS+'">A</text>';
  s+='<text x="'+(fox+m*cf+10)+'" y="'+(ftop+n*cf+16)+'" font-size="11" fill="'+GRIS+'">B</text>';
  s+='<text x="'+(fox+m*cf+10)+'" y="'+(ftop+12)+'" font-size="11" fill="'+GRIS+'">C</text>';
  s+='<text x="'+(fox-10)+'" y="'+(ftop+12)+'" text-anchor="end" font-size="11" fill="'+GRIS+'">D</text>';
  s+='<text x="'+(fox+m*cf/2)+'" y="'+(ftop+n*cf+32)+'" text-anchor="middle" font-size="13" fill="'+GRIS+'">m = '+m+'</text>';
  s+='<text transform="translate('+(fox-28)+' '+(ftop+n*cf/2)+') rotate(-90)" text-anchor="middle" font-size="13" fill="'+GRIS+'">n = '+n+'</text>';
  var hit='rgba(0,0,0,0)';
  s+='<circle class="hdl" data-h="y" cx="'+(fox+m*cf/2)+'" cy="'+ftop+'" r="7" fill="'+ENCRE+'" stroke="#ffffff" stroke-width="2" style="cursor:ns-resize"/>';
  s+='<circle data-h="y" cx="'+(fox+m*cf/2)+'" cy="'+ftop+'" r="18" fill="'+hit+'" style="cursor:ns-resize"/>';
  s+='<circle class="hdl" data-h="x" cx="'+(fox+m*cf)+'" cy="'+(ftop+n*cf/2)+'" r="7" fill="'+ENCRE+'" stroke="#ffffff" stroke-width="2" style="cursor:ew-resize"/>';
  s+='<circle data-h="x" cx="'+(fox+m*cf)+'" cy="'+(ftop+n*cf/2)+'" r="18" fill="'+hit+'" style="cursor:ew-resize"/>';
  s+='<circle class="hdl" data-h="c" cx="'+(fox+m*cf)+'" cy="'+ftop+'" r="9.5" fill="'+ENCRE+'" stroke="#ffffff" stroke-width="2" style="cursor:nwse-resize"/>';
  s+='<circle data-h="c" cx="'+(fox+m*cf)+'" cy="'+ftop+'" r="20" fill="'+hit+'" style="cursor:nwse-resize"/>';
  F.innerHTML=s;
  var u='';
  if(l<=LIM){
    var uc=Math.max(4,Math.min(24,Math.floor(Math.min((UW-16)/l,(UH-16)/l))));
    var uox=(UW-l*uc)/2,uoy=(UH-l*uc)/2,cc,rr;
    for(cc=0;cc<l/m;cc++)for(rr=0;rr<l/n;rr++){
      u+='<rect x="'+(uox+cc*m*uc)+'" y="'+(uoy+rr*n*uc)+'" width="'+(m*uc)+'" height="'+(n*uc)+'" fill="'+(((cc+rr)%2===0)?CARD:BGC)+'" stroke="'+BORD+'" stroke-width="0.8" stroke-dasharray="4 3"/>';
    }
    var dd='';for(i=0;i<=l;i++){dd+='M'+(uox+i*uc)+' '+uoy+'V'+(uoy+l*uc);dd+='M'+uox+' '+(uoy+i*uc)+'H'+(uox+l*uc);}
    u+='<path d="'+dd+'" fill="none" stroke="'+BORD+'" stroke-width="0.6"/>';
    u+='<rect x="'+uox+'" y="'+uoy+'" width="'+(l*uc)+'" height="'+(l*uc)+'" fill="none" stroke="'+ENCRE+'" stroke-width="1.6"/>';
    for(i=0;i<k;i++){u+='<rect x="'+(uox+i*uc)+'" y="'+(uoy+i*uc)+'" width="'+uc+'" height="'+uc+'" fill="'+ACCL+'"/>';}
    if(k<l){u+='<rect x="'+(uox+k*uc)+'" y="'+(uoy+k*uc)+'" width="'+uc+'" height="'+uc+'" fill="'+ACC+'"/>';}
    u+='<line x1="'+uox+'" y1="'+uoy+'" x2="'+(uox+k*uc)+'" y2="'+(uoy+k*uc)+'" stroke="'+ACC+'" stroke-width="2.2" stroke-linecap="round"/>';
    u+='<circle cx="'+(uox+k*uc)+'" cy="'+(uoy+k*uc)+'" r="3.5" fill="'+ACC+'"/>';
    u+='<circle cx="'+(uox+l*uc)+'" cy="'+(uoy+l*uc)+'" r="3.2" fill="none" stroke="'+ENCRE+'" stroke-width="1.4"/>';
  } else {
    u+='<text x="'+(UW/2)+'" y="'+(UH/2-6)+'" text-anchor="middle" font-size="14" fill="'+GRIS+'">'+T().tooBig(m,n,l)+'</text>';
    u+='<text x="'+(UW/2)+'" y="'+(UH/2+18)+'" text-anchor="middle" font-size="12" fill="'+GRIS+'">'+T().tooBig2+'</text>';
  }
  U.innerHTML=u;
  SL.max=l;SL.value=k;
  KL.textContent=T().etape(k,l);
  ST.innerHTML=T().statsD(m,n,g,l);
}
function render(){if(tab==="b")renderB();else renderD();}
function stop(){if(timer){clearInterval(timer);timer=null;PL.textContent=T().play;}}
function setTab(t){
  tab=t;stop();
  $("tabB").setAttribute("aria-pressed",t==="b"?"true":"false");
  $("tabD").setAttribute("aria-pressed",t==="d"?"true":"false");
  $("viewB").hidden=(t!=="b");
  $("viewD").hidden=(t!=="d");
  $("instruction").textContent=t==="b"?T().instrB:T().instrD;
  render();
}
$("tabB").onclick=function(){setTab("b");};
$("tabD").onclick=function(){setTab("d");};
PL.addEventListener('click',function(){
  if(timer){stop();return;}
  var l=m*n/gcd(m,n);
  if(k>=l)k=0;
  if(window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches){k=l;renderD();return;}
  PL.textContent=T().pause;
  timer=setInterval(function(){
    var ll=m*n/gcd(m,n);
    k++;
    if(k>=ll){k=ll;renderD();stop();return;}
    renderD();
  },140);
});
$("rst").addEventListener('click',function(){k=0;stop();renderD();});
SL.addEventListener('input',function(){stop();k=+SL.value;renderD();});
function changeDim(){k=0;stop();render();}
svgB.addEventListener('pointerdown',function(e){
  var h=e.target&&e.target.dataset?e.target.dataset.h:null;
  if(!h)return;drag=h;
  try{svgB.setPointerCapture(e.pointerId)}catch(err){}
  e.preventDefault();
});
svgB.addEventListener('pointermove',function(e){
  if(!drag)return;
  var gb=geoB(),CELL=gb[0],OX=gb[1],OYB=gb[2];
  var r=svgB.getBoundingClientRect();
  var ppx=(e.clientX-r.left)/r.width*WB;
  var ppy=(e.clientY-r.top)/r.height*HB;
  if(drag==='c'||drag==='x')m=Math.min(MAX,Math.max(1,Math.round((ppx-OX)/CELL)));
  if(drag==='c'||drag==='y')n=Math.min(MAX,Math.max(1,Math.round((OYB-ppy)/CELL)));
  changeDim();
});
F.addEventListener('pointerdown',function(e){
  var h=e.target&&e.target.dataset?e.target.dataset.h:null;
  if(!h)return;drag=h;
  try{F.setPointerCapture(e.pointerId)}catch(err){}
  e.preventDefault();
});
F.addEventListener('pointermove',function(e){
  if(!drag)return;
  var gf=geoF(),cf=gf[0],fox=gf[1],ftop=gf[2];
  var r=F.getBoundingClientRect();
  var ppx=(e.clientX-r.left)/r.width*FW;
  var ppy=(e.clientY-r.top)/r.height*FH;
  if(drag==='c'||drag==='x')m=Math.min(MAX,Math.max(1,Math.round((ppx-fox)/cf)));
  if(drag==='c'||drag==='y')n=Math.min(MAX,Math.max(1,Math.round((ftop+n*cf-ppy)/cf)));
  changeDim();
});
function end(){drag=null}
svgB.addEventListener('pointerup',end);svgB.addEventListener('pointercancel',end);
F.addEventListener('pointerup',end);F.addEventListener('pointercancel',end);
function isFs(){return !!(document.fullscreenElement||document.webkitFullscreenElement);}
function syncFsLabel(){$("fsLabel").textContent=isFs()?T().fsExit:T().fs;}
$("fsBtn").onclick=()=>{
  const el=document.documentElement;
  if(isFs()){(document.exitFullscreen||document.webkitExitFullscreen).call(document);}
  else{
    const req=el.requestFullscreen||el.webkitRequestFullscreen;
    if(req){const r=req.call(el);if(r&&r.catch)r.catch(()=>{});}
  }
};
document.addEventListener("fullscreenchange",syncFsLabel);
document.addEventListener("webkitfullscreenchange",syncFsLabel);
function applyLang(){
  var t=T();
  document.documentElement.lang=lang;
  $("kicker").textContent=t.kicker;
  $("title").textContent=t.title;
  document.title=t.docTitle;
  $("langBtn").textContent=lang==="fr"?"English":"Français";
  syncFsLabel();
  $("tabB").textContent=t.tabB;
  $("tabD").textContent=t.tabD;
  $("instruction").textContent=tab==="b"?t.instrB:t.instrD;
  svgB.setAttribute("aria-label",t.ariaB);
  $("lab_dims").textContent=t.dims;
  $("lab_aire").textContent=t.aire;
  $("lab_pg").textContent=t.pg;
  $("lab_form").textContent=t.form;
  $("aide").textContent=t.aideB;
  $("cap1").textContent=t.cap1;
  $("cap2").textContent=t.cap2;
  PL.textContent=timer?t.pause:t.play;
  $("rst").textContent=t.rst;
  $("proof").innerHTML=t.proof;
  $("backLink").textContent=t.backList;
  render();
}
$("langBtn").onclick=()=>{
  lang=lang==="fr"?"en":"fr";
  try{
    localStorage.setItem("fj-lang",lang);
    document.cookie="fj-lang="+lang+";domain=.fredericjaccard.com;path=/;max-age=31536000;SameSite=Lax";
  }catch(e){}
  applyLang();
};
applyLang();
})();
</script>
